/* ================= PANEL: HOY ================= */
(function(){
  var P=document.getElementById('p-hoy');
  var modo=null,serie=[],si=0,respondida=false;
  function reg(){return load('reactivos',{})}
  function kq(q){return q.b+'#'+q.q.slice(0,36)}

  function debilesTemas(){
    var R=reg(),agg={};
    Q.forEach(function(q){
      var x=R[kq(q)];if(!x||!x.n)return;
      var k=q.b+'|'+temaDe(q);
      if(!agg[k])agg[k]={n:0,ok:0};
      agg[k].n+=x.n;agg[k].ok+=x.ok;
    });
    return Object.keys(agg).map(function(k){return {mod:k.split('|')[0],tema:k.split('|')[1],pct:100*agg[k].ok/agg[k].n,n:agg[k].n}})
      .filter(function(a){return a.pct<80}).sort(function(a,b){return a.pct-b.pct});
  }
  function delDia(n){
    var R=reg(),h=hoyISO(),s=semilla(h);
    var falladas=[],nuevas=[],resto=[];
    Q.forEach(function(q,i){
      var x=R[kq(q)];
      if(x&&x.n&&x.ok===0)falladas.push(i);
      else if(!x||!x.n)nuevas.push(i);
      else resto.push(i);
    });
    function tomar(arr,k){
      var out=[],copia=arr.slice();
      for(var j=0;j<k&&copia.length;j++){
        var p=(s+j*7919)%copia.length;
        out.push(copia.splice(p,1)[0]);
      }
      return out;
    }
    var sel=tomar(falladas,Math.min(2,n));
    if(sel.length<n)sel=sel.concat(tomar(nuevas,n-sel.length));
    if(sel.length<n)sel=sel.concat(tomar(resto,n-sel.length));
    return sel;
  }

  function pintar(){
    P.innerHTML='';
    if(modo){pintarSerie();return}
    var ds=load('dias',[]),racha=rachaActual();
    var hecho=ds.indexOf(hoyISO())>=0;

    var c1=el('div','hoycard');
    var fila=el('div','row');fila.style.justifyContent='space-between';fila.style.alignItems='flex-end';
    var izq=el('div');
    izq.innerHTML='<div class="mid" style="font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.08em">TU RACHA</div>'+
      '<div class="bignum">'+racha+'</div>'+
      '<div class="muted" style="margin-top:2px">'+(racha===1?'día seguido':'días seguidos')+
      (hecho?' · ya practicaste hoy':' · aún no practicas hoy')+'</div>';
    fila.appendChild(izq);
    var tot=el('div');tot.style.textAlign='right';
    tot.innerHTML='<div class="muted">'+ds.length+' días de práctica en total</div>';
    fila.appendChild(tot);
    c1.appendChild(fila);
    var sem=el('div','streak');
    var hoy=new Date();
    var nom=['L','M','M','J','V','S','D'];
    var lunes=new Date(hoy);
    var dow=(hoy.getDay()+6)%7;
    lunes.setDate(hoy.getDate()-dow);
    for(var i=0;i<7;i++){
      var d=new Date(lunes);d.setDate(lunes.getDate()+i);
      var iso=hoyISO(d),on=ds.indexOf(iso)>=0,esHoy=iso===hoyISO();
      var sd=el('div','sday'+(on?' on':'')+(esHoy?' hoy':''));
      sd.innerHTML='<div class="dot">'+(on?'✓':'')+'</div><small>'+nom[i]+'</small>';
      sem.appendChild(sd);
    }
    c1.appendChild(sem);
    c1.appendChild(el('p','muted','La racha se marca sola cuando respondes al menos un reactivo. La constancia diaria rinde más que las maratones de fin de semana: es práctica espaciada, que es de las pocas técnicas con respaldo sólido.'));
    P.appendChild(c1);

    var c2=el('div','card');
    c2.appendChild(el('h2',null,'Los 3 reactivos de hoy'));
    var d3=delDia(3);
    var R=reg();
    var nFall=d3.filter(function(i){var x=R[kq(Q[i])];return x&&x.n&&x.ok===0}).length;
    c2.appendChild(el('p',null,'Se eligen automáticamente cada día priorizando lo que fallaste y lo que aún no has visto. '+
      (nFall?'Hoy incluyen <b>'+nFall+'</b> que ya fallaste antes.':'Hoy son todos reactivos nuevos para ti.')));
    var lista=el('div');lista.style.margin='12px 0';
    d3.forEach(function(i,k){
      var q=Q[i];
      var d=el('div','debil');
      d.innerHTML='<span><b>'+(k+1)+'.</b> '+q.b+' · '+esc(temaDe(q))+'</span><span class="counter">'+(esNumerico(q)?'numérico':'conceptual')+'</span>';
      lista.appendChild(d);
    });
    c2.appendChild(lista);
    var b1=el('button','btn','Empezar los 3 de hoy');
    b1.onclick=function(){modo='dia';serie=d3;si=0;pintar();window.scrollTo(0,0)};
    c2.appendChild(b1);
    P.appendChild(c2);

    var c3=el('div','card');
    c3.appendChild(el('h2',null,'Sesión corta de 10 minutos'));
    var deb=debilesTemas();
    if(!deb.length){
      c3.appendChild(el('p','muted','Necesitas responder algunos reactivos primero para que la app sepa dónde estás flojo. Empieza por los 3 de hoy o por el banco.'));
    }else{
      var t=deb[0];
      c3.appendChild(el('p',null,'Tu tema más débil ahora mismo es <b>'+t.mod+' · '+esc(t.tema)+'</b>, con '+Math.round(t.pct)+' % de acierto en '+t.n+' intentos. Una sesión corta enfocada ahí rinde más que media hora dispersa.'));
      var acc=el('div','row');
      var b2=el('button','btn','Practicar ese tema');
      b2.onclick=function(){if(RENDER.bancoFiltro)RENDER.bancoFiltro(t.mod,t.tema);irA('quiz')};
      var b3=el('button','btn ghost','Flashcards de '+t.mod);
      b3.onclick=function(){irA('flash')};
      var b4=el('button','btn ghost','Ver la clase del tema');
      b4.onclick=function(){irA('modulos')};
      acc.appendChild(b2);acc.appendChild(b3);acc.appendChild(b4);
      c3.appendChild(acc);
      if(deb.length>1){
        c3.appendChild(el('h3',null,'Después de ese, tus siguientes prioridades'));
        deb.slice(1,4).forEach(function(a){
          var d=el('div','debil');
          d.innerHTML='<span>'+a.mod+' · '+esc(a.tema)+'</span><span class="counter">'+Math.round(a.pct)+' % en '+a.n+' intentos</span>';
          c3.appendChild(d);
        });
      }
    }
    P.appendChild(c3);
  }

  function pintarSerie(){
    var back=el('button','btn ghost','← Volver a Hoy');
    back.style.marginBottom='12px';
    back.onclick=function(){modo=null;pintar();window.scrollTo(0,0)};
    P.appendChild(back);
    if(si>=serie.length){
      var c=el('div','hoycard');
      c.appendChild(el('h2',null,'Listo por hoy'));
      c.appendChild(el('p',null,'Completaste los reactivos del día y tu racha quedó marcada. Si quieres seguir, el banco te deja filtrar por tema y por lo que has fallado.'));
      var r=el('div','row');
      var b=el('button','btn','Ir al banco de reactivos');b.onclick=function(){irA('quiz')};
      var b2=el('button','btn ghost','Volver a Hoy');b2.onclick=function(){modo=null;pintar()};
      r.appendChild(b);r.appendChild(b2);
      c.appendChild(r);
      P.appendChild(c);
      return;
    }
    var q=Q[serie[si]],g=guiaDe(q),R=reg(),k=kq(q);
    var x=R[k]||(R[k]={n:0,ok:0,t:0,mk:0});
    var t0=Date.now();
    respondida=false;
    var c=el('div','card');
    var hd=el('div','qhead');
    var tg=el('div','qtags');
    tg.appendChild(el('span','tag',q.b));
    tg.appendChild(el('span','tag tema',esc(temaDe(q))));
    if(x.n)tg.appendChild(el('span','tag hist',x.ok+'/'+x.n+' aciertos'));
    hd.appendChild(tg);
    hd.appendChild(el('span','counter','Reactivo '+(si+1)+' de '+serie.length));
    c.appendChild(hd);
    c.appendChild(el('div','q',esc(q.q)));
    var box=el('div');
    q.o.forEach(function(op,i){
      var b=el('button','opt','<b>'+String.fromCharCode(97+i)+')</b> &nbsp;'+esc(op));
      b.onclick=function(){
        if(respondida)return;respondida=true;
        var seg=Math.round((Date.now()-t0)/1000),ok=(i===q.r);
        x.n++;x.t+=Math.min(seg,300);if(ok)x.ok++;
        save('reactivos',R);registrarDia();
        Array.prototype.forEach.call(box.children,function(bb,j){
          bb.disabled=true;
          if(j===q.r)bb.className='opt ok';else if(j===i)bb.className='opt no';
        });
        c.appendChild(el('div','exp','<b>'+(ok?'Correcto. ':'Incorrecto. La respuesta es '+String.fromCharCode(97+q.r)+'. ')+'</b>'+esc(q.e)));
        if(g){
          var db=el('div','disbox');db.style.marginTop='12px';
          g.d.forEach(function(txt,j){
            var row=el('div','disrow'+(j===q.r?' ok':(j===i&&!ok?' tuya':'')));
            row.innerHTML='<span class="dl">'+String.fromCharCode(97+j)+')</span><span>'+esc(txt)+'</span>';
            db.appendChild(row);
          });
          c.appendChild(db);
        }
        var nx=el('button','btn',si===serie.length-1?'Terminar':'Siguiente →');
        nx.style.marginTop='14px';
        nx.onclick=function(){si++;P.innerHTML='';pintarSerie();window.scrollTo(0,0)};
        c.appendChild(nx);
      };
      box.appendChild(b);
    });
    c.appendChild(box);
    P.appendChild(c);
  }

  RENDER.hoy=pintar;
  pintar();
})();
