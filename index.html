{tag:'M2',q:'Se te pide identificar un contaminante orgánico desconocido presente a nivel de trazas en una muestra ambiental compleja. ¿Qué acoplamiento instrumental eliges?',opts:['Absorción atómica','Titulación potenciométrica','GC acoplado a masas','HPLC con detector UV'],correct:2,exp:'La separación cromatográfica aísla el compuesto de la matriz y el espectrómetro de masas entrega el patrón de fragmentación, que permite identificarlo contra una biblioteca. Un detector UV solo da absorbancia a una longitud de onda, lo que no identifica. La absorción atómica mide metales, no orgánicos.'},
{tag:'M2',q:'Preparas una disolución de NaCl al 0.90 % en masa para uso biológico y necesitas expresarla en molaridad. La densidad es 1.005 g/mL y la masa molar 58.44 g/mol.',opts:['0.900 M','0.015 M','0.154 M','0.090 M'],correct:2,exp:'En un litro hay 1005 g de disolución, de los cuales el 0.90 % son 9.045 g de NaCl. n = 9.045/58.44 = 0.1548 mol, en un litro: 0.155 M. Es la concentración de la solución salina fisiológica, que vale la pena reconocer.'},
{tag:'M2',q:'Al analizar por absorción atómica una muestra con alto contenido de fosfato, la señal de calcio sale sistemáticamente baja frente a los estándares puros. ¿Qué ocurre?',opts:['Error de pesada','El equipo descalibró','Sobrepasó el rango lineal','Interferencia química'],correct:3,exp:'El fosfato forma con el calcio compuestos refractarios que no se atomizan por completo en la llama, de modo que llegan menos átomos libres al camino óptico y la señal cae. Se corrige añadiendo lantano o estroncio como agente liberador, que secuestra el fosfato preferentemente.'},
{tag:'M2',q:'Un método analítico se declara específico para un analito, pero al correr una muestra con un compuesto estructuralmente parecido se obtiene señal apreciable. ¿Qué falló?',opts:['La precisión','La selectividad','La linealidad','La exactitud'],correct:1,exp:'La selectividad es la capacidad de responder al analito sin que otras especies contribuyan a la señal. Exactitud y precisión describen el acuerdo con el valor verdadero y la dispersión, y la linealidad la proporcionalidad señal-concentración: ninguna de las tres cubre este fallo.'},
{tag:'M2',q:'Haces una dilución tomando 1.00 mL con micropipeta y llevándolo a 25.00 mL, y repites esa operación en serie tres veces consecutivas. ¿Cuál es el factor de dilución total?',opts:['3125','15 625','25','75'],correct:1,exp:'Cada etapa diluye por 25, y las etapas se multiplican: 25³ = 15 625. Sumar los factores da 75, que es el distractor previsto. La dilución en serie es la forma práctica de alcanzar factores grandes con material volumétrico de precisión razonable.'},
{tag:'M2',q:'Una titulación conductimétrica de ácido clorhídrico con hidróxido de sodio muestra un mínimo marcado de conductividad. ¿Qué representa ese punto en la valoración?',opts:['El inicio del viraje','La saturación del electrodo','Un error de medida','El punto de equivalencia'],correct:3,exp:'Antes de la equivalencia los protones, muy conductores, se sustituyen por sodio, mucho menos conductor, así que la conductividad baja. Después empiezan a acumularse hidroxilos libres, también muy conductores, y vuelve a subir. El mínimo marca el agotamiento del ácido.'},
{tag:'M2',q:'Debes cuantificar la humedad residual de un polvo farmacéutico al nivel de partes por millón, sin que interfiera la descomposición térmica del principio activo. ¿Qué técnica usas?',opts:['Termogravimetría en aire','Refractometría de Abbe','Secado en estufa a 105 °C','Titulación de Karl Fischer'],correct:3,exp:'Karl Fischer es específica para agua mediante una reacción química estequiométrica con yodo, llega a partes por millón y no exige calentar la muestra. El secado y la termogravimetría miden pérdida de masa total, que incluye disolventes residuales y productos de descomposición.'},
{tag:'M2',q:'En un análisis por duplicado obtienes 24.8 y 25.6 mg/L, y el criterio interno exige una diferencia relativa menor al 2 % entre réplicas. ¿Se acepta el resultado?',opts:['Falta una tercera réplica','El criterio no aplica','Sí, cumple el criterio','No, excede el criterio'],correct:3,exp:'La diferencia es 0.8 sobre una media de 25.2, es decir 3.2 %, por encima del 2 % permitido. Corresponde investigar la causa y repetir, no promediar y seguir. Los criterios de aceptación existen para detener el análisis antes de que el dato llegue al informe.'},
{tag:'M2',q:'Quieres conocer la distribución de tamaño de poro y el área superficial específica de un catalizador sólido poroso recién sintetizado. ¿Qué técnica te lo entrega?',opts:['Difracción de rayos X','Absorción atómica','Cromatografía iónica','Fisisorción de nitrógeno'],correct:3,exp:'La isoterma de adsorción y desorción de nitrógeno a 77 K, tratada por BET para el área y por BJH para la distribución de poros, es el método estándar. La difracción da estructura cristalina y las otras dos dan composición, no textura.'},
{tag:'M2',q:'Un blanco de reactivos da señal apreciable y creciente a lo largo de la jornada, mientras que los estándares mantienen su señal estable. ¿Cuál es la causa más probable?',opts:['Contaminación progresiva','Deriva del detector','Error de dilución','Degradación del analito'],correct:0,exp:'Si los estándares no derivan, el detector está estable: lo que cambia es el blanco. Un blanco que crece apunta a contaminación acumulándose en el sistema, por arrastre entre inyecciones, por material de vidrio o por el agua de dilución. El diagnóstico sale de comparar qué cambia y qué no.'},
{tag:'M2',q:'Reportas el resultado de multiplicar 2.5 cm por 3.42 cm por 1.008 cm en un cálculo de volumen a partir de medidas con instrumentos distintos. ¿Cómo lo expresas?',opts:['8.6184 cm³','8.6 cm³','8.62 cm³','8.618 cm³'],correct:1,exp:'En multiplicación y división manda el factor con menos cifras significativas, y 2.5 tiene dos. El producto es 8.6184, que se reporta como 8.6 cm³. En sumas y restas el criterio sería distinto: ahí manda el menor número de decimales.'},
{tag:'M2',q:'Necesitas separar y cuantificar aniones inorgánicos como cloruro, nitrato y sulfato en una muestra de agua potable, en una sola corrida. ¿Qué técnica eliges?',opts:['Cromatografía iónica','Absorción atómica','Espectroscopía infrarroja','Polarografía clásica'],correct:0,exp:'La cromatografía iónica usa una fase estacionaria de intercambio y un detector de conductividad con supresión, y es el método normalizado para aniones en aguas. La absorción atómica mide metales, el infrarrojo necesita enlaces covalentes con momento dipolar cambiante y no resuelve iones en disolución.'},
{tag:'M2',q:'Tu electrodo de pH tarda varios minutos en estabilizarse y la pendiente de calibración bajó de 59 a 48 mV por década en los últimos meses. ¿Qué indica ese comportamiento?',opts:['Falta agitación','El buffer caducó','El electrodo se agotó','La muestra está fría'],correct:2,exp:'Una pendiente notablemente menor que la nernstiana, junto con respuesta lenta, es la firma de una membrana de vidrio deshidratada, sucia o envejecida. Un buffer caducado desplazaría la lectura pero no degradaría la pendiente de forma progresiva, y la temperatura cambia la pendiente de modo predecible y reversible.'},
{tag:'M2',q:'Analizas el contenido de hierro de un suplemento y obtienes 18.4 mg por tableta frente a los 18.0 mg declarados, con una incertidumbre de 0.2 mg. ¿Qué reportas?',opts:['Excede lo declarado','No conforme por defecto','Resultado no concluyente','Conforme a lo declarado'],correct:3,exp:'El intervalo 18.4 ± 0.2 va de 18.2 a 18.6, por encima del valor nominal, pero las especificaciones farmacéuticas admiten tolerancias típicas de ±5 %, es decir de 17.1 a 18.9. El resultado cae dentro y es conforme. Comparar contra el valor nominal sin su tolerancia es el error de interpretación.'}
);
</script>
<script>
/* ---------------- M3 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M3',q:'Un compuesto de fórmula molecular C₆H₁₀O presenta en su espectro infrarrojo una banda intensa a 1715 cm⁻¹ y ninguna banda ancha por encima de 3200 cm⁻¹. ¿Qué estructura es compatible?',opts:['Una cetona cíclica','Un ácido carboxílico','Un alcohol insaturado','Un éter aromático'],correct:0,exp:'Grados de insaturación: (2×6 + 2 − 10)/2 = 2. El carbonilo a 1715 consume uno y el otro debe ser un anillo. La ausencia de banda ancha de OH descarta ácido y alcohol. La ciclohexanona encaja exactamente.'},
{tag:'M3',q:'Comparas la velocidad de solvólisis en agua de un halogenuro primario, uno secundario y uno terciario, todos con el mismo grupo saliente. ¿Qué orden de reactividad esperas?',opts:['Los tres por igual','Secundario > primario > terciario','Terciario > secundario > primario','Primario > secundario > terciario'],correct:2,exp:'La solvólisis en un disolvente prótico sin nucleófilo fuerte transcurre por SN1, cuya etapa lenta es la formación del carbocatión. La estabilidad del catión crece con la sustitución por hiperconjugación y efecto inductivo, de modo que el orden es el inverso al de SN2.'},
{tag:'M3',q:'Una enzima tiene K_m de 50 µM y V_max de 100 µM/min. ¿Qué velocidad de reacción esperas a una concentración de sustrato de 150 µM, en condiciones iniciales?',opts:['25 µM/min','75 µM/min','50 µM/min','100 µM/min'],correct:1,exp:'v = V_max·[S]/(K_m + [S]) = 100 × 150/(50 + 150) = 15 000/200 = 75 µM/min. Conviene recordar el ancla: cuando [S] = K_m la velocidad es exactamente la mitad de V_max, y a partir de ahí se estima el resto.'},
{tag:'M3',q:'Debes confirmar la estructura completa de un compuesto orgánico recién sintetizado, incluida la posición exacta de sus sustituyentes en la cadena. ¿Qué técnica es la principal?',opts:['Espectroscopía infrarroja','Difracción de rayos X de polvos','Absorción atómica','Resonancia magnética nuclear'],correct:3,exp:'La RMN entrega tres lecturas complementarias: el desplazamiento químico indica el entorno electrónico de cada núcleo, la multiplicidad cuenta los vecinos y la integración cuenta los núcleos equivalentes. El infrarrojo identifica grupos funcionales pero no su posición en el esqueleto.'},
{tag:'M3',q:'Un polímero muestra en DSC un escalón a −60 °C y un pico endotérmico bien definido a 165 °C, sin pérdida de masa en TGA hasta 380 °C. ¿Qué material es?',opts:['Un termofijo','Un elastómero puro','Semicristalino','Totalmente amorfo'],correct:2,exp:'El escalón es la transición vítrea de la fase amorfa y el pico endotérmico es la fusión de la fase cristalina. La coexistencia de ambas señales define un material semicristalino, con Tg por debajo de la temperatura ambiente y Tm muy por encima: el perfil del polipropileno.'},
{tag:'M3',q:'Tienes un alcohol secundario y quieres oxidarlo a cetona sin que la reacción siga hasta ácido carboxílico ni afecte un doble enlace presente en la molécula. ¿Qué reactivo usas?',opts:['Permanganato en caliente','Dicromato en medio ácido','Ácido nítrico concentrado','Clorocromato de piridinio'],correct:3,exp:'El PCC es un oxidante suave en medio anhidro que se detiene en el carbonilo y respeta los dobles enlaces. Los oxidantes fuertes en medio acuoso ácido o caliente llevan los alcoholes primarios hasta ácido y pueden romper el alqueno por oxidación.'},
{tag:'M3',q:'El cloruro de terc-butilo se solvoliza en agua y la velocidad resulta independiente de la concentración de nucleófilo añadido, por mucho que esta se aumente. ¿Qué indica?',opts:['Adición electrofílica','Mecanismo SN1 unimolecular','Mecanismo SN2 bimolecular','Eliminación E2 concertada'],correct:1,exp:'La etapa determinante de SN1 es la ionización del sustrato, en la que el nucleófilo no participa: la ley de velocidad es de primer orden y solo depende del halogenuro. En SN2 el nucleófilo entra en el estado de transición y la velocidad sí depende de su concentración.'},
{tag:'M3',q:'Una proteína precipita al llevar el pH de la disolución exactamente a 5.2, y se redisuelve al alejarse de ese valor en cualquiera de las dos direcciones. ¿Qué representa 5.2?',opts:['Su pH óptimo de actividad','Su punto isoeléctrico','Su pK_a catalítico','Su pH de desnaturalización'],correct:1,exp:'En el punto isoeléctrico la carga neta de la proteína es cero, así que desaparece la repulsión electrostática entre moléculas y la solubilidad cae al mínimo. Alejarse del pI en cualquier dirección devuelve carga neta y con ella repulsión y solubilidad.'},
{tag:'M3',q:'Debes determinar la masa molecular exacta y la fórmula elemental de un péptido desconocido obtenido de un extracto biológico. ¿Qué técnica entrega esa información?',opts:['Masas de alta resolución','Espectroscopía infrarroja','Cromatografía en capa fina','Polarimetría de sodio'],correct:0,exp:'La masa exacta medida con resolución suficiente distingue combinaciones elementales con la misma masa nominal, porque los defectos de masa de carbono, nitrógeno y oxígeno difieren. La fragmentación en tándem entrega además la secuencia.'},
{tag:'M3',q:'Comparas la temperatura de transición vítrea del poliestireno con la del poliestireno al que se añadió un plastificante de bajo peso molecular. ¿Qué esperas observar?',opts:['La Tg baja con plastificante','La Tg sube con plastificante','La Tg no cambia','Desaparece la Tg'],correct:0,exp:'El plastificante se intercala entre las cadenas, aumenta el volumen libre y reduce las interacciones entre ellas, de modo que el movimiento segmental se activa a menor temperatura. Es exactamente la razón de que el PVC rígido y el flexible sean el mismo polímero con distinta formulación.'},
{tag:'M3',q:'Una reacción de adición a un alqueno produce de forma exclusiva el producto en que los dos sustituyentes nuevos quedan del mismo lado del antiguo doble enlace. ¿Cómo se describe?',opts:['Adición anti estereoselectiva','Reacción no estereoselectiva','Inversión de configuración','Adición sin estereoselectiva'],correct:3,exp:'La adición sin coloca ambos grupos por la misma cara, como en la hidrogenación catalítica sobre metal o en la dihidroxilación con tetróxido de osmio. La adición anti los coloca en caras opuestas, como en la bromación vía ion bromonio.'},
{tag:'M3',q:'Un aminoácido con cadena lateral no ionizable tiene pK₁ de 2.3 y pK₂ de 9.7 para sus grupos carboxilo y amonio. ¿Cuál es su punto isoeléctrico aproximado?',opts:['12.0','6.0','2.3','9.7'],correct:1,exp:'Para un aminoácido sin cadena lateral ionizable, el pI es el promedio de los dos pK que flanquean la especie neutra: (2.3 + 9.7)/2 = 6.0. Si la cadena lateral fuera ionizable habría que promediar los dos pK que rodean al zwitterión correspondiente.'},
{tag:'M3',q:'Se quiere obtener un polímero de masa molecular muy alta mediante polimerización en cadena por radicales libres, y el producto sale de masa baja y amplia distribución. ¿Qué revisas?',opts:['La pureza del monómero solo','El volumen del reactor','El color del producto','La concentración de iniciador'],correct:3,exp:'En polimerización en cadena el grado de polimerización es inversamente proporcional a la raíz de la concentración de iniciador: más iniciador significa más cadenas creciendo y por tanto cadenas más cortas. También hay que revisar agentes de transferencia e impurezas que terminen cadenas prematuramente.'},
{tag:'M3',q:'Debes distinguir rápidamente, en el laboratorio y sin instrumentos, si un líquido desconocido es un alqueno o un alcano saturado de masa molecular similar. ¿Qué ensayo usas?',opts:['Medición de densidad','Punto de ebullición','Decoloración de bromo','Prueba de llama'],correct:2,exp:'El bromo en tetracloruro de carbono es rojizo y se decolora al adicionarse al doble enlace, lo que da una respuesta visual inmediata. El permanganato diluido hace lo mismo virando de violeta a marrón. Densidad y ebullición no discriminan insaturación de forma fiable.'},
{tag:'M3',q:'Un fármaco administrado por vía oral resulta inactivo, pero el mismo compuesto inyectado por vía intravenosa produce el efecto esperado en el modelo animal. ¿Qué explica la diferencia?',opts:['Mala solubilidad en agua','Baja afinidad por el receptor','Inestabilidad térmica','Metabolismo de primer paso'],correct:3,exp:'Lo absorbido en el intestino pasa primero por el hígado, donde las enzimas de fase I y II pueden inactivarlo antes de que llegue a la circulación sistémica. La vía intravenosa evita ese paso por completo. Que el efecto exista por vía parenteral descarta un problema de afinidad.'},
{tag:'M3',q:'Un polímero de condensación presenta una masa promedio en peso de 48 000 y una masa promedio en número de 24 000 g/mol, según cromatografía de exclusión por tamaño. ¿Qué polidispersidad tiene?',opts:['24 000','1.0','2.0','0.5'],correct:2,exp:'Đ = M_w/M_n = 48 000/24 000 = 2.0. Ese valor es precisamente el que predice la estadística de una policondensación ideal llevada a conversión alta. Un valor de 1.0 solo lo alcanzan las polimerizaciones vivientes bien controladas.'},
{tag:'M3',q:'Quieres separar dos enantiómeros de un fármaco quiral a escala preparativa, sin convertirlos químicamente en otros compuestos durante el proceso. ¿Qué método aplicas?',opts:['Extracción con hexano','Cromatografía con fase quiral','Destilación fraccionada','Cristalización por enfriamiento'],correct:1,exp:'Los enantiómeros tienen propiedades físicas idénticas en entorno aquiral, de modo que destilación, extracción y cristalización simple no los distinguen. Hace falta un entorno quiral: una fase estacionaria quiral, o formar diastereómeros con un agente resolvente y separarlos.'},
{tag:'M3',q:'Un ácido carboxílico con pK_a de 4.8 se encuentra disuelto en un medio tamponado a pH 7.4, que es el del plasma sanguíneo. ¿En qué forma predomina la molécula?',opts:['Como anhídrido cíclico','Como carboxilato ionizado','Como ácido neutro','Mitad y mitad de cada una'],correct:1,exp:'A pH 2.6 unidades por encima del pK_a, la razón base conjugada sobre ácido es 10^2.6 ≈ 400 a 1. Predomina abrumadoramente la forma ionizada, que es mucho más soluble en agua y mucho peor para atravesar membranas por difusión pasiva.'},
{tag:'M3',q:'Observas que una reacción enzimática deja de acelerarse al aumentar la temperatura por encima de 45 °C y de hecho pierde velocidad, pese a que la cinética predice lo contrario. ¿Por qué?',opts:['La ley de Arrhenius falla','La enzima se desnaturaliza','Se agotó el sustrato','Bajó el pH del medio'],correct:1,exp:'La velocidad de una reacción catalizada tiene dos términos opuestos con la temperatura: Arrhenius la acelera y la desnaturalización retira enzima activa. Por encima del óptimo domina el segundo y la actividad cae. La ley de Arrhenius sigue siendo válida para la reacción en sí.'},
{tag:'M3',q:'Debes cuantificar un azúcar reductor en una matriz alimentaria sin recurrir a instrumentación costosa, con un método colorimétrico clásico y bien establecido. ¿Cuál eliges?',opts:['Gravimetría con sulfato','Espectroscopía Raman','Ensayo con reactivo DNS','Titulación con EDTA'],correct:2,exp:'El ácido dinitrosalicílico se reduce por el grupo carbonilo libre del azúcar y vira a un color anaranjado que se cuantifica a 540 nm con un espectrofotómetro sencillo. El EDTA acompleja metales y la gravimetría de sulfato no tiene relación con azúcares.'},
{tag:'M3',q:'Comparas la estabilidad de un carbocatión primario, uno alílico y uno terciario formados en condiciones idénticas de reacción. ¿Cuál es el orden creciente de estabilidad?',opts:['Terciario < alílico < primario','Los tres son equivalentes','Primario < terciario < alílico','Alílico < primario < terciario'],correct:2,exp:'El alílico gana estabilidad por deslocalización del orbital p vacío sobre dos carbonos mediante resonancia, un efecto más poderoso que la hiperconjugación que estabiliza al terciario. El primario carece de ambos. El bencílico es todavía más estable por el mismo motivo.'},
{tag:'M3',q:'Un polímero biodegradable debe degradarse por hidrólisis en medio acuoso en cuestión de meses, sin necesidad de enzimas específicas para iniciar la ruptura. ¿Qué enlace conviene?',opts:['Enlace éster en la cadena','Enlace carbono-carbono saturado','Enlace éter de tipo aromático','Enlace amida de tipo aromático'],correct:0,exp:'El éster se hidroliza en agua a velocidad apreciable, sobre todo si hay catálisis ácida o básica, y es la base del ácido poliláctico y de la policaprolactona. Una cadena de enlaces carbono-carbono como la del polietileno es prácticamente inerte a la hidrólisis.'},
{tag:'M3',q:'Un lote de proteína recombinante pierde actividad al congelarlo y descongelarlo varias veces, aunque la electroforesis muestra la banda íntegra y del tamaño correcto. ¿Qué ocurrió?',opts:['Agregación y pérdida de plegamiento','Proteólisis de la cadena','Mutación de la secuencia','Oxidación total del extracto'],correct:0,exp:'Una banda íntegra descarta la ruptura de la cadena. Los ciclos de congelación concentran solutos y crean interfaces hielo-agua que desnaturalizan parcialmente la proteína, y las moléculas desplegadas se agregan de forma irreversible. Por eso se alicuotan los lotes y se añaden crioprotectores.'},
{tag:'M3',q:'Debes seguir en tiempo real el avance de una reacción orgánica en el laboratorio, con una técnica rápida, barata y que requiera apenas una gota de mezcla. ¿Cuál usas?',opts:['Resonancia magnética nuclear','Difracción de rayos X','Calorimetría diferencial','Cromatografía en capa fina'],correct:3,exp:'La capa fina da en minutos la desaparición del reactivo y la aparición del producto comparando contra testigos, con un costo despreciable. Las otras tres son más informativas pero exigen más muestra, más tiempo y equipo que no se usa para un seguimiento de rutina.'},
{tag:'M3',q:'La hidrólisis de un disacárido produce dos monosacáridos distintos y el proceso solo ocurre a velocidad apreciable en presencia de una enzima específica. ¿Qué enlace se rompió?',opts:['Enlace glucosídico','Enlace peptídico','Puente disulfuro','Enlace fosfodiéster'],correct:0,exp:'El enlace glucosídico es el acetal que une dos unidades de azúcar, y su hidrólisis es específica de configuración: la lactasa corta el enlace beta de la lactosa y no el alfa de la maltosa. El peptídico une aminoácidos y el fosfodiéster nucleótidos.'},
{tag:'M3',q:'Quieres predecir si una molécula pequeña atravesará la membrana celular por difusión pasiva o necesitará un transportador para entrar en la célula. ¿Qué propiedad revisas primero?',opts:['Su índice de refracción','Su color en disolución','Su lipofilia y su carga','Su punto de fusión'],correct:2,exp:'La bicapa lipídica favorece el paso de moléculas pequeñas, neutras y moderadamente lipófilas. Una especie cargada al pH del medio o muy hidrófila necesita transportador. Por eso el logP y el estado de ionización al pH fisiológico son los dos primeros datos que se miran.'},
{tag:'M3',q:'En el espectro de RMN de protón de un compuesto, una señal aparece como triplete con integración de dos protones y un desplazamiento de 3.6 ppm. ¿Qué información entrega?',opts:['Tres H sin ningún vecino cercano','Un H aromático totalmente aislado','Dos H de un ácido carboxílico','Dos H con dos vecinos, junto a O'],correct:3,exp:'La multiplicidad sigue la regla de n+1: un triplete indica dos protones vecinos equivalentes. La integración de dos cuenta los núcleos de la señal. Y 3.6 ppm es el desplazamiento característico de un metileno unido a oxígeno, desapantallado por su electronegatividad.'},
{tag:'M3',q:'Un copolímero formado por dos monómeros muestra en DSC dos transiciones vítreas bien separadas, en lugar de una sola transición intermedia entre ambas. ¿Qué arquitectura tiene?',opts:['Copolímero en bloque','Copolímero al azar','Copolímero alternante','Homopolímero puro'],correct:0,exp:'Dos Tg distintas indican dos fases separadas que relajan cada una por su cuenta, lo que ocurre cuando los bloques son lo bastante largos para segregarse. Un copolímero al azar o alternante da una sola Tg intermedia, que la regla de Fox predice a partir de las fracciones másicas.'}
);
</script>
<script>
/* ---------------- M4 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M4',q:'Un semiconductor tiene una brecha prohibida de 2.25 eV y se ilumina con luz blanca. ¿Cuál es la longitud de onda máxima capaz de promover un electrón a la banda de conducción?',opts:['413 nm','689 nm','1240 nm','551 nm'],correct:3,exp:'λ = 1240/E_g = 1240/2.25 = 551 nm. Esa es la longitud de onda umbral: fotones más largos tienen menos energía que el gap y pasan sin absorberse. La constante 1240 eV·nm viene de h·c expresada en esas unidades y conviene memorizarla.'},
{tag:'M4',q:'Un material absorbe fotones de 400 nm y por debajo, y transmite todo lo de mayor longitud de onda. ¿Qué brecha prohibida tiene y qué aspecto presenta a simple vista?',opts:['3.10 eV, incoloro o blanco','3.10 eV, negro opaco','1.55 eV, rojo intenso','4.96 eV, azul brillante'],correct:0,exp:'E_g = 1240/400 = 3.10 eV. Al absorber solo en el ultravioleta deja pasar todo el visible, de modo que se ve incoloro si es transparente o blanco si dispersa. Es el caso del óxido de titanio y del óxido de zinc, y la razón de que sirvan como pigmentos y filtros solares.'},
{tag:'M4',q:'Comparas silicio con brecha de 1.12 eV y arseniuro de galio con brecha de 1.42 eV, ambos iluminados con radiación infrarroja de 1000 nm de longitud de onda. ¿Qué ocurre?',opts:['Ninguno de los dos absorbe','El arseniuro absorbe, el silicio no','El silicio absorbe, el arseniuro no','Los dos absorben por igual'],correct:2,exp:'El fotón de 1000 nm tiene E = 1240/1000 = 1.24 eV. Supera el gap del silicio (1.12 eV) pero no el del arseniuro (1.42 eV). Por eso el silicio responde en el infrarrojo cercano y el arseniuro de galio es transparente en esa región.'},
{tag:'M4',q:'En un diodo emisor de luz el material activo tiene una brecha de 2.70 eV y toda la recombinación es radiativa a través del gap. ¿De qué color emite ese dispositivo?',opts:['Infrarrojo, cerca de 900 nm','Azul, cerca de 459 nm','Rojo, cerca de 700 nm','Verde, cerca de 550 nm'],correct:1,exp:'λ = 1240/2.70 = 459 nm, que cae en el azul. De ahí que el LED azul exigiera nitruro de galio, con gap ancho: los semiconductores de gap pequeño como el arseniuro de galio solo alcanzan el rojo y el infrarrojo.'},
{tag:'M4',q:'Mides un espectro UV-Vis de nanopartículas semiconductoras y el borde de absorción cae en 480 nm, mientras que el material masivo tiene un borde en 540 nm. ¿Qué indica?',opts:['Mayor tamaño de partícula','Agregación avanzada','Impurezas metálicas','Confinamiento cuántico'],correct:3,exp:'El borde desplazado al azul significa un gap efectivo mayor: 1240/480 = 2.58 eV frente a 1240/540 = 2.30 eV. El confinamiento cuántico eleva el gap al reducir el tamaño por debajo del radio de Bohr del excitón, y la energía añadida escala con el inverso del cuadrado de la dimensión.'},
{tag:'M4',q:'Un metal cristaliza en estructura BCC con parámetro de red de 0.287 nm. ¿Cuál es el radio atómico, sabiendo que en BCC los átomos se tocan a lo largo de la diagonal del cuerpo?',opts:['0.102 nm','0.287 nm','0.124 nm','0.144 nm'],correct:2,exp:'En BCC la diagonal del cuerpo mide a·√3 y contiene cuatro radios: r = a·√3/4 = 0.287 × 1.732/4 = 0.1243 nm. En FCC la relación sería r = a·√2/4, porque ahí el contacto ocurre en la diagonal de la cara. Es el hierro alfa.'},
{tag:'M4',q:'Comparas el factor de empaquetamiento atómico de las estructuras cúbica simple, centrada en el cuerpo y centrada en las caras para átomos esféricos idénticos. ¿Cuál es el orden?',opts:['BCC < SC < FCC','Las tres son iguales','SC < BCC < FCC','FCC < BCC < SC'],correct:2,exp:'Los valores son 0.52, 0.68 y 0.74. El de FCC coincide con el de la hexagonal compacta porque ambas son empaquetamientos compactos de esferas, con número de coordinación 12; difieren solo en la secuencia de apilamiento, ABC frente a ABA.'},
{tag:'M4',q:'El nivel de Fermi de un semiconductor se desplaza desde la mitad del gap hacia la banda de conducción tras un tratamiento con un elemento del grupo 15. ¿Qué ocurrió?',opts:['Se ensanchó el gap','Se volvió metálico','Se dopó tipo n','Se dopó tipo p'],correct:2,exp:'Un donador aporta electrones a la banda de conducción y eleva el potencial químico electrónico, que es el nivel de Fermi. El dopaje tipo p con elementos del grupo 13 haría lo contrario, bajándolo hacia la banda de valencia. El ancho del gap no cambia con el dopaje.'},
{tag:'M4',q:'Se ponen en contacto un semiconductor tipo n y uno tipo p y el sistema alcanza el equilibrio térmico sin corriente externa aplicada. ¿Qué condición define ese equilibrio?',opts:['Desaparece la zona de carga','Los niveles de Fermi se igualan','Los gaps se igualan','Las bandas quedan planas'],correct:1,exp:'En el equilibrio el nivel de Fermi es constante a lo largo de toda la unión, y para lograrlo las bandas se doblan. Ese doblado es el potencial de contacto que crea la zona de agotamiento y el campo interno responsable de separar pares electrón-hueco en una celda solar.'},
{tag:'M4',q:'Un óxido cerámico se rompe de forma súbita a un esfuerzo muy inferior al que predice la resistencia teórica de sus enlaces, sin deformación plástica previa alguna. ¿Qué lo explica?',opts:['Un módulo de Young bajo','Alta ductilidad del material','Transición vítrea cercana','Defectos que concentran esfuerzo'],correct:3,exp:'La concentración de esfuerzo en la punta de una grieta preexistente eleva localmente la tensión muy por encima de la nominal, y en un cerámico no hay dislocaciones móviles que la relajen plásticamente. Por eso la resistencia práctica depende del tamaño del defecto crítico y la dispersión entre probetas es grande.'},
{tag:'M4',q:'Un metal se endurece de forma apreciable tras laminarlo en frío, y al recocerlo después vuelve a su dureza original y recupera ductilidad. ¿Qué mecanismo explica ambos efectos?',opts:['Oxidación superficial','Densidad de dislocaciones','Cambio de composición','Transformación de fase'],correct:1,exp:'La deformación en frío multiplica las dislocaciones, que se estorban entre sí y dificultan el deslizamiento: el material se endurece y pierde ductilidad. El recocido permite la recuperación y la recristalización, que aniquilan dislocaciones y regeneran granos libres de deformación.'},
{tag:'M4',q:'Comparas la conductividad eléctrica de un metal puro con la de una aleación del mismo metal al elevar la temperatura desde el ambiente hasta varios cientos de grados. ¿Qué esperas?',opts:['El metal sube, la aleación baja','Ninguna cambia con T','Ambas bajan al calentar','Ambas suben al calentar'],correct:2,exp:'En los metales el número de portadores es fijo y calentar aumenta la dispersión por fonones, de modo que la resistividad sube y la conductividad baja en los dos casos. La aleación parte de una resistividad mayor por dispersión en los átomos de soluto, pero la pendiente con la temperatura es del mismo signo.'},
{tag:'M4',q:'Un material presenta una resistividad que cae bruscamente a cero por debajo de una temperatura crítica y expulsa por completo el campo magnético de su interior. ¿Qué fenómeno exhibe?',opts:['Efecto Hall cuántico','Superconductividad','Ferromagnetismo','Transición vítrea'],correct:1,exp:'La resistencia nula y la expulsión del campo, que es el efecto Meissner, definen el estado superconductor. La expulsión del campo es la propiedad distintiva: un conductor perfecto hipotético tendría resistencia nula pero no expulsaría el flujo preexistente.'},
{tag:'M4',q:'Se desea un material transparente en el visible y a la vez conductor eléctrico, para usarlo como electrodo frontal de una celda solar o de una pantalla. ¿Qué familia cumple?',opts:['Polímeros aislantes puros','Cerámicos de gap muy bajo','Óxidos conductores dopados','Metales nobles masivos'],correct:2,exp:'Los óxidos conductores transparentes, como el óxido de indio y estaño, combinan un gap ancho que los hace transparentes en el visible con un dopaje degenerado que aporta portadores libres. Un metal conduce pero refleja, y un gap bajo absorbe el visible.'},
{tag:'M4',q:'Comparas la dureza y la tenacidad de un acero templado con la del mismo acero templado y luego revenido a temperatura intermedia. ¿Qué diferencia esperas encontrar?',opts:['Sin diferencia apreciable','Menos dureza y más tenacidad','Más dureza y más tenacidad','Menos dureza y menos tenacidad'],correct:1,exp:'El temple produce martensita, muy dura y muy frágil. El revenido permite que precipiten carburos finos y relaja las tensiones internas, lo que sacrifica algo de dureza a cambio de una ganancia grande en tenacidad. Ese intercambio es el núcleo del tratamiento térmico.'},
{tag:'M4',q:'Un polímero termoestable no funde al calentarlo y se descompone antes de fluir, a diferencia de un termoplástico de composición química parecida. ¿Qué diferencia estructural lo causa?',opts:['Entrecruzamiento covalente','Mayor masa molecular','Mayor cristalinidad','Cadenas más ramificadas'],correct:0,exp:'En un termoestable las cadenas están unidas por enlaces covalentes en una red tridimensional, de modo que no pueden deslizar unas sobre otras: no hay fusión posible y calentar solo lleva a la descomposición. Los termoplásticos solo tienen fuerzas intermoleculares entre cadenas.'},
{tag:'M4',q:'Un cristal iónico presenta una energía de red muy alta frente a otro de la misma estructura pero con iones de carga menor y radio mayor. ¿Qué factor domina esa diferencia?',opts:['El producto de las cargas','La masa de los iones','El color del compuesto','La temperatura ambiente'],correct:0,exp:'La energía de red va como el producto de las cargas dividido entre la suma de los radios, según la ecuación de Born-Landé. Duplicar ambas cargas multiplica la energía por cuatro, un efecto mucho mayor que el de variar los radios en el rango habitual. Por eso el óxido de magnesio funde muy por encima del cloruro de sodio.'},
{tag:'M4',q:'Se busca un material para un condensador de alta capacitancia en un espacio reducido, y el criterio principal es la respuesta del material al campo eléctrico aplicado. ¿Qué propiedad maximizas?',opts:['El módulo de Young','La densidad del material','La permitividad relativa','La conductividad térmica'],correct:2,exp:'La capacitancia es proporcional a la permitividad relativa del dieléctrico y al área, e inversamente proporcional al espesor. Los ferroeléctricos como el titanato de bario alcanzan permitividades de miles, lo que explica su uso en condensadores cerámicos multicapa.'},
{tag:'M4',q:'Un material magnético conserva una magnetización apreciable tras retirar el campo externo que lo había magnetizado, y requiere un campo inverso para desmagnetizarlo. ¿Cómo se clasifica?',opts:['Antiferromagnético','Ferromagnético','Paramagnético','Diamagnético'],correct:1,exp:'La remanencia y la coercitividad definen el ciclo de histéresis característico del ferromagnetismo, que surge del acoplamiento de intercambio entre momentos vecinos. Un paramagnético pierde la magnetización en cuanto se retira el campo y un diamagnético se opone débilmente a él.'},
{tag:'M4',q:'Se quiere identificar la fase cristalina presente en una muestra de polvo desconocida, comparando contra una base de datos de patrones de referencia. ¿Qué técnica es la adecuada?',opts:['Difracción de rayos X','Absorción atómica de llama','Microscopía óptica de campo claro','Calorimetría diferencial de barrido'],correct:0,exp:'Las posiciones de los picos dependen de los espaciados interplanares, que son una huella de la estructura cristalina, y las intensidades relativas completan la identificación contra una ficha de referencia. La composición elemental por sí sola no distingue entre polimorfos como anatasa y rutilo.'},
{tag:'M4',q:'Dos polimorfos del mismo compuesto, con idéntica fórmula química, muestran distinta solubilidad y distinto punto de fusión en los ensayos de laboratorio. ¿Qué los diferencia?',opts:['El arreglo cristalino','La composición elemental','La masa molecular','El estado de oxidación'],correct:0,exp:'El polimorfismo es la capacidad de un mismo compuesto de cristalizar en estructuras distintas, con energías de red y empaquetamientos diferentes. Por eso cambian solubilidad, densidad, dureza y punto de fusión, lo que en la industria farmacéutica es un asunto regulatorio de primer orden.'},
{tag:'M4',q:'Un compuesto cristalino presenta un patrón de difracción cuya secuencia de h²+k²+l² es 1, 2, 3, 4, 5, 6, 8, sin ausencias sistemáticas de ningún tipo. ¿Qué red tiene?',opts:['Cúbica simple','Cúbica centrada en el cuerpo','Cúbica centrada en las caras','Hexagonal compacta'],correct:0,exp:'La ausencia de extinciones sistemáticas es la firma de la red cúbica simple. En BCC solo difractan los planos con h+k+l par, lo que da 2, 4, 6, 8; en FCC los índices deben ser todos pares o todos impares, lo que da 3, 4, 8, 11. Falta el 7 porque ningún entero lo satisface.'},
{tag:'M4',q:'Se compara la conductividad térmica del diamante, que es un aislante eléctrico, con la del cobre, que es un conductor eléctrico excelente. El diamante conduce mejor el calor. ¿Por qué?',opts:['Tiene electrones libres','Es más denso que el cobre','Absorbe más radiación','Transporta calor por fonones'],correct:3,exp:'En un metal el calor lo llevan los electrones libres, pero en un sólido covalente rígido lo llevan los fonones, y el diamante tiene enlaces muy fuertes, átomos ligeros y una red casi perfecta: los fonones viajan lejos sin dispersarse. Conducción térmica y eléctrica no van siempre de la mano.'},
{tag:'M4',q:'Un vidrio y un cuarzo cristalino tienen la misma composición de dióxido de silicio, pero solo uno de los dos presenta un punto de fusión definido y nítido. ¿Cuál y por qué?',opts:['El vidrio, por ser amorfo','Los dos lo tienen','Ninguno lo tiene','El cuarzo, por ser cristalino'],correct:3,exp:'Un sólido cristalino funde a temperatura fija porque todos los enlaces son equivalentes y se rompen a la misma energía. El vidrio es amorfo y no funde: se reblandece progresivamente al pasar por su transición vítrea, con una viscosidad que cae de forma continua.'},
{tag:'M4',q:'Un compuesto semiconductor binario del tipo III-V se desea crecer epitaxialmente sobre un sustrato con parámetro de red un 3 % distinto al suyo propio. ¿Qué consecuencia esperas?',opts:['Tensión y dislocaciones de desajuste','Crecimiento perfecto sin defectos','Cambio de composición química','Pérdida de cristalinidad total'],correct:0,exp:'Un desajuste de red pequeño se acomoda elásticamente deformando la capa, pero por encima de un espesor crítico la energía elástica acumulada supera el costo de generar dislocaciones de desajuste, que relajan la tensión y degradan las propiedades electrónicas.'},
{tag:'M4',q:'Un acero inoxidable austenítico resulta no magnético, mientras que el acero al carbono ordinario sí es atraído con fuerza por un imán permanente. ¿Qué explica la diferencia?',opts:['El contenido de carbono solo','La estructura cristalina','La diferencia de densidad','El acabado superficial'],correct:1,exp:'La austenita tiene estructura FCC y es paramagnética, mientras que la ferrita tiene estructura BCC y es ferromagnética. El níquel del inoxidable austenítico estabiliza la fase FCC a temperatura ambiente, y de ahí su comportamiento magnético.'},
{tag:'M4',q:'Se mide la absorbancia de una suspensión de nanopartículas de oro y la banda de plasmón, inicialmente en 522 nm, aparece ahora en 610 nm y mucho más ancha. ¿Qué ocurrió?',opts:['Las partículas se disolvieron','Bajó la concentración','Cambió el disolvente','Las partículas se agregaron'],correct:3,exp:'El acoplamiento de plasmones entre partículas vecinas en un racimo desplaza la banda al rojo y la ensancha, y el color percibido vira de rojo rubí a violeta o azul. Una simple dilución bajaría la intensidad sin mover la posición de la banda.'},
{tag:'M4',q:'Comparas la energía de un fotón de 1240 nm con la de uno de 620 nm, ambos emitidos por fuentes distintas en el mismo experimento óptico. ¿Qué relación guardan?',opts:['El de 1240 nm tiene el doble','Tienen la misma energía','El de 620 nm tiene la mitad','El de 620 nm tiene el doble'],correct:3,exp:'La energía es inversamente proporcional a la longitud de onda: E = 1240/λ da 1.00 eV y 2.00 eV respectivamente. Media longitud de onda significa doble energía, y conviene fijar los dos anclas: 1240 nm es 1 eV y 620 nm es 2 eV.'}
);
</script>
<script>
/* ---------------- M5 · ampliación a 50 · peso extra en Gibbs ---------------- */
QUIZ.push(
{tag:'M5',q:'Una reacción tiene ΔH° = −92.0 kJ/mol y ΔS° = −198 J/mol·K. ¿Cuánto vale ΔG° a 298 K y qué carácter tiene el proceso en condiciones estándar?',opts:['+33.0 kJ/mol, no espontánea','+151 kJ/mol, no espontánea','−33.0 kJ/mol, espontánea','−290 kJ/mol, espontánea'],correct:2,exp:'ΔG° = ΔH° − TΔS° = −92 000 − 298 × (−198) = −92 000 + 59 004 = −32 996 J/mol, es decir −33.0 kJ/mol. El error más caro es no pasar ΔS de J a kJ, o restar con el signo cambiado.'},
{tag:'M5',q:'Un proceso tiene ΔH° = +31.4 kJ/mol y ΔS° = +94.0 J/mol·K, ambos supuestos constantes. ¿Por encima de qué temperatura se vuelve espontáneo en condiciones estándar?',opts:['127 K','2960 K','334 K','298 K'],correct:2,exp:'La temperatura de cruce es T = ΔH°/ΔS° = 31 400/94.0 = 334 K, unos 61 °C. Con ambos signos positivos, la entropía solo gana la partida al calentar lo suficiente. Es el caso tres de los cuatro del tema.'},
{tag:'M5',q:'Una reacción en equilibrio a 298 K tiene una constante K = 4.5×10⁴. ¿Cuánto vale su energía libre estándar de reacción a esa misma temperatura?',opts:['−108 kJ/mol','−26.5 kJ/mol','+26.5 kJ/mol','−11.5 kJ/mol'],correct:1,exp:'ΔG° = −RT·ln K = −8.314 × 298 × ln(4.5×10⁴) = −8.314 × 298 × 10.71 = −26 536 J/mol. El signo negativo corresponde a K mayor que 1, lo que confirma que en el equilibrio predominan los productos.'},
{tag:'M5',q:'Para una reacción con ΔG° = +12.0 kJ/mol a 298 K se mezclan reactivos y productos de modo que Q vale 0.001. ¿En qué sentido evoluciona el sistema al inicio?',opts:['No evoluciona','No se puede saber','Hacia productos','Hacia reactivos'],correct:2,exp:'ΔG = ΔG° + RT·ln Q = 12 000 + 8.314 × 298 × ln(0.001) = 12 000 − 17 118 = −5118 J/mol. Negativo, así que avanza hacia productos pese a que ΔG° es positivo. Es la demostración de que el sentido real lo decide Q, no el valor estándar.'},
{tag:'M5',q:'La fusión del hielo a 0 °C y una atmósfera ocurre con ΔH = +6.01 kJ/mol y el sistema está en equilibrio entre las dos fases. ¿Cuánto vale ΔS de fusión?',opts:['+6.01 J/mol·K','0 J/mol·K','+22.0 J/mol·K','−22.0 J/mol·K'],correct:2,exp:'En el equilibrio de fases ΔG = 0, de modo que ΔS = ΔH/T = 6010/273.15 = 22.0 J/mol·K. El signo positivo refleja el aumento de desorden al pasar de sólido a líquido. Usar 0 en lugar de 273.15 K es un error fatal de división por cero.'},
{tag:'M5',q:'Una reacción tiene ΔH° negativo y ΔS° positivo, según los datos termodinámicos tabulados para todos sus reactivos y productos. ¿Qué se concluye sobre su espontaneidad?',opts:['Nunca espontánea','Espontánea a toda temperatura','Solo a temperatura alta','Solo a temperatura baja'],correct:1,exp:'Con ΔH negativo y ΔS positivo, ambos términos de ΔG = ΔH − TΔS empujan en el mismo sentido negativo y ninguna temperatura invierte el signo. Es el primero de los cuatro casos, y el único sin temperatura de cruce.'},
{tag:'M5',q:'Dos reacciones tienen constantes de equilibrio de 10 y de 10⁶ a la misma temperatura de 298 K. ¿Cuánto difieren sus energías libres estándar de reacción?',opts:['Unos 28.5 kJ/mol','Unos 5.7 kJ/mol','Unos 100 kJ/mol','No difieren'],correct:0,exp:'ΔΔG° = −RT·ln(10⁶/10) = −8.314 × 298 × ln(10⁵) = −8.314 × 298 × 11.51 = −28 510 J/mol. Cada década de K equivale a unos 5.7 kJ/mol a temperatura ambiente, y ese ancla permite estimar sin calculadora.'},
{tag:'M5',q:'La constante de equilibrio de una reacción exotérmica vale 150 a 300 K. ¿Qué esperas que ocurra con ese valor si la temperatura sube hasta 400 K, sin cambiar nada más?',opts:['Aumenta por encima de 150','Se mantiene en 150','Se vuelve negativa','Disminuye por debajo de 150'],correct:3,exp:'Por van’t Hoff, en una reacción exotérmica K cae al calentar: el calor actúa como producto y añadirlo desplaza el equilibrio hacia reactivos. Una constante de equilibrio nunca puede ser negativa, porque es un cociente de magnitudes positivas.'},
{tag:'M5',q:'Un gas ideal se expande isotérmicamente y de forma reversible al doble de su volumen inicial a 298 K. ¿Cuánto vale el cambio de entropía del gas, por mol?',opts:['−5.76 J/mol·K','+1.72 J/mol·K','0 J/mol·K','+5.76 J/mol·K'],correct:3,exp:'ΔS = nR·ln(V₂/V₁) = 8.314 × ln 2 = 5.76 J/mol·K. Positivo porque hay más volumen accesible y por tanto más microestados. En el proceso reversible, la entropía del entorno cambia en la misma magnitud con signo opuesto y la del universo queda en cero.'},
{tag:'M5',q:'Al disolver nitrato de amonio en agua, el recipiente se enfría de forma notable y sin embargo la sal se disuelve por completo y de modo espontáneo. ¿Qué lo explica?',opts:['La reacción no es espontánea','El agua cede calor al aire','El término TΔS domina','ΔH es negativo'],correct:2,exp:'La disolución es endotérmica, es decir ΔH positivo, de modo que la fuerza impulsora tiene que venir del aumento de entropía al pasar de una red ordenada a iones dispersos en disolución. Mientras TΔS supere a ΔH, el ΔG global es negativo.'},
{tag:'M5',q:'Una reacción en fase gas pasa de cuatro moles de reactivos a dos moles de productos, todos gaseosos, y transcurre a temperatura constante. ¿Qué signo esperas para ΔS° de reacción?',opts:['Positivo','Exactamente cero','Depende de la presión','Negativo'],correct:3,exp:'Menos moles de gas significa menos microestados traslacionales accesibles y por tanto menor entropía. Contar moles de gas en reactivos y productos es la forma más rápida y fiable de anticipar el signo de ΔS° sin consultar tablas.'},
{tag:'M5',q:'Se mide la constante de velocidad de una reacción a 300 K y a 310 K, y resulta ser el doble a la temperatura mayor. ¿Qué energía de activación aproximada tiene la reacción?',opts:['Unos 53 kJ/mol','Unos 5 kJ/mol','Unos 530 kJ/mol','Unos 100 kJ/mol'],correct:0,exp:'Ea = R·ln(k₂/k₁)/(1/T₁ − 1/T₂) = 8.314 × 0.693/(1/300 − 1/310) = 5.76/1.075×10⁻⁴ = 53 600 J/mol. Es la reacción que cumple la regla práctica de duplicar su velocidad cada diez grados cerca de temperatura ambiente.'},
{tag:'M5',q:'Una reacción de primer orden tiene una constante de velocidad de 0.0231 min⁻¹ a la temperatura de trabajo del reactor. ¿Cuánto vale su tiempo de vida media?',opts:['43.3 min','15.0 min','0.693 min','30.0 min'],correct:3,exp:'Para orden uno, t½ = 0.693/k = 0.693/0.0231 = 30.0 min. La propiedad distintiva de este orden es que la vida media no depende de la concentración inicial, lo que permite identificarlo sin ajustar la recta completa.'},
{tag:'M5',q:'Se grafica el inverso de la concentración de un reactivo contra el tiempo y los puntos caen sobre una recta de pendiente positiva y buen ajuste. ¿Qué orden tiene la reacción?',opts:['Segundo orden','Primer orden','Orden cero','Orden fraccionario'],correct:0,exp:'La linealización de cada orden es distinta: concentración contra t para orden cero, logaritmo natural de la concentración contra t para orden uno, y el inverso de la concentración contra t para orden dos. La pendiente de esta última recta es directamente la constante k.'},
{tag:'M5',q:'Un catalizador reduce la energía de activación de una reacción de 80 a 50 kJ/mol a 298 K, sin alterar la termodinámica del proceso. ¿Por qué factor se acelera aproximadamente?',opts:['Unas 30 veces','Unas 1.6 veces','No se acelera','Unas 2×10⁵ veces'],correct:3,exp:'La razón de constantes es exp(ΔEa/RT) = exp(30 000/(8.314 × 298)) = exp(12.11) ≈ 1.8×10⁵. La dependencia exponencial explica por qué bajar la barrera unas pocas decenas de kJ/mol cambia por completo la viabilidad práctica de un proceso.'},
{tag:'M5',q:'Una disolución acuosa de un soluto no volátil se compara con agua pura a la misma temperatura y presión externa. ¿Qué le ocurre a la presión de vapor del disolvente?',opts:['Depende del soluto','Baja respecto al agua pura','Sube respecto al agua pura','Queda exactamente igual'],correct:1,exp:'La ley de Raoult hace la presión de vapor proporcional a la fracción molar del disolvente, que necesariamente es menor que uno en una disolución. De ahí salen las otras coligativas: menor presión de vapor implica mayor punto de ebullición y menor punto de fusión.'},
{tag:'M5',q:'Se disuelven 0.100 mol de un electrolito que se disocia en tres iones en 1.00 kg de agua, cuya constante crioscópica es 1.86 °C·kg/mol. ¿Cuánto baja el punto de fusión?',opts:['0.186 °C','1.86 °C','0.0620 °C','0.558 °C'],correct:3,exp:'ΔT_f = i·K_f·m = 3 × 1.86 × 0.100 = 0.558 °C. Omitir el factor de van’t Hoff da 0.186 y es el distractor previsto. Las coligativas cuentan partículas, no identidad química.'},
{tag:'M5',q:'Dos recipientes contienen el mismo gas a la misma temperatura, uno a 1 bar y otro a 10 bar, conectados por una válvula cerrada que luego se abre. ¿Qué impulsa el proceso?',opts:['El trabajo del entorno','La energía de activación','El aumento de entropía','La disminución de entalpía'],correct:2,exp:'En la expansión libre de un gas ideal a temperatura constante no hay cambio de energía interna ni de entalpía: toda la fuerza impulsora es entrópica, porque el gas accede a más volumen y por tanto a más microestados. Es el ejemplo más limpio de proceso dirigido solo por entropía.'},
{tag:'M5',q:'Una reacción tiene ΔG° = 0 exactamente a la temperatura de trabajo elegida para el experimento. ¿Qué valor tiene su constante de equilibrio en esas condiciones?',opts:['K = 1','K = 0','K es infinita','K es negativa'],correct:0,exp:'De ΔG° = −RT·ln K, si ΔG° vale cero entonces ln K = 0 y por tanto K = 1. Eso significa que reactivos y productos coexisten en proporciones comparables en el equilibrio estándar, no que no haya reacción.'},
{tag:'M5',q:'Se quiere desplazar hacia productos un equilibrio gaseoso que transcurre con disminución del número de moles de gas, sin cambiar la temperatura del sistema. ¿Qué haces?',opts:['Inyectar gas inerte a V fijo','Aumentar la presión','Disminuir la presión','Añadir un catalizador'],correct:1,exp:'Comprimir desplaza el equilibrio hacia el lado con menos moles de gas, que aquí es el de productos. El catalizador no mueve la posición del equilibrio, y un gas inerte a volumen constante no altera las presiones parciales de las especies reactivas.'},
{tag:'M5',q:'Se mide la isoterma de adsorción de un gas sobre un sólido y los datos ajustan bien a Langmuir en todo el intervalo de presión explorado. ¿Qué supone ese modelo?',opts:['Adsorción irreversible total','Monocapa y sitios equivalentes','Multicapa sin límite','Interacción fuerte entre adsorbatos'],correct:1,exp:'Langmuir supone una superficie con sitios equivalentes e independientes, adsorción hasta completar una monocapa y ausencia de interacción entre moléculas adsorbidas. Cuando hay multicapa, el modelo que aplica es BET, que es el que se usa para medir área específica.'},
{tag:'M5',q:'Una gota de agua de 1.0 µm de radio tiene una tensión superficial de 0.072 N/m a la temperatura del experimento. ¿Cuál es el exceso de presión en su interior?',opts:['1.4×10⁵ Pa','7.2×10⁴ Pa','2.9×10⁵ Pa','72 Pa'],correct:0,exp:'Para una gota con una sola interfaz, ΔP = 2γ/r = 2 × 0.072/1.0×10⁻⁶ = 1.44×10⁵ Pa, algo más de una atmósfera. Para una burbuja de jabón, con dos interfaces, sería 4γ/r y el doble.'},
{tag:'M5',q:'Una suspensión coloidal tiene un potencial zeta de −45 mV en agua destilada y se le añade cloruro de sodio hasta 100 mM. ¿Qué le ocurre a la estabilidad del sistema?',opts:['Se desestabiliza y agrega','Se estabiliza todavía más','No cambia en absoluto','Invierte su carga a positiva'],correct:0,exp:'El electrolito comprime la doble capa eléctrica y acorta la longitud de Debye, de modo que la barrera de repulsión de DLVO baja hasta que los choques brownianos la superan. El potencial zeta medido cae en magnitud y la suspensión agrega.'},
{tag:'M5',q:'Un mismo soluto se reparte entre dos disolventes inmiscibles y su coeficiente de reparto vale 25 a favor del disolvente orgánico, con volúmenes iguales de ambas fases. ¿Qué fracción queda en el agua?',opts:['Alrededor del 4 %','Alrededor del 25 %','Alrededor del 50 %','Alrededor del 96 %'],correct:0,exp:'Con volúmenes iguales, la fracción en la fase acuosa es 1/(1 + K) = 1/26 = 0.038, es decir un 3.8 %. Por eso una extracción con varias porciones pequeñas recupera más que una sola extracción con todo el disolvente de golpe.'},
{tag:'M5',q:'La presión osmótica de una disolución 0.010 M de un soluto no electrolito se mide a 298 K con una membrana semipermeable ideal. ¿Qué valor aproximado tiene?',opts:['24.5 atm','0.245 atm','0.0245 atm','2.45 atm'],correct:1,exp:'Π = M·R·T = 0.010 × 0.0821 × 298 = 0.245 atm, unos 186 mmHg. La osmótica es la coligativa más sensible, lo que la hace útil para determinar masas molares de macromoléculas con disoluciones muy diluidas.'},
{tag:'M5',q:'Una reacción elemental bimolecular en fase gas tiene un factor preexponencial mucho menor que el que predice la teoría de colisiones simple para esas moléculas. ¿Qué lo explica?',opts:['La presión del sistema','La masa de las moléculas','El factor estérico de orientación','Un error en la temperatura'],correct:2,exp:'No toda colisión con energía suficiente es productiva: las moléculas deben encontrarse además con la orientación adecuada. El factor estérico recoge esa fracción y puede valer órdenes de magnitud menos que uno en moléculas grandes o con sitios reactivos pequeños.'},
{tag:'M5',q:'Se compara el punto de ebullición del agua, del sulfuro de hidrógeno y del seleniuro de hidrógeno, todos del mismo grupo de la tabla periódica. El agua hierve mucho más alto. ¿Por qué?',opts:['Por su mayor masa molar','Por su menor polaridad','Por su geometría lineal','Por sus puentes de hidrógeno'],correct:3,exp:'La tendencia del grupo predice que el más ligero hierva más bajo, y el agua rompe esa tendencia de forma espectacular. La causa es la red de puentes de hidrógeno, posible solo cuando el hidrógeno está unido a nitrógeno, oxígeno o flúor.'},
{tag:'M5',q:'Un proceso espontáneo ocurre en un sistema aislado del entorno, sin intercambio de materia ni de energía con el exterior. ¿Qué magnitud debe aumentar necesariamente?',opts:['La presión del sistema','La entropía del sistema','La entalpía del sistema','La energía interna total'],correct:1,exp:'En un sistema aislado el sistema es el universo, así que la segunda ley exige que su entropía aumente en todo proceso espontáneo. La energía interna se conserva por la primera ley, y entalpía y presión pueden moverse en cualquier dirección.'}
);
</script>
<script>
/* ---------------- M6 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M6',q:'Comparas un lote de nanopartículas esféricas de 5 nm con otro de 50 nm del mismo material y densidad. ¿Cuántas veces mayor es el área específica del lote pequeño?',opts:['Diez veces','Cien veces','Mil veces','La misma área'],correct:0,exp:'El área específica es 6/(ρD), inversamente proporcional al diámetro. Dividir el diámetro entre diez multiplica el área por gramo por diez. El número de partículas por gramo, en cambio, se multiplica por mil, porque escala con el inverso del cubo.'},
{tag:'M6',q:'Quieres sintetizar nanopartículas de óxido metálico a baja temperatura, partiendo de un alcóxido en disolución y controlando la hidrólisis y la condensación. ¿Qué ruta usas?',opts:['Ablación láser','Molienda de bolas','Evaporación térmica','Sol-gel'],correct:3,exp:'El sol-gel hidroliza un alcóxido para formar grupos hidroxilo que después condensan en una red de óxido, todo en disolución y por debajo de 100 °C. Las otras tres son rutas físicas de alta energía, sin control molecular de la química.'},
{tag:'M6',q:'Una síntesis hidrotermal se lleva a cabo en autoclave a 180 °C durante doce horas, muy por encima del punto de ebullición normal del agua. ¿Qué permite trabajar así?',opts:['Un catalizador de transferencia','La presión autógena del sistema','Un disolvente orgánico añadido','La reducción del punto crítico'],correct:1,exp:'En un recipiente cerrado el agua genera su propia presión de vapor al calentarse, lo que eleva su punto de ebullición y la mantiene líquida. En esas condiciones cambian la constante dieléctrica y la solubilidad de los óxidos, lo que favorece la cristalización directa sin calcinación posterior.'},
{tag:'M6',q:'Se busca depositar una película de espesor controlado al angstrom sobre una estructura tridimensional con poros profundos y relación de aspecto alta. ¿Qué técnica eliges?',opts:['Evaporación por haz de electrones','Sputtering con magnetrón','Serigrafía de pasta','Depósito de capa atómica'],correct:3,exp:'El ALD usa reacciones superficiales autolimitadas: cada pulso satura la superficie accesible y crece exactamente una capa por ciclo, de modo que recubre el interior de un poro con espesor uniforme. Las técnicas de línea de vista depositan sobre lo que ven y cierran la boca del poro.'},
{tag:'M6',q:'Quieres producir fibras poliméricas continuas de cientos de nanómetros de diámetro a partir de una disolución, usando un campo eléctrico intenso. ¿Qué método aplicas?',opts:['Precipitación por antidisolvente','Litografía de haz de iones','Electrohilado','Molienda criogénica'],correct:2,exp:'En el electrohilado el campo deforma la gota en un cono de Taylor del que se expulsa un chorro cargado que se adelgaza y se seca en vuelo, depositando una malla de nanofibras. El diámetro se controla con la concentración, la viscosidad, el voltaje y la distancia al colector.'},
{tag:'M6',q:'Una síntesis por reducción química de oro arroja partículas con distribución ancha y forma irregular, pese a usar siempre el mismo precursor y reductor. ¿Qué condición revisas primero?',opts:['La velocidad de mezclado','El color del matraz','La marca del reactivo','La altura del laboratorio'],correct:0,exp:'La monodispersidad exige separar en el tiempo una nucleación instantánea del crecimiento posterior. Si el reductor se mezcla despacio, unas zonas nuclean antes que otras y las partículas no tienen la misma edad. Inyectar rápido en medio caliente y bien agitado es la corrección directa.'},
{tag:'M6',q:'Se comparan dos rutas para obtener el mismo nanomaterial: una ascendente desde precursores moleculares y otra descendente desde el material masivo. ¿Qué diferencia esperas?',opts:['Ambas dan el mismo control','Ninguna controla el tamaño','La ascendente controla mejor','La descendente controla mejor'],correct:2,exp:'La vía ascendente construye la partícula átomo a átomo y permite controlar tamaño, forma y superficie mediante la química. La descendente parte de un sólido y lo rompe, con un control de tamaño pobre, distribuciones anchas y superficies con defectos, aunque suele escalar mejor y costar menos.'},
{tag:'M6',q:'Un agente surfactante se añade durante la síntesis coloidal y el producto cambia de esferas a varillas alargadas, sin que varíe la composición química. ¿Cómo actúa?',opts:['Pasiva unas caras y las frena','Disuelve selectivamente unas caras','Aumenta la temperatura local del medio','Cambia el estado de oxidación del metal'],correct:0,exp:'La cara que crece rápido se cierra y desaparece de la forma final; la lenta sobrevive. Al adsorberse sobre una familia de caras, el agente la vuelve lenta y por tanto persistente. Así el bromuro de cetiltrimetilamonio produce nanovarillas de oro.'},
{tag:'M6',q:'Se quiere obtener una dispersión estable de nanopartículas en un medio fisiológico con 150 mM de sal, donde la estabilización electrostática deja de funcionar. ¿Qué estrategia usas?',opts:['Estabilización estérica con polímero','Aumentar el potencial zeta','Subir la fuerza iónica aún más','Reducir la temperatura'],correct:0,exp:'La barrera electrostática se derrumba al comprimirse la doble capa por la sal. Una capa de polímero injertado, típicamente polietilenglicol, genera repulsión por impedimento estérico y por pérdida de entropía de las cadenas, un mecanismo que no depende del apantallamiento iónico.'},
{tag:'M6',q:'Una muestra de nanopartículas de hierro sintetizadas por reducción en fase líquida pierde su carácter magnético a los pocos días en frasco abierto. ¿Qué ocurrió?',opts:['Se evaporó el disolvente','Cambió la temperatura ambiente','Se disolvieron por completo','Se oxidó la superficie metálica'],correct:3,exp:'El hierro cerovalente nanoestructurado tiene un área enorme y átomos de baja coordinación muy reactivos, y además su potencial se desplaza por el término de Gibbs-Thomson. Se oxida en días o incluso horas. Por eso se recubre con carbono o con una capa de óxido controlada.'},
{tag:'M6',q:'Se desea obtener un material mesoporoso ordenado con poros de 5 nm y canales paralelos regulares, a partir de sílice en disolución. ¿Qué estrategia de síntesis se usa?',opts:['Molienda y tamizado fino','Sinterización a alta presión','Grabado por plasma dirigido','Plantilla de micelas de surfactante'],correct:3,exp:'Las micelas de surfactante se autoensamblan en una fase ordenada alrededor de la cual condensa la sílice; al calcinar se elimina el molde orgánico y queda la red de poros con la geometría de las micelas. Es el principio de los materiales de la familia MCM y SBA.'},
{tag:'M6',q:'Dos síntesis idénticas se diferencian solo en que una usa un precursor diez veces más concentrado que la otra, en el mismo volumen y temperatura. ¿Qué esperas del tamaño final?',opts:['Partículas mayores en la concentrada','El mismo tamaño en ambas','Ningún producto en la concentrada','Partículas menores en la concentrada'],correct:3,exp:'Mayor concentración significa mayor sobresaturación, lo que baja el radio crítico y hunde la barrera de nucleación: nuclean muchísimos más núcleos a la vez y el mismo material se reparte entre más partículas, de modo que cada una queda menor.'},
{tag:'M6',q:'Un nanomaterial sintetizado por sol-gel resulta amorfo en difracción de rayos X y se desea cristalizarlo sin perder demasiada área superficial. ¿Qué variable es crítica?',opts:['El volumen del crisol','La marca del horno','La temperatura de calcinación','El color del precursor'],correct:2,exp:'Calcinar cristaliza el amorfo, pero por encima de cierta temperatura el grano crece, el área cae y pueden aparecer transiciones de fase no deseadas, como la de anatasa a rutilo por encima de unos 600 °C. El óptimo es la temperatura mínima que cristaliza lo suficiente.'},
{tag:'M6',q:'Se quiere fabricar un patrón de líneas de 20 nm de ancho sobre una oblea, por debajo de lo que permite la litografía óptica convencional de laboratorio. ¿Qué técnica usas?',opts:['Serigrafía de alta resolución','Impresión por chorro de tinta','Litografía por haz de electrones','Fotolitografía con lámpara de mercurio'],correct:2,exp:'El haz de electrones tiene una longitud de onda asociada de picómetros, así que el límite de difracción deja de ser la restricción y lo que limita es la dispersión en la resina. Es lento y caro, porque escribe punto a punto, y por eso se usa para prototipos y para fabricar máscaras.'},
{tag:'M6',q:'Un proceso de molienda de bolas produce partículas de 200 nm tras veinte horas, y prolongar la molienda a cuarenta horas no reduce más el tamaño. ¿Qué ocurrió?',opts:['El molino perdió potencia','Se agotó el material a moler','Bajó la temperatura del vaso','Se equilibró con la reaglomeración'],correct:3,exp:'La molienda llega a un tamaño límite en el que la energía de fractura se equilibra con la tendencia de las partículas recién creadas, de superficie muy reactiva, a soldarse en frío y reaglomerarse. Se baja ese límite con agentes de control de proceso o moliendo en criogenia.'},
{tag:'M6',q:'Se busca una ruta que produzca nanopartículas de forma continua y con tiempo de residencia idéntico para todo el material, evitando el problema de escalar por volumen. ¿Qué sistema usas?',opts:['Molienda prolongada','Secado por aspersión','Reactor de flujo continuo','Reactor por lotes mayor'],correct:2,exp:'En flujo continuo todo el fluido recorre el mismo camino y experimenta el mismo perfil de temperatura y concentración, de modo que el producto es homogéneo. Escalar significa operar más tiempo o poner reactores en paralelo, no agrandar el recipiente, que es lo que arruina la monodispersidad.'},
{tag:'M6',q:'Durante una síntesis asistida por microondas el calentamiento resulta mucho más rápido y uniforme que en un baño convencional, con el mismo disolvente. ¿Por qué?',opts:['Calienta todo el volumen a la vez','Las microondas son más energéticas','Se reduce la energía de activación','Cambia el mecanismo de reacción'],correct:0,exp:'Las microondas acoplan directamente con los momentos dipolares del disolvente y disipan energía en todo el volumen de forma simultánea, en lugar de transmitir calor por conducción desde las paredes. Eso elimina los gradientes térmicos que ensanchan la distribución de tamaños.'},
{tag:'M6',q:'Dos recubrimientos del mismo espesor nominal se comparan en un sustrato rugoso: uno depositado por evaporación y otro por depósito químico en fase vapor. ¿Qué diferencia esperas?',opts:['El CVD cubre mejor la rugosidad','La evaporación cubre mejor el relieve','Ambos cubren el relieve por igual','Ninguno de los dos cubre el relieve'],correct:0,exp:'La evaporación es un proceso de línea de vista en vacío: deja sombras detrás de cualquier relieve. En el CVD los precursores llegan en fase gas, difunden y reaccionan sobre toda la superficie accesible, de modo que la cobertura de escalón es mucho mejor.'},
{tag:'M6',q:'Se sintetizan nanopartículas núcleo-coraza y se quiere confirmar que la coraza recubre realmente al núcleo y no forma partículas independientes. ¿Qué evidencia lo demuestra?',opts:['Mapeo elemental en TEM','Difracción de polvos sola','Medida de densidad','Punto de fusión del polvo'],correct:0,exp:'El mapeo elemental por EDS o EELS dentro del microscopio de transmisión muestra la distribución espacial de cada elemento dentro de una misma partícula, lo que distingue una coraza concéntrica de una mezcla de dos poblaciones. La difracción daría las dos fases en ambos casos.'},
{tag:'M6',q:'Un dendrímero de cuarta generación se compara con uno de segunda del mismo núcleo y la misma química de ramificación. ¿Qué diferencia esperas encontrar?',opts:['Menos grupos terminales libres','El mismo número de grupos','Menor masa molecular total','Más grupos terminales y tamaño'],correct:3,exp:'Cada generación duplica o triplica el número de ramas según la funcionalidad del monómero, de modo que los grupos terminales crecen de forma exponencial con la generación. El diámetro crece de forma aproximadamente lineal, lo que acaba produciendo el congestionamiento estérico que limita el crecimiento.'},
{tag:'M6',q:'Una dispersión de nanotubos de carbono en agua se separa en el fondo del frasco a las pocas horas, pese a agitarse con fuerza antes de cada uso. ¿Qué estrategia la estabiliza?',opts:['Añadir más nanotubos','Reducir el volumen de agua','Funcionalizar la superficie','Calentar la dispersión'],correct:2,exp:'Los nanotubos prístinos son hidrófobos y se agrupan en haces por fuerzas de dispersión muy intensas a lo largo de toda su longitud. Funcionalizar con grupos carboxilo por oxidación, o envolver con un surfactante, introduce repulsión y los mantiene dispersos.'},
{tag:'M6',q:'Se pretende que un recubrimiento nanoestructurado repela el agua con ángulos de contacto superiores a 150 grados, partiendo de un material de baja energía superficial. ¿Qué falta?',opts:['Mayor dureza del sustrato','Más temperatura de curado','Rugosidad jerárquica en la superficie','Mayor espesor del recubrimiento'],correct:2,exp:'La química de baja energía por sí sola llega a unos 120 grados. Para superar 150 hace falta además rugosidad en dos escalas que atrape aire bajo la gota, el estado de Cassie-Baxter. Es el principio de la hoja de loto, y por eso el efecto se pierde si el líquido penetra en la textura.'},
{tag:'M6',q:'Una ruta de síntesis verde de nanopartículas metálicas emplea extracto vegetal en lugar de borohidruro, obteniendo el mismo material. ¿Qué papel cumple el extracto?',opts:['Actúa como disolvente único','Reduce el precursor y estabiliza','Solo controla el pH','Aporta el metal'],correct:1,exp:'Los polifenoles y flavonoides del extracto ceden electrones al ion metálico, reduciéndolo a metal, y sus grupos funcionales se adsorben sobre la superficie formada, estabilizándola. Cumplen a la vez el papel de reductor y de agente de recubrimiento, lo que simplifica el proceso.'},
{tag:'M6',q:'Se requiere un aerogel de sílice con porosidad superior al 95 % y la etapa crítica es eliminar el disolvente sin que la red colapse por capilaridad. ¿Qué método se usa?',opts:['Prensado en caliente','Secado supercrítico','Secado en estufa a 120 °C','Evaporación al aire libre'],correct:1,exp:'Al evaporar un líquido dentro de poros nanométricos, la presión capilar en el menisco alcanza decenas de atmósferas y colapsa la red. En condiciones supercríticas desaparece la interfaz líquido-vapor y con ella la tensión superficial, de modo que la estructura se conserva intacta.'},
{tag:'M6',q:'Dos lotes de nanopartículas tienen el mismo tamaño medio por TEM, pero uno sedimenta en horas y el otro permanece disperso durante meses en el mismo medio. ¿Qué los distingue?',opts:['Su índice de refracción','Su química superficial','Su masa molar','Su número atómico'],correct:1,exp:'La estabilidad coloidal la decide el balance entre atracción de van der Waals y repulsión electrostática o estérica, que depende de la carga y de los ligandos de la superficie, no del tamaño del núcleo. Dos lotes idénticos en TEM pueden comportarse de forma opuesta en suspensión.'},
{tag:'M6',q:'Un proceso de síntesis genera partículas cuya distribución de tamaño se ensancha con el tiempo de envejecimiento, mientras el número total de partículas disminuye. ¿Qué ocurre?',opts:['Disolución completa','Maduración de Ostwald','Agregación por choques','Nucleación secundaria'],correct:1,exp:'La maduración de Ostwald disuelve las partículas pequeñas, más solubles por curvatura según Kelvin, y redeposita el material sobre las grandes. El número total cae y el tamaño medio sube, con contornos que siguen siendo lisos porque nunca se tocan.'},
{tag:'M6',q:'Se quiere ajustar la porosidad y el tamaño de poro de una membrana polimérica preparada por inversión de fases, para una aplicación de ultrafiltración. ¿Qué variable es la principal?',opts:['La altura del baño de coagulación','La velocidad de intercambio','El color del polímero usado','La masa del molde de vidrio'],correct:1,exp:'La cinética de la demezcla decide la morfología: un intercambio rápido produce una capa densa delgada con macrovacíos debajo, y uno lento da una estructura esponjosa más simétrica. Se controla con la composición del baño de coagulación, la temperatura y el tiempo de evaporación previo.'},
{tag:'M6',q:'Una síntesis de puntos cuánticos produce emisión con un ancho de banda muy amplio, en lugar del pico estrecho que se buscaba para la aplicación óptica. ¿Qué indica ese ensanchamiento?',opts:['Temperatura demasiado baja','Distribución ancha de tamaños','Impureza del precursor metálico','Exceso de disolvente'],correct:1,exp:'En un punto cuántico el color de emisión depende del tamaño por el confinamiento, de modo que el ancho del pico es una lectura directa de la dispersión de tamaños del lote. Un pico estrecho exige monodispersidad, que es justo lo que busca la inyección caliente.'}
);
</script>
<script>
/* ---------------- M7 · ampliación a 50 · peso extra en elección de técnica ---------------- */
QUIZ.push(
{tag:'M7',q:'Necesitas la brecha prohibida de un semiconductor en polvo y dispones de un espectrofotómetro con esfera integradora. ¿Qué técnica y qué lectura te la entregan?',opts:['Infrarrojo, banda a 1700','Difracción, posición del pico','Termogravimetría, pérdida','UV-Vis, borde de absorción'],correct:3,exp:'El borde de absorción marca la energía mínima que promueve un electrón a la banda de conducción: E_g = 1240/λ_borde. El ajuste de Tauc, graficando (αhν)^(1/n) contra hν y extrapolando la recta, precisa el valor y distingue gap directo de indirecto.'},
{tag:'M7',q:'Mides el espectro UV-Vis de un coloide de oro y el máximo de absorción aparece en 521 nm, estrecho y simétrico. ¿Qué concluyes sobre el estado de la suspensión?',opts:['Material disuelto por completo','Esferas pequeñas bien dispersas','Partículas agregadas en racimos','Varillas de relación alta'],correct:1,exp:'El plasmón del oro esférico de unos 20 nm cae cerca de 520 nm y da la suspensión roja. La agregación acopla plasmones vecinos y corre la banda al rojo ensanchándola, y las varillas muestran dos bandas, una transversal cerca de 520 y otra longitudinal más al rojo.'},
{tag:'M7',q:'Debes determinar la estructura molecular completa de un ligando orgánico que recubre unas nanopartículas, incluida la posición de cada sustituyente. ¿Qué técnica eliges?',opts:['Absorción atómica de llama','Dispersión dinámica de luz','Resonancia magnética nuclear','Difracción de rayos X de polvos'],correct:2,exp:'La RMN entrega entorno químico por el desplazamiento, número de vecinos por la multiplicidad y número de núcleos por la integración, que juntos reconstruyen la conectividad. El infrarrojo identificaría el grupo funcional pero no su posición en la cadena.'},
{tag:'M7',q:'Quieres composición elemental con resolución casi atómica dentro de una nanopartícula, y los elementos de interés son carbono, nitrógeno y oxígeno. ¿Qué técnica usas?',opts:['EELS en el TEM','EDS en el SEM','Fluorescencia de rayos X','Absorción atómica'],correct:0,exp:'La espectroscopía de pérdida de energía de electrones se hace dentro del microscopio de transmisión, alcanza resolución espacial casi atómica y es especialmente sensible a los elementos ligeros, que el EDS detecta mal por su bajo rendimiento de fluorescencia.'},
{tag:'M7',q:'Necesitas saber en qué compartimento de una célula se acumulan unas nanopartículas marcadas con fluoróforo, reconstruyendo la imagen en tres dimensiones. ¿Qué técnica usas?',opts:['Microscopía electrónica de barrido','Difracción de electrones','Espectroscopía Raman','Microscopía confocal'],correct:3,exp:'El confocal rechaza con un diafragma la luz que no viene del plano focal, lo que permite seccionar ópticamente la célula y reconstruir en tres dimensiones. No resuelve la partícula individual, porque sigue limitado a unos 200 nm, pero sí localiza dónde se acumula la señal.'},
{tag:'M7',q:'Un colega propone medir el diámetro de nanopartículas de 30 nm con un microscopio óptico de buena calidad y objetivo de inmersión. ¿Qué le respondes?',opts:['Hace falta más aumento óptico','El límite de difracción lo impide','Funciona con buen enfoque','Solo si se tiñen antes'],correct:1,exp:'El criterio de Abbe fija la resolución en λ/(2·AN), unos 200 nm con luz visible y apertura numérica de 1.4. Aumentar la magnificación no añade información: lo que se vería es un disco de Airy del mismo tamaño para cualquier objeto menor que ese límite.'},
{tag:'M7',q:'Debes confirmar el estado de oxidación del titanio en la superficie de un recubrimiento y distinguir entre Ti³⁺ y Ti⁴⁺ en los primeros nanómetros. ¿Qué técnica aplicas?',opts:['TGA','XPS','EDS','DLS'],correct:1,exp:'La espectroscopía de fotoelectrones mide energías de enlace de electrones internos, que se desplazan con el entorno químico, y su profundidad de análisis es de unos pocos nanómetros. El EDS da el elemento pero no el estado de oxidación, porque sus transiciones son insensibles al enlace.'},
{tag:'M7',q:'Quieres el área superficial específica y la distribución de tamaño de poro de un polvo poroso, y dispones de un equipo de adsorción de nitrógeno a 77 K. ¿Qué modelos aplicas?',opts:['BET para el área, BJH para poros','Langmuir para el área y los poros','Scherrer para el área y los poros','Stokes-Einstein para área y poros'],correct:0,exp:'BET extiende Langmuir a la adsorción en multicapa y es el estándar para área específica. BJH trata la rama de desorción con la ecuación de Kelvin para extraer la distribución de tamaño de poro en el rango mesoporoso.'},
{tag:'M7',q:'Necesitas verificar si un polímero contiene una carga inorgánica y cuánta, sin separar físicamente los componentes de la muestra. ¿Qué análisis térmico te lo dice?',opts:['TGA en aire, residuo final','DSC, posición de la Tg','DMA, módulo de pérdida','Punto de fusión capilar'],correct:0,exp:'Al calentar en aire hasta unos 800 °C la matriz orgánica se descompone y se oxida por completo, de modo que el residuo que queda corresponde a la fracción inorgánica. El DSC detecta transiciones térmicas pero no cuantifica masa.'},
{tag:'M7',q:'Dos muestras del mismo compuesto dan patrones de difracción con picos en las mismas posiciones, pero uno tiene picos mucho más anchos que el otro. ¿Qué diferencia hay?',opts:['Distinto parámetro de red','Distinto tamaño de cristalito','Distinta fase cristalina','Distinta composición'],correct:1,exp:'Las posiciones coinciden, así que la fase y el parámetro de red son los mismos. El ensanchamiento viene del tamaño de dominio coherente, por Scherrer, y de la microdeformación. Separar ambas contribuciones exige el análisis de Williamson-Hall.'},
{tag:'M7',q:'Necesitas la topografía tridimensional de una superficie con resolución vertical de fracciones de nanómetro, y la muestra es un polímero blando no conductor. ¿Qué técnica usas?',opts:['SEM con recubrimiento de oro','TEM de alta resolución','Perfilometría de contacto','AFM en modo intermitente'],correct:3,exp:'El AFM no necesita vacío ni muestra conductora, y en modo intermitente minimiza las fuerzas laterales que dañarían un material blando. Su resolución vertical depende de la deflexión de la micropalanca y no de la punta, por eso es tan fina.'},
{tag:'M7',q:'Quieres identificar polimorfos de un principio activo farmacéutico que tienen idéntica fórmula pero distinto empaquetamiento cristalino. ¿Qué par de técnicas lo resuelve?',opts:['DLS junto con potencial zeta','Karl Fischer junto con TGA','Difracción de rayos X y DSC','Absorción atómica junto con BET'],correct:2,exp:'La difracción distingue el arreglo cristalino, que es justo lo que diferencia a los polimorfos, y el DSC confirma con puntos de fusión y entalpías distintos. La composición elemental sería idéntica en todos ellos y no aportaría nada.'},
{tag:'M7',q:'En un análisis por EDS de una película delgada de 50 nm sobre silicio, quieres reducir la contribución del sustrato a la señal. ¿Qué ajuste del equipo lo consigue?',opts:['Bajar el voltaje de aceleración','Subir el voltaje de aceleración','Aumentar el tiempo de conteo','Inclinar menos la muestra'],correct:0,exp:'El volumen de interacción crece con la energía del haz, así que bajar el voltaje lo encoge y confina la generación de rayos X a la capa superficial. El precio es que los elementos con líneas de alta energía dejan de excitarse y el conteo baja.'},
{tag:'M7',q:'Debes medir el diámetro hidrodinámico de nanopartículas en suspensión, incluida su capa de solvatación y su recubrimiento polimérico. ¿Qué técnica entrega ese dato?',opts:['Dispersión dinámica de luz','Microscopía electrónica de barrido','Difracción de rayos X','Espectroscopía de infrarrojo'],correct:0,exp:'El DLS mide fluctuaciones de la luz dispersada por el movimiento browniano y, vía Stokes-Einstein, entrega el diámetro hidrodinámico en el medio real. La microscopía mide el núcleo seco sobre una rejilla, que siempre sale menor.'},
