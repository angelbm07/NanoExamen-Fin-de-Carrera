<script>
/* ============================================================
   MOTOR DEL QUIZ · fábrica reutilizable con seguimiento
   El progreso se guarda en el navegador (localStorage), de modo
   que el muestreo prioriza lo que nunca has visto y lo que
   fallaste, en vez de repetirte las mismas preguntas.
   ============================================================ */

/* ---------- memoria de progreso ---------- */
var PROG=(function(){
  var CLAVE='efc_prog_v2', d={};
  try{ d=JSON.parse(localStorage.getItem(CLAVE)||'{}')||{} }catch(e){ d={} }
  function guardar(){ try{ localStorage.setItem(CLAVE,JSON.stringify(d)) }catch(e){} }
  function id(q){                                   /* huella estable del enunciado */
    var s=q.q, h=2166136261;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) }
    return (h>>>0).toString(36);
  }
  return {
    datos:d,
    id:id,
    registrar:function(q,acerto){
      var k=id(q), r=d[k]||{n:0,f:0,u:0};
      r.n++; if(!acerto)r.f++; r.a=acerto?1:0; r.u=Date.now();
      d[k]=r; guardar();
    },
    estado:function(q){ return d[id(q)]||null },
    prioridad:function(pool){
      var n=0,ok=0;
      pool.forEach(function(q){ var r=d[id(q)]; if(r){n++; if(r.a===1)ok++} });
      if(n<5)return {nivel:'sin datos',pct:null,n:n};
      var pct=Math.round(100*ok/n);
      return {nivel:pct<60?'alta':(pct<80?'media':'baja'),pct:pct,n:n};
    },
    resumen:function(pool){
      var vistos=0,fallados=0;
      pool.forEach(function(q){ var r=d[id(q)]; if(r){vistos++; if(r.a===0)fallados++} });
      return {total:pool.length,vistos:vistos,nuevos:pool.length-vistos,fallados:fallados};
    },
    borrar:function(){ d={}; try{localStorage.removeItem(CLAVE)}catch(e){} }
  };
})();

function mezclar(a){
  var c=a.slice();
  for(var k=c.length-1;k>0;k--){
    var j=Math.floor(Math.random()*(k+1));
    var t=c[k];c[k]=c[j];c[j]=t;
  }
  return c;
}

/* Ordena un conjunto por prioridad de repaso:
   1) nunca visto  2) fallado la última vez  3) acertado, el más antiguo primero.
   Dentro de cada grupo el orden es aleatorio, para que no se memorice la secuencia. */
function porPrioridad(pool){
  var nuevos=[],fallados=[],acertados=[];
  pool.forEach(function(q){
    var r=PROG.estado(q);
    if(!r)nuevos.push(q);
    else if(r.a===0)fallados.push(q);
    else acertados.push(q);
  });
  acertados.sort(function(x,y){ return (PROG.estado(x).u||0)-(PROG.estado(y).u||0) });
  return mezclar(nuevos).concat(mezclar(fallados)).concat(acertados);
}

/* Muestreo equilibrado: n reactivos repartidos por igual entre los módulos,
   tomando de cada uno los de mayor prioridad de repaso. */
function muestraEquilibrada(pool,n){
  var porTag={};
  pool.forEach(function(q){(porTag[q.tag]=porTag[q.tag]||[]).push(q)});
  var tags=G.map(function(m){return m.id}).filter(function(t){return porTag[t]});
  var sel=[],restante=n,quedan=tags.length;
  tags.forEach(function(t){
    var cuota=Math.round(restante/quedan);
    var disp=porPrioridad(porTag[t]);
    var toma=Math.min(cuota,disp.length);
    sel=sel.concat(disp.slice(0,toma));
    restante-=toma;quedan--;
  });
  if(sel.length<n){
    var usados={};sel.forEach(function(q){usados[PROG.id(q)]=1});
    var sobra=porPrioridad(pool.filter(function(q){return !usados[PROG.id(q)]}));
    sel=sel.concat(sobra.slice(0,n-sel.length));
  }
  return mezclar(sel);
}

function crearQuiz(cont,fuente,opc){
  opc=opc||{};
  var W=(typeof cont==='string')?document.getElementById(cont):cont;
  if(!W)return null;
  var orden=[],i=0,resp=[],previo=[],reloj=null,restante=0,limite=0;

  function pool(){ return (typeof fuente==='function')?fuente():fuente }

  function pintarCobertura(){
    if(!opc.cobertura)return;
    var e=document.getElementById(opc.cobertura);
    if(!e)return;
    var r=PROG.resumen(pool());
    var pct=Math.round(100*r.vistos/r.total);
    e.innerHTML='<span class="cob-barra"><i style="width:'+pct+'%"></i></span>'+
      '<span class="cob-txt">'+r.vistos+' de '+r.total+' vistos'+
      (r.nuevos?' · '+r.nuevos+' sin ver':'')+
      (r.fallados?' · <b>'+r.fallados+' por corregir</b>':'')+'</span>';
  }

  function pararReloj(){ if(reloj){clearInterval(reloj);reloj=null} }
  function fmt(s){ var m=Math.floor(s/60),x=s%60; return m+':'+(x<10?'0':'')+x }
  function pintarReloj(){
    var e=W.querySelector('.qreloj');
    if(!e)return;
    e.textContent='⏱ '+fmt(restante);
    e.classList.toggle('apremio',restante<=60);
  }
  function iniciarReloj(min){
    pararReloj();
    limite=min*60; restante=limite;
    reloj=setInterval(function(){
      restante--;
      if(restante<=0){ pararReloj(); restante=0; pintarReloj(); resultado(true) }
      else pintarReloj();
    },1000);
  }

  function arrancar(n,min){
    pararReloj();
    var cuantos=n||opc.muestra;
    orden=cuantos?muestraEquilibrada(pool(),cuantos):porPrioridad(pool());
    i=0;resp=new Array(orden.length).fill(null);
    previo=orden.map(function(q){return PROG.estado(q)});
    if(min)iniciarReloj(min);     /* antes de pintar, para que el reloj salga ya en la primera */
    pintar();pintarCobertura();
  }
  function tagHTML(t){
    return '<span class="tag" style="background:var(--'+t.toLowerCase()+'-bg);color:var(--'+t.toLowerCase()+')">'+t+'</span>';
  }
  function arriba(){
    var r=W.getBoundingClientRect();
    window.scrollTo(0,window.scrollY+r.top-70);
  }

  function pintar(){
    if(!orden.length){W.innerHTML='<div class="result"><div class="pct">Sin reactivos disponibles.</div></div>';return}
    var q=orden[i];
    var ya=resp[i]!==null;
    var prev=previo[i];                      /* estado ANTES de esta tanda, no el recién guardado */
    var marca=!prev?'<span class="qnuevo">nuevo</span>'
             :(prev.a===0?'<span class="qfallado">lo fallaste antes</span>':'<span class="qnuevo">repaso</span>');
    var h='<div class="quiz-bar"><i style="width:'+Math.round(100*(i+1)/orden.length)+'%"></i></div>'+
      '<div class="qmeta">'+tagHTML(q.tag)+marca+
      (reloj?'<span class="qreloj">⏱ '+fmt(restante)+'</span>':'')+
      '<span class="counter">'+(i+1)+' / '+orden.length+
      ' · contestadas '+resp.filter(function(x){return x!==null}).length+'</span></div>'+
      '<div class="qtext">'+q.q+'</div>'+
      (q.g?'<figure class="qfig"><div class="ftit">'+q.g.t+'</div>'+q.g.svg+
           (q.g.pie?'<figcaption>'+q.g.pie+'</figcaption>':'')+'</figure>':'');
    q.opts.forEach(function(o,k){
      var c='opt';
      if(ya){
        if(k===q.correct)c+=' correct';
        else if(k===resp[i])c+=' incorrect';
      }
      h+='<button class="'+c+'" data-k="'+k+'"'+(ya?' disabled':'')+'>'+
         '<span class="letra">'+String.fromCharCode(97+k)+')</span>'+o+'</button>';
    });
    h+='<div class="explain'+(ya?' show':'')+'"><b>'+
       (ya?(resp[i]===q.correct?'Correcto. ':'No. '):'')+'</b>'+q.exp+'</div>';
    h+='<div class="qnav">'+
       '<button class="btn ghost" data-nav="prev"'+(i===0?' disabled':'')+'>← Anterior</button>'+
       (i<orden.length-1?'<button class="btn" data-nav="next">Siguiente →</button>'
        :'<button class="btn" data-nav="fin">Ver resultado</button>')+
       '</div>';
    W.innerHTML=h;

    Array.prototype.forEach.call(W.querySelectorAll('.opt'),function(b){
      b.onclick=function(){
        if(resp[i]!==null)return;
        resp[i]=+b.getAttribute('data-k');
        PROG.registrar(q,resp[i]===q.correct);
        pintar();pintarCobertura();
      };
    });
    Array.prototype.forEach.call(W.querySelectorAll('[data-nav]'),function(b){
      var n=b.getAttribute('data-nav');
      b.onclick=function(){
        if(n==='prev'&&i>0){i--;pintar();arriba()}
        else if(n==='next'&&i<orden.length-1){i++;pintar();arriba()}
        else if(n==='fin')resultado();
      };
    });
  }

  function resultado(porTiempo){
    pararReloj();
    var ok=0,byModule={};
    orden.forEach(function(q,k){
      var bien=resp[k]===q.correct;
      if(bien)ok++;
      if(!byModule[q.tag])byModule[q.tag]={ok:0,n:0};
      byModule[q.tag].n++;
      if(bien)byModule[q.tag].ok++;
    });
    var pct=Math.round(100*ok/orden.length);
    var sinContestar=resp.filter(function(x){return x===null}).length;
    var veredicto;
    if(pct>=85)veredicto='Dominio sólido. A partir de aquí lo que rinde es el repaso espaciado de los temas más flojos, no volver a barrer todo.';
    else if(pct>=70)veredicto='Base razonable con huecos localizados. Vuelve a las secciones de lo que fallaste antes de repetir.';
    else if(pct>=50)veredicto='Comprensión parcial y desigual. Conviene releer antes de repetir, porque repetir sin releer solo mide lo mismo otra vez.';
    else veredicto='Falta una pasada de contenido antes de seguir con quizzes. Empieza por las secciones y las flashcards de este bloque.';

    var r=PROG.resumen(pool());
    var finTanda=opc.tanda?'<div class="tanda-fin">Fin de la tanda. '+
      (r.nuevos?'Quedan <b>'+r.nuevos+'</b> reactivos de este módulo que no has visto. Puedes parar aquí sin perder nada: el progreso queda guardado y la próxima tanda sigue donde esta terminó.'
               :'Ya pasaste por los '+r.total+' de este módulo. Las siguientes tandas repasan lo que fallaste y lo más antiguo.')+'</div>':'';
    var h=(porTiempo?'<div class="qtiempo">Se acabó el tiempo. Lo que quedó sin contestar cuenta como error, igual que en el examen.</div>':'')+
      '<div class="result"><div class="score">'+ok+' / '+orden.length+'</div>'+
      '<div class="pct">'+pct+' % de acierto'+(sinContestar?' · '+sinContestar+' sin contestar':'')+'</div>'+
      '<div class="veredicto">'+veredicto+'</div></div>'+
      '<div class="cobertura-res">Llevas <b>'+r.vistos+' de '+r.total+'</b> reactivos de este banco. '+
      (r.nuevos?'Quedan <b>'+r.nuevos+'</b> que no has visto nunca; el próximo intento empieza por ellos.'
               :'Ya pasaste por todos; el próximo intento empieza por los que fallaste y por los más antiguos.')+'</div>';
    if(Object.keys(byModule).length>1){
      h+='<div class="bymod"><h3>Desglose por módulo</h3>';
      G.forEach(function(m){
        var b=byModule[m.id];if(!b)return;
        var p=Math.round(100*b.ok/b.n);
        h+='<div class="modrow">'+
           '<span class="tag" style="background:var(--'+cls(m.id)+'-bg);color:var(--'+cls(m.id)+')">'+m.id+'</span>'+
           '<span class="bar"><i style="width:'+p+'%;background:var(--'+cls(m.id)+')"></i></span>'+
           '<span class="num">'+b.ok+'/'+b.n+' · '+p+'%</span></div>';
      });
      h+='</div>';
    }
    h+=finTanda;
    h+='<div class="btn-row">'+
       '<button class="btn" data-nav2="retry">Siguiente tanda</button>'+
       '<button class="btn ghost" data-nav2="ver">Ver respuestas</button></div>';
    W.innerHTML=h;
    arriba();
    enlazar2();
    pintarCobertura();
  }

  function revisar(){
    var h='<div class="btn-row"><button class="btn ghost" data-nav2="back">← Volver al resultado</button></div><div class="revisar">';
    orden.forEach(function(q,k){
      h+='<div class="rev-item">'+tagHTML(q.tag)+
         '<span class="counter"> · '+(k+1)+'</span>'+
         '<div class="rq">'+q.q+'</div>'+
         (q.g?'<figure class="qfig"><div class="ftit">'+q.g.t+'</div>'+q.g.svg+'</figure>':'');
      q.opts.forEach(function(o,j){
        var c='opt';
        if(j===q.correct)c+=' correct';
        else if(j===resp[k])c+=' incorrect';
        h+='<div class="'+c+'"><span class="letra">'+String.fromCharCode(97+j)+')</span>'+o+
           (j===resp[k]?' <b>← tu respuesta</b>':'')+'</div>';
      });
      if(resp[k]===null)h+='<div class="explain show"><b>Sin contestar. </b>'+q.exp+'</div>';
      else h+='<div class="explain show">'+q.exp+'</div>';
      h+='</div>';
    });
    h+='</div><div class="btn-row"><button class="btn ghost" data-nav2="back">← Volver al resultado</button></div>';
    W.innerHTML=h;
    arriba();
    enlazar2();
  }

  function enlazar2(){
    Array.prototype.forEach.call(W.querySelectorAll('[data-nav2]'),function(b){
      var n=b.getAttribute('data-nav2');
      b.onclick=function(){
        if(n==='retry'){ if(opc.modos)pintarModos(); else arrancar() }
        else if(n==='ver')revisar();
        else resultado();
      };
    });
  }

  function pintarModos(){
    pararReloj();
    W.innerHTML='<div class="modos">'+opc.modos.map(function(m,k){
      return '<button class="modo" data-k="'+k+'"><span class="mo-n">'+m.n+'</span>'+
             '<span class="mo-t">'+m.t+'</span>'+
             '<span class="mo-d">'+(m.min?m.min+' minutos':'sin límite de tiempo')+'</span></button>';
    }).join('')+'</div>'+
    '<div class="modos-pie">El examen real va contra reloj. Entrenar con el cronómetro encendido cambia cómo lees un enunciado: aprendes a descartar rápido en vez de releer.</div>';
    Array.prototype.forEach.call(W.querySelectorAll('.modo'),function(b){
      b.onclick=function(){ var m=opc.modos[+b.getAttribute('data-k')]; arrancar(m.n,m.min) };
    });
    pintarCobertura();
  }

  if(opc.modos)pintarModos(); else arrancar();
  return {arrancar:arrancar,modos:pintarModos,resultado:resultado,revisar:revisar,cobertura:pintarCobertura,
    estado:function(){return {n:orden.length,i:i,resp:resp,orden:orden}}};
}

/* --- instanciación --- */
window.__quiz=crearQuiz('quizwrap',QUIZ,{cobertura:'cob-QUIZ',modos:[
  {n:20, t:'Repaso corto',      min:25},
  {n:60, t:'Media sesión',      min:75},
  {n:200,t:'Simulacro completo',min:250},
  {n:200,t:'Sin reloj',         min:0}
]});
window.__quizMod={};
G.forEach(function(m){
  var pool=QUIZ.filter(function(q){return q.tag===m.id});
  var et=document.getElementById('qn-'+m.id);
  if(et)et.textContent=pool.length;
  var ed=document.getElementById('qd-'+m.id);
  if(ed)ed.textContent='tandas de 10 · primero los que no has visto';
  var pr=document.getElementById('pri-'+m.id);
  if(pr){
    var P=PROG.prioridad(pool);
    pr.className='prio p-'+P.nivel.replace(' ','');
    pr.textContent=P.pct===null
      ? 'prioridad: sin datos todavía'
      : 'prioridad '+P.nivel+' · '+P.pct+' % sobre '+P.n+' contestados';
  }
  window.__quizMod[m.id]=crearQuiz('quizwrap-'+m.id,pool,{cobertura:'cob-'+m.id,muestra:10,tanda:true});
});

/* --- botón de reinicio del progreso --- */
(function(){
  var b=document.getElementById('reset-prog');
  if(!b)return;
  b.onclick=function(){
    if(!confirm('Esto borra el registro de qué reactivos has contestado en este navegador. ¿Continuar?'))return;
    PROG.borrar();
    window.__quiz.arrancar();
    G.forEach(function(m){ if(window.__quizMod[m.id])window.__quizMod[m.id].arrancar() });
  };
})();
</script>

<script>
/* ============================================================
   RENDER DEL MAPA DE CONCEPTOS
   SVG generado desde MAPA. Al tocar un nodo se resaltan sus
   aristas y el panel explica POR QUÉ se conecta con cada vecino.
   ============================================================ */
(function(){
  var W=document.getElementById('mapawrap');
  if(!W)return;

  var COLW=186, COLGAP=46, ROWH=54, PADX=14, PADY=30;
  var NW=160, NH=34;
  var cols=Math.max.apply(null,MAPA.nodos.map(function(n){return n.c}))+1;
  var rows=Math.max.apply(null,MAPA.nodos.map(function(n){return n.f}))+1;
  var ancho=PADX*2+cols*COLW+(cols-1)*COLGAP;
  var alto=PADY*2+rows*ROWH;

  var pos={};
  MAPA.nodos.forEach(function(n){
    pos[n.id]={x:PADX+n.c*(COLW+COLGAP), y:PADY+n.f*ROWH, n:n};
  });
  var vecinos={};
  MAPA.aristas.forEach(function(a){
    (vecinos[a[0]]=vecinos[a[0]]||[]).push({id:a[1],por:a[2]});
    (vecinos[a[1]]=vecinos[a[1]]||[]).push({id:a[0],por:a[2]});
  });

  var TITCOL=['Termodinámica y cinética','Superficie y nanoescala','Estructura cristalina','Electrones y luz','Medición y proceso'];

  function cx(id){return pos[id].x+NW/2}
  function cy(id){return pos[id].y+NH/2}

  var svg='<svg id="mapasvg" viewBox="0 0 '+ancho+' '+alto+'" role="img" aria-label="Mapa de conceptos del examen">';
  TITCOL.forEach(function(t,k){
    if(k>=cols)return;
    svg+='<text class="mcol" x="'+(PADX+k*(COLW+COLGAP))+'" y="18">'+t+'</text>';
  });
  MAPA.aristas.forEach(function(a,i){
    svg+='<path class="marista" data-a="'+a[0]+'" data-b="'+a[1]+'" id="ar'+i+'" d="M'+cx(a[0])+','+cy(a[0])+' L'+cx(a[1])+','+cy(a[1])+'"/>';
  });
  MAPA.nodos.forEach(function(n){
    var p=pos[n.id];
    svg+='<g class="mnodo '+n.m.toLowerCase()+'" data-id="'+n.id+'" tabindex="0" role="button" aria-label="'+n.t+', módulo '+n.m+'">'+
      '<rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="7"/>'+
      '<text x="'+(p.x+11)+'" y="'+(p.y+NH/2+4)+'">'+n.t+'</text>'+
      '</g>';
  });
  svg+='</svg>';

  W.innerHTML='<div class="mapa-grid"><div class="mapa-lienzo">'+svg+'</div>'+
    '<aside class="mapa-panel" id="mapapanel"></aside></div>';

  var panel=document.getElementById('mapapanel');
  var nodos=W.querySelectorAll('.mnodo');
  var aristas=W.querySelectorAll('.marista');

  function vacio(){
    panel.innerHTML='<div class="mp-vacio"><b>Toca un concepto.</b> El panel te dice con qué se conecta y, sobre todo, <b>por qué</b>. '+
      'Esa es la parte que el examen pregunta: no qué es la ley de Bragg, sino que el mismo pico que da el espaciado da también el tamaño de cristalito.</div>';
  }
  vacio();

  function pintar(id){
    var n=pos[id].n, vs=vecinos[id]||[];
    Array.prototype.forEach.call(nodos,function(g){
      var gid=g.getAttribute('data-id');
      g.classList.toggle('sel',gid===id);
      g.classList.toggle('vec',vs.some(function(v){return v.id===gid}));
      g.classList.toggle('apag',gid!==id&&!vs.some(function(v){return v.id===gid}));
    });
    Array.prototype.forEach.call(aristas,function(p){
      var on=p.getAttribute('data-a')===id||p.getAttribute('data-b')===id;
      p.classList.toggle('on',on);
      p.classList.toggle('off',!on);
    });
    panel.innerHTML='<span class="tag" style="background:var(--'+n.m.toLowerCase()+'-bg);color:var(--'+n.m.toLowerCase()+')">'+n.m+'</span>'+
      '<h3>'+n.t+'</h3>'+
      '<div class="mp-sub">'+vs.length+(vs.length===1?' conexión':' conexiones')+'</div>'+
      vs.map(function(v){
        var o=pos[v.id].n;
        return '<div class="mp-con"><button class="mp-ir" data-id="'+v.id+'">'+o.t+'</button>'+
               '<div class="mp-por">'+v.por+'</div></div>';
      }).join('')+
      '<button class="btn mp-mod" data-mod="'+n.m+'">Abrir módulo '+n.m+'</button>';
    Array.prototype.forEach.call(panel.querySelectorAll('.mp-ir'),function(b){
      b.onclick=function(){pintar(b.getAttribute('data-id'))};
    });
    var bm=panel.querySelector('.mp-mod');
    bm.onclick=function(){
      var t=Array.prototype.filter.call(document.getElementById('tabs').children,function(x){return x.textContent===bm.getAttribute('data-mod')})[0];
      if(t)t.click();
    };
  }

  Array.prototype.forEach.call(nodos,function(g){
    g.onclick=function(){pintar(g.getAttribute('data-id'))};
    g.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();pintar(g.getAttribute('data-id'))} };
  });

  /* contador en la cabecera */
  var c=document.getElementById('mapacount');
  if(c)c.textContent=MAPA.nodos.length+' conceptos · '+MAPA.aristas.length+' conexiones explicadas';
})();
</script>
<script>
/* ============================================================
   AJUSTES DE LECTURA
   Control del usuario sobre densidad, tipografía y movimiento.
   Todo se guarda en el navegador y se aplica como atributos en
   <html>, de modo que el CSS hace el resto sin recalcular nada.
   ============================================================ */
(function(){
  var CLAVE='efc_ajustes_v1';
  var DEF={texto:'1', linea:'normal', ancho:'normal', densidad:'completo', mov:'normal', tipo:'normal'};
  var A;
  try{ A=Object.assign({},DEF,JSON.parse(localStorage.getItem(CLAVE)||'{}')) }catch(e){ A=Object.assign({},DEF) }

  function aplicar(){
    var r=document.documentElement;
    r.setAttribute('data-texto',A.texto);
    r.setAttribute('data-linea',A.linea);
    r.setAttribute('data-ancho',A.ancho);
    r.setAttribute('data-densidad',A.densidad);
    r.setAttribute('data-mov',A.mov);
    r.setAttribute('data-tipo',A.tipo);
    try{ localStorage.setItem(CLAVE,JSON.stringify(A)) }catch(e){}
  }

  /* si el sistema pide menos movimiento, se respeta por defecto */
  try{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches && !localStorage.getItem(CLAVE)) A.mov='reducido';
  }catch(e){}
  aplicar();

  /* ---- panel ---- */
  var GRUPOS=[
   {k:'texto',  t:'Tamaño del texto', o:[['0.92','Menor'],['1','Normal'],['1.14','Mayor'],['1.3','Máximo']]},
   {k:'linea',  t:'Interlineado',     o:[['compacto','Compacto'],['normal','Normal'],['amplio','Amplio']]},
   {k:'ancho',  t:'Ancho de línea',   o:[['estrecho','Estrecho'],['normal','Normal'],['ancho','Ancho']]},
   {k:'tipo',   t:'Tipografía',       o:[['normal','Normal'],['legible','Alta legibilidad']]},
   {k:'densidad',t:'Densidad',        o:[['completo','Todo el desarrollo'],['esencial','Solo lo esencial']]},
   {k:'mov',    t:'Movimiento',       o:[['normal','Normal'],['reducido','Reducido']]}
  ];

  var caja=document.createElement('div');
  caja.className='ajustes';
  caja.innerHTML='<button class="aj-btn" id="ajbtn" aria-expanded="false" aria-controls="ajpanel">Ajustes de lectura</button>'+
    '<div class="aj-panel" id="ajpanel" hidden>'+
    GRUPOS.map(function(g){
      return '<div class="aj-g"><div class="aj-t">'+g.t+'</div><div class="aj-o" data-k="'+g.k+'">'+
        g.o.map(function(o){return '<button data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+
        '</div></div>';
    }).join('')+
    '<div class="aj-nota">«Solo lo esencial» deja a la vista el primer párrafo de cada sección, los formularios, las tablas, las figuras y los problemas, y recoge el desarrollo. Cada sección conserva su botón para desplegarlo.</div>'+
    '<button class="btn ghost aj-reset" id="ajreset">Volver a los valores por defecto</button>'+
    '</div>';

  var head=document.querySelector('header.top');
  head.appendChild(caja);

  var btn=document.getElementById('ajbtn'), panel=document.getElementById('ajpanel');
  btn.onclick=function(){
    var ab=btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded',String(!ab));
    panel.hidden=ab;
  };
  function marcar(){
    GRUPOS.forEach(function(g){
      var cont=panel.querySelector('.aj-o[data-k="'+g.k+'"]');
      Array.prototype.forEach.call(cont.children,function(b){
        b.classList.toggle('on',b.getAttribute('data-v')===A[g.k]);
        b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===A[g.k]));
      });
    });
  }
  GRUPOS.forEach(function(g){
    var cont=panel.querySelector('.aj-o[data-k="'+g.k+'"]');
    Array.prototype.forEach.call(cont.children,function(b){
      b.onclick=function(){ A[g.k]=b.getAttribute('data-v'); aplicar(); marcar(); };
    });
  });
  document.getElementById('ajreset').onclick=function(){ A=Object.assign({},DEF); aplicar(); marcar(); };
  marcar();

  /* ---- densidad: marcar el párrafo guía de cada sección y añadir el botón ---- */
  document.querySelectorAll('section.block').forEach(function(sec){
    var cards=sec.querySelectorAll(':scope > .card');
    if(cards.length<2)return;
    cards[0].classList.add('guia');
    for(var i=1;i<cards.length;i++)cards[i].classList.add('desarrollo');
    var b=document.createElement('button');
    b.className='mas-desarrollo';
    b.textContent='Mostrar el desarrollo (' + (cards.length-1) + ')';
    b.onclick=function(){
      var ab=sec.classList.toggle('abierta');
      b.textContent=ab?'Recoger el desarrollo':'Mostrar el desarrollo ('+(cards.length-1)+')';
    };
    cards[0].insertAdjacentElement('afterend',b);
  });
})();
</script>
