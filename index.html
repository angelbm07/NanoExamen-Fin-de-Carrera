 x:'Son cuatro propiedades <b>independientes</b> leídas de la misma curva. Un material puede ser muy rígido y poco resistente, o muy resistente y nada dúctil. Usar el área instantánea en lugar de A₀ da el esfuerzo <b>verdadero</b>, que no baja tras el máximo: la caída de la curva ingenieril es un artefacto de dividir siempre entre A₀.'}}]},
  {t:'De orbitales a bandas, y el dopaje',b:[
   {p:['Las bandas no son un concepto aparte: son la extensión directa de la teoría de orbitales moleculares. N orbitales atómicos dan N niveles en un rango acotado; con N del orden de 10²³ la separación entre niveles consecutivos es de unos 10⁻²³ eV, indistinguible de un continuo.']},
   {eq:EQ.gap},
   {tabla:{th:['Material','Eg (eV)','Umbral','Aspecto'],tr:[
     ['TiO₂ anatasa','3.2','388 nm (UV)','Blanco: no absorbe visible'],
     ['CdS','2.4','517 nm','Amarillo-naranja'],
     ['Si','1.12','1107 nm (IR)','Gris oscuro: absorbe todo el visible']]}},
   {p:['El color observado es el <b>complementario</b> de lo absorbido, y ese paso es el que más se falla. Un Eg de 2.0 eV da umbral en 620 nm: absorbe violeta, azul y verde, y se ve rojo-anaranjado.']},
   {fig:FIG.bandas},
   {p:['Dos piezas que sostienen el modelo. Por el <b>principio de exclusión de Pauli</b>, en un mismo estado orbital caben como máximo <b>dos electrones</b>, y solo si difieren en el espín: es lo que impide que todos los electrones se amontonen en el nivel más bajo y lo que obliga a llenar las bandas de abajo hacia arriba. Y en un <b>semiconductor intrínseco</b>, puro, cada electrón que cruza el gap deja atrás un hueco, de modo que <b>n = p</b> exactamente. Dopar rompe esa igualdad: en tipo n los electrones son mayoritarios y en tipo p lo son los huecos.']},
   {p:['De la tabla sale el procedimiento completo para predecir color: calcular el umbral con λ = 1240/Eg, ver qué parte del visible queda por debajo (eso se absorbe) y concluir que el color observado es <b>el complementario de lo absorbido</b>. Un material que absorbe por debajo de 517 nm tiene Eg = 1240/517 = <b>2.4 eV</b>, se come violeta, azul y verde, y se ve <b>amarillo-anaranjado</b>. Un material transparente e incoloro no absorbe nada del visible, así que su gap debe superar <b>3.1 eV</b>, el extremo violeta.']},
   {p:['Ese mismo 1240 conecta con las transiciones atómicas. En el hidrógeno la separación entre niveles crece al subir, así que el salto <b>4→2 libera más energía que el 3→2</b>: mayor frecuencia y por tanto <b>menor longitud de onda</b>, ya que E = hc/λ.']},
   {p:['El dopaje <b>no cambia el ancho del gap</b>: introduce niveles dentro de él. El fósforo en silicio deja un nivel donador a unos 0.045 eV bajo la banda de conducción, y como kT a temperatura ambiente vale 0.026 eV, ese electrón se libera con facilidad. Resultado: tipo n. El boro deja un nivel aceptor cerca de la banda de valencia: tipo p.']},
   {p:['La magnitud del efecto sorprende: una parte por millón de dopante aporta muchísimos más portadores que los pocos que cruzan el gap térmicamente en el material puro, de modo que la conductividad cambia en <b>varios órdenes de magnitud</b>. Por eso el silicio electrónico exige purezas extremas antes de doparlo: cualquier impureza residual actuaría como dopante incontrolado y arruinaría tanto el tipo de portador como su concentración.']},
   {deep:{t:'La trampa de la temperatura',b:[
     {p:['El comportamiento de la resistividad con la temperatura distingue a un metal de un semiconductor, y las direcciones son opuestas.'],},
     {ul:['<b>Metal</b>: T sube ⇒ ρ sube. El número de portadores ya es fijo; lo que crece es la dispersión por fonones.',
          '<b>Semiconductor</b>: T sube ⇒ ρ baja. El número de portadores crece exponencialmente al cruzar el gap, y ese efecto domina sobre la dispersión.']},
     {p:['De aquí sale una medición diagnóstica barata: si la resistencia de una muestra desconocida baja al calentarla, es semiconductora.']}
   ]}}
  ,
   {form:[
 ['E<sub>g</sub>(eV) = 1240 / λ(nm)','<b>Brecha prohibida</b> a partir del borde de absorción. Es la relación más usada del módulo.','λ en nm'],

 ['σ = q(n·µ<sub>e</sub> + p·µ<sub>h</sub>)','<b>Conductividad</b> con los dos tipos de portador. En un extrínseco domina uno de los dos términos.',''],

   {prob:{t:'Del color observado al gap, y de vuelta',
 d:'Una suspensión de puntos cuánticos de CdSe emite en 540 nm. Otro lote del mismo material, con partículas más pequeñas, emite en 480 nm. El CdSe masivo tiene E<sub>g</sub> = 1.74 eV.',
 p:['Gap efectivo del primer lote: E = 1240/540 = <b>2.30 eV</b>.',
    'Gap efectivo del segundo: E = 1240/480 = <b>2.58 eV</b>.',
    'Energía de confinamiento en cada caso: 2.30 − 1.74 = <b>0.56 eV</b> y 2.58 − 1.74 = <b>0.84 eV</b>.',
    'Como el confinamiento escala con 1/L², la razón de tamaños es L₁/L₂ = √(0.84/0.56) = √1.50 = <b>1.23</b>: el segundo lote es un <b>19 % más pequeño</b>.',
    'El color percibido de la <b>emisión</b> es directo: 540 nm se ve verde y 480 nm azul. No hay que tomar el complementario, porque no se trata de absorción.'],
 r:'Gaps efectivos de 2.30 y 2.58 eV; el lote azul tiene partículas un 22 % menores.',
 x:'Distinguir <b>emisión</b> de <b>absorción</b>. En absorción, el color que se ve es el complementario del absorbido: un sólido que absorbe por debajo de 517 nm se ve amarillo-naranja, no verde. En emisión, el color que se ve es el emitido.'}},
   {p:['El <b>nivel de Fermi</b> es el concepto que cierra el tema de bandas y aparece en el examen con regularidad. Formalmente es el potencial químico electrónico: la energía a la que la probabilidad de ocupación vale exactamente <b>1/2</b> según la distribución de Fermi-Dirac. A cero absoluto es la frontera nítida entre estados llenos y vacíos; a temperatura finita esa frontera se difumina en un ancho del orden de kT.']},
   {ul:['En un <b>metal</b>, E<sub>F</sub> cae <b>dentro</b> de una banda parcialmente llena. Por eso hay estados disponibles a energía infinitesimal por encima y la conducción no cuesta nada.',
        'En un <b>semiconductor intrínseco</b>, E<sub>F</sub> queda cerca de la <b>mitad del gap</b>, en una región sin estados: la probabilidad 1/2 es una construcción matemática, no un estado real ocupado.',
        'Al dopar <b>tipo n</b>, E<sub>F</sub> <b>sube</b> hacia la banda de conducción; al dopar <b>tipo p</b>, <b>baja</b> hacia la de valencia. Ese desplazamiento, y no un cambio del ancho del gap, es lo que el dopaje produce.']},
   {p:['De ahí sale la <b>unión p-n</b>: al poner en contacto los dos materiales, los niveles de Fermi deben igualarse en el equilibrio, y para lograrlo las bandas se doblan. Ese doblado es el <b>potencial de contacto</b> que crea la zona de agotamiento y el campo interno que separa pares electrón-hueco. Toda la electrónica de semiconductores, el LED, la celda solar y el fotodetector salen de esa única condición de equilibrio.']},
   {p:['El mismo criterio explica el contacto <b>metal-semiconductor</b>: si la diferencia de funciones de trabajo obliga a doblar las bandas hacia arriba, aparece una <b>barrera Schottky</b> rectificante; si no, el contacto es <b>óhmico</b>. Y la <b>función de trabajo</b> es precisamente la energía para arrancar un electrón desde E<sub>F</sub> hasta el vacío, que es lo que miden la fotoemisión y el XPS.']}]},
  {t:'Estado sólido: red, base y celda',b:[
   {p:['Un cristal se define como una <b>red</b> más una <b>base</b>. La red es el conjunto infinito de puntos equivalentes generado por traslación, un objeto puramente matemático. La <b>base</b> es el átomo o grupo de átomos que se coloca <b>idénticamente en cada punto de red</b>. Decir que la base es «el plano inferior que sostiene la estructura» es un distractor frecuente y es falso: no tiene nada que ver con soporte físico.']},
   {eq:EQ.red},
   {p:['Esa es la condición de equivalencia: a partir de los <b>vectores de traslación</b> a₁, a₂ y a₃, el vector de posición de cualquier punto equivalente se obtiene con coeficientes <b>enteros</b>. Si los coeficientes pudieran ser fraccionarios la estructura no sería periódica, y es exactamente lo que distingue una red de un conjunto cualquiera de puntos.']},
   {p:['Según el orden que presenten, los materiales se clasifican así. <b>Monocristalino</b>: un solo arreglo periódico en todo el volumen, sin fronteras de grano. <b>Policristalino</b>: muchos cristales pequeños con orientaciones distintas, separados por fronteras de grano. <b>Amorfo</b>: sin ordenamiento periódico de largo alcance, aunque puede conservar orden local entre vecinos inmediatos. Esa es la razón de que un amorfo dé un halo ancho en difracción y no picos.']},
   {p:['La distinción entre <b>celda primitiva</b> y <b>celda convencional</b> se pregunta tal cual. La primitiva contiene <b>exactamente un punto de red</b> y es la de menor volumen posible; la convencional puede contener varios —dos en BCC, cuatro en FCC— y se prefiere porque <b>refleja la simetría cúbica</b> del cristal, que la primitiva oculta. Se gana claridad geométrica a cambio de usar una celda mayor.']},
   {fig:FIG.celdas},
   {p:['Un último concepto del espacio recíproco: la <b>primera zona de Brillouin</b> es la celda primitiva de la red recíproca construida por el método de Wigner-Seitz, es decir la región más próxima a un punto recíproco que a cualquier otro. Su importancia es que <b>contiene toda la información no redundante</b> sobre los estados electrónicos y vibracionales: cualquier vector de onda fuera de ella equivale a uno de dentro. No es una distancia que recorra un rayo X ni un volumen del cristal real.']}
  ,

     ['FCC','4','12','<b>0.74</b>'],
     ['HCP','—','12','<b>0.74</b>']]}},
   {p:['Dos números que se confunden y no son lo mismo: <b>átomos por celda</b> y <b>número de coordinación</b>. En FCC hay 4 átomos por celda (ocho vértices que aportan 1/8 más seis centros de cara que aportan 1/2) y 12 vecinos más próximos. FCC y HCP comparten eficiencia 0.74: lo único que cambia es la secuencia de apilamiento, ABCABC frente a ABAB, y esa diferencia altera el número de sistemas de deslizamiento, por lo que los metales FCC como aluminio y cobre son más dúctiles que los HCP como zinc y magnesio.']},
   {eq:EQ.cristal},
   {p:['La densidad teórica exige cuidado con las unidades. Para aluminio FCC con a = 0.405 nm: la masa de la celda es 4 × 26.98 / 6.022×10²³ = 1.792×10⁻²² g, y el volumen es a³ con <b>a convertido a centímetros</b>, es decir 4.05×10⁻⁸ cm, lo que da 6.64×10⁻²³ cm³ y una densidad de 2.70 g/cm³. Si el resultado sale desviado por 10⁶ el diagnóstico es inmediato: <b>no se elevó al cubo el factor de conversión</b>, porque (10²)³ = 10⁶.']},
   {p:['Comparar la densidad calculada con la medida es un diagnóstico de defectos. Si la medida es <b>menor</b>, hay <b>vacancias</b>: mismo volumen de celda, menos masa. Si es <b>mayor</b>, hay <b>átomos intersticiales</b> que añaden masa sin cambiar el volumen. El número de coordinación no entra en el cálculo.']},
   {fig:FIG.miller},
   {p:['Los <b>índices de Miller</b> se obtienen tomando los recíprocos de las intersecciones y reduciendo a los enteros más pequeños. Un plano que corta en 1/2, 1 e infinito da recíprocos 2, 1 y 0, es decir <b>(210)</b>. Se usan recíprocos por una razón concreta: un plano paralelo a un eje lo corta en el infinito, y su recíproco es cero en lugar de infinito. Los índices nunca llevan fracciones y el orden de los ejes importa.']},
   {eq:EQ.bragg},
   {p:['La ley de Bragg se usa principalmente para <b>determinar distancias interplanares y, con ellas, la estructura cristalina</b> a partir de los ángulos donde aparece interferencia constructiva. Conviene recordar que θ es el ángulo entre el haz y el plano, es decir la mitad del 2θ que reporta el equipo.']},
   {p:['Al indexar un difractograma cúbico, la secuencia de h²+k²+l² identifica la red: <b>3, 4, 8, 11</b> es FCC (índices todos pares o todos impares) y <b>2, 4, 6, 8</b> es BCC (h+k+l par). La cúbica simple no tiene extinciones y da 1, 2, 3, 4.']},
   {p:['Y los defectos no son fallas sino el mecanismo: la deformación plástica ocurre por <b>movimiento de dislocaciones</b>. Endurecer un metal consiste en obstaculizarlas, y el <b>trabajo en frío</b> lo logra multiplicando su densidad hasta que se estorban entre sí. Las otras vías son solución sólida, precipitados y frontera de grano según Hall-Petch.']}
  ,
   {fig:FIG.plano_celda},
   {form:[
 ['ρ = (n·A) / (V<sub>c</sub>·N<sub>A</sub>)','<b>Densidad teórica</b>; n son los átomos por celda (SC 1, BCC 2, FCC 4).','V<sub>c</sub> en cm³; 1 nm = 10⁻⁷ cm, y al cubo 10⁻²¹'],
 ['FEA = n·(4/3)πr³ / V<sub>c</sub>','<b>Factor de empaquetamiento</b>: SC 0.52, BCC 0.68, FCC y HCP 0.74.','adimensional'],
 ['FCC: a = 4r/√2  ·  BCC: a = 4r/√3  ·  SC: a = 2r','Relación entre <b>parámetro de red y radio atómico</b>, según por dónde se toquen los átomos.',''],
 ['(hkl) = recíprocos de las intersecciones','<b>Índices de Miller</b>: se toman recíprocos y se reducen a enteros mínimos. Nunca llevan fracciones.',''],
 ['d<sub>hkl</sub> = a / √(h²+k²+l²)','<b>Espaciado interplanar</b> en sistema cúbico.','d y a en las mismas unidades'],

   {prob:{t:'Densidad teórica del aluminio, cuidando las unidades',
 d:'Aluminio con estructura FCC, parámetro de red a = 0.405 nm y masa molar 26.98 g/mol. N<sub>A</sub> = 6.022×10²³ mol⁻¹.',
 p:['Átomos por celda en FCC: 8 vértices × 1/8 + 6 caras × 1/2 = <b>4</b>.',
    'Convierte el parámetro <b>antes</b> de elevar al cubo: a = 0.405 nm = 0.405×10⁻⁷ cm = 4.05×10⁻⁸ cm.',
    'Volumen de celda: V<sub>c</sub> = (4.05×10⁻⁸)³ = <b>6.643×10⁻²³ cm³</b>.',
    'ρ = (4 × 26.98) / (6.643×10⁻²³ × 6.022×10²³) = 107.92 / 40.00 = <b>2.70 g/cm³</b>.',
    'Comprobación contra el valor experimental del aluminio, 2.70 g/cm³: coinciden, lo que indica muy pocas vacancias.'],
 r:'ρ = 2.70 g/cm³, en acuerdo con el valor experimental.',
 x:'Obtener 2.7×10⁶ delata haber convertido nm a cm <b>sin elevar al cubo</b> el factor: el error es exactamente (10²)³ = 10⁶. Y si la densidad medida saliera un 1.5 % por debajo de la teórica, la explicación serían <b>vacancias</b>: misma celda, menos masa.'}}]},
  {t:'Enlace iónico y estabilidad de la red',b:[
   {p:['La energía reticular crece con el producto de las cargas y disminuye con la distancia entre centros iónicos. A igual carga, <b>iones más pequeños se acercan más</b>, la atracción electrostática es mayor y hace falta más energía para romper la red: por eso su punto de fusión es superior.']},
   {p:['La diferencia mecánica entre metálico e iónico tiene explicación puramente geométrica. En un metal, al deslizarse un plano los cationes cambian de vecinos pero el mar electrónico los sigue rodeando igual, así que se deforma sin romperse. En un iónico, deslizar media celda enfrenta cationes con cationes: la interacción pasa de atractiva a repulsiva de golpe y el cristal se fractura por planos definidos.']},
   {p:['Un sólido que funde a <b>1410 °C, no conduce y es frágil</b> apunta a <b>red covalente</b> tridimensional, como el silicio o el cuarzo: enlaces direccionales en todas las direcciones, sin portadores libres. Un metal conduciría, un molecular fundiría muy por debajo y un iónico conduciría al fundirse.']},
   {p:['El mismo elemento puede dar materiales opuestos según su arreglo. <b>Diamante y grafito</b> son ambos carbono puro: el diamante es sp³ con red covalente tridimensional y todos los electrones localizados, de ahí su dureza y su aislamiento; el grafito es sp² en capas, con electrones deslocalizados en el sistema pi que conducen dentro del plano y fuerzas débiles entre capas que permiten exfoliarlo. La diferencia no es la pureza: es <b>el arreglo y la hibridación</b>.']}
  ]},
  {t:'La cuántica que sí se pregunta',b:[
   {eq:EQ.caja},
   {p:['Tres conclusiones, y la tercera es la rentable. La energía está cuantizada; el estado fundamental <b>nunca vale cero</b> por el principio de incertidumbre; y <b>E escala como 1/L²</b>, así que reducir la caja a la mitad cuadruplica la energía. Esa dependencia es exactamente el confinamiento cuántico de los puntos cuánticos.']},
   {p:['Para identificar un orbital a partir de sus números cuánticos hay que respetar los tres rangos: n entero desde 1; <b>l de 0 a n−1</b>; y <b>m_l de −l a +l</b>. Un orbital <b>4f</b> tiene n = 4 y l = 3, así que m_l solo puede ir de −3 a +3: una combinación con m_l = −4 es imposible y se descarta sin más análisis.']},
   {p:['Las <b>series espectrales del hidrógeno</b> se nombran por el nivel al que <b>cae</b> el electrón, no por el de partida: Lyman termina en n = 1 (ultravioleta), Balmer en n = 2 (visible), Paschen en n = 3, Brackett en n = 4 y <b>Pfund en n = 5</b>, ya en el infrarrojo lejano. Cuanto mayor el nivel final, menor la energía del fotón emitido y mayor su longitud de onda.']},
   {p:['Los cuatro números cuánticos no son convención: cada uno sale de imponer que la función de onda sea aceptable en una dimensión del problema. El azimutal l va de 0 a n−1, y de ahí que no exista un orbital 1p. Las 2, 6, 10 y 14 columnas de los bloques s, p, d y f son exactamente 2(2l+1).']},
   {p:['Bohr es exacto para hidrógeno e hidrogenoides y falla para todo lo demás, porque ignora la repulsión entre electrones y el apantallamiento. Ese apantallamiento rompe la degeneración y hace que la energía dependa también de l: de ahí que el 4s se llene antes que el 3d, algo que en hidrógeno no tendría sentido.']},
   {p:['Y en cálculo computacional: <b>Hartree-Fock ignora la correlación electrónica</b>; DFT la aproxima mediante un funcional cuya elección afecta los resultados. Al expandir en un conjunto base finito, el problema se vuelve matricial de valores propios, det(H − ES) = 0.']}
  ]}
 ],
 flash:[
  ['¿Por qué un metal es dúctil y un sólido iónico frágil?','Al deslizar un plano, en el metal el mar electrónico sigue rodeando a todos los cationes. En el iónico se enfrentan cargas iguales y la interacción pasa a repulsiva.'],
  ['Al hervir agua, ¿qué se rompe?','Puentes de hidrógeno entre moléculas. Los enlaces O–H quedan intactos: el vapor sigue siendo H₂O.'],
  ['¿Qué le hace el dopaje al gap del silicio?','Nada. Introduce niveles donadores o aceptores DENTRO del gap. El ancho del gap es propiedad del silicio.'],
  ['Resistividad frente a temperatura: metal y semiconductor','Metal: T↑ ⇒ ρ↑ (dispersión por fonones). Semiconductor: T↑ ⇒ ρ↓ (los portadores crecen exponencialmente).'],
  ['Átomos por celda y coordinación en FCC','4 átomos por celda, coordinación 12, empaquetamiento 0.74. No confundir los dos números.'],
  ['¿Por qué los índices de Miller usan recíprocos?','Para que un plano paralelo a un eje dé índice cero en lugar de infinito, y para que los índices sean proporcionales a la orientación.'],
  ['Dependencia de la energía con el tamaño en la partícula en una caja','E ∝ 1/L². Reducir la dimensión a la mitad cuadruplica la energía. Es la base del confinamiento cuántico.'],
  ['¿Por qué el 4s se llena antes que el 3d?','El apantallamiento en átomos polielectrónicos rompe la degeneración: la energía depende también de l, y los orbitales s penetran más.'],
  ['Diferencia esencial entre Hartree-Fock y DFT','HF ignora la correlación electrónica. DFT la incorpora de forma aproximada en un funcional cuya elección afecta el resultado.'],
  ['Densidad medida menor que la teórica: ¿qué lo explica?','Vacancias: mismo volumen de celda, menos masa. Los intersticiales darían lo contrario.']
 ]},

/* ===================== M5 ===================== */
{id:'M5',nom:'Fisicoquímica',sesion:'Sesión 5 del taller',
 sub:'Fuerzas intermoleculares, termodinámica y espontaneidad, equilibrio y cinética, y el comportamiento de las superficies. Entrega la base que quince conceptos de síntesis necesitan.',
 sec:[
  {t:'Fuerzas intermoleculares y el orden de comparación',b:[
   {p:['La jerarquía típica por par de moléculas es ion-dipolo > puente de hidrógeno > dipolo-dipolo > London. Pero hay una excepción que el examen explota: las <b>fuerzas de London crecen con la polarizabilidad</b>, que crece con el número de electrones. Por eso el yodo, que solo tiene London, es sólido, mientras que el HF, que tiene puentes de hidrógeno, es gas.']},
   {p:['Regla operativa: si las masas son parecidas, decide el tipo de fuerza (etanol 78 °C frente a dimetil éter −24 °C, misma fórmula C₂H₆O). Si las masas son muy distintas, revisa si el tamaño alcanza para que London compense.']},
   {p:['El agua y sus anomalías salen de un solo hecho geométrico: cada molécula puede formar <b>cuatro</b> puentes, dos como donadora y dos como aceptora. De ahí el punto de ebullición anómalo, la capacidad calorífica alta y que el hielo flote. Y de ahí que la línea sólido-líquido del agua tenga <b>pendiente negativa</b> en el diagrama de fases, al revés que casi todas las sustancias.']},
   {fig:FIG.fases},
   {p:['Comparar disoluciones exige contar partículas, no moles de soluto. Glucosa 0.10 m tiene i = 1 y da 0.10 m efectivos; CaCl₂ 0.10 m tiene i ≈ 3 y da 0.30 m, así que <b>baja tres veces más</b> el punto de congelación. Pero glucosa 0.20 m y NaCl 0.10 m llegan los dos a 0.20 m de partículas y producen <b>el mismo descenso</b>: el resultado depende del producto i·m, no de ninguno por separado.']},
   {p:['Las propiedades coligativas dependen del <b>número de partículas</b>: sin el factor i de van’t Hoff el resultado está mal, y el valor sin corregir suele coincidir exactamente con uno de los distractores. Se expresan en molalidad y no en molaridad porque la molalidad no depende de la temperatura, que es justo la variable en estudio.']}
  ,
   {form:[
 ['ΔT<sub>f</sub> = i·K<sub>f</sub>·m   ·   ΔT<sub>b</sub> = i·K<sub>b</sub>·m','<b>Crioscopía y ebulloscopía</b>. Las coligativas dependen del <b>número de partículas</b>, no de su identidad.','agua: K<sub>f</sub> = 1.86 y K<sub>b</sub> = 0.512 °C·kg/mol'],
 ['Π = i·M·R·T','<b>Presión osmótica</b>; M es molaridad. Es la coligativa más sensible, útil para masas molares grandes.','Π en atm con R = 0.0821'],
 ['i ≈ número de iones por fórmula','<b>Factor de van’t Hoff</b>: glucosa 1, NaCl 2, CaCl₂ 3. Omitirlo es el error clásico.','adimensional'],
 ['P<sub>A</sub> = x<sub>A</sub>·P°<sub>A</sub>','<b>Ley de Raoult</b>: el soluto no volátil baja la presión de vapor del disolvente.','']
]}]},
  {t:'Espontaneidad: los cuatro casos',b:[
   {eq:EQ.gibbs},
   {tabla:{th:['ΔH','ΔS','¿Espontáneo?','Ejemplo'],tr:[
     ['−','+','Siempre','Descomposición explosiva'],
     ['+','−','Nunca (lo es el inverso)','—'],
     ['−','−','Solo a T baja','Congelación, condensación'],
     ['+','+','Solo a T alta','Fusión, evaporación']]}},
   {p:['La temperatura de cruce sale de igualar ΔG a cero: T = ΔH/ΔS. Así se calculan puntos de fusión y ebullición a partir de datos termodinámicos.']},
   {p:['La relación ΔG° = −RT ln K = −nFE° dice que termodinámica, equilibrio y electroquímica son <b>la misma información en tres lenguajes</b>. Y hay una distinción que es la fuente número uno de error del tema: ΔG° describe condiciones estándar, mientras que el sentido real lo decide ΔG = ΔG° + RT ln Q con las concentraciones del momento. Con mucho producto inicial, Q es grande y ΔG puede salir positivo aunque ΔG° sea negativo.']},
   {p:['Y <b>espontáneo no es rápido</b>. El diamante tiene ΔG negativo hacia grafito a condiciones normales y no ocurre en escalas humanas, porque la barrera cinética es enorme. La termodinámica dice si puede; la cinética, si alcanzará a hacerlo.']},
   {deep:{t:'El origen de la entropía según Clausius',b:[
     {p:['Clausius observó que la integral de dQ_rev/T sobre cualquier ciclo cerrado siempre vale cero.'],},
     {p:['Si una magnitud integrada sobre un ciclo cerrado da cero, entonces su valor entre dos estados <b>no depende del camino</b>: esa es exactamente la definición de función de estado. A esa magnitud la llamó S.'],},
     {p:['Conviene no confundirlo con la primera ley: la conservación de la energía no es el origen de la entropía, es un enunciado independiente. Y la dirección del flujo espontáneo de calor es una consecuencia de la segunda ley, no su punto de partida.']}
   ]}}
  ,
   {form:[
 ['ΔG = ΔH − TΔS','<b>Energía libre de Gibbs</b>. Negativa indica proceso espontáneo en esas condiciones.','ΔG y ΔH en J/mol, ΔS en J/mol·K, T en K'],
 ['T<sub>cruce</sub> = ΔH / ΔS','<b>Temperatura de cruce</b>: aquella a la que ΔG cambia de signo, cuando ΔH y ΔS tienen el mismo signo.','en K'],
 ['ΔG = ΔG° + RT·ln Q','El sentido <b>real</b> lo decide Q, no ΔG°. En el equilibrio ΔG = 0 y Q = K.','R = 8.314 J/mol·K'],
 ['ΔG° = −RT·ln K','Relación entre <b>energía libre estándar y constante de equilibrio</b>.',''],
 ['ln(K₂/K₁) = −(ΔH°/R)(1/T₂ − 1/T₁)','<b>Van’t Hoff</b>: cómo cambia K con la temperatura. Solo la temperatura modifica K.','']
]},
   {prob:{t:'Encontrar la temperatura a la que el proceso se vuelve espontáneo',
 d:'Para la descomposición CaCO₃(s) → CaO(s) + CO₂(g): ΔH° = +178.3 kJ/mol y ΔS° = +160.6 J/mol·K, ambos supuestos constantes con la temperatura.',
 p:['Los dos signos son positivos, así que es el caso <b>espontáneo solo a temperatura alta</b>: la entalpía se opone y la entropía favorece.',
    'A 298 K: ΔG° = 178 300 − 298 × 160.6 = 178 300 − 47 859 = <b>+130 441 J/mol</b>. No espontánea a temperatura ambiente, como se observa.',
    'Temperatura de cruce: T = ΔH°/ΔS° = 178 300 / 160.6 = <b>1110 K</b>, unos 837 °C.',
    'A 1200 K: ΔG° = 178 300 − 1200 × 160.6 = 178 300 − 192 720 = <b>−14 420 J/mol</b>. Ya espontánea.',
    'Constante de equilibrio a 1200 K: ln K = −ΔG°/RT = 14 420/(8.314 × 1200) = 1.445 ⇒ K = <b>4.2</b>, es decir p(CO₂) ≈ 4.2 bar.'],
 r:'La calcinación se vuelve espontánea por encima de unos 1110 K (837 °C), que es el orden de temperatura real de un horno de cal.',
 x:'Pasar ΔS de J a kJ, o no pasarlo: la mezcla de unidades es el error numérico dominante del tema. Y recordar que ΔG° &gt; 0 <b>no</b> significa que la reacción no ocurra en absoluto: significa que en el equilibrio predominan los reactivos.'}}]},
  {t:'Equilibrio y velocidad son preguntas distintas',b:[
   {p:['Le Chatelier con precisión. La <b>concentración</b> y el <b>volumen</b> desplazan la posición del equilibrio pero no cambian K. La <b>temperatura</b> es la única que cambia el valor de K: trata al calor como reactivo si la reacción es endotérmica y como producto si es exotérmica, de modo que calentar una exotérmica desplaza hacia <b>reactivos</b>.']},
   {ul:['Añadir un gas inerte a volumen constante <b>no desplaza nada</b>: las presiones parciales de las especies reactivas no cambian. Es el distractor clásico.',
        'La presión solo afecta si hay diferencia en moles de gas entre los dos lados.',
        'Un <b>catalizador no desplaza el equilibrio</b>: baja la barrera por igual en ambos sentidos, así que multiplica k directa e inversa por el mismo factor y su cociente K no cambia. Solo llega antes al mismo punto.',
        'Los sólidos y líquidos puros no aparecen en la expresión de K, porque su actividad vale 1.']},
   {p:['Para determinar el orden a partir de datos hay dos rutas rápidas. Por <b>velocidades iniciales</b>: de v₂/v₁ = ([A]₂/[A]₁)ⁿ, si al duplicar la concentración la velocidad se multiplica por ocho entonces 8 = 2ⁿ y el orden es <b>tres</b>; un factor de cuatro daría segundo orden y uno de dos, primero. Por las <b>unidades de k</b>: para orden n son M^(1−n)·s⁻¹, de modo que s⁻¹ puro delata <b>primer orden</b>, M·s⁻¹ orden cero y M⁻¹·s⁻¹ segundo.']},
   {p:['La <b>vida media</b> es la tercera vía. En primer orden t½ = ln2/k y <b>no depende de la concentración inicial</b>; en orden cero es proporcional a [A]₀ y en segundo orden inversamente proporcional. Si al reducir a la mitad la concentración de partida la vida media no cambia, el orden es primero.']},
   {p:['El <b>orden de reacción es experimental</b>, no se lee de los coeficientes. Dada 2A + B → C, escribir v = k[A]²[B] solo sería válido si la reacción fuera elemental, algo que debe decir el enunciado. Los órdenes los dicta el paso determinante y pueden ser fraccionarios, cero o negativos. Las unidades de k delatan el orden.']},
   {eq:EQ.arrhenius},
   {p:['Lo de «obligatoriamente» no es retórico: la temperatura aparece como 1/T, y una escala con cero arbitrario como la Celsius rompe la relación. Usar grados Celsius altera la magnitud del término 1/T₂ − 1/T₁ e incluso su signo, lo que produce <b>energías de activación negativas</b> sin sentido físico. Si el resultado sale negativo, el primer sospechoso son las unidades de temperatura.']},
   {p:['Y la distinción que cierra el bloque: dos reacciones con <b>idéntico ΔG° pueden tardar segundos o siglos</b>. ΔG° fija K y por tanto la composición final, no la rapidez; la velocidad la gobierna la <b>energía de activación</b>, que es una propiedad del camino y no de los estados inicial y final. El diamante hacia grafito es el ejemplo canónico.']},
   {p:['Para primer orden, t½ = ln2/k y <b>no depende de la concentración inicial</b>; para segundo orden, t½ = 1/(k[A]₀) y sí depende. Esa es la forma más rápida de distinguirlos a partir de datos.']}
  ,
   {form:[
 ['v = k[A]^m[B]ⁿ','<b>Ley de velocidad</b>. Los órdenes m y n son <b>empíricos</b>: no se leen de los coeficientes salvo reacción elemental.',''],
 ['v₂/v₁ = ([A]₂/[A]₁)ⁿ','<b>Método de velocidades iniciales</b> para hallar el orden: si al duplicar la velocidad se multiplica por 8, entonces n = 3.',''],
 ['Orden 0: [A] = [A]₀ − kt   ·   t<sub>1/2</sub> = [A]₀/2k','Recta de <b>[A] contra t</b>.','k en M/s'],
 ['Orden 1: ln[A] = ln[A]₀ − kt   ·   t<sub>1/2</sub> = 0.693/k','Recta de <b>ln[A] contra t</b>. La vida media no depende de la concentración inicial.','k en s⁻¹'],
 ['Orden 2: 1/[A] = 1/[A]₀ + kt   ·   t<sub>1/2</sub> = 1/(k[A]₀)','Recta de <b>1/[A] contra t</b>.','k en M⁻¹s⁻¹'],
 ['k = A·exp(−E<sub>a</sub>/RT)','<b>Arrhenius</b>. En forma lineal: ln k = ln A − E<sub>a</sub>/RT, con pendiente −E<sub>a</sub>/R.','E<sub>a</sub> en J/mol'],
 ['ln(k₂/k₁) = (E<sub>a</sub>/R)(1/T₁ − 1/T₂)','Forma de <b>dos puntos</b> de Arrhenius, la más útil en examen.','']
]},
   {prob:{t:'Energía de activación a partir de dos temperaturas',
 d:'Una reacción tiene k = 2.75×10⁻⁴ s⁻¹ a 25.0 °C y k = 8.13×10⁻³ s⁻¹ a 55.0 °C. R = 8.314 J/mol·K.',
 p:['Pasa a kelvin: T₁ = 298.15 K y T₂ = 328.15 K. <b>Usar grados Celsius aquí es el error más caro del tema.</b>',
    'Razón de constantes: k₂/k₁ = 8.13×10⁻³ / 2.75×10⁻⁴ = <b>29.56</b> ⇒ ln(k₂/k₁) = <b>3.386</b>.',
    'Diferencia de inversos: 1/T₁ − 1/T₂ = 1/298.15 − 1/328.15 = 3.3540×10⁻³ − 3.0474×10⁻³ = <b>3.066×10⁻⁴ K⁻¹</b>.',
    'E<sub>a</sub> = R·ln(k₂/k₁)/(1/T₁ − 1/T₂) = 8.314 × 3.386 / 3.066×10⁻⁴ = <b>91 800 J/mol</b>.',
    'Es decir E<sub>a</sub> ≈ <b>91.8 kJ/mol</b>, un valor típico de reacción en disolución.',
    'Con ese dato, el factor preexponencial: ln A = ln k₁ + E<sub>a</sub>/RT₁ = −8.198 + 37.04 = 28.84 ⇒ A ≈ 3.4×10¹² s⁻¹.'],
 r:'E<sub>a</sub> = 91.8 kJ/mol. Subir 30 °C multiplicó la velocidad por casi 30.',
 x:'La regla de que “la velocidad se duplica cada 10 °C” solo se cumple para E<sub>a</sub> cercana a 50 kJ/mol cerca de temperatura ambiente. Con 92 kJ/mol el factor por cada 10 °C es cercano a 3, y por eso aquí 30 °C dieron casi un factor 30 en lugar de 8.'}}]},
  {t:'Superficies, adsorción y coloides',b:[
   {p:['La espontaneidad no se decide por el signo de ΔH. Disolver una sal que <b>enfría</b> el recipiente es endotérmico y aun así ocurre, porque el aumento de desorden al dispersarse soluto y disolvente hace que TΔS supere a ΔH. Confundir endotérmico con no espontáneo es el error conceptual más repetido del módulo.']},
   {p:['Con <b>ΔH negativo y ΔS negativo</b> la entalpía favorece y la entropía se opone, y como el término entrópico va multiplicado por T, el proceso es espontáneo <b>solo por debajo de T = ΔH/ΔS</b>. Con ambos positivos ocurre lo contrario: solo por encima de esa temperatura de cruce.']},
   {p:['Crear interfase cuesta energía, y de ahí que una gota tienda a la esfera. Dos modelos de adsorción que se confunden: <b>Langmuir</b> supone monocapa sobre sitios equivalentes e independientes y satura; <b>BET</b> permite multicapas y no satura. Para medir área superficial específica de un material mesoporoso con nitrógeno a 77 K la respuesta esperada es <b>BET</b>.']},
   {p:['Langmuir, Michaelis-Menten y la ocupación de receptor son <b>la misma hipérbola de saturación</b> con nombres distintos. Reconocerlo ahorra memorizar tres cosas.']},
   {p:['La curvatura eleva la presión de vapor y la solubilidad (Kelvin, Gibbs-Thomson), y eso explica de un golpe la maduración de Ostwald y el descenso del punto de fusión de las nanopartículas.']},
   {p:['Estabilidad coloidal por DLVO: van der Waals siempre atrae, así que el estado de mínima energía es el agregado y una suspensión estable es un logro, no un estado natural. La barrera se controla subiendo la carga superficial (lejos del punto isoeléctrico) o bajando la fuerza iónica. <b>Añadir sal comprime la doble capa</b> y baja la barrera: por eso las suspensiones fallan en medio fisiológico, con unos 150 mM. El criterio práctico sitúa la estabilidad razonable más allá de ±30 mV de potencial zeta.']},
   {p:['Un líquido hierve cuando su presión de vapor iguala a la presión externa, así que en la <b>montaña, con menos presión atmosférica, el punto de ebullición baja</b>. La presión de vapor del líquido en sí depende solo de la temperatura: no la cambia la presión externa, ni añadir un gas inerte encima.']},
   {p:['Mojado: <b>Wenzel</b> describe el líquido que penetra la textura; <b>Cassie-Baxter</b> el que atrapa aire debajo, y es este el que da superhidrofobicidad real.']}
  ,
   {form:[
 ['ΔP = 2γ/r','<b>Laplace</b> para una gota esférica; 4γ/r para una burbuja con dos interfaces. La presión interna crece al reducir el radio.','γ en N/m, r en m, ΔP en Pa'],
 ['ln(p/p₀) = 2γV<sub>m</sub>/(rRT)','<b>Kelvin</b>: las gotas pequeñas tienen mayor presión de vapor y mayor solubilidad. Es el motor de la maduración de Ostwald.',''],
 ['γ·cos θ = (γ<sub>SV</sub> − γ<sub>SL</sub>)','<b>Young</b>. θ &lt; 90° es mojante; θ &gt; 150° es superhidrofóbico.','θ es el ángulo de contacto'],
 ['θ = K·p/(1 + K·p)','<b>Isoterma de Langmuir</b>: monocapa, sitios equivalentes, sin interacción entre adsorbatos.','θ es la fracción cubierta'],
 ['1/[v(p₀/p − 1)] = (c−1)/(v<sub>m</sub>c)·(p/p₀) + 1/(v<sub>m</sub>c)','<b>BET</b>: extiende Langmuir a multicapa y es el método estándar para medir área específica.',''],
 ['κ⁻¹ ∝ 1/√I','<b>Longitud de Debye</b>: la fuerza iónica comprime la doble capa y derriba la barrera DLVO.','I es la fuerza iónica'],
 ['|ζ| &gt; 30 mV','Criterio práctico de <b>estabilidad electrostática</b> de una suspensión.','ζ en mV']
]},
   {prob:{t:'Por qué una gota pequeña se evapora y alimenta a la grande',
 d:'Dos gotas de agua a 25 °C en el mismo recinto cerrado, una de 10 nm y otra de 1.0 µm de radio. γ = 0.072 N/m, V<sub>m</sub> = 1.8×10⁻⁵ m³/mol, R = 8.314, T = 298 K.',
 p:['Para la gota de 10 nm: ln(p/p₀) = 2 × 0.072 × 1.8×10⁻⁵ / (1.0×10⁻⁸ × 8.314 × 298) = 2.592×10⁻⁶/2.478×10⁻⁵ = <b>0.1046</b>.',
    'Es decir p/p₀ = e^0.1046 = <b>1.110</b>: su presión de vapor es un <b>11 % mayor</b> que la de una superficie plana.',
    'Para la de 1.0 µm, el radio es cien veces mayor, así que el exponente es cien veces menor: ln(p/p₀) = 1.046×10⁻³ ⇒ p/p₀ = <b>1.001</b>.',
    'La gota pequeña está rodeada de un vapor más saturado que la grande, de modo que hay un <b>gradiente neto</b> de vapor de la pequeña hacia la grande.',
    'La pequeña se evapora, la grande condensa, y el proceso se acelera porque la pequeña se hace aún más pequeña y su presión de vapor sube más.'],
 r:'La gota de 10 nm tiene 11 % más presión de vapor y desaparece alimentando a la de 1 µm. Es maduración de Ostwald, sin que las gotas lleguen a tocarse.',
 x:'Por eso ni subir el potencial zeta ni añadir surfactante frenan la maduración: ninguno de los dos cambia la <b>curvatura</b>. Lo que la frena es un componente <b>insoluble en la fase continua</b> atrapado en la gota, que al concentrarse genera una contrapresión osmótica que compensa el término de Kelvin.'}}]}
 ],
 flash:[
  ['¿Por qué el yodo es sólido si solo tiene fuerzas de London?','Tiene 106 electrones: su polarizabilidad es enorme y la suma de interacciones débiles supera a los puentes de hidrógeno del HF, que es gas.'],
  ['ΔH positivo y ΔS positivo: ¿cuándo es espontáneo?','Solo a temperatura suficientemente alta, porque el término TΔS crece con T hasta superar a ΔH. T de cruce = ΔH/ΔS.'],
  ['ΔG° negativo pero el sistema va hacia reactivos: ¿contradicción?','No. ΔG° es estándar; el sentido real lo fija ΔG = ΔG° + RT·lnQ. Con mucho producto inicial, Q grande puede volver ΔG positivo.'],
  ['¿Qué perturbación cambia el VALOR de K?','Solo la temperatura, vía ΔG° = −RT·lnK. Concentración, volumen y catalizador desplazan la posición pero no K.'],
  ['¿Por qué un catalizador no cambia K?','Baja la barrera lo mismo en los dos sentidos: multiplica k directa e inversa por el mismo factor, y K = k_dir/k_inv no cambia.'],
  ['Gas inerte añadido a volumen constante','No desplaza el equilibrio: las presiones parciales de las especies reactivas no cambian. Es el distractor clásico.'],
  ['¿Se puede leer el orden de reacción de los coeficientes?','No, salvo que el enunciado diga que la reacción es elemental. El orden es empírico y lo dicta el paso determinante.'],
  ['Vida media: primer orden frente a segundo','Primer orden: t½ = ln2/k, independiente de [A]₀. Segundo orden: t½ = 1/(k[A]₀), sí depende.'],
  ['¿Langmuir o BET para área superficial de un mesoporoso?','BET. Permite multicapas, que es lo que realmente ocurre con N₂ a 77 K, y del ajuste se extrae la monocapa.'],
  ['¿Por qué añadir sal coagula un coloide?','Comprime la doble capa eléctrica, acorta el alcance de la repulsión y baja la barrera DLVO por debajo de kT.'],
  ['Wenzel frente a Cassie-Baxter','Wenzel: el líquido penetra la textura. Cassie-Baxter: atrapa aire debajo, y es el que da superhidrofobicidad.']
 ]}
);
</script>
<script>
G.push(
/* ===================== M6 ===================== */
{id:'M6',nom:'Síntesis de materiales y nanomateriales',sesion:'Sesión 8 del taller',
 sub:'Por qué la nanoescala es distinta, nucleación y crecimiento, rutas químicas y rutas físicas. Es el módulo con más dependencias externas: quince de sus conceptos se apoyan en M5.',
 sec:[
  {t:'Los tres efectos que hacen distinta a la nanoescala',b:[
   {p:['Antes de los efectos conviene fijar la definición. Un <b>nanomaterial</b> es aquel en el que al menos una de sus dimensiones, o la de alguno de sus componentes o estructuras internas, se encuentra por debajo de los <b>100 nanómetros</b>. Lo decisivo es que a esa escala aparecen propiedades que el material masivo no tiene, no el tamaño como cifra arbitraria.']},
   {p:['No es un efecto único: son tres mecanismos con umbrales distintos, y el examen espera que sepas cuál aplica.']},
   {tabla:{th:['Efecto','Umbral','Qué explica'],tr:[
     ['Superficie','Por debajo de ~100 nm, continuo','Reactividad catalítica, descenso del punto de fusión, mayor solubilidad'],
     ['Confinamiento cuántico','Radio de Bohr del excitón (2–20 nm según material)','Gap que crece al reducir el tamaño. Solo semiconductores'],
     ['Propiedades colectivas','Tamaño crítico del fenómeno','Superparamagnetismo (monodominio), plasmón (metales)']]}},
   {eq:EQ.superficie},
   {p:['Una partícula de 5 nm tiene alrededor del 30 % de sus átomos en la superficie; una de 50 nm, un 3 %. La fracción escala como 1/R, así que al dividir el diámetro entre diez se multiplica por diez.']},
   {p:['Dirección del confinamiento: <b>menor tamaño ⇒ mayor gap ⇒ emisión más azul</b>. Los distractores siempre invierten esto. Y ojo con atribuir todo a la cuántica: el oro de 20 nm es rojo por <b>plasmón</b>, que es electromagnetismo clásico, no por confinamiento, porque un metal no tiene gap que confinar.']},
   {deep:{t:'Por qué el oro coloidal es rojo y no dorado',b:[
     {p:['Los electrones de conducción de la partícula son un gas confinado en una esfera mucho menor que la longitud de onda de la luz. Al llegar la onda, todo ese gas oscila colectivamente respecto a la red de cationes, con una frecuencia de resonancia propia: es la resonancia de plasmón superficial localizada.'],},
     {p:['Para oro esférico de unos 20 nm en agua la resonancia cae cerca de 520 nm, que es verde. La suspensión absorbe el verde y transmite su complementario: rojo rubí.'],},
     {ul:['Aumentar el tamaño desplaza la resonancia al <b>rojo</b>.',
          'Cambiar la forma la desplaza mucho más: una nanovarilla tiene un modo longitudinal que puede llevarse al infrarrojo cercano ajustando la relación de aspecto, que es la ventana donde el tejido es transparente.',
          'Subir el índice de refracción del medio también la desplaza al rojo: ese es el principio del biosensor plasmónico.',
          'La <b>agregación</b> acopla plasmones y corre la banda al rojo de forma drástica. Una suspensión que vira de rojo a azul está avisando que coagula.']}
   ]}}
  ,
   {form:[
 ['f<sub>sup</sub> ≈ 3δ / R','<b>Fracción de átomos superficiales</b>; δ es el espesor de una capa atómica. Va como <b>1/R</b>, no como el área ni el volumen.','adimensional'],
 ['A<sub>esp</sub> = 3 / (ρ·R) = 6 / (ρ·D)','<b>Área específica</b> de esferas monodispersas.','A en m²/g con ρ en g/m³ y R en m'],
 ['A/V = 3/R (esfera)','<b>Razón superficie a volumen</b>: se duplica al dividir el radio entre dos.','en m⁻¹'],
 ['T<sub>f</sub>(R) = T<sub>f∞</sub>[1 − 2σ<sub>sl</sub>/(ΔH<sub>f</sub>ρ<sub>s</sub>R)]','<b>Gibbs-Thomson</b>: el punto de fusión baja al reducir el tamaño, por el costo energético de la superficie.','T en K'],
 ['ΔE ∝ 1/L²','<b>Confinamiento cuántico</b>: dividir la dimensión entre dos cuadruplica la energía de confinamiento.','']
]},
   {prob:{t:'Cuánto gana realmente un catalizador al nanoestructurarse',
 d:'Platino, ρ = 21.45 g/cm³. Se compara un polvo de partículas esféricas de 2.0 µm con otro de 3.0 nm, ambos de 1.00 g. δ ≈ 0.25 nm.',
 p:['Área específica del polvo micrométrico: A = 6/(ρD) = 6/(21.45 × 2.0×10⁻⁴) = 6/4.29×10⁻³ = <b>1.40×10³ cm²/g</b>, es decir <b>0.14 m²/g</b>.',
    'Área específica del nanopolvo: D = 3.0 nm = 3.0×10⁻⁷ cm ⇒ A = 6/(21.45 × 3.0×10⁻⁷) = 6/6.435×10⁻⁶ = <b>9.33×10⁵ cm²/g</b>. Como 1 m² = 10⁴ cm², son <b>93.3 m²/g</b>.',
    'La razón de áreas es exactamente la razón inversa de diámetros: 2000 nm / 3 nm = <b>667 veces</b> más área por gramo.',
    'Fracción superficial del nanopolvo: f = 3δ/R = 3 × 0.25/1.5 = <b>0.50</b>. La mitad de los átomos están en la superficie.',
    'Fracción superficial del micrométrico: f = 3 × 0.25/1000 = <b>7.5×10⁻⁴</b>. Menos de un átomo de cada mil.'],
 r:'667 veces más área por gramo, y la mitad de los átomos expuestos frente a uno de cada 1300. Por eso el mismo gramo de platino cataliza órdenes de magnitud más.',
 x:'La fracción superficial escala con <b>1/R</b>, el área por gramo también con 1/R, pero el número de partículas por gramo escala con <b>1/R³</b>. Confundir las tres potencias es el error recurrente del módulo.'}}]},
  {t:'Nucleación, crecimiento y forma',b:[
   {p:['La barrera de nucleación existe por una competencia de potencias: el volumen libera energía como r³ y la superficie la consume como r². A radios pequeños domina el término de área y la energía sube; a radios grandes domina el de volumen y baja. El máximo es la barrera.']},
   {fig:FIG.nucleacion},
   {eq:EQ.nucleacion},
   {p:['Por debajo de r* un núcleo reduce su energía <b>disolviéndose</b>; por encima, creciendo. Más sobresaturación implica r* menor y barrera mucho menor (va con el inverso del cuadrado), de ahí que nuclee masivamente y dé partículas pequeñas.']},
   {fig:FIG.lamer},
   {p:['El modelo de <b>LaMer</b> dice que la monodispersidad no se logra controlando el crecimiento, sino <b>separándolo en el tiempo de la nucleación</b>: una nucleación explosiva que se autodetiene al consumir el monómero, y después solo crecimiento. De ahí la inyección caliente y el crecimiento sobre semillas.']},
   {p:['<b>Ostwald no es agregación</b>. La maduración transporta material disuelto desde las partículas pequeñas (más solubles por curvatura) hacia las grandes, sin que lleguen a tocarse; se combate bajando temperatura o solubilidad, no con estabilizantes. La agregación es por contacto y choque browniano; esa sí se combate estabilizando.']},
   {p:['La <b>sobresaturación</b> es la palanca que decide el tamaño final. Como r* = 2γ/ΔGv y la barrera va con el inverso del cuadrado de ΔGv, aumentarla reduce drásticamente ambos: se nuclea masivamente, el monómero se reparte entre muchísimos núcleos y las partículas salen pequeñas. Bajarla produce pocos núcleos que crecen mucho.']},
   {p:['Para controlar la <b>forma</b> hay que controlar la velocidad relativa de crecimiento de las caras, y la regla es contraintuitiva: una cara que crece rápido <b>desaparece</b> de la morfología final, porque el material se deposita hasta cerrarla. Las que sobreviven son las lentas. Por eso un agente director que se adsorbe selectivamente sobre una familia de caras la pasiva y la hace dominar: el CTAB da nanovarillas de oro y la PVP da nanocubos de plata.']}
  ,
   {form:[
 ['ΔG = (4/3)πr³ΔG<sub>v</sub> + 4πr²γ','<b>Nucleación homogénea</b>: el término de volumen favorece y el de superficie se opone.','ΔG<sub>v</sub> es negativo por unidad de volumen'],
 ['r* = −2γ / ΔG<sub>v</sub>','<b>Radio crítico</b>: por debajo el núcleo se redisuelve, por encima crece de forma irreversible.','r* en m'],
 ['ΔG* = 16πγ³ / (3ΔG<sub>v</sub>²)','<b>Barrera de nucleación</b>. La heterogénea la reduce por un factor geométrico que depende del ángulo de contacto.','en J'],
 ['S = C / C<sub>eq</sub>','<b>Sobresaturación</b>: es la fuerza impulsora. Más S da r* menor y por tanto más núcleos y más pequeños.','adimensional'],
 ['J = A·exp(−ΔG*/kT)','<b>Velocidad de nucleación</b>: exponencial en la barrera, de ahí el carácter explosivo del estallido de LaMer.','']
]},
   {prob:{t:'Radio crítico y por qué más sobresaturación da partículas más pequeñas',
 d:'Nucleación de oro en disolución a 298 K. γ = 1.5 J/m², volumen molar 1.02×10⁻⁵ m³/mol. Se compara sobresaturación S = 10 contra S = 1000.',
 p:['La fuerza impulsora por unidad de volumen es ΔG<sub>v</sub> = −(RT·ln S)/V<sub>m</sub>.',
    'Para S = 10: ΔG<sub>v</sub> = −(8.314 × 298 × 2.303)/1.02×10⁻⁵ = −5.705×10³/1.02×10⁻⁵ = <b>−5.59×10⁸ J/m³</b>.',
    'Radio crítico: r* = −2γ/ΔG<sub>v</sub> = 2 × 1.5/5.59×10⁸ = <b>5.4×10⁻⁹ m</b>, es decir <b>5.4 nm</b>.',
    'Para S = 1000: ln S = 6.908, tres veces mayor, así que ΔG<sub>v</sub> = <b>−1.68×10⁹ J/m³</b>.',
    'r* = 2 × 1.5/1.68×10⁹ = <b>1.8 nm</b>: tres veces menor.',
    'Y la barrera ΔG* va como 1/ΔG<sub>v</sub>², así que al triplicar la fuerza impulsora la barrera cae por un factor nueve, y como J es exponencial en ella, la velocidad de nucleación se dispara.'],
 r:'Con S = 10 el núcleo crítico mide 5.4 nm; con S = 1000 mide 1.8 nm y nuclean muchísimos más núcleos a la vez.',
 x:'La consecuencia práctica es la receta de LaMer: para obtener partículas <b>pequeñas y monodispersas</b> hay que alcanzar una sobresaturación alta de golpe (inyección caliente), consumir el precursor en un estallido breve y dejar que el crecimiento ocurra después, ya por debajo del umbral de nucleación. Añadir precursor lentamente solapa ambas etapas y ensancha la distribución.'}}]},
  {t:'Rutas químicas: qué controla cada una',b:[
   {tabla:{th:['Ruta','Fuerte en','Debilidad'],tr:[
     ['Reducción en disolución','Control fino de tamaño y forma en metales nobles','No sirve para óxidos ni alta temperatura'],
     ['Sol-gel','Homogeneidad molecular, recubrimientos y monolitos porosos','Producto <b>amorfo</b>: exige calcinar, lo que sinteriza y destruye área'],
     ['Hidrotermal / solvotermal','Cristalinidad <b>sin calcinar</b>, control de fase y morfología','Equipo a presión, tiempos largos'],
     ['Coprecipitación','Simple, barata, escalable','Distribución de tamaños ancha'],
     ['Microemulsión','Nanorreactores que limitan el tamaño','Rendimiento bajo, mucho surfactante que eliminar'],
     ['Electroquímica','Control fino por corriente y potencial; útil para metales','Requiere electrolito conductor y electrodos adecuados']]}},
   {p:['El <b>sol-gel</b> transcurre en dos etapas que conviene distinguir, y el agua aparece en las dos con papeles opuestos: la <b>hidrólisis</b> consume agua para convertir los alcóxidos en hidroxilos, y la <b>condensación</b> une dos hidroxilos <b>liberando agua</b> y formando el puente metal-oxígeno-metal que construye la red. Si en una reacción se observa que se expulsa agua al unirse dos grupos, la etapa es la condensación, y a esa agua exudada se la llama <b>agua de condensación</b>: no es agua de solvatación ni de hidratación, que son cosas distintas.']},
   {p:['Para elegir ruta ante un caso concreto conviene preguntarse qué variable hay que controlar. <b>Homogeneidad</b> entre varios cationes: coprecipitación simultánea, porque los mezcla a escala molecular antes de que se forme el sólido; molerlos ya formados solo los junta a escala de partícula. <b>Tamaño fino</b>: microemulsión, donde la gota acuosa actúa de nanorreactor y su tamaño limita el de la partícula, ajustable con la razón agua-surfactante. <b>Fase cristalina sin calcinar</b>: hidrotermal.']},
   {p:['El TiO₂ ilustra el costo de calcinar: por encima de unos 600 °C transita de anatasa a <b>rutilo</b>, menos activo fotocatalíticamente, y además crece el grano y cae el área superficial. Dos efectos que bajan la actividad a la vez.']},
   {p:['Hay dos formas de estabilizar y se distinguen por cómo fallan. La <b>estabilización electrostática</b> depende de la doble capa eléctrica, así que funciona en agua destilada y se desploma al subir la fuerza iónica: una suspensión que aguanta en agua y se agrega en suero fisiológico estaba estabilizada así. La <b>estérica</b>, con cadenas poliméricas ancladas, impide el acercamiento por un mecanismo físico que no depende del apantallamiento y resiste a 150 mM.']},
   {p:['El estabilizante no es un detalle de formulación: decide si la suspensión sobrevive. La <b>electrostática</b> falla a alta fuerza iónica porque la sal apantalla; la <b>estérica</b>, con cadenas poliméricas ancladas, funciona igual en medio fisiológico y por eso es la estrategia estándar para uso biológico.']},
   {p:['Calcinar de más tiene un segundo costo además de la transición de fase: por encima de cierta temperatura los granos empiezan a fusionarse para reducir energía superficial, las paredes de poro engrosan y la estructura <b>sinteriza</b>, perdiendo buena parte del área. Por eso se busca siempre la temperatura mínima que cristalice sin sinterizar.']},
   {p:['En arquitecturas, el <b>core-shell</b> pasiva trampas superficiales y sube el rendimiento cuántico de un punto cuántico: es la razón de ser de la coraza, no una mejora cosmética.']}
  ]},
  {t:'Rutas físicas y el límite litográfico',b:[
   {p:['Dos filosofías. <b>Descendente</b> (litografía, grabado, FIB) da control posicional —sabes dónde queda cada estructura, imprescindible en circuitos— y su límite es la resolución y el desperdicio. <b>Ascendente</b> (síntesis coloidal, autoensamblado, ALD) alcanza dimensiones menores con mejor calidad cristalina, y su límite es que no decide <b>dónde</b>. La industria las combina: litografía define dónde, depósito construye qué.']},
   {eq:EQ.litografia},
   {ul:['Reducir <b>λ</b>: de 436 a 365, a 248 (KrF), a 193 (ArF), y el salto a 13.5 nm en EUV, que exige óptica reflectiva en vacío.',
        'Aumentar <b>NA</b>: con aire n = 1 acota el valor; la inmersión en agua (n = 1.44) lleva la NA efectiva por encima de 1.3. Esa fue la palanca que prolongó la vida de los 193 nm.',
        'Reducir <b>k₁</b>: máscaras de desplazamiento de fase, iluminación fuera de eje, corrección de proximidad, patrones múltiples. Su límite físico ronda 0.25.']},
   {p:['La diferencia entre <b>sputtering</b> y <b>ALD</b> se nota sobre todo en geometrías con poros profundos o relación de aspecto alta: el primero deposita donde llega el flujo y tiende a cerrar la boca del poro sin recubrir el fondo; el segundo satura toda la superficie accesible y crece con espesor uniforme en el interior, controlable al angstrom contando ciclos.']},
   {p:['Depósito: el <b>sputtering</b> es línea de vista y tapa poros; el <b>ALD</b> pulsa precursores alternadamente con purgas, cada pulso satura la superficie y el crecimiento es autolimitado, de una capa por ciclo. Es lentísimo y a cambio da una conformidad sobre geometrías complejas que nada iguala.']},
   {p:['Grabado: el <b>húmedo</b> suele ser isotrópico y socava bajo la máscara, limitando la resolución a unas dos veces la profundidad. El <b>seco por plasma</b> con iones acelerados da paredes verticales y alta relación de aspecto. Caso intermedio que se pregunta: KOH sobre silicio {100} es anisotrópico <b>cristalográficamente</b>, no direccionalmente, y produce paredes a 54.7°.']},
   {p:['El área específica de partículas esféricas se obtiene dividiendo área entre masa: 4πr²/(ρ·(4/3)πr³) = 3/(ρr) = <b>6/(ρd)</b>. Con 10 nm y densidad 5.0 g/cm³ salen unos 120 m²/g. Ojo con no confundirla con 4πr², que es el área de una sola partícula.']},
   {p:['Y la regla de producción: escribe el maestro con la técnica de mayor resolución y <b>replica</b> con la más barata (litografía suave, micromoldeado, LIGA). Nunca produzcas en serie con la técnica cara.']}
  ]}
 ],
 flash:[
  ['Relación superficie-volumen de una esfera','S/V = 6/d. La fracción de átomos superficiales escala como 1/R: una partícula de 5 nm tiene ~30 % en superficie.'],
  ['Dirección del confinamiento cuántico','Menor tamaño ⇒ MAYOR gap ⇒ emisión más azul. Los distractores siempre invierten esto.'],
  ['¿Por qué el oro de 20 nm es rojo?','Resonancia de plasmón superficial cerca de 520 nm: absorbe verde y transmite el rojo complementario. Es electromagnetismo clásico, no confinamiento.'],
  ['Una suspensión de oro vira de rojo a azul: ¿qué pasa?','Está agregando. El acoplamiento entre plasmones desplaza la banda al rojo y el color percibido vira a azul o violeta.'],
  ['Radio crítico y qué ocurre por debajo','r* = 2γ/ΔGv. Por debajo de r* el núcleo se disuelve, porque a ese tamaño el término de superficie domina.'],
  ['¿Cómo se consigue monodispersidad según LaMer?','Separando en el tiempo una nucleación explosiva y autolimitada del crecimiento posterior. Todas las partículas nacen a la vez.'],
  ['Ostwald frente a agregación','Ostwald transporta material disuelto sin contacto entre partículas (se frena con menos solubilidad o temperatura). La agregación es por choque y se frena estabilizando.'],
  ['Regla contraintuitiva del control de forma','Las caras que crecen RÁPIDO desaparecen; sobreviven las lentas. Un agente director pasiva una familia de caras y la hace dominar.'],
  ['¿Qué ruta da cristalinidad sin calcinar?','Hidrotermal o solvotermal. El sol-gel entrega material amorfo y exige calcinación, que sinteriza y destruye área superficial.'],
  ['ALD frente a sputtering','ALD: pulsos alternados, autolimitado, una capa por ciclo, conformal. Sputtering: línea de vista, rápido, tapa poros.'],
  ['Las tres palancas de la litografía','CD = k₁λ/NA. Bajar λ, subir NA (inmersión), bajar k₁ (máscaras de fase, patrones múltiples).']
 ]},

/* ===================== M7 ===================== */
{id:'M7',nom:'Caracterización de materiales',sesion:'Sesión 7 del taller',
 sub:'Una sonda para cada pregunta: difracción, microscopía, espectroscopía y análisis térmico. El reactivo más frecuente del módulo es «dada esta muestra y este objetivo, qué técnica eliges».',
 sec:[
  {t:'Casos: encadenar técnicas hasta cerrar una identificación',b:[
   {p:['Las preguntas de caracterización del examen rara vez piden una técnica aislada: piden <b>qué harías</b> ante una muestra concreta, y eso exige encadenar. El criterio que recorre los tres casos siguientes es siempre el mismo: empieza por la técnica <b>no destructiva que más acota</b>, deja que cada resultado decida cuál es la siguiente pregunta, y busca <b>comprobaciones cruzadas</b> entre técnicas independientes en lugar de confiar en un solo número.']},
   {caso:CASOS.polvo_blanco},
   {caso:CASOS.coloide_violeta},
   {caso:CASOS.recubrimiento_falla}
  ]},
  {t:'El árbol de decisión: organiza por pregunta, no por técnica',b:[
   {tabla:{th:['Lo que quieres saber','Técnica','Advertencia'],tr:[
     ['Qué fases cristalinas hay','DRX','Ciega al material amorfo; no da composición elemental'],
     ['Qué elementos, en disolución','AAS (uno) / ICP-OES o ICP-MS (multielemental, trazas)','—'],
     ['Qué elementos, con resolución espacial','EDS en SEM o TEM','Débil en ligeros; volumen de interacción de micras'],
     ['Estado de oxidación de la superficie','XPS','Solo los primeros nanómetros. EDS <b>no</b> da estado químico'],
     ['Forma y tamaño, morfología externa','SEM','Vacío, muestra conductora, no ve el interior'],
     ['Estructura interna, menos de 10 nm','TEM','Muestra ultradelgada, preparación laboriosa, daño por haz'],
     ['Altura cuantitativa, muestra blanda o en líquido','AFM','Resolución lateral limitada por el radio de la punta'],
     ['Tamaño en suspensión','DLS','Diámetro hidrodinámico, sesgado a las grandes'],
     ['Grupos funcionales','FTIR (+ Raman en agua)','—'],
     ['Área superficial accesible','BET con N₂ a 77 K','—'],
     ['Comportamiento térmico','TGA (masa) / DSC (energía)','Solo DSC ve la Tg']]}},
   {p:['Y la regla que cierra el módulo: <b>ninguna técnica sola caracteriza un material</b>. Un trabajo serio combina al menos difracción, microscopía y una espectroscopía, porque cada una tiene un punto ciego que otra cubre. La secuencia lógica es no destructivo antes que destructivo, y estructural antes que cuantificación fina.']}
  ]},
  {t:'Difracción: tres medidas, tres informaciones',b:[
   {eq:EQ.scherrer},
   {p:['<b>El error más frecuente del módulo</b>: en Bragg, θ es la mitad del 2θ que reporta el equipo. Olvidarlo cambia el resultado por completo.']},
   {tabla:{th:['Qué mides en el difractograma','Qué te dice'],tr:[
     ['Posición de los picos (2θ)','Espaciados d ⇒ fase y parámetro de red. Un desplazamiento sistemático indica dopaje sustitucional o tensión'],
     ['Intensidad relativa','Qué átomos y dónde en la celda. Si las posiciones coinciden y las intensidades no: <b>orientación preferencial</b>'],
     ['Ancho de los picos','Tamaño de cristalito por Scherrer. Un material amorfo da solo un halo ancho']]}},
   {p:['Dos advertencias sobre Scherrer. β debe ser el ensanchamiento <b>de la muestra</b>: hay que restar la contribución instrumental medida con un estándar de cristalitos grandes. Y la <b>microdeformación también ensancha</b>, sin distinguirse con un solo pico: para separarlas está Williamson-Hall, que aprovecha que ambas dependen distinto del ángulo.']},
   {p:['Cristalito no es partícula: una partícula policristalina de 60 nm puede estar hecha de dominios coherentes de 12 nm, y la difracción solo ve el dominio. Es una de las confusiones más preguntadas.']},
   {p:['Un difractograma con <b>un solo halo ancho y ningún pico</b> indica material <b>amorfo</b>: los picos nacen de la periodicidad de largo alcance, y sin ella solo queda la dispersión difusa de las distancias promedio entre vecinos. Cristalitos grandes darían lo contrario, picos muy estrechos.']},
   {p:['Indexar en sistema cúbico: la razón de 1/d² da los valores de h²+k²+l². La secuencia 3, 4, 8, 11 identifica <b>FCC</b> (índices todos pares o todos impares); 2, 4, 6, 8 identifica <b>BCC</b> (h+k+l par).']}
  ,
   {fig:FIG.xrd},
   {form:[
 ['nλ = 2d·sen θ','<b>Ley de Bragg</b>. θ es la <b>mitad</b> del 2θ que reporta el difractómetro: ese es el error número uno.','λ(Cu Kα) = 0.15406 nm'],
 ['d<sub>hkl</sub> = a / √(h²+k²+l²)','<b>Espaciado</b> en sistema cúbico; permite indexar y obtener el parámetro de red.',''],
 ['D = Kλ / (β·cos θ)','<b>Scherrer</b>: tamaño de <b>cristalito</b>, no de partícula. K ≈ 0.9 y β es el ensanchamiento en <b>radianes</b>.','β = FWHM − ensanchamiento instrumental'],
 ['β·cos θ = Kλ/D + 4ε·sen θ','<b>Williamson-Hall</b>: separa tamaño (ordenada) de microdeformación (pendiente).','ε adimensional'],
 ['Cristalinidad % = A<sub>cristalina</sub>/A<sub>total</sub> × 100','<b>Grado de cristalinidad</b> a partir de áreas de picos frente al halo amorfo.','']
]},
   {prob:{t:'Indexar, obtener el parámetro de red y el tamaño de cristalito',
 d:'Difractograma con radiación de cobre (λ = 0.15406 nm). Primer pico a 2θ = 38.19° con FWHM de 0.52°. El ensanchamiento instrumental medido con un patrón es 0.08°. La secuencia de h²+k²+l² observada es 3, 4, 8, 11.',
 p:['La secuencia 3, 4, 8, 11 corresponde a índices <b>todos pares o todos impares</b>: (111), (200), (220), (311). Es una red <b>FCC</b>.',
    'Espaciado del primer pico: θ = 38.19/2 = <b>19.095°</b>, sen θ = 0.3271. d = λ/(2 sen θ) = 0.15406/0.6542 = <b>0.2355 nm</b>.',
    'Parámetro de red: a = d·√(h²+k²+l²) = 0.2355 × √3 = 0.2355 × 1.7321 = <b>0.4079 nm</b>. Corresponde a plata metálica.',
    'Ensanchamiento corregido: β = 0.52 − 0.08 = <b>0.44°</b>. En radianes: 0.44 × π/180 = <b>7.679×10⁻³ rad</b>.',
    'Scherrer: D = 0.9 × 0.15406 / (7.679×10⁻³ × cos 19.095°) = 0.13865/(7.679×10⁻³ × 0.9450) = 0.13865/7.257×10⁻³ = <b>19.1 nm</b>.'],
 r:'Red FCC con a = 0.408 nm (plata) y cristalitos de unos 19 nm.',
 x:'Tres trampas en un solo problema: usar <b>2θ</b> en lugar de θ en el seno, no convertir el FWHM a <b>radianes</b>, y no restar el <b>ensanchamiento instrumental</b>. Además, si el TEM mostrara partículas de 60 nm no habría contradicción: serían policristalinas, con varios dominios de 19 nm cada una.'}}]},
  {t:'Microscopía: qué limita a cada una',b:[
   {p:['Los electrones ven más porque su longitud de onda de de Broglie es miles de veces menor que la de la luz visible, y el límite de resolución escala con λ.']},
   {fig:FIG.sem},
   {p:['El haz de electrones genera varias señales a la vez, y cada una responde una pregunta distinta. Los <b>electrones secundarios</b> son de baja energía y escapan solo de los primeros nanómetros: dan <b>topografía</b>. Los <b>retrodispersados</b> vienen de interacciones elásticas con el núcleo, cuya probabilidad crece con Z: dan <b>contraste por composición</b>, donde lo pesado brilla. Los <b>rayos X característicos</b> nacen de todo el volumen de interacción y dan <b>composición elemental</b> por EDS. Y en TEM, los <b>transmitidos</b> atraviesan una muestra delgada y revelan el interior con resolución atómica.']},
   {p:['De ahí el reparto de tareas que se pregunta como caso: para <b>superficie tridimensional sin preparación adicional</b>, AFM, que además mide fuerzas e interacciones; para <b>interior de muestra delgada con resolución atómica</b>, TEM; para <b>superficie con información de composición</b>, SEM con EDS.']},
   {ul:['<b>SEM</b>: electrones secundarios dan topografía con gran profundidad de campo; retrodispersados dan contraste por número atómico (lo pesado se ve más brillante).',
        '<b>TEM</b>: transmisión a través de muestra ultradelgada. Resolución atómica, estructura interna, interfases core-shell, y difracción de electrones de una partícula individual.',
        '<b>AFM</b>: mide fuerzas con una punta en micropalanca. Funciona en aire y en líquido, sin vacío ni metalización, y da resolución vertical subnanométrica.']},
   {p:['Los electrones ven más que la luz porque su longitud de onda de de Broglie es miles de veces menor, y el límite de resolución escala con ella. Para una <b>muestra biológica hidratada</b> que no puede deshidratarse ni metalizarse, sin embargo, la respuesta es <b>AFM en líquido</b>: mide fuerzas y no necesita vacío ni recubrimiento conductor.']},
   {p:['Toda imagen de AFM es la <b>convolución</b> entre la topografía real y la geometría de la punta: los objetos salientes aparecen más anchos y los huecos más estrechos. Por eso al medir nanopartículas con AFM se usa la <b>altura</b>, no la anchura: la altura no depende del radio de la punta.']},
   {p:['Y la discrepancia que más confunde: <b>DLS da un valor mayor que TEM</b> y las dos son correctas. TEM mide el núcleo sólido seco y da distribución en número; DLS mide el diámetro hidrodinámico, que incluye recubrimiento y solvatación, y su distribución en intensidad escala con la sexta potencia del diámetro, así que un solo agregado pesa como un millón de partículas pequeñas. Una razón de 1.2 a 2 veces es normal; mucho más sugiere agregación real en suspensión.']}
  ,
   {form:[
 ['d = 0.61λ / (n·sen α)','<b>Criterio de Rayleigh</b>: el límite de difracción óptico, unos 200 nm en el visible.','n·sen α es la apertura numérica'],
 ['λ = h/√(2m<sub>e</sub>eV) ≈ 1.226/√V nm','<b>De Broglie</b> para electrones acelerados; a 200 kV, λ ≈ 2.5 pm. Por eso el TEM resuelve átomos.','V en volts'],
 ['D<sub>h</sub> = kT / (3πηD<sub>t</sub>)','<b>Stokes-Einstein</b>: de la difusión medida por DLS al diámetro <b>hidrodinámico</b>, que incluye la capa solvatada.','η en Pa·s, D<sub>t</sub> en m²/s'],
 ['I ∝ d⁶','<b>Dispersión de Rayleigh</b> en DLS: una sola partícula grande pesa tanto como un millón de pequeñas. De ahí que el DLS sobrestime frente al TEM.',''],
 ['PDI &lt; 0.1 monodisperso · 0.1–0.4 moderado · &gt; 0.7 no interpretable','<b>Índice de polidispersidad</b> del DLS por acumulantes.','adimensional']
]},
   {prob:{t:'De DLS a diámetro, y por qué no coincide con el TEM',
 d:'Una suspensión acuosa a 25 °C da un coeficiente de difusión traslacional de 1.96×10⁻¹² m²/s. η(agua, 25 °C) = 8.90×10⁻⁴ Pa·s, k = 1.381×10⁻²³ J/K. El TEM del mismo lote da 18 nm.',
 p:['Stokes-Einstein: D<sub>h</sub> = kT/(3πηD<sub>t</sub>).',
    'Numerador: kT = 1.381×10⁻²³ × 298.15 = <b>4.118×10⁻²¹ J</b>.',
    'Denominador: 3π·η·D<sub>t</sub> = 9.4248 × 8.90×10⁻⁴ × 1.96×10⁻¹² = <b>1.644×10⁻¹⁴ J·s/m²·s</b>.',
    'D<sub>h</sub> = 4.118×10⁻²¹ / 1.644×10⁻¹⁴ = 2.50×10⁻⁷ m = <b>250 nm</b>.',
    'Frente a los 18 nm del TEM, la diferencia es de más de un orden: no es un error de cálculo, es <b>agregación</b> en suspensión, y lo confirma que el TEM vea contornos individuales limpios.'],
 r:'D<sub>h</sub> = 250 nm por DLS frente a 18 nm por TEM: las partículas están agregadas en el medio líquido.',
 x:'DLS y TEM miden cosas distintas y en estados distintos. El DLS da el diámetro <b>hidrodinámico en suspensión</b>, pondera por intensidad (que va con d⁶) e incluye la capa solvatada y el estabilizante. El TEM mide el <b>núcleo seco</b> sobre una rejilla. Que el DLS salga mayor es lo normal; que salga diez veces mayor indica agregación.'}},
   {p:['La <b>microscopía óptica</b> es la línea base contra la que se mide todo lo demás, y conviene tenerla clara porque el examen la usa como distractor. Su resolución está limitada por difracción al criterio de Abbe, d = λ/(2·AN), lo que con luz visible y una apertura numérica de 1.4 en inmersión da unos <b>200 nm</b>. Ninguna nanopartícula individual se resuelve ahí: lo que se ve de un coloide es dispersión, no la partícula.']},
   {p:['La <b>microscopía confocal</b> no rompe ese límite lateral: lo que hace es rechazar con un diafragma la luz que no viene del plano focal, lo que mejora el contraste y permite <b>seccionar ópticamente</b> y reconstruir en tres dimensiones. Sirve para ver dónde se acumula una nanopartícula marcada dentro de una célula, no para medir su tamaño.']},
   {p:['Las técnicas de <b>superresolución</b> (STED, PALM, STORM) sí bajan de los 200 nm, hasta decenas de nanómetros, pero exigen marcadores fluorescentes y no son técnicas de rutina en caracterización de materiales. La regla práctica para el examen: si la pregunta pide <b>tamaño o morfología de nanopartícula</b>, la óptica no es la respuesta; si pide <b>localización dentro de un sistema biológico</b>, la confocal con marcaje sí lo es.']}]},
  {t:'Espectroscopía y análisis térmico',b:[
   {tabla:{th:['','FTIR','Raman'],tr:[
     ['Fenómeno','Absorción','Dispersión inelástica'],
     ['Regla de selección','Cambio de <b>momento dipolar</b>','Cambio de <b>polarizabilidad</b>'],
     ['Brilla en','Enlaces polares: C=O, O–H, C≡N','Enlaces simétricos no polares, S–S, modos de red'],
     ['En agua','Saturado por el disolvente','Agua dispersa poco: técnica de elección']]}},
   {p:['En moléculas con centro de simetría vale la <b>regla de exclusión mutua</b>: un modo activo en IR no puede serlo en Raman. En CO₂ la tensión simétrica es Raman-activa e IR-inactiva, y la asimétrica al revés.']},
   {p:['El Raman es extraordinariamente débil, del orden de un fotón inelástico por cada diez millones, y de ahí la importancia de <b>SERS</b>, donde una superficie metálica nanoestructurada amplifica el campo local. El factor escala aproximadamente como la <b>cuarta potencia</b> del refuerzo de campo, porque la amplificación entra dos veces: en la excitación y en la reemisión. Por eso los puntos calientes dominan la señal.']},
   {p:['Térmico: <b>TGA mide masa, DSC mide energía</b>. Una Tg, una fusión o una transición polimórfica no cambian la masa y son invisibles en TGA. En una nanopartícula recubierta leída en aire, la pérdida por debajo de 120 °C es agua fisisorbida y la de 200 a 400 °C es el recubrimiento orgánico; el residuo por encima de 450 °C es el inorgánico.']},
   {deep:{t:'Leer una curva de TGA de una nanopartícula funcionalizada',b:[
     {p:['Caso típico: óxido de hierro recubierto con ácido oleico, analizado en aire de 25 a 800 °C. La curva muestra tres zonas y cada una se interpreta distinto.'],},
     {tabla:{th:['Intervalo','Pérdida','Qué es'],tr:[
       ['25–120 °C','~2 %','Agua fisisorbida y disolvente residual. <b>No</b> cuenta como recubrimiento'],
       ['200–400 °C','~14 %','Descomposición oxidativa del recubrimiento orgánico. Este es el dato que interesa'],
       ['> 450 °C','Meseta','Residuo inorgánico estable']]}},
     {p:['Con el área superficial por BET y la masa molar del ligando se estima la densidad de injerto en moléculas por nanómetro cuadrado, que indica si el recubrimiento es monocapa o multicapa desordenada.'],},
     {p:['Dos advertencias. La <b>atmósfera importa</b>: en aire la parte orgánica se oxida y desaparece, mientras que en nitrógeno se pirolisa y deja residuo carbonoso, lo que subestimaría el recubrimiento. Y si el inorgánico puede oxidarse (magnetita a maghemita o hematita), en aire habrá una ganancia de masa superpuesta a la pérdida orgánica que falsea el cálculo: en esos casos se trabaja en inerte y se corrige por el residuo.']}
   ]}},
   {p:['Para <b>cuantificar metales traza en un digerido acuoso</b> con límites de partes por billón la respuesta es ICP-MS: el plasma ioniza todos los elementos a la vez y la espectrometría de masas llega a ese nivel. La AAS de llama es monoelemental y se queda en partes por millón; FTIR y DRX no cuantifican metales en disolución.']},
   {p:['Y un artefacto de AFM que conviene reconocer: si <b>todos los objetos aparecen con la misma forma doble repetida</b>, la punta está rota o contaminada y está imprimiendo su propia geometría en cada objeto. La firma del artefacto es justamente esa repetición idéntica, porque los objetos reales no comparten una forma exacta.']},
   {p:['Límites de EDS que conviene declarar: detecta mal los elementos ligeros, su volumen de interacción es de micras (así que al analizar una nanopartícula sobre un sustrato buena parte de la señal viene del sustrato), es semicuantitativo con LOD de 0.1 a 1 % en masa, y <b>no distingue estados de oxidación</b> porque sus rayos X vienen de transiciones internas. Para eso, XPS. EELS, en cambio, destaca justo en los ligeros: son complementarios.']}
  ,
   {form:[
 ['ν̄(cm⁻¹) = 1/λ(cm)   ·   ν̄ ∝ √(k/µ)','<b>Número de onda</b> de una vibración: sube con la fuerza del enlace y baja con la masa reducida.',''],
 ['Regla de exclusión mutua','En moléculas con <b>centro de simetría</b>, un modo activo en Raman es inactivo en IR, y viceversa.',''],

 ['Tg: escalón en la línea base · Tm: pico endotérmico · Tc: pico exotérmico','<b>DSC</b>: la transición vítrea no tiene pico porque es de segundo orden.','']
]},
   {p:['La <b>espectroscopía UV-Vis</b> es la más barata y la más preguntada. Mide absorción electrónica, es decir transiciones de electrones entre niveles, y en nanotecnología entrega tres cosas distintas según el sistema. En <b>semiconductores</b>, el borde de absorción da la brecha prohibida por E<sub>g</sub> = 1240/λ, y el ajuste de Tauc lo precisa. En <b>metales plasmónicos</b>, la posición y el ancho de la banda de plasmón informan del tamaño, la forma y el estado de agregación: el oro coloidal esférico de 20 nm absorbe cerca de 520 nm, y si la banda se corre al rojo y se ensancha, hay agregación. En <b>moléculas</b>, sirve para cuantificar por la ley de Beer.']},
   {p:['La <b>resonancia magnética nuclear</b> no mide el material sólido de rutina, pero es la técnica de elección para <b>determinar la estructura de una molécula orgánica</b>: entorno químico de cada hidrógeno o carbono por el desplazamiento químico, número de vecinos por la multiplicidad y número de núcleos por la integración. En nanotecnología se usa para confirmar la identidad del ligando que recubre una partícula, y su versión de estado sólido para entornos locales en materiales amorfos.']},
   {p:['La <b>espectroscopía de pérdida de energía de electrones</b> (EELS) se hace dentro del TEM y mide cuánta energía perdió cada electrón al atravesar la muestra. Da composición elemental con <b>resolución espacial casi atómica</b>, es especialmente sensible a los elementos ligeros que el EDS detecta mal (carbono, nitrógeno, oxígeno) y, en la región de baja pérdida, entrega el gap óptico y la energía de plasmón. Es la respuesta cuando la pregunta pide <b>composición elemental punto por punto en la nanoescala</b>.']},
   {form:[
    ['E<sub>g</sub>(eV) = 1240 / λ<sub>borde</sub>(nm)','<b>Brecha</b> a partir del borde de absorción UV-Vis. Es la relación numérica más preguntada del examen.','λ en nm'],
    ['(αhν)^(1/n) contra hν','<b>Ajuste de Tauc</b>: la extrapolación de la recta al eje da E<sub>g</sub>. n = 1/2 para gap directo y n = 2 para indirecto.',''],
    ['λ<sub>plasmón</sub>(Au esférico) ≈ 520 nm','<b>Plasmón del oro coloidal</b>. Se corre al rojo y se ensancha al agregarse o al alargar la partícula.',''],
    ['d = λ / (2·AN)','<b>Criterio de Abbe</b>: el límite de difracción óptico, unos 200 nm en el visible.','AN es la apertura numérica'],
    ['δ (ppm) · multiplicidad · integración','Las tres lecturas de un espectro de <b>RMN</b>: entorno químico, número de vecinos y número de núcleos.','']

  ['En la ley de Bragg, ¿qué ángulo se usa?','θ, que es la MITAD del 2θ que reporta el difractómetro. Es el error más frecuente del módulo.'],
  ['¿Qué distingue tamaño de cristalito de tamaño de partícula?','Scherrer da el dominio coherente. Una partícula policristalina de 60 nm puede tener cristalitos de 12 nm.'],
  ['Posiciones de picos correctas pero intensidades relativas no: ¿qué indica?','Orientación preferencial de los cristalitos. Típico en películas delgadas y materiales laminares.'],
  ['DLS da 45 nm y TEM 22 nm: ¿cuál miente?','Ninguna. DLS mide diámetro hidrodinámico con recubrimiento y solvatación, y pesa más las grandes (intensidad ∝ d⁶).'],
  ['Al medir nanopartículas con AFM, ¿altura o anchura?','Altura. La anchura está ensanchada por la convolución con la punta; la resolución vertical es subnanométrica.'],
  ['Reglas de selección de IR y Raman','IR: cambio de momento dipolar. Raman: cambio de polarizabilidad. En centrosimétricas se excluyen mutuamente.'],
  ['¿Por qué SERS amplifica con la cuarta potencia?','La amplificación actúa en la excitación y en la reemisión, y cada una va con el cuadrado del campo.'],
  ['TGA frente a DSC','TGA mide masa; DSC mide energía. La Tg no cambia la masa, así que solo la ve el DSC.'],
