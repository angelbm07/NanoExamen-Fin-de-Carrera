{m:'M5',t:'Fuerzas intermoleculares: por qué las cosas hierven cuando hierven',dur:25,
 obj:['Ordenar las fuerzas intermoleculares y predecir su efecto','Explicar el comportamiento de gases reales y los diagramas de fase','Aplicar propiedades coligativas sin olvidar el factor i'],
 sec:[
  {t:'La escala de energías que hay que tener en la cabeza',p:'Un enlace covalente cuesta cientos de kilojoules por mol romperlo. Un puente de hidrógeno, unas decenas. Una interacción de dispersión de London, unos pocos. Esa diferencia de uno o dos órdenes de magnitud es la clave para no confundir fenómenos.\n\nCuando el agua hierve no se rompe ningún enlace O–H: solo se vencen los puentes de hidrógeno entre moléculas. Por eso hierve a 100 °C y no a miles de grados. En cambio, fundir NaCl sí exige romper la red iónica completa, y por eso ocurre a 801 °C. Comparar puntos de ebullición sin distinguir qué se está rompiendo es un error frecuente.'},
  {t:'El orden y sus consecuencias',p:'De mayor a menor: ion-dipolo, puente de hidrógeno, dipolo-dipolo y dispersión de London. La dispersión existe siempre, incluso entre moléculas no polares, y crece con el tamaño de la nube electrónica, por eso el yodo es sólido y el flúor gas.\n\nEstas fuerzas fijan punto de ebullición, viscosidad, tensión superficial y solubilidad. La regla de que lo semejante disuelve a lo semejante no es folclore: es el balance entre las interacciones soluto-soluto, disolvente-disolvente y soluto-disolvente. Y en nanotecnología reaparecen dos veces más, como la atracción de van der Waals que en la teoría DLVO empuja a las partículas a agregarse, y como el origen de la energía superficial.'},
  {t:'Gases reales y diagramas de fase',p:'La ecuación del gas ideal supone moléculas puntuales sin interacción. Van der Waals corrige ambas cosas: b descuenta el volumen propio de las moléculas y a compensa la atracción entre ellas. La desviación se vuelve importante justo donde esas correcciones pesan, es decir a baja temperatura y alta presión, que son las condiciones de licuefacción.\n\nEl diagrama de fases resume qué fase es estable en cada condición, con su punto triple y su punto crítico. El agua es la anomalía célebre: su línea sólido-líquido tiene pendiente NEGATIVA porque el hielo, con su red abierta de puentes de hidrógeno, es menos denso que el líquido. Aumentar la presión funde el hielo en lugar de solidificar el agua. De ahí que el hielo flote, que los lagos se congelen desde arriba y que las tuberías revienten.'},
  {t:'Propiedades coligativas y el error número uno',p:'Añadir soluto aumenta el desorden de la fase líquida y la estabiliza frente al sólido y al vapor. El resultado son cuatro efectos que dependen del NÚMERO de partículas y no de su identidad química: descenso de la presión de vapor, elevación del punto de ebullición, descenso del punto de congelación y presión osmótica.\n\nAquí está el error más frecuente de todo el módulo. Como lo que cuenta son las partículas, hay que multiplicar por el factor de van \'t Hoff, que es en cuántas partículas se disocia cada fórmula: 1 para glucosa, 2 para NaCl, 3 para CaCl₂. En los exámenes de opción múltiple siempre hay un distractor que es exactamente la respuesta correcta sin ese factor. Si tu resultado coincide sospechosamente con una opción, verifica que no olvidaste el i.'}
 ],
 clave:['Hervir un líquido molecular vence fuerzas intermoleculares; fundir una sal rompe la red iónica. Son escalas de energía distintas.','El agua tiene pendiente negativa en la línea sólido-líquido porque el hielo es menos denso que el líquido.','Las coligativas dependen del número de partículas: sin el factor i el resultado está mal y suele coincidir con un distractor.'],
 check:[
  {q:'¿Cuál tiene mayor descenso crioscópico a igual molalidad: glucosa, NaCl o CaCl₂?',
   a:'CaCl₂, porque se disocia en tres partículas (i = 3), frente a dos del NaCl y una de la glucosa. El efecto es proporcional a i, no a la masa ni a la identidad del soluto.'},
  {q:'¿Por qué el CO₂ sublima a presión atmosférica mientras el agua funde?',
   a:'Porque el punto triple del CO₂ está por encima de 1 atm (a unos 5.2 atm), así que a presión atmosférica no existe la fase líquida y el sólido pasa directo a gas. El del agua está muy por debajo de 1 atm, así que la fase líquida sí es accesible.'}
 ],
 conc:['imf','gas-real','estados','diagrama-fases','coligativas','polaridad']},

{m:'M5',t:'Energía y espontaneidad: la brújula de Gibbs',dur:30,
 obj:['Aplicar ΔG = ΔH − TΔS y predecir el efecto de la temperatura','Conectar ΔG° con la constante de equilibrio','Distinguir posibilidad termodinámica de viabilidad cinética'],
 sec:[
  {t:'La pregunta que responde la termodinámica',p:'La termodinámica responde una sola pregunta: ¿este proceso puede ocurrir por sí solo? No responde cuándo ni qué tan rápido. Confundir ambas cosas es el malentendido más común del módulo y aparece con seguridad en el examen.\n\nLa herramienta es la energía libre de Gibbs, ΔG = ΔH − TΔS. Gibbs la construyó combinando la primera y la segunda ley de modo que el criterio de espontaneidad dependa solo del sistema, sin tener que calcular la entropía del entorno. Si ΔG es negativo, el proceso es espontáneo.'},
  {t:'Los cuatro casos y el papel de la temperatura',p:'Como ΔG tiene dos términos con signos posibles, hay cuatro combinaciones y conviene razonarlas en lugar de memorizarlas. Si ΔH es negativo y ΔS positivo, ambos términos favorecen y el proceso es espontáneo a cualquier temperatura. Si ΔH es positivo y ΔS negativo, nunca lo es.\n\nLos casos interesantes son los mixtos. Con ΔH y ΔS ambos positivos, el término −TΔS solo gana a temperatura ALTA: son procesos que necesitan calor para ocurrir, como la fusión o la vaporización. Con ambos negativos, ocurre lo contrario y la espontaneidad se da a temperatura BAJA, como en la cristalización. La temperatura es la perilla que decide cuál de los dos términos manda.\n\nUn cuidado de unidades: ΔH suele tabularse en kJ/mol y ΔS en J/mol·K. Hay que homogeneizar antes de restar, y no hacerlo produce errores de factor mil.'},
  {t:'De ΔG a la constante de equilibrio',p:'La relación ΔG° = −RT ln K es el puente entre termodinámica y equilibrio, y se obtiene imponiendo ΔG = 0 en el equilibrio, lo que hace que el cociente de reacción Q iguale a K.\n\nSu lectura práctica: si K es mayor que 1, ΔG° es negativo y el equilibrio favorece productos. Si K es menor que 1, favorece reactivos. Y como K depende de la temperatura a través de la ecuación de van \'t Hoff, con ΔH° positivo K crece al calentar y con ΔH° negativo K disminuye. Eso es exactamente lo que el principio de Le Chatelier predice de forma cualitativa, ahora con números.\n\nLa misma ecuación reaparece en electroquímica como ΔG° = −nFE°, lo que significa que el potencial estándar de una celda y su constante de equilibrio son la misma información en unidades distintas.'},
  {t:'Espontáneo no es rápido',p:'La conversión de diamante a grafito tiene ΔG negativo. El diamante es termodinámicamente inestable y sin embargo dura eones, porque la barrera de activación es enorme. El papel en presencia de oxígeno tiene ΔG muy negativo y necesita una chispa.\n\nEsa es la distinción que hay que tener clara: la termodinámica dice si el destino es alcanzable, la cinética dice si llegarás en tu vida. Las dos soluciones prácticas para un proceso lento pero favorable son subir la temperatura, que aumenta k según Arrhenius, o añadir un catalizador, que abre una ruta de menor energía de activación.\n\nY aquí una precisión que se pregunta seguido: el catalizador baja la barrera en AMBOS sentidos por igual. Acelera la llegada al equilibrio pero no lo desplaza, no cambia K y no cambia ΔH.'}
 ],
 clave:['ΔG = ΔH − TΔS. Con ambos positivos la espontaneidad llega a T alta; con ambos negativos, a T baja.','ΔG° = −RT ln K = −nFE°: termodinámica, equilibrio y electroquímica son la misma información.','ΔG negativo dice que se puede, no que sea rápido. La velocidad la fija Ea.'],
 check:[
  {q:'Una reacción tiene ΔH = +30 kJ/mol y ΔS = +100 J/mol·K. ¿A partir de qué temperatura es espontánea?',
   a:'Se iguala ΔG = 0: T = ΔH/ΔS = 30 000 J/mol ÷ 100 J/mol·K = 300 K. Por encima de 300 K el término entrópico domina y el proceso es espontáneo. Nótese la conversión de kJ a J.'},
  {q:'Si un catalizador no desplaza el equilibrio, ¿por qué se usa en procesos industriales donde interesa el rendimiento?',
   a:'Porque permite operar a temperatura más baja con velocidad aceptable. Y como muchas reacciones industriales son exotérmicas, bajar la temperatura sí desplaza el equilibrio hacia productos. El catalizador no cambia K, pero hace viable la temperatura a la que K es favorable.'}
 ],
 conc:['entalpia','entropia','gibbs','equilibrio','lechatelier','catalisis']},

{m:'M5',t:'Equilibrio y velocidad: dos preguntas distintas',dur:30,
 obj:['Aplicar Le Chatelier con criterio en temperatura, presión y concentración','Determinar el orden de reacción a partir de datos','Interpretar Arrhenius y el papel de un catalizador'],
 sec:[
  {t:'El equilibrio es dinámico',p:'Cuando una reacción alcanza el equilibrio no se detiene: las velocidades directa e inversa se igualan. Esa distinción importa porque explica por qué el sistema puede responder a una perturbación.\n\nLa constante K relaciona concentraciones de productos y reactivos, con sólidos y líquidos puros excluidos porque su actividad es constante. Comparar el cociente de reacción Q contra K dice hacia dónde se moverá el sistema: si Q es menor que K, avanza hacia productos.\n\nPara gases, Kp = Kc(RT)^Δn, donde Δn es el cambio en moles gaseosos. Si Δn es cero, ambas coinciden, y los distractores suelen explotar el caso en que no lo es.'},
  {t:'Le Chatelier con números detrás',p:'Añadir reactivo o retirar producto desplaza hacia productos. Aumentar la presión, o equivalentemente reducir el volumen, desplaza hacia el lado con menos moles gaseosos. Y la temperatura actúa según el signo de ΔH: en una reacción exotérmica el calor es un producto, así que calentar desplaza hacia REACTIVOS.\n\nEse último caso es el que más se pregunta, típicamente con la síntesis de amoniaco: exotérmica y con reducción de moles gaseosos, así que el rendimiento mejora a baja temperatura y alta presión. Pero a baja temperatura la velocidad es inaceptable, y ahí aparece el compromiso real de la ingeniería química: se opera a temperatura intermedia con catalizador. Reconocer ese conflicto entre termodinámica y cinética es lo que distingue una respuesta de ingeniería de una de primer año.'},
  {t:'El orden de reacción es experimental',p:'La ley de velocidad tiene la forma v = k[A]^m[B]^n, y aquí va la advertencia central: los exponentes NO se leen de los coeficientes estequiométricos, salvo en etapas elementales. Se determinan experimentalmente.\n\nEl método práctico es la linealización. Para orden cero, [A] contra t da recta. Para orden uno, ln[A] contra t. Para orden dos, 1/[A] contra t. Se grafican las tres y la que salga recta identifica el orden, con la pendiente dando k.\n\nUn atajo diagnóstico útil son las unidades de k: mol·L⁻¹·s⁻¹ para orden cero, s⁻¹ para orden uno, L·mol⁻¹·s⁻¹ para orden dos. Si un reactivo te da k con unidades, ya te dijo el orden.'},
  {t:'Arrhenius y el significado de la barrera',p:'k = A·e^(−Ea/RT). Arrhenius la propuso al notar que ln k contra 1/T daba rectas, y la interpretación posterior es que el término exponencial representa la fracción de colisiones con energía suficiente para superar la barrera, según la distribución de Boltzmann.\n\nDe ahí sale la regla práctica de que subir 10 °C cerca de temperatura ambiente duplica aproximadamente la velocidad de muchas reacciones orgánicas, lo que corresponde a Ea de unos 50 kJ/mol.\n\nEl catalizador actúa exclusivamente sobre Ea, abriendo una ruta alternativa. En catálisis heterogénea la reacción ocurre en la superficie del catalizador, y por eso los nanomateriales de alta área específica son tan eficientes: esa conexión entre este módulo y el de síntesis conviene tenerla presente.'}
 ],
 clave:['Exotérmica más calentar desplaza hacia REACTIVOS. El signo de ΔH decide la dirección.','El orden de reacción se determina experimentalmente, y las unidades de k lo delatan.','Un catalizador baja Ea en ambos sentidos: acelera sin desplazar el equilibrio ni cambiar K.'],
 check:[
  {q:'Para 2NO(g) + O₂(g) → 2NO₂(g), ¿puedes afirmar que la reacción es de orden 2 en NO?',
   a:'No sin datos experimentales. Los coeficientes solo dan el orden si la reacción es elemental, y la mayoría no lo son. Podría ser de orden distinto si el mecanismo tiene varias etapas con una determinante.'},
  {q:'Una constante de velocidad tiene unidades de L·mol⁻¹·s⁻¹. ¿Qué orden global tiene la reacción?',
   a:'Segundo orden global. La velocidad debe salir en mol·L⁻¹·s⁻¹, así que si k lleva L·mol⁻¹·s⁻¹, debe multiplicar por concentración al cuadrado.'}
 ],
 conc:['equilibrio','lechatelier','cinetica','arrhenius','catalisis','acido-base']},

{m:'M5',t:'La frontera importa: superficies, adsorción y mojado',dur:30,
 obj:['Explicar el origen de la energía superficial y sus consecuencias','Distinguir Langmuir de BET y saber cuándo aplica cada uno','Aplicar Young, Wenzel y Cassie-Baxter al mojado de superficies'],
 sec:[
  {t:'Por qué la superficie cuesta energía',p:'Un átomo en el interior de un sólido tiene todos sus enlaces satisfechos. Un átomo en la superficie no: le faltan vecinos. Esa insatisfacción tiene un costo energético por unidad de área, que es la energía superficial γ, medida en J/m² o equivalentemente N/m.\n\nDe ese único hecho salen consecuencias que reaparecen en tres módulos. Un sistema tiende a minimizar su área total, y por eso las gotas son esféricas, las partículas pequeñas se agregan, y aparece la maduración de Ostwald. En la nanoescala, donde la relación superficie/volumen es enorme, este término deja de ser una corrección y pasa a dominar.'},
  {t:'Adsorción: Langmuir y BET',p:'Cuando moléculas de gas o de soluto se acumulan sobre una superficie, hablamos de adsorción. Langmuir la modeló igualando las velocidades de adsorción y desorción sobre un número finito de sitios equivalentes e independientes, y obtuvo θ = KP/(1+KP), una hipérbola de saturación.\n\nEsa forma funcional merece atención porque es la MISMA que la de Michaelis-Menten en enzimas y la de ocupación de un receptor por un ligando. Tres temas de tres módulos distintos con idéntica matemática: sitios finitos que se van llenando, respuesta lineal a baja concentración y saturación a alta.\n\nBET extiende el modelo permitiendo capas sucesivas, y es el método normalizado para medir área superficial específica por adsorción de nitrógeno. Se ajusta en el intervalo de presión relativa de 0.05 a 0.30 y no es fiable en microporos, donde el llenado no ocurre por capas sino por condensación.'},
  {t:'Curvatura: Laplace, Kelvin y sus consecuencias',p:'Una interfaz curva sostiene una diferencia de presión, ΔP = 2γ/r según Young-Laplace. Cuanto menor el radio, mayor la sobrepresión: una gota de 1 µm soporta alrededor de una atmósfera y media.\n\nLa ecuación de Kelvin traslada esa idea al equilibrio con el vapor: la presión de vapor de una gota pequeña es mayor que la de una superficie plana. Y su análogo para solubilidad, Ostwald-Freundlich, dice que una partícula pequeña es más soluble que una grande.\n\nAhí está el mecanismo completo de la maduración de Ostwald: las partículas pequeñas se disuelven, el material difunde y se deposita sobre las grandes. No hay contacto entre partículas, todo ocurre por difusión. Y el efecto Gibbs-Thomson es la misma idea aplicada a la fusión, explicando por qué nanopartículas de oro funden cientos de grados por debajo del oro masivo.'},
  {t:'Mojado: de Young a la superhidrofobicidad',p:'El ángulo de contacto surge del balance de tres energías interfaciales, según la ecuación de Young. Por debajo de 90° la superficie es hidrofílica, por encima hidrofóbica.\n\nPero las superficies reales son rugosas, y la rugosidad amplifica lo que ya hay. En el régimen de Wenzel el líquido moja toda la textura y cos θ_W = r·cos θ, donde r es el factor de rugosidad: una superficie hidrofóbica se vuelve más hidrofóbica, y una hidrofílica más hidrofílica.\n\nEn el régimen de Cassie-Baxter la gota se apoya sobre aire atrapado y solo toca una fracción f del sólido, dando cos θ_C = f(cos θ + 1) − 1. Este es el que produce superhidrofobicidad real, por encima de 150°, y es el efecto loto. La diferencia numérica entre ambos regímenes es grande: con los mismos datos, Wenzel puede dar 115° y Cassie 153°.'}
 ],
 clave:['Langmuir, Michaelis-Menten y ocupación de receptor son la misma hipérbola de saturación.','La curvatura eleva presión de vapor y solubilidad: eso explica Ostwald y la depresión del punto de fusión.','Wenzel moja la textura; Cassie-Baxter atrapa aire y es el que da superhidrofobicidad.'],
 check:[
  {q:'¿Por qué añadir a una emulsión un aceite muy insoluble en agua frena la maduración de Ostwald?',
   a:'Porque Ostwald requiere que el material de la fase dispersa difunda a través de la fase continua. Un componente insoluble no puede migrar, y al quedar atrapado en las gotas pequeñas genera una presión osmótica interna que contrarresta la diferencia de solubilidad por curvatura.'},
  {q:'Una superficie lisa tiene ángulo de contacto de 70°. Si le añades rugosidad con r = 1.5, ¿se vuelve más o menos mojable?',
   a:'Más mojable. cos 70° = 0.342, positivo, así que cos θ_W = 1.5 × 0.342 = 0.513 y θ_W = 59°. Wenzel amplifica la tendencia existente: como partía de hidrofílica, se vuelve más hidrofílica.'}
 ],
 conc:['energia-superficial','adsorcion','laplace-kelvin','angulo-contacto','wenzel-cassie','dlvo']},

/* ---------- M2 ---------- */
{m:'M2',t:'La cadena analítica: del mol al resultado confiable',dur:25,
 obj:['Recorrer las etapas de un análisis y saber dónde se pierde exactitud','Manejar concentraciones y diluciones sin error','Distinguir exactitud de precisión y sus causas'],
 sec:[
  {t:'Un análisis es una cadena, no una medición',p:'Cuando alguien dice que midió la concentración de plomo en un agua, en realidad ejecutó una cadena de al menos seis pasos: muestreo, preparación, separación si hace falta, medición instrumental, calibración e interpretación estadística. La exactitud del resultado final la limita el eslabón más débil, no el instrumento más caro.\n\nEse es el marco mental del módulo. Casi todos los reactivos preguntan, de una forma u otra, en qué eslabón está el problema.'},
  {t:'El mol y las concentraciones',p:'Desde 2019 el mol se define fijando el número de Avogadro en exactamente 6.02214076×10²³ mol⁻¹, no ya por el kilogramo de carbono-12. De ahí, n = m/M y todo lo demás.\n\nConviene tener claras las unidades de concentración y cuándo usar cada una. La molaridad depende del volumen y por tanto de la temperatura; la molalidad no, y por eso las propiedades coligativas la usan. Las partes por millón equivalen aproximadamente a mg/L solo si la densidad es cercana a 1 g/mL, aproximación que falla en disolventes orgánicos.\n\nLa relación de dilución C₁V₁ = C₂V₂ no es más que conservación de moles. Un detalle que confunde: una dilución 1:10 significa una parte de muestra y nueve de disolvente, no una en diez de disolvente.'},
  {t:'Exactitud y precisión no son sinónimos',p:'La exactitud mide qué tan cerca está el resultado del valor verdadero y la degrada el error SISTEMÁTICO, que es un sesgo constante o proporcional. La precisión mide la reproducibilidad entre réplicas y la degrada el error ALEATORIO.\n\nLa consecuencia práctica es que se corrigen de forma distinta. La precisión mejora con más réplicas, porque el error estándar de la media cae como 1/√n: cuadruplicar las réplicas reduce a la mitad la incertidumbre. La exactitud NO mejora repitiendo: un sesgo constante se repite igual de bien cada vez. Solo se detecta comparando contra algo externo, como un material de referencia certificado, un método independiente o un ensayo de recuperación.\n\nEste par de conceptos es material de examen casi garantizado, normalmente en forma de un método que da valores consistentemente altos: eso es mala exactitud con buena precisión.'},
  {t:'Cifras significativas como comunicación honesta',p:'Reportar 34.5729 ppm a partir de una absorbancia de tres cifras no es más preciso, es deshonesto: sugiere una calidad de dato que no existe.\n\nLas dos reglas son distintas y se confunden. En multiplicación y división manda el menor número de CIFRAS significativas. En suma y resta manda el menor número de DECIMALES. Por eso 12.11 + 8.4 + 1.234 da 21.7 y no 21.744: el 8.4 solo tiene un decimal.\n\nLo ideal es acompañar el resultado de su incertidumbre estimada, calculada por propagación a partir de las incertidumbres de entrada. Eso además revela cuál medición limita el resultado y por tanto qué instrumento vale la pena mejorar.'}
 ],
 clave:['La exactitud del análisis la limita el eslabón más débil de la cadena, no el instrumento.','El error sistemático no se detecta repitiendo: hay que comparar contra un referente externo.','Multiplicación manda cifras; suma manda decimales.'],
 check:[
  {q:'Un método da 5 % por encima del valor certificado en todas las réplicas, con desviación relativa del 0.3 %. Diagnostica.',
   a:'Buena precisión, mala exactitud. Hay un error sistemático proporcional, probablemente de calibración o de un estándar mal preparado. Repetir más veces no lo arregla; hay que recalibrar o verificar con un método independiente.'},
  {q:'¿Por qué las propiedades coligativas usan molalidad y no molaridad?',
   a:'Porque la molaridad se define por volumen de disolución, que se dilata con la temperatura, mientras estas propiedades se miden justamente cambiando la temperatura. La molalidad, definida por masa de disolvente, es independiente de ella.'}
 ],
 conc:['mol','concentracion','estadistica','cifras','propagacion']},

{m:'M2',t:'Volumetría y electroquímica: medir contando reacciones',dur:30,
 obj:['Interpretar una curva de titulación y elegir el indicador','Aplicar Henderson-Hasselbalch y entender la capacidad amortiguadora','Usar Nernst y reconocer la respuesta de un electrodo selectivo'],
 sec:[
  {t:'Titular es contar moles con una reacción',p:'La volumetría determina cuánto analito hay midiendo qué volumen de un reactivo de concentración conocida se necesita para consumirlo por completo. Exige que la reacción sea rápida, completa, de estequiometría definida, y que exista una forma de detectar el final.\n\nEl reactivo se estandariza contra un patrón primario, que debe ser de alta pureza, estable, no higroscópico y preferentemente de masa molar elevada, porque eso reduce el error relativo de pesada.'},
  {t:'La distinción que siempre se pregunta',p:'El punto de EQUIVALENCIA es el momento estequiométrico teórico en que se han consumido cantidades equivalentes. El punto FINAL es el momento en que observas el cambio del indicador. La diferencia entre ambos es el error de titulación, y elegir bien el indicador consiste en hacerla mínima.\n\nPara elegirlo hay que saber a qué pH cae la equivalencia, y eso depende de qué queda en disolución. Al titular un ácido débil como el acético con NaOH, en la equivalencia todo se convirtió en acetato, que es una base conjugada y por tanto hidroliza generando OH⁻. El pH resulta MAYOR que 7, típicamente entre 8 y 9, así que sirve fenolftaleína y no anaranjado de metilo. Con ácido fuerte y base fuerte la equivalencia sí cae en 7. Con base débil y ácido fuerte, por debajo de 7.'},
  {t:'Buffers: por qué resisten',p:'Una mezcla de ácido débil y su base conjugada resiste cambios de pH porque cada componente neutraliza lo que se añada del otro tipo. La ecuación de Henderson-Hasselbalch, pH = pKa + log([A⁻]/[HA]), no es una ley independiente: es álgebra sobre la expresión de Ka.\n\nSu lectura más útil es que cuando las concentraciones del par son iguales, el término logarítmico se anula y pH = pKa. Ese es el punto de máxima capacidad amortiguadora, y por eso se elige un buffer cuyo pKa esté cerca del pH de trabajo. Una relación de 10 a 1 desplaza el pH exactamente una unidad, y más allá de eso el buffer deja de ser efectivo.'},
  {t:'Electroquímica analítica',p:'La ecuación de Nernst relaciona el potencial de una celda con las concentraciones: E = E° − (0.0592/n)·log Q a 25 °C. Ese coeficiente 0.0592 no es mágico, sale de evaluar (RT/F)·ln10 a 298 K, y por lo tanto SOLO vale a esa temperatura.\n\nUn electrodo selectivo de ion aplica esta idea con una membrana que responde preferentemente a una especie. Su desempeño se resume en tres números: la pendiente, que debe ser cercana a 59.2 mV por década para un ion monovalente y 29.6 para uno divalente; el rango lineal; y el coeficiente de selectividad frente a interferentes.\n\nDos advertencias prácticas. Primera, el electrodo mide ACTIVIDAD, no concentración, así que si la fuerza iónica varía entre muestras hay que añadir un ajustador para fijarla. Segunda, una pendiente claramente por debajo de la teórica indica membrana degradada y el electrodo debe reacondicionarse.'}
 ],
 clave:['Ácido débil con base fuerte: la equivalencia cae a pH mayor que 7 y pide fenolftaleína.','pH = pKa es el punto de máxima capacidad amortiguadora, con [HA] = [A⁻].','El 0.0592 de Nernst solo vale a 25 °C; a 37 °C el coeficiente es 0.0616.'],
 check:[
  {q:'Quieres un buffer a pH 7.4. Tienes ácidos con pKa de 4.7, 7.2 y 9.8. ¿Cuál eliges y por qué?',
   a:'El de pKa 7.2, porque está a solo 0.2 unidades del pH deseado y por tanto la relación del par conjugado será cercana a 1, donde la capacidad amortiguadora es máxima. Los otros exigirían relaciones de cientos a uno y no amortiguarían.'},
  {q:'Un electrodo selectivo de nitrato da pendiente de 44 mV/década. ¿Qué haces?',
   a:'Es sub-nernstiana, muy por debajo de los 59.2 mV/década teóricos. Indica membrana degradada, contaminada o mal acondicionada. Hay que reacondicionar según el fabricante y recalibrar, aceptando el electrodo solo si la pendiente queda entre 54 y 60.'}
 ],
 conc:['titulacion','buffer','acido-base','redox','electroquimica','ise','kps']},

{m:'M2',t:'Instrumental y estadística: medir con luz y saber cuánto confiar',dur:30,
 obj:['Aplicar Beer-Lambert y reconocer cuándo pierde linealidad','Construir una curva de calibración y calcular LOD y LOQ','Elegir entre calibración externa y adición de estándar'],
 sec:[
  {t:'De dónde sale la ley de Beer',p:'La ley de Beer-Lambert, A = ε·b·c, no es una definición arbitraria. Se deduce suponiendo que cada capa infinitesimal de disolución absorbe una fracción constante de la luz que le llega: dI/I = −ε·c·dx. Al integrar sobre el camino óptico aparece el logaritmo, y por eso la absorbancia se define como −log(I/I₀).\n\nEs la misma estructura matemática del decaimiento exponencial que vimos en la lección de herramientas, ahora en el espacio en lugar del tiempo. Reconocerlo evita memorizarla como fórmula suelta.\n\nSu rango útil está aproximadamente entre A = 0.1 y A = 1.0. Fuera de ahí pierde linealidad por interacciones soluto-soluto, luz no monocromática, luz parásita o dispersión si el analito se agrega.'},
  {t:'La curva de calibración y sus límites',p:'Se mide la señal de estándares de concentración conocida y se ajusta una recta por mínimos cuadrados, minimizando la suma de los cuadrados de las distancias verticales. La pendiente es la sensibilidad del método.\n\nDe ahí salen las dos figuras de mérito más citadas. El límite de detección se estima como tres veces la desviación estándar del blanco entre la pendiente, y el de cuantificación con el factor diez, así que el LOQ resulta unas 3.3 veces el LOD. Los factores 3 y 10 son convenciones, no constantes físicas.\n\nY aquí una advertencia importante: un R² alto significa buena linealidad, NO exactitud. Un sesgo constante desplaza toda la recta sin afectar en absoluto su linealidad. Confiar en el R² como prueba de que el método está bien es un error conceptual frecuente.'},
  {t:'Cuando la matriz estorba',p:'Si la muestra real contiene componentes que alteran la señal, la calibración externa deja de ser válida porque los estándares no ven la misma matriz que el analito.\n\nLa solución es la adición de estándar: se añaden cantidades crecientes de analito a la propia muestra, de modo que la pendiente ya incorpora el efecto de matriz. La concentración desconocida se lee como el valor absoluto de la intersección con el eje horizontal. Corrige efectos multiplicativos, pero no una señal de fondo aditiva ni la contaminación del blanco.\n\nEn espectroscopía atómica conviene tener clara la elección de técnica: la absorción atómica de llama es muy sensible pero esencialmente monoelemental, mientras el plasma acoplado inductivamente permite análisis multielemental simultáneo, con ICP-MS alcanzando niveles de partes por billón.'},
  {t:'Cerrar con estadística',p:'Una medición aislada no es un resultado. Se necesitan réplicas, su media, su desviación estándar y un intervalo de confianza construido con el valor t de Student para n−1 grados de libertad.\n\nPara decidir si un método tiene sesgo se compara su media contra un valor certificado mediante una prueba t. Para descartar un dato aberrante existe la prueba Q, pero con una regla ética: se aplica UNA sola vez a un conjunto y nunca para eliminar datos que simplemente no gustan.\n\nY conviene recordar que la propagación de incertidumbre revela cuál medición limita el resultado. Si la incertidumbre del volumen domina sobre la de la masa, comprar una balanza mejor no sirve de nada.'}
 ],
 clave:['Beer-Lambert sale de integrar una absorción fraccional constante: es un decaimiento exponencial en el espacio.','LOD = 3σ/pendiente, LOQ = 10σ/pendiente. Los factores son convenciones.','Un R² alto no descarta sesgo sistemático: la linealidad y la exactitud son cosas distintas.'],
 check:[
  {q:'¿Cuándo usarías adición de estándar en lugar de una curva de calibración externa?',
   a:'Cuando la matriz de la muestra altera la señal y no puedes reproducirla en los estándares, por ejemplo en un lisado biológico o en agua residual compleja. La adición hace que patrón y analito compartan exactamente la misma matriz.'},
  {q:'Tu curva tiene pendiente 0.0125 ppm⁻¹ y el blanco una desviación de 0.15 unidades de señal. ¿Cuál es el LOD?',
   a:'LOD = 3 × 0.15 / 0.0125 = 36 ppm. Si necesitaras bajarlo, tienes dos vías: aumentar la sensibilidad (subir la pendiente) o reducir el ruido del blanco. Ambas funcionan.'}
 ],
 conc:['beer','calibracion','regresion','estadistica','atomica','propagacion']},

/* ---------- M3 ---------- */
{m:'M3',t:'Estructura orgánica: hibridación, isomería y quiralidad',dur:30,
 obj:['Deducir geometría y propiedades a partir de la hibridación','Clasificar los tipos de isomería sin confundirlos','Explicar por qué la quiralidad tiene consecuencias biológicas'],
 sec:[
  {t:'Todo empieza contando regiones de densidad electrónica',p:'Ante cualquier molécula orgánica, el primer movimiento es identificar la hibridación de los carbonos, y para eso basta contar regiones de densidad electrónica alrededor de cada uno. Cuatro regiones dan sp³, geometría tetraédrica y ángulos de 109.5°. Tres dan sp², trigonal plana y 120°. Dos dan sp, lineal y 180°.\n\nDe la hibridación se sigue casi todo lo demás. El carbono de un grupo carbonilo es sp², así que la molécula es plana en esa zona y accesible al ataque nucleofílico por ambas caras. Mayor carácter s en el híbrido significa enlace más corto, más fuerte y más ácido el hidrógeno unido, y por eso un alquino terminal es mucho más ácido que un alcano.'},
  {t:'Grupos funcionales y propiedades físicas',p:'La nomenclatura no es un trámite: el nombre codifica la estructura y la estructura predice el comportamiento. Lo que conviene tener automático es el orden de puntos de ebullición por grupo funcional a masa molar comparable: ácido carboxílico por encima de alcohol, luego amina, éster, éter y alcano.\n\nEse orden no se memoriza, se deduce de la lección de fuerzas intermoleculares. El ácido carboxílico forma dímeros con dos puentes de hidrógeno. El alcohol forma uno. La amina forma puentes más débiles porque el nitrógeno es menos electronegativo. El éster y el éter aceptan pero no donan. El alcano solo tiene dispersión. Es el mismo razonamiento aplicado a otra familia.'},
  {t:'Los tres niveles de isomería',p:'Aquí se confunde mucha gente, así que conviene ordenarlo jerárquicamente. Los isómeros CONSTITUCIONALES difieren en qué está unido a qué: distinta conectividad. Los ESTEREOISÓMEROS tienen la misma conectividad y difieren en la disposición espacial, y se dividen en dos: los geométricos, cis y trans o E y Z, que surgen de la restricción de giro en un doble enlace o un anillo, y los ópticos, que surgen de la quiralidad.\n\nDentro de los ópticos, los ENANTIÓMEROS son imágenes especulares no superponibles y los DIASTEREÓMEROS son estereoisómeros que no son imágenes especulares. La distinción tiene consecuencia práctica: los enantiómeros tienen propiedades físicas idénticas salvo el sentido en que rotan la luz polarizada, así que no se separan por destilación ni cristalización ordinaria. Los diastereómeros sí tienen propiedades distintas y sí se separan.'},
  {t:'Por qué la quiralidad importa biológicamente',p:'Un centro quiral es un carbono con cuatro sustituyentes distintos, y su configuración se asigna R o S por prioridades de Cahn-Ingold-Prelog. Una molécula con n centros quirales tiene hasta 2ⁿ estereoisómeros, salvo cuando aparece simetría interna y surgen compuestos meso, que tienen centros quirales pero son aquirales globalmente.\n\nLa razón de que esto importe tanto en farmacia es que los receptores y las enzimas son proteínas construidas con aminoácidos L: son intrínsecamente quirales. El reconocimiento molecular exige complementariedad tridimensional en al menos tres puntos, así que un enantiómero encaja y el otro no. El que no encaja puede ser simplemente inactivo, o puede unirse a otro blanco y producir efectos adversos. De ahí toda la industria de la síntesis asimétrica.'}
 ],
 clave:['Contar regiones de densidad electrónica da hibridación, geometría y ángulos de una vez.','Enantiómeros: propiedades físicas idénticas salvo rotación óptica. Diastereómeros: propiedades distintas.','Los receptores son quirales, por eso dos enantiómeros de un fármaco pueden comportarse de forma radicalmente distinta.'],
 check:[
  {q:'¿Por qué un alquino terminal es más ácido que un alcano, si ambos tienen enlaces C–H?',
   a:'Porque el carbono sp del alquino tiene 50 % de carácter s, frente al 25 % del sp³. Mayor carácter s acerca el par electrónico al núcleo y estabiliza mejor la carga negativa del anión resultante, lo que hace más fácil ceder el protón.'},
  {q:'Una molécula tiene dos centros quirales. ¿Cuántos estereoisómeros esperas y qué excepción existe?',
   a:'Hasta 2² = 4. La excepción es que si la molécula tiene un plano de simetría interno, dos de esos supuestos estereoisómeros resultan ser la misma especie aquiral: un compuesto meso. En ese caso solo hay tres especies distintas.'}
 ],
 conc:['hibridacion','isomeria','estereoquimica','imf']},

{m:'M3',t:'Reactividad: cuatro mecanismos que explican casi todo',dur:30,
 obj:['Distinguir SN1 de SN2 y predecir estereoquímica','Aplicar Markovnikov y su excepción radicalaria','Predecir la orientación en sustitución electrofílica aromática'],
 sec:[
  {t:'Pensar en mecanismos, no en listas',p:'Se puede intentar memorizar decenas de reacciones, o se puede aprender cuatro patrones y deducir el resto. Los patrones son adición, sustitución, eliminación y redox, y todos se describen con el mismo lenguaje: dónde hay densidad electrónica y hacia dónde se mueve.\n\nUn nucleófilo es rico en electrones y busca núcleos; un electrófilo es pobre y busca electrones. Una vez que identificas quién es quién en una molécula, el mecanismo casi se escribe solo.'},
  {t:'El par que más se pregunta: SN1 contra SN2',p:'La sustitución nucleofílica bimolecular, SN2, ocurre en un solo paso concertado: el nucleófilo ataca por el lado opuesto al grupo saliente mientras este se va. Como ese ataque requiere acceso físico al carbono, los sustituyentes voluminosos lo bloquean, y por eso funciona mejor en sustratos primarios. Y como el ataque es por detrás, produce INVERSIÓN de configuración.\n\nLa SN1 va por etapas: primero se ioniza el sustrato formando un carbocatión, y ese paso lento es el determinante. Un carbono terciario da un carbocatión más estable por efecto inductivo e hiperconjugación, así que SN1 se favorece justamente donde SN2 falla. Y como el carbocatión es plano, el nucleófilo entra por ambas caras y el resultado es RACEMIZACIÓN.\n\nLos distractores del examen invierten sistemáticamente la relación con el impedimento estérico. Vale la pena poder derivarla en lugar de recordarla: si el mecanismo requiere que algo se acerque, el volumen estorba; si requiere que algo se vaya y quede un catión, el volumen ayuda porque lo estabiliza.'},
  {t:'Adición a alquenos y la excepción de los peróxidos',p:'En la adición electrofílica, el doble enlace ataca al electrófilo formando el carbocatión más estable posible, y de ahí sale la regla de Markovnikov: el hidrógeno se añade al carbono que ya tiene más hidrógenos, porque así el carbocatión queda en el carbono más sustituido.\n\nLa excepción célebre aparece con HBr en presencia de peróxidos. Los peróxidos inician un mecanismo RADICALARIO, y como ahora el intermediario es un radical y no un catión, la regioselectividad se invierte: producto anti-Markovnikov. No es que la regla falle, es que cambió el mecanismo.'},
  {t:'Aromáticos: activantes y desactivantes',p:'El benceno es estable por deslocalización, así que no da adición sino SUSTITUCIÓN electrofílica: repone la aromaticidad.\n\nLo que se pregunta es la orientación. Un sustituyente que dona densidad electrónica al anillo lo activa, lo hace reaccionar más rápido, y dirige a las posiciones orto y para. Un sustituyente que retira densidad lo desactiva y dirige a meta. La excepción que conviene recordar son los halógenos, que desactivan por inducción pero dirigen orto y para por resonancia.\n\nLa lógica es siempre la misma: se dibujan las estructuras resonantes del intermediario para cada posición de ataque y se ve cuál queda mejor estabilizada por el sustituyente.'}
 ],
 clave:['SN2 se frena con impedimento estérico y da inversión; SN1 se favorece con carbocatión estable y da racemización.','HBr con peróxidos cambia a mecanismo radicalario y por eso invierte la regioselectividad.','Activantes dirigen orto y para; desactivantes dirigen meta, con los halógenos como excepción.'],
 check:[

{m:'M3',t:'Macromoléculas: polímeros, proteínas y ácidos nucleicos',dur:30,
 obj:['Distinguir polimerización por adición y por condensación','Interpretar Mn, Mw, dispersidad, Tg y Tm','Conectar estructura de biomoléculas con función y con diagnóstico'],
 sec:[
  {t:'Dos formas de crecer',p:'En la polimerización por ADICIÓN, un iniciador genera un centro activo que va incorporando monómeros insaturados uno tras otro. Desde el principio hay cadenas largas y monómero sin reaccionar coexistiendo.\n\nEn la polimerización por CONDENSACIÓN, grupos funcionales reaccionan entre sí liberando una molécula pequeña como agua o HCl. El crecimiento es paso a paso: primero dímeros, luego trímeros, y las cadenas largas solo aparecen al final. Por eso la ecuación de Carothers, X_n = 1/(1−p), exige conversiones extremas: para un grado de polimerización de 100 se necesita 99 % de conversión, y para 1000, 99.9 %. Un pequeño desbalance estequiométrico limita drásticamente el peso molecular.\n\nPoliésteres y poliamidas son de condensación, y esa es justamente la razón de que sean hidrolizables y por tanto biodegradables.'},
  {t:'Un polímero no tiene un peso molecular',p:'Tiene una distribución. Mn pondera por número de cadenas y Mw por masa, así que Mw siempre es mayor o igual que Mn, y su cociente es la dispersidad. Un valor de 1 sería monodisperso, alcanzable solo en polimerización viviente; entre 1.5 y 2 es típico de policondensación.\n\nLas propiedades térmicas son dos y no deben confundirse. La Tg es la transición vítrea, donde la fracción amorfa pasa de rígida a gomosa; es una transición de segundo orden y solo se detecta por DSC, nunca por TGA porque no implica cambio de masa. La Tm es la fusión de la fracción cristalina. Un polímero completamente amorfo tiene Tg pero no Tm.\n\nLa relación de Fox-Flory, Tg = Tg∞ − K/Mn, dice que las cadenas cortas bajan la Tg porque sus extremos aportan volumen libre. Es otra conexión entre estructura molecular y propiedad medible.'},
  {t:'Biopolímeros y degradación',p:'Para una sutura reabsorbible se elige un enlace hidrolizable en la cadena principal, típicamente éster: PLA, PGA o PCL. El tiempo de degradación se controla con la cristalinidad, porque el agua penetra primero las zonas amorfas, y con la hidrofilicidad del monómero. PGA degrada rápido, PLA intermedio, PCL muy lento, y copolimerizar como PLGA permite sintonizar el tiempo variando la proporción.\n\nEste es también el punto donde el módulo conecta con formulaciones: los mismos poliésteres son la matriz de muchos sistemas de liberación controlada.'},
  {t:'De la estructura biológica al diagnóstico',p:'Las proteínas tienen cuatro niveles de estructura y su función depende del plegamiento, que a su vez se sostiene con las fuerzas intermoleculares de la primera lección. Las enzimas son catalizadores descritos por Michaelis-Menten, con Km como la concentración de semisaturación. Conviene tener automático el efecto de los inhibidores: el competitivo sube Km y deja Vmax igual, porque se supera con más sustrato; el no competitivo baja Vmax y deja Km igual.\n\nEn ácidos nucleicos, el dogma central va de DNA a RNA a proteína. Su aplicación práctica es la PCR, que amplifica exponencialmente una región definida por cebadores mediante ciclos de desnaturalización, alineamiento y extensión. Eso convierte una cantidad indetectable de material genético en señal medible, y es la base del diagnóstico molecular del cáncer que trabajaste en tu situación problema. La cuantificación por absorbancia a 260 nm, con la relación A260/A280 cercana a 1.8 como criterio de pureza, es la aplicación directa de Beer-Lambert al DNA.'}
 ],
 clave:['Condensación exige conversiones cercanas al 100 % para dar cadenas largas (Carothers).','La Tg solo se ve en DSC porque no implica cambio de masa; TGA es ciega a ella.','Inhibidor competitivo: Km sube, Vmax igual. No competitivo: Vmax baja, Km igual.'],
 check:[
  {q:'¿Por qué un poliéster es biodegradable y un polietileno no?',
   a:'Porque el poliéster tiene enlaces éster hidrolizables en la cadena principal, que el agua y las esterasas pueden romper en condiciones fisiológicas. El polietileno solo tiene enlaces C–C, que no se hidrolizan.'},
  {q:'Mides A260/A280 = 1.55 en una extracción de DNA. ¿Qué significa?',
   a:'Está por debajo del 1.8 esperado para DNA puro, lo que indica contaminación por proteína o por fenol residual de la extracción, ya que ambos absorben a 280 nm. Conviene repurificar antes de usar la muestra en PCR.'}
 ],
 conc:['polimeros','biomoleculas','enzimas','dogma','pcr']},

{m:'M6',t:'Por qué la nanoescala es distinta',dur:30,
 obj:['Cuantificar el efecto de la relación superficie/volumen','Explicar el confinamiento cuántico y su dependencia con el tamaño','Reconocer el origen del plasmón y del superparamagnetismo'],
 sec:[
  {t:'Dos ideas y todo lo demás se sigue',p:'Este módulo entero descansa sobre dos fenómenos. El primero es geométrico y el segundo cuántico. Si los entiendes bien, el resto del módulo son consecuencias.\n\nEl primero es la relación superficie/volumen. Para una esfera, S/V = 3/r = 6/d. Al reducir el tamaño esa relación crece sin límite, así que una fracción cada vez mayor de los átomos está en la superficie. Y como la superficie es donde ocurre la química, la reactividad, la catálisis y la toxicidad se disparan. También cae el punto de fusión, por el efecto Gibbs-Thomson que vimos en superficies.\n\nUn número para fijarlo: nanopartículas de oro de 20 nm tienen unos 15.5 m²/g de área específica. Un gramo de oro macizo en forma de cubo tiene menos de 0.01 m². Son más de mil veces de diferencia con la misma masa.'},
  {t:'Confinamiento cuántico',p:'El segundo fenómeno aparece cuando el tamaño del cristal se vuelve comparable al radio de Bohr del excitón. Entonces el par electrón-hueco queda confinado y sus niveles se discretizan, exactamente como en el modelo de partícula en una caja de la lección de mecánica cuántica.\n\nLa consecuencia es que el band gap efectivo AUMENTA al reducir el tamaño, según la ecuación de Brus, donde el término dominante escala como 1/R². Un band gap mayor significa emisión de mayor energía, es decir desplazada al AZUL.\n\nEsta relación es la que más invierten los distractores del examen, así que conviene poder razonarla: caja más pequeña, niveles más separados, salto mayor, fotón más energético, color más azul. Lo notable es que permite sintonizar el color de emisión de un mismo material solo cambiando el tamaño, sin tocar la composición.'},
  {t:'Plasmón: por qué el oro coloidal es rojo',p:'En un metal, los electrones libres pueden oscilar colectivamente. Cuando esa oscilación entra en resonancia con la luz incidente, hablamos de resonancia de plasmón superficial localizado. En nanopartículas esféricas de oro de 10 a 20 nm en agua, la resonancia cae cerca de 520 nm, y por eso la suspensión se ve roja rubí.\n\nLo útil es que la posición de esa banda depende del tamaño, de la forma y del índice de refracción del medio inmediato. Eso convierte un espectrofotómetro UV-Vis común en un sensor: si las partículas se agregan, los plasmones se acoplan, aparece una banda a mayor longitud de onda y el color vira de rojo a azul. Es el diagnóstico más rápido y barato de que una síntesis se echó a perder.\n\nEn nanovarillas aparecen dos bandas, una transversal cerca de 520 nm y una longitudinal desplazada al infrarrojo según la relación de aspecto. Ver dos bandas es la evidencia espectroscópica de anisotropía.'},
  {t:'Superparamagnetismo',p:'El tercer efecto de tamaño relevante es magnético. Por debajo del tamaño crítico de monodominio, del orden de 20 a 25 nm en magnetita, cada partícula tiene un solo dominio y la agitación térmica invierte espontáneamente su momento magnético.\n\nEl resultado práctico es exactamente el que se necesita para separación magnética: la partícula se magnetiza fuertemente en presencia de un imán, lo que permite capturarla, pero al retirar el campo su magnetización remanente es cero y no se atraen entre sí, así que se redispersa. Una partícula multidominio de 100 nm quedaría magnetizada y las partículas se pegarían formando cadenas irreversibles.'}
 ],
 clave:['S/V = 6/d: por eso la reactividad y el área específica se disparan al reducir el tamaño.','Menor tamaño ⇒ mayor band gap ⇒ emisión más azul. Los distractores siempre invierten esto.','El plasmón desplazándose al rojo y el color virando a azul son la firma de agregación.'],
 check:[
  {q:'Una suspensión de oro coloidal cambia de rojo a azul violáceo tras unos días. ¿Qué pasó y cómo lo confirmarías?',
   a:'Se agregaron. Al acercarse, los plasmones se acoplan y aparece una banda longitudinal a mayor longitud de onda. Se confirma con UV-Vis viendo el hombro hacia 600–650 nm, con DLS mostrando aumento de tamaño y PDI, y midiendo potencial zeta para verificar que la repulsión electrostática cayó.'},
  {q:'¿Por qué usar partículas magnéticas de 100 nm en lugar de 12 nm sería un error para separación y redispersión?',
   a:'Porque a 100 nm son multidominio y ferrimagnéticas, con remanencia. Al retirar el imán quedan magnetizadas y se atraen entre sí formando aglomerados irreversibles. A 12 nm son superparamagnéticas: sin campo, remanencia cero y redispersión limpia.'}
 ],
 conc:['sv','confinamiento','plasmon','superpara','gibbs-thomson']},

{m:'M6',t:'Nacer y crecer: nucleación, LaMer y Ostwald',dur:30,
 obj:['Explicar el origen de la barrera de nucleación y el radio crítico','Describir el modelo de LaMer y por qué da monodispersidad','Distinguir maduración de Ostwald de agregación'],
 sec:[
  {t:'Por qué hay una barrera',p:'Formar una fase nueva dentro de otra tiene dos contribuciones energéticas opuestas. El volumen del núcleo libera energía, porque la fase nueva es más estable, y ese término va como r³ con signo negativo. Pero crear la interfaz cuesta, y ese término va como r² con signo positivo.\n\nAl sumarlos, la curva de energía contra radio tiene un MÁXIMO. Ese máximo es la barrera de nucleación, ΔG* = 16πγ³/(3ΔG_v²), y el radio donde ocurre es el radio crítico. Por debajo de r*, un núcleo que se forme por fluctuación tenderá a disolverse porque crecer le cuesta energía. Por encima, crecer le libera energía y lo hará espontáneamente.\n\nAumentar la supersaturación hace ΔG_v más negativo, lo que reduce tanto el radio crítico como la barrera. Esa es la perilla experimental principal.'},
  {t:'El modelo de LaMer',p:'LaMer y Dinegar propusieron en 1950 un esquema de tres etapas que sigue siendo la referencia. Primero la concentración de monómero sube por encima de la solubilidad hasta alcanzar una supersaturación crítica. Segundo, ocurre una nucleación explosiva: se forman muchísimos núcleos casi simultáneamente y la supersaturación cae de golpe por debajo del umbral. Tercero, ya no nuclean partículas nuevas y el monómero restante solo alimenta el crecimiento de las existentes.\n\nLa consecuencia es la clave del módulo: como todos los núcleos nacieron al mismo tiempo y crecen en el mismo medio, terminan con tamaños muy parecidos. Distribución estrecha. Si en cambio la nucleación fuera lenta y continua, coexistirían partículas de todas las edades y la distribución sería ancha.\n\nSu implementación experimental es la inyección rápida de precursor en caliente y con agitación vigorosa. Y por eso, cuando escalas de 50 mL a 5 L y el tiempo de mezclado crece, la nucleación deja de ser homogénea y aparece la distribución bimodal.'},
  {t:'Ostwald: el envejecimiento inevitable',p:'Con el tiempo aparece un proceso que revierte parte de lo ganado. Por la ecuación de Ostwald-Freundlich, una partícula pequeña es más soluble que una grande. Eso establece un gradiente: las pequeñas se disuelven, el material difunde por el medio y se deposita sobre las grandes.\n\nEs importante no confundirlo con agregación. En Ostwald las partículas NUNCA se tocan; el transporte es molecular a través de la fase continua. En agregación, las partículas colisionan y se pegan. Los remedios también son distintos: contra agregación se aumenta la repulsión o se añade barrera estérica; contra Ostwald se reduce la solubilidad del material en el medio o se añade un agente atrapador osmótico.\n\nLa teoría LSW predice que el radio promedio al cubo crece linealmente con el tiempo, así que el engrosamiento se desacelera pero no se detiene.'},
  {t:'Controlar la forma',p:'Si el sistema alcanzara el equilibrio, toda partícula sería esférica, porque la esfera minimiza el área para un volumen dado. Que existan nanovarillas, nanocubos y nanoestrellas significa que estamos operando bajo control CINÉTICO, no termodinámico.\n\nEl mecanismo es el bloqueo selectivo de facetas: un surfactante o ligando se adsorbe preferentemente sobre ciertas caras cristalinas, frenando su crecimiento y dejando que otras avancen. El CTAB en la síntesis de nanovarillas de oro es el caso clásico, normalmente combinado con crecimiento por semillas, donde una etapa genera los núcleos y otra los alimenta con un reductor deliberadamente débil para que no nuclee población nueva.'}
 ],
 clave:['La barrera de nucleación existe porque el volumen libera energía como r³ y la superficie la consume como r².','LaMer: separar temporalmente una nucleación explosiva del crecimiento produce monodispersidad.','Ostwald transporta material disuelto sin que las partículas se toquen; la agregación es por contacto.'],
 check:[
  {q:'¿Por qué aumentar la concentración inicial de precursor para obtener partículas más grandes suele ser mala idea?',
   a:'Porque eleva la supersaturación, lo que reduce el radio crítico y dispara nucleación secundaria. Se obtiene una segunda población de partículas jóvenes y pequeñas, es decir una distribución bimodal. Para crecer sin nuclear conviene alimentar precursor lentamente o usar crecimiento por semillas.'},
  {q:'Si una suspensión tiene potencial zeta de −40 mV pero su tamaño promedio crece lentamente durante semanas, ¿qué está pasando?',
   a:'No es agregación, porque con −40 mV la barrera electrostática es alta. Es maduración de Ostwald: el material migra disuelto de las partículas pequeñas a las grandes, y el potencial zeta no lo impide porque nunca hay contacto.'}
 ],
 conc:['nucleacion','ostwald','termo-cinetico','control-forma','coloide','dlvo']},

{m:'M6',t:'Rutas químicas: del precursor a la nanoestructura',dur:30,
 obj:['Comparar las principales rutas bottom-up y elegir con criterio','Explicar la función del estabilizante y de la coraza','Reconocer cuándo conviene cada arquitectura nanométrica'],
 sec:[
  {t:'El mapa de rutas',p:'Todas las rutas químicas comparten la misma lógica: generar monómero en disolución, nuclear y crecer. Lo que cambia es cómo se genera el monómero y en qué condiciones.\n\nLa reducción química parte de una sal metálica y un reductor; el método de Turkevich con citrato para oro es el arquetipo, y tiene la elegancia de que el citrato actúa a la vez como reductor y como estabilizante. El sol-gel hidroliza y condensa alcóxidos formando primero un sol y luego una red; es la vía suave y barata para óxidos como SiO₂ y TiO₂. La coprecipitación mezcla sales y base, es la más simple y escalable, pero suele requerir calcinación posterior. La síntesis hidrotermal trabaja en autoclave por encima del punto de ebullición normal y logra cristalinidad alta en un solo paso, sin calcinar.\n\nEsa última diferencia es decisiva y se pregunta: calcinar a 450 °C sinteriza las partículas y destruye el área superficial que tanto costó conseguir. Si la aplicación depende del área, como en fotocatálisis, la ruta hidrotermal compensa su sobrecosto.'},
  {t:'El estabilizante no es un detalle',p:'Una nanopartícula desnuda es termodinámicamente inestable: quiere reducir su área. Lo que la mantiene dispersa es el estabilizante, y hay dos mecanismos.\n\nLa estabilización electrostática confiere carga superficial, cuya eficacia se mide con el potencial zeta y se explica con DLVO. Su punto débil es que la sal apantalla: al aumentar la fuerza iónica la longitud de Debye se acorta y la barrera desaparece. Por eso una suspensión perfecta en agua destilada puede coagular al instante en un buffer fisiológico.\n\nLa estabilización estérica usa polímeros adsorbidos o injertados, como PVP o PEG, que imponen una barrera física. Al no depender de la doble capa, tolera alta fuerza iónica y medios no acuosos. Esa es la razón de que las nanopartículas destinadas a aplicaciones biológicas casi siempre estén PEGiladas.'},
  {t:'Arquitecturas: cuándo y por qué',p:'Los puntos cuánticos aprovechan el confinamiento para sintonizar emisión con el tamaño, pero desnudos tienen rendimiento cuántico bajo porque los excitones se recombinan en trampas superficiales. La solución es la estructura CORE-SHELL: crecer una coraza de band gap mayor, como ZnS sobre CdSe, que confina el excitón lejos de la superficie. El rendimiento puede pasar de cerca del 10 % a más del 50 %, y además se gana fotoestabilidad y se reduce la liberación de cadmio.\n\nLos dendrímeros son macromoléculas ramificadas construidas por generaciones, con cavidades internas y superficie multivalente: vehículos naturales para transportar fármacos. Los materiales mesoporosos como MCM-41 y SBA-15 se obtienen con plantillas de surfactante y ofrecen cientos de metros cuadrados por gramo con poros ordenados de 2 a 50 nm, útiles para catálisis y liberación controlada.\n\nY el método de Stöber merece mención aparte: produce esferas de sílice monodispersas por hidrólisis de TEOS, y es la base para recubrir cualquier núcleo con una coraza de sílice que aporta protección, estabilidad coloidal y una química de superficie bien conocida para funcionalizar.'},
  {t:'Cómo se verifica que funcionó',p:'Ninguna síntesis está completa sin caracterización, y conviene tener el paquete mínimo memorizado. UV-Vis para plasmón o borde de absorción. TEM para tamaño de núcleo y forma, con histograma sobre al menos 200 partículas. DLS para diámetro hidrodinámico y polidispersidad. Potencial zeta para estabilidad. DRX para fase cristalina y, vía Scherrer, tamaño de cristalito. TGA para cuantificar el recubrimiento orgánico.\n\nY una advertencia recurrente: TEM, DLS y Scherrer miden cosas distintas y no tienen por qué coincidir. TEM da el núcleo, DLS el diámetro hidrodinámico incluyendo ligandos y solvatación, y Scherrer el dominio cristalino coherente. Reportar uno solo sin decir cuál es un error metodológico.'}
 ],
 clave:['La ruta hidrotermal da cristalinidad sin calcinar, y calcinar sinteriza y destruye área superficial.','La estabilización electrostática falla a alta fuerza iónica; la estérica no.','Core-shell pasiva trampas superficiales y sube el rendimiento cuántico de un punto cuántico.'],
 check:[
  {q:'Tu suspensión de nanopartículas es estable en agua pero precipita al añadirla a medio de cultivo celular. Diagnostica y propón solución.',
   a:'El medio tiene alta fuerza iónica, que comprime la doble capa y apantalla la repulsión electrostática. La barrera DLVO desaparece y las partículas coagulan. La solución es cambiar a estabilización estérica, típicamente PEGilando la superficie, que no depende de la doble capa.'},
  {q:'¿Por qué el ZnS y no otro material como coraza de un punto cuántico de CdSe?',
   a:'Porque su band gap es mucho mayor (3.6 eV frente a 1.74 eV) y su alineación es tipo I, lo que encierra tanto al electrón como al hueco dentro del núcleo. Además su parámetro de red es suficientemente parecido para crecer epitaxialmente sin generar demasiados defectos en la interfaz.'}
 ],
 conc:['reduccion','sol-gel','hidrotermal','core-shell','qdot','mesoporoso','dendrimero','stober']},

{m:'M6',t:'Rutas físicas: litografía, depósito y grabado',dur:30,
 obj:['Distinguir top-down de bottom-up y elegir según resolución y volumen','Comparar litografía óptica, de haz de electrones, suave y LIGA','Explicar cuándo ALD es insustituible frente a sputtering'],
 sec:[
  {t:'Dos filosofías de fabricación',p:'Bottom-up construye desde precursores atómicos o moleculares; top-down esculpe desde material masivo. Litografía, molienda y grabado son top-down. Sol-gel, reducción química, CVD y ALD son bottom-up.\n\nLa decisión práctica casi nunca es filosófica sino económica. Bottom-up produce grandes cantidades a bajo costo pero con control limitado de posición: obtienes muchas nanopartículas, no una estructura ubicada donde quieres. Top-down da control posicional exacto, que es indispensable para un dispositivo, pero cuesta más por unidad de área.'},
  {t:'La familia litográfica',p:'La fotolitografía transfiere un patrón a un resiste mediante luz a través de una máscara. Su límite de resolución sigue el criterio de Rayleigh, R = k₁λ/NA, así que mejorar exige bajar la longitud de onda o subir la apertura numérica. De ahí la migración de 365 nm a 193 nm y finalmente a EUV de 13.5 nm, y el uso de inmersión en agua para subir NA. El precio de subir NA es perder profundidad de foco, que cae como NA²: ese es el compromiso central.\n\nPara superar el límite óptico se cambia de sonda. La litografía de rayos X usa longitudes de onda de unos ángstroms y logra relaciones de aspecto altísimas. La de haz de electrones alcanza por debajo de 10 nm, pero escribe en SERIE, punto por punto, con tiempos de horas por oblea.\n\nDe ahí la estrategia estándar de la industria: escribe UNA vez el maestro con la técnica de mayor resolución que necesites y después replica en paralelo con la más barata compatible. Nunca uses una técnica serie para producción.'},
  {t:'Replicar: litografía suave, micromoldeado y LIGA',p:'La litografía suave usa un molde elastomérico, normalmente PDMS, para replicar un patrón por contacto o por moldeo. Es la vía accesible para chips microfluídicos: el molde maestro se fabrica una vez por fotolitografía con resiste grueso, y de él salen decenas de réplicas.\n\nEl PDMS tiene ventajas reales, como su permeabilidad a gases que permite cultivar células dentro del chip, pero también limitaciones que hay que declarar: absorbe moléculas hidrofóbicas pequeñas, lo que puede falsear una curva dosis-respuesta, y es hidrofóbico por naturaleza, así que requiere activación con plasma.\n\nEl proceso LIGA combina litografía de rayos X, electroformado y moldeado para producir microestructuras metálicas de relación de aspecto muy alta. Su limitación práctica es que la variante de rayos X requiere sincrotrón. Y la escritura láser directa por absorción de dos fotones permite estructuras tridimensionales verdaderas: como la absorción depende del CUADRADO de la intensidad, solo la región central del foco polimeriza, dando resolución sub-longitud de onda.'},
  {t:'Depositar y grabar',p:'El depósito físico en fase vapor, evaporación o sputtering, arranca material de un blanco y lo condensa sobre el sustrato. Es un proceso de LÍNEA DE VISTA: las partículas viajan esencialmente rectas. Por eso funciona bien sobre superficies planas y falla sobre estructuras porosas o de alta relación de aspecto, donde tapa la boca del poro sin recubrir el interior.\n\nEl depósito por capas atómicas, ALD, resuelve exactamente ese problema. Se basa en reacciones superficiales AUTOLIMITADAS: cada semirreacción satura la superficie y se detiene sola, independientemente del tiempo de exposición. El espesor se controla contando ciclos, con crecimientos típicos de 0.1 nm por ciclo, y el recubrimiento es conformal incluso dentro de poros nanométricos. La contrapartida es que es lento y caro por ciclo.\n\nEn grabado, la distinción es entre húmedo, que es químico e isotrópico y por tanto socava bajo la máscara, y seco por plasma reactivo, que es direccional y da paredes verticales. La secuencia completa de microfabricación —depositar, litografiar, grabar, hacer lift-off— se repite capa por capa para construir un dispositivo.'}
 ],
 clave:['Escribe el maestro con la técnica de mayor resolución y replica con la más barata: nunca produzcas en serie.','Sputtering es línea de vista y tapa poros; ALD es autolimitado y conformal.','Grabado húmedo es isotrópico y socava; el seco por plasma da paredes verticales.'],
 check:[
  {q:'Necesitas recubrir con 2 nm de Al₂O₃ el interior de poros de 8 nm. ¿Cuántos ciclos de ALD con GPC de 0.11 nm y qué diámetro queda?',
   a:'N = 2.0/0.11 ≈ 18 ciclos. El poro se reduce en DOS veces el espesor, porque la capa crece desde toda la circunferencia: 8.0 − 2(2.0) = 4.0 nm. Ese factor de dos es donde más se falla.'},
  {q:'¿Por qué usar haz de electrones para fabricar 50 000 chips con estructuras de 50 µm sería un error?',
   a:'Por dos razones. La resolución es tres órdenes de magnitud mayor de la necesaria, y sobre todo escribe en serie, con horas por oblea, lo que hace inviable el volumen. Para 50 µm basta fotolitografía con máscara de transparencia, y para volumen conviene replicar por moldeo.'}
 ],
