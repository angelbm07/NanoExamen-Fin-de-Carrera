var DIF=['','Básica','Intermedia','Avanzada'];
var ABIERTAS=[
/* --- M2 --- */
{b:'M2',n:1,q:'Explica con tus palabras qué información distinta te dan la exactitud y la precisión. Da un ejemplo de un método con buena precisión y mala exactitud, y uno con lo contrario.',
 pistas:['Piensa en un blanco de tiro: ¿dónde caen los dardos y qué tan juntos están?','¿Qué tipo de error afecta a cada una?'],
 clave:['Exactitud = cercanía al valor verdadero; la degrada el error sistemático (sesgo).','Precisión = reproducibilidad entre réplicas; la degrada el error aleatorio.','Precisa pero inexacta: balanza descalibrada que siempre suma 0.5 g. Los valores coinciden entre sí pero todos están corridos.','Exacta pero imprecisa: promedio correcto con enorme dispersión, típico de una técnica mal dominada.','La exactitud se corrige calibrando; la precisión se mejora con técnica y con más réplicas.'],
 nota:'Si solo defines los dos términos sin ligarlos al tipo de error, te falta la mitad.'},
{b:'M2',n:2,q:'Explica por qué el punto de equivalencia en la titulación de ácido acético con NaOH no está en pH 7, y cómo eliges el indicador adecuado.',
 pistas:['¿Qué especie queda en disolución justo en el punto de equivalencia?','¿Esa especie es neutra?'],
 clave:['En el punto de equivalencia todo el ácido se convirtió en acetato.','El acetato es la base conjugada de un ácido débil, así que hidroliza y genera OH⁻.','Por lo tanto el pH resulta mayor que 7 (típicamente 8–9).','El indicador debe virar en el intervalo del salto de pH: fenolftaleína (8.2–10) sirve, anaranjado de metilo (3.1–4.4) no.','Un indicador mal elegido introduce error de titulación: la diferencia entre punto final observado y punto de equivalencia real.'],
 nota:'La regla general: ácido débil + base fuerte ⇒ equivalencia básica; ácido fuerte + base débil ⇒ equivalencia ácida.'},
{b:'M2',n:1,q:'Un compañero reporta una concentración de 34.5729 ppm a partir de una absorbancia de 0.435 y una curva de calibración con pendiente 0.0125 y ordenada 0.002. ¿Qué está mal en su reporte y cómo lo corregirías?',
 pistas:['Verifica el cálculo primero.','Después piensa en cuántos dígitos puede sostener el dato de entrada.'],
 clave:['El cálculo es correcto: (0.435 − 0.002)/0.0125 = 34.64 ppm.','El problema es de cifras significativas: la absorbancia tiene 3 cifras, así que el resultado no puede tener 6.','Debe reportarse como 34.6 ppm.','Reportar dígitos que el instrumento no puede sostener sobreestima la calidad del dato.','Idealmente se acompaña de una incertidumbre estimada a partir de la regresión.'],
 nota:'Este tipo de reactivo mide criterio, no aritmética.'},
{b:'M2',n:2,q:'Diseña un experimento para determinar si un método analítico nuevo tiene error sistemático. Explica qué medirías y cómo interpretarías el resultado.',
 pistas:['¿Contra qué comparas si no conoces el valor verdadero?','Piensa en materiales de referencia y en recuperación.'],
 clave:['Analizar un material de referencia certificado con valor conocido y comparar la media obtenida contra el valor certificado.','Aplicar una prueba t de una muestra: si la diferencia es significativa, hay sesgo.','Complementar con ensayos de recuperación: adicionar una cantidad conocida de analito y verificar que se recupere cerca del 100 %.','Comparar contra un método de referencia independiente sobre las mismas muestras.','Distinguir sesgo constante (afecta igual a todas las concentraciones) de sesgo proporcional (crece con la concentración): se detecta por la ordenada y la pendiente de la recta de comparación.'],
 nota:'La clave es que el error sistemático NO se detecta repitiendo la misma medición: solo se ve comparando contra algo externo.'},
{b:'M2',n:3,q:'Te entregan una muestra de agua residual y te piden cuantificar plomo a nivel de partes por billón. Describe la ruta analítica completa: técnica, preparación de muestra, calibración y control de calidad.',
 pistas:['¿Qué técnicas alcanzan ppb para metales?','¿Qué haces con la materia orgánica de la matriz?'],
 clave:['Técnica: ICP-MS por su límite de detección en ppb o menor; AAS con horno de grafito es alternativa.','Preparación: digestión ácida (típicamente HNO₃) para destruir materia orgánica y liberar el metal, con filtración previa.','Calibración: curva con estándares en matriz similar; si hay efecto de matriz, usar adición de estándar.','Estándar interno para corregir deriva instrumental.','Control de calidad: blancos de reactivo, duplicados, material de referencia certificado y ensayos de recuperación.','Reportar LOD y LOQ calculados a partir de la desviación del blanco y la pendiente.'],
 nota:'Los reactivos de este tipo evalúan si sabes que un análisis es una cadena completa, no solo apretar un botón.'},

/* --- M3 --- */
{b:'M3',n:2,q:'Explica por qué las reacciones SN1 y SN2 responden de forma opuesta al impedimento estérico del sustrato, partiendo del mecanismo de cada una.',
 pistas:['¿Cuántas moléculas participan en el paso determinante de cada mecanismo?','¿En SN1 qué intermediario se forma y qué lo estabiliza?'],
 clave:['SN2 es concertada y bimolecular: el nucleófilo ataca por el lado opuesto al grupo saliente mientras este se va.','Ese ataque requiere acceso físico al carbono, así que los sustituyentes voluminosos lo bloquean: por eso funciona mejor en sustratos primarios.','SN2 produce inversión de configuración (inversión de Walden).','SN1 es por etapas: primero se ioniza el sustrato formando un carbocatión, y ese paso es el determinante.','Un carbono terciario forma un carbocatión más estable por efecto inductivo e hiperconjugación, así que SN1 se favorece justamente donde SN2 falla.','SN1 pasa por un carbocatión plano, así que el nucleófilo entra por ambas caras y se obtiene racemización.'],
 nota:'La respuesta completa debe explicar tanto la reactividad como la estereoquímica.'},
{b:'M3',n:2,q:'Dos enantiómeros de un fármaco tienen la misma fórmula molecular y las mismas propiedades físicas, pero uno es terapéutico y el otro puede ser tóxico. Explica cómo es posible.',
 pistas:['¿Con qué interactúa un fármaco en el organismo?','¿Ese blanco es simétrico?'],
 clave:['Los enantiómeros son imágenes especulares no superponibles: mismas propiedades físicas escalares (punto de fusión, solubilidad, densidad).','Solo difieren en el sentido de rotación de la luz polarizada y en su comportamiento frente a otros entes quirales.','Los receptores y enzimas son proteínas construidas con aminoácidos L: son intrínsecamente quirales.','El reconocimiento molecular requiere complementariedad tridimensional en al menos tres puntos, así que un enantiómero encaja y el otro no.','El enantiómero inactivo puede unirse a otro blanco distinto y producir efectos adversos.','De ahí la importancia de la síntesis asimétrica y de la resolución de racémicos en la industria farmacéutica.'],
 nota:'El ejemplo histórico es la talidomida, aunque el caso real se complica por la racemización in vivo.'},
{b:'M3',n:3,q:'Tienes que elegir el tipo de enlace de la cadena principal para un polímero destinado a suturas quirúrgicas reabsorbibles. Justifica tu elección y explica qué controla el tiempo de degradación.',
 pistas:['¿Qué enlaces se rompen con agua en condiciones fisiológicas?','¿Qué propiedades del sólido controlan el acceso del agua?'],
 clave:['Conviene un enlace hidrolizable en la cadena principal: éster (PLA, PGA, PCL) o amida, obtenidos por policondensación.','El éster se hidroliza a pH fisiológico a velocidad razonable; el enlace C–C de un poliolefina no se degradaría.','El tiempo de degradación se controla con la cristalinidad: las zonas amorfas se hidrolizan primero porque el agua penetra mejor.','También con la hidrofilicidad del monómero: PGA degrada más rápido que PLA, y PCL mucho más lento.','El peso molecular inicial fija cuánto tiempo se conserva la resistencia mecánica.','Copolimerizar (por ejemplo PLGA) permite sintonizar el tiempo de reabsorción variando la proporción.','Los productos de degradación deben ser metabolizables y no acidificar demasiado el tejido.'],
 nota:'Una buena respuesta conecta estructura molecular con propiedad macroscópica y con requisito clínico.'},
{b:'M3',n:3,q:'Explica el efecto de un inhibidor competitivo sobre la cinética de Michaelis-Menten y por qué Vmax no cambia mientras que Km aparente sí.',
 pistas:['¿Dónde se une el inhibidor competitivo?','¿Qué pasa si añades muchísimo sustrato?'],
 clave:['El inhibidor competitivo se une al sitio activo, compitiendo con el sustrato por el mismo sitio.','La unión es mutuamente excluyente: o está el sustrato o está el inhibidor.','Al aumentar mucho la concentración de sustrato, este desplaza al inhibidor por competencia de masas, así que la velocidad máxima alcanzable no cambia: Vmax igual.','Pero se necesita más sustrato para llegar a la mitad de Vmax, así que el Km aparente aumenta.','En una gráfica de Lineweaver-Burk las rectas se cruzan sobre el eje y (mismo 1/Vmax) con distinta pendiente.','En contraste, un inhibidor no competitivo se une a un sitio alostérico, reduce Vmax y deja Km sin cambio.'],
 nota:'La analogía farmacológica es directa: es el mismo razonamiento que un antagonista competitivo en una curva dosis-respuesta.'},
{b:'M3',n:2,q:'Describe qué información estructural te da la resonancia magnética nuclear que no te da un espectro infrarrojo, y en qué situación usarías cada una.',
 pistas:['¿Qué detecta cada técnica: enlaces o entornos atómicos?','¿Cuál te dice cuántos hidrógenos hay y dónde?'],
 clave:['IR detecta vibraciones de enlaces: identifica la presencia de grupos funcionales (C=O, O–H, N–H).','IR es rápida, barata, requiere poca muestra y sirve para confirmar un grupo funcional o seguir una reacción.','NMR detecta el entorno electrónico de núcleos con espín: da desplazamiento químico, integración y multiplicidad.','La integración cuenta cuántos hidrógenos hay en cada entorno y el acoplamiento revela qué está unido a qué.','NMR permite reconstruir la conectividad completa de la molécula; IR no.','En la práctica se usan juntas: IR para confirmación rápida de grupo funcional, NMR para elucidación estructural definitiva.'],
 nota:'Añadir espectrometría de masas para la fórmula molecular completa el trío clásico de elucidación.'},

/* --- M4 --- */
{b:'M4',n:3,q:'Explica, partiendo de la teoría de orbitales moleculares, por qué al reunir del orden de 10²³ átomos aparecen bandas continuas en lugar de niveles discretos.',
 pistas:['¿Qué pasa al combinar 2 orbitales atómicos? ¿Y al combinar 4? ¿Y 100?','¿Qué le ocurre a la separación entre niveles?'],
 clave:['Al combinar dos orbitales atómicos se generan dos orbitales moleculares: uno enlazante y uno antienlazante.','Con N orbitales atómicos se generan N orbitales moleculares, repartidos en el mismo rango de energía.','Al crecer N, la separación entre niveles consecutivos disminuye proporcionalmente.','Para N del orden del número de Avogadro, la separación es tan pequeña (~10⁻²² eV) que resulta indistinguible de un continuo: eso es una banda.','La banda de valencia proviene de los orbitales ocupados y la de conducción de los vacíos.','El band gap es la región de energías sin estados disponibles entre ambas bandas.','Que las bandas se solapen, se separen poco o se separen mucho define conductor, semiconductor o aislante.'],
 nota:'Es el mejor ejemplo de cómo un concepto molecular (TOM) escala a un concepto de estado sólido.'},
{b:'M4',n:2,q:'Deduce por qué la resistividad de un metal aumenta con la temperatura mientras que la de un semiconductor intrínseco disminuye.',
 pistas:['σ = n·q·µ. ¿Qué le pasa a n y qué a µ en cada caso?','¿En un metal falta portadores?'],
 clave:['La conductividad depende de la densidad de portadores n y de su movilidad µ.','En un metal la banda de conducción ya está poblada: n es prácticamente constante con la temperatura.','Al calentar aumenta la vibración de la red (fonones), que dispersan a los electrones y reducen µ.','Con n constante y µ decreciente, la conductividad baja y la resistividad sube.','En un semiconductor intrínseco casi no hay portadores a baja temperatura: n es el factor limitante.','Al calentar, más electrones cruzan el band gap térmicamente y n crece exponencialmente, efecto que domina ampliamente sobre la caída de µ.','Resultado: la resistividad del semiconductor disminuye al calentar.'],
 nota:'Este contraste es uno de los distractores más frecuentes del examen: asegúrate de poder derivarlo, no solo recordarlo.'},
{b:'M4',n:2,q:'Un material tiene un band gap de 3.2 eV. Predice su comportamiento eléctrico, su aspecto visual y una posible aplicación. Justifica cada predicción.',
 pistas:['Convierte eV a longitud de onda con 1240/E.','¿Ese valor cae en el visible o en el UV?'],
 clave:['λ = 1240/3.2 ≈ 388 nm, es decir en el ultravioleta cercano.','Como no absorbe en el visible, el material se ve blanco o transparente.','Con un gap de 3.2 eV la excitación térmica a temperatura ambiente es despreciable: se comporta como aislante o semiconductor de banda ancha.','Solo se vuelve conductor bajo iluminación UV, cuando se generan pares electrón-hueco.','Es el caso del TiO₂ anatasa: se usa como pigmento blanco y como fotocatalizador para recubrimientos autolimpiables.','Su limitación es que solo aprovecha el ~5 % del espectro solar; por eso se investiga el dopaje para reducir el gap.'],
 nota:'Encadenar band gap → longitud de onda → color → aplicación es exactamente el tipo de razonamiento integrador que el examen busca.'},
{b:'M4',n:1,q:'Explica la diferencia entre un defecto de Frenkel y uno de Schottky, y por qué en un cristal iónico ambos deben preservar la electroneutralidad.',
 pistas:['¿En cuál el ion desaparece del cristal y en cuál solo se mueve?'],
 clave:['Frenkel: un ion abandona su posición de red y se aloja en un intersticio, dejando una vacancia. La composición no cambia.','Schottky: se crean vacancias de catión y de anión simultáneamente, en proporción estequiométrica. Los iones salen a la superficie.','En Frenkel la electroneutralidad se conserva automáticamente porque el ion sigue dentro del cristal.','En Schottky se requiere el par de vacancias precisamente para no dejar carga neta.','Frenkel se favorece cuando hay gran diferencia de tamaño entre catión y anión (el pequeño cabe en el intersticio).','Ambos son defectos de equilibrio: su concentración crece exponencialmente con la temperatura y habilita la conductividad iónica.'],
 nota:'La conductividad iónica de electrolitos sólidos depende directamente de esta población de vacancias.'},
{b:'M4',n:3,q:'Un acero se endurece al deformarlo en frío. Explica el fenómeno en términos de dislocaciones y menciona qué se pierde a cambio.',
 pistas:['¿Qué defecto permite la deformación plástica?','¿Qué pasa cuando hay demasiados de esos defectos y se estorban entre sí?'],
 clave:['La deformación plástica ocurre por movimiento de dislocaciones a lo largo de planos de deslizamiento.','Al deformar en frío se generan nuevas dislocaciones y su densidad aumenta enormemente.','Las dislocaciones interactúan entre sí y se obstaculizan mutuamente (endurecimiento por deformación).','Mover una dislocación requiere entonces mayor esfuerzo: sube el límite elástico y la dureza.','A cambio se pierde ductilidad: el material se vuelve más frágil y tolera menos deformación antes de fracturar.','El recocido revierte el efecto al permitir recristalización y reducir la densidad de dislocaciones.','Otros mecanismos de endurecimiento —solución sólida, precipitación, refinamiento de grano (Hall-Petch)— comparten la lógica de obstaculizar dislocaciones.'],
 nota:'El compromiso resistencia-ductilidad es un tema recurrente en ciencia de materiales.'},

/* --- M5 --- */
{b:'M5',n:2,q:'Una reacción tiene ΔG negativo pero no se observa que ocurra a temperatura ambiente. Explica la aparente contradicción.',
 pistas:['¿Qué predice la termodinámica y qué predice la cinética?','Piensa en el diamante o en la combustión del papel.'],
 clave:['ΔG negativo indica que el proceso es termodinámicamente espontáneo, es decir posible.','No dice absolutamente nada sobre la velocidad a la que ocurrirá.','La velocidad la determina la energía de activación: si Ea es muy alta, k es despreciable a temperatura ambiente.','Ejemplo: la conversión de diamante a grafito tiene ΔG negativo pero Ea enorme, por eso el diamante es estable durante eones.','Otro ejemplo: el papel en presencia de oxígeno tiene ΔG muy negativo pero necesita una chispa.','Soluciones prácticas: aumentar la temperatura (Arrhenius) o añadir un catalizador que abra una ruta de menor Ea.','El catalizador no cambia ΔG ni K: solo acelera la llegada al equilibrio.'],
 nota:'Termodinámica dice si se puede; cinética dice si te alcanzará la vida para verlo.'},
{b:'M5',n:2,q:'Explica por qué el agua presenta pendiente negativa en la línea sólido-líquido de su diagrama de fases y qué consecuencia práctica tiene.',
 pistas:['¿Qué es más denso, el hielo o el agua líquida?','Aplica el principio de Le Chatelier a la presión.'],
 clave:['En casi todas las sustancias el sólido es más denso que el líquido, así que aumentar la presión favorece el sólido: pendiente positiva.','En el agua, los puentes de hidrógeno del hielo generan una estructura abierta y hexagonal menos densa que el líquido.','Como el líquido ocupa menos volumen, aumentar la presión favorece la fusión, no la solidificación.','Esto invierte la pendiente de la línea sólido-líquido.','Consecuencias: el hielo flota, lo que aísla térmicamente los lagos y permite la vida bajo la superficie.','La presión puede fundir hielo localmente, efecto que contribuye al deslizamiento de glaciares.','Es también la razón por la que el agua se expande al congelarse y revienta tuberías.'],
 nota:'El origen molecular (puente de hidrógeno) es la parte que suele faltar en las respuestas incompletas.'},
{b:'M5',n:3,q:'Para una reacción exotérmica que reduce el número de moles gaseosos, define las condiciones de operación que maximizan el rendimiento y explica el compromiso que aparece con la cinética.',
 pistas:['Aplica Le Chatelier a temperatura y presión por separado.','¿Qué le hace a la velocidad bajar la temperatura?'],
 clave:['Exotérmica: el calor es un producto, así que bajar la temperatura desplaza el equilibrio hacia productos y aumenta K.','Δn negativo: aumentar la presión (o reducir el volumen) desplaza hacia el lado con menos moles gaseosos, es decir productos.','Retirar producto conforme se forma desplaza continuamente el equilibrio (principio de Le Chatelier aplicado a concentración).','El conflicto: bajar la temperatura reduce drásticamente la constante de velocidad según Arrhenius.','Se llega a un equilibrio termodinámico favorable, pero en un tiempo inaceptable para un proceso industrial.','La solución es un catalizador, que permite operar a temperatura moderada con velocidad aceptable sin sacrificar tanto rendimiento.','Es exactamente el compromiso del proceso Haber-Bosch: ~450 °C, 200 atm y catalizador de hierro.'],
 nota:'Reconocer el compromiso termodinámica-cinética es lo que distingue una respuesta de ingeniería de una de química de primer año.'},
{b:'M5',n:1,q:'Explica por qué las propiedades coligativas dependen del número de partículas de soluto y no de su naturaleza química.',
 pistas:['¿Qué le hace el soluto a la entropía del disolvente?','¿Importa si las partículas son iones o moléculas neutras?'],
 clave:['Al añadir soluto aumenta el desorden de la fase líquida, es decir su entropía.','Eso estabiliza el líquido frente al sólido y frente al vapor.','En consecuencia baja la presión de vapor, sube el punto de ebullición y baja el punto de congelación.','El efecto es esencialmente entrópico y depende de la fracción de partículas de soluto, no de qué son.','Por eso una partícula de glucosa y un ion sodio cuentan igual.','Lo que sí importa es cuántas partículas genera cada fórmula al disolverse: ese es el factor de van\'t Hoff i.','NaCl da i ≈ 2, CaCl₂ da i ≈ 3, glucosa da i = 1. En disoluciones concentradas i real es algo menor por asociación iónica.'],
 nota:'Olvidar el factor i es el error número uno del tema, y siempre hay un distractor con el valor sin corregir.'},
{b:'M5',n:3,q:'Una suspensión de nanopartículas tiene potencial zeta de −8 mV y se agrega en pocas horas. Propón tres estrategias para estabilizarla y justifica cada una desde la teoría DLVO.',
 pistas:['DLVO suma repulsión electrostática y atracción de van der Waals.','¿Qué puedes cambiar: la carga, la barrera física o el medio?'],
 clave:['Un |ζ| de 8 mV es muy bajo: la barrera de repulsión no supera la atracción de van der Waals y las partículas coagulan.','Estrategia 1: ajustar el pH lejos del punto isoeléctrico para aumentar la carga superficial y con ella el potencial zeta.','Estrategia 2: reducir la fuerza iónica del medio (eliminar sales por diálisis o centrifugación), lo que expande la longitud de Debye y ensancha la barrera repulsiva.','Estrategia 3: añadir estabilización estérica con un polímero adsorbido o injertado (PEG, PVP), que impone una barrera física independiente de la carga.','Ventaja de la estérica: funciona a alta fuerza iónica y en medios no acuosos, donde la electrostática falla.','Estrategia complementaria: aumentar la viscosidad del medio para frenar la cinética de colisión, aunque esto solo retrasa el problema, no lo resuelve.','Verificación: medir potencial zeta tras la modificación y seguir el tamaño por DLS en el tiempo.'],
 nota:'Una buena respuesta distingue entre atacar la termodinámica del sistema (barrera) y atacar solo la cinética (viscosidad).'},

/* --- M6 --- */
{b:'M6',n:2,q:'Explica el modelo de LaMer y por qué la separación temporal entre nucleación y crecimiento produce partículas monodispersas.',
 pistas:['Piensa en qué pasa si nacen núcleos nuevos todo el tiempo.','¿Qué le pasa a la supersaturación cuando nuclea de golpe?'],
 clave:['Etapa 1: la concentración de monómero sube por encima de la solubilidad hasta alcanzar la supersaturación crítica.','Etapa 2: nucleación explosiva (burst). Se forman muchos núcleos casi simultáneamente y la supersaturación cae de golpe por debajo del umbral.','Etapa 3: ya no nuclean partículas nuevas; el monómero restante solo alimenta el crecimiento de los núcleos existentes.','Como todos los núcleos nacieron al mismo tiempo y crecen en el mismo medio, terminan con tamaños muy parecidos: distribución estrecha.','Si la nucleación fuera lenta y continua, coexistirían partículas de todas las edades y la distribución sería ancha.','El crecimiento controlado por difusión además tiende a estrechar la distribución, porque las pequeñas crecen relativamente más rápido.','Con el tiempo, la maduración de Ostwald revierte el efecto y vuelve a ensanchar la distribución.'],
 nota:'Prácticamente: inyección rápida de precursor en caliente (hot injection) es la implementación experimental de este modelo.'},
{b:'M6',n:3,q:'Quieres obtener nanovarillas de oro en lugar de nanoesferas. Explica qué debes controlar y por qué funciona, y cómo verificarías el resultado.',
 pistas:['¿Cuál es la forma termodinámicamente favorecida y por qué?','¿Cómo puedes hacer que unas caras crezcan más que otras?'],
 clave:['La esfera minimiza el área superficial y por tanto la energía: es el producto termodinámico.','Una varilla es un producto cinético: hay que frenar selectivamente el crecimiento de ciertas facetas.','Se usa un surfactante como CTAB que se adsorbe preferentemente sobre las caras laterales, bloqueándolas.','El material se deposita entonces en las puntas, alargando la partícula: crecimiento anisotrópico.','Se emplea además el método de semillas (seed-mediated): primero se generan núcleos y después se crecen en una solución de crecimiento con reductor débil.','Iones auxiliares como Ag⁺ ayudan a controlar la relación de aspecto.','Verificación: TEM para ver la forma y medir la relación de aspecto; UV-Vis debe mostrar DOS bandas de plasmón (transversal ~520 nm y longitudinal desplazada al infrarrojo según la relación de aspecto).'],
 nota:'La aparición de la segunda banda plasmónica es la evidencia espectroscópica directa de la anisotropía.'},
{b:'M6',n:3,q:'Debes recubrir con una capa uniforme de 5 nm de Al₂O₃ el interior de los poros de un material mesoporoso. Compara ALD y sputtering para esta tarea y elige.',
 pistas:['¿Cómo llega el material a cada punto en cada técnica?','¿Un poro de 5 nm tiene línea de vista con la fuente?'],
 clave:['El sputtering es un proceso de línea de vista: las partículas viajan en trayectoria esencialmente recta desde el blanco.','En una superficie porosa el sputtering tapa la boca del poro y deja el interior sin recubrir.','ALD se basa en reacciones superficiales autolimitadas: el precursor gaseoso difunde por todo el poro y solo reacciona donde hay sitios disponibles.','Al ser autolimitada, la reacción se detiene sola al completar la monocapa, garantizando uniformidad.','El espesor se controla contando ciclos: con ~0.1 nm por ciclo, 5 nm son unos 50 ciclos.','ALD da recubrimiento conformal incluso en relaciones de aspecto muy altas: es la única opción viable aquí.','Desventaja de ALD: es lento y caro por ciclo; para películas gruesas sobre superficies planas el sputtering es mucho más eficiente.'],
 nota:'La palabra clave es «conformalidad». Es el argumento que decide la elección.'},
{b:'M6',n:2,q:'Explica, partiendo del modelo de la partícula en una caja, por qué un punto cuántico de CdSe de 2 nm emite luz azul y uno de 5 nm emite roja.',
 pistas:['E_n = n²h²/(8mL²). ¿Cómo depende de L?','¿Qué relación hay entre energía del fotón y color?'],
 clave:['Cuando el tamaño del cristal es comparable o menor al radio de Bohr del excitón, el par electrón-hueco queda confinado.','El confinamiento discretiza los niveles y suma un término de energía que escala como 1/L².','Ese término se suma al band gap del material masivo: E_g(NP) ≈ E_g(bulk) + h²/(8µR²) − término coulómbico.','Menor tamaño ⇒ mayor energía de confinamiento ⇒ mayor band gap efectivo.','La emisión ocurre al recombinarse el par, con energía igual al gap efectivo: mayor energía significa menor longitud de onda.','2 nm da un gap grande ⇒ emisión hacia el azul; 5 nm da un gap menor ⇒ emisión hacia el rojo.','Es notable que sea el mismo material: el color se sintoniza solo con el tamaño, no cambiando la composición.'],
 nota:'La relación 1/L² importa: reducir el tamaño a la mitad cuadruplica el término de confinamiento.'},
{b:'M6',n:3,q:'Debes producir un millón de chips con estructuras de 50 nm. Argumenta la elección entre litografía por haz de electrones y nanoimpresión.',
 pistas:['¿Cuál escribe punto por punto y cuál replica un molde?','¿Qué implica eso para el rendimiento por hora?'],
 clave:['La litografía por haz de electrones escribe en serie: el haz recorre el patrón punto por punto.','Su resolución es excelente (por debajo de 10 nm) pero su rendimiento es bajísimo: horas por oblea.','La nanoimpresión replica en paralelo: se presiona un molde sobre un resiste y se transfiere todo el patrón de una vez.','Su resolución la fija el molde, y ese molde se puede fabricar precisamente con haz de electrones.','Para un millón de unidades, la estrategia correcta es escribir UN molde maestro con EBL y después replicar por nanoimpresión.','Así se combina la resolución del método serie con el rendimiento del método paralelo.','Consideraciones: desgaste y defectos del molde, control de la capa residual y alineación entre niveles.'],
 nota:'Esta lógica «escribir el maestro una vez, replicar muchas» es la misma que separa la fotolitografía de máscaras del EBL.'},

/* --- M7 --- */
{b:'M7',n:3,q:'Te entregan un polvo blanco desconocido y te piden decir qué compuesto es, qué tamaño tienen sus partículas y si contiene impurezas. Diseña la secuencia de técnicas y justifica el orden.',
 pistas:['¿Qué técnica te dice la fase cristalina y cuál la composición elemental?','¿Conviene empezar por lo barato y no destructivo?'],
 clave:['Empezar por lo no destructivo y económico: DRX para identificar la fase cristalina comparando contra bases de datos.','El ancho de los picos de DRX da, vía Scherrer, una primera estimación del tamaño de cristalito.','FTIR o Raman para confirmar grupos funcionales y detectar fases amorfas u orgánicas que la DRX no ve.','SEM para morfología y tamaño de partícula real, con EDS acoplado para composición elemental y detección de impurezas.','TEM si se necesita resolver el tamaño de partículas por debajo de ~20 nm o ver estructura interna.','ICP-MS tras digestión para cuantificar impurezas metálicas a nivel traza, ya de forma destructiva.','TGA para determinar contenido volátil, agua adsorbida o materia orgánica residual.','BET si interesa el área superficial específica y la porosidad.','El orden general: no destructivo antes que destructivo, e información estructural antes que cuantificación fina.'],
 nota:'Justificar el ORDEN vale tanto como listar las técnicas.'},
{b:'M7',n:2,q:'Tu medición de DLS reporta 80 nm y la de TEM 20 nm para la misma muestra. Explica la discrepancia y decide qué valor reportarías y cómo.',
 pistas:['¿Qué mide exactamente cada técnica?','¿Cómo pondera DLS las partículas grandes?'],
 clave:['TEM mide el diámetro del núcleo sólido, en seco y bajo vacío, sobre una población pequeña de partículas que tú eliges.','DLS mide el diámetro hidrodinámico: núcleo más ligandos, capa de solvatación y doble capa eléctrica.','Ese diámetro hidrodinámico es intrínsecamente mayor que el del núcleo.','Además DLS pondera por intensidad de dispersión, que escala como d⁶: unos pocos agregados sesgan enormemente el promedio.','Una diferencia de 4× sugiere no solo la capa de solvatación sino probable agregación parcial en suspensión.','No hay un valor «correcto» único: hay que reportar ambos, indicando la técnica y qué mide cada una.','Complementar con el índice de polidispersidad del DLS y con la distribución en número, y verificar el potencial zeta para evaluar estabilidad.'],
 nota:'Reportar un solo número sin decir con qué técnica se obtuvo es un error metodológico común.'},
{b:'M7',n:2,q:'Explica por qué la espectroscopía infrarroja y la Raman son complementarias, y qué establece la regla de exclusión mutua.',
 pistas:['¿Qué propiedad debe cambiar en cada caso durante la vibración?','¿Qué tiene de especial una molécula con centro de inversión?'],
 clave:['Un modo vibracional es activo en IR si durante la vibración cambia el momento dipolar de la molécula.','Un modo es activo en Raman si durante la vibración cambia la polarizabilidad.','Son criterios físicos distintos, así que los modos activos en una técnica no coinciden necesariamente con los de la otra.','Vibraciones de enlaces muy polares (C=O, O–H) dan señal IR intensa; vibraciones simétricas de enlaces poco polares (C–C, S–S) dan señal Raman intensa.','Regla de exclusión mutua: en moléculas con centro de inversión, ningún modo puede ser activo simultáneamente en IR y en Raman.','Esto convierte a la comparación IR/Raman en una prueba experimental de simetría molecular.','Práctico: el agua da señal IR muy fuerte y Raman débil, por eso Raman es preferible para muestras acuosas y biológicas.'],
 nota:'La conexión con simetría molecular y grupos puntuales es la parte que distingue una respuesta completa.'},
{b:'M7',n:3,q:'Tras moler una muestra en molino de bolas, sus picos de DRX se ensanchan notablemente. Da al menos dos explicaciones posibles y propón cómo distinguirlas experimentalmente.',
 pistas:['Scherrer no es la única causa de ensanchamiento.','¿Qué le hace la molienda a la red además de romper granos?'],
 clave:['Explicación 1: reducción del tamaño de cristalito. La molienda fragmenta los dominios coherentes y por Scherrer el ancho crece como 1/D.','Explicación 2: microdeformación. La molienda introduce dislocaciones y esfuerzos residuales que distribuyen los espaciados interplanares y ensanchan los picos.','Explicación 3 (menos probable): amorfización parcial, que además reduciría la intensidad integrada y elevaría el fondo.','Cómo distinguir: la contribución de tamaño escala como 1/cosθ y la de deformación como tanθ, así que dependen distinto del ángulo.','El análisis de Williamson-Hall grafica β·cosθ contra senθ: la ordenada da el tamaño y la pendiente la microdeformación.','Verificación independiente: medir tamaño por TEM y comparar contra el tamaño de cristalito de Scherrer.','Un recocido suave relajaría la deformación sin cambiar mucho el tamaño: si los picos se afinan tras recocer, dominaba la deformación.'],
 nota:'Aplicar Scherrer sin considerar la microdeformación es el error clásico al analizar materiales molidos o deformados.'},
{b:'M7',n:1,q:'Explica qué información te da el análisis termogravimétrico que no te da la calorimetría diferencial de barrido, y viceversa.',
 pistas:['Una mide masa y la otra energía.','¿Cuál de las dos puede ver la transición vítrea?'],
 clave:['TGA registra la masa de la muestra en función de la temperatura.','Detecta pérdida de agua adsorbida, descomposición de ligandos orgánicos, oxidación y residuo inorgánico final.','Sirve para cuantificar la fracción orgánica de una nanopartícula funcionalizada.','DSC registra el flujo de calor y detecta cualquier evento con entalpía asociada.','Ve fusión, cristalización, transiciones de fase sólido-sólido y curado, con su entalpía cuantificada.','Solo el DSC detecta la transición vítrea (Tg), porque es una transición de segundo orden sin cambio de masa ni entalpía latente: aparece como un escalón en la línea base.','TGA es ciega a la Tg y a la fusión; DSC no cuantifica pérdidas de masa.','Por eso los equipos modernos son simultáneos (TGA-DSC): permiten saber si un evento térmico va acompañado de pérdida de masa.'],
 nota:'La pregunta trampa clásica: «¿con qué técnica mides Tg?» La respuesta nunca es TGA.'},

/* --- M8 --- */
{b:'M8',n:2,q:'Explica por qué en un microcanal no puedes mezclar dos líquidos simplemente agitando, y describe qué soluciones de diseño existen.',
 pistas:['Calcula mentalmente el orden de magnitud de Re.','Si no hay turbulencia, ¿qué mecanismo queda?'],
 clave:['En un microcanal típico (D ~100 µm, v ~1 mm/s) el número de Reynolds es del orden de 0.1, muy por debajo de 1.','Dominan las fuerzas viscosas: el flujo es estrictamente laminar y las corrientes viajan en paralelo sin entremezclarse.','No existe turbulencia que genere remolinos, así que agitar no produce el efecto esperado.','El único mecanismo de mezcla disponible es la difusión molecular, que es lenta: el tiempo escala con el cuadrado de la distancia.','Solución pasiva 1: mezcladores caóticos con estructuras en el fondo (herringbone) que pliegan las corrientes y reducen la distancia de difusión.','Solución pasiva 2: serpentinas y canales que dividen y recombinan las corrientes repetidamente.','Solución 3: microfluídica de gotas, donde la circulación interna dentro de cada gota mezcla su contenido rápidamente.','Solución activa: agitación acústica, eléctrica o magnética inducida externamente.','Ventaja del régimen laminar: cuando quieres control preciso (gradientes estables, enfoque hidrodinámico), la ausencia de turbulencia es una virtud.'],
 nota:'Nota que el número de Péclet cuantifica exactamente este compromiso entre convección y difusión.'},
{b:'M8',n:3,q:'Compara el flujo impulsado por presión y el flujo electroosmótico para transportar una muestra biológica por un chip analítico. Analiza al menos cuatro criterios.',
 pistas:['Piensa en el perfil de velocidad de cada uno.','¿Qué pasa con proteínas si aplicas un campo eléctrico intenso?'],
 clave:['Perfil de velocidad: el flujo por presión es parabólico (rápido en el centro, cero en las paredes); el electroosmótico es tipo tapón, esencialmente plano.','Consecuencia analítica: el perfil parabólico dispersa la banda de muestra y ensancha los picos; el perfil plano preserva la resolución de separación.','Escalamiento con el tamaño: la presión requerida crece como 1/r⁴ (Poiseuille), así que canales muy finos son inviables por presión; el flujo electroosmótico no sufre esa penalización.','Instrumentación: la presión requiere bombas y conexiones mecánicas voluminosas; el electroosmótico solo requiere electrodos, lo que favorece la miniaturización.','Desventajas del electroosmótico: depende del pH y de la carga de la pared, que puede cambiar por adsorción de proteínas; requiere alto voltaje y genera calentamiento Joule.','Riesgo biológico: campos intensos pueden desnaturalizar proteínas o lisar células; el bombeo por presión es más benigno.','Control de composición: el flujo por presión mueve todo por igual; el electroosmótico se superpone a la electroforesis de los solutos cargados, lo que puede ser ventaja (separación) o problema (sesgo).','Decisión típica: electroosmótico para separaciones analíticas de alta resolución; presión para manipular células o suspensiones.'],
 nota:'Una comparación buena no elige un ganador absoluto, sino que condiciona la elección al objetivo.'},
{b:'M8',n:3,q:'Explica el principio de funcionamiento de un biosensor basado en cantilever resonante y analiza qué factores limitan su sensibilidad.',
 pistas:['f₀ = (1/2π)√(k/m). ¿Qué pasa si se pega masa?','¿Qué es el factor Q y por qué importa?'],
 clave:['Se funcionaliza la superficie del cantilever con un receptor específico (anticuerpo, aptámero, sonda de DNA).','Al unirse el analito, la masa efectiva del cantilever aumenta y su frecuencia de resonancia disminuye.','La relación es Δf/f₀ ≈ −Δm/(2m): cuanto menor sea la masa del cantilever, mayor el desplazamiento relativo por unidad de masa capturada. De ahí el interés en NEMS.','Límite 1: el factor de calidad Q. Un pico de resonancia ancho hace difícil resolver desplazamientos pequeños; operar en líquido amortigua fuertemente y degrada Q.','Límite 2: ruido térmico y deriva de temperatura, que desplazan f₀ sin que haya analito.','Límite 3: adsorción inespecífica, que añade masa de moléculas que no son el blanco y produce falsos positivos. Se mitiga con bloqueo de superficie y con un cantilever de referencia.','Límite 4: cambios en la rigidez k por esfuerzo superficial inducido al unirse el analito, que compiten con el efecto de masa.','Límite 5: transporte de masa. A concentraciones muy bajas, el tiempo para que el analito difunda hasta la superficie puede dominar el tiempo de respuesta.','Estrategia habitual: medir en modo diferencial contra un cantilever de control idéntico pero sin receptor.'],
 nota:'Distinguir el efecto de masa del efecto de esfuerzo superficial es un punto fino que da mucho valor a la respuesta.'},
{b:'M8',n:2,q:'Explica por qué en un dispositivo MEMS el stiction es un problema grave mientras que la gravedad resulta irrelevante.',
 pistas:['¿Cómo escala el volumen con L? ¿Y la superficie?','¿De cuál depende el peso y de cuál las fuerzas de adhesión?'],
 clave:['El peso es proporcional a la masa y por tanto al volumen, que escala como L³.','Las fuerzas superficiales —van der Waals, capilaridad, electrostática— escalan aproximadamente como L o L².','Al reducir L, el cociente entre fuerzas superficiales y peso crece como 1/L² o 1/L: las superficiales acaban dominando por órdenes de magnitud.','A escala micrométrica una estructura pesa nanogramos, así que la gravedad es despreciable frente a la adhesión.','El stiction es la adhesión permanente entre dos superficies que entran en contacto y ya no se separan: inutiliza el dispositivo.','Causa frecuente: fuerzas capilares durante el secado del líquido de grabado, que arrastran las estructuras hasta pegarlas.','Mitigaciones: secado supercrítico con CO₂ para evitar la interfaz líquido-vapor, recubrimientos antiadherentes hidrofóbicos (SAM), topes o protuberancias que reducen el área de contacto, y diseño con mayor rigidez de restitución.'],
 nota:'La misma lógica de escalamiento explica por qué un insecto camina sobre el agua y por qué las nanopartículas se agregan.'},
{b:'M8',n:3,q:'Diseña conceptualmente un sensor plasmónico para detectar una proteína específica en suero. Describe el principio, la arquitectura y los controles necesarios.',
 pistas:['¿De qué depende la posición de la banda de LSPR?','¿Cómo consigues especificidad?'],
 clave:['Principio: la posición de la resonancia de plasmón depende del índice de refracción del medio inmediatamente adyacente a la nanoestructura metálica.','Al unirse una proteína a la superficie, el índice local aumenta y la banda de plasmón se desplaza a mayor longitud de onda (redshift) de forma medible.','Arquitectura: nanopartículas de oro (o una película nanoestructurada) inmovilizadas sobre un sustrato transparente, o en suspensión.','Funcionalización: monocapa autoensamblada de tioles con grupo terminal carboxilo, activada por química EDC/NHS para anclar covalentemente el anticuerpo de captura.','Bloqueo de la superficie restante (BSA o PEG) para minimizar adsorción inespecífica, crítico en una matriz compleja como el suero.','Lectura: espectro UV-Vis o de reflectancia; se cuantifica el desplazamiento del máximo frente a la concentración.','Alternativa de amplificación: esquema tipo sándwich con una segunda nanopartícula, que agrega el sistema y produce un desplazamiento mucho mayor.','Controles indispensables: sustrato sin anticuerpo, anticuerpo irrelevante, muestra sin analito, y curva de calibración con estándares en matriz de suero.','Figuras de mérito a reportar: sensibilidad (nm por unidad de índice de refracción), límite de detección, rango dinámico, especificidad frente a proteínas interferentes y tiempo de respuesta.'],
 nota:'Este reactivo integra M6 (síntesis), M7 (caracterización) y M8 (dispositivo). Es exactamente el tipo de pregunta integradora que puede aparecer.'},

/* --- M9 --- */
{b:'M9',n:3,q:'Explica por qué no es posible conservar simultáneamente la potencia por unidad de volumen y la velocidad de punta al escalar un reactor agitado, y cómo decides cuál conservar.',
 pistas:['P ∝ N³D⁵ y V ∝ D³. Deriva cómo debe cambiar N en cada criterio.','¿Qué fenómeno limita tu proceso en particular?'],
 clave:['La potencia de agitación escala como P ∝ N³D⁵ y el volumen como V ∝ D³, así que P/V ∝ N³D².','Conservar P/V exige N³D² constante, es decir N ∝ D^(−2/3).','La velocidad de punta es proporcional a N·D, así que con ese N escala como D^(1/3): aumenta al escalar.','Conservar la velocidad de punta exigiría N ∝ 1/D, lo que haría caer P/V como D⁻². Son requisitos contradictorios.','Ejemplo numérico: al aumentar D diez veces con P/V constante, N cae a ~21 % y la velocidad de punta sube ~2.15 veces.','El criterio se elige según el paso limitante del proceso.','Si el proceso es sensible al esfuerzo cortante (células, cristales frágiles, emulsiones), se conserva la velocidad de punta.','Si el limitante es la transferencia de oxígeno en un cultivo aerobio, se conserva k_La.','Si el limitante es la homogeneidad rápida (nucleación en síntesis de nanopartículas), se conserva el tiempo de mezclado.','Si el limitante es la transferencia de calor, se cuida el área de intercambio por unidad de volumen, que empeora al escalar porque A/V cae como 1/D.'],
 nota:'La respuesta madura reconoce que escalar es elegir qué sacrificar, no encontrar la fórmula mágica.'},
{b:'M9',n:3,q:'Tu síntesis de nanopartículas da distribución estrecha en 50 mL, pero al pasar a 5 L la distribución se ensancha notablemente. Diagnostica las causas probables y propón soluciones.',
 pistas:['¿Qué exige el modelo de LaMer que sea rápido?','¿Cómo cambia el tiempo de mezclado con la escala?'],
 clave:['El modelo de LaMer exige que la nucleación ocurra de golpe y de forma homogénea en todo el volumen.','Al escalar, el tiempo de mezclado aumenta: la adición de precursor ya no se distribuye instantáneamente.','Aparecen gradientes locales de concentración: unas zonas nuclean antes que otras, generando núcleos de distintas edades y por tanto de distintos tamaños.','Segunda causa: gradientes térmicos. El área de intercambio por unidad de volumen (A/V) cae como 1/D, así que calentar o enfriar uniformemente se vuelve más lento.','Tercera causa: el tiempo total de proceso se alarga, dando más margen a la maduración de Ostwald, que ensancha la distribución.','Cuarta causa: cambios en el esfuerzo cortante que alteran la agregación o la adsorción de estabilizante.','Soluciones: mejorar el micromezclado con un mezclador en T o un reactor de flujo continuo, donde la escala se logra por tiempo de operación y no por volumen.','Alimentar el precursor a través de múltiples puntos de inyección en lugar de uno solo.','Usar geometría de impulsor y deflectores que reduzcan el tiempo de mezclado, y conservar ese criterio al escalar.','Controlar la temperatura con encamisado eficiente o serpentín interno, y monitorear en línea con UV-Vis o DLS.','Verificación: comparar distribuciones por DLS y TEM entre escalas y medir experimentalmente el tiempo de mezclado con un trazador.'],
 nota:'La migración de batch a flujo continuo es la respuesta industrial estándar a este problema.'},
{b:'M9',n:1,q:'Explica la diferencia entre factibilidad técnica y viabilidad económica, con un ejemplo concreto de tu campo.',
 pistas:['Una pregunta es «¿se puede?» y la otra «¿conviene?».'],
 clave:['Factibilidad técnica responde si el proceso puede realizarse con la tecnología, los materiales y las capacidades disponibles.','Viabilidad económica responde si, aun siendo posible, el resultado justifica su costo frente a las alternativas del mercado.','Un proceso puede ser perfectamente factible y económicamente absurdo.','Ejemplo: sintetizar nanopartículas de oro monodispersas por haz de electrones es técnicamente factible, pero el costo por gramo es órdenes de magnitud mayor que la ruta de citrato.','Otro ejemplo: un recubrimiento autolimpiable de TiO₂ funciona, pero si duplica el precio de una ventana y solo actúa bajo UV, el mercado puede no aceptarlo.','Hay además una tercera dimensión: viabilidad regulatoria y ambiental (permisos, toxicidad, disposición de residuos).','El análisis completo requiere estimar CAPEX, OPEX, punto de equilibrio y comparar contra el estado del arte.'],
 nota:'En el módulo de formulaciones esto se conecta directamente con el Business Model Canvas.'},
{b:'M9',n:2,q:'Debes optimizar tres variables de una síntesis (temperatura, concentración de precursor y tiempo). Diseña el experimento y explica qué ganas frente a variar una variable a la vez.',
 pistas:['¿Cuántas corridas requiere un factorial 2³?','¿Qué información te pierdes si mueves una variable a la vez?'],
 clave:['Un diseño factorial completo 2³ evalúa cada variable en dos niveles: 8 corridas base.','Añadir réplicas permite estimar el error experimental, y puntos centrales permiten detectar curvatura.','El factorial estima no solo los efectos principales sino también las interacciones entre variables.','Variar una a la vez (OFAT) no puede detectar interacciones: si el efecto de la temperatura depende de la concentración, OFAT te da una conclusión falsa.','OFAT además requiere más corridas para la misma precisión, porque cada punto se usa una sola vez.','La aleatorización del orden de corrida protege contra factores no controlados que derivan en el tiempo.','El bloqueo controla fuentes conocidas de variabilidad (lote de reactivo, día, operador).','Si el óptimo queda dentro de la región explorada, se pasa a un diseño de superficie de respuesta (Box-Behnken o central compuesto) para ajustar un modelo cuadrático.','Si hay muchas variables candidatas, se empieza con un factorial fraccionado de cribado para descartar las irrelevantes.'],
 nota:'El argumento decisivo a favor del DOE son las interacciones, no solo el ahorro de corridas.'},
{b:'M9',n:3,q:'Un revisor cuestiona tu conclusión porque tu valor p es 0.049. Responde con argumentos estadísticos sólidos.',
 pistas:['¿Qué significa exactamente un valor p?','¿El umbral de 0.05 tiene algo de sagrado?'],
 clave:['El valor p es la probabilidad de observar datos al menos tan extremos como los tuyos SI la hipótesis nula fuera cierta.','No es la probabilidad de que la hipótesis nula sea falsa, ni la probabilidad de que tu hipótesis sea verdadera.','El umbral de 0.05 es una convención arbitraria: 0.049 y 0.051 son evidencialmente casi idénticos. Tratarlos como categorías opuestas es un error conceptual.','La respuesta correcta no es defender el 0.049, sino reportar el tamaño del efecto y su intervalo de confianza, que es lo que realmente importa para la decisión.','Un efecto pequeño puede ser estadísticamente significativo con n grande, y uno grande puede no serlo con n pequeña: significancia estadística no es relevancia práctica.','Hay que reportar la potencia del estudio y el tamaño de muestra, y reconocer si el estudio estaba subdimensionado.','Declarar si el análisis fue preespecificado o exploratorio, y si hubo comparaciones múltiples que exijan corrección.','Lo más convincente: proponer o presentar una réplica independiente. La reproducibilidad pesa más que cualquier umbral.'],
 nota:'Este reactivo mide honestidad intelectual además de estadística. Defender ciegamente el 0.05 es la peor respuesta posible.'},

/* --- M10 --- */
{b:'M10',n:2,q:'Explica por qué una emulsión puede desestabilizarse por maduración de Ostwald aun cuando las gotas nunca lleguen a tocarse.',
 pistas:['¿Cómo viaja el material en Ostwald?','Recuerda la ecuación de Kelvin.'],
 clave:['La ecuación de Kelvin establece que la solubilidad de una gota aumenta al disminuir su radio, por efecto de la curvatura.','Por lo tanto las gotas pequeñas tienen mayor solubilidad en la fase continua que las grandes.','Se establece un gradiente de concentración del material de la fase dispersa en la fase continua.','El material se disuelve desde las gotas pequeñas, difunde a través de la fase continua y se deposita sobre las grandes.','Las gotas nunca se tocan: el transporte es molecular, no por contacto.','El resultado neto es que las pequeñas desaparecen, las grandes crecen y la distribución se desplaza, degradando la textura y la apariencia del producto.','Se distingue de la coalescencia, donde dos gotas sí entran en contacto y la película interfacial se rompe.','Mitigaciones: usar una fase dispersa muy insoluble en la continua, añadir un agente atrapador osmótico (por ejemplo un aceite de baja solubilidad como el escualano), o estrechar la distribución inicial de tamaños, ya que Ostwald se alimenta de la polidispersidad.'],
 nota:'La estrategia del atrapador osmótico es contraintuitiva y suele ser el punto que distingue una respuesta experta.'},
{b:'M10',n:3,q:'Una nanopartícula terapéutica funciona muy bien en cultivo celular pero falla al probarse en animal. Plantea al menos tres hipótesis y describe cómo probarías cada una.',
 pistas:['¿Qué hay en la sangre que no hay en el medio de cultivo?','¿Llega la partícula al tejido blanco?'],
 clave:['Hipótesis 1: corona proteica. Al entrar en sangre, las proteínas se adsorben y ocultan los ligandos de direccionamiento, cambiando la identidad biológica de la partícula. Prueba: incubar en suero, aislar por centrifugación y caracterizar la corona por proteómica; repetir el ensayo in vitro en presencia de suero completo.','Hipótesis 2: eliminación acelerada. El sistema fagocítico mononuclear (hígado y bazo) captura las partículas antes de que alcancen el blanco. Prueba: estudio de biodistribución con partículas marcadas (radiomarcaje o fluorescencia) y cuantificación por órgano; medir la vida media en circulación.','Hipótesis 3: barrera de transporte. In vitro las células están directamente expuestas; in vivo la partícula debe atravesar endotelio y matriz extracelular, y el efecto EPR puede ser mucho más débil de lo supuesto en ese modelo tumoral. Prueba: histología del tejido blanco para localizar las partículas y modelos 3D o esferoides que reproduzcan la barrera.','Hipótesis 4: agregación o degradación en el medio fisiológico por alta fuerza iónica o pH. Prueba: DLS y potencial zeta en medio fisiológico simulado y seguimiento de estabilidad en el tiempo.','Hipótesis 5: dosis efectiva inalcanzable. La concentración usada in vitro puede ser imposible de alcanzar en el tejido sin toxicidad sistémica. Prueba: farmacocinética y cálculo de la concentración real en el sitio blanco.','Hipótesis 6: el modelo animal no reproduce la biología humana relevante, o el modelo tumoral tiene vasculatura atípica.','Estrategias de mitigación: PEGilación para reducir opsonización, control estricto del tamaño en el rango de 10 a 100 nm, y direccionamiento activo con ligandos accesibles por encima de la corona.'],
 nota:'La traslación de in vitro a in vivo es un tema clásico de discusión en nanomedicina y da mucho juego en una pregunta abierta.'},
{b:'M10',n:2,q:'Explica qué es la corona proteica y por qué cambia radicalmente la biodistribución de una nanopartícula.',
 pistas:['¿Qué encuentra la partícula al entrar a la sangre?','¿Qué es lo que la célula realmente reconoce?'],
 clave:['Al entrar en un fluido biológico, las proteínas del medio se adsorben espontáneamente sobre la superficie de la nanopartícula.','Se forma una corona dura (proteínas de alta afinidad, unión prolongada) y una corona blanda (intercambio rápido).','La composición evoluciona en el tiempo: primero se adsorben las proteínas abundantes y luego las de mayor afinidad las desplazan (efecto Vroman).','La consecuencia clave es que la célula no reconoce la superficie que tú diseñaste, sino la corona: la identidad biológica sustituye a la identidad sintética.','Si se adsorben opsoninas, el sistema fagocítico marca la partícula para eliminación rápida en hígado y bazo.','Los ligandos de direccionamiento pueden quedar enterrados bajo la corona y perder su función.','La corona altera además el tamaño hidrodinámico efectivo, la carga y la tendencia a agregarse.','Estrategias: PEGilación y otras superficies antiincrustantes para reducir la adsorción; en algunos casos se usa la corona a favor, seleccionando superficies que reclutan proteínas útiles.','Implicación metodológica: caracterizar la partícula solo en agua no predice su comportamiento in vivo.'],
 nota:'La frase que resume el concepto: la célula no ve tu nanopartícula, ve su corona.'},
{b:'M10',n:2,q:'Justifica por qué el área superficial es mejor métrica de dosis que la masa en estudios de nanotoxicología.',
 pistas:['¿Dónde ocurre la interacción con el sistema biológico?','Compara 1 mg de partículas de 100 nm contra 1 mg de 10 nm.'],
 clave:['La interacción entre un nanomaterial y un sistema biológico ocurre en la interfaz, es decir en la superficie.','Los procesos relevantes —generación de especies reactivas de oxígeno, disolución de iones, adsorción de proteínas— escalan con el área expuesta.','A masa constante, reducir el diámetro diez veces multiplica el área superficial total por diez (S/V = 6/ρd).','Por tanto 1 mg de partículas de 10 nm presenta muchísima más superficie reactiva que 1 mg de partículas de 100 nm.','Experimentalmente se observa que las curvas dosis-respuesta de partículas de distintos tamaños colapsan en una sola cuando se grafican contra área superficial, no contra masa.','El número de partículas también es una métrica útil cuando el mecanismo depende de eventos discretos de internalización.','La masa sigue usándose por costumbre regulatoria y porque es fácil de medir, pero puede subestimar gravemente el riesgo de los materiales más finos.','Recomendación práctica: reportar la dosis en las tres métricas (masa, área y número) para permitir comparaciones entre estudios.'],
 nota:'Es un ejemplo de cómo la nanoescala obliga a repensar convenciones establecidas en toxicología clásica.'},
{b:'M10',n:3,q:'Diseña un recubrimiento autolimpiable para vidrio arquitectónico. Explica los dos mecanismos que debe combinar y las limitaciones prácticas.',
 pistas:['Uno degrada la suciedad orgánica; el otro se encarga del agua.','¿Qué necesita el TiO₂ para activarse?'],
 clave:['Mecanismo 1, fotocatálisis: el TiO₂ (anatasa, Eg ≈ 3.2 eV) absorbe UV y genera pares electrón-hueco.','Esos portadores producen especies reactivas de oxígeno (radicales hidroxilo y superóxido) que oxidan y descomponen la materia orgánica depositada.','Mecanismo 2, control de mojabilidad: puede ir en dos direcciones opuestas y hay que elegir.','Vía superhidrofóbica: rugosidad nanoestructurada más química de baja energía superficial da ángulos de contacto por encima de 150° en régimen Cassie-Baxter; las gotas ruedan y arrastran la suciedad (efecto loto).','Vía superhidrofílica: el propio TiO₂ irradiado se vuelve superhidrofílico, el agua forma una película continua que se desliza y limpia por debajo de la suciedad. Ventaja adicional: evita el empañamiento.','Estas dos vías son incompatibles entre sí en la misma superficie; la industria del vidrio suele optar por la superhidrofílica combinada con fotocatálisis.','Limitación 1: el TiO₂ anatasa solo se activa con UV, que es menos del 5 % del espectro solar. Se investiga dopaje con nitrógeno o acoplamiento con otros semiconductores para llevar la respuesta al visible.','Limitación 2: durabilidad mecánica. Las nanoestructuras rugosas se dañan con abrasión, y la fotocatálisis puede degradar el aglutinante orgánico del propio recubrimiento.','Limitación 3: adherencia y transparencia. El recubrimiento debe ser suficientemente delgado para no dispersar luz visible.','Limitación 4: el desprendimiento de nanopartículas al ambiente plantea preguntas de nanotoxicología y regulación.','Caracterización necesaria: DRX para confirmar fase anatasa, ángulo de contacto antes y después de irradiar, degradación de un colorante modelo como prueba de actividad fotocatalítica, y ensayos de abrasión.'],
 nota:'Este reactivo integra M4 (bandas), M6 (síntesis), M7 (caracterización) y M10 (aplicación).'},

/* --- Integradoras --- */
{b:'M0',n:1,q:'Si tuvieras que explicarle a alguien sin formación técnica por qué «lo nano es distinto», ¿qué dos ideas usarías y con qué analogías?',
 pistas:['Una idea es geométrica y la otra es cuántica.'],
 clave:['Idea 1, superficie: al dividir un material en trozos cada vez más pequeños, la superficie total crece enormemente sin cambiar la masa.','Analogía: un terrón de azúcar tarda en disolverse, la misma cantidad molida se disuelve al instante. En la nanoescala esto se lleva al extremo y una fracción enorme de los átomos está en la superficie.','Como la superficie es donde ocurre la química, el material se vuelve mucho más reactivo, mejor catalizador, y hasta funde a menor temperatura.','Idea 2, confinamiento: cuando el cristal es tan pequeño que el electrón «se siente apretado», sus niveles de energía se separan.','Analogía: una cuerda de guitarra corta suena más agudo que una larga. Acortar el espacio disponible sube la frecuencia.','Consecuencia visible: el mismo material emite colores distintos solo cambiando el tamaño, que es lo que ocurre con los puntos cuánticos.','Cierre: en la nanoescala el tamaño deja de ser un detalle de fabricación y se convierte en un parámetro de diseño, tan importante como la composición química.'],
 nota:'Saber explicar sin jerga es una habilidad evaluable, y además revela si de verdad entendiste.'},
{b:'M0',n:3,q:'Traza la cadena conceptual completa que va desde «configuración electrónica» hasta «por qué un punto cuántico emite luz de un color específico». Nombra cada eslabón.',
 pistas:['Usa la pestaña de Ruta de aprendizaje para verificar tu cadena.'],
 clave:['Configuración electrónica: los electrones ocupan orbitales según Aufbau, Hund y Pauli; los de valencia gobiernan la química.','Enlace y orbitales moleculares: al combinar orbitales atómicos aparecen niveles enlazantes y antienlazantes.','Teoría de bandas: al reunir ~10²³ átomos, esos niveles se vuelven bandas continuas separadas por un band gap.','Semiconductores: un gap intermedio permite promover electrones y dejar huecos.','Partícula en una caja: confinar una partícula en una región de tamaño L discretiza sus niveles con E ∝ 1/L².','Confinamiento cuántico: cuando el nanocristal es menor o comparable al radio de Bohr del excitón, las bandas se discretizan y el gap efectivo aumenta al reducir el tamaño.','Recombinación radiativa: al recombinarse el par electrón-hueco se emite un fotón de energía igual al gap efectivo.','Energía del fotón: E = hc/λ, así que mayor gap significa menor longitud de onda, es decir emisión más azul.','Conclusión: el color de emisión de un punto cuántico se sintoniza con el tamaño porque el tamaño fija el gap efectivo.'],
 nota:'Poder recorrer una cadena así en ambos sentidos es la mejor señal de que dominas un tema.'},
{b:'M0',n:3,q:'Explica cómo un mismo concepto, la energía superficial, aparece en la nucleación, en la maduración de Ostwald, en el ángulo de contacto y en el punto de fusión de una nanopartícula.',
 pistas:['En todos los casos el sistema intenta reducir área o pagar el costo de crearla.'],
 clave:['Origen común: los átomos de la superficie tienen enlaces incompletos, así que crear área cuesta energía. Ese costo por unidad de área es γ.','Nucleación: el término de superficie (+4πr²γ) se opone al de volumen (−(4/3)πr³ΔG_v). La competencia genera un radio crítico y una barrera ΔG* = 16πγ³/(3ΔG_v²).','Maduración de Ostwald: como la curvatura eleva el potencial químico, las partículas pequeñas son más solubles. El sistema reduce su área total disolviendo las pequeñas para engordar las grandes.','Ángulo de contacto: la ecuación de Young es un balance entre tres energías interfaciales (γ_SV = γ_SL + γ_LV·cosθ). La gota adopta la forma que minimiza la energía total.','Punto de fusión: por Gibbs-Thomson, la contribución superficial desestabiliza el sólido nanométrico y su temperatura de fusión cae respecto al material masivo.','Hilo conductor: en los cuatro casos el sistema busca minimizar la energía total y el término superficial se vuelve dominante cuando el radio es pequeño, porque S/V crece como 1/r.','Consecuencia práctica: la energía superficial es el motor de casi toda la inestabilidad de los nanomateriales, y por eso los estabilizantes existen.'],
 nota:'Reconocer un mismo principio bajo distintos nombres es exactamente lo que te ahorra memorizar cuatro temas por separado.'},
{b:'M0',n:2,q:'Explica en qué se parecen y en qué difieren el band gap electrónico y el band gap fotónico.',
 pistas:['Ambos nacen de una periodicidad. ¿Periodicidad de qué en cada caso?'],
 clave:['Semejanza: ambos surgen de la interacción de una onda con un medio periódico, que genera rangos de energía o frecuencia prohibidos.','En el caso electrónico, la onda es la función de onda del electrón y la periodicidad es la de la red cristalina, con escala de fracciones de nanómetro.','En el caso fotónico, la onda es electromagnética y la periodicidad es la del índice de refracción, con escala del orden de la longitud de onda de la luz (cientos de nanómetros).','Ambos se describen con el mismo formalismo matemático de teorema de Bloch, red recíproca y zonas de Brillouin.','Diferencia clave de escala: la periodicidad requerida es tres órdenes de magnitud mayor en el caso fotónico.','Diferencia física: los electrones son fermiones con interacción entre sí y con masa; los fotones son bosones sin masa y sin interacción directa.','Diferencia de diseño: el band gap electrónico lo fija la naturaleza del material, mientras que el fotónico se diseña geométricamente y puede sintonizarse cambiando el periodo de la estructura.','Aplicaciones análogas: así como el dopaje introduce estados en el gap electrónico, un defecto en un cristal fotónico crea un modo localizado que sirve de cavidad o de guía de onda.'],
 nota:'El ópalo natural es un cristal fotónico: su color no viene de un pigmento sino de su estructura.'},
{b:'M0',n:3,q:'Argumenta por qué el equilibrio químico, la cinética enzimática de Michaelis-Menten y la interacción ligando-receptor son, en el fondo, la misma matemática.',
 pistas:['Escribe la expresión de una unión reversible A + B ⇌ AB en los tres contextos.'],
 clave:['Los tres describen una unión reversible entre dos especies que alcanza un estado estacionario o de equilibrio.','Equilibrio químico: A + B ⇌ AB con K = [AB]/([A][B]). La fracción de A unida sigue una curva de saturación hiperbólica frente a [B].','Michaelis-Menten: E + S ⇌ ES → E + P. Bajo estado estacionario, v = Vmax[S]/(Km + [S]), que es una hipérbola de saturación.','Ligando-receptor: R + L ⇌ RL con Kd = [R][L]/[RL]. La ocupación del receptor es [L]/(Kd + [L]), la misma forma funcional.','Km, Kd y 1/K son todas constantes con unidades de concentración que marcan el punto de semisaturación.','Adsorción de Langmuir tiene exactamente la misma forma: θ = KP/(1+KP). Es el mismo modelo aplicado a una superficie.','La estructura común es la saturación de un número finito de sitios: a concentraciones bajas la respuesta es lineal, a concentraciones altas se satura.','Los inhibidores competitivos y no competitivos tienen su análogo exacto en antagonistas farmacológicos.','Valor práctico: si dominas la forma hiperbólica de saturación, entiendes de un golpe cuatro temas de módulos distintos.'],
 nota:'Detectar estas isomorfías es el mayor ahorro de memoria que puedes conseguir antes del examen.'},
{b:'M0',n:2,q:'Elige el caso del oro coloidal de tu reto y descríbelo como un proyecto integral: síntesis, caracterización, propiedad y aplicación, explicitando qué concepto sostiene cada etapa.',
 pistas:['Recorre las etapas y en cada una nombra el principio de fondo.'],
 clave:['Síntesis: reducción de HAuCl₄ con citrato en caliente (método de Turkevich). El citrato actúa a la vez como reductor y como estabilizante.','Concepto de fondo: REDOX para la reducción del Au(III) a Au(0), y modelo de LaMer para explicar por qué la adición rápida da monodispersidad.','Estabilización: el citrato adsorbido confiere carga negativa; la estabilidad se explica por DLVO y se cuantifica con potencial zeta.','Caracterización óptica: UV-Vis muestra la banda de plasmón cerca de 520 nm. Su posición e intensidad informan sobre tamaño y estado de agregación.','Concepto de fondo: LSPR, oscilación colectiva de electrones libres acoplada a la luz.','Caracterización de tamaño: TEM da el tamaño del núcleo y la forma; DLS da el diámetro hidrodinámico, siempre mayor. La discrepancia entre ambos es esperada y explicable.','Caracterización estructural: DRX confirma la fase cúbica centrada en las caras del oro y, por Scherrer, estima el tamaño de cristalito.','Propiedad aprovechable: la posición del plasmón depende del índice de refracción del entorno y se desplaza al agregarse (el color vira de rojo a azul).','Aplicación: sensores colorimétricos, marcaje en microscopía electrónica, terapia fototérmica y plataformas SERS.','Cierre de ingeniería: evaluar escalabilidad de la ruta, costo del precursor, estabilidad en almacenamiento y consideraciones de nanotoxicología antes de plantear un producto.'],
 nota:'Este es el formato de respuesta que más puntos da en preguntas integradoras: cada etapa acompañada de su principio.'}
];
