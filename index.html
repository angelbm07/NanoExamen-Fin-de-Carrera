<style>
/*
  Guía de estudio para el Examen de Fin de Carrera, Ingeniería en Nanotecnología (taller WA3062).
  Layout: una pestaña por módulo (M2 a M10) + pestaña final de quiz mixto.
  Cada módulo = resumen compacto -> acordeones para profundizar -> flashcards.
  El quiz final mezcla los nueve módulos (interleaving) y reporta desglose por módulo.
  Fundamento: recuperación activa y práctica intercalada (Dunlosky et al. 2013,
  Psychological Science in the Public Interest 14(1), 4-58).
*/
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#eef1f4; --border:#c7d0d9;
  --ink:#16222e; --ink-dim:#57687a;
  --m2:#0b6b5f;  --m2-bg:#e0efec;
  --m3:#6b4a7a;  --m3-bg:#efe8f3;
  --m4:#003f6c;  --m4-bg:#e1ebf3;
  --m5:#0071ba;  --m5-bg:#e3f0fa;
  --m6:#4a5c6b;  --m6-bg:#e9edf0;
  --m7:#8a5a1f;  --m7-bg:#f5ebdd;
  --m8:#1a5e8a;  --m8-bg:#e2eef5;
  --m9:#4f6b2a;  --m9-bg:#eaf0e1;
  --m10:#8a3a52; --m10-bg:#f6e7eb;
  --accent:#003f6c; --accent-ink:#ffffff;
  --good:#1a7a4c; --bad:#b3261e;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:48px}
img{max-width:100%}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:20px 10px}
header.top .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-family:var(--font-mono)}
header.top h1{font-size:1.7rem;margin-top:4px}
header.top p{color:var(--ink-dim);font-size:.92rem;margin-top:6px;line-height:1.5}
.topnote{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:.86rem;line-height:1.5;color:var(--ink-dim);margin-top:12px}
.topnote a{color:var(--accent)}

nav.tabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--border);margin-bottom:18px}
nav.tabs button{font-family:var(--font-body);font-weight:600;font-size:.85rem;border:1px solid var(--border);background:var(--surface);color:var(--ink-dim);border-radius:999px;padding:7px 14px;cursor:pointer;transition:all .15s}
nav.tabs button:hover{border-color:var(--accent);color:var(--ink)}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.module-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.module-head .tag{font-family:var(--font-mono);font-size:.7rem;padding:3px 8px;border-radius:5px;font-weight:700}
.module-head h2{font-size:1.3rem}
.module-sub{color:var(--ink-dim);font-size:.88rem;margin-bottom:14px;line-height:1.5}
.m2 .tag{background:var(--m2-bg);color:var(--m2)} .m3 .tag{background:var(--m3-bg);color:var(--m3)}
.m4 .tag{background:var(--m4-bg);color:var(--m4)} .m5 .tag{background:var(--m5-bg);color:var(--m5)}
.m6 .tag{background:var(--m6-bg);color:var(--m6)} .m7 .tag{background:var(--m7-bg);color:var(--m7)}
.m8 .tag{background:var(--m8-bg);color:var(--m8)} .m9 .tag{background:var(--m9-bg);color:var(--m9)}
.m10 .tag{background:var(--m10-bg);color:var(--m10)}

.section-progress{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:20px}
.section-progress i{display:block;height:100%;border-radius:99px;transition:width .3s}
.m2 .section-progress i{background:var(--m2)} .m3 .section-progress i{background:var(--m3)}
.m4 .section-progress i{background:var(--m4)} .m5 .section-progress i{background:var(--m5)}
.m6 .section-progress i{background:var(--m6)} .m7 .section-progress i{background:var(--m7)}
.m8 .section-progress i{background:var(--m8)} .m9 .section-progress i{background:var(--m9)}
.m10 .section-progress i{background:var(--m10)}

section.block{margin-bottom:22px;scroll-margin-top:72px}
section.block h3{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
section.block h3 .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-dim);border:1px solid var(--border);border-radius:4px;padding:1px 6px;flex-shrink:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card p{margin:0 0 6px;line-height:1.55;font-size:.93rem}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:6px 0 0;padding-left:20px;font-size:.92rem;line-height:1.6}
.card li{margin-bottom:3px}
.card b{color:var(--ink)}
.m2-accent{border-left:3px solid var(--m2)} .m3-accent{border-left:3px solid var(--m3)}
.m4-accent{border-left:3px solid var(--m4)} .m5-accent{border-left:3px solid var(--m5)}
.m6-accent{border-left:3px solid var(--m6)} .m7-accent{border-left:3px solid var(--m7)}
.m8-accent{border-left:3px solid var(--m8)} .m9-accent{border-left:3px solid var(--m9)}
.m10-accent{border-left:3px solid var(--m10)}

.eq{font-family:var(--font-mono);font-size:.88rem;background:var(--surface-2);border-radius:7px;padding:9px 12px;margin:8px 0;overflow-x:auto;white-space:nowrap}

table.data{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
table.data th,table.data td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top;line-height:1.45}
table.data th{background:var(--surface-2);font-weight:700;font-size:.8rem}
table.data td code{font-family:var(--font-mono);font-size:.82rem}
.tscroll{overflow-x:auto}

details.deep{border:1px solid var(--border);border-radius:10px;margin:10px 0;background:var(--surface);overflow:hidden}
details.deep>summary{padding:11px 15px;font-weight:600;font-size:.9rem;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;color:var(--ink)}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary:before{content:"+";font-family:var(--font-mono);font-weight:700;color:var(--ink-dim);width:12px;flex-shrink:0}
details.deep[open]>summary:before{content:"\2212"}
details.deep[open]>summary{border-bottom:1px solid var(--border)}
details.deep .inner{padding:12px 15px}
details.deep .inner p{margin:0 0 7px;line-height:1.58;font-size:.91rem}
details.deep .inner p:last-child{margin-bottom:0}
details.deep .inner ul,details.deep .inner ol{font-size:.9rem;line-height:1.6;padding-left:20px;margin:6px 0}

.fc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.fc-head h3{font-size:1rem}
.fc-head span{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-dim)}
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.flashcard{perspective:1000px;min-height:132px;cursor:pointer}
.flashcard .inner{position:relative;width:100%;height:100%;min-height:132px;transition:transform .45s;transform-style:preserve-3d}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.flashcard .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:center;font-size:.9rem;line-height:1.5}
.flashcard .front{background:var(--surface);font-weight:600}
.flashcard .back{background:var(--surface-2);transform:rotateY(180deg);font-size:.86rem}
.flashcard .hint{position:absolute;bottom:7px;right:11px;font-family:var(--font-mono);font-size:.62rem;color:var(--ink-dim);font-weight:400}
</style>
</head>
<body>
<style>
/* ---- quiz ---- */
.quiz-wrap{max-width:680px}
.quiz-bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.quiz-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qmeta .tag{font-family:var(--font-mono);font-size:.7rem;padding:3px 8px;border-radius:5px;font-weight:700}
.qmeta .counter{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-dim)}
.qtext{font-size:1rem;font-weight:600;line-height:1.5;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 14px;margin-bottom:8px;font-family:var(--font-body);font-size:.92rem;line-height:1.45;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .letra{font-family:var(--font-mono);font-weight:700;font-size:.78rem;color:var(--ink-dim);margin-right:8px}
.opt.correct{border-color:var(--good);background:#eaf5ef}
.opt.correct .letra{color:var(--good)}
.opt.incorrect{border-color:var(--bad);background:#fbeceb}
.opt.incorrect .letra{color:var(--bad)}
.opt.chosen{box-shadow:inset 0 0 0 1px var(--border)}
.explain{display:none;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;padding:11px 14px;margin-top:10px;font-size:.89rem;line-height:1.55}
.explain.show{display:block}
.explain b{color:var(--ink)}
.qnav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-weight:600;font-size:.88rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface);color:var(--ink-dim);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--ink);filter:none}
.btn:disabled{opacity:.42;cursor:default;filter:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.result{text-align:center;padding:10px 0 4px}
.result .score{font-family:var(--font-display);font-size:3rem;line-height:1;margin-bottom:4px}
.result .pct{font-family:var(--font-mono);font-size:.95rem;color:var(--ink-dim)}
.result .veredicto{font-size:.93rem;color:var(--ink-dim);margin-top:10px;line-height:1.55;text-align:left;background:var(--surface-2);border-radius:9px;padding:12px 14px}
.bymod{margin-top:20px;text-align:left}
.bymod h3{font-size:.95rem;margin-bottom:10px}
.modrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.87rem}
.modrow .tag{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:4px;font-weight:700;min-width:38px;text-align:center;flex-shrink:0}
.modrow .bar{flex:1;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.modrow .bar i{display:block;height:100%;border-radius:99px}
.modrow .num{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-dim);min-width:52px;text-align:right;flex-shrink:0}

.revisar{margin-top:18px}
.rev-item{border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:11px}
.rev-item .rq{font-weight:600;font-size:.93rem;line-height:1.48;margin:7px 0 10px}
.rev-item .opt{cursor:default;margin-bottom:6px;font-size:.88rem;padding:8px 12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){
  header.top h1{font-size:1.4rem}
  .fcgrid{grid-template-columns:1fr}
  .result .score{font-size:2.4rem}
}
</style>

  <h1>Guía EFC · Ingeniería en Nanotecnología</h1>
  <p>Nueve módulos técnicos, 10 % cada uno. Resumen compacto por módulo, acordeones para profundizar, flashcards de recuperación activa y un quiz final que mezcla los nueve.</p>

<script>
/* ============================================================
   CONTENIDO
   Condensado del material de los cursos disciplinares en Canvas
   y de la literatura de referencia. Cada módulo vale 10 % del examen.
   ============================================================ */
var G=[

/* ===================== M2 ===================== */
{id:'M2',nom:'Análisis químico',sesion:'Sesión 3 del taller',
 sub:'La cadena analítica completa: del mol al resultado con incertidumbre declarada. Volumetría, electroquímica, instrumental y estadística del dato.',
 sec:[
  {t:'Un análisis es una cadena, no una medición',b:[
   {p:['Muestreo, preparación, medición y tratamiento del dato. La exactitud del resultado la limita <b>el eslabón más débil</b>, no el instrumento: un ICP-MS impecable sobre una muestra mal homogeneizada da un número preciso y falso.',
       'De ahí la distinción que más se pregunta. <b>Exactitud</b> es cercanía al valor verdadero; <b>precisión</b> es cercanía entre réplicas. Son independientes, y la combinación que observas te dice qué error domina.']},
   {tabla:{th:['Lo que observas','Error que domina','Cómo se corrige'],tr:[
     ['Réplicas juntas pero desviadas','Sistemático (sesgo)','Material de referencia, adición de estándar, método independiente. <b>No</b> promediando más réplicas'],
     ['Réplicas dispersas, media correcta','Aleatorio','Aumentar n: σ de la media baja con √n'],
     ['Un valor suelto muy alejado','Grosero','Prueba Q de Dixon, con criterio declarado de antemano']]}},
   {p:['Cifras significativas: en <b>multiplicación y división</b> manda el factor con menos cifras; en <b>suma y resta</b> manda el que tiene menos decimales. Es el error de cálculo más barato de evitar y uno de los más frecuentes.']}
  ]},
  {t:'Volumetría y equilibrios en disolución',b:[
   {p:['Titular es contar moles usando una reacción de estequiometría conocida. Dos conceptos que no son sinónimos: el <b>punto de equivalencia</b> es estequiométrico y teórico; el <b>punto final</b> es lo que observas con el indicador. La diferencia entre ambos es el error de titulación.']},
   {p:['El pH en la equivalencia <b>solo vale 7 si ambos son fuertes</b>. Ácido débil con base fuerte deja la base conjugada, que hidroliza: pH mayor que 7, y pide fenolftaleína (vira 8.2–10). Base débil con ácido fuerte: pH menor que 7, y pide naranja de metilo (3.1–4.4).']},
   {eq:'pH = pKa + log([A⁻]/[HA])   ·   en la semiequivalencia [A⁻] = [HA] ⇒ pH = pKa'},
   {p:['Ese punto de semiequivalencia es la lectura directa del pKa en una curva experimental, y es el centro de la capacidad amortiguadora. El intervalo útil de un tampón es aproximadamente pKa ± 1.']},
   {deep:{t:'Por qué el 0.0592 de Nernst no es universal',b:[
     {p:['La ecuación de Nernst circula en dos formas y mezclarlas introduce un factor 2.303.'],},
     {eq:'E = E° − (RT/nF)·ln Q      (teórica, logaritmo natural)'},
     {eq:'E = E° − (0.0592/n)·log Q   (práctica a 25 °C, logaritmo decimal)'},
     {p:['El 0.0592 V es (2.303·R·298.15)/F: lleva dentro la temperatura de 25 °C <b>y</b> el factor de conversión de ln a log. A 37 °C, temperatura fisiológica relevante en biosensores, el coeficiente vale 0.0616. Usar 0.0592 con un logaritmo natural, o RT/F con uno decimal, deja el resultado mal por 2.303.']}
   ]}}
  ]},
  {t:'Instrumental y límites del método',b:[
   {p:['Beer-Lambert sale de integrar una absorción fraccional constante a lo largo del camino óptico: es un decaimiento exponencial en el espacio, y por eso la absorbancia (un logaritmo) es la que resulta lineal con la concentración.']},
   {eq:'A = ε·b·c      LOD ≈ 3σ_blanco/m      LOQ ≈ 10σ_blanco/m'},
   {ul:['Trabajar entre A = 0.1 y 1.0: por arriba la linealidad se pierde (interacción entre absorbentes, anchura de banda finita, luz parásita) y por abajo la relación señal-ruido se degrada.',
        'Medir en el máximo de absorción: ahí ε varía poco dentro de la banda del monocromador y la sensibilidad es máxima.',
        'Un R² alto <b>no</b> descarta sesgo: linealidad y exactitud son cosas distintas.',
        'Entre LOD y LOQ corresponde reportar que el analito se detectó pero no se cuantifica, no el número.']},
   {p:['Para bajar el LOD solo hay dos palancas: subir la pendiente (mejor método) o bajar el ruido del blanco (reactivos más puros, mejor blindaje). <b>Sensibilidad</b> es la pendiente y por sí sola no dice nada del ruido.']},
   {deep:{t:'Cromatografía cuantitativa: los cuatro números',b:[
     {tabla:{th:['Parámetro','Expresión','Qué significa'],tr:[
       ['Factor de retardo','Rf = d_analito / d_frente','Capa fina. Adimensional, entre 0 y 1. Zona útil 0.3–0.7'],
       ['Factor de retención','k′ = (t_R − t_M)/t_M','Cuántas veces más tiempo está retenido. <b>Restar el tiempo muerto</b> es el paso que más se omite'],
       ['Selectividad','α = k′₂/k′₁','Siempre ≥ 1. Mide si los dos picos se separan en absoluto'],
       ['Resolución','R = 2(t_R2 − t_R1)/(w₁ + w₂)','R ≥ 1.5 es separación completa a línea base'],
       ['Eficiencia','N = 16(t_R/w)²','Platos teóricos. Cuánto ensancha la columna, no cuántos analitos separa']]}},
     {p:['Ojo con el orden de operaciones: k′ exige el tiempo muerto restado, y R lleva un factor 2 en el numerador que si se omite da la mitad del valor correcto.']}
   ]}}
  ]},
  {t:'Gravimetría y análisis redox',b:[
   {p:['En gravimetría el <b>precipitado es un intermedio analítico</b>: la herramienta con la que aíslas y pesas el analito. El porcentaje se reporta siempre respecto a la masa de <b>muestra original</b>, porque es ella la que se está analizando. Confundir el denominador no hace que el cálculo parezca mal, y por eso el error pasa desapercibido.']},
   {p:['Se calcina antes de pesar para llevar el precipitado a una forma de composición definida y constante: lo que se busca no es más masa, sino masa cuya fórmula conozcas con certeza, porque el cálculo pasa por su masa molar.']},
   {p:['Leer subíndices con cuidado: si obtienes n moles de P, los moles de P₂O₅ son n/2. Y en redox la estequiometría sale de <b>igualar electrones</b>, no de los coeficientes aparentes: el MnO₄⁻ gana 5 electrones y el Fe²⁺ cede 1, de ahí la relación 1 a 5.']},
   {p:['El permanganato en medio ácido es autoindicador: el Mn²⁺ producto es casi incoloro, así que la primera gota en exceso colorea la disolución. Con EDTA, en cambio, hay que tamponar: solo la especie Y⁴⁻ acompleja, y su fracción se desploma al bajar el pH. El EDTA es hexadentado y forma complejos <b>1:1 sin importar la carga</b> del metal.']}
  ]}
 ],
 flash:[
  ['¿Qué pH esperas en la equivalencia al titular ácido acético con NaOH?','Mayor que 7. Solo queda acetato, base conjugada de un ácido débil, que hidroliza y libera OH⁻. Pide fenolftaleína.'],
  ['¿Qué se cumple en el punto de semiequivalencia?','pH = pKa, porque [A⁻] = [HA] y el término logarítmico de Henderson-Hasselbalch se anula. Es la lectura directa del pKa.'],
  ['Expresiones de LOD y LOQ','LOD ≈ 3σ del blanco / pendiente. LOQ ≈ 10σ / pendiente. El LOQ es siempre mayor; los factores 3 y 10 son convenciones.'],
  ['Réplicas muy juntas pero todas desviadas del valor certificado: ¿qué error es?','Sistemático. Alta precisión con baja exactitud. No se corrige promediando más réplicas: hay que encontrar la fuente.'],
  ['Factor de retención en HPLC','k′ = (t_R − t_M)/t_M. Hay que restar el tiempo muerto de la columna; omitirlo es el error típico.'],
  ['Resolución cromatográfica y su umbral','R = 2(t_R2 − t_R1)/(w₁ + w₂). Con R ≥ 1.5 la separación es completa a línea base.'],
  ['¿Respecto a qué masa se reporta un porcentaje gravimétrico?','A la masa de la muestra original. El precipitado es solo el intermedio con el que se mide.'],
  ['Relación estequiométrica MnO₄⁻ : Fe²⁺ en medio ácido','1 a 5. El permanganato gana 5 electrones (Mn VII → Mn II) y cada Fe²⁺ cede 1. Sale de igualar electrones.'],

  {t:'De orbitales a bandas, y el dopaje',b:[

   {eq:'E(eV) ≈ 1240 / λ(nm)   ·   umbral de absorción de un semiconductor'},
   {tabla:{th:['Material','Eg (eV)','Umbral','Aspecto'],tr:[

   {p:['El dopaje <b>no cambia el ancho del gap</b>: introduce niveles dentro de él. El fósforo en silicio deja un nivel donador a unos 0.045 eV bajo la banda de conducción, y como kT a temperatura ambiente vale 0.026 eV, ese electrón se libera con facilidad. Resultado: tipo n. El boro deja un nivel aceptor cerca de la banda de valencia: tipo p.']},
   {deep:{t:'La trampa de la temperatura',b:[
     {p:['El comportamiento de la resistividad con la temperatura distingue a un metal de un semiconductor, y las direcciones son opuestas.'],},
     {ul:['<b>Metal</b>: T sube ⇒ ρ sube. El número de portadores ya es fijo; lo que crece es la dispersión por fonones.',

   {p:['FCC y HCP tienen la misma eficiencia: lo único que cambia es la secuencia de apilamiento, ABCABC frente a ABAB. Esa diferencia altera el número de sistemas de deslizamiento, y por eso los metales FCC (aluminio, cobre) son típicamente más dúctiles que los HCP (zinc, magnesio).']},
   {eq:'d = a / √(h² + k² + l²)   ·   sistema cúbico'},
   {p:['Los índices de Miller usan <b>recíprocos</b> por una razón concreta: un plano paralelo a un eje lo corta en el infinito, y su recíproco es cero en lugar de infinito. Eso evita infinitos en la notación y hace los índices proporcionales a la orientación.']},
   {p:['Los defectos no son fallas, son el mecanismo. La deformación plástica ocurre por <b>movimiento de dislocaciones</b>, y endurecer un metal consiste en obstaculizarlas: por solución sólida, por precipitados, por frontera de grano (Hall-Petch) o por trabajo en frío. Si la densidad medida resulta menor que la teórica, la interpretación son vacancias; si es mayor, intersticiales.']}

  {t:'La cuántica que sí se pregunta',b:[

   {p:['Tres conclusiones, y la tercera es la rentable. La energía está cuantizada; el estado fundamental <b>nunca vale cero</b> por el principio de incertidumbre; y <b>E escala como 1/L²</b>, así que reducir la caja a la mitad cuadruplica la energía. Esa dependencia es exactamente el confinamiento cuántico de los puntos cuánticos.']},
   {p:['Los cuatro números cuánticos no son convención: cada uno sale de imponer que la función de onda sea aceptable en una dimensión del problema. El azimutal l va de 0 a n−1, y de ahí que no exista un orbital 1p. Las 2, 6, 10 y 14 columnas de los bloques s, p, d y f son exactamente 2(2l+1).']},
   {p:['Bohr es exacto para hidrógeno e hidrogenoides y falla para todo lo demás, porque ignora la repulsión entre electrones y el apantallamiento. Ese apantallamiento rompe la degeneración y hace que la energía dependa también de l: de ahí que el 4s se llene antes que el 3d, algo que en hidrógeno no tendría sentido.']},
   {p:['Y en cálculo computacional: <b>Hartree-Fock ignora la correlación electrónica</b>; DFT la aproxima mediante un funcional cuya elección afecta los resultados. Al expandir en un conjunto base finito, el problema se vuelve matricial de valores propios, det(H − ES) = 0.']}

  ['¿Por qué un metal es dúctil y un sólido iónico frágil?','Al deslizar un plano, en el metal el mar electrónico sigue rodeando a todos los cationes. En el iónico se enfrentan cargas iguales y la interacción pasa a repulsiva.'],
  ['Al hervir agua, ¿qué se rompe?','Puentes de hidrógeno entre moléculas. Los enlaces O–H quedan intactos: el vapor sigue siendo H₂O.'],

  ['Átomos por celda y coordinación en FCC','4 átomos por celda, coordinación 12, empaquetamiento 0.74. No confundir los dos números.'],
  ['¿Por qué los índices de Miller usan recíprocos?','Para que un plano paralelo a un eje dé índice cero en lugar de infinito, y para que los índices sean proporcionales a la orientación.'],
  ['Dependencia de la energía con el tamaño en la partícula en una caja','E ∝ 1/L². Reducir la dimensión a la mitad cuadruplica la energía. Es la base del confinamiento cuántico.'],

/* ===================== M5 ===================== */
{id:'M5',nom:'Fisicoquímica',sesion:'Sesión 5 del taller',
 sub:'Fuerzas intermoleculares, termodinámica y espontaneidad, equilibrio y cinética, y el comportamiento de las superficies. Entrega la base que quince conceptos de síntesis necesitan.',
 sec:[
  {t:'Fuerzas intermoleculares y el orden de comparación',b:[
   {p:['La jerarquía típica por par de moléculas es ion-dipolo > puente de hidrógeno > dipolo-dipolo > London. Pero hay una excepción que el examen explota: las <b>fuerzas de London crecen con la polarizabilidad</b>, que crece con el número de electrones. Por eso el yodo, que solo tiene London, es sólido, mientras que el HF, que tiene puentes de hidrógeno, es gas.']},
   {p:['Regla operativa: si las masas son parecidas, decide el tipo de fuerza (etanol 78 °C frente a dimetil éter −24 °C, misma fórmula C₂H₆O). Si las masas son muy distintas, revisa si el tamaño alcanza para que London compense.']},
   {p:['El agua y sus anomalías salen de un solo hecho geométrico: cada molécula puede formar <b>cuatro</b> puentes, dos como donadora y dos como aceptora. De ahí el punto de ebullición anómalo, la capacidad calorífica alta y que el hielo flote. Y de ahí que la línea sólido-líquido del agua tenga <b>pendiente negativa</b> en el diagrama de fases, al revés que casi todas las sustancias.']},
   {p:['Las propiedades coligativas dependen del <b>número de partículas</b>: sin el factor i de van’t Hoff el resultado está mal, y el valor sin corregir suele coincidir exactamente con uno de los distractores. Se expresan en molalidad y no en molaridad porque la molalidad no depende de la temperatura, que es justo la variable en estudio.']}
  ]},
  {t:'Espontaneidad: los cuatro casos',b:[
   {eq:'ΔG = ΔH − TΔS   ·   ΔG° = −RT ln K = −nFE°'},
   {tabla:{th:['ΔH','ΔS','¿Espontáneo?','Ejemplo'],tr:[
     ['−','+','Siempre','Descomposición explosiva'],
     ['+','−','Nunca (lo es el inverso)','—'],
     ['−','−','Solo a T baja','Congelación, condensación'],
     ['+','+','Solo a T alta','Fusión, evaporación']]}},
   {p:['La temperatura de cruce sale de igualar ΔG a cero: T = ΔH/ΔS. Así se calculan puntos de fusión y ebullición a partir de datos termodinámicos.']},
   {p:['La relación ΔG° = −RT ln K = −nFE° dice que termodinámica, equilibrio y electroquímica son <b>la misma información en tres lenguajes</b>. Y hay una distinción que es la fuente número uno de error del tema: ΔG° describe condiciones estándar, mientras que el sentido real lo decide ΔG = ΔG° + RT ln Q con las concentraciones del momento. Con mucho producto inicial, Q es grande y ΔG puede salir positivo aunque ΔG° sea negativo.']},
   {p:['Y <b>espontáneo no es rápido</b>. El diamante tiene ΔG negativo hacia grafito a condiciones normales y no ocurre en escalas humanas, porque la barrera cinética es enorme. La termodinámica dice si puede; la cinética, si alcanzará a hacerlo.']},
   {deep:{t:'El origen de la entropía según Clausius',b:[
     {p:['Clausius observó que la integral de dQ_rev/T sobre cualquier ciclo cerrado siempre vale cero.'],},
     {p:['Si una magnitud integrada sobre un ciclo cerrado da cero, entonces su valor entre dos estados <b>no depende del camino</b>: esa es exactamente la definición de función de estado. A esa magnitud la llamó S.'],},
     {p:['Conviene no confundirlo con la primera ley: la conservación de la energía no es el origen de la entropía, es un enunciado independiente. Y la dirección del flujo espontáneo de calor es una consecuencia de la segunda ley, no su punto de partida.']}
   ]}}
  ]},
  {t:'Equilibrio y velocidad son preguntas distintas',b:[
   {p:['Le Chatelier con precisión. La <b>concentración</b> y el <b>volumen</b> desplazan la posición del equilibrio pero no cambian K. La <b>temperatura</b> es la única que cambia el valor de K: trata al calor como reactivo si la reacción es endotérmica y como producto si es exotérmica, de modo que calentar una exotérmica desplaza hacia <b>reactivos</b>.']},
   {ul:['Añadir un gas inerte a volumen constante <b>no desplaza nada</b>: las presiones parciales de las especies reactivas no cambian. Es el distractor clásico.',
        'La presión solo afecta si hay diferencia en moles de gas entre los dos lados.',
        'Un <b>catalizador no desplaza el equilibrio</b>: baja la barrera por igual en ambos sentidos, así que multiplica k directa e inversa por el mismo factor y su cociente K no cambia. Solo llega antes al mismo punto.',
        'Los sólidos y líquidos puros no aparecen en la expresión de K, porque su actividad vale 1.']},
   {p:['El <b>orden de reacción es experimental</b>, no se lee de los coeficientes. Dada 2A + B → C, escribir v = k[A]²[B] solo sería válido si la reacción fuera elemental, algo que debe decir el enunciado. Los órdenes los dicta el paso determinante y pueden ser fraccionarios, cero o negativos. Las unidades de k delatan el orden.']},
   {eq:'ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁)   ·   T en kelvin, obligatoriamente'},
   {p:['Para primer orden, t½ = ln2/k y <b>no depende de la concentración inicial</b>; para segundo orden, t½ = 1/(k[A]₀) y sí depende. Esa es la forma más rápida de distinguirlos a partir de datos.']}
  ]},
  {t:'Superficies, adsorción y coloides',b:[
   {p:['Crear interfase cuesta energía, y de ahí que una gota tienda a la esfera. Dos modelos de adsorción que se confunden: <b>Langmuir</b> supone monocapa sobre sitios equivalentes e independientes y satura; <b>BET</b> permite multicapas y no satura. Para medir área superficial específica de un material mesoporoso con nitrógeno a 77 K la respuesta esperada es <b>BET</b>.']},
   {p:['Langmuir, Michaelis-Menten y la ocupación de receptor son <b>la misma hipérbola de saturación</b> con nombres distintos. Reconocerlo ahorra memorizar tres cosas.']},
   {p:['La curvatura eleva la presión de vapor y la solubilidad (Kelvin, Gibbs-Thomson), y eso explica de un golpe la maduración de Ostwald y el descenso del punto de fusión de las nanopartículas.']},
   {p:['Estabilidad coloidal por DLVO: van der Waals siempre atrae, así que el estado de mínima energía es el agregado y una suspensión estable es un logro, no un estado natural. La barrera se controla subiendo la carga superficial (lejos del punto isoeléctrico) o bajando la fuerza iónica. <b>Añadir sal comprime la doble capa</b> y baja la barrera: por eso las suspensiones fallan en medio fisiológico, con unos 150 mM. El criterio práctico sitúa la estabilidad razonable más allá de ±30 mV de potencial zeta.']},
   {p:['Mojado: <b>Wenzel</b> describe el líquido que penetra la textura; <b>Cassie-Baxter</b> el que atrapa aire debajo, y es este el que da superhidrofobicidad real.']}
  ]}
 ],
 flash:[
  ['¿Por qué el yodo es sólido si solo tiene fuerzas de London?','Tiene 106 electrones: su polarizabilidad es enorme y la suma de interacciones débiles supera a los puentes de hidrógeno del HF, que es gas.'],
  ['ΔH positivo y ΔS positivo: ¿cuándo es espontáneo?','Solo a temperatura suficientemente alta, porque el término TΔS crece con T hasta superar a ΔH. T de cruce = ΔH/ΔS.'],
  ['ΔG° negativo pero el sistema va hacia reactivos: ¿contradicción?','No. ΔG° es estándar; el sentido real lo fija ΔG = ΔG° + RT·lnQ. Con mucho producto inicial, Q grande puede volver ΔG positivo.'],
  ['¿Qué perturbación cambia el VALOR de K?','Solo la temperatura, vía ΔG° = −RT·lnK. Concentración, volumen y catalizador desplazan la posición pero no K.'],
  ['¿Por qué un catalizador no cambia K?','Baja la barrera lo mismo en los dos sentidos: multiplica k directa e inversa por el mismo factor, y K = k_dir/k_inv no cambia.'],
  ['Gas inerte añadido a volumen constante','No desplaza el equilibrio: las presiones parciales de las especies reactivas no cambian. Es el distractor clásico.'],
  ['¿Se puede leer el orden de reacción de los coeficientes?','No, salvo que el enunciado diga que la reacción es elemental. El orden es empírico y lo dicta el paso determinante.'],
  ['Vida media: primer orden frente a segundo','Primer orden: t½ = ln2/k, independiente de [A]₀. Segundo orden: t½ = 1/(k[A]₀), sí depende.'],
  ['¿Langmuir o BET para área superficial de un mesoporoso?','BET. Permite multicapas, que es lo que realmente ocurre con N₂ a 77 K, y del ajuste se extrae la monocapa.'],
  ['¿Por qué añadir sal coagula un coloide?','Comprime la doble capa eléctrica, acorta el alcance de la repulsión y baja la barrera DLVO por debajo de kT.'],

 ]}

{id:'M6',nom:'Síntesis de materiales y nanomateriales',sesion:'Sesión 8 del taller',

     ['Confinamiento cuántico','Radio de Bohr del excitón (2–20 nm según material)','Gap que crece al reducir el tamaño. Solo semiconductores'],
     ['Propiedades colectivas','Tamaño crítico del fenómeno','Superparamagnetismo (monodominio), plasmón (metales)']]}},
   {eq:'S/V = 6/d (esfera o cubo)   ·   fracción superficial ≈ 3δ/R'},
   {p:['Una partícula de 5 nm tiene alrededor del 30 % de sus átomos en la superficie; una de 50 nm, un 3 %. La fracción escala como 1/R, así que al dividir el diámetro entre diez se multiplica por diez.']},
   {p:['Dirección del confinamiento: <b>menor tamaño ⇒ mayor gap ⇒ emisión más azul</b>. Los distractores siempre invierten esto. Y ojo con atribuir todo a la cuántica: el oro de 20 nm es rojo por <b>plasmón</b>, que es electromagnetismo clásico, no por confinamiento, porque un metal no tiene gap que confinar.']},
   {deep:{t:'Por qué el oro coloidal es rojo y no dorado',b:[

     {p:['Para oro esférico de unos 20 nm en agua la resonancia cae cerca de 520 nm, que es verde. La suspensión absorbe el verde y transmite su complementario: rojo rubí.'],},
     {ul:['Aumentar el tamaño desplaza la resonancia al <b>rojo</b>.',

  ]},
  {t:'Nucleación, crecimiento y forma',b:[
   {p:['La barrera de nucleación existe por una competencia de potencias: el volumen libera energía como r³ y la superficie la consume como r². A radios pequeños domina el término de área y la energía sube; a radios grandes domina el de volumen y baja. El máximo es la barrera.']},
   {eq:'r* = 2γ/ΔGv      ΔG* = 16πγ³/(3ΔGv²)'},
   {p:['Por debajo de r* un núcleo reduce su energía <b>disolviéndose</b>; por encima, creciendo. Más sobresaturación implica r* menor y barrera mucho menor (va con el inverso del cuadrado), de ahí que nuclee masivamente y dé partículas pequeñas.']},
   {p:['El modelo de <b>LaMer</b> dice que la monodispersidad no se logra controlando el crecimiento, sino <b>separándolo en el tiempo de la nucleación</b>: una nucleación explosiva que se autodetiene al consumir el monómero, y después solo crecimiento. De ahí la inyección caliente y el crecimiento sobre semillas.']},
   {p:['<b>Ostwald no es agregación</b>. La maduración transporta material disuelto desde las partículas pequeñas (más solubles por curvatura) hacia las grandes, sin que lleguen a tocarse; se combate bajando temperatura o solubilidad, no con estabilizantes. La agregación es por contacto y choque browniano; esa sí se combate estabilizando.']},
   {p:['Para controlar la <b>forma</b> hay que controlar la velocidad relativa de crecimiento de las caras, y la regla es contraintuitiva: una cara que crece rápido <b>desaparece</b> de la morfología final, porque el material se deposita hasta cerrarla. Las que sobreviven son las lentas. Por eso un agente director que se adsorbe selectivamente sobre una familia de caras la pasiva y la hace dominar: el CTAB da nanovarillas de oro y la PVP da nanocubos de plata.']}
  ]},
  {t:'Rutas químicas: qué controla cada una',b:[
   {tabla:{th:['Ruta','Fuerte en','Debilidad'],tr:[
     ['Reducción en disolución','Control fino de tamaño y forma en metales nobles','No sirve para óxidos ni alta temperatura'],
     ['Sol-gel','Homogeneidad molecular, recubrimientos y monolitos porosos','Producto <b>amorfo</b>: exige calcinar, lo que sinteriza y destruye área'],
     ['Hidrotermal / solvotermal','Cristalinidad <b>sin calcinar</b>, control de fase y morfología','Equipo a presión, tiempos largos'],
     ['Coprecipitación','Simple, barata, escalable','Distribución de tamaños ancha'],
     ['Microemulsión','Nanorreactores que limitan el tamaño','Rendimiento bajo, mucho surfactante que eliminar']]}},
   {p:['El TiO₂ ilustra el costo de calcinar: por encima de unos 600 °C transita de anatasa a <b>rutilo</b>, menos activo fotocatalíticamente, y además crece el grano y cae el área superficial. Dos efectos que bajan la actividad a la vez.']},
   {p:['El estabilizante no es un detalle de formulación: decide si la suspensión sobrevive. La <b>electrostática</b> falla a alta fuerza iónica porque la sal apantalla; la <b>estérica</b>, con cadenas poliméricas ancladas, funciona igual en medio fisiológico y por eso es la estrategia estándar para uso biológico.']},
   {p:['En arquitecturas, el <b>core-shell</b> pasiva trampas superficiales y sube el rendimiento cuántico de un punto cuántico: es la razón de ser de la coraza, no una mejora cosmética.']}
  ]},
  {t:'Rutas físicas y el límite litográfico',b:[
   {p:['Dos filosofías. <b>Descendente</b> (litografía, grabado, FIB) da control posicional —sabes dónde queda cada estructura, imprescindible en circuitos— y su límite es la resolución y el desperdicio. <b>Ascendente</b> (síntesis coloidal, autoensamblado, ALD) alcanza dimensiones menores con mejor calidad cristalina, y su límite es que no decide <b>dónde</b>. La industria las combina: litografía define dónde, depósito construye qué.']},
   {eq:'CD = k₁·λ / NA   ·   las tres únicas palancas de la litografía'},
   {ul:['Reducir <b>λ</b>: de 436 a 365, a 248 (KrF), a 193 (ArF), y el salto a 13.5 nm en EUV, que exige óptica reflectiva en vacío.',
        'Aumentar <b>NA</b>: con aire n = 1 acota el valor; la inmersión en agua (n = 1.44) lleva la NA efectiva por encima de 1.3. Esa fue la palanca que prolongó la vida de los 193 nm.',
        'Reducir <b>k₁</b>: máscaras de desplazamiento de fase, iluminación fuera de eje, corrección de proximidad, patrones múltiples. Su límite físico ronda 0.25.']},
   {p:['Depósito: el <b>sputtering</b> es línea de vista y tapa poros; el <b>ALD</b> pulsa precursores alternadamente con purgas, cada pulso satura la superficie y el crecimiento es autolimitado, de una capa por ciclo. Es lentísimo y a cambio da una conformidad sobre geometrías complejas que nada iguala.']},
   {p:['Grabado: el <b>húmedo</b> suele ser isotrópico y socava bajo la máscara, limitando la resolución a unas dos veces la profundidad. El <b>seco por plasma</b> con iones acelerados da paredes verticales y alta relación de aspecto. Caso intermedio que se pregunta: KOH sobre silicio {100} es anisotrópico <b>cristalográficamente</b>, no direccionalmente, y produce paredes a 54.7°.']},
   {p:['Y la regla de producción: escribe el maestro con la técnica de mayor resolución y <b>replica</b> con la más barata (litografía suave, micromoldeado, LIGA). Nunca produzcas en serie con la técnica cara.']}
  ]}
 ],

  ['Relación superficie-volumen de una esfera','S/V = 6/d. La fracción de átomos superficiales escala como 1/R: una partícula de 5 nm tiene ~30 % en superficie.'],

  ['¿Por qué el oro de 20 nm es rojo?','Resonancia de plasmón superficial cerca de 520 nm: absorbe verde y transmite el rojo complementario. Es electromagnetismo clásico, no confinamiento.'],
  ['Una suspensión de oro vira de rojo a azul: ¿qué pasa?','Está agregando. El acoplamiento entre plasmones desplaza la banda al rojo y el color percibido vira a azul o violeta.'],
  ['Radio crítico y qué ocurre por debajo','r* = 2γ/ΔGv. Por debajo de r* el núcleo se disuelve, porque a ese tamaño el término de superficie domina.'],

{id:'M7',nom:'Caracterización de materiales',sesion:'Sesión 7 del taller',
 sub:'Una sonda para cada pregunta: difracción, microscopía, espectroscopía y análisis térmico. El reactivo más frecuente del módulo es «dada esta muestra y este objetivo, qué técnica eliges».',
 sec:[
  {t:'El árbol de decisión: organiza por pregunta, no por técnica',b:[
   {tabla:{th:['Lo que quieres saber','Técnica','Advertencia'],tr:[
     ['Qué fases cristalinas hay','DRX','Ciega al material amorfo; no da composición elemental'],
     ['Qué elementos, en disolución','AAS (uno) / ICP-OES o ICP-MS (multielemental, trazas)','—'],

     ['Forma y tamaño, morfología externa','SEM','Vacío, muestra conductora, no ve el interior'],
     ['Estructura interna, menos de 10 nm','TEM','Muestra ultradelgada, preparación laboriosa, daño por haz'],

     ['Área superficial accesible','BET con N₂ a 77 K','—'],
     ['Comportamiento térmico','TGA (masa) / DSC (energía)','Solo DSC ve la Tg']]}},
   {p:['Y la regla que cierra el módulo: <b>ninguna técnica sola caracteriza un material</b>. Un trabajo serio combina al menos difracción, microscopía y una espectroscopía, porque cada una tiene un punto ciego que otra cubre. La secuencia lógica es no destructivo antes que destructivo, y estructural antes que cuantificación fina.']}
  ]},
  {t:'Difracción: tres medidas, tres informaciones',b:[
   {eq:'nλ = 2d·sen θ      ·      D = Kλ / (β·cos θ)'},

   {tabla:{th:['Qué mides en el difractograma','Qué te dice'],tr:[

   {p:['Dos advertencias sobre Scherrer. β debe ser el ensanchamiento <b>de la muestra</b>: hay que restar la contribución instrumental medida con un estándar de cristalitos grandes. Y la <b>microdeformación también ensancha</b>, sin distinguirse con un solo pico: para separarlas está Williamson-Hall, que aprovecha que ambas dependen distinto del ángulo.']},
   {p:['Cristalito no es partícula: una partícula policristalina de 60 nm puede estar hecha de dominios coherentes de 12 nm, y la difracción solo ve el dominio. Es una de las confusiones más preguntadas.']},
   {p:['Indexar en sistema cúbico: la razón de 1/d² da los valores de h²+k²+l². La secuencia 3, 4, 8, 11 identifica <b>FCC</b> (índices todos pares o todos impares); 2, 4, 6, 8 identifica <b>BCC</b> (h+k+l par).']}
  ]},
  {t:'Microscopía: qué limita a cada una',b:[
   {p:['Los electrones ven más porque su longitud de onda de de Broglie es miles de veces menor que la de la luz visible, y el límite de resolución escala con λ.']},
   {ul:['<b>SEM</b>: electrones secundarios dan topografía con gran profundidad de campo; retrodispersados dan contraste por número atómico (lo pesado se ve más brillante).',

        '<b>AFM</b>: mide fuerzas con una punta en micropalanca. Funciona en aire y en líquido, sin vacío ni metalización, y da resolución vertical subnanométrica.']},

   {p:['Y la discrepancia que más confunde: <b>DLS da un valor mayor que TEM</b> y las dos son correctas. TEM mide el núcleo sólido seco y da distribución en número; DLS mide el diámetro hidrodinámico, que incluye recubrimiento y solvatación, y su distribución en intensidad escala con la sexta potencia del diámetro, así que un solo agregado pesa como un millón de partículas pequeñas. Una razón de 1.2 a 2 veces es normal; mucho más sugiere agregación real en suspensión.']}
  ]},
  {t:'Espectroscopía y análisis térmico',b:[
   {tabla:{th:['','FTIR','Raman'],tr:[
     ['Fenómeno','Absorción','Dispersión inelástica'],
     ['Regla de selección','Cambio de <b>momento dipolar</b>','Cambio de <b>polarizabilidad</b>'],
     ['Brilla en','Enlaces polares: C=O, O–H, C≡N','Enlaces simétricos no polares, S–S, modos de red'],
     ['En agua','Saturado por el disolvente','Agua dispersa poco: técnica de elección']]}},
   {p:['En moléculas con centro de simetría vale la <b>regla de exclusión mutua</b>: un modo activo en IR no puede serlo en Raman. En CO₂ la tensión simétrica es Raman-activa e IR-inactiva, y la asimétrica al revés.']},
   {p:['El Raman es extraordinariamente débil, del orden de un fotón inelástico por cada diez millones, y de ahí la importancia de <b>SERS</b>, donde una superficie metálica nanoestructurada amplifica el campo local. El factor escala aproximadamente como la <b>cuarta potencia</b> del refuerzo de campo, porque la amplificación entra dos veces: en la excitación y en la reemisión. Por eso los puntos calientes dominan la señal.']},
   {p:['Térmico: <b>TGA mide masa, DSC mide energía</b>. Una Tg, una fusión o una transición polimórfica no cambian la masa y son invisibles en TGA. En una nanopartícula recubierta leída en aire, la pérdida por debajo de 120 °C es agua fisisorbida y la de 200 a 400 °C es el recubrimiento orgánico; el residuo por encima de 450 °C es el inorgánico.']},
   {deep:{t:'Leer una curva de TGA de una nanopartícula funcionalizada',b:[
     {p:['Caso típico: óxido de hierro recubierto con ácido oleico, analizado en aire de 25 a 800 °C. La curva muestra tres zonas y cada una se interpreta distinto.'],},
     {tabla:{th:['Intervalo','Pérdida','Qué es'],tr:[
       ['25–120 °C','~2 %','Agua fisisorbida y disolvente residual. <b>No</b> cuenta como recubrimiento'],
       ['200–400 °C','~14 %','Descomposición oxidativa del recubrimiento orgánico. Este es el dato que interesa'],
       ['> 450 °C','Meseta','Residuo inorgánico estable']]}},
     {p:['Con el área superficial por BET y la masa molar del ligando se estima la densidad de injerto en moléculas por nanómetro cuadrado, que indica si el recubrimiento es monocapa o multicapa desordenada.'],},
     {p:['Dos advertencias. La <b>atmósfera importa</b>: en aire la parte orgánica se oxida y desaparece, mientras que en nitrógeno se pirolisa y deja residuo carbonoso, lo que subestimaría el recubrimiento. Y si el inorgánico puede oxidarse (magnetita a maghemita o hematita), en aire habrá una ganancia de masa superpuesta a la pérdida orgánica que falsea el cálculo: en esos casos se trabaja en inerte y se corrige por el residuo.']}
   ]}},
   {p:['Límites de EDS que conviene declarar: detecta mal los elementos ligeros, su volumen de interacción es de micras (así que al analizar una nanopartícula sobre un sustrato buena parte de la señal viene del sustrato), es semicuantitativo con LOD de 0.1 a 1 % en masa, y <b>no distingue estados de oxidación</b> porque sus rayos X vienen de transiciones internas. Para eso, XPS. EELS, en cambio, destaca justo en los ligeros: son complementarios.']}

 ],

  ['En la ley de Bragg, ¿qué ángulo se usa?','θ, que es la MITAD del 2θ que reporta el difractómetro. Es el error más frecuente del módulo.'],

<script>
G.push(

{id:'M8',nom:'Nanodispositivos y nanosistemas',sesion:'Sesión 9 del taller',
 sub:'Luz y materia, microfluídica, MEMS y sensores electroquímicos. Integra materiales de M4, nanoestructuras de M6 y métodos de medición de M7.',

  {t:'Luz y materia: del oscilador al plasmón',b:[
   {p:['La función dieléctrica sale de tratar a los electrones como <b>osciladores forzados</b> por el campo de la luz: el modelo de Lorentz para electrones ligados y el de Drude para los libres de un metal.']},
   {p:['De ahí la explicación del brillo metálico: por debajo de la frecuencia de plasma ω_p la parte real de ε es <b>negativa</b> y el metal refleja; por encima se vuelve transparente. Es la razón de que los metales sean espejos en el visible y transparentes en el ultravioleta lejano.']},
   {p:['En interfaces, las ecuaciones de Fresnel dan reflexión y transmisión, y por encima del ángulo crítico hay reflexión total interna. Lo que sobrevive del otro lado es una <b>onda evanescente</b> que penetra típicamente 100 a 200 nm: por eso los sensores de superficie ignoran el resto de la muestra, lo que es exactamente la ventaja que se busca.']},
   {p:['Un LED, una celda solar y un fotodetector son el mismo objeto en sentidos distintos: una unión p-n cuyo campo de agotamiento separa o recombina pares electrón-hueco. El color de un LED lo fija el gap vía λ = 1240/Eg, y de ahí que el LED azul necesitara nitruro de galio.']},
   {deep:{t:'Directo contra indirecto, y el límite de Shockley-Queisser',b:[
     {p:['En un semiconductor de gap <b>directo</b> (GaAs) el mínimo de conducción y el máximo de valencia coinciden en el mismo vector de onda, y la recombinación radiativa es eficiente. En uno <b>indirecto</b> (Si) no coinciden, y la transición necesita además un fonón: un proceso de tres cuerpos, mucho menos probable que la recombinación no radiativa.'],},
     {p:['Esa es la razón de que el silicio domine la electrónica y sea un emisor pésimo, y de que los LED no se hagan de silicio.'],},
     {p:['En celdas solares aparece el compromiso central: un gap pequeño absorbe más fotones pero cada uno entrega poco voltaje, y uno grande da voltaje y desaprovecha el espectro. Optimizarlo contra el espectro solar da el límite de Shockley-Queisser, con un óptimo cerca de 1.3 eV y un techo próximo al 33 % para una sola unión. Las multiunión lo superan porque reparten el espectro.']}
   ]}}
  ]},
  {t:'Microfluídica: el mundo sin turbulencia',b:[
   {p:['Las fuerzas inerciales escalan con L³ y las viscosas con L²: al reducir el tamaño las viscosas ganan. En un canal de 100 µm con agua, Re está entre 0.01 y 10, muy por debajo del umbral de turbulencia.']},
   {eq:'Re = ρvL/µ      Pe = vL/D      Q = πΔP·r⁴/(8µL)'},
   {ul:['<b>Laminar siempre</b>: dos corrientes viajan lado a lado y solo se mezclan por difusión. Agitar no mezcla: hay que diseñar geometría (canales serpenteantes con surcos) o trabajar en gotas.',
        '<b>La tiranía de r⁴</b>: reducir el radio a la mitad divide el caudal entre dieciséis. Por eso una obstrucción parcial cambia tanto el caudal, y el canal más estrecho domina la resistencia de toda la red.',
        '<b>La difusión se vuelve rápida</b> en términos relativos: t ≈ L²/D, así que recorrer 100 µm toma segundos frente a horas en un centímetro. De ahí que los ensayos en chip sean rápidos: desaparece la espera por transporte de masa.',
        'La relación superficie-volumen enorme hace que la <b>adsorción de proteínas en las paredes</b> deje de ser despreciable, y obliga a pasivar.']},
   {p:['La analogía con circuitos es formal y útil: R = 8µL/(πr⁴) y ΔP = QR, con presión como voltaje y caudal como corriente. Resistencias en serie se suman.']},
   {p:['Dos fenómenos que se confunden. La <b>electroforesis</b> mueve una partícula cargada respecto al fluido y separa según carga y tamaño. La <b>electroósmosis</b> mueve el fluido completo respecto a la pared, porque la pared cargada atrae contraiones que al migrar arrastran el líquido por viscosidad. Su perfil de velocidad es <b>plano</b>, en tapón, mientras que el de presión es parabólico: esa diferencia es la que evita el ensanchamiento de bandas y decide la resolución de una separación. En un mismo experimento ocurren los dos y se observa la suma.']}
  ]},
  {t:'MEMS: leyes de escala',b:[
   {p:['Todo el comportamiento peculiar sale de que distintas magnitudes escalan con distintas potencias de L, y al reducir el tamaño su importancia relativa se reordena. Ante un reactivo de escalamiento: identifica el exponente de cada efecto y compara; <b>el de menor exponente gana</b> al miniaturizar.']},
   {tabla:{th:['Magnitud','Escala como','Consecuencia al miniaturizar'],tr:[
     ['Peso e inercia','L³','Dejan de importar'],
     ['Fuerzas de superficie','L a L²','Dominan: adhesión, tensión superficial'],
     ['Frecuencia de resonancia','1/L','Sube: de MHz a GHz'],
     ['Fuerza electrostática','Muy favorable','Campos intensos con voltajes modestos']]}},
   {p:['De ahí el <b>stiction</b>, el modo de falla característico: al evaporarse el líquido de un proceso húmedo, la tensión superficial arrastra la micropalanca contra el sustrato y la deja pegada. La solución estándar es el secado supercrítico, que evita la interfase líquido-vapor.']},
   {eq:'Δf/f₀ ≈ −Δm/(2m)   ·   sensado gravimétrico'},
   {p:['El signo importa y se pregunta: <b>adsorber masa BAJA la frecuencia</b>. Y conviene no confundir sensibilidad con límite de detección: más sensibilidad acompañada de más ruido no mejora el LOD. Por eso miniaturizar no siempre mejora un sensor: suben el ancho de banda y la relación superficie-volumen, pero también el ruido térmico browniano, que crece al reducir la masa.']},
   {p:['En un acelerómetro capacitivo el compromiso es directo: resortes más blandos dan más desplazamiento y más sensibilidad (x = ma/k), pero bajan ω = √(k/m) y con ella el ancho de banda y la robustez frente a golpes.']}
  ]},
  {t:'Sensores electroquímicos',b:[
   {p:['Dos técnicas que responden preguntas distintas. La <b>voltamperometría cíclica</b> barre el potencial y sirve para <b>caracterizar</b>: a qué potencial ocurre cada proceso, si es reversible (separación de picos ≈ 59/n mV a temperatura ambiente), área electroactiva. La <b>cronoamperometría</b> fija el potencial y lee corriente contra tiempo: sirve para <b>cuantificar</b>, y es lo que hace un glucómetro comercial.']},
   {eq:'i_p = 2.69×10⁵ · n^{3/2} · A · D^{1/2} · v^{1/2} · C   (Randles-Ševčík)'},
   {ul:['Las unidades son la trampa: C va en <b>mol·cm⁻³</b>, así que 1 mM = 1×10⁻⁶ mol·cm⁻³.',
        'Diagnóstico muy usado: si i_p es proporcional a <b>√v</b>, la especie difunde; si es proporcional a <b>v</b>, está <b>adsorbida</b> en el electrodo.']},
   {p:['Anatomía de un biosensor de glucosa, por capas. La <b>enzima</b> (glucosa oxidasa) da selectividad. El <b>transductor</b> convierte el evento en corriente, y ahí está la evolución generacional: la primera depende del oxígeno local (variable e incontrolado), la segunda introduce un <b>mediador redox</b> que lo vuelve independiente del oxígeno (es la de las tiras comerciales), y la tercera busca transferencia directa, donde los nanotubos y las nanopartículas acortan la distancia hasta el centro redox enterrado en la proteína, porque la velocidad de transferencia decae exponencialmente con la distancia.']},
   {p:['Celda de <b>tres electrodos</b>: el de referencia fija un potencial estable sin pasar corriente y el contraelectrodo cierra el circuito. Con solo dos, el de referencia se polariza y su potencial deriva.']},
   {p:['El <b>rango lineal termina cuando la concentración se acerca a Km</b>, porque la enzima empieza a saturarse. Y la estabilidad operativa es el punto débil de cualquier sensor enzimático: la proteína se desnaturaliza.']}
  ]}

 flash:[

  ['¿Por qué un metal refleja en el visible?','Por debajo de la frecuencia de plasma la parte real de ε es negativa. Por encima de ω_p el metal se vuelve transparente.'],
  ['Caudal al reducir el radio a la mitad','Se divide entre 16. Hagen-Poiseuille: Q ∝ r⁴. Por eso el canal más estrecho domina la resistencia de la red.'],
  ['Perfil del flujo electroosmótico frente al de presión','Electroosmótico: plano, en tapón. De presión: parabólico. El plano evita ensanchar bandas en una separación.'],
  ['¿Por qué los ensayos en microchip son rápidos?','t ≈ L²/D. Reducir la distancia dos órdenes reduce el tiempo cuatro. Desaparece la espera por transporte de masa.'],

{id:'M9',nom:'Escalamiento, diseño ingenieril e investigación',sesion:'Sesión 6 del taller',
 sub:'Por qué lo que funciona en 50 mL falla en 5 L, diseño experimental e inferencia, ingeniería económica, balances y elección de reactor.',
 sec:[
  {t:'Escalar es elegir qué conservar',b:[
   {p:['El resultado central es negativo y por eso resulta contraintuitivo: <b>no existe un factor de escala que conserve a la vez todas las magnitudes relevantes</b>. El problema no es hacer más, es hacer igual.']},
   {p:['La razón es geométrica. Si multiplicas la dimensión lineal por k, el volumen va por k³ y el área de transferencia de calor por k². La razón área-volumen se divide entre k, así que un reactor diez veces mayor en dimensión lineal tiene mil veces más volumen y solo cien veces más superficie para disipar el calor que ese volumen genera. De ahí el modo de fallo más citado: una reacción exotérmica dócil en un matraz se vuelve peligrosa en un reactor de 500 L sin que la química haya cambiado.']},
   {eq:'P = Np·ρ·N³·D⁵   ⇒   conservar P/V exige   N ∝ D^(−2/3)'},
   {ul:['Si conservas <b>P/V</b> (el criterio habitual), la velocidad de rotación <b>baja</b> y la velocidad de punta πND <b>sube</b> como D^(1/3). Los criterios son incompatibles: hay que elegir cuál gobierna.',
        'Conservar las <b>rpm</b> multiplicaría la potencia específica por k², mecánicamente inviable.',
        'En células o cristales frágiles se conserva la <b>velocidad de punta</b> y se sacrifica mezclado.',
        'El <b>tiempo de mezclado crece</b> al escalar bajo P/V constante, y si se vuelve comparable al tiempo de reacción aparecen gradientes locales que cambian la selectividad: eso es el número de Damköhler, y explica que una receta de laboratorio rinda peor en planta.']},
   {p:['Caso específico de nanopartículas: el tiempo de mezclado creciente <b>rompe la nucleación instantánea</b> que exige LaMer, y la distribución de tamaños se ensancha. De ahí que el <b>flujo continuo</b> sea un cambio de paradigma: escala por tiempo de operación y no por volumen, así que preserva la reproducibilidad en lugar de pelear contra ella.']}
  ]},
  {t:'Diseño experimental e inferencia',b:[
   {p:['Variar una variable a la vez es intuitivo e inferior. La razón decisiva <b>no es el ahorro de corridas sino las interacciones</b>: una interacción existe cuando el efecto de un factor depende del nivel de otro, y el método de una variable a la vez es estructuralmente incapaz de detectarla porque explora los ejes y no el interior del espacio. Peor aún, puede converger a un óptimo local y declararlo global. En síntesis de nanomateriales las interacciones son la norma.']},
   {ul:['<b>Aleatorización</b> del orden: protege contra derivas en el tiempo (reactivo que envejece, temperatura del laboratorio) que de otro modo se confundirían con el efecto estudiado.',
        '<b>Replicación</b>: sin estimación del error experimental no se puede decidir si un efecto es real.',
        '<b>Bloqueo</b>: agrupa corridas que comparten una condición ajena, como un lote de material, para que su variabilidad no contamine.',
        'Con muchos factores se usan diseños <b>fraccionados</b>, que sacrifican distinguir algunas interacciones a cambio de muchas menos corridas. Son la herramienta estándar de cribado.']},
   {p:['Sobre el valor p: indica que el resultado sería improbable si no hubiera efecto alguno. <b>No</b> mide el tamaño del efecto, <b>no</b> es la probabilidad de que tu hipótesis sea cierta, y con muestras grandes diferencias minúsculas resultan significativas. Al revés, un resultado no significativo con n pequeña suele ser un resultado sin información, no una prueba de ausencia. Hay que reportar magnitud del efecto con su intervalo de confianza.']},
   {deep:{t:'Propagación: dónde invertir el dinero',b:[
     {ul:['Sumas y restas: se combinan las incertidumbres <b>absolutas</b> en cuadratura.',
          'Productos y cocientes: las <b>relativas</b> en cuadratura.',
          'Potencias: la relativa se <b>multiplica por el exponente</b>. Un radio con 4 % de incertidumbre da un volumen con 12 %.']},
     {p:['La lección práctica sale de la suma en cuadratura: si una contribución es mucho mayor que las demás, domina. Con una del 10 % y otra del 2 %, la combinada es 10.2 %. Mejorar la del 2 % al 1 % no cambia nada; mejorar la del 10 % al 5 % reduce el total a la mitad.'],},
     {p:['De ahí la regla de asignación de esfuerzo: identifica la mayor fuente de incertidumbre y trabaja sobre ella. Comprar un instrumento más preciso para la variable que ya medías bien es dinero desperdiciado, y es exactamente el tipo de decisión que plantea un reactivo de caso.']}
   ]}}
  ]},
  {t:'Ingeniería económica y factibilidad',b:[
   {p:['Apareció en once preguntas de los quizzes del taller, así que conviene no dejarlo fuera. La idea de fondo es que <b>el dinero tiene valor en el tiempo</b>: mil pesos hoy no equivalen a mil pesos dentro de tres años, porque los de hoy pueden invertirse.']},
   {eq:'Valor futuro: VF = VP·(1 + i)ⁿ      ·      interés simple: VF = VP·(1 + i·n)'},
   {p:['La diferencia entre ambos es que el <b>interés compuesto capitaliza sobre el saldo acumulado</b> y el simple solo sobre el capital inicial. Casi toda la evaluación de proyectos usa el compuesto, y confundirlos es un distractor habitual.']},
   {tabla:{th:['Criterio','Qué mide','Regla de decisión'],tr:[
     ['<b>VPN</b> (valor presente neto)','Suma de flujos descontados menos la inversión','Aceptar si VPN > 0 a la tasa de descuento de la empresa'],
     ['<b>TIR</b> (tasa interna de retorno)','Tasa que hace el VPN igual a cero','Aceptar si TIR supera el costo de capital. No basta con que sea positiva'],
     ['<b>Periodo de recuperación</b>','Tiempo hasta recuperar la inversión','Útil como filtro rápido; ignora el valor del dinero en el tiempo']]}},
   {p:['El VPN es el criterio de referencia porque incorpora tanto la magnitud como el momento de los flujos. La TIR puede dar resultados ambiguos con flujos que cambian de signo varias veces.']},
   {deep:{t:'Escalar costos: índices y la regla de los seis décimos',b:[
     {p:['Dos herramientas distintas que suelen confundirse, y las dos aparecieron en el taller.'],},
     {p:['<b>Índice de costos.</b> Traslada el costo de un equipo de un año a otro sin volver a cotizar: C_hoy = C_antes × (índice_hoy / índice_antes). El más usado en proceso es el CEPCI. Si un equipo costó 2 millones con índice 400 y hoy el índice vale 600, el costo actualizado es 3 millones.'],},
     {eq:'C₂ = C₁ · (Q₂/Q₁)^n     con n ≈ 0.6 para muchos equipos de proceso'},
     {p:['<b>Regla de los seis décimos.</b> Escala el costo con la capacidad, no con el tiempo. Como el exponente es menor que uno, multiplicar por seis la capacidad multiplica el costo solo por 6^0.6 ≈ 2.9. Esa es la economía de escala: el costo por unidad producida baja al crecer el equipo, y es el argumento económico que sostiene buena parte del escalamiento industrial.'],},
     {p:['Ojo con el orden: si hay que escalar <b>y</b> actualizar, se aplican los dos factores, cada uno con su propia base.']}
   ]}},
   {p:['El <b>análisis de factibilidad</b> de un proyecto tiene cuatro frentes y conviene nombrarlos por separado: técnico (¿se puede construir y operar?), de mercado (¿hay quien lo compre y a qué precio?), medioambiental (¿qué impactos y qué permisos?) y financiero (¿los números cierran?).']},
   {p:['Y la distinción que cierra el módulo: <b>factible</b> responde «se puede»; <b>viable</b> responde «conviene». Un proceso puede ser perfectamente factible y no viable si su costo por unidad supera al de la alternativa sin resolver nada que la alternativa no resuelva.']}
  ]},
  {t:'Balances, reactores y madurez',b:[
   {eq:'Entrada − Salida + Generación − Consumo = Acumulación'},
   {p:['Todo lo demás son casos particulares. En <b>estado estacionario</b> la acumulación es cero; <b>sin reacción</b>, generación y consumo son cero y queda entrada = salida (operaciones de separación); en <b>lotes</b> no hay entrada ni salida y queda generación − consumo = acumulación.']},
   {p:['El procedimiento es siempre el mismo: diagrama de flujo con corrientes rotuladas, volumen de control explícito, <b>base de cálculo</b> elegida (100 kg de alimentación, una hora de operación), balance global más balances por componente, y conteo de ecuaciones contra incógnitas.']},
   {p:['Con <b>recirculación</b> hay que distinguir conversión por paso de conversión global, y es el error clásico: si todo el reactivo no convertido regresa, la conversión global es del 100 % aunque la de paso sea del 30 %. El precio es un caudal de recirculación grande. Y hace falta una <b>purga</b> si entran inertes, porque de lo contrario se acumulan sin límite.']},
   {tabla:{th:['Reactor','Concentración','Cuándo conviene'],tr:[
     ['Lotes','Uniforme en espacio, cambia en el tiempo','Flexibilidad, muchos productos, volúmenes pequeños. Farmacéutica y química fina'],
     ['CSTR','Igual en todo el volumen que a la salida: la más baja','Autocatalíticas o con inhibición por sustrato'],
     ['PFR','Gradiente a lo largo del tubo','Para <b>orden positivo</b>, menos volumen que el CSTR a igual conversión']]}},
   {p:['Un PFR es equivalente a un reactor por lotes donde el tiempo se sustituye por la posición. Y varios CSTR en serie aproximan a un PFR: cuantos más tanques, más se parece.']},
   {p:['La escala <b>TRL</b> mide grado de demostración y entorno, no calidad: 4 es validación en laboratorio y 9 es sistema probado en operación real. El tramo del 4 al 6 es el valle de la muerte, donde aparecen escalamiento, reproducibilidad entre lotes, estabilidad y costo, y donde mueren la mayoría de los desarrollos.']},
   {p:['Y la <b>analogía calor-masa</b> permite traducir correlaciones entre fenómenos: Nu ↔ Sh y Pr ↔ Sc. Es la razón de que la misma correlación sirva para transferencia de calor y de masa cambiando los números adimensionales.']}
  ]}

 flash:[
  ['Interés compuesto frente a interés simple','Compuesto: VF = VP(1+i)ⁿ, capitaliza sobre el saldo. Simple: VF = VP(1+i·n), solo sobre el capital inicial.'],
  ['Actualizar el costo de un equipo con un índice de costos','C_hoy = C_antes × (índice_hoy / índice_antes). Traslada costos entre años sin volver a cotizar; el más usado es el CEPCI.'],
  ['Regla de los seis décimos','C₂ = C₁(Q₂/Q₁)^0.6. Multiplicar la capacidad por seis multiplica el costo solo por 2.9: es la economía de escala.'],
  ['VPN negativo a la tasa de descuento de la empresa: ¿qué decides?','Rechazar. El proyecto no cubre el costo de oportunidad del capital. Que la TIR sea positiva no basta: debe superar esa tasa.'],
  ['Los cuatro frentes del análisis de factibilidad','Técnica, de mercado, medioambiental y financiera. Responden preguntas distintas y ninguna sustituye a otra.'],
  ['¿Por qué una exotérmica controlable en 50 mL es peligrosa en 500 L?','El volumen crece con k³ y el área de disipación con k². La capacidad relativa de extraer calor cae linealmente con la escala.'],
  ['Al escalar conservando P/V, ¿qué pasa con las rpm?','Bajan: N ∝ D^(−2/3). Conservar las rpm multiplicaría la potencia específica por k², inviable.'],
  ['Al conservar P/V, ¿qué pasa con la velocidad de punta?','SUBE, como D^(1/3). Por eso los criterios son incompatibles y hay que elegir cuál gobierna el proceso.'],
  ['¿Por qué escalar arruina la monodispersidad?','El tiempo de mezclado crece y rompe la nucleación instantánea que exige LaMer. El flujo continuo lo evita escalando por tiempo.'],
  ['El argumento decisivo a favor del diseño factorial','Las interacciones: el método de una variable a la vez no puede detectarlas porque solo explora los ejes del espacio experimental.'],
  ['¿Para qué sirve aleatorizar el orden de las corridas?','Para que una deriva temporal (reactivo que envejece, temperatura) no se confunda con el efecto del factor estudiado.'],
  ['Incertidumbre del volumen si el radio tiene 4 %','12 %. En potencias la incertidumbre relativa se multiplica por el exponente, y el volumen va con r³.'],
  ['Conversión global con recirculación total y 30 % por paso','100 %: si nada del reactivo sale sin convertirse, todo acaba convirtiéndose. El precio es un caudal de recirculación alto.'],
  ['¿Para qué una corriente de purga?','Para que los inertes, que entran y no se consumen ni salen, no se acumulen indefinidamente en el circuito.'],
  ['PFR o CSTR para orden positivo','PFR: menos volumen a igual conversión, porque buena parte del tubo opera a concentración alta. El CSTR trabaja todo a la de salida.'],
  ['¿Qué significa TRL 4 y qué es el valle de la muerte?','TRL 4 es validación en laboratorio. El tramo 4 a 6 es el valle de la muerte: escalamiento, reproducibilidad y costo.']
 ]},

{id:'M10',nom:'Formulaciones y desarrollo de productos',sesion:'Sesión 1 del taller',
 sub:'Sistemas dispersos, del compuesto al fármaco, y del laboratorio al producto con su riesgo y su regulación.',
 sec:[
  {t:'Sistemas dispersos: termodinámicamente condenados',b:[
   {p:['Una emulsión <b>nunca</b> es termodinámicamente estable: separar dos fases inmiscibles crea área interfacial y eso cuesta energía. Lo que se busca es <b>estabilidad cinética</b>, es decir que tarde mucho.']},
   {p:['El <b>HLB</b> resume en un número de 0 a 20 la afinidad del surfactante por el agua. La regla que decide el tipo de emulsión es la de <b>Bancroft</b>: la fase continua será aquella en la que el surfactante sea más soluble. Así, HLB alto (8–18) da aceite en agua y HLB bajo (3–6) da agua en aceite.']},
   {eq:'HLB_mezcla = x₁·HLB₁ + x₂·HLB₂   ·   promedio ponderado por fracción másica'},
   {tabla:{th:['Mecanismo de fallo','Qué ocurre','¿Reversible agitando?','Cómo se combate'],tr:[
     ['Cremado','Las gotas migran por densidad (Stokes)','Sí','Reducir radio (entra al cuadrado), espesar, igualar densidades'],
     ['Floculación','Se agrupan sin fusionarse','Sí','Más repulsión: carga o impedimento estérico'],

<script>
/* ============================================================
   QUIZ MIXTO · 8 reactivos por módulo, repartidos por igual
   porque los nueve módulos valen 10 % cada uno.
   Preguntas de aplicación, comparación o detección de
   discrepancias, no de reconocimiento de definiciones.
   ============================================================ */
var QUIZ=[
/* ---------------- M2 ---------------- */
{tag:'M2',q:'Titulas 25.00 mL de Fe²⁺ y gastas 18.40 mL de KMnO₄ 0.0200 M en medio ácido. ¿Cuál es la concentración de Fe²⁺?',
 opts:['0.0368 M','0.0029 M','0.0147 M','0.0736 M'],correct:3,
 exp:'Moles de MnO₄⁻ = 0.01840 × 0.0200 = 3.68×10⁻⁴. La relación es 1 a 5 porque el Mn gana 5 electrones y el Fe cede 1, así que hay 1.84×10⁻³ mol de Fe²⁺ en 0.02500 L: 0.0736 M. El 0.0147 sale de usar relación 1:1.'},
{tag:'M2',q:'Dos analistas miden el mismo material certificado. A obtiene 4.52, 4.51, 4.53. B obtiene 4.38, 4.71, 4.49. El valor certificado es 4.50. ¿Qué conclusión se sostiene?',
 opts:['A es preciso pero inexacto; B combina exactitud y precisión altas','Ambos arrastran un error sistemático de magnitud muy parecida','A es preciso y exacto; B acierta en promedio pero es impreciso','B resulta más confiable porque su rango abarca el valor real'],correct:2,
 exp:'A está centrado en 4.52 con dispersión mínima: preciso y exacto. B promedia 4.527 pero con rango de 0.33: su exactitud media es aceptable y su precisión mala, lo que apunta a error aleatorio. Un rango amplio que "cubra" el valor real no es un criterio de confiabilidad.'},
{tag:'M2',q:'Un pico de HPLC sale a 9.0 min con tiempo muerto de 1.5 min. Otro analista reporta k′ = 6.0 para el mismo pico. ¿Qué error cometió?',
 opts:['No restó el tiempo muerto','Tomó el ancho del pico en lugar del tiempo de retención','Dividió entre el tiempo de retención total en vez del muerto','Confundió el factor de retención con la resolución del par'],correct:0,
 exp:'k′ = (9.0 − 1.5)/1.5 = 5.0. Reportar 6.0 equivale a calcular 9.0/1.5, es decir olvidar la resta del tiempo muerto en el numerador. Es el error más frecuente del parámetro.'},
{tag:'M2',q:'Un método da 103 % de recuperación sobre un material certificado, de forma reproducible en diez réplicas. ¿Qué acción corresponde?',
 opts:['Subir el número de réplicas hasta que la media descienda a 100 %','Descartar el material certificado y repetir con otro lote distinto','Aceptarlo: la reproducibilidad en diez réplicas confirma su validez','Buscar la fuente del sesgo'],correct:3,
 exp:'Alta reproducibilidad con desviación constante es la firma del error sistemático. Aumentar n reduce el componente aleatorio y deja el sesgo intacto. Hay que revisar calibración, patrón, interferencia de matriz o recuperación del método.'},
{tag:'M2',q:'Titulas un ácido débil con NaOH usando naranja de metilo, que vira entre pH 3.1 y 4.4. ¿Qué le pasa al resultado?',
 opts:['Sobrestima la concentración, porque el viraje exige titulante adicional','No se altera, porque la equivalencia no depende del indicador elegido','Pierde precisión pero conserva la exactitud del promedio de réplicas','La subestima'],correct:3,
 exp:'La equivalencia de un ácido débil con base fuerte cae por encima de pH 8, así que el indicador vira mucho antes y el volumen registrado es menor que el correcto. El sesgo es sistemático y siempre en la misma dirección, de modo que repetir no lo revela.'},
{tag:'M2',q:'Analizas por gravimetría una muestra de 0.2711 g y obtienes 1.1682 g de precipitado. Un compañero reporta 1.66 % de fósforo. ¿Qué hizo mal?',
 opts:['Aplicó la pureza del reactivo al final del cálculo y no al principio','Usó el precipitado como denominador','Olvidó convertir los moles de precipitado en moles de fósforo elemental','Tomó la masa molar del fósforo en lugar de la del precipitado seco'],correct:1,
 exp:'El porcentaje correcto es 7.11 % respecto a los 0.2711 g de muestra. Usar los 1.1682 g del precipitado como denominador reduce el valor por un factor de 4.3 y da precisamente ese orden. El precipitado es el intermedio con el que mides, no el objeto del análisis.'},
{tag:'M2',q:'Una curva de calibración da R² = 0.9998, pero las muestras reales salen 12 % altas frente a un método de referencia. ¿Cómo se explica?',
 opts:['El coeficiente de determinación se calculó de forma incorrecta','El rango lineal del método se excedió al medir las muestras reales','La curva se construyó con muy pocos puntos para ser representativa','Efecto de matriz'],correct:3,
 exp:'R² mide qué tan bien los puntos de calibración se ajustan a una recta, nada más. Si la matriz de la muestra realza o suprime la señal respecto a los estándares en disolvente puro, el ajuste sigue siendo excelente y el resultado sesgado. Se resuelve con adición de estándar.'},
{tag:'M2',q:'Quieres amortiguar a pH 9.2 y tienes ácido acético (pKa 4.76), fosfato dihidrógeno (pKa 7.2) y amonio (pKa 9.25). ¿Cuál eliges y por qué?',
 opts:['Acético: es el más débil de los tres y por eso el más amortiguante','Fosfato: su pKa intermedio cubre un intervalo de pH más amplio','Cualquiera, ajustando la proporción entre ácido y base conjugada','Amonio: su pKa está a 0.05 unidades del objetivo'],correct:3,
 exp:'La capacidad amortiguadora es máxima en pKa y útil en pKa ± 1. Con pKa 9.25 la razón base/ácido es casi 1 al pH objetivo. Con los otros dos harían falta razones extremas donde el sistema prácticamente no amortigua, aunque el pH nominal se alcance.'},

/* ---------------- M3 ---------------- */
{tag:'M3',q:'El 2-bromobutano reacciona con etóxido de sodio en etanol a 70 °C. ¿Qué producto predomina y por qué?',
 opts:['Alcohol por SN1, con el etanol actuando como nucleófilo débil','Mezcla equimolar de éter y alqueno, sin preferencia mecanística','Éter por SN2, porque el etóxido es un nucleófilo de los buenos','Alqueno por E2'],correct:3,
 exp:'El sustrato es secundario, así que la decisión recae en el reactivo y la temperatura. El etóxido es base fuerte, no solo nucleófilo, y la eliminación produce más partículas y mayor entropía, de modo que el término TΔS la favorece al calentar. Por eso domina E2.'},
{tag:'M3',q:'Dos isómeros con la misma fórmula funden a 132 °C y 158 °C, y ambos desvían la luz polarizada. ¿Qué relación tienen?',
 opts:['Enantiómeros, dado que ambos resultan ser ópticamente activos','Uno es la forma meso del otro, que sería la especie aquiral','Diastereómeros','Confórmeros que se separaron al bajar la temperatura'],correct:2,
 exp:'Los enantiómeros tienen propiedades físicas idénticas salvo el signo de rotación, así que dos puntos de fusión distintos los descarta. Los diastereómeros no son imágenes especulares y sí difieren en propiedades físicas, lo que además permite separarlos por métodos convencionales. Una forma meso no sería ópticamente activa.'},
{tag:'M3',q:'Un polímero muestra en DSC un escalón a 105 °C y ningún pico endotérmico hasta 300 °C. En TGA no aparece nada antes de 340 °C. ¿Qué material es?',
 opts:['Un termofijo entrecruzado, que no presenta transiciones térmicas','Un elastómero, cuya Tg cae siempre por debajo de la temperatura ambiente','Amorfo','Semicristalino con Tg baja y Tm por encima del rango explorado'],correct:2,
 exp:'El escalón en la línea base del DSC es la transición vítrea, propia de la fase amorfa. La ausencia de pico endotérmico indica que no hay regiones cristalinas, así que no hay Tm. El TGA no ve la Tg porque no implica cambio de masa, y eso es consistente con no registrar nada.'},
{tag:'M3',q:'Añades HBr a 2-metil-2-buteno en dos frascos: uno limpio y otro contaminado con peróxidos. ¿Qué observas?',
 opts:['El mismo producto, porque el peróxido no interviene en la adición','Ningún producto en el frasco con peróxido, que inhibe la reacción','Productos distintos','El mismo producto pero con un rendimiento mucho menor'],correct:2,
 exp:'Sin peróxidos la adición es iónica y sigue Markovnikov, con el bromo en el carbono más sustituido. Con peróxidos se genera un radical bromo y el mecanismo pasa a radicalario, que entrega la regioselectividad opuesta. Es el ejemplo clásico de que el mecanismo gobierna el producto.'},
{tag:'M3',q:'Un inhibidor enzimático baja Vmax un 40 % y deja Km sin cambio apreciable. Si duplicas el sustrato, ¿qué esperas?',
 opts:['Que el efecto desaparezca al desplazar al inhibidor fuera del sitio','Que Km aumente porque el sustrato compite ahora con el inhibidor','Que el efecto persista','Que Vmax se recupere en cuanto la enzima quede saturada'],correct:2,
 exp:'Vmax reducido con Km intacto es la firma del inhibidor no competitivo: se une fuera del sitio activo y reduce la cantidad de enzima funcional. Añadir sustrato no lo desplaza porque no ocupan el mismo lugar. Solo el competitivo se vence con más sustrato.'},
{tag:'M3',q:'Una policondensación se detiene al 92 % de conversión. ¿Qué peso molecular obtienes y por qué?',
 opts:['Alto: al 92 % la mayoría de las cadenas tiene ya su peso final','Intermedio: el peso molecular crece de forma lineal con la conversión','Indeterminado: el peso no guarda relación con la conversión alcanzada','Bajo'],correct:3,
 exp:'En crecimiento por pasos cualquier par de moléculas con grupos complementarios puede unirse, y el grado de polimerización medio solo se dispara en el último tramo de conversión, según Carothers. A 92 % el sistema aún está lleno de oligómeros. En polimerización en cadena, en cambio, las cadenas nacen con su peso casi final.'},
{tag:'M3',q:'Un fármaco quiral se administra como racémico y produce el efecto buscado más una toxicidad inesperada. ¿Qué explicación es más probable?',
 opts:['El racémico resulta menos soluble que cualquiera de los puros','La mezcla racémica se degrada más rápido dentro del organismo','Los enantiómeros se neutralizan parcialmente el uno al otro','Cada enantiómero actúa sobre un blanco distinto'],correct:3,
 exp:'El entorno biológico es quiral, así que dos enantiómeros encajan de forma distinta en un sitio de unión. Uno puede dar el efecto terapéutico y el otro unirse a otro receptor o metabolizarse por otra vía. Sus propiedades físicas en entorno aquiral, como la solubilidad, son idénticas.'},
{tag:'M3',q:'Quieres nitrar un anillo que ya lleva un grupo –NO₂. ¿Qué esperas comparado con el benceno sin sustituir?',
 opts:['Más rápida, con el producto repartido entre las posiciones orto y para','Más lenta, pero con la misma distribución de isómeros que el benceno','Más lenta y meta','Más rápida y con mezcla estadística de los tres isómeros'],correct:2,
 exp:'El nitro retira densidad electrónica por inducción y resonancia, así que desactiva el anillo frente al ataque electrofílico. Además desestabiliza el ion arenio en orto y para más que en meta, de modo que la sustitución se dirige a meta. Activante y orto-para director van siempre juntos, igual que desactivante y meta.'}
];

<script>
QUIZ.push(
/* ---------------- M4 ---------------- */
{tag:'M4',q:'Un sólido conduce mal en frío y su resistencia baja al calentarlo. ¿Qué es?',
 opts:['Un aislante iónico en el que los iones ganan movilidad térmica','Un superconductor por encima de su temperatura crítica propia','Un metal con alta densidad de defectos cristalinos dispersores','Un semiconductor'],correct:3,
