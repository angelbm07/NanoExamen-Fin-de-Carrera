{m:'M3',g:'Polímeros',t:'Pesos moleculares y polidispersidad',f:'M_n = ΣNᵢMᵢ/ΣNᵢ    ;    M_w = ΣNᵢMᵢ²/ΣNᵢMᵢ    ;    Đ = M_w/M_n',
 o:'Un polímero no tiene una masa única sino una distribución. M_n pondera por número de cadenas y M_w por masa, así que M_w siempre es mayor o igual que M_n.',
 r:'La polidispersidad es a los polímeros lo que el índice de polidispersidad del DLS es a las nanopartículas: una medida de qué tan estrecha es la distribución.',
 v:'Nᵢ = número de cadenas de masa Mᵢ | M en g·mol⁻¹ | Đ adimensional',
 c:'Đ = 1 significa monodisperso (solo alcanzable en polimerización viviente). Đ entre 1.5 y 2 es típico de policondensación.',
 l:'M_n y M_w se miden con técnicas distintas (osmometría y dispersión de luz, respectivamente), y GPC da valores relativos al estándar de calibración.',s:'TEXTO'},

/* ---------- M4 MATERIALES ---------- */
{m:'M4',g:'Estructura atómica',t:'Niveles de energía de Bohr y serie de Rydberg',f:'E_n = −13.606/n² eV    ;    1/λ = R_H(1/n₁² − 1/n₂²)',
 o:'Bohr cuantizó el momento angular del electrón (L = nħ) e igualó la fuerza de Coulomb a la centrípeta. El resultado reprodujo exactamente las líneas espectrales del hidrógeno medidas por Balmer, lo que le dio credibilidad al modelo.',
 r:'Antecede al modelo mecano-cuántico y explica el principio de la espectroscopía atómica (AAS, ICP).',
 v:'n = número cuántico principal (entero ≥ 1) | R_H = 1.0973731568×10⁷ m⁻¹ | E en eV',
 c:'La energía de ionización del hidrógeno (n = 1 → ∞) es 13.606 eV. La transición n = 3 → 2 da 656 nm, la línea roja del hidrógeno.',
 l:'Falla para cualquier átomo con más de un electrón, porque ignora la repulsión electrón-electrón.',s:'CODATA'},
{m:'M4',g:'Estructura atómica',t:'Longitud de onda de de Broglie',f:'λ = h/p = h/(m·v)',
 o:'De Broglie postuló que si la luz tiene comportamiento de partícula, la materia debe tener comportamiento de onda. Se confirmó con la difracción de electrones en cristales de níquel (Davisson-Germer).',
 r:'Es la razón física de que un microscopio electrónico resuelva mucho más que uno óptico, y el fundamento de la difracción de electrones.',
 v:'λ = longitud de onda (m) | h = 6.626×10⁻³⁴ J·s | p = momento lineal (kg·m·s⁻¹) | m = masa (kg) | v = velocidad (m·s⁻¹)',
 c:'Un electrón acelerado a 100 kV tiene λ ≈ 3.7 pm, unas 10⁵ veces menor que la luz visible. De ahí la resolución sub-Å del TEM.',
 l:'A 100 kV o más hay que aplicar la corrección relativista, que reduce λ respecto al cálculo clásico.',s:'TEXTO'},
{m:'M4',g:'Estructura atómica',t:'Partícula en una caja unidimensional',f:'E_n = n²h²/(8mL²)',
 o:'Es la solución exacta de la ecuación de Schrödinger para un potencial infinito fuera de un intervalo de longitud L. La cuantización aparece por imponer que la función de onda se anule en las paredes: solo caben medias longitudes de onda enteras.',
 r:'Es el modelo mínimo del confinamiento cuántico y el punto de partida conceptual de la ecuación de Brus para puntos cuánticos.',
 v:'E_n = energía del nivel n (J) | n = 1, 2, 3… | h = constante de Planck (J·s) | m = masa de la partícula (kg) | L = longitud de la caja (m)',
 c:'La dependencia es 1/L²: reducir el tamaño a la mitad multiplica la energía por CUATRO. Para un electrón en 2 nm, E₁ ≈ 0.094 eV.',
 l:'Es un modelo idealizado con barreras infinitas; en un nanocristal real la barrera es finita y la función de onda se extiende un poco fuera.',s:'TEXTO'},
{m:'M4',g:'Cristalografía',t:'Densidad teórica de un cristal',f:'ρ = n·A/(V_celda·N_A)',
 o:'Es simplemente masa entre volumen aplicada a la celda unitaria: n átomos, cada uno de masa A/N_A, dentro del volumen de la celda.',
 r:'Comparar la densidad teórica con la medida revela porosidad o defectos: si la real es menor, hay vacíos.',
 v:'ρ = densidad (g·cm⁻³) | n = átomos por celda (SC 1, BCC 2, FCC 4, HCP 6) | A = masa atómica (g·mol⁻¹) | V_celda = a³ para cúbicas (cm³) | N_A = 6.022×10²³ mol⁻¹',
 c:'Cuidado con las unidades: si a está en nm hay que pasarlo a cm (1 nm = 10⁻⁷ cm) antes de elevar al cubo.',
 l:'Supone cristal perfecto y sin porosidad. En polvos nanométricos la densidad aparente es mucho menor.',s:'TEXTO'},
{m:'M4',g:'Cristalografía',t:'Distancia interplanar y factor de empaquetamiento',f:'d_hkl = a/√(h²+k²+l²)  (cúbica)    ;    FEA = (n·(4/3)πr³)/a³',
 o:'La distancia interplanar sale de la geometría analítica del plano definido por los índices de Miller. El factor de empaquetamiento compara el volumen ocupado por esferas rígidas contra el de la celda.',
 r:'d_hkl entra directamente en la ley de Bragg; el empaquetamiento explica densidad, planos de deslizamiento y ductilidad.',
 v:'a = parámetro de red (nm o Å) | h,k,l = índices de Miller (enteros) | r = radio atómico | n = átomos por celda',
 c:'Valores de FEA: SC 0.52, BCC 0.68, FCC 0.74, HCP 0.74. Números de coordinación: 6, 8, 12, 12.  Relación a-r: FCC a = 2√2·r ; BCC a = 4r/√3.',
 l:'La fórmula de d_hkl mostrada solo vale para sistemas cúbicos; las demás simetrías tienen expresiones distintas.',s:'TEXTO'},
{m:'M4',g:'Bandas',t:'Band gap, color y portadores intrínsecos',f:'E_g ≈ 1240/λ_borde(nm)    ;    n_i ∝ exp(−E_g/2kT)',
 o:'El borde de absorción marca la energía mínima capaz de promover un electrón de la banda de valencia a la de conducción. La densidad de portadores intrínsecos sigue una estadística de Boltzmann con barrera E_g/2 porque el nivel de Fermi queda a la mitad del gap.',
 r:'Vincula la teoría de bandas con la espectroscopía UV-Vis y con el Tauc plot de M7.',
 v:'E_g = band gap (eV) | λ_borde = longitud de onda del borde de absorción (nm) | n_i = concentración intrínseca de portadores (cm⁻³) | k = 8.617×10⁻⁵ eV·K⁻¹',
 c:'Si E_g > 3.1 eV el material solo absorbe UV y se ve transparente o blanco. Si E_g < 1.77 eV absorbe todo el visible y se ve negro o metálico.',
 l:'La relación con el color supone transiciones permitidas; un gap indirecto (silicio) absorbe débilmente cerca del borde y requiere asistencia de fonones.',s:'TEXTO'},
{m:'M4',g:'Propiedades',t:'Conductividad eléctrica',f:'σ = n·q·µ    ;    ρ = 1/σ',
 o:'Se obtiene del modelo de Drude: los portadores alcanzan una velocidad de arrastre proporcional al campo, con constante de proporcionalidad µ que resume la frecuencia de colisiones.',
 r:'Explica el contraste entre metales y semiconductores frente a la temperatura, y el efecto del dopaje.',
 v:'σ = conductividad (S·m⁻¹) | n = densidad de portadores (m⁻³) | q = carga del portador (C) | µ = movilidad (m²·V⁻¹·s⁻¹) | ρ = resistividad (Ω·m)',
 c:'En un metal n es prácticamente fijo y al calentar cae µ ⇒ ρ sube. En un semiconductor n crece exponencialmente al calentar y domina ⇒ ρ baja.',
 l:'El modelo de Drude es clásico; para describir bien un metal hay que usar estadística de Fermi-Dirac.',s:'TEXTO'},
{m:'M4',g:'Propiedades',t:'Ley de Hooke y relación de Hall-Petch',f:'σ = E·ε    ;    σ_y = σ₀ + k·d^(−1/2)',
 o:'Hooke describe la respuesta elástica lineal, que refleja el estiramiento reversible de los enlaces. Hall-Petch es una relación empírica: las fronteras de grano bloquean el avance de las dislocaciones, así que granos más pequeños endurecen el material.',
 r:'Conecta el enlace químico (que fija E) con los defectos cristalinos (que fijan σ_y).',
 v:'σ = esfuerzo (Pa o MPa) | E = módulo de Young (GPa) | ε = deformación (adimensional) | σ_y = límite elástico (MPa) | d = tamaño de grano (m o µm) | k = constante del material',
 c:'1 GPa = 10⁹ Pa = 1000 MPa. 1 MPa = 1 N/mm².',
 l:'Hall-Petch se invierte por debajo de unos 10–20 nm de grano: el mecanismo de deformación pasa a ser deslizamiento de fronteras y el material se ablanda.',s:'TEXTO'},

/* ---------- M5 FISICOQUÍMICA ---------- */
{m:'M5',g:'Gases',t:'Gas ideal y gas real',f:'PV = nRT    ;    (P + an²/V²)(V − nb) = nRT    ;    Z = PV/nRT',
 o:'La ecuación ideal resume las leyes empíricas de Boyle, Charles y Avogadro. Van der Waals añadió dos correcciones físicas: b descuenta el volumen propio de las moléculas y a compensa la reducción de presión por atracción intermolecular.',
 r:'Las constantes a y b se relacionan con las fuerzas intermoleculares y con el punto crítico.',
 v:'P = presión (Pa o atm) | V = volumen (m³ o L) | n = moles | R = 8.314 J·mol⁻¹·K⁻¹ = 0.08206 L·atm·mol⁻¹·K⁻¹ | T = temperatura absoluta (K) | Z adimensional',
 c:'1 atm = 101 325 Pa = 760 mmHg = 1.01325 bar.  Usa R = 0.0821 con L y atm; R = 8.314 con m³ y Pa.',
 l:'La ecuación ideal falla a baja T y alta P, justo donde Z se aleja de 1. Van der Waals mejora pero sigue siendo aproximada cerca del punto crítico.',s:'TEXTO'},
{m:'M5',g:'Fases',t:'Clausius-Clapeyron',f:'ln(P₂/P₁) = −(ΔH_vap/R)(1/T₂ − 1/T₁)',
 o:'Se obtiene de la condición de equilibrio entre fases (igualdad de potenciales químicos) suponiendo que el vapor es ideal y que el volumen del líquido es despreciable frente al del gas.',
 r:'Tiene la misma estructura que Arrhenius y que la ecuación de van \'t Hoff: todas relacionan un logaritmo con el inverso de la temperatura.',
 v:'P = presión de vapor (cualquier unidad, la misma en ambos) | ΔH_vap = entalpía de vaporización (J·mol⁻¹) | R = 8.314 J·mol⁻¹·K⁻¹ | T = temperatura absoluta (K)',
 c:'Graficando ln P contra 1/T se obtiene una recta de pendiente −ΔH_vap/R: así se mide experimentalmente la entalpía de vaporización.',
 l:'Supone ΔH_vap constante en el intervalo de temperatura y comportamiento ideal del vapor.',s:'TEXTO'},
{m:'M5',g:'Disoluciones',t:'Propiedades coligativas',f:'ΔT_b = i·K_b·m    ;    ΔT_f = i·K_f·m    ;    Π = i·M·R·T    ;    P = X_disolvente·P°',
 o:'Todas provienen de la disminución del potencial químico del disolvente al añadir soluto, que es un efecto entrópico. La ley de Raoult es el caso base y las demás se derivan de ella.',
 r:'El factor i de van \'t Hoff cuenta las partículas efectivas tras la disociación, lo que las conecta con los equilibrios iónicos.',
 v:'ΔT en °C o K | K_b, K_f = constantes ebulloscópica y crioscópica del disolvente (°C·kg·mol⁻¹; agua: K_f = 1.86, K_b = 0.512) | m = molalidad (mol·kg⁻¹) | Π = presión osmótica (atm) | M = molaridad (mol·L⁻¹) | i = factor de van \'t Hoff',
 c:'i teórico: glucosa 1, NaCl 2, CaCl₂ 3, Al₂(SO₄)₃ 5. El i real es algo menor por asociación iónica (coeficiente osmótico).',
 l:'Válidas solo en disoluciones diluidas. Usan molalidad (no molaridad) porque esta última depende de la temperatura.',s:'TEXTO'},
{m:'M5',g:'Termodinámica',t:'Energía libre de Gibbs y equilibrio',f:'ΔG = ΔH − TΔS    ;    ΔG° = −RT ln K    ;    ΔG = ΔG° + RT ln Q',
 o:'Gibbs combinó la primera y la segunda ley para obtener un criterio de espontaneidad que solo depende del sistema, sin necesidad de calcular la entropía del entorno. La relación con K aparece al imponer ΔG = 0 en el equilibrio, lo que hace Q = K.',
 r:'Es la ecuación central del programa: enlaza con Nernst (ΔG° = −nFE°), con van \'t Hoff, con la barrera de nucleación y con la adsorción.',
 v:'ΔG = energía libre (J·mol⁻¹) | ΔH = entalpía (J·mol⁻¹) | T = temperatura absoluta (K) | ΔS = entropía (J·mol⁻¹·K⁻¹) | K = constante de equilibrio (adimensional) | Q = cociente de reacción',
 c:'Ojo con las unidades de ΔS: suele tabularse en J·mol⁻¹·K⁻¹ mientras ΔH viene en kJ·mol⁻¹. Hay que homogeneizar antes de restar.',
 l:'ΔG < 0 indica posibilidad, no velocidad. Un proceso espontáneo con Ea alta puede no ocurrir en escalas de tiempo observables.',s:'TEXTO'},
{m:'M5',g:'Equilibrio',t:'Constantes de equilibrio y van \'t Hoff',f:'K_p = K_c(RT)^Δn    ;    d(ln K)/dT = ΔH°/(RT²)',
 o:'La relación entre K_p y K_c sale de sustituir P = (n/V)RT en la expresión de la constante. La ecuación de van \'t Hoff se obtiene derivando ΔG° = −RT ln K respecto a la temperatura.',
 r:'Da el fundamento cuantitativo de Le Chatelier frente a cambios de temperatura: si ΔH° > 0, K crece al calentar.',
 v:'K_p = constante en presiones parciales | K_c = constante en concentraciones | Δn = moles de gas de productos menos de reactivos | R = 0.0821 L·atm·mol⁻¹·K⁻¹ si K_p está en atm',
 c:'Si Δn = 0, K_p = K_c. Sólidos y líquidos puros no aparecen en la expresión de K.',
 l:'Van \'t Hoff supone ΔH° independiente de la temperatura, aproximación válida solo en intervalos moderados.',s:'TEXTO'},
{m:'M5',g:'Cinética',t:'Leyes de velocidad integradas',f:'Orden 0: [A] = [A]₀ − kt    ;    Orden 1: ln[A] = ln[A]₀ − kt    ;    Orden 2: 1/[A] = 1/[A]₀ + kt',
 o:'Cada una es la integral de la ley diferencial −d[A]/dt = k[A]ⁿ para n = 0, 1 y 2. Por eso cada orden linealiza con una función distinta de la concentración.',
 r:'El orden 1 comparte solución con todo decaimiento exponencial; el orden 0 aparece cuando el catalizador o la enzima están saturados.',
 v:'[A] = concentración (mol·L⁻¹) | t = tiempo (s) | k con unidades que dependen del orden: mol·L⁻¹·s⁻¹ (orden 0), s⁻¹ (orden 1), L·mol⁻¹·s⁻¹ (orden 2)',
 c:'Vidas medias: orden 0 t½ = [A]₀/2k (depende de la concentración inicial) | orden 1 t½ = 0.693/k (independiente) | orden 2 t½ = 1/(k[A]₀).',
 l:'El orden se determina experimentalmente, no de la estequiometría. Las unidades de k son la pista más rápida para identificar el orden en un reactivo.',s:'TEXTO'},
{m:'M5',g:'Cinética',t:'Ecuación de Arrhenius',f:'k = A·e^(−E_a/RT)    →    ln(k₂/k₁) = −(E_a/R)(1/T₂ − 1/T₁)',
 o:'Arrhenius la propuso empíricamente al notar que ln k contra 1/T daba rectas. La interpretación posterior es que el factor exponencial representa la fracción de colisiones con energía suficiente para superar la barrera, según la distribución de Boltzmann.',
 r:'Misma forma matemática que Clausius-Clapeyron y van \'t Hoff. La teoría del estado de transición (Eyring) la refina.',
 v:'k = constante de velocidad | A = factor preexponencial (mismas unidades que k) | E_a = energía de activación (J·mol⁻¹ o kJ·mol⁻¹) | R = 8.314 J·mol⁻¹·K⁻¹ | T = temperatura absoluta (K)',
 c:'Regla práctica: para muchas reacciones orgánicas, subir 10 °C cerca de temperatura ambiente duplica la velocidad, lo que corresponde a E_a ≈ 50 kJ·mol⁻¹.',
 l:'Supone E_a independiente de T. Falla en reacciones con efecto túnel, con mecanismos que cambian con la temperatura o controladas por difusión.',s:'TEXTO'},
{m:'M5',g:'Superficies',t:'Isoterma de Langmuir',f:'θ = K·P/(1 + K·P)    ;    forma lineal: P/V = 1/(V_m·K) + P/V_m',
 o:'Langmuir la dedujo igualando las velocidades de adsorción y desorción sobre una superficie con un número finito de sitios equivalentes e independientes. Es un equilibrio dinámico, no un modelo geométrico.',
 r:'Es la misma hipérbola de saturación que Michaelis-Menten y que la ocupación de un receptor: sitios finitos que se llenan.',
 v:'θ = fracción de cobertura (0 a 1) | K = constante de equilibrio de adsorción (Pa⁻¹ o atm⁻¹) | P = presión del adsorbato (Pa) | V_m = volumen de monocapa',
 c:'A presión baja θ ≈ KP (régimen lineal, tipo Henry). A presión alta θ → 1 (saturación).',
 l:'Supone monocapa, sitios idénticos y sin interacción entre moléculas adsorbidas. Superficies heterogéneas siguen mejor Freundlich o Temkin.',s:'LANGMUIR'},
{m:'M5',g:'Superficies',t:'Ecuación BET y área superficial específica',f:'P/[V(P₀−P)] = 1/(V_m·C) + [(C−1)/(V_m·C)]·(P/P₀)    ;    SSA = (V_m·N_A·A_m)/(V_molar·masa)',
 o:'Brunauer, Emmett y Teller extendieron el argumento de Langmuir permitiendo que se adsorban capas sucesivas, con la primera capa energéticamente distinta de las demás. De ahí sale el parámetro C.',
 r:'Deriva directamente de Langmuir; es el método normalizado para reportar área superficial de catalizadores y nanomateriales.',
 v:'V = volumen adsorbido | V_m = volumen de monocapa | P/P₀ = presión relativa | C = constante BET | A_m = área ocupada por una molécula de N₂ (0.162 nm²) | SSA en m²·g⁻¹',
 c:'El ajuste se hace en el intervalo P/P₀ entre 0.05 y 0.30. Para esferas no porosas, SSA se puede contrastar con 6/(ρ·d).',
 l:'No es fiable en microporos (menores a 2 nm), donde el llenado no es por capas sino por condensación en volumen.',s:'BET'},
{m:'M5',g:'Superficies',t:'Young, Laplace y Kelvin',f:'γ_SV = γ_SL + γ_LV·cosθ    ;    ΔP = 2γ/r    ;    ln(P/P₀) = 2γV_m/(rRT)',
 o:'La ecuación de Young es un balance de fuerzas interfaciales en la línea de contacto. Young-Laplace expresa que una interfaz curva sostiene una diferencia de presión. Kelvin aplica lo anterior al equilibrio líquido-vapor y explica por qué las gotas pequeñas se evaporan más.',
 r:'Kelvin es la raíz de Ostwald-Freundlich y del efecto Gibbs-Thomson: los tres dicen que la curvatura desestabiliza lo pequeño.',
 v:'γ = tensión superficial o energía interfacial (N·m⁻¹ = J·m⁻²) | θ = ángulo de contacto (grados) | r = radio de curvatura (m) | V_m = volumen molar (m³·mol⁻¹)',
 c:'γ del agua a 20 °C = 72.8 mN·m⁻¹. 1 mN·m⁻¹ = 1 mJ·m⁻². Una gota de 1 µm de radio soporta ΔP ≈ 1.5 atm.',
 l:'Young supone superficie ideal, lisa, rígida y químicamente homogénea. En superficies reales hay histéresis del ángulo de contacto, y hay que corregir con Wenzel o Cassie-Baxter.',s:'TEXTO'},

/* ---------- M6 SÍNTESIS ---------- */
{m:'M6',g:'Efectos de tamaño',t:'Relación superficie/volumen y área específica',f:'S/V = 3/r = 6/d    ;    SSA = 6/(ρ·d)  (esferas)',
 o:'Es geometría pura: área de la esfera 4πr² dividida entre su volumen (4/3)πr³. La segunda expresión divide el área total entre la masa total de un conjunto de esferas idénticas.',
 r:'Explica por qué la reactividad, la catálisis y la toxicidad escalan con el tamaño, y por qué el área es mejor métrica de dosis que la masa.',
 v:'r = radio (m) | d = diámetro (m) | ρ = densidad (kg·m⁻³ o g·cm⁻³) | SSA = área superficial específica (m²·g⁻¹)',
 c:'Con ρ en g·cm⁻³ y d en cm, SSA sale en cm²·g⁻¹; divide entre 10⁴ para m²·g⁻¹. Oro de 20 nm: 15.5 m²·g⁻¹.',
 l:'Solo para esferas lisas y no porosas. Un material poroso puede tener SSA cientos de veces mayor que la predicha por su tamaño externo.',s:'TEXTO'},
{m:'M6',g:'Nucleación',t:'Barrera de nucleación homogénea',f:'ΔG(r) = (4/3)πr³ΔG_v + 4πr²γ    ;    r* = −2γ/ΔG_v    ;    ΔG* = 16πγ³/(3ΔG_v²)',
 o:'Se obtiene sumando dos términos opuestos: el volumen libera energía al formar fase estable (negativo, va como r³) y la superficie la consume (positivo, va como r²). La competencia produce un máximo, y ese máximo es la barrera. Derivando e igualando a cero se obtiene el radio crítico.',
 r:'Es la aplicación de la energía de Gibbs y la energía superficial a la formación de una fase nueva. Fundamenta el modelo de LaMer.',
 v:'ΔG_v = energía libre por unidad de volumen de la transformación (J·m⁻³, negativa) | γ = energía interfacial (J·m⁻²) | r* = radio crítico (m) | ΔG* = barrera (J)',
 c:'Por debajo de r* el núcleo se disuelve; por encima crece espontáneamente. Aumentar la supersaturación hace ΔG_v más negativo y reduce tanto r* como la barrera.',
 l:'Es el modelo clásico y supone núcleos esféricos con γ igual al del material masivo, lo que en la nanoescala es cuestionable. La nucleación heterogénea sobre una superficie tiene barrera mucho menor.',s:'LAMER'},
{m:'M6',g:'Nucleación',t:'Ostwald-Freundlich y Gibbs-Thomson',f:'ln(S_r/S_∞) = 2γV_m/(rRT)    ;    T_f(r) = T_f(∞)·[1 − 2γ_sl/(ΔH_f·ρ·r)]',
 o:'Ambas son la ecuación de Kelvin aplicada a la solubilidad y a la fusión: la curvatura eleva el potencial químico de la partícula pequeña, lo que la hace más soluble y más fácil de fundir.',
 r:'Explica cuantitativamente la maduración de Ostwald y la depresión del punto de fusión en nanopartículas.',
 v:'S_r = solubilidad de la partícula de radio r | S_∞ = solubilidad del material masivo | γ = energía interfacial (J·m⁻²) | V_m = volumen molar (m³·mol⁻¹) | ΔH_f = entalpía de fusión (J·kg⁻¹)',
 c:'El efecto se vuelve apreciable por debajo de ~20 nm. Oro de 3 nm funde cientos de grados por debajo de los 1064 °C del oro masivo.',
 l:'Supone partícula esférica y γ constante con el tamaño; ambas hipótesis se debilitan por debajo de unos pocos nanómetros.',s:'TEXTO'},
{m:'M6',g:'Confinamiento',t:'Ecuación de Brus',f:'E_g(NP) ≈ E_g(bulk) + h²/(8µR²) − 1.786e²/(4πε₀εR)',
 o:'Brus modeló el excitón (par electrón-hueco) como una partícula en una caja esférica, sumando la corrección de confinamiento y restando la atracción coulómbica entre electrón y hueco. El primer término es partícula en caja; el segundo es electrostática.',
 r:'Une el modelo de partícula en una caja (M4) con la teoría de bandas para predecir el color de emisión de un punto cuántico.',
 v:'E_g = band gap efectivo (J o eV) | µ = masa reducida del excitón, 1/µ = 1/m_e* + 1/m_h* (kg) | R = radio del nanocristal (m) | ε = constante dieléctrica relativa del material',
 c:'El término de confinamiento escala como 1/R² y el coulómbico como 1/R, así que a radios pequeños domina el confinamiento y el gap crece.',
 l:'Es una aproximación de masa efectiva válida para nanocristales de radio comparable o mayor al del excitón; por debajo de ~2 nm sobrestima el gap y hay que recurrir a cálculos atomísticos.',s:'BRUS'},
{m:'M6',g:'Coloides',t:'Longitud de Debye y potencial zeta',f:'κ⁻¹ = √(ε·ε₀·k_B·T / (2·N_A·e²·I))    ;    µ_e = ε·ε₀·ζ/η  (Smoluchowski)',

 c:'En agua a 25 °C: κ⁻¹ ≈ 0.304/√I nm con I en mol·L⁻¹. Con NaCl 1 mM son ~9.6 nm; con 100 mM caen a ~1 nm. Criterio práctico: |ζ| > 30 mV ⇒ suspensión estable.',
 l:'Smoluchowski supone κ·r ≫ 1 (doble capa delgada frente a la partícula). Para partículas muy pequeñas o baja fuerza iónica hay que usar la aproximación de Hückel (factor 2/3).',s:'TEXTO'},
{m:'M6',g:'Coloides',t:'Energía de interacción DLVO',f:'V_total(h) = V_repulsión electrostática(h) + V_atracción de van der Waals(h)',

{m:'M6',g:'Fabricación',t:'Límite de resolución litográfica',f:'R = k₁·λ/NA    ;    DOF = k₂·λ/NA²',

/* ---------- M7 CARACTERIZACIÓN ---------- */
{m:'M7',g:'Difracción',t:'Ley de Bragg',f:'n·λ = 2·d·senθ',

 v:'n = orden de difracción (entero) | λ = longitud de onda (nm o Å) | d = distancia interplanar (nm o Å) | θ = ángulo de Bragg (grados), la MITAD del ángulo 2θ que reporta el difractómetro',

{m:'M7',g:'Difracción',t:'Ecuación de Scherrer y Williamson-Hall',f:'D = K·λ/(β·cosθ)    ;    β·cosθ = K·λ/D + 4·ε·senθ',

 r:'Williamson-Hall la extiende separando la contribución de tamaño (que va como 1/cosθ) de la de microdeformación (que va como tanθ).',
 v:'D = tamaño de cristalito (nm) | K ≈ 0.9 (adimensional) | λ = longitud de onda (nm) | β = ensanchamiento en RADIANES, corregido por el ensanchamiento instrumental | θ = ángulo de Bragg (rad o grados para el coseno) | ε = microdeformación',
 c:'Para pasar el FWHM de grados a radianes multiplica por π/180 = 0.01745. Un FWHM de 0.5° son 0.00873 rad.',
 l:'Da tamaño de CRISTALITO, no de partícula. Deja de ser confiable por encima de ~100–200 nm, donde el ensanchamiento instrumental domina. Ignora la microdeformación, que en muestras molidas puede ser la contribución principal.',s:'PATTERSON'},

{m:'M7',g:'Microscopía',t:'Límite de resolución y corriente túnel',f:'d_min = 0.61·λ/NA  (Abbe-Rayleigh)    ;    I ∝ e^(−2κs)  (STM)',

 v:'X_n = grado de polimerización promedio en número | p = conversión de grupos funcionales (0 a 1) | r = relación estequiométrica entre los dos monómeros',
 c:'Para X_n = 100 se necesita p = 0.99. Para X_n = 1000, p = 0.999. Un pequeño desbalance estequiométrico limita drásticamente el peso molecular.',
 l:'Válida para policondensación paso a paso con estequiometría controlada. No aplica a polimerización en cadena, donde desde el inicio se forman cadenas largas.',s:'TEXTO'},
{m:'M3',g:'Polímeros',t:'Relación de Fox-Flory para la Tg',f:'T_g = T_g∞ − K/M_n',
 o:'Se basa en el volumen libre: los extremos de cadena tienen más movilidad que el resto, así que cadenas cortas (M_n bajo) aportan más volumen libre y bajan la temperatura de transición vítrea.',
 r:'Conecta el peso molecular (Carothers, GPC) con una propiedad térmica medible por DSC.',
 v:'T_g = temperatura de transición vítrea (K) | T_g∞ = valor límite a peso molecular infinito (K) | M_n = peso molecular promedio en número (g·mol⁻¹) | K = constante del polímero',
 c:'El efecto es fuerte a bajo peso molecular y prácticamente desaparece por encima de unos 10⁵ g·mol⁻¹.',
 l:'No contempla plastificantes, copolimerización ni entrecruzamiento, que también desplazan la Tg.',s:'TEXTO'},
{m:'M3',g:'Biología molecular',t:'Cuantificación de ácidos nucleicos por absorbancia',f:'[dsDNA] (µg·mL⁻¹) = A₂₆₀ × 50 × factor de dilución    ;    pureza = A₂₆₀/A₂₈₀',
 o:'Es Beer-Lambert aplicado a la absorción de las bases nitrogenadas, que tienen un máximo cerca de 260 nm. El factor 50 es el recíproco del coeficiente de extinción específico del DNA de doble cadena.',
 r:'Aplicación directa de Beer-Lambert; complementa la electroforesis y precede a la PCR.',
 v:'A₂₆₀ = absorbancia a 260 nm | factores: 50 para DNA de doble cadena, 40 para RNA, 33 para oligonucleótidos de cadena sencilla',
 c:'A₂₆₀/A₂₈₀ ≈ 1.8 indica DNA puro; ≈ 2.0 indica RNA puro. Valores menores sugieren contaminación por proteína o fenol.',
 l:'No distingue DNA íntegro de degradado, ni DNA de nucleótidos libres. Para cuantificación específica se prefiere fluorescencia con intercalantes.',s:'TEXTO'},

/* ---------- COMPLEMENTO M4 ---------- */
{m:'M4',g:'Bandas',t:'Distribución de Fermi-Dirac',f:'f(E) = 1/(1 + e^((E − E_F)/k_BT))',
 o:'Se deduce de la mecánica estadística para partículas idénticas que obedecen el principio de exclusión de Pauli: cada estado admite a lo sumo un electrón.',
 r:'Es lo que sustituye a la distribución de Boltzmann en metales y semiconductores; determina la posición del nivel de Fermi y la población de la banda de conducción.',
 v:'f(E) = probabilidad de ocupación (0 a 1) | E = energía del estado (eV) | E_F = nivel de Fermi (eV) | k_B = 8.617×10⁻⁵ eV·K⁻¹ | T = temperatura absoluta (K)',
 c:'A cualquier temperatura, f(E_F) = 0.5 exactamente. A 300 K, k_BT ≈ 0.0259 eV: la transición entre ocupado y vacío ocurre en una franja de unos pocos k_BT.',
 l:'A energías muy por encima de E_F se reduce a la distribución de Boltzmann; es ahí donde se puede usar la aproximación exponencial simple.',s:'TEXTO'},
{m:'M4',g:'Transporte',t:'Leyes de Fick y difusividad activada',f:'J = −D·(dC/dx)    ;    ∂C/∂t = D·∂²C/∂x²    ;    D = D₀·e^(−Q/RT)',
 o:'La primera ley de Fick es fenomenológica: el flujo es proporcional al gradiente, igual que Fourier para el calor y Ohm para la carga. La segunda ley sale de aplicarle un balance de materia. La dependencia con la temperatura tiene forma de Arrhenius porque difundir requiere superar una barrera de salto entre posiciones de la red.',
 r:'Misma estructura matemática que la conducción de calor y que la ley de Ohm. La difusividad alimenta el número de Péclet y el crecimiento difusivo de nanopartículas.',
 v:'J = flujo (mol·m⁻²·s⁻¹) | D = coeficiente de difusión (m²·s⁻¹) | C = concentración (mol·m⁻³) | x = posición (m) | Q = energía de activación de la difusión (J·mol⁻¹)',
 c:'Regla útil: la distancia típica de difusión en un tiempo t es x ≈ √(2Dt). Como va con la raíz, duplicar la distancia exige cuadruplicar el tiempo. Esto explica por qué mezclar por difusión en microcanales es lento.',
 l:'Supone medio isótropo, D independiente de la concentración y ausencia de convección o campos externos.',s:'TEXTO'},
{m:'M4',g:'Propiedades',t:'Capacidad calorífica: Dulong-Petit, Einstein y Debye',f:'C_V ≈ 3R (Dulong-Petit)    ;    C_V ∝ T³ (Debye, T ≪ θ_D)',
 o:'Dulong-Petit es el límite clásico de equipartición: 3R por mol de átomos. Falla a baja temperatura porque los modos vibracionales están cuantizados. Einstein propuso un solo modo de frecuencia; Debye lo mejoró considerando un espectro completo de fonones, lo que reproduce la dependencia T³ observada.',
 r:'Introduce el concepto de fonón, que después reaparece en conductividad térmica y en la dispersión de electrones en metales.',
 v:'C_V = capacidad calorífica molar a volumen constante (J·mol⁻¹·K⁻¹) | R = 8.314 J·mol⁻¹·K⁻¹ | θ_D = temperatura de Debye (K)',
 c:'3R ≈ 24.9 J·mol⁻¹·K⁻¹, valor al que tienden casi todos los sólidos a temperatura ambiente. θ_D del diamante es ~2200 K; del plomo, ~105 K.',
 l:'Dulong-Petit falla por debajo de θ_D y en sólidos con enlaces muy rígidos. En metales hay además una contribución electrónica lineal en T, dominante a muy baja temperatura.',s:'TEXTO'},

/* ---------- COMPLEMENTO M5 ---------- */
{m:'M5',g:'Gases',t:'Ley de Dalton y ley de Graham',f:'P_total = ΣP_i    ;    P_i = X_i·P_total    ;    v_1/v_2 = √(M₂/M₁)',
 o:'Dalton se sigue de que en un gas ideal las moléculas no interactúan, así que cada componente ejerce presión como si estuviera solo. Graham sale de igualar la energía cinética promedio de dos gases a la misma temperatura: (1/2)mv² igual implica que la molécula más ligera va más rápido.',
 r:'Dalton se usa en equilibrios gaseosos (K_p) y en presión parcial de oxígeno; Graham fundamenta la separación isotópica y la efusión.',
 v:'P_i = presión parcial (Pa o atm) | X_i = fracción molar (adimensional) | v = velocidad de efusión o difusión | M = masa molar (g·mol⁻¹)',
 c:'El helio (M = 4) efunde √(32/4) ≈ 2.8 veces más rápido que el oxígeno (M = 32).',
 l:'Ambas suponen comportamiento ideal. Graham describe efusión por un orificio pequeño, no difusión en un medio denso.',s:'TEXTO'},
{m:'M5',g:'Termodinámica',t:'Ley de Hess y entalpías de formación',f:'ΔH°_rxn = ΣnΔH°_f(productos) − ΣnΔH°_f(reactivos)',
 o:'Es una consecuencia directa de que la entalpía sea función de estado: el cambio solo depende de los estados inicial y final, no del camino. Por eso se pueden sumar reacciones intermedias.',
 r:'Permite calcular ΔH de reacciones imposibles de medir directamente, y alimenta ΔG = ΔH − TΔS.',
 v:'ΔH°_f = entalpía estándar de formación (kJ·mol⁻¹), definida como cero para los elementos en su estado estándar | n = coeficientes estequiométricos',
 c:'También puede estimarse con entalpías de enlace: ΔH ≈ Σ(enlaces rotos) − Σ(enlaces formados), aunque con menor exactitud.',
 l:'Los valores tabulados corresponden a condiciones estándar (1 bar, normalmente 298.15 K) y al estado físico indicado: usar el de agua líquida en vez de vapor cambia el resultado.',s:'TEXTO'},

/* ---------- COMPLEMENTO M6 ---------- */
{m:'M6',g:'Nucleación',t:'Cinética de maduración de Ostwald (LSW)',f:'r̄³(t) − r̄³(0) = (8·γ·D·C_∞·V_m²/(9RT))·t',
 o:'La teoría de Lifshitz-Slyozov-Wagner resuelve el crecimiento controlado por difusión de una población de partículas cuya solubilidad depende del radio según Ostwald-Freundlich. El resultado es que el radio promedio al cubo crece linealmente con el tiempo.',
 r:'Es la formalización cuantitativa de la maduración de Ostwald y explica la desestabilización lenta de emulsiones y coloides.',
 v:'r̄ = radio promedio (m) | γ = energía interfacial (J·m⁻²) | D = coeficiente de difusión del soluto (m²·s⁻¹) | C_∞ = solubilidad del material masivo (mol·m⁻³) | V_m = volumen molar (m³·mol⁻¹)',
 c:'Como r̄ crece con t^(1/3), el engrosamiento se desacelera con el tiempo. Reducir γ o reducir la solubilidad C_∞ frena el proceso; de ahí el uso de un aceite muy insoluble como agente atrapador en emulsiones.',
 l:'Supone fracción de volumen baja y control difusivo. Si el paso limitante es la reacción en la interfaz, la ley pasa a r̄² proporcional a t.',s:'TEXTO'},
{m:'M6',g:'Fabricación',t:'Control de espesor en ALD y CVD',f:'t_película = N_ciclos · GPC    ;    velocidad de depósito CVD ∝ e^(−E_a/RT) (régimen cinético)',
 o:'En ALD cada ciclo consiste en dos semirreacciones autolimitadas que saturan la superficie, así que el crecimiento por ciclo es constante e independiente del tiempo de exposición. En CVD, en cambio, la velocidad depende de la temperatura hasta que pasa a estar limitada por transporte de masa.',
 r:'ALD es adsorción química llevada al extremo del control; el régimen cinético del CVD obedece Arrhenius.',
 v:'t = espesor (nm) | N = número de ciclos | GPC = crecimiento por ciclo (nm·ciclo⁻¹, típicamente 0.05–0.15) | E_a = energía de activación del proceso superficial',
 c:'Para 5 nm de Al₂O₃ con GPC ≈ 0.1 nm se requieren unos 50 ciclos. El régimen de saturación se identifica graficando GPC contra tiempo de pulso: la meseta confirma que es ALD verdadero.',
 l:'Fuera de la ventana de temperatura de ALD, el precursor puede condensar (muy frío) o descomponerse térmicamente (muy caliente), y el proceso deja de ser autolimitado.',s:'TEXTO'},
{m:'M6',g:'Efectos de tamaño',t:'Dispersión de luz: Rayleigh y Mie',f:'I_Rayleigh ∝ d⁶/λ⁴    (válida si d ≪ λ)',
 o:'Rayleigh resolvió el caso de partículas mucho menores que la longitud de onda, tratándolas como dipolos oscilantes inducidos. Mie resolvió exactamente las ecuaciones de Maxwell para esferas de cualquier tamaño, lo que es necesario cuando el diámetro es comparable a λ.',
 r:'Explica el sesgo del DLS hacia partículas grandes y por qué el plasmón de nanopartículas grandes requiere teoría de Mie y no la aproximación dipolar.',
 v:'I = intensidad dispersada | d = diámetro de la partícula (m) | λ = longitud de onda (m)',
 c:'La dependencia d⁶ es brutal: una partícula del doble de tamaño dispersa 64 veces más luz. Por eso unos pocos agregados dominan una medición de DLS.',
 l:'Rayleigh solo vale para d menor a aproximadamente λ/10. Por encima hay que usar Mie, que además predice el patrón angular y los colores estructurales.',s:'TEXTO'},

/* ---------- COMPLEMENTO M7 ---------- */
{m:'M7',g:'Óptica',t:'Función de Kubelka-Munk para muestras en polvo',f:'F(R) = (1 − R)²/(2R) = K/S',
 o:'Kubelka y Munk modelaron un medio dispersor grueso mediante dos flujos de luz opuestos, uno hacia adentro y otro hacia afuera. El cociente resultante entre absorción y dispersión es proporcional al coeficiente de absorción cuando la dispersión es constante.',
 r:'Es lo que permite aplicar el análisis de Tauc a polvos, donde no se puede medir transmitancia porque la muestra no es transparente.',
 v:'R = reflectancia difusa relativa a un estándar blanco (fracción) | K = coeficiente de absorción | S = coeficiente de dispersión',
 c:'Se sustituye F(R) en lugar de α en la ecuación de Tauc para obtener el band gap de un polvo.',
 l:'Supone capa ópticamente gruesa, dispersión isótropa y S independiente de la longitud de onda, lo que en la práctica solo se cumple de forma aproximada.',s:'TEXTO'},
{m:'M7',g:'Análisis térmico',t:'Interpretación cuantitativa de TGA',f:'% residuo = (m_final/m_inicial)×100    ;    % orgánico = 100 − % residuo inorgánico',
 o:'No es una ley física sino un balance de masa: cada escalón de pérdida corresponde a la volatilización o descomposición de un componente identificable.',
 r:'Combinado con DSC permite distinguir si un evento térmico implica pérdida de masa. Sirve para cuantificar el recubrimiento orgánico de una nanopartícula funcionalizada.',
 v:'m = masa (mg o %) | temperatura (°C) | velocidad de calentamiento (°C·min⁻¹, típicamente 10)',
 c:'Pérdida por debajo de 150 °C: agua y disolvente adsorbidos. Entre 200 y 500 °C: ligandos y materia orgánica. Por encima: descomposición de la fase inorgánica.',
 l:'La atmósfera cambia el resultado: en aire hay combustión y en nitrógeno solo pirólisis. Velocidades de calentamiento altas desplazan los eventos hacia temperaturas mayores.',s:'TEXTO'},
{m:'M7',g:'Fundamentos',t:'Relación señal-ruido y promediado',f:'S/N ∝ √n',
 o:'Al promediar n mediciones, la señal se suma coherentemente (crece con n) mientras el ruido aleatorio se suma en cuadratura (crece con √n). El cociente mejora por tanto con √n.',
 r:'Es la misma raíz de n que aparece en el error estándar de la media, y explica por qué acumular barridos mejora un espectro de RMN o de Raman.',
 v:'S = señal | N = ruido | n = número de barridos o réplicas promediadas',
 c:'Para duplicar la relación señal-ruido hay que cuadruplicar el tiempo de adquisición. Para mejorarla diez veces, cien veces más tiempo.',
 l:'Solo funciona con ruido aleatorio no correlacionado. El ruido sistemático y la deriva instrumental no se promedian: hay que corregirlos por otra vía.',s:'TEXTO'},

/* ---------- COMPLEMENTO M8 ---------- */
{m:'M8',g:'Dispositivos',t:'Parámetros de una celda solar',f:'PCE = (V_oc·I_sc·FF)/P_entrada    ;    FF = (V_mp·I_mp)/(V_oc·I_sc)',
 o:'Se obtienen de la curva corriente-voltaje bajo iluminación. El factor de llenado mide qué tanto se acerca esa curva al rectángulo ideal definido por el voltaje de circuito abierto y la corriente de cortocircuito.',
 r:'V_oc está acotado por el band gap del absorbedor, así que conecta directamente con la teoría de bandas de M4.',
 v:'PCE = eficiencia de conversión (%) | V_oc = voltaje de circuito abierto (V) | I_sc = corriente de cortocircuito (A o mA·cm⁻²) | FF = factor de llenado (fracción, típico 0.6–0.85) | P_entrada = 1000 W·m⁻² bajo el estándar AM1.5G',
 c:'La condición de prueba estándar es AM1.5G, 1000 W·m⁻², 25 °C. Reportar eficiencias fuera de esta condición no es comparable.',
 l:'Un band gap muy pequeño da mucha corriente pero poco voltaje, y viceversa: el compromiso produce el límite de Shockley-Queisser, cercano al 33 % para una sola unión.',s:'TEXTO'},
{m:'M8',g:'Microfluídica',t:'Número capilar y dielectroforesis',f:'Ca = µ·v/γ    ;    F_DEP ∝ r³·∇|E|²',
 o:'El número capilar compara fuerzas viscosas contra tensión superficial, y determina si una gota se deforma o se rompe en un microcanal. La fuerza dielectroforética surge de la interacción entre un campo eléctrico NO uniforme y el dipolo que ese mismo campo induce en la partícula.',
 r:'Ca gobierna la generación de gotas en microfluídica; la dielectroforesis complementa a la electroforesis para manipular partículas neutras.',
 v:'Ca = adimensional | µ = viscosidad (Pa·s) | v = velocidad (m·s⁻¹) | γ = tensión interfacial (N·m⁻¹) | r = radio de la partícula (m) | ∇|E|² = gradiente del cuadrado del campo (V²·m⁻³)',
 c:'A Ca bajo (menor a ~0.01) se forman gotas monodispersas en régimen de goteo; a Ca alto el chorro se alarga antes de romperse.',
 l:'La dielectroforesis depende de r³, así que pierde eficacia rápidamente en partículas por debajo de ~100 nm, donde el movimiento browniano compite.',s:'TEXTO'},

/* ---------- COMPLEMENTO M9 ---------- */
{m:'M9',g:'Transferencia',t:'Transferencia de oxígeno y k_La',f:'OTR = k_L·a·(C* − C_L)',
 o:'Es una ecuación de transferencia de masa con fuerza impulsora: el flujo es proporcional a la diferencia entre la concentración de saturación y la real, con un coeficiente que agrupa el transporte a través de la película líquida y el área interfacial disponible.',
 r:'Misma forma que la ley de enfriamiento de Newton y que la primera ley de Fick: flujo proporcional a un gradiente.',
 v:'OTR = velocidad de transferencia de oxígeno (mol·m⁻³·s⁻¹) | k_L = coeficiente de transferencia (m·s⁻¹) | a = área interfacial por volumen (m⁻¹) | C* = concentración de saturación (mol·m⁻³) | C_L = concentración en el líquido',
 c:'k_L y a se reportan siempre juntos como k_La (s⁻¹ o h⁻¹) porque son difíciles de separar experimentalmente. Aumenta con la agitación y con el flujo de aire.',
 l:'Es el criterio de escalamiento dominante en bioprocesos aerobios, pero irrelevante en reacciones sin fase gaseosa.',s:'TEXTO'},
{m:'M9',g:'Diseño experimental',t:'Diseño factorial y efectos',f:'N_corridas = 2^k    ;    Efecto principal = ȳ(nivel alto) − ȳ(nivel bajo)',
 o:'El diseño factorial evalúa todas las combinaciones de k factores en dos niveles. El efecto principal es simplemente la diferencia entre los promedios de las respuestas en cada nivel, promediando sobre los demás factores.',
 r:'Se apoya en estadística descriptiva y se analiza con ANOVA o regresión.',
 v:'k = número de factores | N = corridas mínimas sin réplicas | ȳ = respuesta promedio',
 c:'2³ = 8 corridas; 2⁵ = 32. Un factorial fraccionado 2^(5−1) reduce a 16 corridas a costa de confundir algunas interacciones.',
 l:'Con dos niveles solo se detectan efectos lineales. Para encontrar un óptimo hay que añadir puntos centrales o pasar a un diseño de superficie de respuesta.',s:'TEXTO'},
{m:'M9',g:'Transferencia',t:'Números adimensionales de transporte',f:'Nu = h·L/k    ;    Sh = k_m·L/D    ;    Pr = c_p·µ/k    ;    Sc = µ/(ρ·D)',
 o:'Todos salen de adimensionalizar las ecuaciones de conservación de energía y de especies. Nusselt y Sherwood comparan el transporte total contra el puramente difusivo; Prandtl y Schmidt comparan la difusividad de momento contra la de calor o de materia.',
 r:'Son la extensión natural del análisis dimensional que produce Reynolds; permiten usar correlaciones empíricas para diseñar intercambiadores y reactores.',
 v:'h = coeficiente de transferencia de calor (W·m⁻²·K⁻¹) | k = conductividad térmica (W·m⁻¹·K⁻¹) | k_m = coeficiente de transferencia de masa (m·s⁻¹) | D = difusividad (m²·s⁻¹) | c_p = calor específico (J·kg⁻¹·K⁻¹)',
 c:'La analogía calor-masa es directa: Nu ↔ Sh y Pr ↔ Sc. Una correlación de calor suele traducirse a masa sustituyendo los pares.',
 l:'Las correlaciones empíricas solo valen dentro del rango de Reynolds, geometría y fluidos para los que se ajustaron.',s:'TEXTO'},

/* ---------- COMPLEMENTO M10 ---------- */
{m:'M10',g:'Liberación',t:'Ecuación de Noyes-Whitney',f:'dC/dt = (D·A/(h·V))·(C_s − C)',

 v:'C = concentración en el medio (mol·L⁻¹) | D = coeficiente de difusión (m²·s⁻¹) | A = área superficial del sólido (m²) | h = espesor de la capa de difusión (m) | V = volumen del medio (L) | C_s = solubilidad de saturación',
 c:'Como A aparece en el numerador, micronizar o nanonizar un fármaco puede aumentar la velocidad de disolución uno o dos órdenes de magnitud. Es la base de las formulaciones nanocristalinas.',
 l:'Supone condiciones de sumidero (C ≪ C_s) y área constante. En la realidad el área cambia conforme la partícula se disuelve.',s:'TEXTO'},
{m:'M10',g:'Liberación',t:'Modelos de liberación: Higuchi y Korsmeyer-Peppas',f:'Higuchi: Q = k·√t    ;    Korsmeyer-Peppas: M_t/M_∞ = k·tⁿ',
 o:'Higuchi resolvió la difusión desde una matriz plana con fármaco disperso, obteniendo dependencia con la raíz del tiempo. Korsmeyer y Peppas propusieron una ley de potencias empírica cuyo exponente n permite diagnosticar el mecanismo dominante.',
 r:'Ambos derivan de la ley de Fick aplicada a geometrías específicas; se usan para caracterizar sistemas de liberación controlada.',
 v:'Q = cantidad liberada por unidad de área | M_t/M_∞ = fracción liberada acumulada | t = tiempo | n = exponente de liberación (adimensional)',
 c:'Para una lámina: n = 0.5 indica difusión fickiana; n = 1 indica liberación de orden cero controlada por relajación del polímero; valores intermedios indican transporte anómalo. Los valores límite cambian con la geometría (cilindro, esfera).',
 l:'El ajuste solo es válido en el primer 60 % de la liberación. No aplica a sistemas donde la matriz se erosiona simultáneamente.',s:'TEXTO'},
{m:'M10',g:'Farmacología',t:'Índice terapéutico y relación de Cheng-Prusoff',f:'IT = TD₅₀/ED₅₀    ;    K_i = IC₅₀/(1 + [S]/K_m)',
 o:'El índice terapéutico compara la dosis que produce toxicidad en la mitad de la población contra la que produce el efecto deseado. La relación de Cheng-Prusoff corrige el IC50 medido por la concentración de sustrato usada en el ensayo, para obtener una constante independiente del protocolo.',
 r:'Cheng-Prusoff conecta la farmacología con la cinética enzimática de Michaelis-Menten de M3.',
 v:'TD₅₀ = dosis tóxica en el 50 % | ED₅₀ = dosis efectiva en el 50 % | K_i = constante de inhibición (mol·L⁻¹) | [S] = concentración de sustrato del ensayo | K_m = constante de Michaelis',
 c:'Un IT grande significa un margen de seguridad amplio. Fármacos como la digoxina o la warfarina tienen IT estrecho y exigen monitoreo de concentración plasmática.',
 l:'IT se basa en promedios poblacionales y no captura la variabilidad individual. La corrección de Cheng-Prusoff supone inhibición competitiva.',s:'TEXTO'},

/* ===== AÑADIDAS TRAS LEER LOS PDF DE TUS CURSOS ===== */
{m:'M4',g:'Estructura atómica',t:'Oscilador armónico cuántico',f:'E_n = ħω(n + ½)    ;    ω = √(k/µ)    ;    ν̃ = (1/2πc)·√(k/µ)',pdf:1,
 o:'Es la solución exacta de la ecuación de Schrödinger para un potencial parabólico. A diferencia del clásico, la energía está cuantizada y el estado fundamental tiene energía de punto cero ħω/2, consecuencia del principio de incertidumbre.',
 r:'Es el modelo con el que se interpretan las bandas de IR y Raman, y el punto de partida del modelo de Lorentz para la respuesta óptica.',
 v:'E_n = energía del nivel n (J) | ħ = 1.055×10⁻³⁴ J·s | ω = frecuencia angular (rad·s⁻¹) | n = 0, 1, 2… | k = constante de fuerza del enlace (N·m⁻¹) | µ = masa reducida (kg) | ν̃ = número de onda (cm⁻¹)',
 c:'Los niveles están igualmente espaciados por ħω, así que la regla de selección Δn = ±1 predice una sola banda fundamental. Un enlace más fuerte (k mayor) o átomos más ligeros (µ menor) desplazan la banda a mayor número de onda.',
 l:'Un enlace real es anarmónico: los niveles se acercan al subir en energía y aparecen sobretonos. El modelo armónico falla cerca de la disociación.',s:'TEXTO'},
{m:'M8',g:'Respuesta óptica',t:'Oscilador armónico amortiguado forzado',f:'m·ẍ + mγ·ẋ + mω₀²·x = −eE₀·e^(−iωt)    →    x(ω) = (−eE₀/m)/(ω₀² − ω² − iγω)',pdf:1,
 o:'Se modela al electrón ligado como una masa unida por un resorte, con fricción que representa la pérdida de energía, forzada por el campo eléctrico de la luz. Es literalmente la segunda ley de Newton con tres términos.',
 r:'Al multiplicar el desplazamiento por la carga y la densidad de electrones se obtiene la polarización, y de ahí la función dieléctrica de Lorentz.',
 v:'m = masa del electrón (kg) | γ = constante de amortiguamiento (s⁻¹) | ω₀ = frecuencia natural de resonancia (rad·s⁻¹) | ω = frecuencia de la luz (rad·s⁻¹) | E₀ = amplitud del campo (V·m⁻¹)',
 c:'La amplitud se maximiza cuando ω ≈ ω₀: eso es la resonancia. El ancho del pico de resonancia lo fija γ.',
 l:'Es un modelo clásico. Predice bien la forma de las bandas de absorción pero no sus intensidades absolutas, que requieren tratamiento cuántico.',s:'TEXTO'},
{m:'M8',g:'Respuesta óptica',t:'Función dieléctrica de Lorentz y de Drude',f:'Lorentz: ε(ω) = 1 + ω_p²/(ω₀² − ω² − iγω)    ;    Drude: ε(ω) = 1 − ω_p²/(ω² + iγω)    ;    ω_p = √(n·e²/(ε₀·m*))',pdf:1,
 o:'Lorentz sale de sumar la contribución de todos los osciladores ligados a la polarización del medio. Drude es el mismo resultado con ω₀ = 0, es decir electrones libres sin fuerza restauradora: el caso de un metal.',
 r:'De ε(ω) se obtiene el índice de refracción complejo ñ = √ε = n + iκ, y de κ el coeficiente de absorción. La condición Re[ε] = −2ε_medio da la resonancia de plasmón de una nanoesfera.',
 v:'ε = función dieléctrica relativa (compleja, adimensional) | ω_p = frecuencia de plasma (rad·s⁻¹) | n = densidad de electrones libres (m⁻³) | m* = masa efectiva del electrón (kg) | γ = amortiguamiento (s⁻¹)',
 c:'Para ω < ω_p, Re[ε] es negativa y el metal refleja; para ω > ω_p se vuelve transparente. En metales típicos ω_p cae en el ultravioleta, por eso reflejan todo el visible.',
 l:'Drude puro falla en oro y plata en el visible porque ignora las transiciones interbanda, que son justamente las que dan al oro su color.',s:'TEXTO'},
{m:'M8',g:'Respuesta óptica',t:'Secciones transversales de extinción',f:'σ_ext = σ_abs + σ_sca    ;    Q = σ/(πr²)    ;    A = σ_ext·N·L/2.303',pdf:1,
 o:'Se define como el área efectiva que la partícula presenta al haz. Se obtiene resolviendo el problema de dispersión de una onda por una esfera (teoría de Mie) o, en el límite de partícula pequeña, con la aproximación dipolar.',
 r:'Conecta directamente con la ley de Beer-Lambert: la absorbancia medida en un espectrofotómetro es proporcional a σ_ext y a la concentración numérica de partículas.',
 v:'σ = sección transversal (m² o nm²) | Q = eficiencia adimensional | r = radio (m) | N = concentración numérica (m⁻³) | L = camino óptico (m)',
 c:'En resonancia plasmónica, Q_ext de una nanopartícula de oro puede superar 5, es decir la partícula «intercepta» varias veces su propia área geométrica.',
 l:'La aproximación dipolar solo vale si el diámetro es mucho menor que la longitud de onda (aproximadamente d < λ/10). Por encima hay que usar Mie completo, que incluye modos de orden superior.',s:'TEXTO'},
{m:'M8',g:'Óptica',t:'Ecuaciones de Fresnel y ángulo de Brewster',f:'r_s = (n₁cosθ_i − n₂cosθ_t)/(n₁cosθ_i + n₂cosθ_t)    ;    r_p = (n₂cosθ_i − n₁cosθ_t)/(n₂cosθ_i + n₁cosθ_t)    ;    R = |r|²    ;    tanθ_B = n₂/n₁',pdf:1,
 o:'Se obtienen imponiendo la continuidad de las componentes tangenciales de los campos eléctrico y magnético en la interfaz, a partir de las ecuaciones de Maxwell.',
 r:'Complementan a Snell: Snell da la dirección, Fresnel da cuánta luz se refleja y se transmite en cada polarización.',
 v:'r = coeficiente de reflexión de amplitud (adimensional, puede ser complejo) | R = reflectancia en intensidad | θ_i, θ_t = ángulos de incidencia y transmisión | θ_B = ángulo de Brewster',
 c:'En incidencia normal, R = ((n₁−n₂)/(n₁+n₂))². Aire-vidrio: R ≈ 4 % por cara, de ahí la necesidad de recubrimientos antirreflejantes.',
 l:'Suponen interfaz plana, lisa y medios homogéneos no magnéticos. Con absorción, los índices son complejos y los coeficientes también.',s:'TEXTO'},
{m:'M8',g:'Óptica',t:'Onda evanescente y profundidad de penetración',f:'d_p = λ/(2π·√(n₁²·sen²θ − n₂²))    ;    E(z) = E₀·e^(−z/d_p)',pdf:1,
 o:'Al superar el ángulo crítico, la ley de Snell exige un seno mayor que uno, lo que hace imaginario el vector de onda transmitido. El resultado físico es un campo que decae exponencialmente hacia el segundo medio sin propagarse.',
 r:'Es la base de la reflexión total interna atenuada (ATR) en FTIR, de la microscopía TIRF y de los sensores de plasmón de superficie.',
 v:'d_p = profundidad de penetración (m, típicamente 100–200 nm) | λ = longitud de onda en el vacío (m) | n₁, n₂ = índices de los medios | θ = ángulo de incidencia (mayor que el crítico)',
 c:'La penetración es máxima justo por encima del ángulo crítico y disminuye al aumentar el ángulo, lo que permite sintonizar la profundidad de muestreo.',
 l:'Solo existe en condición de reflexión total interna. Si hay un tercer medio muy cerca, la onda puede acoplarse y transmitir energía (efecto túnel óptico).',s:'TEXTO'},
{m:'M8',g:'Microfluídica',t:'Fuerza dielectroforética y factor de Clausius-Mossotti',f:'F_DEP = 2π·ε_m·r³·Re[f_CM]·∇|E|²    ;    f_CM = (ε*_p − ε*_m)/(ε*_p + 2ε*_m)',pdf:1,
 o:'Un campo no uniforme induce un dipolo en la partícula y actúa de forma desigual sobre sus dos extremos, generando una fuerza neta. El factor de Clausius-Mossotti compara la polarizabilidad compleja de partícula y medio.',
 r:'Complementa a la electroforesis: esta requiere carga neta, la dielectroforesis solo polarizabilidad, así que funciona con partículas neutras.',
 v:'ε_m = permitividad del medio (F·m⁻¹) | r = radio de la partícula (m) | ε* = permitividad compleja, ε* = ε − iσ/ω | ∇|E|² = gradiente del cuadrado del campo (V²·m⁻³)',
 c:'Si Re[f_CM] > 0 la partícula migra hacia el campo intenso (DEP positiva); si es negativo, se aleja (DEP negativa). El cambio de signo ocurre a la frecuencia de cruce, que depende de la conductividad de la partícula y del medio.',
 l:'Depende de r³, así que pierde eficacia por debajo de ~100 nm frente al movimiento browniano. En iDEP el gradiente lo generan postes aislantes, lo que evita electrólisis en los electrodos pero exige voltajes mayores.',s:'TEXTO'},
{m:'M8',g:'Microfluídica',t:'Calentamiento Joule en microcanales',f:'q̇ = σ·|E|²    ;    ΔT ≈ q̇·L²/(k_térmica)',pdf:1,
 o:'Es la disipación óhmica aplicada a un volumen de líquido conductor: la potencia por unidad de volumen es el producto de la conductividad por el cuadrado del campo.',
 r:'Compite directamente con la dielectroforesis y la electroforesis, que necesitan campos intensos.',
 v:'q̇ = potencia disipada por volumen (W·m⁻³) | σ = conductividad del medio (S·m⁻¹) | E = campo eléctrico (V·m⁻¹) | k = conductividad térmica del fluido (W·m⁻¹·K⁻¹)',
 c:'Como va con E², duplicar el voltaje cuadruplica el calentamiento. Bajar la conductividad del buffer es la vía más directa para mitigarlo.',
 l:'Un aumento de temperatura cambia viscosidad y conductividad, lo que retroalimenta el problema y puede generar flujos convectivos y gradientes que arruinan la separación.',s:'TEXTO'},
{m:'M8',g:'Dispositivos',t:'Figuras de mérito de un sensor',f:'S = dY/dX    ;    LOD = 3σ_ruido/S    ;    %histéresis = 100·ΔY_max/Y_fondo_escala',pdf:1,
 o:'Son definiciones operativas: la sensibilidad es la pendiente de la curva de respuesta, el límite de detección relaciona esa pendiente con el ruido, y la histéresis mide cuánto difiere la lectura al subir y al bajar la magnitud medida.',
 r:'Es la misma lógica de la curva de calibración analítica de M2, trasladada a un transductor físico.',
 v:'S = sensibilidad (unidades de salida por unidad de entrada) | Y = señal de salida | X = magnitud medida | σ_ruido = desviación estándar del ruido de fondo',
 c:'Otros parámetros a reportar: rango dinámico (cociente entre el máximo medible y el LOD), linealidad, tiempo de respuesta (t₉₀), selectividad, deriva y repetibilidad.',
 l:'Mayor sensibilidad no implica mejor LOD: si el ruido crece en la misma proporción, el límite de detección no mejora.',s:'TEXTO'},
{m:'M8',g:'MEMS',t:'Esfuerzo residual en película delgada (fórmula de Stoney)',f:'σ_f = (E_s·t_s²)/(6·(1−ν_s)·t_f·R)',pdf:1,

 r:'Aplica la teoría de vigas elásticas a la microfabricación; es lo que conecta el depósito de M6 con la mecánica de M8.',
 v:'σ_f = esfuerzo en la película (Pa) | E_s = módulo de Young del sustrato (Pa) | ν_s = coeficiente de Poisson | t_s, t_f = espesores de sustrato y película (m) | R = radio de curvatura medido (m)',
 c:'Se mide con perfilometría o interferometría antes y después del depósito. Un esfuerzo de tracción curva el sustrato de forma cóncava; uno de compresión, convexa.',
 l:'Supone película mucho más delgada que el sustrato, esfuerzo uniforme y comportamiento elástico. No aplica a películas gruesas o con gradiente de esfuerzo.',s:'TEXTO'},
{m:'M4',g:'Estructura atómica',t:'Formalismo cuántico: valores esperados y ecuación secular',f:'Ĥψ = Eψ    ;    ⟨A⟩ = ∫ψ*Âψ dτ    ;    det(H − ES) = 0',pdf:1,
 o:'Los observables se representan por operadores hermitianos y sus valores medibles son los valores propios. Al expandir la función de onda en una base finita, la ecuación de Schrödinger se convierte en un problema matricial de valores propios: la ecuación secular.',
 r:'Es exactamente el mismo problema de eigenvalores del álgebra lineal de M0, y el motor de todo cálculo de estructura electrónica.',
 v:'Ĥ = operador hamiltoniano | ψ = función de onda | E = energía (valor propio) | H = matriz del hamiltoniano en la base elegida | S = matriz de solapamiento | τ = coordenadas de integración',
 c:'El tamaño de la matriz lo fija el conjunto base: bases más grandes dan mejor energía a costa de un tiempo de cálculo que crece rápidamente con el número de funciones.',
 l:'Solo el átomo de hidrógeno y sistemas de un electrón tienen solución analítica. Todo lo demás requiere aproximaciones: Hartree-Fock, DFT o métodos post-Hartree-Fock.',s:'TEXTO'},

{m:'M8',g:'Sensores electroquímicos',t:'Ecuación de Randles-Ševčík',f:'i_p = 2.69×10⁵ · n^(3/2) · A · D^(1/2) · v^(1/2) · C    (25 °C, sistema reversible)',pdf:1,

 r:'Combina la ley de Fick con la ecuación de Nernst; es el análogo voltamperométrico de la ley de Cottrell.',
 v:'i_p = corriente de pico (A) | n = electrones transferidos | A = área electroactiva (cm²) | D = coeficiente de difusión (cm²·s⁻¹) | v = velocidad de barrido (V·s⁻¹) | C = concentración (mol·cm⁻³)',

 r:'Comparte origen con Randles-Ševčík; ambas describen transporte difusivo hacia un electrodo.',
 v:'i = corriente (A) | n = electrones | F = 96485 C·mol⁻¹ | A = área (cm²) | C = concentración (mol·cm⁻³) | D = difusividad (cm²·s⁻¹) | t = tiempo (s)',
 c:'Graficar i contra 1/√t da una recta que pasa por el origen: es la prueba diagnóstica de control difusivo puro.',
 l:'Falla a tiempos muy cortos (carga de la doble capa) y muy largos (aparece convección natural que rompe la difusión pura).',s:'TEXTO'},
{m:'M8',g:'Sensores electroquímicos',t:'Respuesta de un electrodo selectivo de ion (Nikolsky-Eisenman)',f:'E = E° + (2.303RT/z_i F)·log(a_i + Σ K_ij·a_j^(z_i/z_j))',pdf:1,

 r:'Deriva directamente de Nernst; el coeficiente de selectividad es la figura de mérito que decide si el electrodo sirve en una matriz real.',

 l:'Mide ACTIVIDAD, no concentración: a fuerza iónica alta ambas difieren, por eso se usa un ajustador de fuerza iónica. Una pendiente sub-nernstiana indica membrana degradada.',s:'TEXTO'},
{m:'M8',g:'Sensores electroquímicos',t:'Calibración y sensibilidad de un biosensor',f:'i = S·C + i₀    ;    S_normalizada = S/A    ;    LOD = 3σ_blanco/S',pdf:1,
