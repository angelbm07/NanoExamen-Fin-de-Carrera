var CASOS=[
{t:'Una síntesis de oro coloidal que salió mal',m:['M6','M7'],n:2,
 ctx:'Repites el método de Turkevich (reducción de HAuCl₄ con citrato en ebullición) para obtener nanopartículas de oro de ~15 nm. La disolución queda de un rojo apagado, casi violáceo, en lugar del rojo rubí esperado. Llevas la muestra a caracterizar y obtienes los datos de abajo.',
 datos:[['UV-Vis: λ máx del plasmón','545 nm, banda ancha, con hombro hacia 650 nm'],['DLS: diámetro hidrodinámico','85 nm, índice de polidispersidad 0.38'],['TEM: diámetro del núcleo','22 ± 9 nm, partículas sueltas y racimos'],['Potencial zeta','−12 mV'],['Referencia esperada','λ máx 520 nm, DLS ~25 nm con PDI < 0.1, zeta ≈ −35 mV']],
 etapas:[
  {q:'¿Qué te dice el corrimiento del plasmón de 520 a 545 nm y la aparición de un hombro hacia 650 nm?',
   pista:'La posición del plasmón depende del tamaño, la forma y el índice de refracción del entorno inmediato de la partícula.',
   sol:'Un corrimiento al rojo indica partículas mayores o, más probablemente aquí, acoplamiento plasmónico entre partículas que están muy cerca unas de otras. El hombro hacia 650 nm es la firma clásica del modo longitudinal de agregados o cadenas: cuando dos nanopartículas se aproximan, sus plasmones se acoplan y aparece una banda a mayor longitud de onda. El ensanchamiento de la banda principal confirma además una distribución de tamaños amplia. En pocas palabras: el espectro no dice solo «son más grandes», dice «están agregándose».'},
  {q:'DLS reporta 85 nm y TEM 22 nm. ¿Es una contradicción? ¿Cuál reportarías?',
   pista:'Piensa qué mide exactamente cada técnica y cómo pondera cada una las partículas grandes.',
   sol:'No es contradicción, pero la brecha es demasiado grande para explicarse solo por la capa de solvatación. DLS mide el diámetro hidrodinámico (núcleo más citrato adsorbido más capa de solvatación) y pondera por intensidad de dispersión, que escala como d⁶: unos pocos agregados de 100 nm dominan la señal. Un factor de casi 4 entre DLS y TEM, junto con un PDI de 0.38 (por encima de 0.2 ya se considera polidisperso), confirma agregación parcial. Hay que reportar ambos, indicando la técnica: TEM da el tamaño del núcleo, DLS da el estado real de la suspensión. Un histograma de TEM sobre al menos 200 partículas sería el respaldo cuantitativo.'},
  {q:'El potencial zeta es −12 mV cuando esperabas −35 mV. Explica qué implica desde la teoría DLVO.',
   pista:'DLVO suma repulsión electrostática y atracción de van der Waals. ¿Qué tan alta es la barrera con solo 12 mV?',
   sol:'El citrato adsorbido debe conferir carga negativa suficiente para que la repulsión electrostática levante una barrera de energía muy superior a la agitación térmica (del orden de 15–20 k_BT). Con |ζ| = 12 mV la barrera es baja y las colisiones brownianas la superan, así que las partículas coagulan. La regla práctica es que se necesita |ζ| > 30 mV para estabilidad. Este dato es la causa raíz: todo lo demás (plasmón corrido, DLS alto, racimos en TEM) es consecuencia.'},
  {q:'Enumera al menos tres causas experimentales concretas que expliquen el zeta bajo, y cómo las verificarías.',
   pista:'¿Qué controla la cantidad de citrato adsorbido y el espesor de la doble capa?',
   sol:'1) Relación citrato/oro insuficiente: menos citrato significa menos carga superficial y además menos agente reductor, lo que explica también el tamaño mayor al esperado. Se verifica repitiendo con exceso de citrato. 2) Fuerza iónica alta por agua no desionizada o material de vidrio con residuos de sal: comprime la doble capa (la longitud de Debye cae como 1/√I) y apantalla la repulsión. Se verifica midiendo la conductividad del agua y lavando el material con agua regia. 3) pH inadecuado: el citrato debe estar desprotonado para aportar carga; un pH bajo lo protona y baja el zeta. Se verifica midiendo el pH del medio. 4) Adición lenta del citrato o agitación deficiente: rompe la nucleación instantánea que exige el modelo de LaMer y produce partículas de distintas edades, lo que explica el 22 ± 9 nm.'},
  {q:'Propón el experimento corregido y los criterios de aceptación.',
   pista:'Define qué vas a medir y qué valor considerarás aceptable ANTES de sintetizar.',
   sol:'Material lavado con agua regia y enjuagado con agua tipo I; agua desionizada de conductividad menor a 1 µS·cm⁻¹; relación molar citrato:Au aumentada (por ejemplo de 3.5:1 a 5:1); adición rápida del citrato sobre la disolución en ebullición vigorosa, en un solo golpe, para forzar nucleación instantánea; agitación fuerte durante los primeros segundos. Criterios de aceptación definidos de antemano: λ máx entre 518 y 524 nm con banda simétrica y sin hombro; DLS con PDI menor a 0.15; potencial zeta más negativo que −30 mV; TEM con desviación estándar menor al 15 % del diámetro medio. Si el color vira de rojo a azul durante el almacenamiento, es agregación y se descarta el lote.'}
 ],
 cierre:'Este caso integra nucleación de LaMer, estabilidad DLVO, potencial zeta, plasmón superficial y el contraste entre DLS y TEM. Es prácticamente el reto de oro coloidal de tu curso de Fundamentación de propiedades.'},

{t:'Sintonizar el color de un punto cuántico',m:['M6','M4'],n:3,
 ctx:'Tienes una síntesis reproducible de puntos cuánticos de CdSe que emiten en 540 nm (verde). Tu proyecto necesita emisión en 620 nm (rojo-anaranjado) usando el mismo material, y además que el rendimiento cuántico suba.',
 datos:[['Band gap del CdSe masivo','1.74 eV'],['Emisión actual','540 nm'],['Emisión objetivo','620 nm'],['Radio actual estimado','2.0 nm'],['Rendimiento cuántico actual','12 %']],
 etapas:[
  {q:'Calcula la energía de confinamiento actual y la requerida.',
   pista:'Usa E(eV) = 1240/λ(nm) y resta el band gap del material masivo.',
   sol:'Emisión actual: E = 1240/540 = 2.30 eV. Energía de confinamiento actual = 2.30 − 1.74 = 0.56 eV. Emisión objetivo: E = 1240/620 = 2.00 eV. Confinamiento requerido = 2.00 − 1.74 = 0.26 eV. Es decir, hay que REDUCIR el confinamiento a menos de la mitad.'},
  {q:'¿El nanocristal debe ser más grande o más pequeño? Estima el radio necesario.',
   pista:'En la ecuación de Brus, el término de confinamiento escala como 1/R².',
   sol:'Menor confinamiento implica un cristal MÁS GRANDE. Tomando solo el término dominante, E_conf ∝ 1/R², así que R₂/R₁ = √(E₁/E₂) = √(0.56/0.26) = √2.15 = 1.47. Con R₁ = 2.0 nm resulta R₂ ≈ 2.9 nm, es decir un diámetro de unos 5.8 nm frente a los 4.0 nm actuales. Es una estimación de orden de magnitud: la ecuación de Brus completa incluye el término coulómbico que escala como 1/R y reduce ligeramente el resultado.'},
  {q:'¿Cómo lograrías experimentalmente ese aumento de tamaño manteniendo la distribución estrecha?',
   pista:'Recuerda la separación temporal entre nucleación y crecimiento.',
   sol:'Manteniendo el mismo evento de nucleación pero extendiendo la etapa de crecimiento: mayor tiempo de reacción, temperatura de crecimiento algo más alta, o inyecciones adicionales de precursor a velocidad controlada (crecimiento por semillas). Lo que NO debe hacerse es aumentar la concentración inicial de precursor, porque eso eleva la supersaturación y dispara nucleación secundaria, generando una segunda población y un espectro con dos bandas. El seguimiento se hace tomando alícuotas y midiendo UV-Vis y fluorescencia en el tiempo hasta alcanzar los 620 nm.'},
  {q:'Para subir el rendimiento cuántico, ¿qué modificación estructural propones y por qué funciona?',
   pista:'¿Dónde se pierden los excitones en un nanocristal desnudo?',
   sol:'Crecer una coraza de ZnS sobre el núcleo de CdSe (estructura core-shell). El ZnS tiene band gap mayor (3.6 eV frente a 1.74 eV) y alineación tipo I, lo que confina electrón y hueco dentro del núcleo y los aleja de la superficie. Las trampas superficiales, que son enlaces incompletos donde el excitón se recombina sin emitir luz, quedan pasivadas. En la práctica el rendimiento cuántico puede pasar de ~10 % a más del 50 %. Beneficios adicionales: mayor fotoestabilidad y menor liberación de Cd²⁺, lo que reduce la toxicidad.'},
  {q:'¿Qué caracterización mínima usarías para demostrar que lograste ambas cosas?',
   pista:'Necesitas evidencia de tamaño, de emisión y de que la coraza realmente creció.',
   sol:'UV-Vis y fluorescencia para confirmar la emisión en 620 nm y medir el ancho de banda a media altura (un FWHM menor a 30–35 nm indica buena monodispersidad). Rendimiento cuántico relativo contra un estándar como rodamina 6G. TEM de alta resolución para el tamaño y las franjas de red. DRX para confirmar la fase y, por Scherrer, contrastar el tamaño de cristalito. Para probar la coraza: corrimiento al rojo pequeño en la absorción tras el crecimiento del shell, EDS o ICP-MS para la relación Zn/Cd, y XPS para confirmar que el zinc está en la superficie y no como fase separada.'}
 ],
 cierre:'Integra confinamiento cuántico, ecuación de Brus, teoría de bandas, alineación de bandas en core-shell, nucleación y crecimiento, y la caracterización de M7.'},

{t:'Elegir la ruta química para nanopartículas de ZnO',m:['M6'],n:2,
 ctx:'Necesitas nanopartículas de ZnO de 20–30 nm, con cristalinidad alta, para un recubrimiento fotocatalítico. El presupuesto es limitado y el proceso debe poder escalarse después. Tienes tres rutas candidatas.',
 datos:[['Ruta A · Coprecipitación','Precursor de zinc + base a temperatura ambiente, seguido de calcinación a 450 °C'],['Ruta B · Sol-gel','Alcóxido o acetato de zinc en alcohol, hidrólisis controlada, secado y calcinación'],['Ruta C · Hidrotermal','Precursor en autoclave a 150 °C y presión autógena durante 6 h'],['Requisito','20–30 nm, fase wurtzita cristalina, distribución estrecha, escalable']],
 etapas:[
  {q:'¿Qué ventaja decisiva tiene la ruta hidrotermal frente a las otras dos para este requisito?',
   pista:'Piensa en qué le hace la calcinación a una nanopartícula.',
   sol:'La ruta hidrotermal produce material cristalino directamente, sin necesidad de calcinar. Esto importa mucho porque la calcinación a 450 °C provoca sinterización y crecimiento de grano: partículas que salían de 15 nm pueden terminar en 40–60 nm y parcialmente fusionadas, perdiendo área superficial. Como la fotocatálisis depende del área expuesta, esa pérdida es un problema directo. Además, en hidrotermal se controlan tamaño y morfología mediante temperatura, tiempo, pH y aditivos.'},
  {q:'¿Por qué la coprecipitación sigue siendo atractiva pese a esa desventaja?',
   pista:'Considera costo, equipo y volumen de producción.',
   sol:'Es la más barata y la más simple de escalar: no requiere autoclave ni alcóxidos costosos, funciona en reactor abierto con agitación y control de pH, y produce kilogramos con facilidad. Su debilidad es el control de tamaño y la necesidad de calcinar. En la práctica industrial se elige coprecipitación cuando la especificación de tamaño es holgada, y se invierte en hidrotermal cuando la cristalinidad y la morfología son críticas.'},
  {q:'Si eliges hidrotermal, ¿qué variables controlas y qué efecto esperas de cada una?',
   pista:'Piensa en términos de nucleación, crecimiento y control de facetas.',
   sol:'Temperatura: más alta acelera tanto nucleación como crecimiento y mejora la cristalinidad, pero por encima de cierto punto favorece partículas grandes. Tiempo: prolongarlo aumenta el tamaño y activa maduración de Ostwald, que ensancha la distribución. pH y concentración de base: gobiernan la supersaturación y, por tanto, la velocidad de nucleación; una supersaturación alta al inicio favorece muchos núcleos y partículas finales pequeñas. Aditivos y surfactantes (por ejemplo citrato, PVP o aminas): se adsorben en facetas específicas y controlan la morfología, que en ZnO puede ir de esferas a varillas o placas hexagonales. Relación de llenado del autoclave: determina la presión autógena.'},
  {q:'Diseña el plan de caracterización que demuestra que cumpliste la especificación.',
   pista:'Tamaño, fase, área y actividad son cuatro cosas distintas.',
   sol:'DRX para confirmar la fase wurtzita comparando contra la ficha de referencia y, por Scherrer sobre los picos principales, estimar el tamaño de cristalito. TEM o SEM de alta resolución para el tamaño y la morfología reales, con histograma sobre al menos 200 partículas. BET para el área superficial específica, que puede contrastarse con la estimación 6/(ρ·d). UV-Vis de reflectancia difusa con función de Kubelka-Munk y análisis de Tauc para verificar el band gap cercano a 3.3 eV. Finalmente, una prueba funcional: degradación de un colorante modelo bajo UV, midiendo la constante de velocidad aparente.'},
  {q:'Tu asesor te pide un argumento de una sola frase para justificar la ruta elegida ante un comité.',
   pista:'Debe unir el requisito técnico con la consecuencia económica.',
   sol:'«Elegimos la ruta hidrotermal porque entrega cristalinidad de fase wurtzita en un solo paso, evitando la calcinación que sinterizaría las partículas y destruiría el área superficial de la que depende la actividad fotocatalítica; el sobrecosto del autoclave se recupera al no necesitar un tratamiento térmico posterior ni un molido de reprocesamiento.»'}
 ],
 cierre:'Ejercita la comparación de rutas de síntesis química, el efecto de la calcinación, el control de nucleación y crecimiento, y la selección de técnicas de caracterización con criterio de aceptación.'},

{t:'Nanopartículas magnéticas para separación',m:['M6','M7'],n:2,
 ctx:'Debes producir nanopartículas de magnetita (Fe₃O₄) que puedan capturarse con un imán y volver a dispersarse sin quedar aglomeradas, para separar una proteína de un lisado celular.',
 datos:[['Ruta elegida','Coprecipitación de Fe²⁺ y Fe³⁺ en relación molar 1:2 con NH₄OH bajo atmósfera inerte'],['Tamaño objetivo','10–15 nm'],['Requisito clave','Comportamiento superparamagnético'],['Funcionalización','Debe unir un anticuerpo de captura']],
 etapas:[
  {q:'¿Por qué la relación Fe²⁺:Fe³⁺ debe ser 1:2 y por qué se trabaja en atmósfera inerte?',
   pista:'Escribe la fórmula de la magnetita como óxido mixto.',
   sol:'La magnetita es Fe₃O₄, que puede escribirse FeO·Fe₂O₃: contiene un Fe²⁺ por cada dos Fe³⁺, de ahí la estequiometría 1:2. La atmósfera inerte (nitrógeno o argón) evita que el oxígeno disuelto oxide el Fe²⁺ a Fe³⁺, lo que desplazaría el producto hacia maghemita (γ-Fe₂O₃) o hematita. Ambas tienen propiedades magnéticas distintas y menos favorables para este uso.'},
  {q:'¿Por qué el tamaño debe estar por debajo de ~20 nm y qué pasaría si fuera de 100 nm?',
   pista:'Piensa en dominios magnéticos y en qué ocurre al retirar el imán.',
   sol:'Por debajo del tamaño crítico de monodominio (del orden de 20–25 nm en magnetita), cada partícula tiene un solo dominio magnético y la agitación térmica invierte espontáneamente su momento: es superparamagnética. Esto significa que se magnetiza fuertemente en presencia de campo, lo que permite capturarla con un imán, pero al retirar el campo su magnetización remanente es cero y no se atraen entre sí, de modo que se redispersa. Una partícula de 100 nm sería multidominio y ferrimagnética, con remanencia: al quitar el imán quedaría magnetizada y las partículas se pegarían irreversiblemente formando cadenas.'},
  {q:'¿Cómo demuestras experimentalmente que son superparamagnéticas?',
   pista:'La firma está en la forma de un ciclo de histéresis.',
   sol:'Con magnetometría de muestra vibrante (VSM) o SQUID a temperatura ambiente: la curva de magnetización contra campo debe pasar por el origen SIN histéresis, es decir con coercitividad y remanencia prácticamente nulas, y saturarse a campos moderados. Complementariamente, las curvas ZFC-FC (enfriado sin campo y con campo) muestran un máximo en la temperatura de bloqueo, por debajo de la cual el momento queda congelado.'},
  {q:'La magnetita desnuda se agrega y se oxida. Propón la estrategia de recubrimiento y funcionalización.',
   pista:'Necesitas estabilidad coloidal, protección química y un punto de anclaje para el anticuerpo.',
   sol:'Recubrir con una capa de sílice por el método de Stöber, que aporta tres cosas: barrera contra la oxidación, estabilización coloidal por carga superficial (los silanoles dan zeta negativo) y una química de superficie muy bien conocida. Después silanizar con APTES para introducir grupos amino, y unir el anticuerpo por química EDC/NHS a través de sus grupos carboxilo. Alternativa: recubrir con dextrano o PEG para estabilización estérica, que tolera mejor la alta fuerza iónica de un lisado celular. Debe incluirse un bloqueo de la superficie remanente (BSA) para minimizar la adsorción inespecífica.'},
  {q:'¿Qué mediciones confirman que el recubrimiento funcionó?',
   pista:'Necesitas evidencia de la capa, de la carga y de que no perdiste el magnetismo.',
   sol:'TEM para ver el contraste núcleo-coraza y medir el espesor de sílice. Potencial zeta antes y después: debe cambiar hacia valores más negativos y estables en el intervalo de pH de trabajo. FTIR para las bandas Si–O–Si (~1080 cm⁻¹) y, tras silanizar, las de N–H. TGA para cuantificar la fracción orgánica añadida. VSM de nuevo, porque la coraza diluye la magnetización de saturación por unidad de masa: si baja demasiado, la captura magnética se vuelve lenta y hay que reducir el espesor.'}
 ],
 cierre:'Une coprecipitación, superparamagnetismo, método de Stöber, bioconjugación, estabilidad coloidal y un plan de caracterización con criterio funcional.'},

{t:'Elegir la ruta litográfica para un chip microfluídico',m:['M6','M8'],n:2,
 ctx:'Tu grupo necesita chips microfluídicos con canales de 50 µm de ancho y 50 µm de alto para un ensayo celular. En la etapa de investigación se requieren unos 20 chips por semana con cambios frecuentes de diseño; si el proyecto avanza, habrá que producir 50 000 unidades al año.',
 datos:[['Dimensión crítica','50 µm'],['Relación de aspecto','1:1'],['Etapa 1','20 chips por semana, diseño cambiante'],['Etapa 2','50 000 unidades por año, diseño congelado'],['Material biológico','Cultivo celular, requiere permeabilidad a gases en etapa 1']],
 etapas:[
  {q:'¿Se justifica litografía por haz de electrones para 50 µm? Argumenta.',
   pista:'Compara la dimensión crítica con el límite de resolución de cada técnica.',
   sol:'No, y por un margen enorme. El haz de electrones alcanza por debajo de 10 nm, es decir tres a cuatro órdenes de magnitud más resolución de la necesaria, pero escribe en serie punto por punto, con tiempos de horas por oblea y equipo carísimo. Usarlo para 50 µm es como cortar pan con un bisturí de microcirugía. La fotolitografía UV convencional resuelve cómodamente 50 µm con un simple alineador de contacto y una máscara de transparencia impresa, que puede costar unas decenas de dólares.'},
  {q:'Diseña el flujo de fabricación para la etapa 1.',
   pista:'Piensa en molde maestro más réplica.',
   sol:'Fotolitografía sobre oblea de silicio con resiste epóxico grueso tipo SU-8 para lograr 50 µm de altura en una sola capa, usando una máscara de transparencia impresa a alta resolución. Ese molde maestro se usa después para litografía suave: se vierte PDMS, se cura, se desmolda, se perforan los puertos y se sella contra vidrio mediante activación con plasma de oxígeno. Ventajas para investigación: el molde se reutiliza decenas de veces, una réplica tarda horas y cambiar el diseño solo cuesta una máscara nueva. Además el PDMS es permeable a O₂ y CO₂, lo que es indispensable para mantener células vivas dentro del chip.'},
  {q:'¿Qué limitaciones del PDMS debes advertir en el protocolo del ensayo celular?',
   pista:'El PDMS no es un material inerte.',
   sol:'Absorbe moléculas hidrofóbicas pequeñas, incluidos muchos fármacos y esteroides, lo que puede falsear una curva dosis-respuesta al reducir la concentración efectiva. Puede lixiviar oligómeros no curados hacia el medio. Es hidrofóbico por naturaleza, así que requiere tratamiento con plasma o recubrimiento para el llenado y para la adhesión celular, y esa hidrofilicidad se recupera con el tiempo. Es permeable al vapor de agua, lo que concentra el medio por evaporación en ensayos largos.'},
  {q:'Para la etapa 2 con 50 000 unidades al año, ¿cambia tu decisión?',
   pista:'¿Qué proceso replica en segundos en lugar de horas?',
   sol:'Sí. El PDMS no escala: cada réplica requiere curado de horas y desmoldeo manual. Para volumen se migra a moldeo por inyección o termoconformado en termoplásticos como COC, PMMA o poliestireno, con tiempos de ciclo de segundos y costo por pieza de centavos. El molde maestro metálico puede fabricarse por micromecanizado o, si se requiriera relación de aspecto muy alta, por proceso LIGA. El sellado pasa a ser por termocompresión o adhesivo. Contrapartida: se pierde la permeabilidad a gases del PDMS, así que el diseño del ensayo celular debe rediseñarse, por ejemplo incorporando ventilación.'},
  {q:'Resume la lógica de decisión en una regla general aplicable a otros proyectos.',
   pista:'Dos ejes: resolución requerida y volumen de producción.',
   sol:'La resolución requerida determina la técnica de patrón mínima viable y el volumen determina si se replica o se escribe. Regla práctica: escribe UNA vez el maestro con la técnica de mayor resolución que necesites (fotolitografía, haz de electrones o LIGA según la dimensión crítica) y después replica en paralelo con la técnica más barata compatible con el material y el volumen (litografía suave para decenas, nanoimpresión o moldeo por inyección para miles). Nunca uses una técnica serie para producción.'}
 ],
 cierre:'Integra fotolitografía, litografía suave, micromoldeado, LIGA, límites de resolución y criterios de escalamiento, más las limitaciones materiales del PDMS.'},

{t:'Recubrir el interior de un material mesoporoso',m:['M6'],n:3,
 ctx:'Tienes sílice mesoporosa tipo SBA-15 con poros cilíndricos de 8 nm de diámetro y quieres recubrir su superficie interna con alúmina para modificar la acidez superficial, conservando la porosidad.',
 datos:[['Diámetro de poro','8.0 nm'],['Área superficial BET','720 m²·g⁻¹'],['Espesor de alúmina deseado inicialmente','5 nm'],['Crecimiento por ciclo de ALD de Al₂O₃','0.11 nm por ciclo'],['Alternativa considerada','Sputtering de aluminio con oxidación posterior']],
 etapas:[
  {q:'Descarta o acepta el sputtering con un argumento físico.',
   pista:'¿Cómo viajan las partículas desde el blanco hasta el sustrato?',
   sol:'Se descarta. El sputtering es un proceso de línea de vista: las partículas arrancadas del blanco viajan en trayectorias esencialmente rectas y se depositan donde «ven» la fuente. En un material poroso eso significa que el material se acumula en la boca del poro y la tapa antes de recubrir el interior. El resultado sería una capa gruesa en la superficie externa, poros obstruidos y área superficial arruinada.'},
  {q:'Calcula cuántos ciclos de ALD necesitas para los 5 nm propuestos.',
   pista:'Espesor = número de ciclos × crecimiento por ciclo.',
   sol:'N = 5.0 nm ÷ 0.11 nm por ciclo ≈ 45 ciclos. En ALD el espesor se controla contando ciclos porque cada uno es una reacción superficial autolimitada que satura y se detiene sola, independientemente del tiempo de exposición.'},
  {q:'Verifica que la especificación de 5 nm sea físicamente viable en un poro de 8 nm. Este paso es el corazón del caso.',
   pista:'El recubrimiento crece desde TODAS las paredes del poro hacia adentro.',
   sol:'No es viable. En un poro cilíndrico la capa crece desde toda la circunferencia hacia el centro, así que el diámetro disponible se reduce en DOS veces el espesor: 8.0 − 2(5.0) = −2.0 nm. El poro se cerraría mucho antes de llegar a los 5 nm; de hecho se sellaría al alcanzar 4 nm de espesor. La especificación era imposible desde el planteamiento. Un espesor razonable sería 1.5 nm (13–14 ciclos), que deja un poro residual de 8.0 − 3.0 = 5.0 nm, todavía mesoporoso y accesible.'},
  {q:'¿Cómo confirmas que el recubrimiento es conformal y que el poro sigue abierto?',
   pista:'Necesitas una medida de porosidad antes y después.',
   sol:'Isotermas de adsorción de nitrógeno antes y después: el área BET debe bajar de forma moderada y coherente con la reducción geométrica, y la distribución de tamaño de poro por BJH debe desplazarse de 8 nm a unos 5 nm sin que desaparezca el escalón de condensación capilar. Si el área cae drásticamente y la isoterma pierde el rasgo mesoporoso, los poros se taparon. Complementariamente: DRX de ángulo bajo para verificar que el ordenamiento hexagonal de SBA-15 se conserva, y STEM con mapeo de EDS en un corte transversal para ver aluminio distribuido a lo largo de todo el poro y no solo en la boca.'},
  {q:'¿Qué le pasa al proceso si la temperatura sale de la ventana de ALD?',
   pista:'La autolimitación es lo que hace que ALD sea ALD.',
   sol:'Por debajo de la ventana, el precursor condensa sobre la superficie y el crecimiento por ciclo aumenta de forma descontrolada, perdiendo la autolimitación. Por encima, el precursor se descompone térmicamente y el proceso se comporta como un CVD, con crecimiento dependiente del tiempo de exposición y pérdida de conformalidad. La forma de verificar que estás dentro de la ventana es graficar el crecimiento por ciclo contra el tiempo de pulso: debe aparecer una meseta plana.'}
 ],
 cierre:'Caso con trampa deliberada: el error clásico es aplicar el espesor sin considerar que el poro se cierra desde ambos lados. Integra ALD, conformalidad, BET, BJH y la ventana de proceso.'},

{t:'De electrodo a biosensor de glucosa',m:['M8','M2'],n:3,
 ctx:'Modificas un electrodo de pasta de grafito con nanopartículas metálicas electrodepositadas y glucosa oxidasa, para construir un sensor amperométrico de glucosa. Debes caracterizarlo y reportar sus figuras de mérito.',
 datos:[['Área geométrica del electrodo','0.070 cm²'],['Sonda para voltamperometría cíclica','Ferricianuro 1.0 mM, D = 6.7×10⁻⁶ cm²·s⁻¹, n = 1'],['Velocidad de barrido','0.050 V·s⁻¹'],['Calibración obtenida','i (µA) = 12.4 · C (mM) + 0.8'],['Desviación estándar del blanco','0.15 µA'],['K_m aparente de la enzima inmovilizada','8.5 mM']],
 etapas:[
  {q:'Calcula la corriente de pico esperada con Randles-Ševčík y comenta qué harías si midieras bastante más.',
   pista:'Cuidado con las unidades de concentración: la fórmula pide mol·cm⁻³.',
   sol:'C = 1.0 mM = 1.0×10⁻⁶ mol·cm⁻³. i_p = 2.69×10⁵ · (1)^1.5 · 0.070 · (6.7×10⁻⁶)^0.5 · (0.050)^0.5 · 1.0×10⁻⁶. Paso a paso: 2.69×10⁵ × 0.070 = 1.883×10⁴; √(6.7×10⁻⁶) = 2.588×10⁻³; √0.050 = 0.2236. Producto: 1.883×10⁴ × 2.588×10⁻³ = 48.7; × 0.2236 = 10.9; × 1.0×10⁻⁶ = 1.09×10⁻⁵ A ≈ 10.9 µA. Si midieras, por ejemplo, 25 µA, la interpretación es que el área ELECTROACTIVA real es mayor que la geométrica: las nanopartículas depositadas aumentaron la rugosidad y por tanto la superficie disponible. Se despeja A de la ecuación y se reporta ese valor como área electroactiva.'},
  {q:'Reporta la sensibilidad normalizada y el límite de detección.',
   pista:'Normaliza por área y usa el criterio de 3σ.',
   sol:'Sensibilidad bruta S = 12.4 µA·mM⁻¹ (la pendiente de la calibración). Normalizada por área geométrica: 12.4 / 0.070 = 177 µA·mM⁻¹·cm⁻². LOD = 3σ_blanco/S = 3(0.15)/12.4 = 0.036 mM = 36 µM. LOQ = 10(0.15)/12.4 = 0.12 mM. Reportar la sensibilidad normalizada es indispensable para comparar contra otros trabajos: comparar sensibilidades brutas entre electrodos de distinta área no significa nada.'},
  {q:'La glucosa en sangre de un paciente sano está entre 4 y 6 mM y en un diabético puede superar 20 mM. Con K_m aparente de 8.5 mM, ¿tu sensor sirve para todo ese rango?',
   pista:'Piensa en la forma de la curva de Michaelis-Menten y dónde deja de ser lineal.',
   sol:'Parcialmente. La respuesta es aproximadamente lineal mientras la concentración sea bastante menor que K_m, es decir hasta unos 2–3 mM en el caso estricto, y con tolerancia razonable hasta cerca de K_m. Por encima de 8.5 mM la enzima empieza a saturarse y la curva se aplana: la sensibilidad cae y la incertidumbre crece justamente en el rango clínicamente crítico. Soluciones: aumentar la carga enzimática, usar una membrana externa que limite la difusión de glucosa hacia la enzima (lo que extiende artificialmente el rango lineal), diluir la muestra, o calibrar con un modelo no lineal tipo Michaelis-Menten en lugar de una recta.'},
  {q:'En sangre real hay ácido ascórbico, ácido úrico y paracetamol. ¿Qué problema causan y cómo lo resuelves?',
   pista:'Son especies electroactivas a potenciales similares.',
   sol:'Se oxidan directamente en el electrodo a potenciales cercanos al de detección del peróxido, lo que suma corriente que no proviene de la glucosa y produce lecturas falsamente altas. Estrategias: 1) bajar el potencial de trabajo usando un mediador redox (sensor de segunda generación) que opere a potencial menos oxidante, donde los interferentes no reaccionan; 2) recubrir con una membrana permselectiva como Nafion, que repele aniones, o acetato de celulosa, que discrimina por tamaño; 3) usar un electrodo de referencia diferencial sin enzima y restar su señal. La validación se hace con muestras dopadas y ensayos de recuperación.'},
  {q:'Enumera las figuras de mérito completas que debe incluir tu reporte.',
   pista:'Sensibilidad y LOD no bastan.',
   sol:'Sensibilidad (bruta y normalizada por área), rango lineal con su coeficiente de determinación, límite de detección y de cuantificación, tiempo de respuesta (habitualmente t₉₅), selectividad frente a los interferentes evaluados con su porcentaje de señal relativa, repetibilidad (desviación relativa de mediciones sucesivas con el mismo electrodo), reproducibilidad entre electrodos fabricados por separado, estabilidad operacional y de almacenamiento (porcentaje de señal retenida tras días o semanas), y recuperación en matriz real.'}
 ],
 cierre:'Es el caso central de tu curso de Aplicación de nanodispositivos. Integra voltamperometría cíclica, Randles-Ševčík, electrodeposición, cinética enzimática, calibración analítica y figuras de mérito.'},

{t:'Un electrodo selectivo de ion que perdió pendiente',m:['M2','M8'],n:2,
 ctx:'Usas un electrodo selectivo de nitrato para monitorear agua de riego. Al calibrarlo obtienes una pendiente menor a la teórica y las lecturas en muestra real no cuadran con el laboratorio de referencia.',
 datos:[['Pendiente medida','−44 mV por década'],['Pendiente teórica a 25 °C','−59.2 mV por década para ion monovalente'],['Coeficiente de selectividad frente a cloruro','K = 4×10⁻²'],['Muestra real','Nitrato ≈ 1×10⁻⁴ M, cloruro ≈ 5×10⁻³ M'],['Fuerza iónica de la muestra','Variable, no controlada']],
 etapas:[
  {q:'¿Qué significa una pendiente de 44 en lugar de 59.2 mV por década?',
   pista:'La pendiente teórica sale de 2.303RT/zF.',
   sol:'Es una respuesta sub-nernstiana. La pendiente teórica 2.303RT/F a 298 K vale 59.2 mV por década para z = 1, con signo negativo por tratarse de un anión. Obtener 44 mV indica que la membrana no está funcionando idealmente: causas típicas son envejecimiento o lixiviación del ionóforo, contaminación o adsorción en la superficie de la membrana, una capa de acondicionamiento agotada, o burbujas y contacto deficiente en la unión líquida. Un electrodo con pendiente por debajo de aproximadamente 50 mV por década debe reacondicionarse o reemplazarse.'},
  {q:'Estima el error que introduce el cloruro con el coeficiente de selectividad dado.',
   pista:'Compara el término del interferente contra la actividad del analito en la ecuación de Nikolsky-Eisenman.',
   sol:'El término del interferente es K × a(Cl⁻) = 4×10⁻² × 5×10⁻³ = 2×10⁻⁴. La actividad del nitrato es 1×10⁻⁴. Es decir, el cloruro contribuye al potencial DOS VECES más que el propio analito: el electrodo estaría reportando aproximadamente el triple de la concentración real de nitrato. En estas condiciones la medición no es utilizable sin corrección.'},
  {q:'¿Qué haces con la fuerza iónica variable?',
   pista:'El electrodo no mide concentración.',
   sol:'El electrodo responde a la ACTIVIDAD, no a la concentración, y el coeficiente de actividad depende de la fuerza iónica. Si esta varía entre muestras y entre patrones, la calibración deja de ser válida. La solución estándar es añadir un ajustador de fuerza iónica total (ISA) en la misma proporción a todos los estándares y a todas las muestras: al fijar la fuerza iónica en un valor alto y común, el coeficiente de actividad se vuelve constante y la lectura se puede leer directamente como concentración.'},
  {q:'Propón el protocolo corregido completo.',
   pista:'Reacondicionar, controlar matriz, y elegir la estrategia de calibración adecuada.',
   sol:'1) Reacondicionar la membrana según el fabricante y volver a calibrar; aceptar el electrodo solo si la pendiente está entre 54 y 60 mV por década. 2) Añadir ISA a patrones y muestras por igual. 3) Dado el nivel de interferencia del cloruro, calibrar por adición de estándar directamente sobre la muestra, de modo que la matriz sea la misma en el patrón y en el analito. 4) Verificar con un material de referencia o contra un método independiente como cromatografía iónica. 5) Reportar el intervalo lineal, el límite de detección y la pendiente obtenida en cada sesión de calibración, no solo el valor final.'}
 ],
 cierre:'Conecta la ecuación de Nernst con la práctica analítica real: pendiente, actividad frente a concentración, selectividad y estrategia de calibración en matriz compleja.'},

{t:'Identificar un polvo blanco desconocido',m:['M7','M4'],n:2,
 ctx:'Recibes un polvo blanco sin etiqueta que alguien dejó en el laboratorio con la nota «nanopartículas, caracterizar». Debes decir qué es, qué tamaño tiene, si es puro y si sirve para fotocatálisis.',
 datos:[['DRX: picos principales','2θ = 25.3°, 37.8°, 48.0°, 53.9°, 55.1°'],['DRX: FWHM del pico principal','0.42° (0.00733 rad), Cu Kα λ = 0.15406 nm'],['TGA','−3 % antes de 150 °C; −7 % entre 250 y 450 °C; estable después'],['BET','85 m²·g⁻¹'],['UV-Vis de reflectancia difusa','borde de absorción en 388 nm'],['Densidad del material sospechado','3.9 g·cm⁻³']],
 etapas:[
  {q:'¿Qué fase es y cómo lo justificas?',
   pista:'El conjunto de ángulos es una huella digital. El borde de absorción confirma.',
   sol:'El pico intenso en 25.3° acompañado de 37.8° y 48.0° es el patrón característico de TiO₂ en fase anatasa, correspondiente a los planos (101), (004) y (200). La confirmación cruzada viene del borde de absorción: E_g = 1240/388 = 3.20 eV, exactamente el band gap reportado para anatasa (el rutilo tiene 3.0 eV y su pico principal aparece en 27.4°). La identificación formal se hace comparando contra la ficha de la base de datos cristalográfica.'},
  {q:'Estima el tamaño de cristalito por Scherrer.',
   pista:'Recuerda que θ es la mitad del 2θ que reporta el difractómetro.',
   sol:'2θ = 25.3°, así que θ = 12.65° y cos θ = 0.9757. D = Kλ/(β cos θ) = (0.9 × 0.15406)/(0.00733 × 0.9757) = 0.13865/0.007152 = 19.4 nm. Es decir, cristalitos de aproximadamente 19 nm.'},
  {q:'Contrasta ese tamaño con el que predice el área BET. ¿Coinciden?',
   pista:'Para esferas no porosas, SSA = 6/(ρ·d).',
   sol:'Despejando: d = 6/(ρ·SSA). Con ρ = 3.9 g·cm⁻³ y SSA = 85 m²·g⁻¹ = 85×10⁴ cm²·g⁻¹: d = 6/(3.9 × 85×10⁴) = 6/3.315×10⁶ = 1.81×10⁻⁶ cm = 18.1 nm. La coincidencia con los 19.4 nm de Scherrer es excelente. Eso indica que las partículas son esencialmente monocristalinas, no porosas y poco aglomeradas: si estuvieran sinterizadas, el área BET sería mucho menor que la predicha y el tamaño calculado por BET saldría muy por encima del de Scherrer.'},
  {q:'Interpreta el TGA y di qué implica para la pureza.',
   pista:'Cada escalón corresponde a algo distinto.',
   sol:'La pérdida del 3 % por debajo de 150 °C es agua y disolvente fisisorbidos, normal en un óxido de alta área. La pérdida del 7 % entre 250 y 450 °C corresponde a materia orgánica: restos de precursor, surfactante o agente estabilizante de la síntesis. Es decir, el polvo NO está puro: contiene alrededor de 7 % de orgánico. Para fotocatálisis eso importa, porque el recubrimiento orgánico bloquea sitios superficiales activos y además se degradará bajo UV, cambiando el desempeño con el tiempo.'},
  {q:'¿Recomiendas usarlo para fotocatálisis? Da la recomendación completa.',
   pista:'Fase, tamaño, área, pureza y limitación espectral.',
   sol:'La fase, el tamaño y el área son favorables: anatasa es la fase más fotoactiva, 19 nm da buena área y 85 m²·g⁻¹ es razonable. Recomendación: calcinar a temperatura moderada (400–450 °C) para eliminar el orgánico, verificando por TGA que la pérdida desapareció y por DRX que no hubo transformación a rutilo ni crecimiento excesivo de cristalito. Advertencia importante: con band gap de 3.20 eV solo se activa por debajo de 388 nm, es decir con UV, que representa menos del 5 % del espectro solar. Si la aplicación es bajo luz solar o interior, hay que considerar dopaje (por ejemplo con nitrógeno) o acoplamiento con otro semiconductor para extender la respuesta al visible. Falta además verificar la actividad real con una prueba funcional de degradación de un colorante modelo.'}
 ],
 cierre:'Recorre la secuencia completa de caracterización con contraste cruzado entre técnicas, que es exactamente lo que evalúa el módulo M7: DRX, Scherrer, BET, TGA, UV-Vis y Tauc.'},

{t:'Escalar la síntesis de nanopartículas de 50 mL a 5 L',m:['M9','M6'],n:3,
 ctx:'Tu síntesis coloidal funciona perfectamente en matraz de 50 mL con distribución estrecha. Al reproducirla en reactor de 5 L la distribución se ensancha y aparece una segunda población de partículas grandes.',
 datos:[['Escala inicial','50 mL, agitador magnético'],['Escala final','5 L, reactor con impulsor'],['Factor de volumen','×100'],['Criterio propuesto por el asesor','Mantener P/V constante'],['Síntomas','Distribución bimodal, tamaño medio mayor, lote a lote irreproducible']],
 etapas:[
  {q:'Calcula cómo cambian el diámetro del impulsor y la velocidad de agitación si mantienes P/V constante.',
   pista:'V ∝ D³ y P/V ∝ N³D².',
   sol:'Si el volumen aumenta 100 veces y la geometría es similar, D escala como el volumen a la un tercio: D₂/D₁ = 100^(1/3) = 4.64. Mantener P/V constante exige N³D² = constante, de donde N ∝ D^(−2/3). Entonces N₂/N₁ = 4.64^(−2/3) = 1/2.79 = 0.358, es decir el agitador debe girar a solo el 36 % de las revoluciones originales. La velocidad de punta, proporcional a N·D, cambia como D^(1/3) = 4.64^(1/3) = 1.67: aumenta 67 %.'},
  {q:'Explica por qué ese criterio, aun bien aplicado, no resuelve tu problema.',
   pista:'¿Qué exige el modelo de LaMer y qué le pasa al tiempo de mezclado al escalar?',
   sol:'Porque el paso limitante de esta síntesis no es la potencia disipada sino la HOMOGENEIDAD al momento de la nucleación. El modelo de LaMer exige que la supersaturación se alcance de golpe y de forma uniforme en todo el volumen, para que la nucleación ocurra en un solo evento y todos los núcleos tengan la misma edad. Al escalar, el tiempo de mezclado crece: la adición de precursor ya no se distribuye instantáneamente y aparecen zonas locales de alta supersaturación que nuclean antes que el resto. Eso genera núcleos de distintas edades, es decir la distribución bimodal que observas. Conservar P/V no garantiza tiempo de mezclado constante.'},
  {q:'¿Qué criterio deberías conservar entonces, y qué otros factores empeoran al escalar?',
   pista:'Identifica el paso limitante y conserva ESE.',
   sol:'Deberías conservar el tiempo de mezclado, o al menos el tiempo de micromezclado en la zona de inyección. Otros factores que empeoran: 1) la relación área de intercambio térmico sobre volumen cae como 1/D, así que calentar o enfriar uniformemente es más lento y aparecen gradientes térmicos que también afectan la nucleación; 2) el tiempo total de proceso se alarga, dando más margen a la maduración de Ostwald, que ensancha aún más la distribución; 3) el esfuerzo cortante cambia y puede alterar la adsorción del estabilizante.'},
  {q:'Propón dos soluciones de ingeniería, una conservando el batch y otra cambiando de paradigma.',
   pista:'Una es mejorar el mezclado; la otra es dejar de escalar por volumen.',
   sol:'Conservando batch: inyectar el precursor por múltiples puntos simultáneos en lugar de uno solo, usar un mezclador en T o un rotor-estator de alto cizallamiento en la zona de adición, rediseñar impulsor y deflectores para minimizar el tiempo de mezclado, y mejorar el intercambio térmico con serpentín interno además del encamisado. Cambiando de paradigma: pasar a un reactor de flujo continuo, donde el volumen de reacción instantáneo permanece pequeño (milímetros de canal) y la escala se logra por tiempo de operación, no por tamaño. En flujo continuo el mezclado es rápido y reproducible por diseño, y cada elemento de fluido experimenta la misma historia térmica y de concentración. Es la respuesta industrial estándar a este problema.'},
  {q:'Define cómo demostrarías que el escalamiento fue exitoso.',
   pista:'Necesitas comparar distribuciones y probar reproducibilidad.',
   sol:'Comparar distribuciones de tamaño por DLS (PDI) y por TEM con histograma sobre al menos 200 partículas en ambas escalas, verificando que la media y la desviación estándar coinciden dentro de un margen definido de antemano. Medir experimentalmente el tiempo de mezclado en ambos reactores con un trazador colorimétrico o conductimétrico. Producir al menos tres lotes consecutivos a escala grande y evaluar la reproducibilidad lote a lote. Seguir la reacción en línea con UV-Vis para comparar la cinética de aparición del plasmón. Y fijar criterios de aceptación numéricos antes de correr los lotes.'}
 ],
 cierre:'Es el caso que más se parece a una pregunta integradora de examen: obliga a reconocer que el criterio de escalamiento correcto depende del paso limitante, y conecta M9 con la nucleación de M6.'},

{t:'Diseñar un recubrimiento autolimpiable',m:['M10','M4','M6'],n:3,
 ctx:'Un fabricante de vidrio arquitectónico te pide un recubrimiento autolimpiable. Propones TiO₂ anatasa nanoestructurado y debes justificar el diseño con números.',
 datos:[['Band gap del TiO₂ anatasa','3.20 eV'],['Ángulo de contacto sobre superficie lisa del recubrimiento','105°'],['Factor de rugosidad r alcanzable','1.6'],['Fracción de área sólida en contacto con la gota (f) en régimen Cassie','0.15'],['Requisito del cliente','Funcionar con luz solar, mantener transparencia visible']],
 etapas:[
  {q:'Calcula la longitud de onda máxima que activa el fotocatalizador y evalúa si cumple el requisito solar.',
   pista:'E(eV) = 1240/λ(nm).',
   sol:'λ = 1240/3.20 = 387.5 nm. Es decir, el TiO₂ anatasa solo se activa con radiación por debajo de ~388 nm, que es ultravioleta cercano. La radiación UV representa aproximadamente el 3–5 % del espectro solar que llega a la superficie terrestre, así que el recubrimiento funcionará, pero aprovechando una fracción muy pequeña de la luz disponible. No cumple plenamente el requisito de «funcionar con luz solar» en el sentido de aprovecharla bien.'},
  {q:'Calcula el ángulo de contacto en régimen de Wenzel con la rugosidad dada.',
   pista:'cos θ_W = r · cos θ_liso.',
   sol:'cos 105° = −0.2588. cos θ_W = 1.6 × (−0.2588) = −0.414. θ_W = arccos(−0.414) = 114.5°. La rugosidad amplifica la hidrofobicidad ya existente, pero solo llega a 114.5°: no es suficiente para superhidrofobicidad.'},
  {q:'Calcula ahora el ángulo en régimen Cassie-Baxter y compara.',
   pista:'cos θ_C = f(cos θ_liso + 1) − 1.',
   sol:'cos θ_C = 0.15 × (−0.2588 + 1) − 1 = 0.15 × 0.7412 − 1 = 0.1112 − 1 = −0.8888. θ_C = arccos(−0.8888) = 152.7°. Por encima de 150° ya es superhidrofóbica: la gota rueda y arrastra la suciedad, que es el efecto loto. La diferencia con Wenzel es enorme y viene de que en Cassie la gota se apoya sobre aire atrapado, tocando solo el 15 % de área sólida.'},
  {q:'Aquí hay un conflicto de diseño que debes detectar. ¿Cuál es?',
   pista:'¿Qué le hace la fotocatálisis del TiO₂ a la superficie, en términos de mojabilidad?',
   sol:'El TiO₂ irradiado con UV se vuelve SUPERHIDROFÍLICO, no hidrofóbico: es un fenómeno bien documentado de la fotoactivación. Es decir, los dos mecanismos que quieres combinar apuntan en direcciones opuestas. No puedes tener simultáneamente una superficie superhidrofóbica y un TiO₂ fotoactivado en la misma capa expuesta. Hay que elegir arquitectura: o bien la vía superhidrofóbica (rugosidad más química de baja energía superficial, con el TiO₂ enterrado o ausente), o bien la vía superhidrofílica, que es la que usa la industria del vidrio: el TiO₂ degrada la materia orgánica por fotocatálisis y el agua forma una película continua que se desliza y arrastra los residuos por debajo, con el beneficio adicional de evitar el empañamiento.'},
  {q:'Emite la recomendación final con sus limitaciones y el plan de validación.',
   pista:'Elige vía, reconoce límites y define pruebas.',
   sol:'Recomendación: vía superhidrofílica fotocatalítica, que es compatible con el vidrio arquitectónico y con la transparencia requerida. Capa delgada de TiO₂ anatasa (del orden de decenas de nanómetros para no dispersar luz visible), aplicada por dip-coating o spray, con una capa barrera de SiO₂ entre el vidrio y el TiO₂ para evitar la difusión de sodio desde el vidrio, que envenena la actividad fotocatalítica. Limitaciones a declarar: activación solo bajo UV, por lo que el desempeño cae en interiores o días muy nublados; durabilidad mecánica frente a abrasión; y la posibilidad de que la fotocatálisis degrade cualquier aglutinante orgánico del propio recubrimiento, por lo que la matriz debe ser inorgánica. Validación: DRX de ángulo rasante para confirmar anatasa; ángulo de contacto antes y después de irradiar con UV, esperando la caída hacia valores muy bajos; degradación de un colorante modelo o de ácido esteárico como prueba funcional de actividad; transmitancia visible por UV-Vis para verificar que se conserva la transparencia; y ensayo de abrasión normalizado.'}
 ],
 cierre:'Caso con un conflicto de diseño escondido. Integra band gap, fotocatálisis, Wenzel, Cassie-Baxter, recubrimientos y criterios de producto de M10.'},

{t:'Sílice mesoporosa para liberación controlada',m:['M10','M6','M7'],n:3,
 ctx:'Desarrollas un sistema de liberación basado en sílice mesoporosa SBA-15 cargada con un fármaco poco soluble. Debes cuantificar la carga, caracterizar el sistema y describir la liberación.',
 datos:[['Área BET de la sílice vacía','720 m²·g⁻¹'],['Diámetro de poro','6.0 nm'],['Área BET tras la carga','180 m²·g⁻¹'],['TGA: pérdida orgánica','22 % en masa entre 200 y 500 °C'],['Perfil de liberación','Ajusta con M_t/M_∞ = k·t^n, con n = 0.48']],
 etapas:[
  {q:'¿Qué evidencia tienes de que el fármaco entró en los poros y no solo se quedó en la superficie externa?',
   pista:'Compara las áreas BET antes y después.',
   sol:'La caída del área BET de 720 a 180 m²·g⁻¹, es decir una reducción del 75 %, es la evidencia principal: si el fármaco estuviera solo adsorbido en la superficie externa, que representa una fracción mínima del área total de un material mesoporoso, el área apenas cambiaría. Una caída de esa magnitud solo se explica si los poros están ocupados. Se refuerza con la distribución de tamaño de poro por BJH, que debe mostrar reducción o desaparición del volumen mesoporoso, y con DRX de ángulo bajo, donde la intensidad de las reflexiones disminuye porque el contraste entre pared y poro se reduce al llenarse.'},
  {q:'Interpreta el TGA y calcula la carga de fármaco.',
   pista:'La sílice no se descompone en ese intervalo.',
   sol:'La sílice es térmicamente estable en el intervalo de 200 a 500 °C, así que toda la pérdida en esa región corresponde al fármaco. La carga es del 22 % en masa, es decir 220 mg de fármaco por gramo de material cargado, o expresado sobre la sílice: 22/78 = 0.28 g de fármaco por gramo de sílice. Conviene verificar con una segunda técnica independiente, por ejemplo extrayendo el fármaco con disolvente y cuantificando por UV-Vis o HPLC contra una curva de calibración.'},
  {q:'Con n = 0.48, ¿qué mecanismo de liberación tienes?',
   pista:'Compara contra los valores límite del modelo de Korsmeyer-Peppas.',
   sol:'Para geometría cilíndrica, n ≈ 0.45 corresponde a difusión fickiana pura y n = 0.89 a transporte de caso II controlado por relajación del polímero. Un valor de 0.48 está muy cerca del límite fickiano, lo que indica que la liberación está gobernada por la difusión del fármaco a través de los poros hacia el medio, sin erosión ni hinchamiento de la matriz. Es coherente con una matriz de sílice, que es rígida y no se hincha. Al ser prácticamente fickiano, también ajustaría bien al modelo de Higuchi, donde la fracción liberada es proporcional a la raíz del tiempo.'},
  {q:'El cliente pide liberación de orden cero, es decir constante en el tiempo. ¿Qué modificas?',
   pista:'La difusión fickiana da liberación rápida al inicio y lenta después. ¿Cómo aplanas eso?',
   sol:'La difusión pura produce un perfil con ráfaga inicial y desaceleración progresiva, porque la distancia de difusión crece. Para acercarse a orden cero: 1) funcionalizar la boca de los poros con grupos que actúen como puerta y liberen en respuesta a un estímulo (pH, redox o enzima), lo que además da especificidad de sitio; 2) recubrir las partículas con una membrana polimérica limitante de velocidad, de modo que el paso limitante sea el transporte a través de la membrana y no la difusión desde el poro; 3) reducir el diámetro de poro para aumentar la interacción fármaco-pared y frenar la salida; 4) modificar químicamente la superficie interna para aumentar la afinidad por el fármaco. Cualquiera de estas cambia el exponente n hacia valores mayores.'},
  {q:'¿Qué riesgo de traslación advertirías antes de pasar a ensayos in vivo?',
   pista:'Piensa en lo que le pasa a la partícula al entrar en un fluido biológico.',
   sol:'Que la caracterización en buffer no predice el comportamiento in vivo. Al entrar en sangre se forma la corona proteica, que cambia la identidad superficial de la partícula, puede taponar los poros modificando la cinética de liberación y redirige la biodistribución hacia hígado y bazo. También hay que evaluar la biodegradación de la sílice, que se disuelve lentamente a silicatos, y la nanotoxicología dependiente de tamaño y química superficial. La recomendación mínima es repetir la cinética de liberación en presencia de suero completo, caracterizar la corona proteica, y hacer estudios de biodistribución con partículas marcadas antes de invertir en eficacia.'}
 ],
 cierre:'Integra materiales mesoporosos, BET y BJH, TGA cuantitativo, modelos de liberación de Higuchi y Korsmeyer-Peppas, y la crítica de traslación in vitro a in vivo.'}
];

function temaDe(q){
  var lista=TEMAS[q.b]||[];
  for(var i=0;i<lista.length;i++){if(lista[i][1].test(q.q))return lista[i][0]}
  for(var j=0;j<lista.length;j++){
    for(var k=0;k<q.o.length;k++){if(lista[j][1].test(q.o[k]))return lista[j][0]}
  }

}

{m:'M0',t:'El lenguaje: unidades, órdenes de magnitud y análisis dimensional',dur:20,
 obj:['Convertir entre unidades sin dudar','Usar el análisis dimensional para descartar opciones antes de calcular','Estimar órdenes de magnitud y detectar resultados absurdos'],
 sec:[
  {t:'Por qué empezamos aquí',p:'Esta lección no cubre ningún módulo del examen y sin embargo es la más rentable de todas. En un examen de opción múltiple con reactivos numéricos, buena parte de las opciones incorrectas no lo son porque el concepto esté mal, sino porque las unidades no cierran o el orden de magnitud es imposible. Si dominas esto, entras a cada reactivo numérico con una ventaja que no depende de recordar la fórmula exacta.\n\nLa idea de fondo es simple: una ecuación física es una igualdad entre magnitudes, y solo pueden igualarse cosas que tengan las mismas dimensiones. Nadie suma metros con segundos. Esa restricción, que parece trivial, es una herramienta de verificación potentísima.'},
  {t:'Prefijos y la trampa del factor mil',p:'La nanotecnología vive entre 10⁻⁹ y 10⁻⁶ metros, así que los prefijos nano y micro aparecen todo el tiempo y confundirlos cambia el resultado por mil. Conviene tenerlos memorizados como una escalera: giga 10⁹, mega 10⁶, kilo 10³, mili 10⁻³, micro 10⁻⁶, nano 10⁻⁹, pico 10⁻¹².\n\nDos equivalencias que usarás constantemente: 1 nm = 10⁻⁹ m = 10 Å, y 1 nm = 10⁻⁷ cm. Esa segunda es la que más errores causa, porque muchas fórmulas de estado sólido piden centímetros. Cuando calcules la densidad teórica de un cristal a partir del parámetro de red en nanómetros, tienes que pasar a centímetros ANTES de elevar al cubo. Si lo haces después, el error es de 10²¹.'},
  {t:'Análisis dimensional en la práctica',p:'La técnica consiste en escribir cada magnitud con sus unidades y verificar que se cancelen hasta dejar las del resultado. Tomemos la ecuación de Scherrer, D = Kλ/(β·cosθ). K es adimensional, λ está en nanómetros, β en radianes (que también son adimensionales) y el coseno es un número puro. El resultado queda en nanómetros, que es lo que esperamos de un tamaño. Si en un reactivo una opción viniera en nm² o en s⁻¹, se descarta sin calcular.\n\nEl mismo procedimiento sirve al revés, para reconstruir una fórmula olvidada. Si sabes que el número de Reynolds es adimensional y que involucra densidad, velocidad, una dimensión y viscosidad, la única combinación que cancela unidades es ρvD/µ. No hace falta memorizarla.'},
  {t:'Órdenes de magnitud',p:'La segunda herramienta es preguntarte si el número tiene sentido físico antes de aceptarlo. Una nanopartícula mide decenas de nanómetros, no micrómetros. Un band gap vale unos pocos electronvolts, nunca cientos. Una constante de velocidad de primer orden tiene unidades de s⁻¹. El área superficial específica de un nanomaterial está en el rango de decenas a cientos de m²/g; si te sale 10⁶, algo está mal por un factor de conversión.\n\nEste hábito no es pereza, es control de calidad. En el laboratorio y en el examen, el error más caro no es el conceptual sino el aritmético que nadie revisó.'}
 ],
 clave:['Una ecuación solo iguala magnitudes con las mismas dimensiones; verificarlo descarta opciones sin calcular.','1 nm = 10⁻⁹ m = 10 Å = 10⁻⁷ cm. La conversión a centímetros es la fuente de error más frecuente.','El atajo E(eV) = 1240/λ(nm) sale de evaluar hc en unidades mixtas y aparece en todos los módulos.'],
 check:[
  {q:'Un compañero calcula la densidad teórica del aluminio (FCC, a = 0.405 nm, A = 26.98 g/mol) y obtiene 2.70 × 10²¹ g/cm³. ¿Qué hizo mal?',
   a:'Olvidó convertir el parámetro de red a centímetros antes de elevarlo al cubo. Con a = 4.05 × 10⁻⁸ cm, a³ = 6.64 × 10⁻²³ cm³ y el resultado correcto es 2.70 g/cm³. El factor de error es exactamente 10²¹, que es (10⁷)³.'},
  {q:'Sin recordar la fórmula, ¿qué combinación de ΔP, r, µ y L puede dar un caudal en m³/s?',
   a:'ΔP tiene unidades de Pa = kg·m⁻¹·s⁻², µ de Pa·s, r y L de m. La combinación ΔP·r⁴/(µ·L) da (kg·m⁻¹·s⁻²·m⁴)/(kg·m⁻¹·s⁻¹·m) = m³·s⁻¹. Es Hagen-Poiseuille, reconstruida solo con dimensiones.'}
 ],
 conc:['unidades','notacion','cifras']},

{m:'M0',t:'Las herramientas matemáticas que de verdad usarás',dur:25,
 obj:['Reconocer cuándo un fenómeno es exponencial y qué implica','Interpretar derivadas e integrales como tasa y acumulación','Leer una linealización y saber qué extraer de su pendiente'],
 sec:[
  {t:'Un solo patrón que aparece en cuatro módulos',p:'Si tuvieras que quedarte con una sola idea matemática para este examen, sería esta: cuando la velocidad de cambio de algo es proporcional a cuánto queda, el resultado es una exponencial. La ecuación dy/dt = −ky se resuelve separando variables e integrando, y da y(t) = y₀·e^(−kt).\n\nLo notable es dónde aparece. La cinética química de primer orden. La eliminación de un fármaco del organismo. La descarga de un capacitor. La atenuación de luz al atravesar una disolución, que es lo que hay detrás de la ley de Beer-Lambert. Y el decaimiento del campo evanescente al alejarse de una interfaz. Son cinco temas de cuatro módulos distintos con la misma matemática. Reconocerlo te ahorra memorizar cinco cosas.'},
  {t:'Vida media y la regla de las cuatro',p:'De la exponencial sale la vida media, t½ = ln2/k ≈ 0.693/k. Su propiedad más útil es que no depende de la cantidad inicial: siempre tarda lo mismo en reducirse a la mitad. Tras n vidas medias queda (1/2)ⁿ del inicial.\n\nEn farmacocinética esto da una regla práctica que conviene traer memorizada: tras cuatro o cinco vidas medias se ha eliminado más del 95 % del fármaco, y también se alcanza cerca del 95 % del estado estacionario cuando se administran dosis repetidas. Un reactivo típico te da t½ = 4 h y pregunta cuánto queda a las 12 h; son tres vidas medias, así que un octavo.'},
  {t:'Derivada como tasa, integral como acumulación',p:'La derivada responde «qué tan rápido cambia» y la integral responde «cuánto se acumuló». Casi todas las magnitudes del examen se leen así. La velocidad de reacción es la derivada de la concentración respecto al tiempo. El flujo difusivo es proporcional a la derivada de la concentración respecto a la posición, que es la primera ley de Fick. La energía es la integral de la potencia en el tiempo. La masa depositada en una electrólisis es la integral de la corriente, que es justamente la carga.\n\nNo necesitas resolver integrales complicadas en el examen. Necesitas leer una expresión y reconocer cuál de las dos cosas te está preguntando.'},
  {t:'Linealizar para extraer parámetros',p:'Muchas ecuaciones importantes se manipulan hasta convertirlas en rectas, porque de una recta se extraen dos parámetros con facilidad. Arrhenius linealiza como ln k contra 1/T, con pendiente −Ea/R. Clausius-Clapeyron hace lo mismo con ln P contra 1/T y pendiente −ΔHvap/R. La cinética de primer orden da ln[A] contra t con pendiente −k. La de segundo orden da 1/[A] contra t.\n\nEsa última observación es un atajo diagnóstico valioso: si te dan datos y preguntan el orden de reacción, la respuesta está en cuál de las tres gráficas sale recta. Y en Williamson-Hall, la separación entre tamaño de cristalito y microdeformación se logra precisamente porque cada contribución depende distinto del ángulo, lo que permite separarlas en una recta.'}
 ],
 clave:['dy/dt = −ky da exponencial y aparece en cinética, farmacocinética, circuitos, Beer-Lambert y onda evanescente.','t½ = ln2/k es independiente de la cantidad inicial; tras 4–5 vidas medias queda menos del 5 %.','El orden de una reacción se identifica viendo cuál linealización da una recta: [A], ln[A] o 1/[A] contra t.'],
 check:[
  {q:'Te dan datos de concentración contra tiempo y la gráfica de 1/[A] contra t sale recta. ¿Qué orden es y qué significa la pendiente?',
   a:'Es de segundo orden. La forma integrada es 1/[A] = 1/[A]₀ + kt, así que la pendiente es directamente la constante de velocidad k, con unidades de L·mol⁻¹·s⁻¹.'},
  {q:'¿Por qué la vida media de una reacción de primer orden no depende de la concentración inicial, pero la de orden cero sí?',
   a:'En primer orden t½ = ln2/k, donde [A]₀ se cancela al tomar el cociente [A]/[A]₀ = 1/2. En orden cero la velocidad es constante, así que el tiempo para consumir la mitad es proporcional a cuánto había: t½ = [A]₀/2k.'}
 ],
 conc:['edo','derivada','integral','logaritmos']},

{m:'M4',t:'Del átomo al enlace: qué decide las propiedades de un material',dur:30,
 obj:['Explicar cómo la configuración electrónica determina la periodicidad','Predecir el tipo de enlace a partir de la posición en la tabla','Conectar tipo de enlace con propiedades macroscópicas'],
 sec:[
  {t:'La pregunta que organiza el módulo',p:'Todo este módulo responde a una sola pregunta: por qué un material se comporta como se comporta. Por qué el cobre conduce y el diamante no, aunque ambos sean sólidos cristalinos. Por qué el vidrio es transparente y el oro dorado. Por qué un cerámico es duro y frágil mientras un metal es dúctil.\n\nLa respuesta siempre baja al mismo lugar: la configuración electrónica de los átomos determina cómo se enlazan, y el tipo de enlace determina las propiedades. Esa cadena de tres eslabones es el hilo conductor. Si la tienes clara, no necesitas memorizar tablas de propiedades: puedes deducirlas.'},
  {t:'De los orbitales a la periodicidad',p:'Los electrones ocupan orbitales siguiendo tres reglas, Aufbau, Hund y Pauli, y el resultado es la forma misma de la tabla periódica: los bloques s, p, d y f no son una convención de dibujo, son el orden en que se llenan los orbitales.\n\nDe ahí salen las tendencias periódicas. Al avanzar en un periodo aumenta la carga nuclear efectiva, así que el radio atómico disminuye y la energía de ionización y la electronegatividad aumentan. Al bajar en un grupo se añade una capa, así que el radio crece y la electronegatividad cae. Con solo saber dónde está un elemento puedes anticipar si tenderá a ceder o a captar electrones, que es todo lo que necesitas para predecir su enlace.'},
  {t:'Los tres tipos de enlace y lo que implican',p:'Cuando la diferencia de electronegatividad es grande, un átomo cede y otro capta: enlace iónico. El resultado es una red de iones fuertemente unida, con alto punto de fusión, dura, frágil y aislante en estado sólido pero conductora fundida o disuelta, porque los iones quedan libres de moverse.\n\nCuando la diferencia es pequeña y ambos átomos retienen sus electrones, los comparten: enlace covalente. Si la red covalente es tridimensional, como en el diamante, resulta un material durísimo y aislante. Si las moléculas son discretas, el sólido se mantiene unido solo por fuerzas intermoleculares débiles y funde bajo.\n\nCuando los átomos ceden electrones a un mar deslocalizado compartido por todos, tenemos enlace metálico. Esa deslocalización explica de golpe tres propiedades: conductividad eléctrica y térmica, brillo metálico, y ductilidad, porque los planos de átomos pueden deslizarse sin romper enlaces dirigidos.'},
  {t:'Cómo se representa y por qué importa la forma',p:'Antes de predecir nada hay que dibujar la molécula. Las estructuras de Lewis reparten los electrones de valencia y permiten calcular cargas formales y reconocer resonancia. Sobre esa estructura, el modelo VSEPR predice la geometría minimizando la repulsión entre pares electrónicos, incluidos los pares libres, que ocupan espacio aunque no se vean en el nombre de la geometría.\n\nY la geometría decide la polaridad. Este es el punto donde más gente se equivoca: una molécula puede tener enlaces muy polares y ser globalmente no polar si la simetría cancela los dipolos. El tetracloruro de carbono es el ejemplo clásico, con cuatro enlaces C–Cl polares y momento dipolar cero. La polaridad, a su vez, determina las fuerzas intermoleculares, y esas fijan punto de ebullición, solubilidad y tensión superficial.'}
 ],
 clave:['La cadena es siempre configuración electrónica → tipo de enlace → propiedades macroscópicas.','El enlace metálico deslocalizado explica simultáneamente conductividad, brillo y ductilidad.','Enlaces polares no implica molécula polar: la simetría puede cancelar los dipolos.'],
 check:[
  {q:'¿Por qué el NaCl sólido no conduce electricidad pero fundido sí, mientras el cobre conduce en ambos estados?',
   a:'En el NaCl sólido los iones están fijos en la red y no hay portadores móviles. Al fundir, los iones se liberan y transportan carga. En el cobre la conducción la hacen electrones deslocalizados, que existen y se mueven en cualquier estado.'},
  {q:'Ordena de mayor a menor punto de ebullición: CH₄, CH₃OH y NaCl. Justifica desde el enlace.',
   a:'NaCl mucho mayor, porque hay que romper una red iónica completa. Después CH₃OH, que forma puentes de hidrógeno. Al final CH₄, que solo tiene dispersión de London. Nótese que se comparan cosas distintas: en NaCl se rompe el enlace, en los otros dos solo fuerzas intermoleculares.'}
 ],
 conc:['config','periodicidad','enlace','lewis','vsepr','polaridad','imf']},

{m:'M4',t:'De orbitales a bandas: conductores, semiconductores y aislantes',dur:30,
 obj:['Deducir por qué aparecen bandas al reunir muchos átomos','Clasificar un material por su band gap y predecir su color','Explicar el efecto del dopaje y de la temperatura sobre la conductividad'],
 sec:[
  {t:'El puente entre la molécula y el sólido',p:'Este es probablemente el concepto más rentable de todo el examen, porque un solo parámetro, el band gap, explica si un material conduce, si es transparente y de qué color se ve.\n\nEl razonamiento parte de la teoría de orbitales moleculares. Al combinar dos orbitales atómicos se obtienen dos orbitales moleculares, uno enlazante y uno antienlazante. Con cuatro átomos se obtienen cuatro niveles, repartidos en un rango de energía similar. Con N átomos, N niveles. Y aquí está el salto: cuando N es del orden del número de Avogadro, la separación entre niveles consecutivos se vuelve tan pequeña, del orden de 10⁻²² eV, que es indistinguible de un continuo. Eso es una banda.'},
  {t:'Qué significa el gap',p:'Los orbitales que estaban ocupados forman la banda de valencia; los vacíos, la banda de conducción. Entre ambas puede haber una región sin estados disponibles: el band gap.\n\nSi las bandas se solapan, hay estados vacíos inmediatamente accesibles y el material conduce sin necesidad de energía extra: es un metal. Si el gap es grande, del orden de más de 4 eV, la agitación térmica no basta para cruzarlo y el material es aislante. En el intermedio, entre aproximadamente 0.1 y 3 eV, tenemos un semiconductor: no conduce a baja temperatura pero sí al calentarlo o al iluminarlo.\n\nEl gap también fija la absorción óptica. Con el atajo E(eV) = 1240/λ(nm), un gap de 3.2 eV corresponde a 388 nm, es decir ultravioleta: el material no absorbe nada del visible y se ve blanco o transparente. Ese es exactamente el caso del TiO₂ anatasa. Un gap de 1.8 eV absorbe casi todo el visible y el material se ve negro.'},
  {t:'Dopaje: convertir un aislante mediocre en un dispositivo',p:'Un semiconductor puro tiene pocos portadores. La ingeniería consiste en introducirlos a voluntad mediante impurezas. Si al silicio, que tiene cuatro electrones de valencia, le añades fósforo, que tiene cinco, sobra un electrón por átomo de impureza: es un donador y el material queda tipo n, con electrones como portadores mayoritarios. Si añades boro, con tres, falta un electrón y queda un hueco: es un aceptor y el material queda tipo p.\n\nEl nivel de Fermi, que es la energía a la que la probabilidad de ocupación vale exactamente 0.5, se desplaza hacia la banda de conducción en el tipo n y hacia la de valencia en el tipo p. Poner en contacto ambos tipos crea la unión p-n, que es el ladrillo de diodos, LEDs, celdas solares y transistores.'},
  {t:'La trampa de la temperatura',p:'Aquí está el distractor más frecuente del módulo, y conviene poder derivarlo, no solo recordarlo. La conductividad es σ = n·q·µ, donde n es la densidad de portadores y µ su movilidad.\n\nEn un metal, la banda de conducción ya está poblada, así que n es prácticamente constante. Al calentar aumentan las vibraciones de la red, los fonones dispersan más a los electrones y µ cae. Con n fijo y µ decreciente, la resistividad SUBE.\n\nEn un semiconductor intrínseco casi no hay portadores, así que n es el factor limitante. Al calentar, más electrones cruzan el gap y n crece exponencialmente, efecto que domina ampliamente sobre la caída de movilidad. La resistividad BAJA. Metales y semiconductores responden al revés, y ese contraste es material de examen garantizado.'}
 ],
 clave:['Las bandas aparecen porque N orbitales atómicos dan N niveles tan juntos que forman un continuo.','Eg(eV) ≈ 1240/λ(nm) conecta el band gap con el color y con el borde de absorción.','Metal: T ↑ ⇒ ρ ↑ por fonones. Semiconductor: T ↑ ⇒ ρ ↓ porque n crece exponencialmente.'],
 check:[
  {q:'Un material tiene band gap de 2.0 eV. ¿Qué color esperas que se vea y por qué?',
   a:'λ = 1240/2.0 = 620 nm. Absorbe desde el rojo hacia longitudes menores, es decir la mayor parte del visible salvo el rojo-naranja, así que se verá rojizo o anaranjado. Además, con ese gap es semiconductor.'},
  {q:'¿Por qué dopar aumenta la conductividad aunque el material siga teniendo el mismo band gap?',
   a:'Porque el dopaje no cambia el gap, cambia n. El donador introduce un nivel muy cercano a la banda de conducción, del que el electrón se promueve con energía térmica mínima. Se ganan portadores sin necesidad de cruzar el gap completo.'}
 ],
 conc:['tom','bandas','semiconductor','particula-caja']},

{m:'M4',t:'El orden interno: cristalografía, planos y defectos',dur:30,
 obj:['Calcular densidad teórica y factor de empaquetamiento','Interpretar índices de Miller y distancias interplanares','Explicar cómo los defectos gobiernan la deformación y la difusión'],
 sec:[
  {t:'Por qué importa la geometría del arreglo',p:'Un sólido cristalino es un arreglo periódico, y esa periodicidad tiene consecuencias medibles. De la celda unitaria salen la densidad, el patrón de difracción, los planos por donde el material se deforma y hasta la forma que adopta un nanocristal.\n\nHay siete sistemas cristalinos y catorce redes de Bravais, pero para el examen bastan cuatro estructuras: cúbica simple, cúbica centrada en el cuerpo, cúbica centrada en las caras y hexagonal compacta. Conviene tener sus números memorizados como un bloque: átomos por celda 1, 2, 4 y 6; número de coordinación 6, 8, 12 y 12; factor de empaquetamiento 0.52, 0.68, 0.74 y 0.74. Un distractor habitual mezcla el número de átomos por celda con el de coordinación, que son cosas distintas.'},
  {t:'Densidad teórica: contar bien',p:'La densidad teórica es simplemente masa entre volumen aplicada a la celda: ρ = nA/(V_celda·N_A), donde n son los átomos por celda y A la masa atómica.\n\nEl valor de este cálculo no es el número en sí, sino la comparación con la densidad medida. Si la real es menor, hay porosidad o defectos. Es un control de calidad barato para un material sintetizado. Y como advertimos en la lección de unidades, el error clásico está en no convertir el parámetro de red a centímetros antes de elevar al cubo.'},
  {t:'Planos de Miller y por qué se toman recíprocos',p:'Los índices de Miller identifican planos cristalinos. El procedimiento es contraintuitivo: se toman las intersecciones del plano con los ejes, se calculan sus RECÍPROCOS y se reducen a los enteros más pequeños. El motivo de usar recíprocos es elegante: un plano paralelo a un eje lo corta en el infinito, y el recíproco del infinito es cero, así que el índice queda finito.\n\nPara sistemas cúbicos, la distancia interplanar es d = a/√(h²+k²+l²). Esa distancia es exactamente la que entra en la ley de Bragg, así que los índices de Miller son el lenguaje con el que se lee un difractograma. También describen la faceta expuesta de una nanopartícula, que es lo que un surfactante bloquea selectivamente para dirigir el crecimiento anisotrópico.'},
  {t:'Los defectos no son fallas, son el mecanismo',p:'Ningún cristal real es perfecto, y resulta que los defectos no son un problema sino la explicación de casi todo el comportamiento mecánico y de transporte.\n\nLos defectos puntuales incluyen vacancias e intersticiales. En cristales iónicos toman dos formas con nombre propio: el defecto de Frenkel, donde un ion se desplaza a un intersticio y la composición no cambia, y el de Schottky, donde se crean vacancias de catión y anión en pareja para preservar la electroneutralidad. Su población crece exponencialmente con la temperatura y es lo que habilita la conductividad iónica de los electrolitos sólidos.\n\nLos defectos lineales son las dislocaciones, y son el mecanismo de la deformación plástica: un metal se deforma porque las dislocaciones se mueven. De ahí sale toda la estrategia de endurecimiento, que consiste en obstaculizarlas, ya sea con más dislocaciones (deformación en frío), con átomos de distinto tamaño (solución sólida), con precipitados, o con fronteras de grano, que es la relación de Hall-Petch.'}
 ],
 clave:['FCC: 4 átomos por celda, coordinación 12, empaquetamiento 0.74. No confundir ambos números.','Los índices de Miller usan recíprocos para que un plano paralelo a un eje dé índice cero en lugar de infinito.','La deformación plástica ocurre por movimiento de dislocaciones; endurecer es obstaculizarlas.'],
 check:[
  {q:'¿Por qué la relación de Hall-Petch se invierte por debajo de unos 10–20 nm de tamaño de grano?',
   a:'Porque a esa escala el grano es demasiado pequeño para albergar y multiplicar dislocaciones, y el mecanismo de deformación cambia a deslizamiento de fronteras de grano. Al haber más fronteras, el material se ablanda en lugar de endurecerse.'},
  {q:'Calcula d para el plano (200) de una red cúbica con a = 0.405 nm.',
   a:'d = 0.405/√(4+0+0) = 0.405/2 = 0.2025 nm. Nótese que (200) da la mitad de la distancia de (100), que es la interpretación física de los órdenes superiores de difracción.'}
 ],
 conc:['red-cristalina','empaquetamiento','miller','defectos','mecanicas']},

{m:'M4',t:'La mecánica cuántica que sí se pregunta',dur:25,
 obj:['Interpretar el modelo de partícula en una caja y su dependencia con el tamaño','Distinguir Hartree-Fock de DFT','Reconocer el problema de valores propios detrás de un cálculo computacional'],
 sec:[
  {t:'Del modelo de Bohr al mecano-cuántico',p:'Bohr cuantizó el momento angular del electrón y obtuvo E_n = −13.6/n² eV, un resultado que reprodujo exactamente las líneas espectrales del hidrógeno. Ese acierto le dio credibilidad, pero el modelo falla para cualquier átomo con más de un electrón porque ignora la repulsión entre ellos.\n\nEl modelo mecano-cuántico lo sustituye por una función de onda, solución de la ecuación de Schrödinger, caracterizada por los números cuánticos n, l, m y s. El cuadrado del módulo de esa función es una densidad de probabilidad: los orbitales no son trayectorias sino regiones donde es probable encontrar al electrón.'},
  {t:'Partícula en una caja: el modelo que explica los puntos cuánticos',p:'De todas las soluciones exactas, la más útil para nanotecnología es la más simple. Una partícula confinada entre paredes infinitas separadas una distancia L tiene niveles E_n = n²h²/(8mL²).\n\nLo importante no es la fórmula sino su dependencia: la energía va como 1/L². Reducir el tamaño a la mitad multiplica la energía por CUATRO, no por dos. Esa es la raíz física del confinamiento cuántico y la razón por la que un punto cuántico más pequeño emite luz más azul. Toda la lección de puntos cuánticos del módulo de síntesis se apoya en esta única relación.\n\nUn detalle que se pregunta: en el estado fundamental n = 1, no n = 0, así que la energía nunca es cero. En el oscilador armónico cuántico ocurre lo mismo, con energía de punto cero ħω/2. Es una consecuencia del principio de incertidumbre: la partícula no puede estar quieta en el fondo del pozo.'},
  {t:'Cuando ya no hay solución exacta',p:'Solo el hidrógeno y los sistemas de un electrón tienen solución analítica. Todo lo demás requiere aproximar, y ahí entra la química computacional de tu curso de Modelación de sistemas moleculares.\n\nHartree-Fock trata a cada electrón moviéndose en el campo promedio de los demás. Es una aproximación razonable pero ignora la correlación electrónica, es decir el hecho de que los electrones se evitan activamente entre sí. La teoría del funcional de la densidad, DFT, reformula el problema en términos de la densidad electrónica en lugar de la función de onda completa, e incorpora intercambio y correlación en un funcional. La elección de ese funcional cambia los resultados, lo cual es una limitación real y no un detalle.'},
  {t:'Por qué todo termina siendo álgebra lineal',p:'Al expandir la función de onda en un conjunto base finito, la ecuación de Schrödinger se transforma en un problema matricial: det(H − ES) = 0, la ecuación secular. Los valores propios de esa matriz son las energías permitidas y los vectores propios, los orbitales.\n\nEs exactamente el mismo problema de eigenvalores que viste en álgebra lineal, y es el motor de todo cálculo de estructura electrónica. El tamaño de la matriz lo fija el conjunto base: bases más grandes dan mejores energías a costa de un tiempo de cómputo que crece rápidamente. Ese compromiso entre exactitud y costo es la decisión central de cualquier cálculo.'}
 ],
 clave:['E ∝ 1/L² en la partícula en una caja: reducir el tamaño a la mitad cuadruplica la energía de confinamiento.','El estado fundamental nunca tiene energía cero, por el principio de incertidumbre.','Hartree-Fock ignora la correlación electrónica; DFT la aproxima mediante un funcional cuya elección afecta el resultado.'],
 check:[
  {q:'Un electrón está confinado en 2 nm. Si reduces la caja a 1 nm, ¿cómo cambia su energía fundamental?',
   a:'Se multiplica por cuatro, porque E ∝ 1/L² y el tamaño se redujo a la mitad. Con E₁ ≈ 0.094 eV en 2 nm, en 1 nm queda cerca de 0.38 eV.'},
  {q:'¿Por qué un cálculo DFT con un funcional distinto puede dar una geometría diferente?',
   a:'Porque el funcional de intercambio-correlación es una aproximación, no una cantidad exacta conocida. Distintos funcionales pesan de forma distinta esos efectos, lo que altera energías relativas y por tanto la geometría optimizada.'}
 ],
 conc:['atomo','cuantico','particula-caja','oscilador','formalismo-qm','quimica-computacional']},
