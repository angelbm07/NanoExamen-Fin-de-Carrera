 ['E°′ ≈ (E<sub>pa</sub> + E<sub>pc</sub>)/2','<b>Potencial formal</b>: el punto medio entre los dos picos.','en V'],
 ['i<sub>c</sub> = C<sub>dl</sub>·A·v','<b>Corriente capacitiva</b>: lineal en v, frente a la faradaica que va con √v. Por eso barrer rápido empeora la señal-ruido.','']
]},
   {prob:{t:'Extraer el coeficiente de difusión de una serie de barridos',
 d:'Electrodo de carbono vítreo de 0.0707 cm² (3.0 mm de diámetro). Analito 1.0 mM con un electrón transferido. Se mide i<sub>p</sub> = 12.6 µA a v = 50 mV/s y 25.2 µA a v = 200 mV/s.',
 p:['Comprueba primero la dependencia: al multiplicar v por 4, i<sub>p</sub> se multiplicó por 2 = √4. Es <b>proporcional a √v</b>, así que la especie <b>difunde</b> y Randles-Ševčík aplica.',
    'Convierte las unidades que pide la ecuación: C = 1.0 mM = 1.0×10⁻³ mol/L = <b>1.0×10⁻⁶ mol/cm³</b>. Ese cambio de L a cm³ es obligatorio.',
    'A v = 0.050 V/s: √v = <b>0.2236 V^(1/2)s^(−1/2)</b>.',
    'Despeja: D^(1/2) = i<sub>p</sub> / (2.69×10⁵·n^(3/2)·A·C·√v).',
    'Denominador: 2.69×10⁵ × 1 × 0.0707 × 1.0×10⁻⁶ × 0.2236 = <b>4.253×10⁻³</b>.',
    'D^(1/2) = 12.6×10⁻⁶ / 4.253×10⁻³ = <b>2.963×10⁻³</b> ⇒ D = <b>8.8×10⁻⁶ cm²/s</b>.'],
 r:'D ≈ 8.8×10⁻⁶ cm²/s, un valor típico de una molécula pequeña en disolución acuosa.',
 x:'La conversión de <b>mol/L a mol/cm³</b> (dividir entre 1000) es el error dominante de este cálculo y desvía el resultado por un factor 10⁶ al estar D elevado al cuadrado. Y antes de aplicar la ecuación hay que <b>verificar</b> que i<sub>p</sub> va con √v: si fuera lineal en v, la especie estaría adsorbida y Randles-Ševčík no sería aplicable.'}}]},

  {t:'Impedancia, doble capa y el circuito equivalente',b:[
   {p:['La espectroscopía de impedancia electroquímica aplica una pequeña perturbación sinusoidal de potencial, de unos 5 a 10 mV, y mide la respuesta en corriente barriendo la frecuencia. La amplitud debe ser pequeña para que el sistema responda de forma <b>lineal</b>, que es la condición que hace válido todo el análisis.']},
   {p:['Los datos se ajustan a un <b>circuito equivalente</b>, y el más simple que funciona es el de Randles: la resistencia del electrolito R_s en serie con el paralelo de la capacitancia de doble capa C_dl y la resistencia de transferencia de carga R_ct, esta última en serie con la impedancia de Warburg que describe la difusión.']},
   {tabla:{th:['Elemento','Qué representa','Dónde se lee en Nyquist'],tr:[
     ['R_s','resistencia del electrolito','corte a alta frecuencia'],
     ['R_ct','barrera de transferencia de carga','diámetro del semicírculo'],
     ['C_dl','reorganización iónica en la interfaz','frecuencia del máximo'],
     ['Warburg','difusión del reactivo','recta a 45° a baja frecuencia']
   ]}},
   {p:['El dato con más valor diagnóstico es <b>R_ct</b>, inversamente proporcional a i₀: un semicírculo pequeño significa transferencia rápida. En un <b>biosensor sin marcaje</b>, la unión del analito bloquea la superficie, R_ct aumenta y el crecimiento del semicírculo es la señal. En <b>corrosión</b>, un R_ct grande indica que el recubrimiento protege; su caída en el tiempo mide el deterioro.']},
   {p:['La <b>doble capa eléctrica</b> es la misma estructura que gobierna la estabilidad coloidal de M5: una capa compacta de Helmholtz de iones específicamente adsorbidos y una capa difusa de Gouy-Chapman que se extiende una <b>longitud de Debye</b>. Subir la fuerza iónica la comprime, lo que en una suspensión significa agregación y en un electrodo significa mayor capacitancia y menor caída óhmica.']}
  ]},

  {t:'Corrosión: la celda que nadie quiso construir',b:[
   {p:['La corrosión es una celda galvánica espontánea que se forma sola sobre un metal: unas zonas actúan de ánodo y se disuelven, otras de cátodo. En medio aireado neutro, la reacción catódica dominante es la <b>reducción de oxígeno</b>, O₂ + 2H₂O + 4e⁻ → 4OH⁻, y no la de protones. De ahí que airear o agitar un medio <b>acelere</b> la corrosión en lugar de frenarla.']},
   {p:['El <b>par galvánico</b> aparece al unir dos metales de potencial distinto: el menos noble se convierte en ánodo y se corroe a velocidad acelerada, tanto más cuanto mayor sea la razón entre el área catódica y la anódica. Un remache de acero en una placa de cobre falla rápido; el mismo remache de cobre en placa de acero dura, porque ahora el área anódica es enorme.']},
   {ul:['<b>Protección catódica por ánodo de sacrificio</b>: se conecta un metal más activo (zinc, magnesio) que se corroe en lugar de la estructura. Es el principio del acero <b>galvanizado</b>, y por eso un rayón en la capa de zinc no inicia la corrosión del acero debajo.',
        '<b>Protección catódica por corriente impresa</b>: una fuente externa mantiene la estructura polarizada negativamente. Se usa en tuberías enterradas y cascos de barco.',
        '<b>Pasivación</b>: una capa de óxido compacta y adherente aísla el metal. Es lo que hace el cromo en el acero inoxidable y el óxido de aluminio en el aluminio.',
        '<b>Inhibidores y recubrimientos</b>: barreras físicas o moléculas que se adsorben y bloquean los sitios activos.']},
   {p:['La diferencia entre un óxido <b>protector</b> y uno que no lo es se cuantifica con la <b>razón de Pilling-Bedworth</b>, el volumen de óxido formado dividido entre el del metal consumido. Por debajo de 1 la capa es porosa y no cubre, como en el magnesio; entre 1 y 2 es compacta y protege, como en el aluminio y el cromo; muy por encima de 2 la capa se agrieta por compresión y se desprende, como en el hierro, cuya herrumbre es permeable y permite que el ataque continúe indefinidamente.']},
   {deep:{t:'Por qué la corrosión nanoestructurada es más rápida',b:[
    {p:['La velocidad de corrosión escala con el <b>área expuesta</b>, y la nanoestructuración multiplica el área por unidad de masa. Una nanopartícula metálica tiene además una fracción enorme de átomos en vértices y aristas, que son sitios de menor coordinación y por tanto más reactivos.']},
    {p:['A eso se añade un término termodinámico: la ecuación de Gibbs-Thomson hace que el potencial de un metal nanoparticulado se desplace, de modo que una nanopartícula es intrínsecamente más fácil de oxidar que el material masivo. Es la misma física que baja el punto de fusión con el tamaño.']},
    {p:['Por eso las nanopartículas metálicas se pasivan en segundos al aire, por eso las de hierro cerovalente usadas en remediación tienen vida útil corta, y por eso se recubren con carbono o con una capa de óxido controlada antes de usarlas.']}
   ]}}
  ]},

  {t:'Almacenamiento, electrocatálisis y síntesis electroquímica',b:[
   {p:['Una <b>batería</b> almacena energía en enlaces químicos y la entrega mediante reacciones faradaicas en el volumen del material; un <b>supercondensador</b> la almacena como separación de carga en la doble capa, sin reacción. De ahí todas sus diferencias prácticas: la batería tiene alta <b>densidad de energía</b> y baja densidad de potencia, y el supercondensador lo contrario, porque cargar una interfaz es mucho más rápido que difundir iones dentro de un sólido.']},
   {tabla:{th:['','Batería de ion litio','Supercondensador'],tr:[
     ['Mecanismo','intercalación faradaica','doble capa (no faradaico)'],
     ['Energía específica','150 a 250 Wh/kg','5 a 10 Wh/kg'],
     ['Potencia específica','baja','muy alta'],
     ['Ciclos de vida','10³ aproximadamente','10⁵ a 10⁶'],
     ['Limitante','difusión en estado sólido','área superficial accesible']
   ]}},
   {p:['En una batería de ion litio la carga y la descarga son procesos de <b>intercalación</b>: el litio entra y sale de la estructura del electrodo sin destruirla. El cátodo aporta el litio y fija el voltaje; el ánodo de grafito lo aloja entre láminas. La capacidad se mide en mAh/g y la <b>tasa C</b> indica en cuánto tiempo se descarga: 1C es una hora, 2C es media.']},
   {p:['Los nanomateriales mejoran ambos dispositivos por la misma razón geométrica: acortan la <b>distancia de difusión en estado sólido</b>, que escala con el cuadrado del tamaño, y multiplican el área de contacto con el electrolito. El costo es también el mismo en ambos: más área significa más reacciones parásitas con el electrolito y una <b>interfase sólido-electrolito</b> más gruesa, que consume litio irreversiblemente y baja la eficiencia del primer ciclo.']},
   {p:['En <b>electrocatálisis</b> el objetivo es bajar el sobrepotencial de reacciones clave: evolución de hidrógeno y de oxígeno para electrólisis de agua, reducción de oxígeno para celdas de combustible, reducción de CO₂ para combustibles sintéticos. La figura de mérito convencional es el sobrepotencial necesario para alcanzar 10 mA/cm², junto con la pendiente de Tafel y la estabilidad en operación continua.']},
   {p:['Como <b>ruta de síntesis</b>, la vía electroquímica tiene una ventaja que ninguna otra iguala: el potencial es un reactivo que se ajusta de forma continua y se apaga instantáneamente, de modo que la fuerza impulsora se controla con precisión milivolt. La <b>electrodeposición</b> produce recubrimientos y nanoestructuras; la <b>anodización</b> del aluminio genera alúmina porosa de poros hexagonales ordenados que se usa como plantilla para crecer nanohilos; la deposición en plantilla da arreglos de nanohilos con diámetro y longitud controlados por el poro y por la carga pasada.']}
  ]}
 ],
 flash:[
  ['¿Dónde ocurre la oxidación?','En el <b>ánodo</b>, siempre, en cualquier tipo de celda. Lo que cambia con el tipo de celda es el signo: ánodo negativo en galvánica, positivo en electrolítica.'],
  ['E°_celda a partir de la tabla','E°_celda = E°_cátodo − E°_ánodo, con ambos valores tomados como <b>reducción</b> y sin multiplicar por coeficientes.'],
  ['¿Por qué el potencial no se multiplica por los coeficientes?','Porque es una magnitud <b>intensiva</b>: duplicar la reacción duplica n y ΔG, pero E = −ΔG/nF queda igual.'],
  ['Relación entre E° y espontaneidad','ΔG° = −nFE°. E° positivo ⇒ ΔG° negativo ⇒ celda galvánica espontánea.'],
  ['Pendiente nernstiana a 25 °C','59.2 mV por década para n = 1 y 29.6 mV para n = 2. A 37 °C sube a 61.6 mV: recalibrar es obligatorio.'],
  ['Ley de Faraday','m = (I·t·M)/(n·F), con F = 96 485 C/mol. El paso que más se falla es <b>n</b>, los electrones por ion.'],
  ['¿Qué es i₀?','La <b>densidad de corriente de intercambio</b>: la corriente en ambos sentidos en el equilibrio. Mide la actividad intrínseca del electrocatalizador.'],
  ['Los tres sobrepotenciales','<b>Activación</b> (mejor catalizador), <b>concentración</b> (agitar) y <b>óhmico</b> (más conductividad o compensación iR).'],
  ['i_p ∝ √v frente a i_p ∝ v','Raíz de v: la especie <b>difunde</b>. Lineal en v: la especie está <b>adsorbida</b> en el electrodo.'],
  ['Criterios de reversibilidad en CV','ΔE_p ≈ 59/n mV e independiente de v, y |i_pa/i_pc| ≈ 1.'],
  ['¿Qué es R_ct en impedancia?','La resistencia de transferencia de carga: el <b>diámetro del semicírculo</b> en Nyquist, inversamente proporcional a i₀.'],
  ['Reacción catódica de la corrosión en medio aireado','Reducción de <b>oxígeno</b>: O₂ + 2H₂O + 4e⁻ → 4OH⁻. Por eso airear acelera la corrosión.'],
  ['Razón de Pilling-Bedworth','Volumen de óxido entre volumen de metal. Menor que 1: poroso. Entre 1 y 2: protector. Mayor que 2: se agrieta.'],
  ['Ánodo de sacrificio','Un metal <b>más activo</b> (Zn, Mg) conectado a la estructura, que se corroe en su lugar. Es el principio del galvanizado.'],
  ['Batería frente a supercondensador','Batería: faradaica, mucha <b>energía</b>, poca potencia. Supercondensador: doble capa, mucha <b>potencia</b>, poca energía y 10⁵ ciclos.'],
  ['¿Por qué la celda tiene tres electrodos?','Para controlar el potencial contra una <b>referencia</b> por la que no pasa corriente, mientras la corriente se cierra por el contraelectrodo.']
 ]}
);

<script>
/* ============================================================
   QUIZ MIXTO · banco compartido, etiquetado por módulo.
   Preguntas de aplicación, comparación o detección de
   discrepancias, no de reconocimiento de definiciones.
   Estilo Tec: enunciado con escenario (~140 caracteres),
   cuatro opciones paralelas y breves (~30 caracteres).
   ============================================================ */
var QUIZ=[
/* ---------------- M2 ---------------- */
{tag:'M2',q:'En una titulación redox tomas una alícuota de 25.00 mL de disolución de Fe²⁺ y gastas 18.40 mL de KMnO₄ 0.0200 M en medio ácido. ¿Cuál es la concentración de Fe²⁺?',
 opts:['0.0368 M','0.0029 M','0.0147 M','0.0736 M'],correct:3,
 exp:'Moles de MnO₄⁻ = 0.01840 × 0.0200 = 3.68×10⁻⁴. La relación es 1 a 5 porque el Mn gana 5 electrones y el Fe cede 1, así que hay 1.84×10⁻³ mol de Fe²⁺ en 0.02500 L: 0.0736 M. El 0.0147 sale de usar relación 1:1.'},
{tag:'M2',q:'Dos analistas miden el mismo material certificado de valor 4.50. A obtiene 4.52, 4.51 y 4.53; B obtiene 4.38, 4.71 y 4.49. ¿Qué conclusión se sostiene sobre su desempeño?',
 opts:['A preciso pero inexacto; B exacto y preciso','Ambos con el mismo error sistemático','A preciso y exacto; B exacto pero impreciso','B más confiable: su rango cubre 4.50'],correct:2,
 exp:'A está centrado en 4.52 con dispersión mínima: preciso y exacto. B promedia 4.527 pero con rango de 0.33: su exactitud media es aceptable y su precisión mala, lo que apunta a error aleatorio. Un rango amplio que "cubra" el valor real no es un criterio de confiabilidad.'},
{tag:'M2',q:'Un pico cromatográfico sale a 9.0 min en una columna cuyo tiempo muerto es 1.5 min. Un compañero reporta un factor de retención k′ = 6.0 para ese pico. ¿Qué error cometió?',
 opts:['No restó el tiempo muerto','Usó el ancho en vez del tiempo','Dividió entre el tiempo total','Confundió k′ con la resolución'],correct:0,
 exp:'k′ = (9.0 − 1.5)/1.5 = 5.0. Reportar 6.0 equivale a calcular 9.0/1.5, es decir olvidar la resta del tiempo muerto en el numerador. Es el error más frecuente del parámetro.'},
{tag:'M2',q:'Validas un método de análisis y obtienes 103 % de recuperación sobre un material certificado, con esa misma desviación en las diez réplicas que corriste. ¿Qué acción corresponde?',
 opts:['Aumentar el número de réplicas','Cambiar de material certificado','Aceptarlo: es reproducible','Buscar la fuente del sesgo'],correct:3,
 exp:'Alta reproducibilidad con desviación constante es la firma del error sistemático. Aumentar n reduce el componente aleatorio y deja el sesgo intacto. Hay que revisar calibración, patrón, interferencia de matriz o recuperación del método.'},
{tag:'M2',q:'Titulas un ácido débil con NaOH y eliges naranja de metilo como indicador, que vira entre pH 3.1 y 4.4. ¿Qué le ocurre a la concentración que acabas reportando?',
 opts:['La sobrestima','No la altera','Solo pierde precisión','La subestima'],correct:3,
 exp:'La equivalencia de un ácido débil con base fuerte cae por encima de pH 8, así que el indicador vira mucho antes y el volumen registrado es menor que el correcto. El sesgo es sistemático y siempre en la misma dirección, de modo que repetir no lo revela.'},
{tag:'M2',q:'Analizas por gravimetría una muestra de 0.2711 g y recuperas 1.1682 g de precipitado seco. Un compañero reporta 1.66 % de fósforo en la muestra. ¿Qué hizo mal en el cálculo?',
 opts:['Aplicó la pureza al final','Usó el precipitado como denominador','No pasó de precipitado a fósforo','Usó la masa molar del fósforo'],correct:1,
 exp:'El porcentaje correcto es 7.11 % respecto a los 0.2711 g de muestra. Usar los 1.1682 g del precipitado como denominador reduce el valor por un factor de 4.3 y da precisamente ese orden. El precipitado es el intermedio con el que mides, no el objeto del análisis.'},
{tag:'M2',q:'Tu curva de calibración en disolvente puro da R² = 0.9998, pero las muestras reales salen 12 % altas frente a un método de referencia ya validado. ¿Cómo se explica la discrepancia?',
 opts:['R² mal calculado','Se excedió el rango lineal','Muy pocos puntos en la curva','Efecto de matriz'],correct:3,
 exp:'R² mide qué tan bien los puntos de calibración se ajustan a una recta, nada más. Si la matriz de la muestra realza o suprime la señal respecto a los estándares en disolvente puro, el ajuste sigue siendo excelente y el resultado sesgado. Se resuelve con adición de estándar.'},
{tag:'M2',q:'Necesitas amortiguar una reacción a pH 9.2 y en el laboratorio tienes ácido acético (pKa 4.76), fosfato dihidrógeno (pKa 7.2) y amonio (pKa 9.25). ¿Cuál eliges y por qué?',
 opts:['Acético, el más débil','Fosfato, por su pKa intermedio','Cualquiera, ajustando la razón','Amonio, pKa 9.25'],correct:3,
 exp:'La capacidad amortiguadora es máxima en pKa y útil en pKa ± 1. Con pKa 9.25 la razón base/ácido es casi 1 al pH objetivo. Con los otros dos harían falta razones extremas donde el sistema prácticamente no amortigua, aunque el pH nominal se alcance.'},

/* ---------------- M3 ---------------- */
{tag:'M3',q:'Tratas 2-bromobutano con etóxido de sodio en etanol a 70 °C y aíslas un solo producto mayoritario. ¿Cuál es y por qué vía se forma en esas condiciones?',
 opts:['Alcohol, por SN1','Éter y alqueno por igual','Éter, por SN2','Alqueno, por E2'],correct:3,
 exp:'El sustrato es secundario, así que la decisión recae en el reactivo y la temperatura. El etóxido es base fuerte, no solo nucleófilo, y la eliminación produce más partículas y mayor entropía, de modo que el término TΔS la favorece al calentar. Por eso domina E2.'},
{tag:'M3',q:'Separas dos isómeros de la misma fórmula molecular: funden a 132 °C y a 158 °C, y los dos desvían el plano de la luz polarizada. ¿Qué relación guardan entre sí?',
 opts:['Enantiómeros','Uno es la forma meso','Diastereómeros','Confórmeros'],correct:2,
 exp:'Los enantiómeros tienen propiedades físicas idénticas salvo el signo de rotación, así que dos puntos de fusión distintos los descarta. Los diastereómeros no son imágenes especulares y sí difieren en propiedades físicas, lo que además permite separarlos por métodos convencionales. Una forma meso no sería ópticamente activa.'},
{tag:'M3',q:'Un polímero muestra en DSC un escalón en la línea base a 105 °C y ningún pico endotérmico hasta 300 °C; en TGA no aparece pérdida de masa antes de 340 °C. ¿Qué material es?',
 opts:['Termofijo entrecruzado','Elastómero','Amorfo','Semicristalino'],correct:2,
 exp:'El escalón en la línea base del DSC es la transición vítrea, propia de la fase amorfa. La ausencia de pico endotérmico indica que no hay regiones cristalinas, así que no hay Tm. El TGA no ve la Tg porque no implica cambio de masa, y eso es consistente con no registrar nada.'},
{tag:'M3',q:'Añades HBr a 2-metil-2-buteno en dos frascos idénticos: uno con disolvente recién destilado y otro con disolvente viejo contaminado con peróxidos. ¿Qué observas al comparar?',
 opts:['El mismo producto','Nada en el frasco con peróxido','Productos distintos','El mismo, con menor rendimiento'],correct:2,
 exp:'Sin peróxidos la adición es iónica y sigue Markovnikov, con el bromo en el carbono más sustituido. Con peróxidos se genera un radical bromo y el mecanismo pasa a radicalario, que entrega la regioselectividad opuesta. Es el ejemplo clásico de que el mecanismo gobierna el producto.'},
{tag:'M3',q:'Caracterizas un inhibidor enzimático y encuentras que baja Vmax un 40 % y deja Km sin cambio apreciable. Si duplicas la concentración de sustrato, ¿qué esperas observar?',
 opts:['Que el efecto desaparezca','Que Km aumente','Que el efecto persista','Que Vmax se recupere'],correct:2,
 exp:'Vmax reducido con Km intacto es la firma del inhibidor no competitivo: se une fuera del sitio activo y reduce la cantidad de enzima funcional. Añadir sustrato no lo desplaza porque no ocupan el mismo lugar. Solo el competitivo se vence con más sustrato.'},
{tag:'M3',q:'Una policondensación entre un diácido y una diamina se detiene al 92 % de conversión de los grupos funcionales. ¿Qué grado de polimerización medio alcanzaste?',
 opts:['Xn ≈ 92','Xn ≈ 25','Xn ≈ 200','Xn ≈ 12'],correct:3,
 exp:'La ecuación de Carothers da Xn = 1/(1 − p) = 1/0.08 = 12.5. El peso molecular solo se dispara en el último tramo de conversión: hace falta 99 % para Xn = 100. A 92 % el sistema sigue lleno de oligómeros. En polimerización en cadena, en cambio, las cadenas nacen con su peso casi final.'},
{tag:'M3',q:'Un fármaco quiral se administra como mezcla racémica y en ensayos produce el efecto terapéutico buscado más una toxicidad hepática inesperada. ¿Qué explicación es más probable?',
 opts:['El racémico es menos soluble','El racémico se degrada antes','Los enantiómeros se neutralizan','Cada uno actúa en blanco distinto'],correct:3,
 exp:'El entorno biológico es quiral, así que dos enantiómeros encajan de forma distinta en un sitio de unión. Uno puede dar el efecto terapéutico y el otro unirse a otro receptor o metabolizarse por otra vía. Sus propiedades físicas en entorno aquiral, como la solubilidad, son idénticas.'},
{tag:'M3',q:'Quieres introducir un segundo grupo nitro en un anillo aromático que ya lleva un –NO₂. ¿Qué esperas en velocidad y orientación frente al benceno sin sustituir?',
 opts:['Más rápida, orto y para','Más lenta, orto y para','Más lenta y meta','Más rápida, mezcla estadística'],correct:2,
 exp:'El nitro retira densidad electrónica por inducción y resonancia, así que desactiva el anillo frente al ataque electrofílico. Además desestabiliza el ion arenio en orto y para más que en meta, de modo que la sustitución se dirige a meta. Activante y orto-para director van siempre juntos, igual que desactivante y meta.'}
];
</script>

/* ---------------- M4 ---------------- */
{tag:'M4',q:'Mides la resistencia de un sólido desconocido: conduce mal en frío y su resistencia baja de forma sostenida conforme lo calientas. ¿De qué tipo de material se trata?',
 opts:['Aislante iónico','Superconductor','Metal con defectos','Semiconductor'],correct:3,
 exp:'En un metal el número de portadores ya es fijo y calentar aumenta la dispersión por fonones, así que la resistividad sube. En un semiconductor el número de portadores crece exponencialmente al cruzar el gap, y ese efecto domina: la resistividad baja. El signo de dT es la prueba diagnóstica.'},
{tag:'M4',q:'Un semiconductor en polvo absorbe toda la radiación de longitud de onda menor que 517 nm y refleja el resto. ¿De qué color se ve y cuál es su brecha prohibida?',
 opts:['Azul, 3.2 eV','Negro, 1.1 eV','Verde, 2.4 eV','Naranja, 2.4 eV'],correct:3,
 exp:'Eg = 1240/517 = 2.4 eV. Absorbe todo lo de longitud de onda menor que 517 nm, es decir violeta, azul y verde, y refleja el resto. El color percibido es el complementario de lo absorbido, y ese es el paso que más se falla.'},
{tag:'M4',q:'Calculas la densidad teórica del aluminio, que es FCC con a = 0.405 nm y M = 26.98 g/mol, y tu hoja de cálculo arroja 2.7×10⁶ g/cm³. ¿Dónde está el error?',
 opts:['Usaste mal el número de Avogadro','Tomaste 12 átomos por celda','Contaste 14 átomos por celda','No cubicaste el factor de unidades'],correct:3,
 exp:'El valor correcto es 2.70 g/cm³, así que el resultado está desviado por 10⁶, exactamente (10²)³. Es la firma de haber convertido nm a cm sin elevar el factor al cubo: 1 nm = 10⁻⁷ cm, y al cubo 10⁻²¹.'},
{tag:'M4',q:'Mides por picnometría la densidad de un cristal metálico y resulta 1.5 % menor que la calculada a partir de su estructura y su parámetro de red. ¿Qué lo explica?',
 opts:['Átomos intersticiales','Parámetro de red menor','Vacancias','Otra coordinación'],correct:2,
 exp:'Las vacancias son posiciones de red sin átomo: el volumen de celda es el mismo y la masa menor, así que la densidad medida baja. Los intersticiales harían lo contrario. El número de coordinación no entra en el cálculo de densidad, que solo usa átomos por celda, masa molar y parámetro de red.'},
{tag:'M4',q:'Dopas silicio de alta pureza con fósforo a razón de un átomo por millón y vuelves a medir sus propiedades eléctricas. ¿Qué cambia en la estructura de bandas?',
 opts:['Se vuelve metálico','El gap se ensancha','El gap se estrecha','Aparece un nivel donador'],correct:3,
 exp:'El ancho del gap es una propiedad del silicio y su estructura, y una parte por millón no lo altera. Lo que hace el dopante es colocar un nivel a unos 0.045 eV bajo la banda de conducción, del que el electrón escapa con la energía térmica disponible (kT = 0.026 eV). Sigue siendo semiconductor, ahora tipo n.'},
{tag:'M4',q:'Identificas un plano cristalográfico que corta al eje a en 1/2, corta al eje b en 1 y es paralelo al eje c, de modo que nunca lo corta. ¿Cuál es su índice de Miller?',
 opts:['(1½0)','(012)','(120)','(210)'],correct:3,
 exp:'Los recíprocos de 1/2, 1 e ∞ son 2, 1 y 0, que ya son los enteros más pequeños. Los índices de Miller nunca llevan fracciones, precisamente porque el recíproco las elimina, y el orden de los ejes importa.'},
{tag:'M4',q:'Comparas dos lotes de puntos cuánticos del mismo semiconductor, uno de 3 nm y otro de 6 nm de diámetro, bajo idéntica excitación. ¿Qué esperas al comparar su emisión?',
 opts:['El de 3 nm emite más al azul','El de 6 nm emite más al azul','Los dos emiten igual','El de 3 nm no emite'],correct:0,
 exp:'En la partícula en una caja E ∝ 1/L², así que el más pequeño tiene mayor energía de confinamiento y por tanto gap efectivo mayor y emisión desplazada al azul. Reducir la dimensión a la mitad cuadruplica el término de confinamiento. Los distractores suelen invertir esta dirección.'},
{tag:'M4',q:'Dos compuestos tienen enlaces individuales igual de polares, pero uno presenta momento dipolar neto nulo y el otro no. ¿Qué propiedad los distingue?',
 opts:['Los pares libres del central','La fuerza de cada enlace','La electronegatividad','La simetría de la geometría'],correct:3,
 exp:'El momento dipolar molecular es la suma vectorial de los momentos de enlace. En una geometría simétrica como la tetraédrica con cuatro ligandos iguales (CCl₄) los vectores se cancelan exactamente; romper la simetría (CHCl₃) deja resultante. La polaridad del enlace es idéntica en ambos casos.'},

/* ---------------- M5 ---------------- */
{tag:'M5',q:'Una reacción exotérmica en fase gas alcanza el equilibrio en un reactor y entonces subes la temperatura. ¿Qué ocurre con el valor de K y con la posición del equilibrio?',
 opts:['K sube, hacia productos','K baja, hacia reactivos','K igual, hacia reactivos','K baja, sin desplazarse'],correct:1,
 exp:'La temperatura es la única perturbación que modifica el valor de K, vía ΔG° = −RT ln K. En una exotérmica el calor se comporta como producto, así que añadirlo desplaza hacia reactivos y K disminuye. Concentración, volumen y catalizador mueven la posición sin tocar K.'},
{tag:'M5',q:'En un estudio cinético duplicas la concentración inicial de A dejando todo lo demás constante y la velocidad inicial se multiplica por ocho. ¿Qué orden tiene respecto de A?',
 opts:['Segundo orden','Primer orden','Tercer orden','Orden cero'],correct:2,
 exp:'De v₂/v₁ = ([A]₂/[A]₁)ⁿ sale 8 = 2ⁿ, es decir n = 3. Segundo orden daría factor 4 y primer orden factor 2. El orden es empírico y no se lee de los coeficientes de la ecuación balanceada salvo que sea elemental.'},
{tag:'M5',q:'El ΔG° de una reacción vale −20 kJ/mol, pero al mezclar las especies en el matraz observas que el sistema evoluciona en sentido inverso. ¿Es posible ese comportamiento?',
 opts:['No, ΔG° negativo lo impide','Sí, si Q es muy grande','Solo bajo la T de cruce','No, salvo barrera cinética'],correct:1,
 exp:'ΔG° describe condiciones estándar; el sentido real lo decide ΔG = ΔG° + RT ln Q con las concentraciones del momento. Si arrancas con mucho producto y poco reactivo, Q es enorme y el término RT ln Q puede volver ΔG positivo. Es la confusión número uno del tema.'},
{tag:'M5',q:'Tienes un equilibrio gaseoso ya establecido en un recipiente rígido y le inyectas argón hasta duplicar la presión total del sistema. ¿Qué le ocurre al equilibrio?',
 opts:['Se corre hacia menos moles','No cambia nada','Se corre hacia más moles','Aumenta el valor de K'],correct:1,
 exp:'A volumen constante, un gas inerte eleva la presión total pero no altera el número de moles ni el volumen de las especies reactivas, así que sus presiones parciales quedan iguales y Q sigue valiendo K. Es el distractor clásico del tema.'},
{tag:'M5',q:'Dos reacciones distintas tienen idéntico ΔG° en las mismas condiciones, pero una se completa en segundos y la otra tardaría siglos. ¿Qué es lo que difiere entre ellas?',
 opts:['La espontaneidad','La energía de activación','La constante de equilibrio','El signo de ΔS'],correct:1,
 exp:'ΔG° fija K y por tanto la composición final del equilibrio, no la rapidez. La velocidad la gobierna la barrera de activación, que es una propiedad del camino y no de los estados inicial y final. El diamante hacia grafito es el ejemplo canónico: ΔG negativo y velocidad indetectable.'},
{tag:'M5',q:'Enfrías hasta congelarlas una disolución acuosa de glucosa 0.10 m y otra de CaCl₂ 0.10 m. ¿Cuál de las dos presenta el mayor descenso del punto de fusión y por qué?',
 opts:['La glucosa, molécula mayor','Las dos por igual','El CaCl₂, su i ≈ 3','El CaCl₂, por su masa molar'],correct:2,
 exp:'Las coligativas dependen del número de partículas en disolución, no de su identidad ni tamaño. La glucosa no se disocia (i = 1) y el CaCl₂ da tres iones (i ≈ 3), así que su descenso crioscópico es unas tres veces mayor. Omitir el factor i da justo el valor de uno de los distractores.'},
{tag:'M5',q:'Añades un catalizador a una reacción reversible que ya había alcanzado el equilibrio dentro del reactor. ¿Qué cambia en la composición final de la mezcla?',
 opts:['Sube la proporción de productos','No cambia nada','Baja la de productos','Depende del tipo de catalizador'],correct:1,
 exp:'El catalizador no altera la energía de reactivos ni de productos, así que ΔG° y por tanto K quedan intactos. Baja la barrera por igual en los dos sentidos, multiplicando k directa e inversa por el mismo factor: llega antes al mismo punto. Su utilidad es permitir trabajar a temperatura más baja, donde K puede ser más favorable.'},
{tag:'M5',q:'Una suspensión de nanopartículas estable durante meses en agua destilada se agrega en minutos al diluirla en medio fisiológico con 150 mM de electrolito. ¿Por qué ocurre?',
 opts:['Se diluyó el estabilizante','La sal comprime la doble capa','El pH neutraliza la superficie','El browniano se acelera'],correct:1,
 exp:'El medio fisiológico tiene unos 150 mM de electrolito. Al subir la fuerza iónica, los contraiones apantallan la carga superficial a distancias más cortas, la barrera de DLVO baja y los choques brownianos empiezan a superarla. Por eso en aplicaciones biológicas se prefiere estabilización estérica con PEG, que no depende del apantallamiento.'},

/* ---------------- M6 ---------------- */
{tag:'M6',q:'Comparas dos lotes del mismo material, uno con partículas de 4 nm y otro de 40 nm. ¿Cuántas veces mayor es la fracción de átomos superficiales en el lote pequeño?',
 opts:['Cien veces','Mil veces','La misma fracción','Diez veces'],correct:3,
 exp:'La fracción de átomos superficiales es aproximadamente 3δ/R, es decir va como el inverso del radio. Al dividir el radio entre diez, la fracción se multiplica por diez. Confundirlo con área o volumen es el error típico: esos escalan con otras potencias.'},
{tag:'M6',q:'Tu síntesis de oro coloidal sale violácea en vez de roja; el DLS reporta 85 nm y el TEM muestra núcleos de 22 nm con contornos limpios y lisos. ¿Qué ocurrió en el matraz?',
 opts:['Crecieron de más','Agregación','Reducción incompleta','Exceso de estabilizante'],correct:1,
 exp:'Si el TEM muestra núcleos de 22 nm, las partículas individuales no crecieron: el DLS de 85 nm con el color desplazado al rojo delata racimos en suspensión. El acoplamiento de plasmones entre partículas vecinas corre la banda al rojo y el color percibido vira a violeta o azul.'},
{tag:'M6',q:'Necesitas un lote de nanopartículas monodispersas, con desviación de tamaño por debajo del 10 %, a partir de un precursor en disolución. ¿Qué estrategia lo consigue?',
 opts:['Prolongar la reacción','Agitar con más vigor','Inyección caliente','Añadir precursor lento'],correct:2,
 exp:'Según LaMer, la monodispersidad exige separar en el tiempo una nucleación explosiva del crecimiento posterior. La inyección rápida cruza el umbral de golpe, consume el monómero y hace caer la concentración por debajo del umbral, deteniendo la nucleación. Añadir lento solaparía nucleación y crecimiento y daría distribución ancha.'},
{tag:'M6',q:'Sintetizas TiO₂ por sol-gel y lo calcinas a 700 °C para cristalizarlo, pero su actividad fotocatalítica resulta menor que la del mismo material calcinado a 450 °C. ¿Por qué?',
 opts:['Perdió toda su cristalinidad','Pasó a rutilo y perdió área','El gap se estrechó demasiado','Entraron impurezas de carbono'],correct:1,
 exp:'Por encima de unos 600 °C la anatasa transita a rutilo, que es menos activo, y simultáneamente crece el tamaño de grano y cae el área superficial. Dos efectos que reducen la actividad a la vez. La calcinación cristaliza el amorfo del sol-gel, pero ese es su costo.'},
{tag:'M6',q:'Recubres una estructura con poros profundos y estrechos por dos vías distintas: una por sputtering y otra por depósito de capa atómica. ¿Qué diferencia esperas dentro del poro?',
 opts:['El sputtering será uniforme','El ALD será conformal','Los dos cubren igual','El ALD tapará la entrada'],correct:1,
 exp:'El sputtering es un proceso de línea de vista: deposita donde llega el flujo y tiende a cerrar la boca del poro sin recubrir el fondo. El ALD pulsa precursores que saturan toda la superficie accesible y crece una capa por ciclo, de modo que recubre el interior con espesor uniforme. Es lento y a cambio insuperable en conformidad.'},
{tag:'M6',q:'Necesitas abrir en una oblea de silicio una zanja profunda de paredes verticales, con relación de aspecto mayor que diez. ¿Qué tipo de grabado empleas para conseguirlo?',
 opts:['Húmedo con ácido','Húmedo con KOH','Seco por plasma','Cualquiera de los tres'],correct:2,
 exp:'Solo el grabado direccional con iones acelerados perpendicularmente da paredes verticales y por tanto alta relación de aspecto. El húmedo isotrópico socava bajo la máscara, y el KOH sobre silicio {100} produce paredes inclinadas a 54.7°, que es el ángulo entre los planos {100} y {111}.'},
{tag:'M6',q:'Añades a la síntesis un agente director de forma que se adsorbe selectivamente sobre una familia de caras cristalinas y frena su crecimiento. ¿Qué morfología resulta?',
 opts:['Esas caras desaparecen','Esas caras dominan','Queda esférica','La forma no cambia'],correct:1,
 exp:'La regla es contraintuitiva: una cara que crece rápido se cierra y desaparece de la forma final, mientras que las lentas sobreviven. Al pasivar una familia la vuelve lenta y por tanto persistente. Así el CTAB produce nanovarillas de oro y la PVP nanocubos de plata.'},
{tag:'M6',q:'Dejas envejecer un mes dos suspensiones. En A el número de partículas cae y el tamaño medio sube; en B aparecen racimos sin que los contornos individuales cambien. ¿Qué ocurrió?',
 opts:['Agregación en A, Ostwald en B','Ostwald en las dos','Agregación en las dos','Ostwald en A, agregación en B'],correct:3,
 exp:'La maduración de Ostwald disuelve las pequeñas y redeposita sobre las grandes, así que el número total baja y los contornos siguen siendo lisos. La agregación pega partículas que conservan su identidad dentro del racimo. Se combaten distinto: Ostwald con menos solubilidad o temperatura, la agregación estabilizando.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M7 ---------------- */
{tag:'M7',q:'Un pico de difracción aparece a 2θ = 38.2° en un difractómetro con radiación de cobre (λ = 0.15406 nm). ¿Cuál es el espaciado interplanar de esa familia de planos?',
 opts:['0.2354 nm','0.1242 nm','0.4708 nm','0.1177 nm'],correct:0,
 exp:'d = λ/(2 sen θ) con θ = 19.1°, la mitad del 2θ reportado: 0.15406/(2×0.3272) = 0.2354 nm. Usar 38.2° directamente en el seno da 0.1242 nm, y es el error más frecuente del módulo.'},
{tag:'M7',q:'En una misma muestra la ecuación de Scherrer arroja 12 nm mientras el TEM muestra partículas bien separadas de 60 nm. ¿Qué concluyes de esa discrepancia?',
 opts:['El TEM midió agregados','Son policristalinas','Hay error de unidades','Scherrer no aplica aquí'],correct:1,
 exp:'Cristalito y partícula no son sinónimos: la difracción solo ve el dominio coherente, así que una partícula de 60 nm puede estar hecha de varios dominios de 12 nm. Es una de las confusiones más preguntadas. La microdeformación también ensancha, pero no explicaría una diferencia de este tamaño.'},
{tag:'M7',q:'Indexas un difractograma y las posiciones de todos los picos coinciden con la ficha de referencia, pero las intensidades relativas no se parecen. ¿Qué indica eso?',
 opts:['La fase no es la supuesta','El cristalito es muy pequeño','Orientación preferencial','Hay fracción amorfa'],correct:2,
 exp:'Las posiciones dependen de los espaciados interplanares, así que coincidir confirma fase y parámetro de red. Las intensidades dependen de cuántos cristalitos están orientados para difractar en cada familia de planos: si no están al azar, unas se sobrerrepresentan. Es típico en películas delgadas y materiales laminares.'},
{tag:'M7',q:'Necesitas determinar si el hierro de los primeros nanómetros de una superficie está como Fe²⁺ o como Fe³⁺, sin alterar la muestra. ¿Qué técnica eliges?',
 opts:['EDS con mapeo elemental','DRX de los dos óxidos','BET con nitrógeno','XPS de alta resolución'],correct:3,
 exp:'XPS mide energías de enlace de electrones internos, que se desplazan según el entorno químico, con profundidad de unos pocos nanómetros. El EDS da elementos pero no estado de oxidación, porque sus rayos X vienen de transiciones internas insensibles al enlace.'},
{tag:'M7',q:'Quieres registrar los modos vibracionales de una proteína disuelta en agua, sin liofilizarla ni cambiar de disolvente. ¿Qué espectroscopía vibracional eliges?',
 opts:['Cualquiera de las dos','Raman en el visible','FTIR por las amidas','FTIR, el agua no absorbe'],correct:1,
 exp:'El agua tiene bandas de absorción infrarroja muy intensas que saturan justo la región de interés, mientras que su sección eficaz Raman es pequeña. Por eso el Raman domina en muestras acuosas y biológicas. Restar el fondo no recupera información donde el detector ya está saturado.'},
{tag:'M7',q:'En una TGA en aire, una nanopartícula funcionalizada pierde 2 % de masa hasta 120 °C y otro 14 % entre 200 y 400 °C. ¿Qué porcentaje de recubrimiento orgánico tiene?',
 opts:['16 %','14 %','2 %','No puede saberse'],correct:1,
 exp:'La pérdida por debajo de 120 °C es agua fisisorbida y disolvente residual, que no cuenta como recubrimiento. El intervalo de 200 a 400 °C es el de descomposición oxidativa de cadenas orgánicas: ese 14 % es el contenido de ligando. El área por BET sirve para la densidad de injerto, no para el porcentaje.'},
{tag:'M7',q:'Mides con AFM una nanopartícula nominalmente de 20 nm y el perfil da 42 nm de anchura pero 19 nm de altura. ¿Cuál de los dos datos tomas como diámetro?',
 opts:['El promedio de ambos','La altura','La anchura','Ninguno, recalibrar'],correct:1,
 exp:'Toda imagen de AFM es la convolución entre la topografía real y la geometría de la punta, así que los objetos salientes aparecen más anchos. La resolución vertical depende de la deflexión de la micropalanca y no de la punta, de modo que la altura es el dato confiable.'},
{tag:'M7',q:'Analizas por EDS una nanopartícula aislada de 30 nm depositada sobre una oblea de silicio y el espectro queda dominado por la señal de silicio. ¿Por qué ocurre?',
 opts:['La partícula lleva silicio','El detector está descalibrado','El volumen de interacción','Alto rendimiento del silicio'],correct:2,
 exp:'El haz penetra y se dispersa generando rayos X en un volumen en forma de pera de uno o varios micrómetros, mucho mayor que la partícula. Con objetos nanométricos sobre sustrato, la contribución del sustrato domina. Se resuelve con soportes ligeros y delgados o con EDS en TEM sobre muestra fina.'},

/* ---------------- M8 ---------------- */
{tag:'M8',q:'En un microcanal cilíndrico reduces el radio de 100 a 50 µm manteniendo exactamente la misma caída de presión entre los extremos. ¿Qué le ocurre al caudal?',
 opts:['Baja a la cuarta parte','No cambia','Cae a la dieciseisava parte','Se reduce a la mitad'],correct:2,
 exp:'Hagen-Poiseuille hace el caudal proporcional a r⁴, así que dividir el radio entre dos lo divide entre 2⁴ = 16. Esa sensibilidad extrema explica por qué una obstrucción parcial afecta tanto y por qué el canal más estrecho domina la resistencia de toda la red.'},
{tag:'M8',q:'Dos corrientes confluyen en un microcanal con Re = 0.5 y recorren tres centímetros lado a lado sin mezclarse. ¿Qué harías para conseguir que se mezclen?',
 opts:['Subir el caudal hasta turbulencia','Geometría que pliegue las corrientes','Ampliar la sección del canal','Calentar el fluido'],correct:1,
 exp:'Con Re muy por debajo de 2000 el flujo es laminar y no hay mezcla convectiva. Alcanzar turbulencia en un canal de 100 µm exigiría velocidades inviables. Lo que se hace es forzar el plegamiento con canales serpenteantes y surcos en el fondo, o trabajar en gotas.'},
{tag:'M8',q:'La frecuencia de resonancia de una micropalanca MEMS pasa de 1.000 MHz a 0.998 MHz tras exponerla durante diez minutos a un analito en fase gas. ¿Qué ocurrió?',
 opts:['Se desorbió material','Subió la rigidez efectiva','Adsorbió masa','Hubo deriva térmica'],correct:2,
 exp:'De Δf/f₀ ≈ −Δm/(2m), adsorber masa baja la frecuencia. El signo es lo que se pregunta: aquí la caída de 2 kHz corresponde a una masa añadida. Perder masa la subiría, y un aumento de rigidez también.'},
{tag:'M8',q:'En voltamperometría cíclica registras que la corriente de pico crece de forma proporcional a la velocidad de barrido v, y no a su raíz cuadrada. ¿Qué significa?',
 opts:['El barrido es muy rápido','El proceso es irreversible','Excede el rango lineal','La especie está adsorbida'],correct:3,
 exp:'Randles-Ševčík predice i_p proporcional a √v para una especie que difunde desde la disolución. Si la dependencia es lineal en v, la especie ya está en la superficie y no necesita difundir. Es un diagnóstico estándar para distinguir ambos regímenes.'},
{tag:'M8',q:'Comparas un biosensor de glucosa de primera generación con uno de segunda en muestras cuya concentración de oxígeno disuelto varía. ¿Qué diferencia esperas?',
 opts:['La primera será más estable','Las dos leerán igual','La segunda será más consistente','La segunda pierde selectividad'],correct:2,
 exp:'La primera generación usa oxígeno como aceptor natural de electrones, así que su lectura varía con una magnitud incontrolada. El mediador artificial de la segunda toma ese papel y hace la respuesta independiente del oxígeno, que es exactamente el problema que resuelve. La selectividad la aporta la enzima.'},
{tag:'M8',q:'El silicio domina la microelectrónica, pero prácticamente ningún diodo emisor de luz comercial está hecho de silicio. ¿Cuál es la razón física de fondo?',
 opts:['Su gap es demasiado ancho','Su movilidad es insuficiente','Su gap es indirecto','No admite dopaje tipo p'],correct:2,
 exp:'En un semiconductor indirecto el mínimo de conducción y el máximo de valencia están en distinto vector de onda, así que la recombinación radiativa necesita además un fonón: un proceso de tres cuerpos, mucho menos probable que la no radiativa. Su gap de 1.12 eV es estrecho, no ancho, y se dopa perfectamente en ambos tipos.'},
{tag:'M8',q:'Un sustrato SERS entrega señales del mismo analito que varían hasta un 40 % entre puntos separados unas decenas de micras. ¿Cuál es la causa de fondo de esa dispersión?',
 opts:['El láser pierde potencia','Depende de puntos calientes','El detector satura','La molécula se fotodegrada'],correct:1,
 exp:'El factor de amplificación escala aproximadamente con la cuarta potencia del refuerzo de campo, de modo que una fracción diminuta de posiciones privilegiadas aporta la mayor parte de la señal. Como la densidad de esos puntos varía espacialmente, la reproducibilidad cuantitativa es el problema central del método.'},
{tag:'M8',q:'Diseñas un acelerómetro capacitivo y, para ganar sensibilidad, decides suavizar los resortes de suspensión bajando su constante elástica. ¿Qué estás sacrificando a cambio?',
 opts:['La resolución del circuito','El ancho de banda','El rango dinámico','Nada, son independientes'],correct:1,
 exp:'El desplazamiento estático es x = ma/k, así que menor k da más señal. Pero ω = √(k/m) baja con k, y con ella el ancho de banda útil y la robustez frente a choques. Sensibilidad y ancho de banda están en conflicto directo, y ese compromiso es el núcleo del diseño.'}
);
</script>

QUIZ.push(
/* ---------------- M9 ---------------- */
{tag:'M9',q:'Llevas una reacción exotérmica de 50 mL a 500 L sin cambiar la química ni las concentraciones, y en el reactor grande se descontrola térmicamente. ¿Por qué ocurre?',
 opts:['El área creció menos que el volumen','k aumenta con el volumen del lote','ΔH se vuelve más negativa al escalar','La agitación resulta menos eficaz'],correct:0,
 exp:'El calor generado es proporcional al volumen (k³) y el disipado al área (k²), así que la razón entre ambos empeora linealmente con el factor de escala. La química no cambió: cambió la geometría. Es el modo de fallo más citado del escalamiento y obliga a rediseñar la refrigeración.'},
{tag:'M9',q:'Escalas un reactor agitado conservando la potencia por unidad de volumen, que es el criterio más usado en la industria. ¿Qué le ocurre a la velocidad de punta del impulsor?',
 opts:['Se mantiene constante','Sube con D^(1/3)','Baja con las revoluciones','Queda indeterminada'],correct:1,
 exp:'Conservar P/V exige N proporcional a D^(−2/3), así que las revoluciones bajan. Pero la velocidad de punta es πND, que escala como D^(1/3): aumenta. Por eso los criterios son incompatibles, y en células o cristales frágiles se conserva la punta sacrificando mezclado.'},
{tag:'M9',q:'Una síntesis que daba nanopartículas monodispersas pierde la uniformidad al escalarla diez veces, conservando P/V y la misma receta química. ¿Qué lo explica?',
 opts:['El precursor se degrada','La temperatura es menos homogénea','Creció el tiempo de mezclado','Se diluyó el estabilizante'],correct:2,
 exp:'LaMer exige un estallido de nucleación simultáneo en todo el volumen. Al escalar bajo P/V constante el tiempo de mezclado crece, de modo que unas zonas nuclean antes que otras y las partículas dejan de tener la misma edad. El flujo continuo lo evita escalando por tiempo de operación en lugar de por volumen.'},
{tag:'M9',q:'Optimizas una síntesis con tres factores a dos niveles usando el método de una variable a la vez, y llegas a una combinación que parece óptima. ¿Qué riesgo corres?',
 opts:['Gastar más corridas que el factorial','No poder estimar el error','No detectar interacciones','Introducir sesgo de orden'],correct:2,
 exp:'Al fijar las demás variables mides el efecto de cada factor en una sola combinación de las otras. Si ese efecto depende del nivel de otro factor, algo habitual en síntesis de nanomateriales, la conclusión no generaliza y puedes quedarte en un óptimo local. El ahorro de corridas es una ventaja secundaria del factorial.'},
{tag:'M9',q:'Con 500 réplicas por grupo obtienes p < 0.001 para una diferencia de 0.3 nm en el tamaño medio de dos lotes de nanopartículas. ¿Qué es lo correcto reportar?',
 opts:['Que son indistinguibles','Que existe, pero quizá no importe','Que el efecto es importante','Que hubo error de cálculo'],correct:1,
 exp:'Con muestras grandes, diferencias minúsculas alcanzan significancia. El valor p responde a si el efecto existe, no a si importa. Por eso hay que reportar el tamaño del efecto con su intervalo de confianza y juzgar la relevancia contra el requisito de la aplicación.'},
{tag:'M9',q:'Mides el radio de una nanopartícula esférica con una incertidumbre relativa del 4 % y con ese dato calculas su volumen. ¿Qué incertidumbre relativa arrastra el volumen?',
 opts:['1.3 %','16 %','12 %','4 %'],correct:2,
 exp:'Para y = aⁿ la incertidumbre relativa se multiplica por el exponente. Como el volumen va con r³, el 4 % se convierte en 12 %. Es la razón de que en nanotecnología la incertidumbre del tamaño se amplifique al pasar a magnitudes volumétricas o másicas.'},
{tag:'M9',q:'Un reactor alcanza 30 % de conversión por paso y recirculas al reactor todo el reactivo no convertido tras separarlo del producto. ¿Cuál es la conversión global del proceso?',
 opts:['30 %','70 %','No se puede determinar','100 %'],correct:3,
 exp:'Con un volumen de control que encierra todo el proceso, la recirculación no cruza la frontera. Si el único destino final del reactivo es convertirse, la conversión global es total. El precio es un caudal de recirculación elevado, con su costo de bombeo y separación, y una purga si entran inertes.'},
{tag:'M9',q:'Para una cinética de orden positivo respecto al reactivo y una misma conversión final exigida, ¿qué configuración de reactor necesita el menor volumen de operación?',
 opts:['El CSTR de mezcla perfecta','El PFR de flujo pistón','Los dos el mismo volumen','Depende de la temperatura'],correct:1,
 exp:'El CSTR opera en todo su volumen a la concentración de salida, la más baja del proceso, y por tanto a la velocidad más lenta. El PFR mantiene un gradiente y aprovecha las concentraciones altas de la entrada. La excepción son las cinéticas autocatalíticas o con inhibición por sustrato.'},

/* ---------------- M10 ---------------- */
{tag:'M10',q:'Preparas una mezcla de surfactantes con Span 80 (HLB 4.3) y Tween 80 (HLB 15.0) en proporción másica 40:60. ¿Qué HLB tiene la mezcla resultante?',
 opts:['9.7','19.3','7.4','10.7'],correct:3,
 exp:'El HLB de una mezcla es el promedio ponderado por fracción másica: 0.40 × 4.3 + 0.60 × 15.0 = 10.72. Con ese valor, en la zona de 8 a 18, la mezcla favorece emulsiones de aceite en agua por la regla de Bancroft.'},
{tag:'M10',q:'Una emulsión que dejas reposar se separa en dos capas visibles, pero basta agitar el frasco para recuperarla homogénea e íntegra. ¿Qué mecanismo de inestabilidad actuó?',
 opts:['Coalescencia','Maduración de Ostwald','Inversión de fases','Cremado o floculación'],correct:3,
 exp:'La reversibilidad por agitación indica que las gotas conservaron su identidad y solo se separaron espacialmente o se agruparon. La coalescencia funde gotas de forma irreversible y la maduración transfiere material entre ellas, y ninguna de las dos se deshace agitando.'},
{tag:'M10',q:'Tu nanopartícula con ligando de direccionamiento reconoce su receptor en cultivo celular pero no acumula en el tumor al inyectarla. ¿Cuál es la explicación más probable?',
 opts:['La corona proteica tapó el ligando','El ligando se hidroliza en plasma','La dosis fue insuficiente','El receptor no se expresa'],correct:0,
 exp:'En fluido biológico la partícula queda recubierta de proteínas plasmáticas en milisegundos, así que lo que la célula encuentra es la corona y no la superficie diseñada. El medio in vitro tiene mucha menos proteína, y esa diferencia explica buena parte de la brecha entre ambos resultados.'},
{tag:'M10',q:'Un candidato a fármaco tiene masa molecular 620 Da y logP 6.2, de modo que viola dos de los criterios de la regla de cinco de Lipinski. ¿Qué se concluye de eso?',
 opts:['Que es tóxico y se descarta','Su absorción oral será pobre','Que no se puede administrar','Que el riñón lo eliminará'],correct:1,
 exp:'La regla es una heurística estadística sobre absorción oral por difusión pasiva, no un juicio de toxicidad ni de viabilidad general. La vía intravenosa y la encapsulación en un transportador cambian el problema, porque quien atraviesa las barreras deja de ser la molécula libre.'},
{tag:'M10',q:'En una emulsión almacenada las gotas pequeñas desaparecen y las grandes crecen, sin que el microscopio muestre gotas en contacto ni fusionándose. ¿Cómo lo frenas?',
 opts:['Subiendo el potencial zeta','Añadiendo más surfactante','Con un aditivo insoluble','Agitando con más frecuencia'],correct:2,
 exp:'Es maduración de Ostwald: el material difunde desde las gotas pequeñas, más solubles por curvatura, hacia las grandes, sin contacto. Los estabilizantes coloidales previenen floculación y coalescencia pero no este mecanismo. Un componente que no pueda salir de la gota genera una contrapresión osmótica que lo contrarresta.'},
{tag:'M10',q:'Defines los puntos críticos de control de una síntesis de nanopartículas para uso biomédico. ¿Por qué la nucleación califica como crítico y no como un paso meramente importante?',
 opts:['Es la etapa más costosa','Genera los residuos peligrosos','Es la etapa más larga','Nada posterior corrige el tamaño'],correct:3,
 exp:'La prueba para distinguir un punto crítico es si existe una etapa posterior capaz de corregir el fallo. El tamaño queda fijado en la nucleación y el crecimiento inicial, y ni la purificación ni el envasado lo reparan, así que el control debe aplicarse ahí con límites numéricos medibles.'},
{tag:'M10',q:'Un proceso funciona en planta piloto y cumple las especificaciones, pero su costo por unidad resulta diez veces mayor que el de la alternativa ya establecida. ¿Qué afirmas?',
 opts:['Es viable con financiamiento','Es factible pero no viable','Es viable: ya funciona','No es factible por su costo'],correct:1,
 exp:'Factible responde «se puede»; viable responde «conviene». Son preguntas distintas y confundirlas arruina un análisis de caso. Una tecnología que funciona, cuesta diez veces más y no resuelve un problema que la alternativa no resuelva, no tiene camino comercial.'},
{tag:'M10',q:'Vas a manipular por primera vez un nanomaterial en polvo cuya toxicidad por inhalación no está caracterizada. Según la jerarquía de controles, ¿qué medida es la prioritaria?',
 opts:['Mascarilla con filtro de partículas','Firmar consentimiento informado','Manejarlo en suspensión','Documentarlo en la bitácora'],correct:2,
 exp:'La jerarquía de controles pone primero eliminar o sustituir, luego ingeniería, después procedimientos y en último lugar el equipo de protección personal, que es el menos fiable porque depende del comportamiento humano. Manejar en suspensión elimina la vía de exposición dominante, que es la inhalación de material aerosolizado.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M2 · ampliación ---------------- */
{tag:'M2',q:'Necesitas preparar 500 mL de HCl 0.10 M a partir de una disolución madre 2.0 M, usando pipeta y matraz aforado. ¿Qué volumen de la madre tomas?',opts:['10 mL','50 mL','25 mL','100 mL'],correct:2,exp:'C₁V₁ = C₂V₂ ⇒ V₁ = (0.10 × 500)/2.0 = 25 mL. El factor de dilución es 20, así que el volumen de madre es el final entre 20. Los distractores corresponden a dividir entre 5, entre 50 y entre 10.'},
{tag:'M2',q:'Mides una muestra en el espectrofotómetro y la absorbancia sale 1.85, por encima del último punto de tu curva de calibración. ¿Qué haces antes de usar el dato?',opts:['Aceptarlo, mejor señal-ruido','Restar el blanco otra vez','Extrapolar la calibración','Diluir la muestra'],correct:3,exp:'Por encima de A ≈ 1 la ley de Beer se desvía por luz parásita, anchura de banda finita e interacción entre absorbentes, y el detector recibe muy poca luz. El intervalo de trabajo fiable es 0.1 a 1.0. Extrapolar una calibración fuera de su rango lineal no arregla un problema físico.'},
{tag:'M2',q:'Observas la curva completa de titulación de un ácido débil con base fuerte, desde la primera gota hasta el exceso de titulante. ¿En qué tramo la pendiente es mínima?',opts:['En la zona tampón','En la equivalencia','Antes de la primera gota','Pasada la equivalencia'],correct:0,exp:'En la región donde coexisten el ácido y su base conjugada, añadir titulante solo cambia la razón entre ambos, y el pH se mueve poco: es la meseta tampón, con su centro en pH = pKa. En la equivalencia ocurre lo contrario, el salto más brusco de toda la curva.'},
{tag:'M2',q:'Calibras un electrodo selectivo de ion a 25 °C y después mides con él muestras termostatizadas a 37 °C sin recalibrar el equipo. ¿Qué error sistemático aparece?',opts:['El electrodo deja de responder','La pendiente pasa a 62 mV','Ninguno, porque E° no cambia','Se invierte la selectividad'],correct:1,exp:'El término de Nernst es RT/nF, proporcional a la temperatura absoluta. A 25 °C el coeficiente decimal vale 0.0592 V y a 37 °C sube a 0.0616 V. Usar la pendiente equivocada sesga sistemáticamente las lecturas, y el efecto crece cuanto más lejos esté la muestra del punto de calibración.'},
{tag:'M2',q:'Debes cuantificar diez metales traza en muestras de agua y eliges entre absorción atómica de llama e ICP-MS. ¿Qué argumento decide la elección del instrumento?',opts:['Tienen el mismo LOD','La AAS prepara menos muestra','El ICP-MS: todos y más bajo','La AAS es multielemental'],correct:2,exp:'La AAS de llama es esencialmente monoelemental: hay que cambiar la lámpara para cada analito. El ICP excita todos los elementos simultáneamente en el plasma, y acoplado a espectrometría de masas alcanza límites varios órdenes por debajo. Para diez metales traza la diferencia en tiempo y sensibilidad es decisiva.'},
{tag:'M2',q:'Obtienes cinco réplicas de una determinación: 10.2, 10.3, 10.1, 10.2 y 11.8. ¿Qué procede hacer con el último valor antes de reportar la media del conjunto?',opts:['Descartarla por inspección','Conservarla siempre','Repetir la serie completa','Aplicar la prueba Q'],correct:3,exp:'Un valor sospechoso se trata con un criterio estadístico declarado antes de ver los datos, no por inspección visual. La prueba Q compara la diferencia con el vecino más próximo contra el rango total. Descartar porque un dato incomoda es mala práctica, y conservar un error grosero evidente también distorsiona.'},
{tag:'M2',q:'Sumas tres masas medidas en balanzas de distinta resolución: 12.11 g, 8.4 g y 1.234 g. ¿Cómo reportas el resultado respetando las reglas de cifras significativas?',opts:['21.7','21.744','21.74','22'],correct:0,exp:'En sumas y restas manda el menor número de decimales, y 8.4 solo tiene uno. En multiplicaciones y divisiones mandaría el menor número de cifras significativas, que es un criterio distinto. Confundir ambas reglas es el error de cifras más frecuente.'},
{tag:'M2',q:'Determinas cloruro por el método de Mohr valorando con nitrato de plata hasta el viraje rojizo, y reportas 28.4 mg/L. ¿Qué supuesto está detrás de ese cálculo?',opts:['Que el pH no influye','Estequiometría 1 a 1','Que el cromato precipita Cl⁻','Que la plata está en exceso'],correct:1,exp:'El AgCl se forma mol a mol, así que los moles de plata gastados igualan a los de cloruro. El cromato solo precipita cuando el cloruro ya se agotó, y de ahí el viraje rojizo. El pH sí importa en el método de Mohr, pero no entra en la estequiometría del cálculo.'},
{tag:'M2',q:'A un buffer de acetato preparado a pH 4.76, exactamente su pKa, le añades una pequeña alícuota de HCl 0.1 M. ¿Qué ocurre con el pH de la disolución?',opts:['El buffer se destruye','El pH sube','El acetato capta el protón','El pH baja proporcional'],correct:2,exp:'A pH igual al pKa hay cantidades comparables de ácido y base conjugada, de modo que la base neutraliza el protón añadido convirtiéndose en ácido. La razón entre ambas formas cambia poco y el logaritmo cambia aún menos. El tampón se agota solo cuando una de las dos formas se consume.'},
{tag:'M2',q:'Analizas el mismo lote por gravimetría y por espectrofotometría y obtienes 7.1 % y 8.9 % del mismo analito, con buena precisión en cada uno. ¿Qué haces primero?',opts:['Promediar los dos valores','Quedarte con la gravimetría','Repetir hasta converger','Buscar la interferencia'],correct:3,exp:'Una discrepancia entre métodos independientes es información, no ruido: indica que al menos uno tiene un sesgo específico, por coprecipitación en gravimetría o por interferencia espectral en el otro. Promediar oculta el problema y repetir hasta coincidir es forzar el resultado hacia una conclusión previa.'},
{tag:'M2',q:'Quieres bajar el límite de detección de un método instrumental y el presupuesto solo alcanza para mejorar una cosa del montaje. ¿Cuál de estas eliges?',opts:['El ruido del blanco','El número de réplicas','La resolución del display','El tope de la calibración'],correct:0,exp:'LOD ≈ 3σ del blanco entre la pendiente, así que solo hay dos palancas: bajar el ruido de fondo o subir la sensibilidad. Más réplicas mejoran la precisión de una medida pero no desplazan el umbral de detección, y ni el display ni el extremo superior de la curva entran en la expresión.'},
{tag:'M2',q:'Dos manchas en una placa de cromatografía en capa fina presentan Rf de 0.72 y 0.75 y quedan prácticamente superpuestas. ¿Qué variable ajustas para separarlas?',opts:['La temperatura de la cámara','La polaridad del eluyente','La cantidad sembrada','La longitud de la placa'],correct:1,exp:'Con Rf cercanos a 1 los analitos pasan casi todo el tiempo en la fase móvil y apenas interactúan con la estacionaria, que es donde ocurre la discriminación. Bajando la polaridad del eluyente se los lleva a la zona de 0.3 a 0.7, donde el reparto entre fases sí los separa.'},
{tag:'M2',q:'Valoras calcio con EDTA en una disolución tamponada a pH 5 y el punto final aparece difuso, sin el salto neto que esperabas. ¿Qué está ocurriendo químicamente?',opts:['El EDTA se oxida','Deja de ser 1 a 1','Cae la constante condicional','El indicador no se disuelve'],correct:2,exp:'El EDTA es tetraprótico y solo la especie completamente desprotonada acompleja. Al bajar el pH esa fracción se desploma, la constante condicional de formación cae y el salto se difumina. La estequiometría 1:1 no cambia con el pH, y el EDTA no se oxida en esas condiciones.'},
{tag:'M2',q:'Reportas en tu informe una concentración escrita exactamente como 0.0500 M, tal como la entrega la hoja de cálculo. ¿Cuántas cifras significativas estás comunicando?',opts:['Cuatro','Dos','Una','Tres'],correct:3,exp:'Los ceros a la izquierda del primer dígito significativo solo sitúan el punto decimal y no cuentan. Los ceros a la derecha, cuando hay punto decimal, sí son significativos porque comunican la precisión de la medida. Quedan el 5 y los dos ceros finales: tres cifras.'},

/* ---------------- M3 · ampliación ---------------- */
{tag:'M3',q:'Comparas la acidez del hidrógeno terminal de etano, eteno y etino midiendo sus pKa en el mismo disolvente. ¿Cuál es el orden creciente de acidez entre los tres?',opts:['Etano < eteno < etino','Etino < eteno < etano','Eteno < etano < etino','Los tres son iguales'],correct:0,exp:'La acidez refleja la estabilidad de la base conjugada. El carbanión del alquino aloja el par en un orbital sp con 50 % de carácter s, más cercano al núcleo y por tanto más estable que el sp² del alqueno o el sp³ del alcano. Más carácter s significa mayor acidez.'},
{tag:'M3',q:'Disuelves un halogenuro de alquilo terciario en agua a temperatura ambiente, sin añadir base ni calentar la mezcla. ¿Qué mecanismo de sustitución esperas que domine?',opts:['No reacciona','SN1','SN2','E2'],correct:1,exp:'El sustrato terciario bloquea estéricamente el ataque por la cara opuesta que exige SN2, y a cambio forma un carbocatión estable. El agua es nucleófilo débil y disolvente prótico polar, que es justo lo que estabiliza al carbocatión. Es el conjunto de condiciones canónico de SN1, con racemización del producto.'},
{tag:'M3',q:'Partes de 2-butanol ópticamente puro y lo sometes a condiciones típicas de SN1, con un nucleófilo débil en disolvente prótico. ¿Qué obtienes como producto?',opts:['Solo el enantiómero opuesto','Un diastereómero nuevo','Mezcla casi racémica','El mismo, sin cambio'],correct:2,exp:'El carbocatión intermedio es plano y puede ser atacado por cualquiera de sus dos caras con probabilidad similar, de modo que se forman ambos enantiómeros. En la práctica suele quedar un ligero exceso del invertido porque el grupo saliente estorba una cara mientras se aleja. La inversión completa es la firma de SN2.'},
{tag:'M3',q:'El nailon 6,6 se fabrica haciendo reaccionar hexametilendiamina con ácido adípico en una policondensación a alta temperatura. ¿Qué subproducto se libera en cada enlace?',opts:['Metanol','Dióxido de carbono','Ninguno','Agua'],correct:3,exp:'La amida se forma por condensación entre el ácido carboxílico y la amina, liberando una molécula de agua por cada enlace. Esa es precisamente la diferencia con la polimerización por adición, donde la unidad repetitiva pesa lo mismo que el monómero porque no se pierde nada.'},
{tag:'M3',q:'Una enzima pierde por completo su actividad al calentarla a 70 °C, pero la espectrometría de masas confirma que su secuencia sigue íntegra. ¿Qué le ocurrió?',opts:['Se desnaturalizó','Se hidrolizaron los péptidos','Pasó a configuración D','Se oxidaron los aromáticos'],correct:0,exp:'La secuencia intacta significa que los enlaces peptídicos no se rompieron: lo que se perdió es la estructura tridimensional sostenida por puentes de hidrógeno, interacciones hidrofóbicas y puentes disulfuro. Como la función depende de la forma del sitio activo, la actividad desaparece aunque la cadena siga completa.'},
{tag:'M3',q:'El butanol se disuelve en agua en proporciones apreciables y el butano es prácticamente insoluble, pese a tener masas molares muy parecidas. ¿Qué explica la diferencia?',opts:['La diferencia de densidad entre ambos','El hidroxilo da puentes de hidrógeno','La mayor masa molecular del butanol','La geometría tetraédrica del carbono'],correct:1,exp:'La solubilidad depende de si el soluto puede sustituir las interacciones agua-agua por interacciones comparables. El grupo OH dona y acepta puentes de hidrógeno; la cadena de butano solo ofrece London y obliga al agua a reorganizarse a su alrededor con costo entrópico. La masa es casi la misma.'},
{tag:'M3',q:'Hidratas un alqueno asimétrico en medio ácido acuoso, sin peróxidos y sin reactivos de boro de por medio. ¿En qué carbono del antiguo doble enlace queda el hidroxilo?',opts:['Al azar entre los dos','En el carbono terminal','En el más sustituido','En el menos sustituido'],correct:2,exp:'El protón se adiciona primero generando el carbocatión más estable, que es el más sustituido, y el agua ataca ahí. Eso es la regla de Markovnikov vista por su mecanismo, no como receta. Para obtener el producto contrario hay que cambiar de ruta, por ejemplo hidroboración-oxidación.'},
{tag:'M3',q:'En una cinética de Michaelis-Menten trabajas con una concentración de sustrato mucho mayor que la Km de la enzima. ¿Qué orden de reacción observas respecto al sustrato?',opts:['Primer orden','Segundo orden','Orden fraccionario','Orden cero'],correct:3,exp:'Con [S] muy por encima de Km el denominador se aproxima a [S] y la ecuación se reduce a v ≈ Vmax: toda la enzima está ocupada y añadir más sustrato no cambia nada. A [S] muy por debajo de Km el comportamiento sí es de primer orden. La curva recorre ambos regímenes.'},
{tag:'M3',q:'Diseñas una PCR para amplificar una región concreta dentro de un genoma complejo. ¿Qué componente de la mezcla define la especificidad del producto que obtienes?',opts:['Los cebadores','La temperatura de extensión','El número de ciclos','La concentración de magnesio'],correct:0,exp:'Los cebadores delimitan por complementariedad la región que se copia, así que son ellos los que deciden qué se amplifica. El magnesio y la temperatura de hibridación afectan la eficiencia y el rigor, y pueden generar productos inespecíficos si están mal ajustados, pero no definen el blanco.'},
{tag:'M3',q:'Dos lotes del mismo polímero tienen idéntica masa molecular promedio en número, pero índices de polidispersidad de 1.1 y de 2.8. ¿Qué es lo que difiere entre ellos?',opts:['La temperatura de degradación','La anchura de la distribución','La masa de la unidad repetitiva','El grado de cristalinidad'],correct:1,exp:'La polidispersidad es la razón entre la masa promedio en peso y la promedio en número, y mide cuán dispersas están las longitudes de cadena. Dos materiales pueden compartir promedio y diferir mucho en homogeneidad, lo que cambia propiedades mecánicas y de procesado.'},
{tag:'M3',q:'Calientas un éster con hidróxido de sodio acuoso hasta hidrolizarlo por completo y aíslas los dos productos. ¿Qué nombre recibe esa reacción y qué obtienes de ella?',opts:['Transesterificación','Descarboxilación','Saponificación','Esterificación inversa'],correct:2,exp:'En medio básico el ataque del hidróxido conduce al carboxilato, que al estar desprotonado ya no puede volver atrás: la reacción es irreversible, al contrario que la hidrólisis ácida. De ahí que se use para fabricar jabones a partir de triglicéridos.'},
{tag:'M3',q:'Calientas dos fragmentos de DNA de doble hebra de la misma longitud y registras la temperatura a la que se separan. ¿Qué secuencia resiste más temperatura antes de fundirse?',opts:['La rica en adenina y timina','Las dos por igual','La más corta de las dos','La rica en guanina y citosina'],correct:3,exp:'El par G-C forma tres puentes de hidrógeno y el A-T solo dos, así que una secuencia rica en GC exige más energía para separarse y su temperatura de fusión es mayor. Es la base de calcular la Tm de un cebador a partir de su composición.'},
{tag:'M3',q:'Debes fabricar a escala un fármaco con un solo centro estereogénico, del que únicamente un enantiómero resulta activo. ¿Qué estrategia da la mejor economía atómica?',opts:['Síntesis asimétrica','Racémico y cristalización','Cromatografía quiral','Sintetizar ambos y filtrar'],correct:0,exp:'Resolver un racémico descarta por definición al menos la mitad del material, mientras que la catálisis asimétrica construye preferentemente el enantiómero deseado desde el principio. Las otras rutas son viables y se usan, pero parten de haber fabricado ya el isómero que se va a tirar.'},
{tag:'M3',q:'Un compuesto puro presenta en el infrarrojo una banda muy ancha centrada en 3300 cm⁻¹ y otra intensa y estrecha a 1710 cm⁻¹. ¿Qué grupo funcional contiene la molécula?',opts:['Alqueno terminal','Ácido carboxílico','Amida primaria','Alcohol y cetona mezclados'],correct:1,exp:'La banda muy ancha cerca de 3300 cm⁻¹ corresponde al OH asociado por puentes de hidrógeno, y la intensa a 1710 cm⁻¹ al carbonilo. La combinación de ambas en una misma molécula es la firma del ácido carboxílico. Una amida mostraría el carbonilo desplazado a número de onda menor.'}
);
</script>
<script>
/* Reactivos en el estilo medido de los quizzes reales del taller:
   enunciado con escenario (~140 caracteres) y opciones breves (~32). */
QUIZ.push(
/* ---------------- M4 · ampliación ---------------- */
{tag:'M4',q:'Un técnico mide la resistencia de una barra metálica a 20 °C y a 80 °C, y encuentra que el valor sube con la temperatura. ¿Qué lo explica?',opts:['Cierre parcial de la banda prohibida','Pérdida de electrones de valencia','Mayor dispersión por fonones','Aumento del número de portadores'],correct:2,exp:'En un metal el número de portadores ya está fijo. Al calentar, la red vibra más y dispersa los electrones con mayor frecuencia, así que la resistividad sube. En un semiconductor ocurre lo contrario porque los portadores crecen exponencialmente.'},
{tag:'M4',q:'Se comparan diamante y grafito, ambos formados solo por carbono. El primero es aislante y durísimo; el segundo conduce y se exfolia. ¿De qué depende la diferencia?',opts:['De la pureza del carbono','De la masa atómica efectiva','Del tamaño de los cristales','Del arreglo y la hibridación'],correct:3,exp:'El diamante es sp³ con red covalente tridimensional y todos los electrones localizados. El grafito es sp² en capas, con electrones deslocalizados en el sistema pi que conducen dentro del plano, y fuerzas débiles entre capas que permiten exfoliar.'},
{tag:'M4',q:'En una celda FCC de parámetro 0.361 nm se quiere conocer el espaciado de la familia de planos (111) para interpretar un difractograma. ¿Cuál es?',opts:['0.208 nm','0.361 nm','0.625 nm','0.180 nm'],correct:0,exp:'d = a/√(h²+k²+l²) = 0.361/√3 = 0.361/1.732 = 0.208 nm. El 0.361 sale de olvidar el denominador y el 0.180 de dividir entre 2 en vez de entre √3.'},
{tag:'M4',q:'Un estudiante afirma que el orbital 1p no se llena porque no hay suficientes electrones en el primer nivel. ¿Es correcta su explicación?',opts:['Solo si se aplica la regla de Hund','No: ese orbital no existe','Sí, es exactamente la razón','Solo en átomos polielectrónicos'],correct:1,exp:'El número azimutal l va de 0 a n−1, así que con n = 1 solo cabe l = 0, que es un orbital s. No es cuestión de cuántos electrones haya: el orbital 1p no existe como solución de la ecuación de Schrödinger.'},
{tag:'M4',q:'Se dopa silicio con boro, que tiene tres electrones de valencia frente a los cuatro del silicio. ¿Qué tipo de portador mayoritario resulta?',opts:['Iones intersticiales','Queda intrínseco','Huecos positivos','Electrones libres'],correct:2,exp:'Al faltar un electrón para completar el cuarto enlace queda un hueco, y el nivel aceptor se sitúa cerca de la banda de valencia. Los electrones vecinos saltan a llenarlo dejando huecos móviles: semiconductor tipo p.'},
{tag:'M4',q:'Dos metales cristalizan uno en FCC y otro en BCC. Se compara qué fracción del volumen de la celda ocupan realmente los átomos. ¿Cuál es mayor?',opts:['BCC, con 0.74','FCC, con 0.68','Ambos tienen 0.68','FCC, con 0.74'],correct:3,exp:'FCC y HCP son empaquetamientos compactos con eficiencia 0.74 y coordinación 12. BCC alcanza 0.68 con coordinación 8. La cúbica simple se queda en 0.52 con coordinación 6.'},
{tag:'M4',q:'Un material transparente e incoloro se ilumina con luz visible y no absorbe nada. ¿Qué se puede afirmar de su banda prohibida?',opts:['Es mayor que 3.1 eV','Está entre 1.6 y 3.1 eV','Es menor que 1.6 eV','Es exactamente cero'],correct:0,exp:'El visible va de 1.6 eV (rojo, 780 nm) a 3.1 eV (violeta, 400 nm). Si el material no absorbe ningún fotón visible, su gap debe superar el extremo más energético. Un gap nulo correspondería a un metal, que sería opaco y reflectante.'},
{tag:'M4',q:'Al comparar la densidad calculada de una aleación con la medida en laboratorio, la medida resulta mayor. ¿Qué defecto lo explica mejor?',opts:['Fronteras de grano','Átomos intersticiales','Vacancias en la red','Dislocaciones de borde'],correct:1,exp:'Los intersticiales añaden masa sin cambiar el volumen de la celda, así que la densidad medida sube. Las vacancias harían lo contrario. Dislocaciones y fronteras de grano son defectos lineales y planares, con efecto despreciable sobre la densidad.'},
{tag:'M4',q:'Se endurece un metal mediante trabajo en frío. Al examinarlo después se observa que cuesta más deformarlo plásticamente. ¿Por qué ocurre?',opts:['Desaparecen los planos de deslizamiento','El enlace metálico se vuelve covalente','Las dislocaciones se obstaculizan','Aumenta el parámetro de red'],correct:2,exp:'La deformación plástica ocurre por movimiento de dislocaciones. El trabajo en frío multiplica su densidad hasta que se estorban entre ellas, así que hace falta más esfuerzo para seguir deformando. Todo endurecimiento consiste en obstaculizarlas.'},
{tag:'M4',q:'Un electrón del hidrógeno cae del nivel n = 3 al n = 2 y emite un fotón. Si cayera del n = 4 al n = 2, ¿cómo sería ese segundo fotón?',opts:['De mayor longitud de onda','De la misma energía','De menor frecuencia','De menor longitud de onda'],correct:3,exp:'La separación entre niveles crece conforme se sube, así que el salto 4→2 libera más energía que el 3→2. Mayor energía implica mayor frecuencia y por tanto menor longitud de onda, ya que E = hc/λ.'},
{tag:'M4',q:'Dos compuestos iónicos tienen iones de la misma carga, pero uno los tiene más pequeños. ¿Cuál tendrá mayor punto de fusión?',opts:['El de iones más pequeños','El de iones más grandes','Ambos el mismo','Depende del color del sólido'],correct:0,exp:'La energía reticular crece con el producto de las cargas y disminuye con la distancia entre centros iónicos. A igual carga, iones más pequeños se acercan más, la atracción electrostática es mayor y hace falta más energía para romper la red.'},
{tag:'M4',q:'Se observa un sólido que funde a 1410 °C, no conduce en estado sólido y es muy frágil al golpearlo. ¿Qué clasificación es la más probable?',opts:['Iónico con iones grandes','Covalente en red','Metálico','Molecular'],correct:1,exp:'Punto de fusión altísimo con aislamiento eléctrico y fragilidad apunta a una red covalente tridimensional, como el silicio o el cuarzo. Un metal conduciría, un molecular fundiría muy por debajo y un iónico conduciría al fundirse.'},
{tag:'M4',q:'Un estudiante indexa un difractograma cúbico y obtiene la secuencia 2, 4, 6, 8 para h²+k²+l². ¿Qué red está midiendo?',opts:['Cúbica simple','Hexagonal compacta','BCC','FCC'],correct:2,exp:'En BCC solo difractan los planos con h+k+l par, lo que da la secuencia 2, 4, 6, 8. En FCC los índices deben ser todos pares o todos impares y la secuencia es 3, 4, 8, 11. La cúbica simple no tiene extinciones.'},
{tag:'M4',q:'Se compara la conductividad de un semiconductor intrínseco con la del mismo material dopado a una parte por millón. ¿Qué orden de cambio se espera?',opts:['Un aumento del 1 %','Ningún cambio apreciable','Una disminución moderada','Varios órdenes de magnitud'],correct:3,exp:'Una parte por millón de dopante aporta muchísimos más portadores que los pocos que cruzan el gap térmicamente en el material puro. Por eso el silicio electrónico exige purezas extremas antes de doparlo: cualquier impureza actuaría como dopante incontrolado.'},

/* ---------------- M5 · ampliación ---------------- */
{tag:'M5',q:'Se disuelve sal en agua y la mezcla se enfría al hacerlo. Un estudiante concluye que el proceso no puede ser espontáneo. ¿Tiene razón?',opts:['No: el aumento de entropía puede compensar','Sí, un proceso endotérmico nunca ocurre solo','Sí, salvo que se agite la disolución','No, porque en realidad libera calor'],correct:0,exp:'La espontaneidad la decide ΔG = ΔH − TΔS, no el signo de ΔH por sí solo. Al disolverse, el soluto y el disolvente ganan desorden, y si TΔS supera a ΔH el proceso ocurre aunque enfríe el recipiente.'},
{tag:'M5',q:'Una reacción en equilibrio se comprime reduciendo el volumen a la mitad. Reactivos y productos tienen el mismo número de moles gaseosos. ¿Qué ocurre?',opts:['K disminuye','No se desplaza','Se desplaza a productos','Se desplaza a reactivos'],correct:1,exp:'La presión solo desplaza el equilibrio cuando hay diferencia en el número de moles de gas entre los dos lados, porque solo entonces un sentido alivia más la perturbación. Con los mismos moles a ambos lados, comprimir sube todas las presiones parciales por igual y Q no cambia.'},
{tag:'M5',q:'Se mide la constante de velocidad de una reacción y se obtiene en unidades de s⁻¹. ¿Qué orden global tiene esa reacción?',opts:['Segundo','No puede deducirse','Primero','Cero'],correct:2,exp:'Las unidades de k delatan el orden: para orden n las unidades son M^(1−n)·s⁻¹. Con s⁻¹ puro, n = 1. Orden cero daría M·s⁻¹ y segundo orden M⁻¹·s⁻¹. Es una comprobación rápida y muy usada.'},
{tag:'M5',q:'Dos líquidos tienen la misma masa molecular, pero uno hierve a 78 °C y el otro a −24 °C. ¿Qué diferencia estructural lo explica?',opts:['Uno tiene enlaces más fuertes','Uno es más denso','Uno tiene mayor capacidad calorífica','Uno forma puentes de hidrógeno'],correct:3,exp:'Es el caso del etanol frente al dimetil éter, ambos C₂H₆O. El etanol tiene el hidrógeno unido al oxígeno y forma puentes entre moléculas; en el éter los hidrógenos cuelgan de carbonos y no cumplen el requisito. Al hervir se vencen fuerzas intermoleculares, no enlaces.'},
