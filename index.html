 exp:'En un metal el número de portadores ya es fijo y calentar aumenta la dispersión por fonones, así que la resistividad sube. En un semiconductor el número de portadores crece exponencialmente al cruzar el gap, y ese efecto domina: la resistividad baja. El signo de dT es la prueba diagnóstica.'},
{tag:'M4',q:'Un semiconductor absorbe por debajo de 517 nm. ¿De qué color se ve y cuál es su gap?',
 opts:['Azul, con gap de 3.2 eV, al reflejar las longitudes de onda cortas','Negro, con gap de 1.1 eV, al absorber el espectro visible completo','Verde, con un gap cercano a 2.4 eV, porque transmite su propia banda','Amarillo-naranja, 2.4 eV'],correct:3,
 exp:'Eg = 1240/517 = 2.4 eV. Absorbe todo lo de longitud de onda menor que 517 nm, es decir violeta, azul y verde, y refleja el resto. El color percibido es el complementario de lo absorbido, y ese es el paso que más se falla.'},
{tag:'M4',q:'Calculas la densidad teórica del aluminio FCC (a = 0.405 nm, M = 26.98) y obtienes 2.7×10⁶ g/cm³. ¿Dónde está el error?',
 opts:['Usaste el número de Avogadro con el exponente equivocado de signo','Tomaste la coordinación 12 como número de átomos de la celda','Contaste 14 átomos por celda en lugar de los 4 que realmente aporta','No elevaste al cubo el factor de conversión de nanómetros a centímetros'],correct:3,
 exp:'El valor correcto es 2.70 g/cm³, así que el resultado está desviado por 10⁶, exactamente (10²)³. Es la firma de haber convertido nm a cm sin elevar el factor al cubo: 1 nm = 10⁻⁷ cm, y al cubo 10⁻²¹.'},
{tag:'M4',q:'La densidad medida de un cristal resulta 1.5 % menor que la teórica. ¿Qué lo explica?',
 opts:['Átomos intersticiales que se acomodaron en los huecos de la red','Un parámetro de red menor que el supuesto en el cálculo teórico','Vacancias','Un número de coordinación distinto al de la estructura asumida'],correct:2,
 exp:'Las vacancias son posiciones de red sin átomo: el volumen de celda es el mismo y la masa menor, así que la densidad medida baja. Los intersticiales harían lo contrario. El número de coordinación no entra en el cálculo de densidad, que solo usa átomos por celda, masa molar y parámetro de red.'},
{tag:'M4',q:'Dopas silicio con fósforo a razón de una parte por millón. ¿Qué cambia?',
 opts:['El material pasa a ser metálico al desaparecer la brecha prohibida','El gap se ensancha por el aumento del número total de electrones','El gap se estrecha porque el fósforo aporta estados más conductores','Aparece un nivel donador dentro del gap'],correct:3,
 exp:'El ancho del gap es una propiedad del silicio y su estructura, y una parte por millón no lo altera. Lo que hace el dopante es colocar un nivel a unos 0.045 eV bajo la banda de conducción, del que el electrón escapa con la energía térmica disponible (kT = 0.026 eV). Sigue siendo semiconductor, ahora tipo n.'},
{tag:'M4',q:'Un plano corta los ejes en 1/2, 1 e infinito. ¿Cuál es su índice de Miller?',
 opts:['(1½0), conservando la fracción tal como aparece en la intersección','(012), tomando los valores en el orden inverso de los ejes dados','(120), sin tomar recíprocos sino los cortes directos normalizados','(210)'],correct:3,
 exp:'Los recíprocos de 1/2, 1 e ∞ son 2, 1 y 0, que ya son los enteros más pequeños. Los índices de Miller nunca llevan fracciones, precisamente porque el recíproco las elimina, y el orden de los ejes importa.'},
{tag:'M4',q:'Comparas dos puntos cuánticos del mismo material, de 3 nm y 6 nm. ¿Qué esperas?',
 opts:['El de 3 nm emite más al azul','El de 6 nm emite más al azul porque contiene más átomos emisores','Ambos emiten igual, ya que el material determina por completo el gap','El de 3 nm no emite, por quedar por debajo del radio de Bohr útil'],correct:0,
 exp:'En la partícula en una caja E ∝ 1/L², así que el más pequeño tiene mayor energía de confinamiento y por tanto gap efectivo mayor y emisión desplazada al azul. Reducir la dimensión a la mitad cuadruplica el término de confinamiento. Los distractores suelen invertir esta dirección.'},
{tag:'M4',q:'Dos compuestos tienen enlaces muy polares. Uno tiene momento dipolar nulo y el otro no. ¿Qué los distingue?',
 opts:['El número total de pares libres presentes en el átomo central','La fuerza relativa de los enlaces individuales de cada molécula','La diferencia de electronegatividad entre los átomos que los componen','La simetría de la geometría molecular'],correct:3,
 exp:'El momento dipolar molecular es la suma vectorial de los momentos de enlace. En una geometría simétrica como la tetraédrica con cuatro ligandos iguales (CCl₄) los vectores se cancelan exactamente; romper la simetría (CHCl₃) deja resultante. La polaridad del enlace es idéntica en ambos casos.'},

/* ---------------- M5 ---------------- */
{tag:'M5',q:'Una reacción exotérmica en equilibrio se calienta. ¿Qué ocurre con K y con la posición?',
 opts:['K sube y el equilibrio se corre hacia los productos de la reacción','K baja y se desplaza hacia reactivos','K no cambia y solo se desplaza la posición hacia los reactivos','K baja pero la posición permanece donde estaba antes del cambio'],correct:1,
 exp:'La temperatura es la única perturbación que modifica el valor de K, vía ΔG° = −RT ln K. En una exotérmica el calor se comporta como producto, así que añadirlo desplaza hacia reactivos y K disminuye. Concentración, volumen y catalizador mueven la posición sin tocar K.'},
{tag:'M5',q:'Al duplicar [A] la velocidad se multiplica por ocho. ¿Qué orden tiene la reacción respecto de A?',
 opts:['Segundo orden, porque la velocidad crece más rápido que la concentración','Primer orden con un factor estequiométrico de cuatro involucrado','Tercer orden','Orden cero, ya que la velocidad no sigue la concentración linealmente'],correct:2,
 exp:'De v₂/v₁ = ([A]₂/[A]₁)ⁿ sale 8 = 2ⁿ, es decir n = 3. Segundo orden daría factor 4 y primer orden factor 2. El orden es empírico y no se lee de los coeficientes de la ecuación balanceada salvo que sea elemental.'},
{tag:'M5',q:'ΔG° de una reacción es −20 kJ/mol, pero al mezclar los reactivos el sistema evoluciona hacia atrás. ¿Es posible?',
 opts:['No, un ΔG° negativo garantiza avance hacia productos en cualquier caso','Sí, si Q es muy grande','Solo si la temperatura está por debajo de la de cruce termodinámica','No, salvo que la reacción tenga una barrera cinética insuperable'],correct:1,
 exp:'ΔG° describe condiciones estándar; el sentido real lo decide ΔG = ΔG° + RT ln Q con las concentraciones del momento. Si arrancas con mucho producto y poco reactivo, Q es enorme y el término RT ln Q puede volver ΔG positivo. Es la confusión número uno del tema.'},
{tag:'M5',q:'A un equilibrio gaseoso en recipiente rígido le inyectas argón. ¿Qué pasa?',
 opts:['Se corre hacia el lado con menos moles de gas al subir la presión total','Nada','Se corre hacia el lado con más moles de gas por efecto de dilución','K aumenta porque la presión total del sistema se ha incrementado'],correct:1,
 exp:'A volumen constante, un gas inerte eleva la presión total pero no altera el número de moles ni el volumen de las especies reactivas, así que sus presiones parciales quedan iguales y Q sigue valiendo K. Es el distractor clásico del tema.'},
{tag:'M5',q:'Dos reacciones tienen idéntico ΔG° pero una tarda segundos y la otra siglos. ¿Qué difiere?',
 opts:['La espontaneidad, que solo una de las dos puede tener realmente','La energía de activación','La constante de equilibrio, que debe ser distinta en cada una','El signo de la entropía de reacción en cada uno de los dos casos'],correct:1,
 exp:'ΔG° fija K y por tanto la composición final del equilibrio, no la rapidez. La velocidad la gobierna la barrera de activación, que es una propiedad del camino y no de los estados inicial y final. El diamante hacia grafito es el ejemplo canónico: ΔG negativo y velocidad indetectable.'},
{tag:'M5',q:'Una disolución de glucosa y otra de CaCl₂, ambas 0.10 m, se congelan. ¿Cuál baja más el punto de fusión?',
 opts:['La glucosa, porque su molécula es mayor y perturba más la red del hielo','Igual, ya que las dos tienen la misma concentración molal de soluto','El CaCl₂, por su factor i ≈ 3','El CaCl₂, pero solo si se corrige por su mayor masa molar relativa'],correct:2,
 exp:'Las coligativas dependen del número de partículas en disolución, no de su identidad ni tamaño. La glucosa no se disocia (i = 1) y el CaCl₂ da tres iones (i ≈ 3), así que su descenso crioscópico es unas tres veces mayor. Omitir el factor i da justo el valor de uno de los distractores.'},
{tag:'M5',q:'Añades un catalizador a una reacción en equilibrio. ¿Qué cambia en la composición final?',
 opts:['Aumenta la proporción de productos al acelerarse el camino directo','Nada','Disminuye la de productos porque también se acelera la reacción inversa','Depende de si el catalizador es homogéneo o heterogéneo en el medio'],correct:1,
 exp:'El catalizador no altera la energía de reactivos ni de productos, así que ΔG° y por tanto K quedan intactos. Baja la barrera por igual en los dos sentidos, multiplicando k directa e inversa por el mismo factor: llega antes al mismo punto. Su utilidad es permitir trabajar a temperatura más baja, donde K puede ser más favorable.'},
{tag:'M5',q:'Una suspensión estable de nanopartículas se agrega al diluirla en medio fisiológico. ¿Por qué?',
 opts:['La dilución reduce la concentración de estabilizante por debajo del umbral','La sal comprime la doble capa','El pH del medio neutraliza químicamente los grupos de la superficie','La temperatura corporal acelera el movimiento browniano de las partículas'],correct:1,
 exp:'El medio fisiológico tiene unos 150 mM de electrolito. Al subir la fuerza iónica, los contraiones apantallan la carga superficial a distancias más cortas, la barrera de DLVO baja y los choques brownianos empiezan a superarla. Por eso en aplicaciones biológicas se prefiere estabilización estérica con PEG, que no depende del apantallamiento.'},

/* ---------------- M6 ---------------- */
{tag:'M6',q:'Comparas dos lotes de nanopartículas: uno de 4 nm y otro de 40 nm del mismo material. ¿Cuánto más superficial es el pequeño?',
 opts:['Cien veces, porque la fracción escala con el área de la partícula','Mil veces, al escalar con el volumen de la partícula considerada','Lo mismo, dado que la fracción superficial no depende del tamaño','Diez veces'],correct:3,
 exp:'La fracción de átomos superficiales es aproximadamente 3δ/R, es decir va como el inverso del radio. Al dividir el radio entre diez, la fracción se multiplica por diez. Confundirlo con área o volumen es el error típico: esos escalan con otras potencias.'},
{tag:'M6',q:'Tu síntesis de oro coloidal sale violácea en lugar de roja, con DLS de 85 nm y TEM de 22 nm. ¿Qué pasó?',
 opts:['Las partículas crecieron por encima del tamaño objetivo de la síntesis','Agregación','La reducción fue incompleta y queda precursor sin reaccionar en el medio','El estabilizante se adsorbió en exceso formando una capa muy gruesa'],correct:1,
 exp:'Si el TEM muestra núcleos de 22 nm, las partículas individuales no crecieron: el DLS de 85 nm con el color desplazado al rojo delata racimos en suspensión. El acoplamiento de plasmones entre partículas vecinas corre la banda al rojo y el color percibido vira a violeta o azul.'},
{tag:'M6',q:'Quieres partículas monodispersas. ¿Qué estrategia lo logra?',
 opts:['Prolongar el tiempo de reacción para que todas alcancen el mismo tamaño','Agitar con más vigor para homogeneizar la distribución de tamaños','Inyección caliente','Añadir el precursor muy lentamente para controlar bien el crecimiento'],correct:2,
 exp:'Según LaMer, la monodispersidad exige separar en el tiempo una nucleación explosiva del crecimiento posterior. La inyección rápida cruza el umbral de golpe, consume el monómero y hace caer la concentración por debajo del umbral, deteniendo la nucleación. Añadir lento solaparía nucleación y crecimiento y daría distribución ancha.'},
{tag:'M6',q:'Sintetizas TiO₂ por sol-gel y calcinas a 700 °C para cristalizarlo. La actividad fotocatalítica baja. ¿Por qué?',
 opts:['El material perdió toda su cristalinidad al superar esa temperatura','Transición a rutilo y pérdida de área','El gap se estrechó hasta salir del intervalo de absorción ultravioleta','La calcinación introdujo impurezas de carbono procedentes del precursor'],correct:1,
 exp:'Por encima de unos 600 °C la anatasa transita a rutilo, que es menos activo, y simultáneamente crece el tamaño de grano y cae el área superficial. Dos efectos que reducen la actividad a la vez. La calcinación cristaliza el amorfo del sol-gel, pero ese es su costo.'},
{tag:'M6',q:'Dos recubrimientos sobre una estructura con poros profundos: uno por sputtering y otro por ALD. ¿Qué diferencia esperas?',
 opts:['El de sputtering será más uniforme por depositarse a mayor velocidad','El ALD será conformal','Ambos cubrirán igual, ya que el espesor se controla en los dos casos','El ALD tapará la entrada del poro por su crecimiento autolimitado'],correct:1,
 exp:'El sputtering es un proceso de línea de vista: deposita donde llega el flujo y tiende a cerrar la boca del poro sin recubrir el fondo. El ALD pulsa precursores que saturan toda la superficie accesible y crece una capa por ciclo, de modo que recubre el interior con espesor uniforme. Es lento y a cambio insuperable en conformidad.'},
{tag:'M6',q:'Necesitas una zanja profunda de paredes verticales en silicio. ¿Qué grabado usas?',
 opts:['Húmedo con ácido, que ataca por igual en todas las direcciones del cristal','Húmedo con KOH sobre {100}, que aprovecha la anisotropía cristalográfica','Seco por plasma','Cualquiera, porque la geometría la fija la máscara y no el grabado'],correct:2,
 exp:'Solo el grabado direccional con iones acelerados perpendicularmente da paredes verticales y por tanto alta relación de aspecto. El húmedo isotrópico socava bajo la máscara, y el KOH sobre silicio {100} produce paredes inclinadas a 54.7°, que es el ángulo entre los planos {100} y {111}.'},
{tag:'M6',q:'Un agente director de forma se adsorbe sobre una familia de caras cristalinas. ¿Qué morfología resulta?',
 opts:['Esas caras desaparecen al frenarse su crecimiento respecto a las demás','Esas caras dominan','La partícula se vuelve esférica al quedar todas las caras pasivadas','La forma no cambia: el agente solo limita el tamaño final alcanzado'],correct:1,
 exp:'La regla es contraintuitiva: una cara que crece rápido se cierra y desaparece de la forma final, mientras que las lentas sobreviven. Al pasivar una familia la vuelve lenta y por tanto persistente. Así el CTAB produce nanovarillas de oro y la PVP nanocubos de plata.'},
{tag:'M6',q:'Dos suspensiones envejecen un mes. En una el número de partículas cae y el tamaño medio sube; en la otra aparecen racimos sin que cambien los contornos. ¿Qué ocurrió?',
 opts:['Agregación en la primera y maduración de Ostwald en la segunda','Ostwald en las dos, con distinta velocidad según la fuerza iónica','Agregación en ambas, distinguibles solo por dispersión dinámica de luz','Ostwald en la primera, agregación en la segunda'],correct:3,
 exp:'La maduración de Ostwald disuelve las pequeñas y redeposita sobre las grandes, así que el número total baja y los contornos siguen siendo lisos. La agregación pega partículas que conservan su identidad dentro del racimo. Se combaten distinto: Ostwald con menos solubilidad o temperatura, la agregación estabilizando.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M7 ---------------- */
{tag:'M7',q:'Un pico de difracción aparece a 2θ = 38.2° con radiación de cobre (λ = 0.15406 nm). ¿Cuál es el espaciado?',
 opts:['0.2354 nm','0.1242 nm, tomando el ángulo tal como lo reporta el difractómetro','0.4708 nm, duplicando el espaciado por el orden de difracción n = 2','0.1177 nm, usando directamente 2θ en el seno de la ley de Bragg'],correct:0,
 exp:'d = λ/(2 sen θ) con θ = 19.1°, la mitad del 2θ reportado: 0.15406/(2×0.3272) = 0.2354 nm. Usar 38.2° directamente en el seno da 0.1242 nm, y es el error más frecuente del módulo.'},
{tag:'M7',q:'Scherrer da 12 nm y el TEM muestra partículas de 60 nm en la misma muestra. ¿Qué concluyes?',
 opts:['El TEM midió agregados en lugar de partículas individuales reales','Las partículas son policristalinas','Hay un error de conversión de unidades en el cálculo de Scherrer','La ecuación de Scherrer no es aplicable a este tipo de material'],correct:1,
 exp:'Cristalito y partícula no son sinónimos: la difracción solo ve el dominio coherente, así que una partícula de 60 nm puede estar hecha de varios dominios de 12 nm. Es una de las confusiones más preguntadas. La microdeformación también ensancha, pero no explicaría una diferencia de este tamaño.'},
{tag:'M7',q:'Las posiciones de los picos coinciden con la referencia pero las intensidades relativas no. ¿Qué indica?',
 opts:['Que la fase identificada es en realidad distinta de la de referencia','Que el tamaño de cristalito es demasiado pequeño para difractar bien','Orientación preferencial','Que la muestra contiene una fracción amorfa considerable sin detectar'],correct:2,
 exp:'Las posiciones dependen de los espaciados interplanares, así que coincidir confirma fase y parámetro de red. Las intensidades dependen de cuántos cristalitos están orientados para difractar en cada familia de planos: si no están al azar, unas se sobrerrepresentan. Es típico en películas delgadas y materiales laminares.'},
{tag:'M7',q:'Necesitas saber si el hierro de una superficie está como Fe²⁺ o Fe³⁺. ¿Qué técnica usas?',
 opts:['EDS en el microscopio electrónico de barrido con mapeo elemental','DRX, comparando los parámetros de red de los dos óxidos posibles','BET con nitrógeno, para evaluar el área y la química superficial','XPS'],correct:3,
 exp:'XPS mide energías de enlace de electrones internos, que se desplazan según el entorno químico, con profundidad de unos pocos nanómetros. El EDS da elementos pero no estado de oxidación, porque sus rayos X vienen de transiciones internas insensibles al enlace.'},
{tag:'M7',q:'Quieres vibraciones de una proteína en disolución acuosa. ¿FTIR o Raman?',
 opts:['Cualquiera: el disolvente no interfiere si se resta un espectro de fondo','Raman','FTIR, que resulta más sensible para los modos de amida característicos','FTIR, porque el agua es prácticamente transparente en el infrarrojo medio'],correct:1,
 exp:'El agua tiene bandas de absorción infrarroja muy intensas que saturan justo la región de interés, mientras que su sección eficaz Raman es pequeña. Por eso el Raman domina en muestras acuosas y biológicas. Restar el fondo no recupera información donde el detector ya está saturado.'},
{tag:'M7',q:'En una TGA en aire, una nanopartícula recubierta pierde 2 % hasta 120 °C y 14 % entre 200 y 400 °C. ¿Cuánto recubrimiento tiene?',
 opts:['16 %, sumando las dos pérdidas registradas antes de la meseta final','14 %','2 %, ya que la pérdida de baja temperatura es la del ligando anclado','No puede saberse sin conocer el área superficial medida por BET'],correct:1,
 exp:'La pérdida por debajo de 120 °C es agua fisisorbida y disolvente residual, que no cuenta como recubrimiento. El intervalo de 200 a 400 °C es el de descomposición oxidativa de cadenas orgánicas: ese 14 % es el contenido de ligando. El área por BET sirve para la densidad de injerto, no para el porcentaje.'},
{tag:'M7',q:'Mides una nanopartícula de 20 nm con AFM y la anchura sale 42 nm, pero la altura 19 nm. ¿Qué dato usas?',
 opts:['El promedio de ambos, que compensa las desviaciones de cada medida','La altura','La anchura, que corresponde al diámetro real proyectado del objeto','Ninguno: hay que recalibrar el equipo antes de aceptar el resultado'],correct:1,
 exp:'Toda imagen de AFM es la convolución entre la topografía real y la geometría de la punta, así que los objetos salientes aparecen más anchos. La resolución vertical depende de la deflexión de la micropalanca y no de la punta, de modo que la altura es el dato confiable.'},
{tag:'M7',q:'Analizas por EDS una nanopartícula de 30 nm sobre sustrato de silicio y domina la señal de silicio. ¿Por qué?',
 opts:['La partícula contiene silicio procedente del precursor de la síntesis','El detector está mal calibrado para elementos de número atómico bajo','El volumen de interacción es de micras','El silicio tiene un rendimiento de fluorescencia anormalmente alto'],correct:2,
 exp:'El haz penetra y se dispersa generando rayos X en un volumen en forma de pera de uno o varios micrómetros, mucho mayor que la partícula. Con objetos nanométricos sobre sustrato, la contribución del sustrato domina. Se resuelve con soportes ligeros y delgados o con EDS en TEM sobre muestra fina.'},

/* ---------------- M8 ---------------- */
{tag:'M8',q:'Reduces de 100 a 50 µm el radio de un microcanal manteniendo la presión. ¿Qué pasa con el caudal?',
 opts:['Baja a la cuarta parte, siguiendo el área transversal del conducto','No cambia si la presión aplicada se mantiene rigurosamente constante','Cae a una dieciseisava parte','Se reduce a la mitad al disminuir proporcionalmente la sección libre'],correct:2,
 exp:'Hagen-Poiseuille hace el caudal proporcional a r⁴, así que dividir el radio entre dos lo divide entre 2⁴ = 16. Esa sensibilidad extrema explica por qué una obstrucción parcial afecta tanto y por qué el canal más estrecho domina la resistencia de toda la red.'},
{tag:'M8',q:'Dos corrientes confluyen en un microcanal con Re = 0.5 y salen sin mezclarse. ¿Qué harías para mezclar?',
 opts:['Aumentar el caudal hasta alcanzar un régimen turbulento en el canal','Diseñar geometría que pliegue las corrientes','Ampliar la sección del canal para dar más tiempo a la difusión lateral','Calentar el fluido, ya que la difusividad crece con la temperatura'],correct:1,
 exp:'Con Re muy por debajo de 2000 el flujo es laminar y no hay mezcla convectiva. Alcanzar turbulencia en un canal de 100 µm exigiría velocidades inviables. Lo que se hace es forzar el plegamiento con canales serpenteantes y surcos en el fondo, o trabajar en gotas.'},
{tag:'M8',q:'Un resonador MEMS pasa de 1.000 MHz a 0.998 MHz tras exponerlo a un analito. ¿Qué ocurrió?',
 opts:['Se desorbió material y el resonador perdió parte de su masa inicial','El analito aumentó la rigidez efectiva de la micropalanca utilizada','Adsorbió masa','Hubo deriva térmica, sin relación con la presencia del analito'],correct:2,
 exp:'De Δf/f₀ ≈ −Δm/(2m), adsorber masa baja la frecuencia. El signo es lo que se pregunta: aquí la caída de 2 kHz corresponde a una masa añadida. Perder masa la subiría, y un aumento de rigidez también.'},
{tag:'M8',q:'En voltamperometría cíclica, la corriente de pico crece proporcionalmente a v y no a √v. ¿Qué significa?',
 opts:['El barrido es demasiado rápido para el sistema de adquisición usado','El proceso redox es irreversible en la escala de tiempo del barrido','La concentración del analito excede el rango lineal de la técnica','La especie está adsorbida en el electrodo'],correct:3,
 exp:'Randles-Ševčík predice i_p proporcional a √v para una especie que difunde desde la disolución. Si la dependencia es lineal en v, la especie ya está en la superficie y no necesita difundir. Es un diagnóstico estándar para distinguir ambos regímenes.'},
{tag:'M8',q:'Comparas un biosensor de glucosa de primera y de segunda generación en una muestra con oxígeno variable. ¿Qué diferencia esperas?',
 opts:['La primera será más estable porque no depende de un mediador añadido','Ambas darán la misma lectura si la enzima está correctamente inmovilizada','La segunda dará lecturas más consistentes','La segunda perderá selectividad al introducir una especie redox extra'],correct:2,
 exp:'La primera generación usa oxígeno como aceptor natural de electrones, así que su lectura varía con una magnitud incontrolada. El mediador artificial de la segunda toma ese papel y hace la respuesta independiente del oxígeno, que es exactamente el problema que resuelve. La selectividad la aporta la enzima.'},
{tag:'M8',q:'¿Por qué el silicio domina la microelectrónica y no se usa para LED?',
 opts:['Su gap resulta demasiado ancho para emitir en el rango visible útil','Su movilidad de portadores es insuficiente para operar en directa','Su gap es indirecto','No admite dopaje tipo p con la pureza necesaria para emitir luz'],correct:2,
 exp:'En un semiconductor indirecto el mínimo de conducción y el máximo de valencia están en distinto vector de onda, así que la recombinación radiativa necesita además un fonón: un proceso de tres cuerpos, mucho menos probable que la no radiativa. Su gap de 1.12 eV es estrecho, no ancho, y se dopa perfectamente en ambos tipos.'},
{tag:'M8',q:'Un sensor SERS da señales que varían un 40 % entre puntos del mismo sustrato. ¿Cuál es la causa de fondo?',
 opts:['El láser pierde potencia de forma gradual durante la medición continua','La amplificación depende de puntos calientes','El detector satura en las zonas de mayor concentración de analito','La molécula se degrada por fotólisis al repetir medidas en un punto'],correct:1,
 exp:'El factor de amplificación escala aproximadamente con la cuarta potencia del refuerzo de campo, de modo que una fracción diminuta de posiciones privilegiadas aporta la mayor parte de la señal. Como la densidad de esos puntos varía espacialmente, la reproducibilidad cuantitativa es el problema central del método.'},
{tag:'M8',q:'Diseñas un acelerómetro y quieres más sensibilidad. Usas resortes más blandos. ¿Qué sacrificas?',
 opts:['La resolución, al aumentar el ruido electrónico del circuito de lectura','El ancho de banda','El rango dinámico, que queda limitado por la geometría de los peines','Nada: la sensibilidad y el desempeño dinámico son independientes'],correct:1,
 exp:'El desplazamiento estático es x = ma/k, así que menor k da más señal. Pero ω = √(k/m) baja con k, y con ella el ancho de banda útil y la robustez frente a choques. Sensibilidad y ancho de banda están en conflicto directo, y ese compromiso es el núcleo del diseño.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M9 ---------------- */
{tag:'M9',q:'Pasas una reacción exotérmica de 50 mL a 500 L sin cambiar la química. Se descontrola térmicamente. ¿Por qué?',
 opts:['El área de disipación creció menos que el volumen','La constante de velocidad aumenta con el volumen de la mezcla','La entalpía de reacción se vuelve más negativa a mayor escala de trabajo','La agitación resulta siempre menos eficaz en reactores de mayor tamaño'],correct:0,
 exp:'El calor generado es proporcional al volumen (k³) y el disipado al área (k²), así que la razón entre ambos empeora linealmente con el factor de escala. La química no cambió: cambió la geometría. Es el modo de fallo más citado del escalamiento y obliga a rediseñar la refrigeración.'},
{tag:'M9',q:'Escalas un reactor conservando la potencia por unidad de volumen. ¿Qué le pasa a la velocidad de punta del impulsor?',
 opts:['Se mantiene constante, que es justo el objetivo de conservar P/V','Sube','Baja en la misma proporción en que descienden las revoluciones','Queda indeterminada sin conocer la viscosidad del medio de reacción'],correct:1,
 exp:'Conservar P/V exige N proporcional a D^(−2/3), así que las revoluciones bajan. Pero la velocidad de punta es πND, que escala como D^(1/3): aumenta. Por eso los criterios son incompatibles, y en células o cristales frágiles se conserva la punta sacrificando mezclado.'},
{tag:'M9',q:'Una síntesis de nanopartículas monodispersas pierde uniformidad al escalarla diez veces. ¿Qué la explica?',
 opts:['El precursor se degrada en los tiempos más largos del lote mayor','La temperatura es menos homogénea por el mayor gradiente radial térmico','El tiempo de mezclado creció y rompió la nucleación instantánea','La concentración de estabilizante se diluyó al aumentar el volumen total'],correct:2,
 exp:'LaMer exige un estallido de nucleación simultáneo en todo el volumen. Al escalar bajo P/V constante el tiempo de mezclado crece, de modo que unas zonas nuclean antes que otras y las partículas dejan de tener la misma edad. El flujo continuo lo evita escalando por tiempo de operación en lugar de por volumen.'},
{tag:'M9',q:'Pruebas tres factores a dos niveles con el método de una variable a la vez y obtienes un óptimo. ¿Qué riesgo corres?',
 opts:['Gastar más corridas de las que exigiría un diseño factorial completo','Que las réplicas insuficientes impidan estimar el error experimental real','No detectar interacciones','Que la aleatorización del orden introduzca un sesgo no controlado'],correct:2,
 exp:'Al fijar las demás variables mides el efecto de cada factor en una sola combinación de las otras. Si ese efecto depende del nivel de otro factor, algo habitual en síntesis de nanomateriales, la conclusión no generaliza y puedes quedarte en un óptimo local. El ahorro de corridas es una ventaja secundaria del factorial.'},
{tag:'M9',q:'Con 500 réplicas por grupo obtienes p < 0.001 para una diferencia de 0.3 nm en tamaño medio. ¿Qué reportas?',
 opts:['Que las dos muestras son estadísticamente indistinguibles entre sí','Que el efecto existe pero su magnitud puede ser irrelevante','Que el efecto es importante dado el nivel de significancia alcanzado','Que hay un error de cálculo, porque 0.3 nm no puede ser significativo'],correct:1,
 exp:'Con muestras grandes, diferencias minúsculas alcanzan significancia. El valor p responde a si el efecto existe, no a si importa. Por eso hay que reportar el tamaño del efecto con su intervalo de confianza y juzgar la relevancia contra el requisito de la aplicación.'},
{tag:'M9',q:'Mides un radio con 4 % de incertidumbre relativa y calculas el volumen. ¿Qué incertidumbre tiene el volumen?',
 opts:['1.3 %, al repartirse la incertidumbre entre las tres dimensiones','16 %, sumando las contribuciones de las tres dimensiones en cuadratura','12 %','4 %, porque la incertidumbre relativa se conserva en las potencias'],correct:2,
 exp:'Para y = aⁿ la incertidumbre relativa se multiplica por el exponente. Como el volumen va con r³, el 4 % se convierte en 12 %. Es la razón de que en nanotecnología la incertidumbre del tamaño se amplifique al pasar a magnitudes volumétricas o másicas.'},
{tag:'M9',q:'Un reactor convierte 30 % por paso y recirculas todo el reactivo no convertido. ¿Cuál es la conversión global?',
 opts:['30 %, igual que la de paso, porque la recirculación no añade conversión','70 %, correspondiente a la fracción que regresa al reactor cada vuelta','No se puede determinar sin conocer el caudal de recirculación exacto','100 %'],correct:3,
 exp:'Con un volumen de control que encierra todo el proceso, la recirculación no cruza la frontera. Si el único destino final del reactivo es convertirse, la conversión global es total. El precio es un caudal de recirculación elevado, con su costo de bombeo y separación, y una purga si entran inertes.'},
{tag:'M9',q:'Para una cinética de orden positivo y la misma conversión, ¿qué reactor necesita menos volumen?',
 opts:['El CSTR, porque la mezcla perfecta aprovecha mejor todo el volumen útil','El PFR','Ambos requieren exactamente el mismo volumen a igual conversión final','Depende solo de la temperatura de operación y no de la configuración'],correct:1,
 exp:'El CSTR opera en todo su volumen a la concentración de salida, la más baja del proceso, y por tanto a la velocidad más lenta. El PFR mantiene un gradiente y aprovecha las concentraciones altas de la entrada. La excepción son las cinéticas autocatalíticas o con inhibición por sustrato.'},

/* ---------------- M10 ---------------- */
{tag:'M10',q:'Mezclas Span 80 (HLB 4.3) y Tween 80 (HLB 15.0) en proporción másica 40:60. ¿Qué HLB resulta?',
 opts:['9.7, promediando los dos valores sin ponderar por la masa de cada uno','19.3, sumando las contribuciones de ambos surfactantes de la mezcla','7.4, invirtiendo las fracciones másicas asignadas a cada componente','10.7'],correct:3,
 exp:'El HLB de una mezcla es el promedio ponderado por fracción másica: 0.40 × 4.3 + 0.60 × 15.0 = 10.72. Con ese valor, en la zona de 8 a 18, la mezcla favorece emulsiones de aceite en agua por la regla de Bancroft.'},
{tag:'M10',q:'Una emulsión se separa en dos capas pero al agitarla se recupera íntegra. ¿Qué mecanismo actuó?',
 opts:['Coalescencia, porque las gotas se fundieron y después se redispersaron','Maduración de Ostwald, con transferencia de material entre las gotas','Inversión de fases provocada por el cambio de temperatura ambiente','Cremado o floculación'],correct:3,
 exp:'La reversibilidad por agitación indica que las gotas conservaron su identidad y solo se separaron espacialmente o se agruparon. La coalescencia funde gotas de forma irreversible y la maduración transfiere material entre ellas, y ninguna de las dos se deshace agitando.'},
{tag:'M10',q:'Tu nanopartícula con ligando de direccionamiento funciona in vitro y falla in vivo. ¿Cuál es la explicación más probable?',
 opts:['La corona proteica enterró el ligando','El ligando se hidroliza en el plasma a la temperatura del organismo','La dosis administrada resultó insuficiente para alcanzar el blanco útil','El receptor diana no se expresa en el modelo animal seleccionado'],correct:0,
 exp:'En fluido biológico la partícula queda recubierta de proteínas plasmáticas en milisegundos, así que lo que la célula encuentra es la corona y no la superficie diseñada. El medio in vitro tiene mucha menos proteína, y esa diferencia explica buena parte de la brecha entre ambos resultados.'},
{tag:'M10',q:'Un candidato tiene masa 620 Da y logP 6.2, violando dos criterios de Lipinski. ¿Qué se concluye?',
 opts:['Que el compuesto es tóxico y debe descartarse del programa de desarrollo','Su absorción oral pasiva será pobre','Que no puede administrarse por ninguna vía de las disponibles hoy','Que el riñón lo eliminará rápidamente por filtración glomerular directa'],correct:1,
 exp:'La regla es una heurística estadística sobre absorción oral por difusión pasiva, no un juicio de toxicidad ni de viabilidad general. La vía intravenosa y la encapsulación en un transportador cambian el problema, porque quien atraviesa las barreras deja de ser la molécula libre.'},
{tag:'M10',q:'Una emulsión pierde gotas pequeñas y gana gotas grandes sin que lleguen a tocarse. ¿Cómo lo frenas?',
 opts:['Subiendo el potencial zeta para reforzar la repulsión electrostática','Añadiendo más surfactante para engrosar la película interfacial formada','Con un componente insoluble en la fase continua','Agitando con mayor frecuencia para redispersar las gotas crecidas'],correct:2,
 exp:'Es maduración de Ostwald: el material difunde desde las gotas pequeñas, más solubles por curvatura, hacia las grandes, sin contacto. Los estabilizantes coloidales previenen floculación y coalescencia pero no este mecanismo. Un componente que no pueda salir de la gota genera una contrapresión osmótica que lo contrarresta.'},
{tag:'M10',q:'En una síntesis biomédica, ¿por qué la nucleación es un punto crítico de control y no solo un paso importante?',
 opts:['Porque es la etapa más costosa en reactivos de todo el proceso completo','Porque genera los residuos más peligrosos de la línea de producción','Porque es la etapa más larga y condiciona el tiempo total de ciclo','Porque ninguna etapa posterior corrige el tamaño'],correct:3,
 exp:'La prueba para distinguir un punto crítico es si existe una etapa posterior capaz de corregir el fallo. El tamaño queda fijado en la nucleación y el crecimiento inicial, y ni la purificación ni el envasado lo reparan, así que el control debe aplicarse ahí con límites numéricos medibles.'},
{tag:'M10',q:'Un proceso es técnicamente factible pero el costo por unidad supera diez veces al de la alternativa existente. ¿Qué afirmas?',
 opts:['Es viable si se consigue financiamiento suficiente para la etapa inicial','Es factible pero no viable','Es viable porque la factibilidad técnica ya quedó demostrada en planta','No es factible, ya que el costo forma parte de la factibilidad técnica'],correct:1,
 exp:'Factible responde «se puede»; viable responde «conviene». Son preguntas distintas y confundirlas arruina un análisis de caso. Una tecnología que funciona, cuesta diez veces más y no resuelve un problema que la alternativa no resuelva, no tiene camino comercial.'},
{tag:'M10',q:'Vas a manipular un nanomaterial cuya toxicidad no está caracterizada. ¿Qué medida es la prioritaria?',
 opts:['Usar mascarilla con filtro de partículas durante toda la manipulación','Firmar un consentimiento informado antes de iniciar cualquier ensayo','Manejarlo en suspensión y no en polvo seco','Documentar el procedimiento en la bitácora del laboratorio al detalle'],correct:2,
 exp:'La jerarquía de controles pone primero eliminar o sustituir, luego ingeniería, después procedimientos y en último lugar el equipo de protección personal, que es el menos fiable porque depende del comportamiento humano. Manejar en suspensión elimina la vía de exposición dominante, que es la inhalación de material aerosolizado.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M2 · ampliación ---------------- */
{tag:'M2',q:'Preparas 500 mL de HCl 0.10 M desde una disolución 2.0 M. ¿Qué volumen de madre tomas?',opts:['10 mL, dividiendo el volumen final entre el factor de concentración','50 mL, que es la décima parte del volumen final que se prepara','25 mL','100 mL, aplicando directamente la razón entre las dos concentraciones'],correct:2,exp:'C₁V₁ = C₂V₂ ⇒ V₁ = (0.10 × 500)/2.0 = 25 mL. El factor de dilución es 20, así que el volumen de madre es el final entre 20. Los distractores corresponden a dividir entre 5, entre 50 y entre 10.'},
{tag:'M2',q:'Mides A = 1.85 en un espectrofotómetro. ¿Qué haces antes de usar el dato?',opts:['Aceptarlo: cuanto mayor es la absorbancia, mejor la relación señal-ruido','Restar el blanco una segunda vez para corregir la deriva del equipo','Extrapolar la curva de calibración hasta cubrir ese valor de absorbancia','Diluir la muestra para bajar la absorbancia al rango fiable'],correct:3,exp:'Por encima de A ≈ 1 la ley de Beer se desvía por luz parásita, anchura de banda finita e interacción entre absorbentes, y el detector recibe muy poca luz. El intervalo de trabajo fiable es 0.1 a 1.0. Extrapolar una calibración fuera de su rango lineal no arregla un problema físico.'},
{tag:'M2',q:'En una curva de titulación de ácido débil, ¿dónde la pendiente es mínima?',opts:['En la zona tampón, alrededor de la semiequivalencia','En el punto de equivalencia, donde la reacción se completa totalmente','Al inicio, antes de añadir la primera gota de titulante a la muestra','Después de la equivalencia, cuando domina el exceso de base fuerte'],correct:0,exp:'En la región donde coexisten el ácido y su base conjugada, añadir titulante solo cambia la razón entre ambos, y el pH se mueve poco: es la meseta tampón, con su centro en pH = pKa. En la equivalencia ocurre lo contrario, el salto más brusco de toda la curva.'},
{tag:'M2',q:'Un electrodo selectivo de ion se calibra a 25 °C y se usa a 37 °C sin recalibrar. ¿Qué error aparece?',opts:['El electrodo deja de responder por debajo del límite de detección','La pendiente de respuesta cambia de 59 a 62 mV por década','Ninguno, porque el potencial estándar no depende de la temperatura','La selectividad frente a iones interferentes se invierte por completo'],correct:1,exp:'El término de Nernst es RT/nF, proporcional a la temperatura absoluta. A 25 °C el coeficiente decimal vale 0.0592 V y a 37 °C sube a 0.0616 V. Usar la pendiente equivocada sesga sistemáticamente las lecturas, y el efecto crece cuanto más lejos esté la muestra del punto de calibración.'},
{tag:'M2',q:'Comparas AAS de llama con ICP-MS para medir diez metales traza en agua. ¿Qué decide la elección?',opts:['Ambas tienen el mismo límite de detección en elementos pesados','La AAS requiere menos preparación porque no necesita disolución','El ICP-MS mide todos a la vez y llega a trazas más bajas','La AAS de llama es multielemental y por eso resulta más rápida'],correct:2,exp:'La AAS de llama es esencialmente monoelemental: hay que cambiar la lámpara para cada analito. El ICP excita todos los elementos simultáneamente en el plasma, y acoplado a espectrometría de masas alcanza límites varios órdenes por debajo. Para diez metales traza la diferencia en tiempo y sensibilidad es decisiva.'},
{tag:'M2',q:'Tienes cinco réplicas: 10.2, 10.3, 10.1, 10.2 y 11.8. ¿Qué procede con la última?',opts:['Descartarla, porque es evidente que se aleja del resto del conjunto','Conservarla siempre, ya que eliminar datos sesga el resultado final','Repetir la serie completa e ignorar las cinco medidas anteriores','Aplicar la prueba Q con un criterio fijado de antemano'],correct:3,exp:'Un valor sospechoso se trata con un criterio estadístico declarado antes de ver los datos, no por inspección visual. La prueba Q compara la diferencia con el vecino más próximo contra el rango total. Descartar porque un dato incomoda es mala práctica, y conservar un error grosero evidente también distorsiona.'},
{tag:'M2',q:'Calculas 12.11 + 8.4 + 1.234. ¿Cómo lo reportas?',opts:['21.7','21.744, conservando todos los decimales del cálculo intermedio','21.74, usando el promedio de decimales de los tres sumandos dados','22, redondeando al número de cifras significativas del término menor'],correct:0,exp:'En sumas y restas manda el menor número de decimales, y 8.4 solo tiene uno. En multiplicaciones y divisiones mandaría el menor número de cifras significativas, que es un criterio distinto. Confundir ambas reglas es el error de cifras más frecuente.'},
{tag:'M2',q:'Determinas Ag⁺ por el método de Mohr y obtienes 28.4 mg/L de cloruro. ¿Qué supone ese cálculo?',opts:['Que el pH del medio no afecta la solubilidad del precipitado formado','Estequiometría 1 a 1 entre plata y cloruro','Que el cromato indicador también precipita con el cloruro presente','Que la plata se encuentra en exceso respecto al punto de equivalencia'],correct:1,exp:'El AgCl se forma mol a mol, así que los moles de plata gastados igualan a los de cloruro. El cromato solo precipita cuando el cloruro ya se agotó, y de ahí el viraje rojizo. El pH sí importa en el método de Mohr, pero no entra en la estequiometría del cálculo.'},
{tag:'M2',q:'Un buffer de acetato a pH 4.76 recibe una pequeña adición de HCl. ¿Qué ocurre?',opts:['El buffer se destruye de inmediato al introducirse un ácido fuerte','El pH sube porque el equilibrio se desplaza hacia el ácido acético','El acetato capta los protones y el pH baja muy poco','El pH baja de forma proporcional a la cantidad de ácido añadida'],correct:2,exp:'A pH igual al pKa hay cantidades comparables de ácido y base conjugada, de modo que la base neutraliza el protón añadido convirtiéndose en ácido. La razón entre ambas formas cambia poco y el logaritmo cambia aún menos. El tampón se agota solo cuando una de las dos formas se consume.'},
{tag:'M2',q:'Analizas el mismo lote por gravimetría y por espectrofotometría y obtienes 7.1 % y 8.9 %. ¿Qué haces primero?',opts:['Promediar ambos valores, ya que los dos métodos son igual de válidos','Quedarte con la gravimetría, que es un método absoluto y sin calibrar','Repetir la espectrofotometría hasta que converja con la gravimetría','Buscar una interferencia específica de cada método'],correct:3,exp:'Una discrepancia entre métodos independientes es información, no ruido: indica que al menos uno tiene un sesgo específico, por coprecipitación en gravimetría o por interferencia espectral en el otro. Promediar oculta el problema y repetir hasta coincidir es forzar el resultado hacia una conclusión previa.'},
{tag:'M2',q:'Quieres el LOD más bajo posible y puedes mejorar solo una cosa. ¿Cuál eliges?',opts:['El ruido del blanco','El número de réplicas por muestra en la rutina de medición','La resolución del display del instrumento utilizado para leer','El rango superior de la curva de calibración construida'],correct:0,exp:'LOD ≈ 3σ del blanco entre la pendiente, así que solo hay dos palancas: bajar el ruido de fondo o subir la sensibilidad. Más réplicas mejoran la precisión de una medida pero no desplazan el umbral de detección, y ni el display ni el extremo superior de la curva entran en la expresión.'},
{tag:'M2',q:'Dos picos en TLC tienen Rf de 0.72 y 0.75 y no se separan bien. ¿Qué ajustas?',opts:['La temperatura de la cámara, que gobierna la velocidad del frente','La polaridad del eluyente, para bajar ambos Rf a la zona media','La cantidad de muestra aplicada en el punto de siembra inicial','La longitud de la placa, para dar más recorrido a la separación'],correct:1,exp:'Con Rf cercanos a 1 los analitos pasan casi todo el tiempo en la fase móvil y apenas interactúan con la estacionaria, que es donde ocurre la discriminación. Bajando la polaridad del eluyente se los lleva a la zona de 0.3 a 0.7, donde el reparto entre fases sí los separa.'},
{tag:'M2',q:'Al valorar con EDTA a pH 5 obtienes un salto difuso en el punto final. ¿Qué pasa?',opts:['El EDTA se oxida a ese pH y pierde capacidad de formar complejos','La relación de complejación deja de ser 1 a 1 en medio ácido','La fracción de Y⁴⁻ es baja y la constante condicional cae','El indicador metalocrómico no es soluble en medio moderadamente ácido'],correct:2,exp:'El EDTA es tetraprótico y solo la especie completamente desprotonada acompleja. Al bajar el pH esa fracción se desploma, la constante condicional de formación cae y el salto se difumina. La estequiometría 1:1 no cambia con el pH, y el EDTA no se oxida en esas condiciones.'},
{tag:'M2',q:'Reportas una concentración como 0.0500 M. ¿Cuántas cifras significativas comunicas?',opts:['Cuatro, contando todos los dígitos que aparecen tras el punto decimal','Dos, porque los ceros a la derecha no se consideran significativos','Una, ya que solo el cinco es un dígito distinto de cero en el número','Tres'],correct:3,exp:'Los ceros a la izquierda del primer dígito significativo solo sitúan el punto decimal y no cuentan. Los ceros a la derecha, cuando hay punto decimal, sí son significativos porque comunican la precisión de la medida. Quedan el 5 y los dos ceros finales: tres cifras.'},

/* ---------------- M3 · ampliación ---------------- */
{tag:'M3',q:'Comparas la acidez de etano, eteno y etino. ¿Cuál es el orden creciente?',opts:['Etano < eteno < etino','Etino < eteno < etano, siguiendo el número de hidrógenos disponibles','Eteno < etano < etino, por la geometría plana del doble enlace','Los tres tienen acidez equivalente al ser todos hidrocarburos simples'],correct:0,exp:'La acidez refleja la estabilidad de la base conjugada. El carbanión del alquino aloja el par en un orbital sp con 50 % de carácter s, más cercano al núcleo y por tanto más estable que el sp² del alqueno o el sp³ del alcano. Más carácter s significa mayor acidez.'},
{tag:'M3',q:'Un halogenuro terciario en agua a temperatura ambiente, sin base añadida. ¿Qué mecanismo esperas?',opts:['Ninguno: sin base fuerte el sustrato permanece inalterado en el medio','SN1','SN2, porque el agua es un nucleófilo presente en gran exceso molar','E2, ya que el agua puede actuar como base y arrancar un protón'],correct:1,exp:'El sustrato terciario bloquea estéricamente el ataque por la cara opuesta que exige SN2, y a cambio forma un carbocatión estable. El agua es nucleófilo débil y disolvente prótico polar, que es justo lo que estabiliza al carbocatión. Es el conjunto de condiciones canónico de SN1, con racemización del producto.'},
{tag:'M3',q:'Tienes 2-butanol ópticamente puro y lo sometes a condiciones de SN1. ¿Qué obtienes?',opts:['Exclusivamente el enantiómero de configuración opuesta al de partida','Un diastereómero nuevo generado por el reordenamiento del esqueleto','Una mezcla casi racémica','El mismo enantiómero con la configuración intacta y sin cambio alguno'],correct:2,exp:'El carbocatión intermedio es plano y puede ser atacado por cualquiera de sus dos caras con probabilidad similar, de modo que se forman ambos enantiómeros. En la práctica suele quedar un ligero exceso del invertido porque el grupo saliente estorba una cara mientras se aleja. La inversión completa es la firma de SN2.'},
{tag:'M3',q:'El nailon 6,6 se obtiene de una diamina y un diácido. ¿Qué subproducto se libera?',opts:['Metanol procedente de la apertura del grupo éster intermedio','Dióxido de carbono liberado en la descarboxilación de la cadena','Ninguno: la unión de los monómeros ocurre por simple adición','Agua'],correct:3,exp:'La amida se forma por condensación entre el ácido carboxílico y la amina, liberando una molécula de agua por cada enlace. Esa es precisamente la diferencia con la polimerización por adición, donde la unidad repetitiva pesa lo mismo que el monómero porque no se pierde nada.'},
{tag:'M3',q:'Una proteína pierde actividad al calentarla a 70 °C pero conserva su secuencia. ¿Qué ocurrió?',opts:['Se desnaturalizó','Se hidrolizaron los enlaces peptídicos de la cadena principal','Cambió la configuración de sus centros estereogénicos a la forma D','Se oxidaron de forma irreversible todos sus residuos aromáticos'],correct:0,exp:'La secuencia intacta significa que los enlaces peptídicos no se rompieron: lo que se perdió es la estructura tridimensional sostenida por puentes de hidrógeno, interacciones hidrofóbicas y puentes disulfuro. Como la función depende de la forma del sitio activo, la actividad desaparece aunque la cadena siga completa.'},
{tag:'M3',q:'Comparas la solubilidad en agua de butanol y de butano. ¿Qué explica la diferencia?',opts:['La diferencia de densidad entre ambos compuestos a temperatura ambiente','El hidroxilo forma puentes de hidrógeno con el agua','La mayor masa molecular del butanol frente a la del hidrocarburo','La geometría tetraédrica del carbono unido al grupo funcional polar'],correct:1,exp:'La solubilidad depende de si el soluto puede sustituir las interacciones agua-agua por interacciones comparables. El grupo OH dona y acepta puentes de hidrógeno; la cadena de butano solo ofrece London y obliga al agua a reorganizarse a su alrededor con costo entrópico. La masa es casi la misma.'},
{tag:'M3',q:'Un alqueno asimétrico se hidrata en medio ácido. ¿Dónde queda el hidroxilo?',opts:['Repartido al azar entre los dos carbonos del doble enlace original','En el carbono terminal, independientemente de la sustitución presente','En el carbono más sustituido','En el carbono menos sustituido, por ser el más accesible estéricamente'],correct:2,exp:'El protón se adiciona primero generando el carbocatión más estable, que es el más sustituido, y el agua ataca ahí. Eso es la regla de Markovnikov vista por su mecanismo, no como receta. Para obtener el producto contrario hay que cambiar de ruta, por ejemplo hidroboración-oxidación.'},
{tag:'M3',q:'Michaelis-Menten: a concentración de sustrato mucho mayor que Km, ¿qué orden observas?',opts:['Primer orden respecto al sustrato, que sigue siendo el reactivo limitante','Segundo orden, al participar enzima y sustrato en el complejo formado','Orden fraccionario, intermedio entre los dos regímenes de la curva','Orden cero'],correct:3,exp:'Con [S] muy por encima de Km el denominador se aproxima a [S] y la ecuación se reduce a v ≈ Vmax: toda la enzima está ocupada y añadir más sustrato no cambia nada. A [S] muy por debajo de Km el comportamiento sí es de primer orden. La curva recorre ambos regímenes.'},
{tag:'M3',q:'La PCR amplifica una secuencia. ¿Qué define la especificidad del producto?',opts:['Los cebadores','La temperatura de extensión elegida para la polimerasa utilizada','El número total de ciclos que se programan en el termociclador','La concentración de iones magnesio presentes en la mezcla de reacción'],correct:0,exp:'Los cebadores delimitan por complementariedad la región que se copia, así que son ellos los que deciden qué se amplifica. El magnesio y la temperatura de hibridación afectan la eficiencia y el rigor, y pueden generar productos inespecíficos si están mal ajustados, pero no definen el blanco.'},
{tag:'M3',q:'Dos polímeros tienen igual masa molecular media pero distinta polidispersidad. ¿Qué difiere?',opts:['La temperatura de degradación térmica medida por termogravimetría','La anchura de la distribución de longitudes de cadena','La masa de la unidad repetitiva que constituye cada uno de ellos','El grado de cristalinidad, que depende solo de la masa promedio'],correct:1,exp:'La polidispersidad es la razón entre la masa promedio en peso y la promedio en número, y mide cuán dispersas están las longitudes de cadena. Dos materiales pueden compartir promedio y diferir mucho en homogeneidad, lo que cambia propiedades mecánicas y de procesado.'},
{tag:'M3',q:'Un éster se hidroliza en medio básico. ¿Qué nombre recibe y qué obtienes?',opts:['Transesterificación, con intercambio del grupo alcoxi por otro distinto','Descarboxilación, con pérdida de dióxido de carbono del grupo éster','Saponificación, con la sal del ácido y el alcohol','Esterificación inversa, que devuelve el ácido libre y el alcohol puro'],correct:2,exp:'En medio básico el ataque del hidróxido conduce al carboxilato, que al estar desprotonado ya no puede volver atrás: la reacción es irreversible, al contrario que la hidrólisis ácida. De ahí que se use para fabricar jabones a partir de triglicéridos.'},
{tag:'M3',q:'El DNA se desnaturaliza al calentar. ¿Qué secuencia resiste más temperatura?',opts:['La rica en adenina y timina, por la mayor estabilidad del par formado','Ambas por igual, ya que la doble hélice tiene geometría uniforme','La más corta, porque concentra mejor las fuerzas de apilamiento','La rica en guanina y citosina'],correct:3,exp:'El par G-C forma tres puentes de hidrógeno y el A-T solo dos, así que una secuencia rica en GC exige más energía para separarse y su temperatura de fusión es mayor. Es la base de calcular la Tm de un cebador a partir de su composición.'},
{tag:'M3',q:'Quieres sintetizar un fármaco con un solo centro estereogénico en su forma activa. ¿Qué estrategia da mejor economía atómica?',opts:['Síntesis asimétrica con catalizador quiral','Preparar el racémico y resolverlo por cristalización fraccionada posterior','Separar los enantiómeros por cromatografía en fase estacionaria quiral','Sintetizar ambos y descartar el inactivo mediante filtración selectiva'],correct:0,exp:'Resolver un racémico descarta por definición al menos la mitad del material, mientras que la catálisis asimétrica construye preferentemente el enantiómero deseado desde el principio. Las otras rutas son viables y se usan, pero parten de haber fabricado ya el isómero que se va a tirar.'},
{tag:'M3',q:'Un compuesto presenta bandas en IR a 3300 cm⁻¹ ancha y 1710 cm⁻¹ intensa. ¿Qué grupo tiene?',opts:['Alqueno terminal con su tensión característica de carbono-hidrógeno','Ácido carboxílico','Amida primaria, con la banda ancha del enlace nitrógeno-hidrógeno','Alcohol y cetona en moléculas distintas de una mezcla no separada'],correct:1,exp:'La banda muy ancha cerca de 3300 cm⁻¹ corresponde al OH asociado por puentes de hidrógeno, y la intensa a 1710 cm⁻¹ al carbonilo. La combinación de ambas en una misma molécula es la firma del ácido carboxílico. Una amida mostraría el carbonilo desplazado a número de onda menor.'}
);
</script>
<script>
/* Reactivos en el estilo medido de los quizzes reales del taller:
   enunciado con escenario (~140 caracteres) y opciones breves (~32). */
QUIZ.push(
/* ---------------- M4 · ampliación ---------------- */
{tag:'M4',q:'Un técnico mide la resistencia de una barra metálica a 20 °C y a 80 °C, y encuentra que el valor sube con la temperatura. ¿Qué lo explica?',opts:['Cierre parcial de la banda prohibida','Pérdida de electrones de valencia','Mayor dispersión por fonones','Aumento del número de portadores'],correct:2,exp:'En un metal el número de portadores ya está fijo. Al calentar, la red vibra más y dispersa los electrones con mayor frecuencia, así que la resistividad sube. En un semiconductor ocurre lo contrario porque los portadores crecen exponencialmente.'},
{tag:'M4',q:'Se comparan diamante y grafito, ambos formados solo por carbono. El primero es aislante y durísimo; el segundo conduce y se exfolia. ¿De qué depende la diferencia?',opts:['De la pureza del carbono','De la masa atómica efectiva','Del tamaño de los cristales','Del arreglo y la hibridación'],correct:3,exp:'El diamante es sp³ con red covalente tridimensional y todos los electrones localizados. El grafito es sp² en capas, con electrones deslocalizados en el sistema pi que conducen dentro del plano, y fuerzas débiles entre capas que permiten exfoliar.'},
{tag:'M4',q:'En una celda FCC de parámetro 0.361 nm se quiere conocer el espaciado de la familia de planos (111) para interpretar un difractograma. ¿Cuál es?',opts:['0.208 nm','0.361 nm','0.625 nm','0.180 nm'],correct:0,exp:'d = a/√(h²+k²+l²) = 0.361/√3 = 0.361/1.732 = 0.208 nm. El 0.361 sale de olvidar el denominador y el 0.180 de dividir entre 2 en vez de entre √3.'},
{tag:'M4',q:'Un estudiante afirma que el orbital 1p no se llena porque no hay suficientes electrones en el primer nivel. ¿Es correcta su explicación?',opts:['Solo si se aplica la regla de Hund','No: ese orbital no existe','Sí, es exactamente la razón','Solo en átomos polielectrónicos'],correct:1,exp:'El número azimutal l va de 0 a n−1, así que con n = 1 solo cabe l = 0, que es un orbital s. No es cuestión de cuántos electrones haya: el orbital 1p no existe como solución de la ecuación de Schrödinger.'},
{tag:'M4',q:'Se dopa silicio con boro, que tiene tres electrones de valencia frente a los cuatro del silicio. ¿Qué tipo de portador mayoritario resulta?',opts:['Iones intersticiales','Ninguno: queda intrínseco','Huecos','Electrones libres'],correct:2,exp:'Al faltar un electrón para completar el cuarto enlace queda un hueco, y el nivel aceptor se sitúa cerca de la banda de valencia. Los electrones vecinos saltan a llenarlo dejando huecos móviles: semiconductor tipo p.'},
{tag:'M4',q:'Dos metales cristalizan uno en FCC y otro en BCC. Se compara qué fracción del volumen de la celda ocupan realmente los átomos. ¿Cuál es mayor?',opts:['BCC, con 0.74','FCC, con 0.68','Ambos tienen 0.68','FCC, con 0.74'],correct:3,exp:'FCC y HCP son empaquetamientos compactos con eficiencia 0.74 y coordinación 12. BCC alcanza 0.68 con coordinación 8. La cúbica simple se queda en 0.52 con coordinación 6.'},
{tag:'M4',q:'Un material transparente e incoloro se ilumina con luz visible y no absorbe nada. ¿Qué se puede afirmar de su banda prohibida?',opts:['Es mayor que 3.1 eV','Está entre 1.6 y 3.1 eV','Es menor que 1.6 eV','Es exactamente cero'],correct:0,exp:'El visible va de 1.6 eV (rojo, 780 nm) a 3.1 eV (violeta, 400 nm). Si el material no absorbe ningún fotón visible, su gap debe superar el extremo más energético. Un gap nulo correspondería a un metal, que sería opaco y reflectante.'},
{tag:'M4',q:'Al comparar la densidad calculada de una aleación con la medida en laboratorio, la medida resulta mayor. ¿Qué defecto lo explica mejor?',opts:['Fronteras de grano','Átomos intersticiales','Vacancias en la red','Dislocaciones de borde'],correct:1,exp:'Los intersticiales añaden masa sin cambiar el volumen de la celda, así que la densidad medida sube. Las vacancias harían lo contrario. Dislocaciones y fronteras de grano son defectos lineales y planares, con efecto despreciable sobre la densidad.'},
{tag:'M4',q:'Se endurece un metal mediante trabajo en frío. Al examinarlo después se observa que cuesta más deformarlo plásticamente. ¿Por qué ocurre?',opts:['Desaparecen los planos de deslizamiento','El enlace metálico se vuelve covalente','Las dislocaciones se obstaculizan','Aumenta el parámetro de red'],correct:2,exp:'La deformación plástica ocurre por movimiento de dislocaciones. El trabajo en frío multiplica su densidad hasta que se estorban entre ellas, así que hace falta más esfuerzo para seguir deformando. Todo endurecimiento consiste en obstaculizarlas.'},
{tag:'M4',q:'Un electrón del hidrógeno cae del nivel n = 3 al n = 2 y emite un fotón. Si cayera del n = 4 al n = 2, ¿cómo sería ese segundo fotón?',opts:['De mayor longitud de onda','De la misma energía','De menor frecuencia','De menor longitud de onda'],correct:3,exp:'La separación entre niveles crece conforme se sube, así que el salto 4→2 libera más energía que el 3→2. Mayor energía implica mayor frecuencia y por tanto menor longitud de onda, ya que E = hc/λ.'},
{tag:'M4',q:'Dos compuestos iónicos tienen iones de la misma carga, pero uno los tiene más pequeños. ¿Cuál tendrá mayor punto de fusión?',opts:['El de iones más pequeños','El de iones más grandes','Ambos el mismo','Depende del color del sólido'],correct:0,exp:'La energía reticular crece con el producto de las cargas y disminuye con la distancia entre centros iónicos. A igual carga, iones más pequeños se acercan más, la atracción electrostática es mayor y hace falta más energía para romper la red.'},
{tag:'M4',q:'Se observa un sólido que funde a 1410 °C, no conduce en estado sólido y es muy frágil al golpearlo. ¿Qué clasificación es la más probable?',opts:['Iónico con iones grandes','Covalente en red','Metálico','Molecular'],correct:1,exp:'Punto de fusión altísimo con aislamiento eléctrico y fragilidad apunta a una red covalente tridimensional, como el silicio o el cuarzo. Un metal conduciría, un molecular fundiría muy por debajo y un iónico conduciría al fundirse.'},
{tag:'M4',q:'Un estudiante indexa un difractograma cúbico y obtiene la secuencia 2, 4, 6, 8 para h²+k²+l². ¿Qué red está midiendo?',opts:['Cúbica simple','Hexagonal compacta','BCC','FCC'],correct:2,exp:'En BCC solo difractan los planos con h+k+l par, lo que da la secuencia 2, 4, 6, 8. En FCC los índices deben ser todos pares o todos impares y la secuencia es 3, 4, 8, 11. La cúbica simple no tiene extinciones.'},
{tag:'M4',q:'Se compara la conductividad de un semiconductor intrínseco con la del mismo material dopado a una parte por millón. ¿Qué orden de cambio se espera?',opts:['Un aumento del 1 %','Ningún cambio apreciable','Una disminución moderada','Varios órdenes de magnitud'],correct:3,exp:'Una parte por millón de dopante aporta muchísimos más portadores que los pocos que cruzan el gap térmicamente en el material puro. Por eso el silicio electrónico exige purezas extremas antes de doparlo: cualquier impureza actuaría como dopante incontrolado.'},

/* ---------------- M5 · ampliación ---------------- */
{tag:'M5',q:'Se disuelve sal en agua y la mezcla se enfría al hacerlo. Un estudiante concluye que el proceso no puede ser espontáneo. ¿Tiene razón?',opts:['No: el aumento de entropía puede compensar','Sí, un proceso endotérmico nunca ocurre solo','Sí, salvo que se agite la disolución','No, porque en realidad libera calor'],correct:0,exp:'La espontaneidad la decide ΔG = ΔH − TΔS, no el signo de ΔH por sí solo. Al disolverse, el soluto y el disolvente ganan desorden, y si TΔS supera a ΔH el proceso ocurre aunque enfríe el recipiente.'},
{tag:'M5',q:'Una reacción en equilibrio se comprime reduciendo el volumen a la mitad. Reactivos y productos tienen el mismo número de moles gaseosos. ¿Qué ocurre?',opts:['K disminuye','No se desplaza','Se desplaza a productos','Se desplaza a reactivos'],correct:1,exp:'La presión solo desplaza el equilibrio cuando hay diferencia en el número de moles de gas entre los dos lados, porque solo entonces un sentido alivia más la perturbación. Con los mismos moles a ambos lados, comprimir sube todas las presiones parciales por igual y Q no cambia.'},
{tag:'M5',q:'Se mide la constante de velocidad de una reacción y se obtiene en unidades de s⁻¹. ¿Qué orden global tiene esa reacción?',opts:['Segundo','No puede deducirse','Primero','Cero'],correct:2,exp:'Las unidades de k delatan el orden: para orden n las unidades son M^(1−n)·s⁻¹. Con s⁻¹ puro, n = 1. Orden cero daría M·s⁻¹ y segundo orden M⁻¹·s⁻¹. Es una comprobación rápida y muy usada.'},
{tag:'M5',q:'Dos líquidos tienen la misma masa molecular, pero uno hierve a 78 °C y el otro a −24 °C. ¿Qué diferencia estructural lo explica?',opts:['Uno tiene enlaces más fuertes','Uno es más denso','Uno tiene mayor capacidad calorífica','Uno forma puentes de hidrógeno'],correct:3,exp:'Es el caso del etanol frente al dimetil éter, ambos C₂H₆O. El etanol tiene el hidrógeno unido al oxígeno y forma puentes entre moléculas; en el éter los hidrógenos cuelgan de carbonos y no cumplen el requisito. Al hervir se vencen fuerzas intermoleculares, no enlaces.'},
{tag:'M5',q:'Se añade un catalizador a una reacción exotérmica en equilibrio y se mide la composición final. ¿Qué cambio se observa respecto al caso sin catalizador?',opts:['Ninguno en la composición','Más producto en el equilibrio','Menos producto en el equilibrio','Depende del tipo de catalizador'],correct:0,exp:'El catalizador no altera la energía de reactivos ni de productos, así que ΔG° y K quedan intactos. Baja la barrera por igual en ambos sentidos y solo acorta el tiempo hasta llegar al mismo punto.'},
{tag:'M5',q:'Una disolución de glucosa 0.20 m y otra de NaCl 0.10 m se comparan por su descenso crioscópico. ¿Cuál baja más el punto de congelación?',opts:['Depende del disolvente','Las dos por igual','La de glucosa','La de NaCl'],correct:1,exp:'Lo que cuenta es el número de partículas: la glucosa da 0.20 m efectivos con i = 1, y el NaCl da 0.20 m efectivos con i ≈ 2 sobre 0.10 m. Las dos llegan a la misma molalidad de partículas y producen el mismo descenso.'},
{tag:'M5',q:'Se calienta una reacción endotérmica en equilibrio y se vuelve a medir la constante. ¿Cómo cambia respecto al valor original?',opts:['No cambia','Se vuelve negativa','Aumenta','Disminuye'],correct:2,exp:'En una endotérmica el calor actúa como reactivo, así que aportar más desplaza hacia productos y K sube. La temperatura es la única perturbación que modifica el valor numérico de K, a través de ΔG° = −RT ln K.'},
{tag:'M5',q:'Un estudiante calcula Ea con temperaturas en grados Celsius y obtiene un valor negativo. ¿Cuál es el error más probable?',opts:['Invirtió las constantes de velocidad','Usó logaritmo decimal','Olvidó el factor preexponencial','No usó kelvin'],correct:3,exp:'La ecuación de Arrhenius exige temperatura absoluta porque aparece como 1/T, y una escala con cero arbitrario rompe la relación. Con Celsius el término 1/T₂ − 1/T₁ cambia de magnitud e incluso de signo, lo que produce energías de activación negativas sin sentido físico.'},
{tag:'M5',q:'Se adsorbe nitrógeno sobre un material poroso a 77 K y la isoterma no satura al acercarse a la presión de saturación. ¿Qué modelo aplica?',opts:['BET','Langmuir','Henry','Freundlich de monocapa'],correct:0,exp:'Langmuir supone monocapa sobre sitios equivalentes y por eso satura en un máximo. Que la isoterma siga creciendo indica que se forman capas sucesivas, que es justo lo que describe BET, y del ajuste se extrae la capacidad de monocapa para calcular el área.'},
{tag:'M5',q:'Se compara el potencial zeta de dos suspensiones: una de −38 mV y otra de −6 mV. ¿Qué se espera de su estabilidad?',opts:['Ninguna es estable','La de −38 mV es más estable','La de −6 mV es más estable','Ambas igual de estables'],correct:1,exp:'El criterio práctico sitúa la estabilidad razonable más allá de ±30 mV, porque implica repulsión suficiente para levantar la barrera DLVO por encima de la energía térmica. Cerca de cero la coagulación es rápida, y el punto isoeléctrico es el peor lugar para trabajar.'},
{tag:'M5',q:'Una gota de agua forma un ángulo de contacto de 150° sobre una superficie texturizada. ¿Qué modelo describe mejor la situación?',opts:['Young en superficie lisa','Laplace de curvatura','Cassie-Baxter','Wenzel'],correct:2,exp:'Ángulos por encima de 150° requieren que el líquido no penetre la textura sino que repose sobre bolsas de aire atrapado, que es el régimen de Cassie-Baxter. Wenzel describe el líquido que sí penetra y amplifica el carácter de la superficie plana.'},
{tag:'M5',q:'Un proceso tiene ΔH negativo y ΔS negativo. Se quiere saber a qué temperaturas ocurre de forma espontánea. ¿Cuál es la respuesta?',opts:['Solo por encima de ΔH/ΔS','A cualquier temperatura','A ninguna temperatura','Solo por debajo de ΔH/ΔS'],correct:3,exp:'Con ambos negativos, la entalpía favorece y la entropía se opone, y el término entrópico va multiplicado por T. A temperatura baja domina ΔH y el proceso ocurre; al subir T el término TΔS acaba imponiéndose. El cruce está en T = ΔH/ΔS.'},
{tag:'M5',q:'Se observa que la vida media de una reacción no cambia al reducir a la mitad la concentración inicial del reactivo. ¿Qué orden tiene?',opts:['Primero','Cero','Segundo','Tercero'],correct:0,exp:'Solo en primer orden la vida media es independiente de la concentración inicial, porque t½ = ln2/k. En orden cero t½ es proporcional a [A]₀ y en segundo orden es inversamente proporcional. Es la prueba diagnóstica más rápida.'},
{tag:'M5',q:'Un líquido puro se calienta en un recipiente abierto en la montaña, donde la presión atmosférica es menor. ¿Qué le ocurre al punto de ebullición?',opts:['Depende del volumen del recipiente','Baja','Sube','No cambia'],correct:1,exp:'Un líquido hierve cuando su presión de vapor iguala a la presión externa. Si la externa es menor, ese equilibrio se alcanza a temperatura más baja. La presión de vapor del líquido en sí depende solo de la temperatura, no de la presión atmosférica.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M6 · ampliación ---------------- */
{tag:'M6',q:'Se sintetizan nanopartículas esféricas de 10 nm y se quiere estimar su área específica. El material tiene densidad 5.0 g/cm³. ¿Qué expresión se usa?',opts:['S = 4πr²','S = ρ/(6d)','S = 6/(ρ·d)','S = 6·ρ·d'],correct:2,exp:'Para una esfera, área entre masa da 4πr²/(ρ·(4/3)πr³) = 3/(ρr) = 6/(ρd). Con d = 10 nm y ρ = 5.0 g/cm³ salen unos 120 m²/g. La expresión 4πr² es el área de una sola partícula, no el área específica.'},
{tag:'M6',q:'Durante una reacción sol-gel se observa que se expulsa agua al unirse dos grupos. ¿Qué etapa del proceso se está observando?',opts:['Hidrólisis','Calcinación','Peptización','Condensación'],correct:3,exp:'La hidrólisis consume agua para convertir alcóxidos en hidroxilos; la condensación une dos hidroxilos liberando agua y formando el puente metal-oxígeno-metal que construye la red. La calcinación es el tratamiento térmico posterior.'},
{tag:'M6',q:'Se quieren obtener nanopartículas de un óxido mixto con tres cationes distribuidos homogéneamente. ¿Qué ruta favorece mejor esa homogeneidad?',opts:['Coprecipitación simultánea','Molienda de los óxidos','Sputtering secuencial','Evaporación del disolvente'],correct:0,exp:'Precipitar todos los cationes a la vez desde una disolución los mezcla a escala molecular antes de que se forme el sólido. Moler óxidos ya formados solo los junta a escala de partícula, y el sputtering secuencial deposita capas separadas.'},
{tag:'M6',q:'Un lote de puntos cuánticos emite con rendimiento bajo. Al recubrirlos con una coraza de mayor gap, el rendimiento sube notablemente. ¿Por qué?',opts:['Disminuye el índice de refracción','Se pasivan trampas superficiales','Aumenta el tamaño del núcleo','Se estrecha la banda prohibida'],correct:1,exp:'Los enlaces incompletos de la superficie crean estados dentro del gap que capturan al excitón y lo relajan sin emitir. La coraza los satura y confina al excitón en el núcleo, de modo que la recombinación radiativa gana peso frente a la no radiativa.'},
{tag:'M6',q:'Se compara una partícula de 2 nm con una de 20 nm del mismo metal. ¿Cuál funde a menor temperatura y por qué?',opts:['Ambas a la misma temperatura','La de 2 nm, por confinamiento cuántico','La de 2 nm, por su fracción superficial','La de 20 nm, por su mayor masa'],correct:2,exp:'Los átomos de superficie tienen menos vecinos y por tanto menos enlaces que romper. Al crecer su proporción baja la energía de cohesión promedio y con ella el punto de fusión, según Gibbs-Thomson. Es un efecto termodinámico, no cuántico.'},
{tag:'M6',q:'En una litografía se cambia la fuente de 248 a 193 nm manteniendo todo lo demás igual. ¿Qué ocurre con la dimensión crítica imprimible?',opts:['Aumenta','No cambia','Se vuelve independiente de λ','Disminuye'],correct:3,exp:'En CD = k₁λ/NA la dimensión crítica es proporcional a la longitud de onda. Bajar de 248 a 193 nm la reduce en la misma proporción, alrededor de un 22 %. Las otras dos palancas son subir NA y bajar k₁.'},
{tag:'M6',q:'Se desea depositar una capa de óxido de espesor controlado al angstrom sobre una estructura con relación de aspecto alta. ¿Qué técnica conviene?',opts:['ALD','Sputtering','Evaporación térmica','Spin coating'],correct:0,exp:'En ALD cada pulso satura la superficie y se detiene solo, de modo que el crecimiento es autolimitado y el espesor se controla contando ciclos. Las otras tres son de línea de vista o dependen de flujo, y no recubren el interior de un poro profundo.'},
{tag:'M6',q:'Un investigador reporta que su suspensión mantiene el mismo tamaño en agua destilada pero se agrega en suero fisiológico. ¿Qué estabilización usó?',opts:['Ninguna en particular','Electrostática','Estérica con PEG','Covalente con silano'],correct:1,exp:'La estabilización electrostática depende del alcance de la doble capa, que la sal comprime. En suero hay unos 150 mM de electrolito y la barrera DLVO se desploma. La estérica con cadenas poliméricas ancladas no depende del apantallamiento y resiste.'},
{tag:'M6',q:'Se observa que un grabado deja paredes inclinadas a 54.7° en una oblea de silicio orientada {100}. ¿Qué proceso se empleó?',opts:['Húmedo con ácido fluorhídrico','Haz de iones focalizado','Húmedo con KOH','Seco por plasma'],correct:2,exp:'El KOH ataca las caras {100} mucho más rápido que las {111}, y el ángulo entre esos planos es precisamente 54.7°. Es anisotropía cristalográfica, no direccional: el plasma daría paredes verticales y el ácido socavaría de forma isotrópica.'},
{tag:'M6',q:'En una síntesis por microemulsión se quiere reducir el tamaño final de partícula. ¿Qué parámetro conviene ajustar?',opts:['La temperatura de secado','La velocidad de centrifugado','El pH del lavado final','El tamaño de la gota acuosa'],correct:3,exp:'En microemulsión la gota actúa como nanorreactor y su tamaño limita el de la partícula que puede crecer dentro. Se ajusta variando la razón entre agua y surfactante. Los parámetros de post-tratamiento no determinan el tamaño ya formado.'},
{tag:'M6',q:'Se dispone de una plantilla maestra fabricada por litografía de haz de electrones, muy cara. Se necesitan mil copias. ¿Qué estrategia es la adecuada?',opts:['Replicar por litografía suave','Repetir el haz de electrones','Grabar cada copia por plasma','Sintetizar cada copia por sol-gel'],correct:0,exp:'La regla es escribir el maestro con la técnica de mayor resolución y replicar con la más barata, por micromoldeado, estampado o litografía suave. Producir en serie con la técnica cara desperdicia su única ventaja, que es la resolución.'},
{tag:'M6',q:'Un material mesoporoso se calcina a temperatura demasiado alta y pierde la mitad de su área superficial. ¿Qué fenómeno ocurrió?',opts:['Adsorción irreversible de nitrógeno','Sinterización y colapso de poros','Oxidación de la superficie','Disolución parcial del material'],correct:1,exp:'A temperatura suficiente los granos empiezan a fusionarse entre sí para reducir energía superficial, las paredes de poro engrosan y la estructura colapsa parcialmente. Es el costo de calcinar, y por eso se busca la temperatura mínima que cristalice sin sinterizar.'},
{tag:'M6',q:'Se mide una suspensión recién sintetizada y un mes después. El número de partículas bajó y el diámetro medio subió, sin racimos en el TEM. ¿Qué pasó?',opts:['Sedimentación por densidad','Disolución completa de las pequeñas','Maduración de Ostwald','Agregación por choque'],correct:2,exp:'Las partículas pequeñas son más solubles por curvatura, así que su material difunde y se redeposita sobre las grandes. El número total cae y los contornos siguen lisos. La agregación habría dejado racimos de partículas con sus contornos visibles.'},
{tag:'M6',q:'Al aumentar bruscamente la sobresaturación en una síntesis coloidal se obtienen muchas partículas muy pequeñas. ¿Cómo se explica?',opts:['Sube el radio crítico','Se inhibe el crecimiento','Aumenta la energía superficial','Baja la barrera de nucleación'],correct:3,exp:'Como r* = 2γ/ΔGv y la barrera va con el inverso del cuadrado de ΔGv, más sobresaturación reduce drásticamente ambos. Se nuclea masivamente, el monómero disponible se reparte entre muchísimos núcleos y el tamaño final resulta pequeño.'},

/* ---------------- M7 · ampliación ---------------- */
{tag:'M7',q:'Se analiza una muestra y se obtiene un difractograma con un solo halo ancho y ningún pico definido. ¿Qué se concluye del material?',opts:['Es amorfo','Tiene cristalitos muy grandes','Está orientado preferentemente','Contiene varias fases cristalinas'],correct:0,exp:'Los picos de difracción nacen de la periodicidad de largo alcance. Sin orden periódico solo queda la dispersión difusa de las distancias promedio entre vecinos, que produce un halo ancho. Cristalitos grandes darían picos muy estrechos.'},
{tag:'M7',q:'Se necesita determinar la composición elemental de partículas de 20 nm sin que el sustrato contamine la señal. ¿Qué configuración conviene?',opts:['DRX de polvo del sedimento','EDS en TEM sobre rejilla fina','EDS en SEM sobre oblea de silicio','XPS sobre el sustrato limpio'],correct:1,exp:'El volumen de interacción en SEM es de micras y la señal del sustrato domina sobre una partícula nanométrica. En TEM la muestra es ultradelgada y el haz atraviesa casi solo la partícula, con una rejilla de carbono que aporta poco.'},
{tag:'M7',q:'Un espectro muestra una banda intensa a 1715 cm⁻¹ que desaparece tras reducir la muestra. ¿Qué grupo funcional había?',opts:['Nitrilo','Amina primaria','Carbonilo','Hidroxilo'],correct:2,exp:'La tensión del enlace carbono-oxígeno doble aparece entre 1700 y 1750 cm⁻¹ y es de las bandas más intensas del infrarrojo por el fuerte cambio de momento dipolar. Reducir el carbonilo a alcohol la elimina y hace aparecer la banda ancha del hidroxilo.'},
{tag:'M7',q:'Se compara la profundidad de análisis de XPS y de EDS sobre la misma muestra. ¿Cuál es la diferencia de orden de magnitud?',opts:['Micras frente a nanómetros','Ambas de nanómetros','Ambas de micras','Nanómetros frente a micras'],correct:3,exp:'En XPS la profundidad la fija el recorrido libre medio de los fotoelectrones, de unos pocos nanómetros. En EDS los rayos X escapan desde todo el volumen de interacción del haz, de uno o varios micrómetros. Por eso XPS es la técnica de superficie y EDS la de volumen.'},
{tag:'M7',q:'Un pico de difracción se ensancha y se quiere saber si se debe al tamaño de cristalito o a microdeformación. ¿Qué análisis lo separa?',opts:['Williamson-Hall','Scherrer con un solo pico','Rietveld de intensidades','Ley de Bragg aplicada dos veces'],correct:0,exp:'Las dos contribuciones dependen distinto del ángulo: la de tamaño va con 1/cos θ y la de deformación con tan θ. Williamson-Hall aprovecha esa diferencia midiendo varios picos. Scherrer sobre un solo pico atribuye todo el ensanchamiento al tamaño.'},
{tag:'M7',q:'Se mide una muestra por DLS y el índice de polidispersidad sale 0.85. ¿Cómo se interpreta ese resultado?',opts:['La suspensión es estable','El dato no es interpretable','La muestra es muy monodispersa','Las partículas miden 0.85 nm'],correct:1,exp:'Por debajo de 0.1 se considera muy monodispersa y por encima de 0.7 el modelo de cumulantes deja de ser válido, así que el número no describe la distribución real. Suele indicar agregación, polvo en la celda o una muestra genuinamente multimodal.'},
