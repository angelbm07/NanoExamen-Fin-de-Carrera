{tag:'M5',q:'Se añade un catalizador a una reacción exotérmica en equilibrio y se mide la composición final. ¿Qué cambio se observa respecto al caso sin catalizador?',opts:['Ninguno en la composición','Más producto en el equilibrio','Menos producto en el equilibrio','Depende del tipo de catalizador'],correct:0,exp:'El catalizador no altera la energía de reactivos ni de productos, así que ΔG° y K quedan intactos. Baja la barrera por igual en ambos sentidos y solo acorta el tiempo hasta llegar al mismo punto.'},
{tag:'M5',q:'Una disolución de glucosa 0.20 m y otra de NaCl 0.10 m se comparan por su descenso crioscópico. ¿Cuál baja más el punto de congelación?',opts:['Depende del disolvente','Las dos por igual','La de glucosa','La de NaCl'],correct:1,exp:'Lo que cuenta es el número de partículas: la glucosa da 0.20 m efectivos con i = 1, y el NaCl da 0.20 m efectivos con i ≈ 2 sobre 0.10 m. Las dos llegan a la misma molalidad de partículas y producen el mismo descenso.'},
{tag:'M5',q:'Se calienta una reacción endotérmica en equilibrio y se vuelve a medir la constante. ¿Cómo cambia respecto al valor original?',opts:['No cambia','Se vuelve negativa','Aumenta','Disminuye'],correct:2,exp:'En una endotérmica el calor actúa como reactivo, así que aportar más desplaza hacia productos y K sube. La temperatura es la única perturbación que modifica el valor numérico de K, a través de ΔG° = −RT ln K.'},
{tag:'M5',q:'Un estudiante calcula Ea con temperaturas en grados Celsius y obtiene un valor negativo. ¿Cuál es el error más probable?',opts:['Invirtió las constantes de velocidad','Usó logaritmo decimal','Olvidó el factor preexponencial','No usó kelvin'],correct:3,exp:'La ecuación de Arrhenius exige temperatura absoluta porque aparece como 1/T, y una escala con cero arbitrario rompe la relación. Con Celsius el término 1/T₂ − 1/T₁ cambia de magnitud e incluso de signo, lo que produce energías de activación negativas sin sentido físico.'},
{tag:'M5',q:'Se adsorbe nitrógeno sobre un material poroso a 77 K y la isoterma no satura al acercarse a la presión de saturación. ¿Qué modelo aplica?',opts:['BET','Langmuir','Henry','Freundlich de monocapa'],correct:0,exp:'Langmuir supone monocapa sobre sitios equivalentes y por eso satura en un máximo. Que la isoterma siga creciendo indica que se forman capas sucesivas, que es justo lo que describe BET, y del ajuste se extrae la capacidad de monocapa para calcular el área.'},
{tag:'M5',q:'Comparas el potencial zeta de dos suspensiones del mismo material: una da −38 mV y la otra −6 mV. ¿Qué esperas de su estabilidad coloidal a largo plazo?',opts:['Ninguna es estable','La de −38 mV es más estable','La de −6 mV es más estable','Ambas igual de estables'],correct:1,exp:'El criterio práctico sitúa la estabilidad razonable más allá de ±30 mV, porque implica repulsión suficiente para levantar la barrera DLVO por encima de la energía térmica. Cerca de cero la coagulación es rápida, y el punto isoeléctrico es el peor lugar para trabajar.'},
{tag:'M5',q:'Una gota de agua forma un ángulo de contacto de 150° sobre una superficie texturizada. ¿Qué modelo describe mejor la situación?',opts:['Young en superficie lisa','Laplace de curvatura','Cassie-Baxter','Wenzel'],correct:2,exp:'Ángulos por encima de 150° requieren que el líquido no penetre la textura sino que repose sobre bolsas de aire atrapado, que es el régimen de Cassie-Baxter. Wenzel describe el líquido que sí penetra y amplifica el carácter de la superficie plana.'},
{tag:'M5',q:'Un proceso tiene ΔH negativo y ΔS negativo. Se quiere saber a qué temperaturas ocurre de forma espontánea. ¿Cuál es la respuesta?',opts:['Solo por encima de ΔH/ΔS','A cualquier temperatura','A ninguna temperatura','Solo por debajo de ΔH/ΔS'],correct:3,exp:'Con ambos negativos, la entalpía favorece y la entropía se opone, y el término entrópico va multiplicado por T. A temperatura baja domina ΔH y el proceso ocurre; al subir T el término TΔS acaba imponiéndose. El cruce está en T = ΔH/ΔS.'},
{tag:'M5',q:'Se observa que la vida media de una reacción no cambia al reducir a la mitad la concentración inicial del reactivo. ¿Qué orden tiene?',opts:['Primero','Cero','Segundo','Tercero'],correct:0,exp:'Solo en primer orden la vida media es independiente de la concentración inicial, porque t½ = ln2/k. En orden cero t½ es proporcional a [A]₀ y en segundo orden es inversamente proporcional. Es la prueba diagnóstica más rápida.'},
{tag:'M5',q:'Un líquido puro se calienta en un recipiente abierto en la montaña, donde la presión atmosférica es menor. ¿Qué le ocurre al punto de ebullición?',opts:['Depende del recipiente','Baja','Sube','No cambia'],correct:1,exp:'Un líquido hierve cuando su presión de vapor iguala a la presión externa. Si la externa es menor, ese equilibrio se alcanza a temperatura más baja. La presión de vapor del líquido en sí depende solo de la temperatura, no de la presión atmosférica.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M6 · ampliación ---------------- */
{tag:'M6',q:'Se sintetizan nanopartículas esféricas de 10 nm y se quiere estimar su área específica. El material tiene densidad 5.0 g/cm³. ¿Qué expresión se usa?',opts:['S = 4πr²','S = ρ/(6d)','S = 6/(ρ·d)','S = 6·ρ·d'],correct:2,exp:'Para una esfera, área entre masa da 4πr²/(ρ·(4/3)πr³) = 3/(ρr) = 6/(ρd). Con d = 10 nm y ρ = 5.0 g/cm³ salen unos 120 m²/g. La expresión 4πr² es el área de una sola partícula, no el área específica.'},
{tag:'M6',q:'Durante una reacción sol-gel se observa que se expulsa agua al unirse dos grupos. ¿Qué etapa del proceso se está observando?',opts:['Hidrólisis','Calcinación','Peptización','Condensación'],correct:3,exp:'La hidrólisis consume agua para convertir alcóxidos en hidroxilos; la condensación une dos hidroxilos liberando agua y formando el puente metal-oxígeno-metal que construye la red. La calcinación es el tratamiento térmico posterior.'},
{tag:'M6',q:'Se quieren obtener nanopartículas de un óxido mixto con tres cationes distribuidos homogéneamente. ¿Qué ruta favorece mejor esa homogeneidad?',opts:['Coprecipitación simultánea','Molienda de los óxidos','Sputtering secuencial','Evaporación del disolvente'],correct:0,exp:'Precipitar todos los cationes a la vez desde una disolución los mezcla a escala molecular antes de que se forme el sólido. Moler óxidos ya formados solo los junta a escala de partícula, y el sputtering secuencial deposita capas separadas.'},
{tag:'M6',q:'Un lote de puntos cuánticos emite con rendimiento bajo. Al recubrirlos con una coraza de mayor gap, el rendimiento sube notablemente. ¿Por qué?',opts:['Disminuye el índice de refracción','Se pasivan trampas superficiales','Aumenta el tamaño del núcleo','Se estrecha la banda prohibida'],correct:1,exp:'Los enlaces incompletos de la superficie crean estados dentro del gap que capturan al excitón y lo relajan sin emitir. La coraza los satura y confina al excitón en el núcleo, de modo que la recombinación radiativa gana peso frente a la no radiativa.'},
{tag:'M6',q:'Comparas una nanopartícula de 2 nm con otra de 20 nm del mismo metal puro y mides su punto de fusión. ¿Cuál funde a menor temperatura y por qué razón?',opts:['Ambas a la misma temperatura','La de 2 nm, por confinamiento cuántico','La de 2 nm, por su fracción superficial','La de 20 nm, por su mayor masa'],correct:2,exp:'Los átomos de superficie tienen menos vecinos y por tanto menos enlaces que romper. Al crecer su proporción baja la energía de cohesión promedio y con ella el punto de fusión, según Gibbs-Thomson. Es un efecto termodinámico, no cuántico.'},
{tag:'M6',q:'En una litografía se cambia la fuente de 248 a 193 nm manteniendo todo lo demás igual. ¿Qué ocurre con la dimensión crítica imprimible?',opts:['Aumenta','No cambia','Se vuelve independiente de λ','Disminuye'],correct:3,exp:'En CD = k₁λ/NA la dimensión crítica es proporcional a la longitud de onda. Bajar de 248 a 193 nm la reduce en la misma proporción, alrededor de un 22 %. Las otras dos palancas son subir NA y bajar k₁.'},
{tag:'M6',q:'Se desea depositar una capa de óxido de espesor controlado al angstrom sobre una estructura con relación de aspecto alta. ¿Qué técnica conviene?',opts:['ALD','Sputtering','Evaporación térmica','Spin coating'],correct:0,exp:'En ALD cada pulso satura la superficie y se detiene solo, de modo que el crecimiento es autolimitado y el espesor se controla contando ciclos. Las otras tres son de línea de vista o dependen de flujo, y no recubren el interior de un poro profundo.'},
{tag:'M6',q:'Un investigador reporta que su suspensión mantiene el mismo tamaño en agua destilada pero se agrega en suero fisiológico. ¿Qué estabilización usó?',opts:['Ninguna en particular','Electrostática','Estérica con PEG','Covalente con silano'],correct:1,exp:'La estabilización electrostática depende del alcance de la doble capa, que la sal comprime. En suero hay unos 150 mM de electrolito y la barrera DLVO se desploma. La estérica con cadenas poliméricas ancladas no depende del apantallamiento y resiste.'},
{tag:'M6',q:'Se observa que un grabado deja paredes inclinadas a 54.7° en una oblea de silicio orientada {100}. ¿Qué proceso se empleó?',opts:['Húmedo con ácido fluorhídrico','Haz de iones focalizado','Húmedo con KOH','Seco por plasma'],correct:2,exp:'El KOH ataca las caras {100} mucho más rápido que las {111}, y el ángulo entre esos planos es precisamente 54.7°. Es anisotropía cristalográfica, no direccional: el plasma daría paredes verticales y el ácido socavaría de forma isotrópica.'},
{tag:'M6',q:'En una síntesis por microemulsión inversa quieres reducir el tamaño final de las partículas sin cambiar de precursor. ¿Qué parámetro conviene ajustar?',opts:['La temperatura de secado','La velocidad de centrifugado','El pH del lavado final','El tamaño de la gota acuosa'],correct:3,exp:'En microemulsión la gota actúa como nanorreactor y su tamaño limita el de la partícula que puede crecer dentro. Se ajusta variando la razón entre agua y surfactante. Los parámetros de post-tratamiento no determinan el tamaño ya formado.'},
{tag:'M6',q:'Se dispone de una plantilla maestra fabricada por litografía de haz de electrones, muy cara. Se necesitan mil copias. ¿Qué estrategia es la adecuada?',opts:['Replicar por litografía suave','Repetir el haz de electrones','Grabar cada copia por plasma','Sintetizar cada copia por sol-gel'],correct:0,exp:'La regla es escribir el maestro con la técnica de mayor resolución y replicar con la más barata, por micromoldeado, estampado o litografía suave. Producir en serie con la técnica cara desperdicia su única ventaja, que es la resolución.'},
{tag:'M6',q:'Un material mesoporoso se calcina a temperatura demasiado alta y pierde la mitad de su área superficial. ¿Qué fenómeno ocurrió?',opts:['Adsorción irreversible de nitrógeno','Sinterización y colapso de poros','Oxidación de la superficie','Disolución parcial del material'],correct:1,exp:'A temperatura suficiente los granos empiezan a fusionarse entre sí para reducir energía superficial, las paredes de poro engrosan y la estructura colapsa parcialmente. Es el costo de calcinar, y por eso se busca la temperatura mínima que cristalice sin sinterizar.'},
{tag:'M6',q:'Se mide una suspensión recién sintetizada y un mes después. El número de partículas bajó y el diámetro medio subió, sin racimos en el TEM. ¿Qué pasó?',opts:['Sedimentación por densidad','Disolución completa de las pequeñas','Maduración de Ostwald','Agregación por choque'],correct:2,exp:'Las partículas pequeñas son más solubles por curvatura, así que su material difunde y se redeposita sobre las grandes. El número total cae y los contornos siguen lisos. La agregación habría dejado racimos de partículas con sus contornos visibles.'},
{tag:'M6',q:'Al aumentar bruscamente la sobresaturación en una síntesis coloidal se obtienen muchas partículas muy pequeñas. ¿Cómo se explica?',opts:['Sube el radio crítico','Se inhibe el crecimiento','Aumenta la energía superficial','Baja la barrera de nucleación'],correct:3,exp:'Como r* = 2γ/ΔGv y la barrera va con el inverso del cuadrado de ΔGv, más sobresaturación reduce drásticamente ambos. Se nuclea masivamente, el monómero disponible se reparte entre muchísimos núcleos y el tamaño final resulta pequeño.'},

/* ---------------- M7 · ampliación ---------------- */
{tag:'M7',q:'Analizas una muestra por difracción de rayos X y el difractograma presenta un único halo ancho, sin ningún pico definido. ¿Qué concluyes sobre el material?',opts:['Es amorfo o vítreo','Cristalitos muy grandes','Orientación preferente','Varias fases cristalinas'],correct:0,exp:'Los picos de difracción nacen de la periodicidad de largo alcance. Sin orden periódico solo queda la dispersión difusa de las distancias promedio entre vecinos, que produce un halo ancho. Cristalitos grandes darían picos muy estrechos.'},
{tag:'M7',q:'Se necesita determinar la composición elemental de partículas de 20 nm sin que el sustrato contamine la señal. ¿Qué configuración conviene?',opts:['DRX de polvo del sedimento','EDS en TEM sobre rejilla fina','EDS en SEM sobre oblea de silicio','XPS sobre el sustrato limpio'],correct:1,exp:'El volumen de interacción en SEM es de micras y la señal del sustrato domina sobre una partícula nanométrica. En TEM la muestra es ultradelgada y el haz atraviesa casi solo la partícula, con una rejilla de carbono que aporta poco.'},
{tag:'M7',q:'Un espectro muestra una banda intensa a 1715 cm⁻¹ que desaparece tras reducir la muestra. ¿Qué grupo funcional había?',opts:['Nitrilo','Amina primaria','Carbonilo','Hidroxilo'],correct:2,exp:'La tensión del enlace carbono-oxígeno doble aparece entre 1700 y 1750 cm⁻¹ y es de las bandas más intensas del infrarrojo por el fuerte cambio de momento dipolar. Reducir el carbonilo a alcohol la elimina y hace aparecer la banda ancha del hidroxilo.'},
{tag:'M7',q:'Se compara la profundidad de análisis de XPS y de EDS sobre la misma muestra. ¿Cuál es la diferencia de orden de magnitud?',opts:['Micras frente a nanómetros','Ambas de nanómetros','Ambas de micras','Nanómetros frente a micras'],correct:3,exp:'En XPS la profundidad la fija el recorrido libre medio de los fotoelectrones, de unos pocos nanómetros. En EDS los rayos X escapan desde todo el volumen de interacción del haz, de uno o varios micrómetros. Por eso XPS es la técnica de superficie y EDS la de volumen.'},
{tag:'M7',q:'Un pico de difracción se ensancha y se quiere saber si se debe al tamaño de cristalito o a microdeformación. ¿Qué análisis lo separa?',opts:['Williamson-Hall','Scherrer con un solo pico','Rietveld de intensidades','Ley de Bragg aplicada dos veces'],correct:0,exp:'Las dos contribuciones dependen distinto del ángulo: la de tamaño va con 1/cos θ y la de deformación con tan θ. Williamson-Hall aprovecha esa diferencia midiendo varios picos. Scherrer sobre un solo pico atribuye todo el ensanchamiento al tamaño.'},
{tag:'M7',q:'Mides una suspensión por dispersión dinámica de luz y el índice de polidispersidad que reporta el equipo sale 0.85. ¿Cómo interpretas ese resultado?',opts:['La suspensión es estable','El dato no es interpretable','La muestra es muy monodispersa','Las partículas miden 0.85 nm'],correct:1,exp:'Por debajo de 0.1 se considera muy monodispersa y por encima de 0.7 el modelo de cumulantes deja de ser válido, así que el número no describe la distribución real. Suele indicar agregación, polvo en la celda o una muestra genuinamente multimodal.'},
{tag:'M7',q:'Una termogravimetría en nitrógeno de un polímero muestra residuo del 30 % a 800 °C. Repetida en aire, el residuo baja a 2 %. ¿Qué explica la diferencia?',opts:['El aire aumenta la masa molar','El nitrógeno reacciona con el polímero','En aire el carbón se oxida','En nitrógeno el material se funde'],correct:2,exp:'En atmósfera inerte la parte orgánica se pirolisa y deja residuo carbonoso. En aire ese carbón se oxida a dióxido de carbono y desaparece, quedando solo la carga inorgánica si la hay. Elegir mal la atmósfera cambia por completo la lectura del ensayo.'},
{tag:'M7',q:'Quieres observar la estructura interna de una nanopartícula hueca y confirmar el espesor de su pared. ¿Qué técnica te lo permite de forma directa?',opts:['SEM de secundarios','AFM en modo contacto','Perfilometría óptica','TEM en campo claro'],correct:3,exp:'Solo la transmisión del haz a través de una muestra delgada revela lo que hay dentro, con el contraste de masa y espesor distinguiendo pared de hueco. SEM y AFM solo informan de la superficie externa.'},
{tag:'M7',q:'Encuentras un modo vibracional que resulta activo en Raman pero completamente inactivo en infrarrojo. ¿Qué puedes afirmar de la simetría de esa molécula?',opts:['Tiene centro de simetría','Es necesariamente polar','Tiene geometría angular','Contiene enlaces de hidrógeno'],correct:0,exp:'La regla de exclusión mutua dice que en moléculas centrosimétricas ningún modo puede ser activo en ambas técnicas. La tensión simétrica del CO₂ es el ejemplo canónico: visible en Raman por el cambio de polarizabilidad e invisible en IR porque el dipolo no cambia.'},
{tag:'M7',q:'Se compara el contraste de dos zonas en una imagen de electrones retrodispersados: una brilla más que la otra. ¿Qué se infiere?',opts:['Tiene mayor rugosidad superficial','Contiene elementos más pesados','Está a mayor altura sobre el plano','Es más conductora que el entorno'],correct:1,exp:'La probabilidad de retrodispersión elástica crece con el número atómico, así que las zonas ricas en elementos pesados devuelven más electrones y aparecen brillantes. La topografía y la altura las resuelven mejor los electrones secundarios.'},
{tag:'M7',q:'Se necesita cuantificar diez metales traza en un digerido acuoso con límites de partes por billón. ¿Qué técnica cumple el requisito?',opts:['FTIR-ATR','DRX de polvo','ICP-MS','AAS de llama'],correct:2,exp:'El plasma ioniza todos los elementos a la vez y la espectrometría de masas alcanza partes por billón. La AAS de llama es monoelemental y queda en partes por millón. FTIR y DRX no sirven para cuantificar metales en disolución.'},
{tag:'M7',q:'Una imagen de AFM muestra todos los objetos del campo con la misma forma doble repetida, como si cada uno estuviera duplicado. ¿Qué artefacto sospechas?',opts:['Muestra mal fijada','Velocidad de barrido baja','Humedad ambiental alta','Punta rota o contaminada'],correct:3,exp:'Si la punta tiene dos extremos, cada objeto real se registra dos veces desplazado, y el patrón se repite idéntico en toda la imagen. La firma del artefacto es justamente esa repetición: los objetos reales no comparten una forma exacta.'},
{tag:'M7',q:'Se compara la señal SERS de dos zonas de un mismo sustrato y varía por un factor de cinco. ¿Cuál es la causa más probable?',opts:['Distinta densidad de puntos calientes','Degradación del láser','Error de calibración del detector','Cambio de temperatura ambiente'],correct:0,exp:'El refuerzo escala con la cuarta potencia del campo local, así que una fracción diminuta de posiciones aporta casi toda la señal. Si esa densidad varía espacialmente, la intensidad también. Es el problema central de la reproducibilidad cuantitativa en SERS.'},
{tag:'M7',q:'Se dispone de una muestra biológica hidratada y se necesita su topografía sin deshidratarla ni metalizarla. ¿Qué técnica lo permite?',opts:['DRX en polvo','AFM en líquido','SEM convencional','TEM de transmisión'],correct:1,exp:'El AFM mide fuerzas con una punta y funciona en aire y en líquido sin vacío ni recubrimiento conductor, lo que preserva la muestra viva o hidratada. SEM y TEM exigen vacío y preparación que la alterarían.'},
{tag:'M7',q:'Se mide una partícula por tres métodos y salen 18 nm, 22 nm y 45 nm. Los tres informes son correctos. ¿Qué técnicas fueron?',opts:['TEM, XPS y EDS','DRX, AFM y TGA','Scherrer, TEM y DLS','Scherrer, SEM y BET'],correct:2,exp:'Scherrer da el dominio cristalino coherente, el menor de los tres; TEM da el núcleo sólido proyectado; DLS da el diámetro hidrodinámico con recubrimiento y solvatación, siempre el mayor. Son tres magnitudes distintas, no tres intentos de medir la misma.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M8 · ampliación ---------------- */
{tag:'M8',q:'Se duplica la longitud de un microcanal manteniendo el radio y la presión aplicada. ¿Qué le ocurre al caudal que circula por él?',opts:['Se reduce a la cuarta parte','No cambia','Se duplica','Se reduce a la mitad'],correct:3,exp:'En Hagen-Poiseuille el caudal es inversamente proporcional a la longitud, así que duplicarla lo divide entre dos. La dependencia fuerte está en el radio, que entra a la cuarta potencia.'},
{tag:'M8',q:'Un diseñador quiere mezclar dos reactivos en un chip pero el canal opera con Reynolds de 0.3. ¿Qué solución es viable?',opts:['Canales con surcos que plieguen','Aumentar el diámetro del canal','Subir la temperatura del fluido','Añadir un agitador magnético'],correct:0,exp:'Con Reynolds tan bajo no hay turbulencia y la mezcla solo ocurre por difusión lateral. La solución estándar es forzar el plegamiento de las corrientes con geometría, lo que multiplica el área de contacto y acorta la distancia de difusión.'},
{tag:'M8',q:'Se compara la frecuencia de resonancia de dos micropalancas idénticas salvo por su longitud: una mide el doble que la otra. ¿Cuál resuena más alto?',opts:['Depende del material','La corta','La larga','Ambas igual'],correct:1,exp:'La frecuencia de resonancia escala inversamente con la longitud, así que acortar la estructura la sube. Es la razón de que los resonadores nanométricos alcancen gigahertz y sirvan como balanzas de masa extraordinariamente sensibles.'},
{tag:'M8',q:'Un sensor gravimétrico registra que su frecuencia subió tras un ciclo de medición. ¿Qué ocurrió en la superficie del resonador?',opts:['Aumentó la humedad','Se depositó una capa aislante','Se desorbió material','Se adsorbió más analito'],correct:2,exp:'De Δf/f₀ ≈ −Δm/(2m), ganar masa baja la frecuencia y perderla la sube. Un aumento indica que algo se desprendió, por ejemplo tras un lavado o una desorción térmica.'},
{tag:'M8',q:'Se ilumina una interfaz vidrio-agua por encima del ángulo crítico. ¿Qué ocurre con la luz del otro lado de la interfaz?',opts:['Se transmite con refracción normal','Se absorbe por completo','Cambia de frecuencia','Queda una onda evanescente'],correct:3,exp:'Por encima del ángulo crítico hay reflexión total interna, pero el campo no se corta bruscamente: penetra como onda evanescente que decae exponencialmente en 100 a 200 nm. Esa penetración limitada es lo que da selectividad de superficie a los sensores.'},
{tag:'M8',q:'Se observa que un metal refleja la luz visible pero se vuelve transparente en el ultravioleta lejano. ¿Qué parámetro marca esa transición?',opts:['La frecuencia de plasma','El ángulo de Brewster','El índice de refracción del aire','La energía de Fermi'],correct:0,exp:'Por debajo de la frecuencia de plasma la parte real de la función dieléctrica es negativa y el metal refleja. Por encima, los electrones ya no responden lo bastante rápido al campo y el material deja pasar la radiación.'},
{tag:'M8',q:'Se fabrica un acelerómetro y se quiere mayor robustez frente a golpes sin perder ancho de banda. ¿Qué conviene hacer con los resortes?',opts:['Sustituirlos por amortiguadores','Hacerlos más rígidos','Hacerlos más blandos','Alargarlos manteniendo la sección'],correct:1,exp:'Mayor rigidez sube ω = √(k/m), lo que amplía el ancho de banda y reduce el desplazamiento ante un impacto. El costo es menos señal por unidad de aceleración, ya que x = ma/k. Sensibilidad y ancho de banda tiran en direcciones opuestas.'},
{tag:'M8',q:'Tras liberar una micropalanca con un proceso húmedo, queda pegada al sustrato. ¿Qué paso del proceso habría evitado el problema?',opts:['Recocido a alta temperatura','Aumento del tiempo de grabado','Secado supercrítico','Enjuague con más agua'],correct:2,exp:'Al evaporarse el líquido, la tensión superficial del menisco arrastra la estructura contra el sustrato. El secado supercrítico lleva el fluido más allá del punto crítico, donde no existe interfaz líquido-vapor y por tanto no hay menisco que tire.'},
{tag:'M8',q:'En voltamperometría cíclica se mide una separación de picos de 59 mV para un proceso de un electrón. ¿Qué indica ese valor?',opts:['Proceso irreversible','Especie adsorbida','Resistencia óhmica alta','Proceso reversible'],correct:3,exp:'Para un sistema reversible y controlado por difusión la separación teórica es 59/n milivoltios a temperatura ambiente. Separaciones mayores indican cinética lenta de transferencia o caída óhmica no compensada.'},
{tag:'M8',q:'Un biosensor enzimático pierde linealidad al subir la concentración de analito por encima de cierto valor. ¿Con qué parámetro coincide ese límite?',opts:['Con el Km de la enzima','Con el potencial formal','Con el área del electrodo','Con el coeficiente de difusión'],correct:0,exp:'Mientras la concentración está muy por debajo de Km la velocidad crece proporcionalmente. Al acercarse a Km la enzima empieza a saturarse y la respuesta se aplana, que es justo donde termina el rango lineal útil del sensor.'},
{tag:'M8',q:'Se compara una celda solar de unión simple con otra de tres uniones de distinto gap. ¿Por qué la segunda supera el límite teórico de la primera?',opts:['Opera a mayor temperatura','Reparte el espectro solar','Absorbe más intensidad total','Tiene menor resistencia interna'],correct:1,exp:'El límite de Shockley-Queisser nace del compromiso de un solo gap: los fotones de menos energía no se absorben y el exceso de los más energéticos se pierde como calor. Varias uniones con gaps escalonados recogen cada franja con el gap adecuado.'},
{tag:'M8',q:'Se aplica un campo eléctrico no uniforme y una partícula eléctricamente neutra se desplaza hacia la región de campo intenso. ¿Qué fenómeno es?',opts:['Electroósmosis','Difusión térmica','Dielectroforesis','Electroforesis'],correct:2,exp:'La dielectroforesis actúa sobre el dipolo inducido en la partícula y por eso no requiere carga neta, solo un gradiente de campo. La electroforesis sí exige carga, y la electroósmosis mueve el fluido entero, no la partícula.'},
{tag:'M8',q:'Quieres amplificar por SERS la señal Raman de una molécula adsorbida, ganando varios órdenes de magnitud. ¿Qué tipo de sustrato conviene preparar?',opts:['Una película metálica lisa','Un portaobjetos pulido','Un polímero transparente','Nanoestructuras con huecos'],correct:3,exp:'La amplificación nace del refuerzo del campo local en la resonancia plasmónica, y es máxima en nanocavidades entre partículas casi en contacto o en puntas afiladas. Una película lisa no concentra el campo y un sustrato dieléctrico no tiene plasmones.'},
{tag:'M8',q:'Se mide una corriente de pico que crece proporcionalmente a la raíz de la velocidad de barrido. ¿Qué régimen gobierna el proceso?',opts:['Difusión desde la disolución','Adsorción en el electrodo','Migración por campo eléctrico','Convección forzada'],correct:0,exp:'Randles-Ševčík predice esa dependencia cuando la especie llega difundiendo desde el seno de la disolución. Si la corriente creciera proporcional a la velocidad de barrido sin raíz, indicaría que la especie ya está en la superficie.'},

/* ---------------- M9 · ampliación ---------------- */
{tag:'M9',q:'Se invierten 100 000 pesos a una tasa compuesta del 8 % anual durante tres años. ¿Qué expresión da el valor futuro?',opts:['100000·0.08·3','100000·(1.08)³','100000·(1+0.08·3)','100000/(1.08)³'],correct:1,exp:'El interés compuesto capitaliza sobre el saldo acumulado, así que el factor es (1+i)ⁿ. La segunda opción corresponde al interés simple, que solo paga sobre el capital inicial, y la tercera descuenta en vez de capitalizar.'},
{tag:'M9',q:'Un equipo costó 2 millones cuando el índice de costos valía 400. Hoy el índice vale 600 y se quiere estimar su costo actual. ¿Cuánto es?',opts:['2.4 millones','5 millones','3 millones','1.33 millones'],correct:2,exp:'El costo se actualiza multiplicando por la razón de índices: 2 × (600/400) = 3 millones. Los índices de costos, como el CEPCI, existen precisamente para trasladar costos históricos a condiciones actuales sin volver a cotizar.'},
{tag:'M9',q:'Se evalúa un proyecto y resulta un valor presente neto negativo con la tasa de descuento de la empresa. ¿Qué decisión corresponde?',opts:['Aceptarlo si la TIR es positiva','Aceptarlo si el payback es corto','Repetir el cálculo sin descontar','Rechazarlo con ese costo de capital'],correct:3,exp:'Un VPN negativo significa que el proyecto no cubre el costo de oportunidad del capital al que se descontó. Que la TIR sea positiva no basta: debe superar la tasa de descuento, y el periodo de recuperación ignora el valor del dinero en el tiempo.'},
{tag:'M9',q:'Se escala un equipo aumentando su capacidad seis veces y se usa la regla del exponente 0.6. ¿Qué ocurre con el costo?',opts:['Crece menos que la capacidad','Crece proporcionalmente','Crece más que la capacidad','Se mantiene constante'],correct:0,exp:'Con la regla de los seis décimos el costo escala como la capacidad elevada a 0.6, es decir 6^0.6 ≈ 2.9 veces frente a seis veces la capacidad. Esa es la economía de escala: el costo unitario baja al crecer el tamaño del equipo.'},
{tag:'M9',q:'Un proceso continuo y uno por lotes producen lo mismo al año. ¿Qué ventaja característica tiene el continuo en calidad de producto?',opts:['Arranque y paro más rápidos','Menor variabilidad entre unidades','Mayor flexibilidad de productos','Menor inversión inicial'],correct:1,exp:'Al operar en estado estacionario, todo el material atraviesa las mismas condiciones y la variabilidad lote a lote desaparece. Las otras tres son precisamente las ventajas del proceso por lotes, que es flexible y barato de instalar.'},
{tag:'M9',q:'Se realiza un diseño factorial de dos factores a dos niveles con tres réplicas. ¿Cuántas corridas experimentales exige?',opts:['6','8','12','4'],correct:2,exp:'Un diseño 2² tiene cuatro combinaciones, y tres réplicas de cada una dan doce corridas. Las réplicas no son opcionales: sin ellas no hay forma de estimar el error experimental contra el cual juzgar si un efecto es real.'},
{tag:'M9',q:'Se mide una longitud con 2 % de incertidumbre y una masa con 1 %. Se calcula la densidad lineal como masa entre longitud. ¿Cuál es la incertidumbre?',opts:['3 %','1.5 %','1 %','2.2 %'],correct:3,exp:'En cocientes las incertidumbres relativas se combinan en cuadratura: √(2² + 1²) = √5 = 2.24 %. Sumarlas directamente daría 3 %, que sobrestima, porque los errores independientes se compensan parcialmente.'},
{tag:'M9',q:'Un balance en estado estacionario sobre un separador sin reacción arroja que entran 100 kg/h y salen 95 kg/h. ¿Qué se concluye?',opts:['Falta una corriente por medir','El sistema acumula 5 kg/h','Hubo reacción química','El balance está correcto'],correct:0,exp:'En estado estacionario y sin reacción, entrada igual a salida. Un desbalance indica que falta una corriente, hay una fuga o la medición está mal. Acumular contradiría el supuesto de estado estacionario que se declaró.'},
{tag:'M9',q:'Se compara la conversión alcanzada por un CSTR y un PFR del mismo volumen para una reacción de primer orden. ¿Cuál convierte más?',opts:['Depende solo de la temperatura','El PFR','El CSTR','Ambos igual'],correct:1,exp:'El CSTR opera en todo su volumen a la concentración de salida, la más baja, y por tanto a la velocidad más lenta. El PFR mantiene un gradiente y aprovecha concentraciones altas a la entrada, así que rinde más con el mismo volumen.'},
{tag:'M9',q:'Una tecnología se ha validado en laboratorio pero nunca en entorno relevante. ¿En qué nivel de madurez tecnológica se encuentra?',opts:['TRL 2','TRL 9','TRL 4','TRL 7'],correct:2,exp:'El TRL 4 corresponde a validación de componentes en laboratorio. El 7 exige demostración en entorno operativo y el 9 un sistema probado en operación real. El tramo del 4 al 6 es el llamado valle de la muerte.'},
{tag:'M9',q:'Se desea que una deriva lenta en la temperatura del laboratorio no se confunda con el efecto del factor estudiado. ¿Qué técnica lo evita?',opts:['Aumentar el número de réplicas','Usar un diseño fraccionado','Fijar el factor en su nivel medio','Aleatorizar el orden de corridas'],correct:3,exp:'Si las corridas siguen un orden sistemático, cualquier cambio gradual en el tiempo queda correlacionado con el factor que varía en ese mismo orden. Aleatorizar rompe esa correlación y convierte el sesgo potencial en ruido, que sí es tratable.'},
{tag:'M9',q:'Un reactor opera con recirculación y la alimentación fresca contiene un 2 % de inertes. ¿Qué elemento del diseño resulta indispensable?',opts:['Una corriente de purga','Un segundo reactor en serie','Un intercambiador adicional','Un catalizador más activo'],correct:0,exp:'Los inertes entran y no se consumen ni salen con el producto, así que si todo se recircula su concentración crece sin límite hasta arruinar el desempeño. La purga sacrifica algo de reactivo valioso a cambio de acotarlos.'},
{tag:'M9',q:'Se quiere traducir una correlación de transferencia de calor a un problema de transferencia de masa. ¿Qué sustitución de números adimensionales aplica?',opts:['Nu por Sh y Pr por Sc','Re por Nu y Sc por Pr','Nu por Re y Pr por Sh','Sh por Re y Sc por Nu'],correct:0,exp:'La analogía calor-masa se sostiene porque las ecuaciones de transporte tienen la misma forma. Nusselt y Sherwood juegan el mismo papel, igual que Prandtl y Schmidt. Reynolds aparece en ambos problemas sin cambio.'},
{tag:'M9',q:'Al escalar una reacción exotérmica se decide conservar la razón entre área de intercambio y volumen. ¿Qué implica geométricamente?',opts:['Cambiar la forma del reactor','Mantener el mismo diseño ampliado','Reducir el tiempo de residencia','Aumentar la velocidad del agitador'],correct:0,exp:'Una ampliación geométricamente similar divide la razón área-volumen por el factor de escala. Conservarla obliga a cambiar la forma, por ejemplo alargando el reactor, añadiendo serpentines internos o pasando a un reactor tubular.'}
);
</script>
<script>
QUIZ.push(
/* ---------------- M10 · ampliación ---------------- */
{tag:'M10',q:'Se formula una crema y a los dos meses aparece una capa de aceite arriba que no se reincorpora al agitar. ¿Qué mecanismo actuó?',opts:['Coalescencia','Cremado','Floculación','Inversión de fases'],correct:0,exp:'La irreversibilidad es la clave: si al agitar no se recupera, las gotas se fusionaron y perdieron su identidad. El cremado y la floculación solo separan o agrupan gotas intactas y sí se redispersan.'},
{tag:'M10',q:'Dispones de un surfactante con HLB de 16 y quieres anticipar qué emulsión formará al mezclarlo con aceite y agua. ¿Cuál es la predicción correcta?',opts:['Aceite en agua','Agua en aceite','Microemulsión bicontinua','No es emulsificante'],correct:0,exp:'Por la regla de Bancroft la fase continua es aquella en la que el surfactante es más soluble. Con HLB 16 es marcadamente hidrófilo, se disuelve en agua y deja el aceite disperso en ella.'},
{tag:'M10',q:'Se reduce a la mitad el radio de las gotas de una emulsión. ¿Qué ocurre con la velocidad de cremado según la ley de Stokes?',opts:['Baja a la cuarta parte','Baja a la mitad','Se mantiene igual','Baja a la octava parte'],correct:0,exp:'La velocidad de sedimentación o cremado es proporcional al cuadrado del radio, así que dividirlo entre dos divide la velocidad entre cuatro. Por eso homogeneizar más fino es la primera medida contra el cremado.'},
{tag:'M10',q:'Comparas dos inhibidores sobre el mismo blanco molecular: uno con IC50 de 5 nM y otro con IC50 de 500 nM, medidos en el mismo ensayo. ¿Qué concluyes?',opts:['El de 5 nM es más potente','El de 500 nM es más potente','Tienen la misma eficacia','El de 5 nM es más tóxico'],correct:0,exp:'IC50 es la concentración que inhibe la mitad del efecto, así que un valor menor significa que hace falta menos compuesto: mayor potencia. Potencia y eficacia son distintas, y la toxicidad no se deduce de la potencia.'},
{tag:'M10',q:'Una nanopartícula de 4 nm se administra por vía intravenosa y se elimina en minutos por el riñón. ¿Qué propiedad lo explica?',opts:['Está por debajo del corte glomerular','Su carga superficial es positiva','Su recubrimiento es hidrofóbico','Su densidad es muy baja'],correct:0,exp:'El corte de filtración glomerular ronda los 6 nm, así que por debajo de ese tamaño la partícula pasa directamente a la orina. Aumentar el tamaño o recubrir con polietilenglicol prolonga la circulación.'},
{tag:'M10',q:'Se funcionaliza una partícula con un anticuerpo y en suero pierde su capacidad de reconocer el receptor. ¿Qué ocurrió?',opts:['La corona proteica cubrió el ligando','El anticuerpo se desnaturalizó','El pH del suero rompió el enlace','La partícula se disolvió'],correct:0,exp:'En milisegundos las proteínas plasmáticas recubren la superficie, y lo que la célula encuentra es esa corona y no el ligando diseñado. Es la razón de que muchos sistemas funcionen in vitro, con poca proteína en el medio, y fallen in vivo.'},
{tag:'M10',q:'Se quiere evitar que las gotas pequeñas de una nanoemulsión cedan su contenido a las grandes con el tiempo. ¿Qué se añade?',opts:['Un atrapador osmótico insoluble','Más surfactante hidrófilo','Un espesante de la fase continua','Un conservante antimicrobiano'],correct:0,exp:'La maduración de Ostwald se frena con un atrapador osmótico que no pueda salir de la gota: al concentrarse en las pequeñas genera una contrapresión que compensa la diferencia de solubilidad por curvatura. Más surfactante no afecta este mecanismo.'},
{tag:'M10',q:'Una formulación debe esterilizarse y no tolera autoclave. Se opta por filtración estéril. ¿Qué restricción impone al producto?',opts:['Tamaño compatible con 0.22 µm','Viscosidad superior a la del agua','pH estrictamente neutro','Ausencia total de surfactante'],correct:0,exp:'El filtro estéril estándar tiene poro de 0.22 µm, así que el producto debe pasar sin retenerse ni agregarse. Es un ejemplo de cómo una restricción de proceso se convierte en una especificación del producto.'},
{tag:'M10',q:'En un análisis de riesgo se identifica un peligro grave pero la exposición de los operarios es nula. ¿Cómo se califica el riesgo?',opts:['Bajo, porque depende de la exposición','Alto, porque el peligro es grave','Indeterminado sin más datos','Alto, salvo que se use protección'],correct:0,exp:'El riesgo es función del peligro y de la exposición, y si una de las dos es nula el producto lo es. El peligro es una propiedad intrínseca que no se negocia; lo que se gestiona es la exposición.'},
{tag:'M10',q:'Un proyecto demuestra que el producto se puede fabricar, pero el mercado no pagaría su precio. ¿Qué par de conceptos distingue esa situación?',opts:['Factible pero no viable','Viable pero no factible','Ni factible ni viable','Factible y viable'],correct:0,exp:'Factible responde si se puede hacer y viable si conviene hacerlo. Confundirlos es el error más común en un análisis de caso, y lleva a defender desarrollos técnicamente impecables sin camino comercial.'},
{tag:'M10',q:'Se quiere describir el encaje entre lo que ofrece un producto y lo que el cliente necesita, sin abordar aún socios ni ingresos. ¿Qué herramienta aplica?',opts:['Lienzo de propuesta de valor','Lienzo de modelo de negocio','Análisis de ciclo de vida','Matriz de riesgo'],correct:0,exp:'El lienzo de propuesta de valor trabaja solo el ajuste entre las tareas y dolores del cliente y lo que el producto alivia. El lienzo de modelo de negocio es más amplio e incorpora canales, socios, costos e ingresos.'},
{tag:'M10',q:'En una línea de producción se identifica una etapa donde un fallo puede corregirse en el paso siguiente. ¿Cómo se clasifica esa etapa?',opts:['Punto de control, no crítico','Punto crítico de control','Límite crítico del proceso','Desviación mayor'],correct:0,exp:'La prueba para distinguir un punto crítico es si existe una etapa posterior capaz de corregir el fallo. Si la hay, el control sigue siendo útil pero no es crítico; si no la hay, debe vigilarse con un límite numérico y acciones correctivas definidas.'},
{tag:'M10',q:'Comparas una nanomedicina ya aprobada con su fármaco libre equivalente y resulta que el beneficio clínico principal no es el que esperabas. ¿Cuál suele ser?',opts:['Menor toxicidad sistémica','Mayor eficacia antitumoral','Menor costo de fabricación','Administración por vía oral'],correct:0,exp:'Los productos aprobados basan buena parte de su beneficio en reducir la toxicidad al cambiar la biodistribución, más que en multiplicar la eficacia. La magnitud del efecto EPR en tumores humanos está en discusión en la literatura.'},
{tag:'M10',q:'Se manipulará un nanopolvo cuya toxicidad se desconoce. Entre las medidas disponibles, ¿cuál ocupa el primer lugar en la jerarquía de controles?',opts:['Sustituirlo por una suspensión','Instalar una campana de extracción','Redactar un procedimiento de manejo','Usar mascarilla con filtro'],correct:0,exp:'La jerarquía va de eliminar o sustituir, a controles de ingeniería, a controles administrativos y por último equipo de protección personal, que es el menos fiable porque depende del comportamiento humano en cada uso.'},
{tag:'M10',q:'Vas a registrar ante la autoridad sanitaria un producto de consumo que incorpora nanomateriales. ¿Qué determina el marco regulatorio que debe seguir?',opts:['Su uso previsto','Su tamaño de partícula','Su método de síntesis','El país de fabricación'],correct:0,exp:'En la mayoría de jurisdicciones la nanoescala no crea una categoría propia: el producto se regula según sea dispositivo médico, medicamento, cosmético, alimento o químico industrial, con requisitos adicionales de caracterización.'}
);
</script>
<script>
/* ---------------- M11 · Electroquímica · 50 reactivos ---------------- */
QUIZ.push(
{tag:'M11',q:'Conectas una batería recargable a un cargador y la corriente entra forzada desde la fuente externa. ¿Qué ocurre con el electrodo que durante la descarga era el ánodo negativo?',opts:['Sigue siendo ánodo negativo','Pasa a ser cátodo negativo','Pasa a ser ánodo positivo','Deja de participar'],correct:1,exp:'Al cargar se invierte el sentido de la reacción: el electrodo que se oxidaba ahora se reduce, así que pasa a ser cátodo. Y como la celda es ahora electrolítica, el cátodo es el polo negativo. La regla oxidación-en-el-ánodo no cambia nunca; lo que cambia es qué electrodo hace cada cosa y qué signo le corresponde.'},
{tag:'M11',q:'En una celda galvánica en operación, un compañero afirma que los electrones circulan por el puente salino desde el ánodo hacia el cátodo. ¿Qué error contiene esa afirmación?',opts:['Los electrones van de cátodo a ánodo','El puente no conduce nada','Los electrones no se desplazan','El puente conduce iones, no electrones'],correct:3,exp:'Los electrones recorren el circuito externo, el cable, de ánodo a cátodo. El puente salino cierra el circuito interno con migración de iones: aniones hacia el ánodo, cationes hacia el cátodo. Confundir ambos caminos es el error conceptual más frecuente del tema.'},
{tag:'M11',q:'Lees en un informe la notación de celda Fe | Fe²⁺(1 M) ‖ Ag⁺(1 M) | Ag, escrita según el convenio habitual. ¿Qué información inmediata extraes de ella?',opts:['Ambas se reducen','El orden es arbitrario','La plata se oxida','El hierro es el ánodo'],correct:3,exp:'Por convenio el ánodo va siempre a la izquierda y el cátodo a la derecha, con la doble barra marcando el puente salino. Así que el hierro se oxida y la plata se reduce, lo que además coincide con sus potenciales estándar. Leer la notación al revés invierte el signo del potencial calculado.'},
{tag:'M11',q:'Montas una celda y retiras el puente salino manteniendo los electrodos conectados por el cable. ¿Qué observas en el amperímetro al cabo de unos segundos?',opts:['La corriente cae a cero','La corriente se invierte','La corriente se mantiene','La corriente aumenta'],correct:0,exp:'Sin puente salino, la semicelda anódica acumula carga positiva y la catódica carga negativa en cuanto circulan unos pocos electrones. Esa separación de carga genera un campo que se opone al flujo y lo detiene. El puente mantiene la electroneutralidad y por eso es imprescindible.'},
{tag:'M11',q:'Un técnico pide medir el potencial absoluto del electrodo de cobre sumergido en su disolución, conectando un solo borne del voltímetro. ¿Qué le respondes?',opts:['Hace falta más concentración','Hay que usar un electrodo de oro','No se puede medir un solo electrodo','Se mide con el multímetro en continua'],correct:2,exp:'Un potencial es por definición una diferencia entre dos puntos, de modo que toda medida es la de una celda completa. Por eso se asigna por convenio E° = 0.000 V al electrodo estándar de hidrógeno, y los potenciales tabulados son potenciales contra esa referencia.'},
{tag:'M11',q:'Trabajas con un potenciostato y el montaje tiene tres electrodos en lugar de dos. ¿Cuál es la función del tercero, el contraelectrodo, dentro de ese arreglo?',opts:['Compensar la temperatura','Cerrar el paso de la corriente','Fijar el potencial de referencia','Duplicar la señal medida'],correct:1,exp:'La referencia debe mantener un potencial estable, y para eso por ella no puede circular corriente apreciable. El contraelectrodo se encarga de cerrar el circuito de corriente, de modo que el potencial del electrodo de trabajo se controle limpiamente contra la referencia sin que la caída óhmica lo contamine.'},
{tag:'M11',q:'Combinas Zn²⁺/Zn (E° = −0.76 V) con Cu²⁺/Cu (E° = +0.34 V) en condiciones estándar. ¿Cuánto vale el potencial de la celda y qué carácter tiene?',opts:['+1.10 V, galvánica','−1.10 V, electrolítica','−0.42 V, electrolítica','+0.42 V, galvánica'],correct:0,exp:'E°_celda = E°_cátodo − E°_ánodo = 0.34 − (−0.76) = 1.10 V. Positivo significa ΔG° negativo y por tanto celda galvánica espontánea. El 0.42 sale de sumar en lugar de restar, y es el distractor que detecta el error de signo.'},
{tag:'M11',q:'Escribes la reacción Zn + Cu²⁺ → Zn²⁺ + Cu multiplicada por dos para balancearla con otra ecuación. ¿Qué le ocurre al potencial estándar de celda al duplicarla?',opts:['Se reduce a la mitad','Depende de la concentración','Se duplica a 2.20 V','Se mantiene en 1.10 V'],correct:3,exp:'El potencial es una magnitud intensiva, como la temperatura o la densidad: no depende de cuánta materia haya. Al duplicar la reacción se duplican n y ΔG°, pero E° = −ΔG°/nF queda igual porque ambos crecen en la misma proporción.'},
{tag:'M11',q:'Una celda tiene E° = +0.46 V con dos electrones intercambiados por cada vuelta de la reacción global. ¿Cuánto vale la energía libre estándar de esa reacción?',opts:['−44.4 kJ/mol','−88.8 kJ/mol','+88.8 kJ/mol','−22.2 kJ/mol'],correct:1,exp:'ΔG° = −nFE° = −2 × 96 485 × 0.46 = −88 766 J/mol, es decir unos −88.8 kJ/mol. El signo negativo confirma la espontaneidad. Olvidar el factor n = 2 da justo la mitad, y es el distractor previsto.'},
{tag:'M11',q:'Mides el potencial de una celda de concentración montada con dos electrodos de cobre idénticos, uno en Cu²⁺ 1.0 M y el otro en Cu²⁺ 0.010 M. ¿Qué valor esperas leer?',opts:['Unos 59 mV','Unos 15 mV','Unos 118 mV','Exactamente 0 V'],correct:0,exp:'Al ser el mismo par redox en las dos semiceldas, E° = 0 y todo el potencial viene de Nernst: E = (0.0592/n)·log(C_cátodo/C_ánodo) = (0.0592/2)·log(100) = 0.0296 × 2 = 0.059 V. El electrodo sumergido en la disolución concentrada actúa de cátodo. Olvidar dividir entre n = 2 da 118 mV, que es el distractor previsto.'},
{tag:'M11',q:'Calibras un electrodo de pH a 25 °C usando la pendiente teórica y después mides muestras biológicas termostatizadas a 37 °C sin recalibrar. ¿Qué error introduces?',opts:['Se invierte el signo de la lectura','Ninguno: el pH no depende de T','Un sesgo sistemático creciente','Solo pierdes precisión'],correct:2,exp:'La pendiente nernstiana es 2.303·RT/F, proporcional a la temperatura absoluta: 59.2 mV por década a 25 °C y 61.6 mV a 37 °C. Usar la pendiente equivocada desvía todas las lecturas en la misma dirección, y el sesgo crece cuanto más se aleja el pH de la muestra del punto de calibración.'},
{tag:'M11',q:'Un electrodo selectivo para un ion divalente entrega en la calibración una pendiente de 29.5 mV por década de actividad. ¿Qué concluyes sobre su funcionamiento?',opts:['Está deteriorado y hay que cambiarlo','Mide un ion monovalente','La calibración está mal hecha','Está respondiendo bien'],correct:3,exp:'La pendiente nernstiana es 59.2/n mV por década, así que para un ion divalente el valor esperado es 29.6 mV. Lo que delataría un electrodo agotado sería una pendiente apreciablemente menor que la teórica, no que coincida con ella.'},
{tag:'M11',q:'Electrolizas una disolución de CuSO₄ haciendo pasar una corriente constante de 2.00 A durante 30.0 minutos sobre un cátodo de masa conocida. ¿Cuánto cobre depositas?',opts:['2.37 g','1.19 g','0.59 g','4.74 g'],correct:1,exp:'Q = I·t = 2.00 × 1800 = 3600 C. Moles de electrones = 3600/96 485 = 0.0373. Como Cu²⁺ necesita dos electrones, los moles de cobre son 0.0187, que por 63.5 g/mol dan 1.19 g. Olvidar dividir entre n = 2 da 2.37 g, el distractor más frecuente.'},
{tag:'M11',q:'Haces pasar la misma carga por tres celdas en serie que contienen Ag⁺, Cu²⁺ y Al³⁺ respectivamente. ¿Qué relación guardan los moles de metal depositados en cada una?',opts:['Son iguales en las tres','Están en razón 1 : 1/2 : 1/3','Están en razón 1 : 2 : 3','Dependen del área del electrodo'],correct:1,exp:'La carga que pasa es la misma, así que los moles de electrones también. Cada mol de plata consume uno, el de cobre dos y el de aluminio tres, de modo que los moles depositados van como 1/n. Es la segunda ley de Faraday: las masas están en razón de los equivalentes.'},
{tag:'M11',q:'Un proceso de electrodeposición de níquel opera con una eficiencia faradaica del 85 % en medio acuoso ligeramente ácido. ¿En qué se gastó el 15 % restante de la carga?',opts:['En calentar el electrolito','En desprender hidrógeno','En disolver el ánodo','En cargar la doble capa'],correct:1,exp:'En medio acuoso la reacción parásita dominante en el cátodo es la reducción de protones o de agua para dar hidrógeno, que compite con la deposición del metal. Por eso la eficiencia faradaica rara vez es total y por eso los baños se ajustan en pH y en aditivos para suprimir esa reacción.'},
{tag:'M11',q:'La descomposición termodinámica del agua exige 1.23 V, pero tu electrolizador necesita 1.9 V para entregar una corriente útil. ¿Qué explica esa diferencia de 0.7 V?',opts:['Que el voltímetro descalibra','Un error de la termodinámica','Sobrepotencial y caída óhmica','Que el agua está impura'],correct:2,exp:'El valor termodinámico es el mínimo en el límite de corriente cero. Para que circule corriente hay que pagar el sobrepotencial de activación, sobre todo el de la evolución de oxígeno, que es cinéticamente lenta, más la caída óhmica del electrolito y las pérdidas por transporte de materia.'},
{tag:'M11',q:'Electrolizas una salmuera concentrada de NaCl y en el ánodo obtienes cloro, pese a que oxidar agua a oxígeno es termodinámicamente más favorable. ¿Qué lo explica?',opts:['Un error en la tabla de potenciales','El sobrepotencial del oxígeno','Que el agua no se oxida','La mayor concentración de sal'],correct:1,exp:'La evolución de oxígeno tiene un sobrepotencial muy alto sobre los ánodos industriales, mientras que la de cloro lo tiene bajo. El producto real lo decide el potencial termodinámico más el sobrepotencial, no el termodinámico solo. Es el caso canónico en que la cinética invierte el orden de la termodinámica.'},
{tag:'M11',q:'Quieres anodizar aluminio para obtener una capa de alúmina porosa que sirva de plantilla. ¿En qué electrodo debe ir la pieza de aluminio dentro de la celda?',opts:['En el cátodo','En el ánodo','En la referencia','Es indistinto'],correct:1,exp:'Anodizar es oxidar la superficie del metal para convertirla en su óxido, y la oxidación ocurre en el ánodo. El nombre del proceso lo dice. Al tratarse de una celda electrolítica, ese ánodo es además el polo positivo conectado a la fuente.'},
{tag:'M11',q:'Comparas la evolución de hidrógeno sobre platino, con i₀ del orden de 10⁻³ A/cm², y sobre mercurio, con i₀ de 10⁻¹² A/cm². ¿Qué consecuencia práctica tiene?',opts:['Ambos requieren lo mismo','El mercurio da más corriente','El mercurio cataliza mejor','El platino pide menos η'],correct:3,exp:'Una densidad de corriente de intercambio grande significa una reacción intrínsecamente rápida, de modo que basta un sobrepotencial pequeño para obtener corriente apreciable. Por eso el platino es el catalizador de referencia y por eso el mercurio, con i₀ nueve órdenes menor, tiene una ventana catódica tan amplia.'},
{tag:'M11',q:'En una medida amperométrica la corriente deja de crecer al subir el potencial y se estabiliza en un valor constante proporcional a la concentración. ¿Qué la limita?',opts:['El transporte de materia','La resistencia del cable','La capacitancia de doble capa','La transferencia de carga'],correct:0,exp:'Es la corriente límite: el reactivo se consume en la superficie tan rápido como llega, de modo que la velocidad la fija la difusión a través de la capa de difusión y no la cinética de electrodo. Como es proporcional a la concentración del analito, en ella se basa toda la amperometría cuantitativa.'},
{tag:'M11',q:'Observas un sobrepotencial elevado y compruebas que disminuye mucho al agitar la disolución con un agitador magnético. ¿De qué tipo de sobrepotencial se trata?',opts:['De concentración','Óhmico','De difusión en el sólido','De activación'],correct:0,exp:'Agitar adelgaza la capa de difusión y repone el reactivo junto al electrodo, así que solo puede aliviar el componente de concentración. El de activación se baja con un mejor catalizador y el óhmico con más conductividad o compensación iR, y ninguno de los dos responde a la agitación.'},
{tag:'M11',q:'Mides la caída de potencial entre el electrodo de trabajo y la referencia en un electrolito poco conductor y encuentras una contribución proporcional a la corriente. ¿Qué es?',opts:['Polarización por concentración','Caída óhmica iR','Sobrepotencial de activación','Corriente capacitiva'],correct:1,exp:'Una contribución estrictamente proporcional a la corriente es una resistencia por la ley de Ohm, y en una celda corresponde a la resistencia del electrolito entre el trabajo y la referencia. Se minimiza acercando el capilar de Luggin, subiendo la conductividad o compensándola electrónicamente.'},
{tag:'M11',q:'Ajustas los datos de un electrocatalizador a la ecuación de Tafel y obtienes una pendiente de 120 mV por década en lugar de los 30 mV de un catalizador de referencia. ¿Qué indica?',opts:['Que la temperatura subió','Que es más activo','Que el paso lento es distinto','Que hay un error de ajuste'],correct:2,exp:'La pendiente de Tafel depende del coeficiente de transferencia y del número de electrones del paso determinante, de modo que su valor es una huella del mecanismo. En evolución de hidrógeno, 30 y 120 mV por década corresponden a pasos limitantes diferentes del mecanismo de Volmer-Heyrovsky-Tafel.'},
{tag:'M11',q:'Comparas dos catalizadores para evolución de oxígeno y el criterio que usa la literatura es el potencial necesario para alcanzar una corriente dada. ¿Cuál es la convención?',opts:['La masa de catalizador usada','El sobrepotencial a 10 mA/cm²','La corriente a 1.23 V','El potencial de circuito abierto'],correct:1,exp:'Comparar corrientes brutas es engañoso porque dependen del área y de la carga de catalizador. La convención es reportar el sobrepotencial necesario para alcanzar 10 mA/cm², una densidad representativa de una celda solar al 10 % de eficiencia, junto con la pendiente de Tafel y la estabilidad.'},
{tag:'M11',q:'Un sistema de electrodo se comporta como una resistencia simple cuando el sobrepotencial aplicado es muy pequeño, de apenas unos milivolts. ¿Cómo se llama esa resistencia?',opts:['De difusión, Warburg','De contacto del colector','Del electrolito, R_s','De transferencia de carga, R_ct'],correct:3,exp:'Para sobrepotencial pequeño la ecuación de Butler-Volmer se linealiza y queda i ≈ i₀·nFη/RT, que tiene forma de ley de Ohm. La pendiente define la resistencia de transferencia de carga R_ct, inversamente proporcional a i₀, y es justamente la magnitud que mide la impedancia.'},
{tag:'M11',q:'En un voltamperograma cíclico la corriente de pico crece de forma proporcional a la raíz cuadrada de la velocidad de barrido en todo el intervalo explorado. ¿Qué indica?',opts:['La especie está adsorbida','La especie difunde en disolución','El sistema es irreversible','Hay una reacción acoplada'],correct:1,exp:'Es la predicción de Randles-Ševčík para una especie que llega al electrodo por difusión desde el seno de la disolución. Si en cambio la dependencia fuera lineal en v, la especie ya estaría sobre la superficie y no necesitaría difundir: ese es el diagnóstico estándar para distinguir ambos regímenes.'},
{tag:'M11',q:'Un par redox muestra en voltamperometría cíclica una separación de picos de 58 mV que no cambia al variar la velocidad de barrido entre 10 y 200 mV/s. ¿Qué concluyes?',opts:['Es un proceso irreversible','Intervienen dos electrones','Es reversible con un electrón','Es un proceso cuasirreversible'],correct:2,exp:'El criterio de reversibilidad es ΔE_p ≈ 59/n mV a 25 °C e independiente de la velocidad de barrido, junto con una razón de corrientes de pico cercana a uno. Con 58 mV el número de electrones es uno; si fueran dos, la separación esperada sería de unos 29 mV.'},
{tag:'M11',q:'Registras un voltamperograma cíclico y aparece un pico bien definido en la ida, pero en la vuelta no hay ningún pico de retorno por más que bajes la velocidad. ¿Qué pasó?',opts:['La disolución estaba muy diluida','El barrido fue demasiado lento','El producto reaccionó químicamente','El electrodo está sucio'],correct:2,exp:'La ausencia del pico de vuelta significa que la especie generada en la ida ya no está disponible para el proceso inverso: una reacción química acoplada la consumió. Bajar la velocidad de barrido da más tiempo a esa reacción y empeora el efecto, lo que confirma el diagnóstico.'},
{tag:'M11',q:'Un voltamperograma de un par reversible da E_pa = 0.285 V y E_pc = 0.226 V frente a la misma referencia. ¿Cuál es el potencial formal estimado de ese par redox?',opts:['0.256 V','0.285 V','0.059 V','0.511 V'],correct:0,exp:'El potencial formal se estima como el punto medio entre los dos picos: (0.285 + 0.226)/2 = 0.2555 V, unos 0.256 V. La diferencia entre ellos, 59 mV, es el criterio de reversibilidad para un electrón, no el potencial formal.'},
{tag:'M11',q:'Quieres bajar el límite de detección de una determinación voltamperométrica y pasas de barrido lineal a voltamperometría diferencial de pulso. ¿Por qué mejora la sensibilidad?',opts:['Reduce la resistencia del medio','Concentra el analito en el electrodo','Aumenta la corriente faradaica','Discrimina la corriente capacitiva'],correct:3,exp:'La corriente capacitiva decae exponencialmente tras el pulso y la faradaica decae como el inverso de la raíz del tiempo, mucho más despacio. Muestrear al final del pulso captura la segunda cuando la primera ya se extinguió. La discriminación es de cinéticas de decaimiento, no de especies.'},
{tag:'M11',q:'Al aumentar diez veces la velocidad de barrido en voltamperometría cíclica observas que la razón señal-ruido empeora de forma apreciable. ¿Cuál es la razón de fondo?',opts:['La capacitiva crece más rápido','La faradaica desaparece','El potenciostato se satura','El electrodo se calienta'],correct:0,exp:'La corriente capacitiva escala linealmente con la velocidad de barrido y la faradaica solo con su raíz cuadrada, de modo que la razón entre ambas empeora como la raíz de v. Por eso la voltamperometría cíclica rápida es excelente como diagnóstico mecanístico y mala como método cuantitativo.'},
{tag:'M11',q:'Integras el área bajo un pico voltamperométrico, la conviertes a carga y de ahí obtienes los moles que reaccionaron. ¿Qué ventaja tiene ese método frente a una calibración?',opts:['Da mejor límite de detección','Es más rápido de ejecutar','No necesita patrones','Tolera mejor la matriz'],correct:2,exp:'La culombimetría es el único método electroquímico absoluto: la relación entre carga y moles la fija la constante de Faraday, que es conocida con gran exactitud. Por eso no requiere una curva de calibración, aunque sí exige que la eficiencia faradaica sea del cien por cien.'},
{tag:'M11',q:'Preparas un experimento de voltamperometría y debes elegir el intervalo de potencial. ¿Qué fija el límite de la ventana accesible con ese electrodo y ese disolvente?',opts:['La concentración del analito','La velocidad de barrido','La descomposición del medio','El rango del potenciostato'],correct:2,exp:'Más allá de ciertos potenciales, el disolvente o el electrolito soporte empiezan a oxidarse o reducirse y su corriente enorme entierra cualquier señal del analito. Esa ventana depende del par disolvente-electrodo: el mercurio la extiende hacia potenciales negativos y el carbono vítreo hacia positivos.'},
{tag:'M11',q:'Ajustas un espectro de impedancia a un circuito de Randles y obtienes el diagrama de Nyquist con su semicírculo y su recta final. ¿Qué parámetro da el diámetro del semicírculo?',opts:['La capacitancia de doble capa','La resistencia de transferencia','La impedancia de Warburg','La resistencia del electrolito'],correct:1,exp:'El corte a alta frecuencia da R_s, la resistencia del electrolito; el diámetro del semicírculo da R_ct, la resistencia de transferencia de carga; la frecuencia del máximo permite extraer C_dl; y la recta a 45° a baja frecuencia es la respuesta de Warburg, que describe la difusión.'},
{tag:'M11',q:'En un biosensor sin marcaje mides impedancia antes y después de incubar con el analito, y el semicírculo del diagrama de Nyquist crece de forma clara. ¿Qué significa?',opts:['El analito se unió al electrodo','El electrolito se diluyó','El electrodo quedó limpio','La temperatura del baño bajó'],correct:0,exp:'Un semicírculo mayor significa un R_ct mayor, es decir una transferencia de carga más difícil. La capa de analito unida a la superficie bloquea el acceso de la sonda redox al electrodo, y ese bloqueo creciente es precisamente la señal analítica del formato sin marcaje.'},
{tag:'M11',q:'Aplicas en una medida de impedancia una perturbación de 150 mV de amplitud en lugar de los 5 a 10 mV habituales, buscando mejor relación señal-ruido. ¿Qué consecuencia tiene?',opts:['Se reduce la resistencia medida','No cambia nada apreciable','Mejora el ajuste del circuito','El sistema deja de ser lineal'],correct:3,exp:'Todo el formalismo de impedancia supone que la respuesta es lineal frente a la perturbación, lo que solo se cumple para amplitudes pequeñas comparadas con RT/F, unos 25 mV. Con 150 mV la relación corriente-potencial es francamente exponencial y los parámetros ajustados pierden sentido físico.'},
{tag:'M11',q:'Comparas la capacitancia de doble capa de un electrodo en NaCl 1 mM y en NaCl 1 M, midiendo con la misma técnica y el mismo área geométrica. ¿Qué esperas encontrar?',opts:['Mayor capacitancia en 1 M','Mayor capacitancia en 1 mM','La misma en ambos casos','Capacitancia nula en 1 M'],correct:0,exp:'Al subir la fuerza iónica se comprime la capa difusa y la longitud de Debye disminuye, de modo que la carga queda más cerca de la superficie y la capacitancia aumenta, como en un condensador al que se le acerca la placa. Es la misma física que desestabiliza una suspensión coloidal.'},
{tag:'M11',q:'Una pieza de acero al carbono se corroe en agua de mar aireada y en agua desoxigenada de la misma salinidad y pH. ¿En cuál de los dos medios esperas mayor velocidad de ataque?',opts:['En ninguna: igual velocidad','Depende solo del pH','En la desoxigenada','En la aireada'],correct:3,exp:'En medio neutro la reacción catódica que sostiene la corrosión es la reducción de oxígeno disuelto, no la de protones. Si falta oxígeno, el cátodo no tiene con qué consumir los electrones y la celda se frena. Por eso airear o agitar acelera la corrosión en lugar de combatirla.'},
{tag:'M11',q:'Se unen con remaches dos chapas y se expone el conjunto a un ambiente marino. ¿Qué combinación de materiales provoca la corrosión más rápida y localizada del remache?',opts:['Ambos remaches de acero','Ambos remaches de cobre','Remache de acero en chapa de cobre','Remache de cobre en chapa de acero'],correct:2,exp:'El metal menos noble actúa de ánodo, y la velocidad de ataque crece con la razón entre área catódica y anódica. Un remache de acero, pequeño y menos noble, rodeado de una gran superficie de cobre catódica concentra toda la corrosión en muy poco material y falla rápido.'},
{tag:'M11',q:'Un casco de acero lleva bloques de zinc atornillados por debajo de la línea de flotación, que se consumen con el tiempo y se reemplazan en cada mantenimiento. ¿Cómo funciona?',opts:['El zinc actúa como ánodo de sacrificio','El zinc aumenta la pasivación','El zinc neutraliza el agua salada','El zinc sella los poros del acero'],correct:0,exp:'El zinc es más activo que el hierro, así que al conectarlos eléctricamente se convierte en el ánodo de la celda y se oxida él, mientras el acero queda polarizado catódicamente y protegido. Que el bloque se consuma no es un defecto: es exactamente la señal de que está trabajando.'},
{tag:'M11',q:'Comparas la capa de óxido que se forma sobre aluminio, con razón de Pilling-Bedworth de 1.28, con la del magnesio, cuya razón vale 0.81. ¿Qué diferencia esperas?',opts:['Ninguna protege','Las dos protegen igual','La del aluminio protege','La del magnesio protege'],correct:2,exp:'Una razón menor que uno significa que el óxido ocupa menos volumen que el metal consumido, así que no alcanza a cubrir la superficie y queda poroso: el caso del magnesio. Entre uno y dos la capa es compacta y adherente, y protege, como en el aluminio y el cromo.'},
{tag:'M11',q:'El acero inoxidable debe su resistencia a la corrosión al cromo que contiene, no a que el hierro deje de ser reactivo en esa aleación. ¿Cuál es el mecanismo exacto?',opts:['El cromo eleva el potencial del hierro','El cromo capta el oxígeno disuelto','El cromo impide la difusión del agua','El cromo pasiva la superficie'],correct:3,exp:'El cromo forma espontáneamente una capa de óxido compacta, adherente y de pocos nanómetros que aísla el metal del medio y se regenera sola si se raya. Por eso el inoxidable falla justo donde esa capa no puede regenerarse, como en rendijas sin oxígeno o frente a cloruros que la perforan.'},
{tag:'M11',q:'Dispersas nanopartículas de hierro cerovalente para remediación y compruebas que pierden reactividad en días, mucho antes que una lámina del mismo metal. ¿Por qué ocurre?',opts:['Se agregan por el magnetismo','El pH del medio las neutraliza','Se disuelven en el agua','Su área y su energía superficial'],correct:3,exp:'La velocidad de corrosión escala con el área expuesta, enorme por unidad de masa en la nanoescala, y además la ecuación de Gibbs-Thomson desplaza el potencial del metal nanoparticulado hacia valores más fáciles de oxidar. Las dos cosas apuntan al mismo resultado: oxidación mucho más rápida.'},
{tag:'M11',q:'Diseñas un sistema que debe entregar un pulso de potencia muy alto durante pocos segundos y repetirlo cientos de miles de veces a lo largo de su vida útil. ¿Qué eliges?',opts:['Una batería de plomo-ácido','Una batería de ion litio','Un supercondensador','Una celda de combustible'],correct:2,exp:'El supercondensador almacena carga en la doble capa sin reacción química, así que carga y descarga en segundos y soporta del orden de un millón de ciclos. Su límite es la densidad de energía, baja, pero el requisito del enunciado es potencia y vida en ciclos, no autonomía.'},
{tag:'M11',q:'Comparas una batería de ion litio con un supercondensador en energía específica y en número de ciclos de vida. ¿Qué par de valores corresponde a la batería?',opts:['8 Wh/kg y 10³ ciclos','8 Wh/kg y 10⁶ ciclos','200 Wh/kg y 10³ ciclos','200 Wh/kg y 10⁶ ciclos'],correct:2,exp:'La batería guarda energía en enlaces químicos y alcanza del orden de 150 a 250 Wh/kg, pero cada ciclo de intercalación deteriora el material y la vida se queda en unos miles de ciclos. El supercondensador invierte ambas cifras: unos pocos Wh/kg y cientos de miles de ciclos.'},
{tag:'M11',q:'En una batería de ion litio la carga y la descarga ocurren sin que las estructuras cristalinas de los electrodos se destruyan ni se reconstruyan. ¿Cómo se llama ese mecanismo?',opts:['Conversión','Aleación','Intercalación','Electrodeposición'],correct:2,exp:'En la intercalación el litio entra y sale de posiciones disponibles en una estructura anfitriona que se conserva, por ejemplo entre las láminas de grafito. Por eso el proceso es tan reversible. Los mecanismos de conversión y de aleación dan más capacidad y sufren cambios de volumen que arruinan la ciclabilidad.'},
{tag:'M11',q:'Nanoestructuras el material activo del electrodo de una batería y obtienes mejor desempeño a corrientes altas pero una eficiencia muy baja en el primer ciclo. ¿Por qué?',opts:['El litio no llegó a intercalar','Se formó más interfase SEI','El material perdió cristalinidad','La conductividad eléctrica cayó'],correct:1,exp:'Acortar la distancia de difusión en estado sólido, que escala con el cuadrado del tamaño, es lo que mejora la respuesta a corrientes altas. Pero más área de contacto con el electrolito significa más descomposición de este para formar la interfase sólido-electrolito, que consume litio de forma irreversible.'},
{tag:'M11',q:'Una batería de 2.0 Ah de capacidad nominal se descarga completamente en media hora bajo una corriente constante durante todo el proceso. ¿A qué tasa C está operando?',opts:['2 C','4 C','0.5 C','1 C'],correct:0,exp:'La tasa C expresa en qué fracción de hora se descarga la capacidad nominal: 1C es una hora, 2C es media hora y 0.5C son dos horas. Media hora corresponde por tanto a 2C, que con 2.0 Ah significa una corriente de 4.0 A.'},
{tag:'M11',q:'Quieres crecer un arreglo ordenado de nanohilos metálicos de diámetro uniforme y longitud controlada, sin recurrir a litografía de alta resolución. ¿Qué ruta eliges?',opts:['Deposición en plantilla de alúmina','Molienda de bolas del metal','Inyección caliente en disolvente','Sputtering sobre sustrato plano'],correct:0,exp:'La anodización del aluminio genera alúmina porosa con poros hexagonales de diámetro ajustable por el voltaje y la química del baño. Rellenarlos por electrodeposición transfiere esa geometría al metal: el poro fija el diámetro y la carga pasada fija la longitud, por la ley de Faraday.'},
{tag:'M11',q:'Comparas la síntesis electroquímica de nanomateriales con una ruta química convencional de reducción en disolución. ¿Cuál es su ventaja más característica como método?',opts:['El potencial regula la fuerza','Siempre da mayor rendimiento','Funciona a temperatura ambiente','No requiere disolvente alguno'],correct:0,exp:'En la ruta química la fuerza reductora la fija el reactivo elegido y solo se cambia cambiando de reactivo. En la electroquímica el potencial aplicado es la fuerza impulsora, se ajusta de forma continua con precisión milivolt y se apaga al instante, lo que da un control del tamaño y la forma difícil de igualar.'},
{tag:'M11',q:'Un depósito electroquímico de cobre sale rugoso y con estructura dendrítica en lugar de la película lisa y brillante que esperabas obtener. ¿Qué condición lo provoca?',opts:['Temperatura del baño muy baja','Electrolito demasiado concentrado','Ánodo de superficie muy grande','Densidad de corriente muy alta'],correct:3,exp:'A densidades de corriente altas el proceso queda limitado por el transporte de materia: las puntas que sobresalen reciben más flujo difusivo que los valles y crecen todavía más rápido, en un ciclo que amplifica la rugosidad hasta dar dendritas. Se corrige bajando la corriente, agitando o añadiendo abrillantadores.'}
);
</script>
<script>
/* ---------------- M2 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M2',q:'Disuelves 4.25 g de nitrato de plata (M = 169.87 g/mol) y aforas a 500.0 mL en un matraz volumétrico. ¿Cuál es la molaridad de la disolución resultante?',opts:['0.0500 M','0.0250 M','0.100 M','0.0125 M'],correct:0,exp:'n = 4.25/169.87 = 0.02502 mol. M = 0.02502/0.5000 L = 0.0500 mol/L. El error típico es dividir entre 500 en lugar de entre 0.500 L, que desplaza el resultado tres órdenes de magnitud.'},
{tag:'M2',q:'Una muestra de agua contiene 0.35 mg de plomo por litro y la norma permite un máximo de 0.010 mg/L. ¿Por qué factor excede la muestra el límite permitido?',opts:['35 veces','350 veces','0.35 veces','3.5 veces'],correct:0,exp:'0.35/0.010 = 35. Expresado en ppm, la muestra tiene 0.35 ppm frente a un límite de 0.010 ppm. En disolución acuosa diluida 1 mg/L equivale a 1 ppm porque la densidad es prácticamente 1 kg/L.'},
{tag:'M2',q:'Preparas un estándar pesando 0.1000 g en una balanza de ±0.0001 g y aforando a 100.00 mL en un matraz de ±0.08 mL. ¿Qué contribución domina la incertidumbre final?',opts:['Las dos por igual','Ninguna es apreciable','La pesada','El aforo'],correct:2,exp:'Incertidumbre relativa de la pesada: 0.0001/0.1000 = 0.10 %. Del aforo: 0.08/100.00 = 0.08 %. Al combinarlas en cuadratura domina la mayor. La lección práctica es que pesar cantidades pequeñas es lo que más degrada un estándar: conviene pesar más masa y diluir.'},
{tag:'M2',q:'Tu curva de calibración tiene cinco puntos entre 1 y 10 mg/L y la muestra da una señal que corresponde a 18 mg/L al extrapolar la recta. ¿Qué haces?',opts:['Restar el blanco de nuevo','Reportar los 18 mg/L','Diluir y volver a medir','Ampliar la curva por cálculo'],correct:2,exp:'Una calibración solo es válida dentro del intervalo en que se construyó. Fuera de él no hay evidencia de que la relación siga siendo lineal, y en la mayoría de las técnicas no lo es. Diluir la muestra para caer dentro del rango es la práctica correcta; extrapolar es inventar datos.'},
{tag:'M2',q:'Comparas dos métodos para el mismo analito: uno con pendiente de calibración de 0.045 y otro de 0.280, ambos con el mismo ruido de blanco. ¿Cuál detecta concentraciones menores?',opts:['El de pendiente 0.280','Los dos igual','Depende del rango','El de pendiente 0.045'],correct:0,exp:'LOD ≈ 3σ del blanco entre la pendiente. Con el mismo ruido, mayor pendiente significa menor límite de detección. La pendiente es la sensibilidad del método: cuánta señal entrega por unidad de concentración.'},
{tag:'M2',q:'Necesitas cuantificar un principio activo en un jarabe con mucho azúcar y colorante, y sospechas que la matriz altera la señal del instrumento. ¿Qué estrategia usas?',opts:['Calibración externa','Adición de estándar','Diluir hasta el LOD','Repetir más réplicas'],correct:1,exp:'La adición de estándar construye la calibración dentro de la propia muestra, de modo que el efecto de matriz actúa por igual sobre el analito y sobre el estándar añadido. Es la respuesta estándar a un efecto de matriz confirmado, y se reconoce porque la recta se extrapola hacia el eje negativo.'},
{tag:'M2',q:'Debes determinar la composición elemental completa y las trazas metálicas de una muestra mineral desconocida, incluidos elementos por debajo de 1 µg/L. ¿Qué técnica eliges?',opts:['Volumetría redox','Gravimetría clásica','ICP-MS multielemental','Espectrofotometría UV'],correct:2,exp:'El plasma acoplado inductivamente excita simultáneamente casi todos los elementos y, acoplado a espectrometría de masas, llega a nanogramos por litro. Las técnicas clásicas son excelentes para un analito mayoritario conocido, pero no hacen barrido multielemental a nivel de trazas.'},
{tag:'M2',q:'Tienes dos compuestos con tiempos de retención de 4.20 y 4.35 min, anchos de pico de 0.12 min cada uno, y necesitas separarlos a línea base. ¿Qué resolución tienes ahora?',opts:['Rs = 0.15','Rs = 1.25','Rs = 0.63','Rs = 2.50'],correct:1,exp:'Rs = 2(4.35 − 4.20)/(0.12 + 0.12) = 0.30/0.24 = 1.25. Para separación a línea base hace falta Rs ≥ 1.5, así que todavía no basta: habría que aumentar la eficiencia, la selectividad o el factor de retención.'},
{tag:'M2',q:'En un cromatograma el pico de interés tiene tiempo de retención de 6.0 min y ancho a media altura de 0.10 min. ¿Cuántos platos teóricos tiene la columna para ese analito?',opts:['N ≈ 960','N ≈ 57 600','N ≈ 19 900','N ≈ 3 600'],correct:2,exp:'Con el ancho a media altura, N = 5.54·(t_R/w½)² = 5.54 × (6.0/0.10)² = 5.54 × 3600 = 19 944. Si se usara la fórmula del ancho en la base, N = 16(t_R/w)², el ancho que corresponde es distinto y mezclar ambas es el error frecuente.'},
{tag:'M2',q:'Una titulación de 20.00 mL de ácido sulfúrico requiere 32.40 mL de NaOH 0.1050 M para alcanzar el punto de equivalencia con fenolftaleína. ¿Cuál es la concentración del ácido?',opts:['0.0851 M','0.3402 M','0.0425 M','0.1701 M'],correct:0,exp:'El ácido sulfúrico es diprótico, así que cada mol neutraliza dos de base. n(NaOH) = 0.03240 × 0.1050 = 3.402×10⁻³ mol; n(H₂SO₄) = la mitad = 1.701×10⁻³ mol; dividido entre 0.02000 L da 0.0851 M. Olvidar el factor 2 entrega justo el primer distractor.'},
{tag:'M2',q:'Preparas un buffer de fosfato y la etiqueta reporta un pH de 7.40 medido a 25 °C, pero lo vas a usar en un incubador a 37 °C. ¿Qué esperas del pH real a esa temperatura?',opts:['Será exactamente 7.40','Subirá dos unidades','Bajará dos unidades','Será algo distinto'],correct:3,exp:'Las constantes de disociación dependen de la temperatura, y también lo hace K_w, así que el pH de un buffer cambia al cambiarla. En fosfato el efecto es pequeño, de unas centésimas, y en Tris es grande, de unas 0.03 unidades por grado. Por eso el pH debe ajustarse a la temperatura de trabajo.'},
{tag:'M2',q:'Mides por potenciometría y el electrodo de pH, recién calibrado con buffers de 4.00 y 7.00, debe leer una muestra de pH cercano a 10. ¿Qué corresponde hacer antes?',opts:['Medir la muestra directo','Calibrar también a pH 10','Diluir antes de medir','Esperar a que estabilice'],correct:1,exp:'La calibración solo garantiza la respuesta en el intervalo acotado por los buffers usados. Medir pH 10 con una calibración de 4 a 7 es extrapolar la recta de Nernst, y cualquier desviación de la pendiente ideal se amplifica fuera del intervalo. Se usan tres buffers que acoten la zona de trabajo.'},
{tag:'M2',q:'Dos picos cromatográficos salen juntos y al cambiar la fase móvil su orden de elución se invierte, aunque la columna y la temperatura son las mismas. ¿Qué parámetro cambió?',opts:['La eficiencia N','La selectividad α','El tiempo muerto','El ancho de banda'],correct:1,exp:'La selectividad es la razón de factores de retención entre los dos analitos y refleja la diferencia en sus interacciones con las dos fases. Es lo único que puede invertir el orden de elución. La eficiencia solo estrecha los picos y el tiempo muerto desplaza a todos por igual.'},
{tag:'M2',q:'Tu laboratorio reporta un resultado de 45.2 mg/L con una incertidumbre expandida de 3.8 mg/L, y el límite regulatorio es de 42.0 mg/L. ¿Qué conclusión es defendible?',opts:['No se puede afirmar que exceda','Cumple la norma holgadamente','El dato no es válido','Excede el límite con certeza'],correct:0,exp:'El intervalo 45.2 ± 3.8 abarca de 41.4 a 49.0, de modo que incluye el límite de 42.0. Decidir conformidad exige comparar el límite con el intervalo completo, no con el valor central. Este es exactamente el tipo de razonamiento que distingue un informe analítico de una lectura de instrumento.'},
