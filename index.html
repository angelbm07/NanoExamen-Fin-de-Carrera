/* ---------- M7 ---------- */
{m:'M7',t:'Una sonda para cada pregunta: cómo se elige una técnica',dur:30,
 obj:['Clasificar las técnicas según qué información entregan','Elegir la secuencia correcta para caracterizar un material desconocido','Reconocer que tamaño medido depende de la técnica usada'],
 sec:[
  {t:'El reactivo más frecuente del módulo',p:'En este módulo, la pregunta típica no es cómo funciona un instrumento sino cuál usarías. Por eso conviene organizar el conocimiento por PREGUNTA en lugar de por técnica.\n\nHay cuatro preguntas fundamentales. Qué es, es decir composición y fase. Cómo se ve, morfología y tamaño. Qué hay en la superficie. Y cómo se comporta al calentarlo. Cada una tiene un puñado de técnicas asociadas, y elegir consiste en cruzar la pregunta con las restricciones de la muestra: si es conductora, si soporta vacío, si está en suspensión o seca, y si puedes destruirla.'},
  {t:'El principio común: interacción sonda-materia',p:'Todas las espectroscopías son variaciones sobre un mismo tema. Se lanza una sonda contra la muestra y se mide qué le pasó. La sonda puede ser fotón, electrón, ion o una punta física, y la energía elegida determina qué transición se excita.\n\nLos fotones de rayos X arrancan electrones internos, y de ahí XPS y EDS. Los ultravioleta y visibles promueven electrones de valencia: UV-Vis y fluorescencia. Los infrarrojos excitan vibraciones: FTIR y Raman. Las radiofrecuencias en campo magnético excitan espines nucleares: NMR.\n\nEsa lógica energética permite deducir para qué sirve cada técnica en lugar de memorizarla, y es exactamente el orden en que las presenta el curso de Caracterización.'},
  {t:'El caso del tamaño: tres técnicas, tres números',p:'Nada ilustra mejor la necesidad de saber qué mide cada técnica que la pregunta aparentemente simple de cuánto mide una nanopartícula.\n\nTEM da el diámetro del NÚCLEO sólido, en seco y bajo vacío, sobre las partículas que tú elegiste mirar. Scherrer, a partir del ancho de un pico de difracción, da el tamaño de CRISTALITO, es decir del dominio cristalino coherente, que en una partícula policristalina es menor que la partícula. Y DLS da el diámetro HIDRODINÁMICO, que incluye ligandos y capa de solvatación y por tanto siempre es mayor.\n\nAdemás DLS pondera por intensidad, que escala como d⁶, así que unos pocos agregados grandes dominan la señal. Una discrepancia de un factor dos entre DLS y TEM es normal; un factor cuatro sugiere agregación. La respuesta correcta a la pregunta nunca es un número solo, sino los tres con su técnica indicada.'},
  {t:'La secuencia lógica',p:'Ante una muestra desconocida, el orden importa. Primero lo no destructivo y barato, después lo destructivo y caro.\n\nUna secuencia razonable empieza con DRX para identificar la fase, sigue con FTIR o Raman para grupos funcionales y fases amorfas que la DRX no ve, continúa con SEM y EDS para morfología y composición elemental, añade TEM si se necesita resolver por debajo de 20 nm, usa BET si interesa el área superficial, TGA para cuantificar contenido orgánico, y deja para el final la digestión ácida con ICP-MS para impurezas traza, que destruye la muestra.\n\nJustificar el ORDEN vale tanto como listar las técnicas, y es lo que distingue una respuesta completa.'}
 ],
 clave:['Organiza por pregunta, no por técnica: qué es, cómo se ve, qué hay en la superficie, cómo responde al calor.','TEM da núcleo, Scherrer da cristalito y DLS da diámetro hidrodinámico. Son tres números distintos y correctos.','Secuencia: no destructivo antes que destructivo, estructural antes que cuantificación fina.'],
 check:[
  {q:'DLS reporta 85 nm y TEM 22 nm para la misma muestra. ¿Cuál reportas?',
   a:'Ambos, indicando la técnica. TEM da el núcleo y DLS el hidrodinámico, que naturalmente es mayor. Pero un factor cercano a cuatro es demasiado para explicarse solo por solvatación, así que además hay agregación parcial, confirmable con el índice de polidispersidad y el potencial zeta.'},
  {q:'¿Por qué convendría hacer DRX antes que ICP-MS en una muestra desconocida?',
   a:'Porque DRX es no destructiva, rápida y da la fase cristalina, que suele identificar el material de una vez. ICP-MS requiere digestión ácida que destruye la muestra, así que se reserva para cuando ya sabes qué buscas y necesitas cuantificar trazas.'}
 ],
 conc:['radiacion-materia','drx','microscopia-e','dls','scherrer']},

{m:'M7',t:'Ver la estructura: difracción y microscopía',dur:30,
 obj:['Aplicar Bragg y Scherrer con las unidades correctas','Distinguir SEM, TEM, STEM y sus detectores','Explicar por qué los electrones superan el límite óptico'],
 sec:[
  {t:'Bragg: interferencia en un cristal',p:'W. L. Bragg trató los planos cristalinos como espejos semitransparentes. La diferencia de camino entre rayos reflejados por planos consecutivos es 2d·senθ, y hay interferencia constructiva cuando esa diferencia es un múltiplo entero de la longitud de onda: nλ = 2d·senθ.\n\nDos advertencias prácticas. Primera, θ es la MITAD del ángulo 2θ que reporta el difractómetro, y confundirlos es el error más común del tema. Segunda, como senθ no puede superar 1, solo se observan planos con d mayor que λ/2; con radiación de cobre, eso significa d por encima de 0.077 nm.\n\nCombinando Bragg con la distancia interplanar de la lección de cristalografía se indexan los picos y se obtiene el parámetro de red. Y un material amorfo no da picos sino un halo ancho, lo cual también es información.'},
  {t:'Scherrer y sus límites',p:'Un cristal finito no produce un pico infinitamente estrecho: cuantos menos planos difractan, más ancho el pico. Scherrer lo formalizó en 1918 y Patterson lo derivó rigurosamente en 1939, estableciendo el factor de forma K cercano a 0.9.\n\nLa fórmula es D = Kλ/(β·cosθ), con β el ensanchamiento en RADIANES y corregido por el ensanchamiento instrumental. Para pasar de grados a radianes se multiplica por π/180.\n\nSus límites hay que declararlos. Da tamaño de cristalito, no de partícula. Deja de ser confiable por encima de unos 100 a 200 nm, donde el ensanchamiento instrumental domina. Y sobre todo, ignora la microdeformación, que en muestras molidas o deformadas puede ser la contribución principal. Para separarlas se usa Williamson-Hall, aprovechando que la contribución de tamaño escala como 1/cosθ y la de deformación como tanθ.'},
  {t:'Por qué los electrones ven más',p:'El límite de resolución óptico viene de la difracción y es del orden de la mitad de la longitud de onda. Con luz visible, eso son unos 200 nm, insuficiente para ver una nanopartícula.\n\nLa salida es cambiar de sonda. Por la relación de de Broglie, λ = h/p, un electrón acelerado a 100 kV tiene longitud de onda de unos 3.7 pm, cinco órdenes de magnitud menor que la luz visible. Esa es la razón física de que un TEM alcance resolución sub-ångström. En la práctica el límite real no lo pone λ sino las aberraciones de las lentes electromagnéticas.'},
  {t:'La familia de microscopios electrónicos',p:'El SEM barre un haz sobre la superficie y detecta electrones secundarios, que dan topografía, o retrodispersados, que dan contraste por número atómico. Admite muestras gruesas y su resolución típica está en el rango de nanómetros.\n\nEl TEM transmite el haz a través de una muestra ultradelgada, por debajo de unos 100 nm, y revela estructura interna y franjas de red. El STEM barre un haz finísimo a través de esa muestra; con detector anular de campo oscuro el contraste depende fuertemente del número atómico.\n\nLos detectores acoplados añaden composición. EDS mide rayos X característicos y da composición elemental local, aunque es débil para elementos ligeros. EELS analiza la energía perdida por los electrones transmitidos y precisamente ahí destaca: es sensible a carbono, nitrógeno y oxígeno, y aporta estado químico. Son complementarios.\n\nY el FIB, con su haz de iones, corta con precisión nanométrica: sirve para preparar láminas de TEM y hacer cortes transversales de un dispositivo, con la advertencia de que implanta galio y daña la zona cortada.'}
 ],
 clave:['En Bragg, θ es la mitad del 2θ que reporta el equipo. Es el error más frecuente del módulo.','Scherrer da tamaño de cristalito y no distingue la microdeformación; para eso está Williamson-Hall.','EDS es débil en elementos ligeros; EELS destaca justo ahí. Son complementarios.'],
 check:[
  {q:'Un pico aparece a 2θ = 38.5° con FWHM de 0.35°. Con Cu Kα y K = 0.9, calcula el tamaño de cristalito.',
   a:'θ = 19.25°, cos θ = 0.944. β = 0.35 × π/180 = 0.00611 rad. D = (0.9 × 0.15406)/(0.00611 × 0.944) = 0.13865/0.005768 ≈ 24 nm.'},
  {q:'Tras moler una muestra, sus picos de DRX se ensanchan. Da dos explicaciones y cómo distinguirlas.',
   a:'Reducción del tamaño de cristalito o introducción de microdeformación por dislocaciones. Se distinguen con Williamson-Hall, graficando β·cosθ contra senθ: la ordenada da el tamaño y la pendiente la deformación. Un recocido suave que afine los picos indicaría que dominaba la deformación.'}
 ],
 conc:['drx','scherrer','microscopia-e','stem-eels','fib','spm']},

{m:'M7',t:'Composición, superficie y respuesta térmica',dur:30,
 obj:['Elegir entre las espectroscopías según la información buscada','Aplicar la complementariedad IR-Raman y la regla de exclusión mutua','Interpretar TGA y DSC y no confundir lo que mide cada uno'],
 sec:[
  {t:'Espectroscopía atómica: contar átomos',p:'Cuando la pregunta es cuánto hay de un elemento, se atomiza la muestra y se mide la interacción de esos átomos libres con la luz. La absorción atómica de llama es muy sensible pero esencialmente monoelemental, porque necesita una lámpara específica por elemento. El plasma acoplado inductivamente permite análisis multielemental simultáneo, con ICP-OES midiendo emisión e ICP-MS midiendo masa, este último alcanzando partes por billón.\n\nEs la elección obligada para metales traza, y su base teórica es la misma estructura de niveles atómicos de la lección de Bohr.'},
  {t:'Vibracional: FTIR y Raman',p:'Ambas informan sobre enlaces y grupos funcionales, pero por mecanismos distintos, y ahí está la pregunta de examen. Un modo vibracional es activo en INFRARROJO si durante la vibración cambia el MOMENTO DIPOLAR. Es activo en RAMAN si cambia la POLARIZABILIDAD.\n\nLa consecuencia es que son complementarias. Enlaces muy polares como C=O y O–H dan señal IR intensa; vibraciones simétricas de enlaces poco polares como C–C o S–S dan señal Raman intensa. En moléculas con centro de inversión aplica la regla de exclusión mutua: ningún modo puede ser activo en ambas a la vez, lo que convierte la comparación en una prueba experimental de simetría.\n\nUna diferencia práctica relevante: el agua da señal IR muy fuerte y Raman débil, así que Raman es preferible para muestras acuosas y biológicas. Y la variante SERS, amplificada por nanoestructuras plasmónicas, lleva la sensibilidad hasta molécula única.'},
  {t:'La superficie tiene su propia técnica',p:'En nanotecnología la superficie manda, y hay una técnica dedicada. XPS irradia con rayos X y mide la energía cinética de los fotoelectrones emitidos; la energía de enlace resultante identifica el elemento Y su estado químico, algo que EDS no puede hacer.\n\nSu profundidad de análisis es de apenas 2 a 10 nm, lo que la vuelve ideal para verificar una funcionalización, confirmar que una coraza realmente cubre el núcleo, o determinar el estado de oxidación de un catalizador. El precio es que requiere ultra alto vacío.\n\nPara topografía y superficie también están las microscopías de sonda de barrido. AFM mide fuerzas punta-superficie, da topografía tridimensional real, funciona en aislantes y en líquido, y admite modo tapping para no dañar muestras blandas. STM mide corriente túnel y alcanza resolución atómica, pero exige superficie conductora.'},
  {t:'Análisis térmico: dos preguntas distintas',p:'TGA mide MASA en función de la temperatura. Cada escalón corresponde a algo identificable: pérdida por debajo de 150 °C suele ser agua y disolvente adsorbidos; entre 200 y 500 °C, materia orgánica como ligandos o surfactantes; por encima, descomposición de la fase inorgánica. Es la forma estándar de cuantificar cuánto recubrimiento orgánico lleva una nanopartícula.\n\nDSC mide FLUJO DE CALOR, es decir energía. Detecta fusión, cristalización, curado y, de manera exclusiva, la transición vítrea. La Tg es una transición de segundo orden sin cambio de masa ni entalpía latente, así que aparece como un escalón en la línea base y TGA es completamente ciego a ella.\n\nLa pregunta trampa clásica es con qué técnica mides Tg, y la respuesta nunca es TGA. Los equipos modernos son simultáneos precisamente para saber si un evento térmico va acompañado de pérdida de masa.\n\nFinalmente, para porosidad y área superficial está BET por adsorción de nitrógeno, con BJH para la distribución de tamaño de poro. Comparar el área BET antes y después de cargar un material mesoporoso es la evidencia de que el poro se llenó.'}
 ],
 clave:['IR requiere cambio de momento dipolar; Raman, de polarizabilidad. En moléculas centrosimétricas se excluyen mutuamente.','XPS da composición Y estado químico de los primeros nanómetros; EDS no da estado químico.','TGA mide masa, DSC mide energía. Solo DSC ve la transición vítrea.'],
 check:[
  {q:'Quieres confirmar que una coraza de sílice cubre realmente tu núcleo magnético. ¿Qué técnicas usas y qué esperas ver?',
   a:'TEM para ver el contraste núcleo-coraza y medir espesor. XPS para confirmar que el silicio está en la superficie y el hierro atenuado. FTIR para la banda Si–O–Si cerca de 1080 cm⁻¹. Potencial zeta, que debe desplazarse hacia los valores típicos de sílice. Y TGA o VSM para verificar cuánta magnetización por masa se diluyó.'},
  {q:'¿Por qué Raman es preferible a FTIR para estudiar una muestra biológica en solución acuosa?',
   a:'Porque el agua absorbe muy fuerte en el infrarrojo y satura el espectro, mientras que su señal Raman es débil. Eso deja ver las bandas del analito sin que el disolvente las tape.'}
 ],
 conc:['atomica','ftir-raman','xps','termico','fluorescencia','fosforescencia','superres','adsorcion']},

/* ---------- M8 ---------- */
{m:'M8',t:'Luz y materia: de Maxwell al plasmón',dur:30,
 obj:['Conectar las ecuaciones de Maxwell con la respuesta óptica de un material','Explicar los modelos de Lorentz y Drude y la frecuencia de plasma','Aplicar Fresnel, reflexión total interna y onda evanescente'],
 sec:[
  {t:'La luz como onda y la materia como osciladores',p:'Las ecuaciones de Maxwell predicen que una perturbación acoplada de campos eléctrico y magnético se propaga a velocidad c = 1/√(ε₀μ₀), valor que coincidió con la velocidad medida de la luz. Ese fue uno de los grandes momentos de la física del siglo XIX.\n\nPara describir qué pasa cuando esa onda entra en un material, el curso de nanosistemas fotónicos usa un modelo mecánico sorprendentemente simple: trata a cada electrón ligado como una masa unida por un resorte, con fricción, forzada por el campo eléctrico de la luz. Es literalmente la segunda ley de Newton con tres términos, el oscilador armónico amortiguado y forzado.\n\nAl multiplicar el desplazamiento resultante por la carga y por la densidad de electrones se obtiene la polarización del medio, y de ahí la función dieléctrica ε(ω). Ese es el puente entre lo microscópico y lo macroscópico.'},
  {t:'Lorentz, Drude y por qué los metales brillan',p:'El modelo de Lorentz da ε(ω) para electrones LIGADOS, con una resonancia en la frecuencia natural ω₀. El modelo de Drude es el mismo resultado con ω₀ = 0, es decir electrones LIBRES sin fuerza restauradora: el caso de un metal.\n\nDe Drude sale la frecuencia de plasma ω_p, que depende de la densidad de electrones libres. Por debajo de ω_p la parte real de la función dieléctrica es NEGATIVA, la onda no puede propagarse y el metal refleja. Por encima, se vuelve transparente. Como en los metales típicos ω_p cae en el ultravioleta, reflejan todo el visible y por eso los vemos brillantes y plateados.\n\nEl oro y la plata se salen del modelo puro porque tienen además transiciones interbanda en el visible, y son justamente esas las que dan al oro su color amarillo característico.\n\nUn detalle que unifica: el índice de refracción es la raíz de la función dieléctrica, y como ε es COMPLEJA, el índice también lo es. Su parte imaginaria describe la absorción. No es un artificio matemático.'},
  {t:'Interfaces: Fresnel y el ángulo crítico',p:'Snell da la dirección del rayo refractado; las ecuaciones de Fresnel dan CUÁNTA luz se refleja y se transmite, y además dependen de la polarización. De ahí sale el ángulo de Brewster, donde la reflexión de la componente p se anula.\n\nEn incidencia normal, la reflectancia es ((n₁−n₂)/(n₁+n₂))², lo que da alrededor del 4 % por cara en una interfaz aire-vidrio. Ese número explica por qué existen los recubrimientos antirreflejantes.\n\nCuando la luz pasa de un medio más denso a uno menos denso y supera el ángulo crítico, ocurre reflexión total interna. Es la base del guiado en fibras ópticas.'},
  {t:'La onda evanescente y el plasmón como sensores',p:'En reflexión total interna, la ley de Snell exigiría un seno mayor que uno, lo que hace imaginario el vector de onda transmitido. El resultado físico es un campo que decae exponencialmente hacia el segundo medio sin transportar energía neta: la onda evanescente, con profundidad de penetración típica de 100 a 200 nm.\n\nEsa profundidad es comparable al tamaño de una nanopartícula o de una capa de proteínas, y ahí está su valor: un sensor basado en onda evanescente solo ve lo que está pegado a la superficie e ignora el resto de la muestra. Es el principio de la microscopía TIRF y del ATR en infrarrojo.\n\nCuando el metal entra en juego aparece el plasmón. En una nanopartícula, la resonancia localizada depende del tamaño, la forma y sobre todo del índice de refracción del entorno inmediato. Por eso un desplazamiento de la banda de plasmón delata que algo se unió a la superficie, y eso convierte una suspensión de oro en un biosensor. La misma física, amplificando el campo local en puntos calientes, es la que hace posible SERS.'}
 ],
 clave:['La función dieléctrica sale de tratar a los electrones como osciladores forzados por la luz.','Por debajo de ω_p la parte real de ε es negativa y el metal refleja; por encima se vuelve transparente.','La onda evanescente penetra 100–200 nm: por eso los sensores de superficie ignoran el resto de la muestra.'],
 check:[
  {q:'¿Por qué el índice de refracción se describe como un número complejo?',
   a:'Porque n = √ε y la función dieléctrica es compleja. La parte real describe la velocidad de propagación y la refracción; la parte imaginaria describe la absorción del medio. Un medio transparente tiene parte imaginaria casi nula.'},
  {q:'Una nanopartícula de oro cambia su banda de plasmón de 520 a 528 nm al incubarla con proteína. ¿Por qué?',
   a:'Porque la proteína adsorbida aumenta el índice de refracción del entorno inmediato de la partícula, y la posición de la resonancia plasmónica depende de ese índice. El desplazamiento al rojo es la señal analítica del sensor.'}
 ],
 conc:['onda-em','funcion-dielectrica','drude','fresnel','evanescente','plasmon','secciones','optica-geom']},

{m:'M8',t:'Fluidos a microescala: el mundo sin turbulencia',dur:30,
 obj:['Interpretar el número de Reynolds y sus consecuencias de diseño','Aplicar Hagen-Poiseuille y la analogía con circuitos','Comparar flujo por presión con flujo electroosmótico'],
 sec:[
  {t:'Un régimen físico distinto',p:'En un microcanal típico, con diámetro de 100 µm y velocidad de 1 mm/s, el número de Reynolds vale alrededor de 0.1. Muy por debajo de 1. Eso significa que las fuerzas viscosas dominan por completo sobre las inerciales, y la consecuencia es que NUNCA hay turbulencia.\n\nEsto reordena la intuición. Agitar no sirve: no se forman remolinos. Dos corrientes que se juntan viajan en paralelo y solo se mezclan por difusión molecular, que es lenta porque el tiempo de difusión escala con el cuadrado de la distancia.\n\nEl número de Péclet cuantifica ese compromiso entre convección y difusión, y de él sale cuánta longitud de canal se necesita para mezclar. Las soluciones de diseño son geométricas: mezcladores caóticos con estructuras en el fondo que pliegan las corrientes, serpentinas que dividen y recombinan, o microfluídica de gotas donde la circulación interna mezcla el contenido.\n\nY conviene notar que el régimen laminar también es una virtud: cuando quieres gradientes estables o enfoque hidrodinámico preciso, la ausencia de turbulencia es exactamente lo que necesitas.'},
  {t:'Poiseuille y la tiranía de r⁴',p:'Para flujo laminar en un tubo cilíndrico, integrar el balance entre presión y esfuerzo viscoso da el perfil parabólico de velocidad y el caudal Q = πΔP·r⁴/(8µL).\n\nEsa cuarta potencia domina el diseño. Reducir el radio a la mitad reduce el caudal DIECISÉIS veces con la misma presión, o exige dieciséis veces más presión para el mismo caudal. Es la razón de que los canales muy finos sean difíciles de bombear.\n\nUna forma elegante de manejarlo es la analogía eléctrica: ΔP = Q·R_hid, idéntica en forma a V = I·R. La presión hace de voltaje, el caudal de corriente y la resistencia hidráulica vale 8µL/(πr⁴). Con eso, un circuito microfluídico se analiza con las reglas de Kirchhoff, sumando resistencias en serie y en paralelo exactamente igual que en electrónica.'},
  {t:'Bombear sin bombas',p:'La alternativa a la presión es la electrocinética. Cerca de una pared cargada se forma una doble capa eléctrica, y al aplicar un campo tangencial, los iones de esa capa arrastran al fluido: es el flujo electroosmótico.\n\nSu característica distintiva, y el reactivo de examen más frecuente del tema, es el perfil de velocidad. Como el arrastre ocurre en la delgada doble capa junto a la pared, el fluido se mueve como un bloque: perfil TIPO TAPÓN, esencialmente plano. El flujo por presión, en cambio, es PARABÓLICO.\n\nLa consecuencia analítica es importante: el perfil parabólico dispersa la banda de muestra y ensancha los picos de separación, mientras el plano preserva la resolución. Por eso las separaciones electroforéticas en chip usan electroósmosis. Además no requiere bombas voluminosas, solo electrodos, lo que favorece la miniaturización.\n\nSus límites también hay que conocerlos: depende del pH y de la carga de la pared, que puede cambiar por adsorción de proteínas, y requiere alto voltaje, lo que genera calentamiento Joule con potencia proporcional al CUADRADO del campo.'},
  {t:'Manipular partículas y el lab-on-a-chip',p:'La electroforesis mueve partículas cargadas; la dielectroforesis mueve partículas POLARIZABLES en un campo no uniforme, y por tanto funciona también con partículas neutras. Su fuerza depende de r³ y del factor de Clausius-Mossotti, cuyo signo determina si la partícula es atraída hacia el campo intenso o repelida. En la variante iDEP, que es la línea de trabajo de tu curso, la no uniformidad la generan postes aislantes en lugar de electrodos metálicos, lo que evita electrólisis pero exige mayor voltaje y por tanto más calentamiento.\n\nTodo esto se integra en el lab-on-a-chip: manipulación de fluidos, reacción y detección en un dispositivo de centímetros, típicamente fabricado en PDMS por litografía suave. Reduce volúmenes a microlitros y tiempos a minutos, lo que habilita el diagnóstico en el punto de atención. Su versión más económica son los dispositivos de papel, donde el líquido fluye por capilaridad sin necesidad de bomba alguna.'}
 ],
 clave:['Re ≪ 1 significa laminar siempre: agitar no mezcla, hay que diseñar geometría o usar gotas.','Q ∝ r⁴: reducir el radio a la mitad divide el caudal entre dieciséis.','Flujo electroosmótico da perfil plano; el de presión, parabólico. Eso decide la resolución de una separación.'],
 check:[
  {q:'Dos microcanales idénticos en paralelo frente a uno solo, con la misma presión. ¿Qué caudal total obtienes?',
   a:'El doble. Por la analogía eléctrica, dos resistencias hidráulicas iguales en paralelo dan la mitad de la resistencia total, y con ΔP fija el caudal se duplica. Es exactamente el razonamiento de un circuito.'},
  {q:'¿Por qué el calentamiento Joule limita más a iDEP que a la dielectroforesis con electrodos metálicos?',
   a:'Porque en iDEP el gradiente lo generan postes aislantes, lo que exige aplicar voltajes bastante mayores para conseguir el mismo gradiente local. Como la potencia disipada va con el cuadrado del campo, ese aumento de voltaje eleva el calentamiento de forma cuadrática.'}
 ],

{m:'M8',t:'Mecánica pequeña: MEMS, resonadores y efectos de escala',dur:25,
 obj:['Explicar por qué las fuerzas superficiales dominan a microescala','Interpretar la frecuencia de resonancia como principio de sensado','Reconocer los modos de falla típicos de un microsistema'],
 sec:[
  {t:'El argumento de escala',p:'Hay un razonamiento de una línea que explica gran parte del comportamiento de los microsistemas: el volumen escala como L³ y la superficie como L². Al reducir el tamaño, el cociente superficie sobre volumen crece, y con él la importancia relativa de todo lo que depende de la superficie.\n\nEl peso, que depende del volumen, se vuelve despreciable: una estructura de MEMS pesa nanogramos y la gravedad es irrelevante para su funcionamiento. En cambio la adhesión, la fricción y las fuerzas de van der Waals, que dependen de la superficie, pasan a dominar.\n\nEs la misma lógica que explica por qué un insecto camina sobre el agua y por qué las nanopartículas se agregan. Un solo argumento, tres contextos.'},
  {t:'Stiction: el modo de falla característico',p:'La consecuencia práctica más importante es el stiction: dos superficies que entran en contacto se quedan pegadas permanentemente y el dispositivo deja de funcionar.\n\nLa causa más frecuente ocurre durante la fabricación, al secar el líquido de grabado: las fuerzas capilares del menisco arrastran las estructuras hasta juntarlas. Las mitigaciones atacan esa física directamente. El secado supercrítico con CO₂ elimina la interfaz líquido-vapor y por tanto la capilaridad. Los recubrimientos antiadherentes de monocapa autoensamblada reducen la energía superficial. Añadir topes o protuberancias reduce el área real de contacto. Y aumentar la rigidez de restitución de la estructura le da más fuerza para despegarse.'},
  {t:'Resonadores como balanzas',p:'Un cantilever o una membrana tienen una frecuencia natural f₀ = (1/2π)√(k/m_ef). Si se adsorbe masa sobre la superficie, la masa efectiva aumenta y la frecuencia BAJA.\n\nDerivando la relación se obtiene Δf/f₀ ≈ −Δm/(2·m_ef). El signo negativo y el factor un medio son lo que se pregunta. Y la lectura de diseño es directa: cuanto menor sea la masa del resonador, mayor será el desplazamiento relativo por unidad de masa capturada. De ahí el interés en pasar de MEMS a NEMS.\n\nSe funcionaliza la superficie con un receptor específico y se tiene un biosensor. Sus límites de desempeño son varios: el factor de calidad Q, que se degrada mucho al operar en líquido por amortiguamiento; el ruido térmico y la deriva de temperatura; la adsorción inespecífica, que se mitiga con bloqueo de superficie y midiendo en modo diferencial contra un cantilever de referencia; y un efecto sutil, el cambio de rigidez por esfuerzo superficial al unirse el analito, que compite con el efecto de masa y puede incluso invertir el signo del corrimiento.'},
  {t:'Del componente al sistema',p:'Un dispositivo real necesita más que un principio físico. Hay que integrar transducción, encapsulado e interconexión, y evaluar el desempeño con figuras de mérito comparables.\n\nEsas figuras son el lenguaje del módulo: sensibilidad, que es la pendiente de la respuesta; resolución; límite de detección, que combina sensibilidad y ruido; rango dinámico; linealidad; histéresis; tiempo de respuesta; selectividad; deriva y repetibilidad.\n\nUna precisión que se pregunta: sensibilidad y límite de detección no son lo mismo. Si al aumentar la sensibilidad el ruido crece en la misma proporción, el LOD no mejora en absoluto. Decir que un sensor es bueno sin dar estas cifras no significa nada.\n\nY en el lado mecánico hay que considerar los esfuerzos residuales de las películas depositadas, que pueden curvar o romper una membrana antes de que llegue a funcionar; se miden por la curvatura del sustrato con la fórmula de Stoney.'}
 ],
 clave:['Superficie escala L² y volumen L³: por eso a microescala manda la adhesión y no el peso.','Adsorber masa BAJA la frecuencia de resonancia, con Δf/f₀ ≈ −Δm/(2m).','Sensibilidad y LOD son distintos: más sensibilidad con más ruido no mejora el límite de detección.'],
 check:[
  {q:'¿Por qué el factor de calidad de un resonador cae tanto al sumergirlo en líquido y por qué importa?',
   a:'Porque el líquido amortigua la oscilación por viscosidad, disipando energía en cada ciclo. Importa porque un Q bajo ensancha el pico de resonancia y hace más difícil resolver desplazamientos pequeños de frecuencia, degradando el límite de detección.'},
  {q:'Un biosensor de cantilever muestra corrimiento de frecuencia con muestras que no contienen el analito. ¿Qué investigas?',
   a:'Adsorción inespecífica de otras moléculas de la matriz, que añaden masa sin ser el blanco. Se ataca bloqueando la superficie con BSA o PEG y midiendo en modo diferencial contra un cantilever idéntico sin receptor, restando su señal.'}
 ],
 conc:['mems','resonador','efecto-escala','micromecanica','param-sensores','mecanicas']},

{m:'M8',t:'Del principio al sensor: electroquímica aplicada',dur:30,
 obj:['Interpretar un voltamperograma cíclico y extraer área electroactiva','Aplicar Randles-Ševčík con las unidades correctas','Diseñar y evaluar un biosensor enzimático'],
 sec:[
  {t:'La voltamperometría como diagnóstico',p:'Antes de construir un sensor hay que caracterizar el electrodo, y la herramienta básica es la voltamperometría cíclica: se barre el potencial de ida y vuelta mientras se registra la corriente, usando una sonda redox conocida como el ferricianuro.\n\nDel voltamperograma se leen tres cosas. La separación entre picos, que para un sistema reversible vale unos 59/n mV y crece si el proceso es lento. El cociente entre corrientes de pico anódica y catódica, cercano a 1 si es reversible. Y la magnitud de la corriente, que da el área ELECTROACTIVA real.\n\nEsa última es importante porque suele diferir del área geométrica: al depositar nanopartículas sobre el electrodo, la rugosidad aumenta la superficie disponible. Comparar ambas áreas es lo que permite decir si la mejora vino de más superficie o de mejor catálisis.'},
  {t:'Randles-Ševčík y sus unidades',p:'Para un sistema reversible controlado por difusión, la corriente de pico es i_p = 2.69×10⁵·n^(3/2)·A·D^(1/2)·v^(1/2)·C.\n\nLa trampa está en las unidades: la concentración va en mol·cm⁻³, no en mol·L⁻¹. Una disolución 1 mM son 1×10⁻⁶ mol·cm⁻³, y olvidarlo produce un error de mil.\n\nLa dependencia con la raíz de la velocidad de barrido tiene valor diagnóstico. Si al graficar i_p contra √v sale una recta, el proceso está controlado por difusión. Si en cambio i_p resulta proporcional a v y no a su raíz, la especie está ADSORBIDA en el electrodo, no difundiendo desde el seno de la disolución. Es una prueba experimental limpia para distinguir ambos casos.'},
  {t:'Construir un biosensor enzimático',p:'El caso central de tu curso es el sensor de glucosa. Se inmoviliza glucosa oxidasa sobre un electrodo modificado con nanopartículas, y se mide la corriente que resulta de la reacción enzimática.\n\nHay tres generaciones. La primera mide el oxígeno consumido o el peróxido generado, y su debilidad es que depende del oxígeno disuelto, que varía. La segunda usa un mediador redox que transporta los electrones entre la enzima y el electrodo, lo que permite operar a un potencial menos oxidante; su debilidad es que el mediador puede lixiviarse. La tercera busca transferencia electrónica directa entre enzima y electrodo.\n\nLa calibración da la sensibilidad como pendiente, y conviene normalizarla por área para poder comparar contra otros trabajos: reportar sensibilidades brutas de electrodos de distinto tamaño no significa nada. El límite de detección se calcula con el criterio de tres sigma sobre esa pendiente.'},
  {t:'Los dos problemas reales',p:'El primero es el rango lineal. La enzima sigue cinética de Michaelis-Menten, así que la respuesta es lineal solo mientras la concentración sea bastante menor que Km. Por encima, la enzima se satura, la curva se aplana y la sensibilidad cae justo en el rango que puede interesar clínicamente. Las soluciones son aumentar la carga enzimática, poner una membrana externa que limite la difusión de sustrato hacia la enzima y así extienda artificialmente el rango, diluir la muestra, o calibrar con un modelo no lineal.\n\nEl segundo es la interferencia. En sangre real hay ácido ascórbico, ácido úrico y paracetamol, todos electroactivos a potenciales cercanos, que suman corriente ajena al analito. Se ataca bajando el potencial de trabajo con un mediador, recubriendo con una membrana permselectiva como Nafion, que repele aniones, o midiendo diferencialmente contra un electrodo sin enzima.\n\nY para completar el módulo, el electrodo selectivo de ion aplica la misma lógica potenciométrica: pendiente cercana a 59.2 mV por década para monovalentes, coeficiente de selectividad frente a interferentes, y la advertencia de que mide actividad y no concentración, por lo que hay que fijar la fuerza iónica.'}
 ],
 clave:['En Randles-Ševčík la concentración va en mol·cm⁻³: 1 mM = 1×10⁻⁶ mol·cm⁻³.','Si i_p es proporcional a v y no a √v, la especie está adsorbida, no difundiendo.','El rango lineal de un biosensor termina cuando la concentración se acerca a Km.'],
 check:[
  {q:'Calculas i_p esperada de 10.9 µA y mides 25 µA. ¿Qué concluyes y cómo lo reportas?',
   a:'Que el área electroactiva real es mayor que la geométrica, porque las nanopartículas depositadas aumentaron la rugosidad. Se despeja A de la ecuación de Randles-Ševčík y se reporta ese valor como área electroactiva, que es la magnitud correcta para normalizar la sensibilidad.'},
  {q:'¿Por qué un mediador redox reduce la interferencia del ácido ascórbico?',
   a:'Porque permite detectar a un potencial de trabajo menos oxidante. El ácido ascórbico se oxida a potenciales relativamente altos; si el sensor opera por debajo de ese umbral, el interferente simplemente no reacciona en el electrodo.'}
 ],
 conc:['voltamperometria','electrodo-modificado','biosensor-enzimatico','ise','enzimas','param-sensores']},

{m:'M10',t:'Sistemas dispersos: hacer y mantener una mezcla imposible',dur:30,
 obj:['Elegir surfactante por HLB y predecir el tipo de emulsión','Distinguir los mecanismos de desestabilización y sus remedios','Comparar estabilización electrostática y estérica'],
 sec:[
  {t:'Termodinámicamente condenados',p:'Una emulsión de aceite en agua no es estable. Crear área interfacial cuesta energía, y el sistema siempre preferirá separarse en dos fases. Lo único que se puede hacer es frenar el proceso lo suficiente para que el producto dure su vida de anaquel.\n\nEsa es la mentalidad correcta del módulo: no se busca estabilidad termodinámica, que es imposible, sino estabilidad CINÉTICA. Todas las estrategias son formas de levantar barreras o de ralentizar el transporte.'},
  {t:'El surfactante y la escala HLB',p:'Un surfactante tiene una parte hidrofílica y una lipofílica, y se coloca en la interfaz reduciendo la tensión interfacial. Por encima de la concentración micelar crítica, las moléculas sobrantes se autoensamblan en micelas.\n\nGriffin propuso la escala HLB, que es 20 veces la fracción de masa de la porción hidrofílica. Su valor predictivo es directo: HLB entre 3 y 6 favorece emulsiones de agua en aceite, y entre 8 y 18, de aceite en agua. La lógica es que el surfactante se disuelve mejor en la fase que le corresponde, y esa fase termina siendo la continua.\n\nEs una regla empírica y no aplica bien a surfactantes iónicos, donde la escala se extiende por encima de 20. Tampoco predice estabilidad a largo plazo, solo el tipo de emulsión probable.'},
  {t:'Cuatro formas de fracasar',p:'Conviene distinguirlas porque los remedios son distintos.\n\nEl CREMADO y la sedimentación son separación por gravedad, gobernada por la ley de Stokes: la velocidad depende del cuadrado del diámetro y de la diferencia de densidades. Se frenan reduciendo el tamaño de gota, igualando densidades o aumentando la viscosidad.\n\nLa FLOCULACIÓN es agregación reversible sin fusión de gotas. La COALESCENCIA es irreversible: la película interfacial se rompe y dos gotas se funden en una. Ambas se atacan con la estabilización que discutimos en DLVO.\n\nY la MADURACIÓN DE OSTWALD es la más sutil, porque las gotas nunca se tocan: el material migra disuelto de las pequeñas a las grandes por diferencia de solubilidad debida a la curvatura. Por eso la solución es distinta y contraintuitiva: se añade a la fase dispersa un componente muy insoluble en la continua, que no puede migrar y genera una presión osmótica interna que contrarresta el efecto. Ese es el truco del agente atrapador osmótico.'},
  {t:'Dos formas de estabilizar',p:'La estabilización ELECTROSTÁTICA confiere carga superficial y se mide con el potencial zeta, con el criterio práctico de que por encima de unos 30 mV en valor absoluto la suspensión es estable. Su punto débil es la sal: al aumentar la fuerza iónica la doble capa se comprime, la longitud de Debye se acorta y la barrera desaparece.\n\nLa estabilización ESTÉRICA usa polímeros adsorbidos o injertados que imponen una barrera física. Al no depender de la doble capa, tolera alta fuerza iónica y medios no acuosos.\n\nEsa diferencia es la que decide en aplicaciones biológicas: un medio de cultivo o el plasma tienen fuerza iónica alta, así que una suspensión estabilizada solo por carga colapsa al entrar. Por eso las nanopartículas destinadas a uso biológico se PEGilan. Frecuentemente se combinan ambas, en lo que se llama estabilización electroestérica.'}
 ],
 clave:['Una emulsión nunca es termodinámicamente estable: se busca estabilidad cinética.','HLB alto da aceite en agua; HLB bajo da agua en aceite.','Ostwald no requiere contacto entre gotas; se combate con un agente atrapador insoluble, no con más surfactante.'],
 check:[
  {q:'Tu crema se separa en dos fases tras un mes, pero al agitarla se recompone perfectamente. ¿Qué mecanismo es y qué harías?',
   a:'Es cremado o floculación, no coalescencia, precisamente porque es reversible con agitación. Se ataca reduciendo el tamaño de gota, aproximando densidades entre fases o aumentando la viscosidad de la fase continua con un espesante.'},
  {q:'¿Por qué aumentar la concentración de surfactante no resuelve la maduración de Ostwald?',
   a:'Porque Ostwald no ocurre por falta de barrera entre gotas, sino por transporte molecular a través de la fase continua debido a la diferencia de solubilidad por curvatura. Más surfactante no impide que las moléculas difundan; incluso puede acelerarlo si las micelas facilitan el transporte.'}
 ],
 conc:['coloide','emulsion','estabilizacion','dlvo','potencial-zeta','ostwald']},

{m:'M10',t:'Del compuesto al fármaco: SAR, ADME y nanomedicina',dur:30,
 obj:['Interpretar curvas dosis-respuesta e IC50','Explicar las etapas ADME y la regla de Lipinski','Analizar críticamente el efecto EPR y la corona proteica'],
 sec:[
  {t:'La misma matemática otra vez',p:'La unión de un fármaco a su receptor es un equilibrio reversible descrito por una constante de disociación Kd. La ocupación del receptor sigue [L]/(Kd + [L]), y cuando la concentración de ligando iguala Kd, la ocupación es del 50 %.\n\nEsa expresión es idéntica en forma a la isoterma de Langmuir de adsorción y a la ecuación de Michaelis-Menten de enzimas. Tres temas de tres módulos distintos con la misma hipérbola de saturación: sitios finitos que se llenan, respuesta lineal a baja concentración, meseta a alta. Reconocerlo ahorra memorizar tres cosas.\n\nEn la práctica se reportan IC50 y EC50, y aquí la regla que más se pregunta: un valor MENOR significa MAYOR potencia, porque se necesita menos compuesto para el mismo efecto.'},
  {t:'Que funcione no basta: hay que llegar',p:'Un compuesto potente in vitro es inútil si no alcanza su blanco. De eso se ocupa la farmacocinética, resumida en ADME: absorción, distribución, metabolismo y excreción.\n\nSus parámetros son pocos y vale la pena tenerlos claros. La constante de eliminación se relaciona con la vida media por k = ln2/t½, la misma exponencial de siempre. El volumen de distribución no es un volumen físico sino el que explicaría la concentración observada. El aclaramiento es el producto de ambos. Y la biodisponibilidad compara el área bajo la curva por vía oral contra la intravenosa.\n\nLa regla de los 5 de Lipinski es un filtro estadístico derivado de compuestos que superaron fase II: masa molecular por debajo de 500, logP por debajo de 5, menos de 5 donadores de hidrógeno y menos de 10 aceptores. Predice absorción oral probable, no eficacia ni seguridad, y no aplica a productos naturales, péptidos ni a sustratos de transportadores activos.'},
  {t:'Nanomedicina: cambiar el envase, no el contenido',p:'La idea central de la nanomedicina es que se puede mejorar el índice terapéutico sin modificar la molécula activa, cambiando cómo se transporta. Los vehículos incluyen liposomas, micelas poliméricas, nanopartículas lipídicas, dendrímeros y sílice mesoporosa.\n\nEl mecanismo de direccionamiento pasivo más citado es el efecto EPR, descrito por Matsumura y Maeda en 1986: la vasculatura tumoral es fenestrada y el drenaje linfático deficiente, así que las nanopartículas se acumulan preferentemente en el tumor. Es PASIVO, y confundirlo con direccionamiento activo por ligandos es un error frecuente.\n\nA eso se suma la liberación estímulo-responsiva, que aprovecha diferencias de pH, potencial redox o presencia de enzimas en el tejido blanco para soltar la carga solo donde interesa.'},
  {t:'Por qué falla al pasar a animal',p:'Este es el punto crítico del módulo y el que da mejores preguntas abiertas. Un sistema que funciona en cultivo celular falla con frecuencia in vivo, y las razones son identificables.\n\nLa primera es la corona proteica. Al entrar en un fluido biológico, las proteínas se adsorben sobre la nanopartícula formando una capa que redefine su identidad. La célula no reconoce la superficie que diseñaste, reconoce la corona. Si se adsorben opsoninas, el sistema fagocítico la elimina rápido; y los ligandos de direccionamiento pueden quedar enterrados y perder función.\n\nLa segunda es la eliminación por hígado y bazo antes de alcanzar el blanco. La tercera son las barreras de transporte, porque in vivo hay que atravesar endotelio y matriz extracelular, y el efecto EPR puede ser mucho más débil de lo supuesto según el modelo tumoral.\n\nY en nanotoxicología hay que corregir un hábito: la masa es mala métrica de dosis. A igual masa, las partículas más pequeñas presentan muchísima más área y número, y las curvas dosis-respuesta de distintos tamaños colapsan cuando se grafican contra área superficial. Conviene reportar las tres métricas.'}
 ],
 clave:['Langmuir, Michaelis-Menten y ocupación de receptor son la misma hipérbola de saturación.','IC50 menor significa mayor potencia. El efecto EPR es direccionamiento pasivo.','La célula no ve tu nanopartícula, ve su corona proteica.'],
 check:[
  {q:'Tu nanopartícula funciona in vitro y falla in vivo. Da tres hipótesis con su prueba.',
   a:'Corona proteica que oculta los ligandos: se prueba incubando en suero y repitiendo el ensayo in vitro con suero completo. Eliminación acelerada por hígado y bazo: se prueba con biodistribución de partículas marcadas. Barrera de transporte o EPR débil en ese modelo: se prueba con histología del tejido blanco y modelos 3D.'},
  {q:'¿Por qué reportar la dosis solo en mg/kg puede subestimar el riesgo de un nanomaterial?',
   a:'Porque a igual masa, un material más fino presenta mucha más área superficial y muchas más partículas, y la respuesta biológica escala con esas magnitudes más que con la masa. Dos lotes con la misma dosis en masa pueden tener toxicidades muy distintas.'}
 ],
 conc:['sar','ligando-receptor','adme','delivery','nanotox','biomoleculas']},

{m:'M10',t:'Del laboratorio al producto: riesgo, regulación y valor',dur:25,
 obj:['Aplicar el enfoque de puntos críticos de control a un proceso','Distinguir factibilidad técnica de viabilidad económica','Usar VPC y BMC para articular una propuesta'],
 sec:[
  {t:'Un producto no es una síntesis que funcionó',p:'La transición de laboratorio a producto exige responder preguntas que no son químicas. Quién lo va a usar y para qué. Cuánto cuesta producirlo. Qué riesgos introduce. Qué permisos requiere. Y si alguien pagaría por él.\n\nEste módulo, que en tu curso de Formulación se trabaja con metodologías de innovación, aporta el lenguaje para responderlas de forma estructurada en lugar de intuitiva.'},
  {t:'Proceso, cadena de valor y control',p:'El primer paso es dibujar el diagrama de proceso completo, del insumo al cliente, e identificar en qué etapas se agrega valor real. Sobre ese mapa se localizan los PUNTOS CRÍTICOS DE CONTROL.\n\nLa definición importa y se pregunta: un punto crítico de control no es cualquier etapa importante, sino aquella donde se puede aplicar control para PREVENIR, ELIMINAR o REDUCIR un peligro a un nivel aceptable. Si el peligro no se puede controlar ahí, ese punto no es crítico aunque sea relevante.\n\nEse enfoque, heredado de HACCP en alimentos, es el que un auditor espera ver y el que convierte un diagrama de proceso en un sistema de calidad.'},
  {t:'Riesgo, ética y regulación',p:'La evaluación de riesgo a la salud y al ambiente debe cubrir todo el ciclo de vida: síntesis, uso y disposición. En nanomateriales hay una particularidad regulatoria que conviene entender: un material con la MISMA composición química puede requerir evaluación toxicológica específica a escala nanométrica, porque su reactividad, biodistribución y toxicidad cambian con el tamaño.\n\nLa norma ISO 80004 fija el vocabulario, definiendo la nanoescala en el rango aproximado de 1 a 100 nm. Y las consideraciones éticas incluyen desde la exposición ocupacional en la producción hasta preguntas de acceso equitativo y de consentimiento en aplicaciones médicas.'},
  {t:'Factibilidad, viabilidad y el lenguaje del valor',p:'Conviene separar tres preguntas que suelen confundirse. La FACTIBILIDAD TÉCNICA pregunta si se puede hacer con la tecnología y los recursos disponibles. La VIABILIDAD ECONÓMICA pregunta si conviene, comparando costos contra alternativas del mercado. Y la VIABILIDAD REGULATORIA pregunta si se permite.\n\nUn proceso puede ser perfectamente factible y económicamente absurdo. Sintetizar nanopartículas de oro monodispersas por haz de electrones es factible; el costo por gramo lo hace impensable frente a la ruta de citrato.\n\nPara articular la propuesta se usan dos lienzos. El Value Proposition Canvas verifica el encaje entre lo que ofreces y los trabajos, dolores y ganancias del cliente. El Business Model Canvas describe cómo se crea, entrega y captura valor en nueve bloques. No son intercambiables: el primero es sobre el encaje producto-cliente, el segundo sobre el modelo completo.\n\nY conviene cerrar el ciclo con la escala TRL de madurez tecnológica, que va del principio básico observado al sistema probado en operación real, porque es el lenguaje con el que agencias e inversionistas evalúan en qué etapa está un desarrollo.'}
 ],
 clave:['Un punto crítico de control es donde se PUEDE controlar el peligro, no simplemente donde es importante.','Factible responde «se puede», viable responde «conviene». Son preguntas distintas.','VPC es sobre encaje producto-cliente; BMC es sobre el modelo de negocio completo.'],
 check:[
  {q:'¿Por qué un nanomaterial con la misma composición química que un material aprobado puede requerir evaluación toxicológica nueva?',
   a:'Porque las propiedades dependientes del tamaño cambian su comportamiento biológico: mayor área reactiva, capacidad de atravesar barreras que el material masivo no atraviesa, distinta biodistribución y posible generación de especies reactivas. La identidad química no basta para predecir el riesgo.'},
  {q:'Tu recubrimiento autolimpiable funciona pero duplica el costo del vidrio. ¿Cómo estructuras el argumento?',
   a:'Separando factibilidad de viabilidad. Técnicamente está resuelto. Económicamente hay que cuantificar el ahorro en limpieza y mantenimiento a lo largo de la vida útil frente al sobrecosto inicial, e identificar el segmento donde ese ahorro es mayor, por ejemplo edificios altos donde limpiar es caro y peligroso. Eso es exactamente el trabajo del VPC.'}
 ],
 conc:['design-thinking','cadena-valor','trl','nanotox','fotocatalisis','wenzel-cassie']},

/* ---------- M9 ---------- */
{m:'M9',t:'Escalar: por qué lo que funciona en 50 mL falla en 5 L',dur:30,
 obj:['Aplicar los criterios de escalamiento y reconocer su incompatibilidad','Identificar el paso limitante de un proceso','Explicar por qué el flujo continuo resuelve el problema de escala'],
 sec:[
  {t:'El problema no es hacer más, es hacer igual',p:'Escalar no es multiplicar cantidades. Al aumentar el volumen, algunas magnitudes escalan de una forma y otras de otra, y es imposible mantenerlas todas constantes. Escalar consiste en elegir cuál sacrificar.\n\nLa raíz del problema es geométrica. Si el volumen crece cien veces, la dimensión característica crece 100^(1/3) ≈ 4.64 veces. Pero el área de intercambio térmico crece solo como el cuadrado, así que la relación área sobre volumen CAE. Calentar o enfriar uniformemente se vuelve más lento, y aparecen gradientes que en el matraz no existían.'},
  {t:'Los criterios y su incompatibilidad',p:'La potencia de agitación escala como P ∝ N³D⁵ y el volumen como D³, así que la potencia por unidad de volumen va como N³D².\n\nSi se decide mantener P/V constante, entonces N³D² debe ser constante, lo que exige N ∝ D^(−2/3). Con D diez veces mayor, la velocidad de agitación cae al 21 %. Pero la velocidad de punta, proporcional a N·D, escala entonces como D^(1/3) y AUMENTA 2.15 veces.\n\nAhí está la incompatibilidad: conservar P/V obliga a que la velocidad de punta cambie. Si en cambio se conservara la velocidad de punta, P/V caería. No hay forma de fijar ambas.\n\nLos criterios candidatos son cuatro: potencia por volumen, velocidad de punta, coeficiente de transferencia de oxígeno k_La y tiempo de mezclado. La elección depende de qué fenómeno limita el proceso: esfuerzo cortante si hay células o cristales frágiles, k_La si es un cultivo aerobio, tiempo de mezclado si la nucleación debe ser homogénea.'},
  {t:'El caso de las nanopartículas',p:'Aquí el módulo se conecta con síntesis de forma directa. El modelo de LaMer exige que la nucleación ocurra de golpe y de manera uniforme en todo el volumen. Eso requiere que el precursor se distribuya en un tiempo mucho menor que el tiempo de nucleación.\n\nAl escalar, el tiempo de mezclado aumenta. La adición ya no se reparte instantáneamente, se forman zonas locales de alta supersaturación que nuclean antes que el resto, y aparecen poblaciones de distintas edades: distribución bimodal. Ese es exactamente el síntoma que se observa al pasar de matraz a reactor.\n\nEl criterio a conservar, entonces, no es P/V sino el tiempo de mezclado o el micromezclado en la zona de inyección. Y como el tiempo total de proceso también se alarga, hay más margen para la maduración de Ostwald, que ensancha aún más la distribución.'},
  {t:'Cambiar de paradigma: flujo continuo',p:'Las soluciones dentro del esquema batch son de ingeniería: inyectar por múltiples puntos, usar mezcladores de alta cizalla en la zona de adición, rediseñar impulsor y deflectores, mejorar el intercambio térmico con serpentín interno.\n\nPero existe una salida más elegante. En un reactor de FLUJO CONTINUO el volumen de reacción instantáneo permanece pequeño, del orden de milímetros de canal, y la escala se logra por TIEMPO DE OPERACIÓN en lugar de por tamaño. El mezclado es rápido y reproducible por diseño, y cada elemento de fluido experimenta exactamente la misma historia térmica y de concentración.\n\nEs la respuesta industrial estándar al problema, y conecta con la microfluídica del módulo de dispositivos: el mismo régimen laminar que dificulta mezclar es el que garantiza reproducibilidad.\n\nSobre reactores, conviene tener claro que para una reacción de orden positivo y el mismo volumen, un PFR alcanza mayor conversión que un CSTR, porque el CSTR opera en todo su volumen a la concentración baja de salida mientras el PFR mantiene un perfil de concentración más alto.'}
 ],
 clave:['Conservar P/V obliga a que la velocidad de punta aumente: los criterios son incompatibles.','Al escalar, el tiempo de mezclado crece y rompe la nucleación instantánea que exige LaMer.','El flujo continuo escala por tiempo de operación, no por volumen, y por eso preserva la reproducibilidad.'],
 check:[
  {q:'Escalas un reactor aumentando D diez veces con P/V constante. ¿Qué pasa con N y con la velocidad de punta?',
   a:'N ∝ D^(−2/3), así que cae a 10^(−2/3) = 0.215, es decir al 21.5 %. La velocidad de punta, proporcional a N·D, escala como D^(1/3) = 2.15, así que aumenta un 115 %. Eso puede dañar células o cristales frágiles.'},
  {q:'¿Por qué el problema de la relación área sobre volumen empeora al escalar y qué consecuencia tiene?',
   a:'Porque el área crece como D² y el volumen como D³, así que A/V cae como 1/D. La consecuencia es que la transferencia de calor por unidad de volumen empeora: calentar y enfriar se vuelven lentos y aparecen gradientes térmicos que afectan la nucleación y la selectividad.'}
 ],
 conc:['escalamiento','reactores','balances','reynolds','nucleacion','trl']},

{m:'M9',t:'Investigar bien: diseño experimental e inferencia',dur:30,
 obj:['Diseñar un experimento factorial y justificarlo frente a OFAT','Aplicar propagación de incertidumbre para priorizar mejoras','Interpretar correctamente un valor p'],
 sec:[
  {t:'Variar una variable a la vez es un mal hábito',p:'La forma intuitiva de optimizar es fijar todo y mover una variable. El problema es que ese método no puede detectar INTERACCIONES: si el efecto de la temperatura depende del valor de la concentración, el enfoque de una variable a la vez dará una conclusión falsa.\n\nEl diseño factorial evalúa todas las combinaciones de k factores en dos niveles, con 2^k corridas. Un 2³ son ocho corridas, y con eso se estiman no solo los tres efectos principales sino también las interacciones entre ellos. Además cada corrida contribuye a estimar todos los efectos, así que es más eficiente por dato.\n\nSi hay muchos factores candidatos se empieza con un factorial fraccionado de cribado para descartar los irrelevantes, y si el óptimo cae dentro de la región explorada se pasa a un diseño de superficie de respuesta con puntos centrales para ajustar un modelo cuadrático.'},
  {t:'Tres precauciones que valen tanto como el diseño',p:'La ALEATORIZACIÓN del orden de corrida protege contra factores no controlados que derivan en el tiempo, como el envejecimiento de un reactivo o la deriva de un instrumento. Sin ella, ese efecto se confunde con el de tus variables.\n\nLas RÉPLICAS permiten estimar el error experimental, sin el cual no se puede juzgar si una diferencia es real. Y conviene distinguir réplicas verdaderas, que repiten todo el procedimiento, de réplicas instrumentales, que solo miden varias veces la misma preparación y subestiman la variabilidad real.\n\nEl BLOQUEO controla fuentes conocidas de variabilidad, como el lote de reactivo o el día, sacándolas del error residual.'},
  {t:'Propagación: dónde invertir',p:'La propagación de incertidumbre tiene un uso estratégico que se aprovecha poco. En sumas y restas se combinan las incertidumbres ABSOLUTAS en cuadratura; en productos y cocientes, las RELATIVAS.\n\nSu valor práctico es que identifica cuál medición limita el resultado. Si mides masa con 0.8 % de incertidumbre relativa y volumen con 4.2 %, la densidad hereda 4.3 %: el volumen domina por completo. Comprar una balanza mejor no cambiaría nada; hay que mejorar la medición de volumen.\n\nY los exponentes amplifican: en un volumen calculado como r³, un 1 % de error en el radio se convierte en 3 % en el volumen.'},
  {t:'Qué dice y qué no dice un valor p',p:'Este es el punto donde más gente se equivoca, y da excelentes preguntas de examen. El valor p es la probabilidad de observar datos al menos tan extremos como los tuyos SI la hipótesis nula fuera cierta. No es la probabilidad de que la hipótesis nula sea falsa, ni la probabilidad de que tu hipótesis sea correcta.\n\nEl umbral de 0.05 es una convención arbitraria. Tratar 0.049 y 0.051 como categorías opuestas es un error conceptual: la evidencia es prácticamente idéntica.\n\nLo que sí hay que reportar es el TAMAÑO DEL EFECTO con su intervalo de confianza, que es lo relevante para decidir. Un efecto minúsculo puede ser estadísticamente significativo con n grande, y uno grande puede no serlo con n pequeña. Significancia estadística y relevancia práctica son cosas distintas.\n\nY conviene declarar si el análisis fue preespecificado o exploratorio, y corregir por comparaciones múltiples cuando aplica. La prueba más convincente sigue siendo una réplica independiente.'}
 ],
 clave:['El argumento decisivo a favor del diseño factorial son las interacciones, no solo el ahorro de corridas.','La propagación de incertidumbre dice qué instrumento vale la pena mejorar.','Un valor p no mide el tamaño del efecto ni la probabilidad de que tu hipótesis sea cierta.'],
 check:[
  {q:'Mides m = 2.50 ± 0.02 g y V = 1.20 ± 0.05 mL. ¿Cuál medición deberías mejorar primero?',
   a:'El volumen. Su incertidumbre relativa es 0.05/1.20 = 4.17 %, frente a 0.02/2.50 = 0.8 % de la masa. Combinadas en cuadratura dan 4.24 %, prácticamente igual a la del volumen sola. Mejorar la balanza no cambiaría el resultado.'},
  {q:'Un revisor rechaza tu conclusión porque p = 0.049. ¿Cómo respondes?',
   a:'Reconociendo que el umbral es convencional y que 0.049 y 0.051 son evidencialmente equivalentes, pero sobre todo desplazando la discusión al tamaño del efecto con su intervalo de confianza, que es lo que importa para la decisión. Y ofreciendo una réplica independiente, que pesa más que cualquier umbral.'}
 ],
 conc:['doe','inferencia','propagacion','estadistica','regresion']},

{m:'M9',t:'Prototipar, balancear y elegir reactor',dur:25,
 obj:['Situar un desarrollo en la escala TRL','Plantear un balance de materia y energía','Comparar reactores y usar números adimensionales'],
 sec:[
  {t:'Madurez tecnológica: TRL',p:'Antes de hablar de escalamiento conviene situar el desarrollo. La escala TRL va de 1, principio básico observado, a 9, sistema real probado en entorno operativo. En medio están la prueba de concepto en laboratorio, la validación en entorno relevante y la demostración de un prototipo.\n\nSu utilidad no es burocrática: es el lenguaje con el que agencias e inversionistas evalúan riesgo. Decir que un desarrollo está en TRL 4 comunica de inmediato que funciona en laboratorio pero no se ha probado en condiciones reales, y por tanto qué tipo de financiamiento y qué plazos corresponden.\n\nEl prototipado atraviesa esa escala en etapas: prototipo de concepto, que solo demuestra el principio; funcional, que ya opera; y de preproducción, que además puede fabricarse con procesos reales.'},
  {t:'Balances: la contabilidad del proceso',p:'Todo diseño empieza con un balance sobre un volumen de control: entrada menos salida más generación menos consumo igual a acumulación.\n\nEn estado estacionario la acumulación es cero, y si además no hay reacción química, el balance se reduce a que la entrada iguala a la salida. Ese caso trivial es el punto de partida de cualquier diagrama de flujo.\n\nEl balance de energía sigue la misma estructura, sumando los términos de entalpía de las corrientes, el calor intercambiado y el trabajo. Y aquí reaparece el problema de escala: la relación entre área de intercambio y volumen cae al aumentar el tamaño, así que retirar el calor de una reacción exotérmica se vuelve progresivamente más difícil.'},
  {t:'Elegir reactor',p:'Los tres arquetipos son batch, tanque agitado continuo y flujo pistón. El tiempo espacial τ = V/Q relaciona el volumen con el caudal y hace las veces de tiempo de residencia.\n\nLa comparación que se pregunta es entre CSTR y PFR. En un CSTR se supone mezcla perfecta, así que TODO el reactor está a la concentración de salida, que es la más baja. En un PFR no hay mezcla axial y la concentración va cayendo a lo largo del reactor, manteniéndose en promedio más alta.\n\nComo para órdenes positivos la velocidad crece con la concentración, el PFR alcanza mayor conversión con el mismo volumen. Dicho de otro modo, para la misma conversión el PFR necesita menos volumen. La excepción son las reacciones autocatalíticas, donde conviene tener producto presente y el CSTR puede ganar.\n\nLos reactores reales no son ideales: tienen zonas muertas y cortocircuitos, que se diagnostican con estudios de distribución de tiempos de residencia inyectando un trazador.'},
  {t:'Números adimensionales y similitud',p:'El análisis dimensional produce grupos adimensionales que permiten comparar sistemas de distinto tamaño. Reynolds compara inercia contra viscosidad. Nusselt y Sherwood comparan el transporte total contra el puramente difusivo, de calor y de materia respectivamente. Prandtl y Schmidt comparan la difusividad de momento contra la de calor o de materia.\n\nLa analogía entre calor y masa es directa y vale la pena tenerla: Nusselt corresponde a Sherwood y Prandtl a Schmidt. Una correlación empírica desarrollada para transferencia de calor suele traducirse a transferencia de masa sustituyendo esos pares.\n\nLa similitud completa exigiría igualar geométrica, cinemática y dinámicamente los dos sistemas, lo que en la práctica es imposible. De ahí, otra vez, que escalar sea elegir qué similitud conservar.'}
 ],
 clave:['TRL comunica el riesgo de un desarrollo: 4 es laboratorio, 9 es sistema probado en operación real.','Para orden positivo y mismo volumen, el PFR convierte más que el CSTR.','La analogía calor-masa permite traducir correlaciones: Nu ↔ Sh y Pr ↔ Sc.'],
 check:[
  {q:'¿Por qué un CSTR opera en todo su volumen a la concentración de salida?',
   a:'Porque se supone mezcla perfecta e instantánea: cualquier elemento que entra se dispersa de inmediato en todo el reactor. Por tanto la composición dentro es idéntica a la de la corriente de salida, que es la más baja de todo el proceso.'},
  {q:'Un reactor exotérmico funciona bien a escala de banco y se dispara térmicamente en planta. ¿Cuál es la causa estructural?',
   a:'La relación entre área de intercambio térmico y volumen cae como 1/D al escalar. El calor generado crece con el volumen mientras la capacidad de retirarlo crece solo con el área, así que la temperatura sube y, por Arrhenius, acelera aún más la reacción en un ciclo de retroalimentación.'}
 ],
 conc:['trl','balances','reactores','escalamiento','cinetica']}
];

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
function tablaSimbolos(v){
  var t=el('table','symtab'),filas='';
  v.split('|').forEach(function(seg){
    seg=seg.trim();if(!seg)return;
    var i=seg.indexOf('=');
    var sim=i>0?seg.slice(0,i).trim():'';
    var resto=i>0?seg.slice(i+1).trim():seg;
    var uni='';
    var m=resto.match(/\(([^()]*)\)\s*$/);
    if(m){uni=m[1];resto=resto.slice(0,m.index).trim()}
    if(!sim){filas+='<tr><td colspan="3" style="color:var(--ink2)">'+esc(resto)+(uni?' ('+esc(uni)+')':'')+'</td></tr>';return}
    filas+='<tr><td>'+esc(sim)+'</td><td>'+esc(resto)+'</td><td>'+esc(uni||'—')+'</td></tr>';
  });
  t.innerHTML='<tr><th style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 10px">Símbolo</th><th style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 10px">Significado</th><th style="font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 10px;text-align:right">Unidad</th></tr>'+filas;
  return t;
}

function hoyISO(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function registrarDia(){
  var ds=load('dias',[]);
  var h=hoyISO();
  if(ds.indexOf(h)<0){ds.push(h);ds.sort();if(ds.length>400)ds=ds.slice(-400);save('dias',ds);
    if(RENDER.hoy)RENDER.hoy();}
}
function rachaActual(){
  var ds=load('dias',[]);if(!ds.length)return 0;
  var n=0,d=new Date();
  if(ds.indexOf(hoyISO(d))<0){d.setDate(d.getDate()-1);if(ds.indexOf(hoyISO(d))<0)return 0}
  while(ds.indexOf(hoyISO(d))>=0){n++;d.setDate(d.getDate()-1)}
  return n;
}

    fila4.appendChild(g);
  }

  function filtrar(){
    return Q.map(function(q,i){return i}).filter(function(i){
      var q=Q[i];
      if(fMod!=='TODOS'&&q.b!==fMod)return false;
      if(fTema!=='TODOS'&&temaDe(q)!==fTema)return false;
      if(fTipo==='num'&&!esNumerico(q))return false;
      if(fTipo==='con'&&esNumerico(q))return false;
      if(fEstado==='nuevas'&&r(q).n)return false;
      if(fEstado==='falladas'&&!(r(q).n&&r(q).ok===0))return false;
      if(fEstado==='marcadas'&&!r(q).mk)return false;
      if(fEstado==='dominadas'&&!(r(q).n>=2&&r(q).ok/r(q).n>=0.8))return false;
      return true;
    });
  }
  function armar(){
    pool=filtrar();
    for(var j=pool.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=pool[j];pool[j]=pool[k];pool[k]=t}
    idx=0;respondida=false;tachadas={};
    resumen.innerHTML='<b>'+pool.length+'</b> reactivo'+(pool.length===1?'':'s')+' coinciden con estos filtros';
    pintar();pintarStats();

  bMez.onclick=armar;

  function pintar(){
    marco.innerHTML='';

      marco.appendChild(el('p','muted','Ningún reactivo coincide con estos filtros. Prueba con «Todas» en Estado o cambia de módulo.'));

      return;
    }
    var q=Q[pool[idx]],x=r(q),tema=temaDe(q),num=esNumerico(q),g=guiaDe(q);
    respondida=false;tachadas={};t0=Date.now();

    var hd=el('div','qhead');

    tg.appendChild(el('span','tag',q.b));
    tg.appendChild(el('span','tag tema',esc(tema)));
    tg.appendChild(el('span','tag'+(num?' num':''),num?'numérico':'conceptual'));
    if(x.n)tg.appendChild(el('span','tag hist',x.ok+'/'+x.n+' aciertos · '+Math.round(x.t/x.n)+' s prom.'));
    else tg.appendChild(el('span','tag hist','sin intentos'));

    var der=el('div','row');

    der.appendChild(bm);
    der.appendChild(el('span','counter',(idx+1)+' / '+pool.length));
    hd.appendChild(der);
    marco.appendChild(hd);

    marco.appendChild(el('div','q',esc(q.q)));

    if(guiado&&g){
      var np=0;
      var zonaP=el('div');
      var bp=el('button','btn ghost','Necesito una pista');
      bp.onclick=function(){
        if(np>=g.p.length)return;

        np++;

      };

    var box=el('div');box.style.marginTop='12px';
    q.o.forEach(function(op,i){
      var w=el('div','optwrap');
      var xb=el('button','xbtn'+(tachadas[i]?' on':''),'✕');
      xb.title='Descartar esta opción';
      xb.onclick=function(ev){ev.stopPropagation();if(respondida)return;tachadas[i]=!tachadas[i];
        xb.className='xbtn'+(tachadas[i]?' on':'');

      var b=el('button','opt'+(tachadas[i]?' tach':''),'<b>'+String.fromCharCode(97+i)+')</b> &nbsp;'+esc(op));
      b.onclick=function(){

        var seg=Math.round((Date.now()-t0)/1000);
        var ok=(i===q.r);
        x.n++;x.t+=Math.min(seg,300);if(ok)x.ok++;
        guardar();registrarDia();
        Array.prototype.forEach.call(box.children,function(wr,j){
          var btn=wr.querySelector('.opt');btn.disabled=true;
          wr.querySelector('.xbtn').disabled=true;
          if(j===q.r)btn.className='opt ok';else if(j===i)btn.className='opt no';
        });
        var e=el('div','exp','<b>'+(ok?'Correcto. ':'Incorrecto. La respuesta es '+String.fromCharCode(97+q.r)+'. ')+'</b>'+esc(q.e)+
          ' <span class="muted">· '+seg+' s</span>');
        marco.appendChild(e);
        if(g){
          var db=el('div','disbox');

          marco.appendChild(hh);
          g.d.forEach(function(txt,j){
            var row=el('div','disrow'+(j===q.r?' ok':(j===i&&!ok?' tuya':'')));
            row.innerHTML='<span class="dl">'+String.fromCharCode(97+j)+')</span><span>'+esc(txt)+'</span>';
            db.appendChild(row);
          });
          marco.appendChild(db);

        var nx=el('button','btn',idx===pool.length-1?'Terminar serie':'Siguiente →');
        nx.style.marginTop='14px';
        nx.onclick=function(){idx++;pintar();window.scrollTo(0,0)};
        marco.appendChild(nx);
        pintarStats();
      };
      w.appendChild(xb);w.appendChild(b);
      box.appendChild(w);
    });
    marco.appendChild(box);
    if(!guiado||!g)marco.appendChild(el('p','muted','Descarta opciones con ✕ antes de decidir. Es la técnica que más sube el acierto en opción múltiple.'));

  function pintarStats(){
    panelStats.innerHTML='';
    panelStats.appendChild(el('h2',null,'Tu desempeño por tema'));
    var agg={},tot={n:0,ok:0,t:0};
    Q.forEach(function(q){
      var x=reg[kq(q)];if(!x||!x.n)return;
      var k=q.b+'|'+temaDe(q);
      if(!agg[k])agg[k]={n:0,ok:0,t:0};
      agg[k].n+=x.n;agg[k].ok+=x.ok;agg[k].t+=x.t;
      tot.n+=x.n;tot.ok+=x.ok;tot.t+=x.t;
    });
    if(!tot.n){panelStats.appendChild(el('p','muted','Aún no hay datos. Responde algunos reactivos y aquí verás tu desempeño desglosado por tema, con tus puntos débiles ordenados por prioridad.'));return}
    var g=el('div','grid2');
    [[tot.ok+' / '+tot.n,'respuestas correctas'],[Math.round(100*tot.ok/tot.n)+' %','acierto global'],
     [Math.round(tot.t/tot.n)+' s','tiempo promedio']].forEach(function(s){
      var d=el('div','stat');d.innerHTML='<b>'+s[0]+'</b><span>'+s[1]+'</span>';g.appendChild(d);
    });

    var arr=Object.keys(agg).map(function(k){
      return {k:k,mod:k.split('|')[0],tema:k.split('|')[1],pct:100*agg[k].ok/agg[k].n,n:agg[k].n};
    }).sort(function(a,b){return a.pct-b.pct});
    var debiles=arr.filter(function(a){return a.pct<80}).slice(0,5);
    if(debiles.length){
      panelStats.appendChild(el('h3',null,'Tus temas más débiles'));
      debiles.forEach(function(a){
        var d=el('div','debil');
        var acc=a.pct>=60?'var(--warn)':'var(--bad)';
        d.innerHTML='<span><b>'+a.mod+'</b> · '+esc(a.tema)+' <span class="muted">('+a.n+' intentos)</span></span>';
        var der=el('div','row');

        var b=el('button','btn ghost','Practicar');

        b.onclick=function(){fMod=a.mod;fTema=a.tema;fEstado='todas';fTipo='TODOS';refrescarFiltros();armar();window.scrollTo(0,0)};
        der.appendChild(b);
        d.appendChild(der);
        panelStats.appendChild(d);
      });
    }
    panelStats.appendChild(el('h3',null,'Todos los temas trabajados'));
    var t=el('table');
    t.innerHTML='<tr><th>Módulo</th><th>Tema</th><th style="width:80px">Intentos</th><th style="width:70px">Acierto</th></tr>'+
      arr.slice().sort(function(a,b){return a.mod.localeCompare(b.mod)||a.tema.localeCompare(b.tema)}).map(function(a){
        var acc=a.pct>=80?'var(--accent2)':(a.pct>=60?'var(--warn)':'var(--bad)');
        return '<tr><td>'+a.mod+'</td><td>'+esc(a.tema)+'</td><td>'+a.n+'</td><td style="color:'+acc+';font-weight:650">'+Math.round(a.pct)+' %</td></tr>';
      }).join('');
    panelStats.appendChild(t);
  }

  RENDER.banco=function(){refrescarFiltros();armar()};
  RENDER.bancoFiltro=function(mod,tema){
    fMod=mod||'TODOS';fTema=tema||'TODOS';fEstado='todas';fTipo='TODOS';
    refrescarFiltros();armar();
  };
  refrescarFiltros();armar();
})();

(function(){
  var P=document.getElementById('p-sim');
  var MINUTOS=60, POR_MOD=4;
  var sel=[],resp=[],flags=[],cur=0,t0=0,tick=null,activo=false,restante=0;

  var intro=el('div');P.appendChild(intro);

  function pintarIntro(){

    c.appendChild(el('p',null,'40 reactivos en 60 minutos, <b>sin retroalimentación</b> hasta terminar — igual que el examen real. Se toman 4 reactivos de cada módulo, respetando que todos valen 10 %.'));
    var ul=el('ul');

    intro.appendChild(c);

    if(hist.length){
      var h=el('div','card');
      h.appendChild(el('h2',null,'Historial de simulacros'));

      t.innerHTML='<tr><th>Fecha</th><th>Reactivos</th><th>Aciertos</th><th>%</th><th>Tiempo</th></tr>'+
        hist.slice().reverse().map(function(x){
          return '<tr><td>'+esc(x.f)+'</td><td>'+x.n+'</td><td>'+x.ok+'</td><td><b>'+x.pct+' %</b></td><td>'+esc(x.t)+'</td></tr>'}).join('');
      h.appendChild(t);
      var bb=el('button','btn ghost','Borrar historial');
      bb.onclick=function(){hist=[];save('simhist',hist);pintarIntro()};
      h.appendChild(bb);
      intro.appendChild(h);
    }
  }

  function iniciar(mins,porMod){
    porMod=porMod||POR_MOD;
    sel=[];
    MODULOS.forEach(function(M){
      var pool=[];
      for(var i=0;i<Q.length;i++)if(Q[i].b===M.id)pool.push(i);
      for(var j=pool.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=pool[j];pool[j]=pool[k];pool[k]=t}
      sel=sel.concat(pool.slice(0,porMod));
    });
    for(var j=sel.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=sel[j];sel[j]=sel[k];sel[k]=t}
    resp=sel.map(function(){return -1});
    flags=sel.map(function(){return false});
    cur=0;activo=true;restante=mins*60;t0=Date.now();
    intro.style.display='none';result.style.display='none';juego.style.display='';
    if(tick)clearInterval(tick);
    tick=setInterval(function(){
      restante--;
      var e=document.getElementById('simTimer');
      if(e){e.textContent=fmt(restante);e.className='timer'+(restante<300?' low':'')}
      if(restante<=0){clearInterval(tick);entregar()}
    },1000);
    pintarJuego();
  }

  function fmt(s){if(s<0)s=0;var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}

  function pintarJuego(){
    juego.innerHTML='';
    var sticky=el('div','sticky');
    sticky.innerHTML='<div><b>Simulacro</b> <span class="counter">· reactivo '+(cur+1)+' de '+sel.length+
      ' · contestados '+resp.filter(function(x){return x>=0}).length+'</span></div>';

    sticky.appendChild(right);
    juego.appendChild(sticky);

    var nav=el('div','nums');
    sel.forEach(function(_,i){
      var b=el('button',(resp[i]>=0?'done ':'')+(flags[i]?'flag ':'')+(i===cur?'cur':''),String(i+1));
      b.onclick=function(){cur=i;pintarJuego()};
      nav.appendChild(b);
    });
    var navCard=el('div','card');navCard.appendChild(nav);
    juego.appendChild(navCard);

    var q=Q[sel[cur]];

      b.onclick=function(){resp[cur]=(resp[cur]===i?-1:i);pintarJuego()};
      box.appendChild(b);
    });
    c.appendChild(box);
    var acc=el('div','row');acc.style.marginTop='12px';
    var bp=el('button','btn ghost','← Anterior');bp.disabled=(cur===0);
    bp.onclick=function(){cur--;pintarJuego()};
    var bf=el('button','btn ghost',flags[cur]?'Quitar marca':'Marcar para revisar');
    bf.onclick=function(){flags[cur]=!flags[cur];pintarJuego()};
    var bn=el('button','btn','Siguiente →');bn.disabled=(cur===sel.length-1);

    acc.appendChild(bp);acc.appendChild(bf);acc.appendChild(bn);
    c.appendChild(acc);
    juego.appendChild(c);
  }

  function entregar(){
    activo=false;if(tick)clearInterval(tick);

    var usado=Math.round((Date.now()-t0)/1000);

      n:sel.length,ok:ok,pct:pct,t:fmt(usado)});

    juego.style.display='none';result.style.display='';
    result.innerHTML='';

     [resp.filter(function(x){return x<0}).length,'sin contestar']].forEach(function(s){
      var d2=el('div','stat');d2.innerHTML='<b>'+s[0]+'</b><span>'+s[1]+'</span>';g.appendChild(d2);
    });
    c.appendChild(g);

            : pct>=60?'Vas bien pero hay huecos claros. Regresa a los módulos rojos antes del siguiente simulacro.'
            : 'Todavía falta base. Trabaja módulo por módulo con el Quiz antes de volver a simular.';
    c.appendChild(el('p','muted',msg));
    result.appendChild(c);

    var cm=el('div','card');
    cm.appendChild(el('h2',null,'Desglose por módulo'));
    MODULOS.forEach(function(M){
      var s=porMod[M.id];if(!s)return;

      var row=el('div');row.style.margin='10px 0';
      row.innerHTML='<div style="display:flex;justify-content:space-between;font-size:13.4px;margin-bottom:4px">'+
        '<span><b>'+M.id+'</b> · '+esc(M.nom)+'</span><span class="counter">'+s.ok+'/'+s.n+' · '+p+'%</span></div>'+
        '<div class="bar"><i style="width:'+p+'%;background:'+acc+'"></i></div>';
      cm.appendChild(row);
    });
    result.appendChild(cm);

    var cr=el('div','card');

    sel.forEach(function(qi,i){
      var q=Q[qi],bien=(resp[i]===q.r);
      var d3=el('details');
      d3.appendChild(el('summary',null,(bien?'✓':'✕')+' <b>'+(i+1)+'.</b> '+esc(q.q.slice(0,90))+(q.q.length>90?'…':'')+
        '<span class="pill '+(bien?'ok':'')+'">'+q.b+'</span>'));
      var bd=el('div','rev '+(bien?'ok':'no'));
      bd.appendChild(el('p',null,esc(q.q)));

      q.o.forEach(function(op,j){
        var mark=(j===q.r?' ← correcta':'')+(j===resp[i]&&!bien?' ← tu respuesta':'');

      });
      bd.appendChild(ul);
      if(resp[i]<0)bd.appendChild(el('p','muted','No contestaste este reactivo.'));
      bd.appendChild(el('div','exp',esc(q.e)));

    var cf=el('div','card');
    var b=el('button','btn','Volver al inicio del simulacro');
    b.onclick=function(){result.style.display='none';intro.style.display='';pintarIntro();window.scrollTo(0,0)};
    cf.appendChild(b);
    result.appendChild(cf);
    window.scrollTo(0,0);
  }

  pintarIntro();
})();

var CIDX={},CDEP={};
CONCEPTOS.forEach(function(c){CIDX[c.i]=c;CDEP[c.i]=[]});
CONCEPTOS.forEach(function(c){c.pre.forEach(function(p){if(CDEP[p])CDEP[p].push(c.i)})});
var ENT=load('entendidos',{});
function marcar(id,v){ENT[id]=v?1:0;if(!v)delete ENT[id];save('entendidos',ENT);
  if(RENDER.ruta)RENDER.ruta();if(RENDER.conc)RENDER.conc();}
function cadenaDe(id){
  var visto={},out=[];
  (function rec(x){
    if(visto[x])return;visto[x]=1;
    var c=CIDX[x];if(!c)return;
    c.pre.forEach(rec);
    out.push(x);
  })(id);
  return out;
}
function listos(){
  return CONCEPTOS.filter(function(c){
    if(ENT[c.i])return false;
    return c.pre.every(function(p){return ENT[p]});
  });
}
function abrirConcepto(id){
  if(RENDER.setConc)RENDER.setConc(id);
  irA('conc');
}
function chipConcepto(id,extra){
  var c=CIDX[id];if(!c)return el('span','muted',esc(id));
  var b=el('button','cc'+(ENT[id]?' ok':'')+(extra||''),'<small>N'+c.n+'</small>'+esc(c.t));
  b.onclick=function(){abrirConcepto(id)};
  return b;
}

  function fmt(x){
