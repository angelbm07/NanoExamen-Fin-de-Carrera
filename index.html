{tag:'M7',q:'Un material de carbono se analiza por Raman y presenta dos bandas intensas cerca de 1350 y 1580 cm⁻¹, con una razón de intensidades que cambia entre muestras. ¿Qué informa esa razón?',opts:['El grado de desorden','La masa molecular media','El tamaño medio de poro','El estado de oxidación'],correct:0,exp:'La banda G cerca de 1580 corresponde a la vibración de la red grafítica ordenada y la banda D cerca de 1350 solo aparece cuando hay defectos que rompen la simetría. La razón D sobre G es la medida convencional del grado de desorden.'},
{tag:'M7',q:'Se quiere comprobar si un recubrimiento es hidrofóbico y cuantificar hasta qué punto lo es, con un método directo y de bajo costo. ¿Qué medida haces?',opts:['Conductividad superficial','Ángulo de contacto con gota sésil','Potencial zeta de la superficie','Difracción de rayos X rasante'],correct:1,exp:'El ángulo de contacto de una gota de agua da directamente la mojabilidad: por debajo de 90 grados la superficie es hidrofílica, por encima hidrofóbica y por encima de 150 superhidrofóbica. Es rápido, barato y relacionado con la ecuación de Young.'},
{tag:'M7',q:'Necesitas determinar la secuencia de aminoácidos de un péptido corto aislado de una muestra biológica, en cantidad de microgramos. ¿Qué técnica lo permite?',opts:['Espectroscopía UV-Vis','Difracción de electrones','Calorimetría diferencial','Masas en tándem'],correct:3,exp:'En tándem el primer analizador selecciona el ion del péptido, una celda de colisión lo fragmenta y el segundo analizador mide las masas de los fragmentos, cuya diferencia identifica cada aminoácido de la cadena. Es el método estándar en proteómica.'},
{tag:'M7',q:'Un análisis de DSC muestra un pico exotérmico en el primer calentamiento que desaparece en el segundo, sobre la misma muestra sin retirarla del equipo. ¿Qué indica?',opts:['Fusión de la fase cristalina','Degradación del polímero','Evaporación de disolvente','Cristalización del amorfo'],correct:3,exp:'Un material enfriado rápido queda amorfo y, al calentarlo por encima de su Tg, cristaliza liberando calor: eso es el exotermo. Tras ese primer ciclo el material ya está cristalizado y el fenómeno no se repite, lo que confirma el diagnóstico.'},
{tag:'M7',q:'Debes cuantificar el contenido de un metal pesado en un lodo a nivel de partes por billón, tras digerir la muestra en ácido. ¿Qué instrumento tiene la sensibilidad necesaria?',opts:['Microscopio electrónico','Difractómetro de polvos','ICP-MS con digestión','Espectrofotómetro UV-Vis'],correct:2,exp:'El plasma acoplado inductivamente con detección por masas alcanza nanogramos por litro de forma rutinaria y además es multielemental. El UV-Vis necesita formar un complejo coloreado y rara vez baja de partes por millón.'},
{tag:'M7',q:'Quieres saber si una capa delgada depositada es cristalina o amorfa, y la capa mide solo 40 nm sobre un sustrato cristalino grueso. ¿Qué configuración de difracción usas?',opts:['Barrido simétrico normal','Difracción de polvos clásica','Laue de monocristal','Incidencia rasante'],correct:3,exp:'En incidencia rasante el haz entra con un ángulo de uno o dos grados, de modo que recorre un camino largo dentro de la capa y apenas penetra en el sustrato. Eso maximiza la señal de la película y suprime la del sustrato, que de otro modo la enterraría.'},
{tag:'M7',q:'Dos técnicas se comparan para medir el tamaño de un lote: una entrega 18 nm y la otra 45 nm sobre la misma muestra. ¿Qué par de técnicas explica esa diferencia sistemática?',opts:['DSC contra TGA','TEM contra DLS','SEM contra TEM','XPS contra EDS'],correct:1,exp:'El TEM mide el núcleo seco y el DLS el diámetro hidrodinámico en suspensión, que incluye la capa de solvatación y los ligandos, y además pondera por intensidad, que va con la sexta potencia del diámetro. Que el DLS salga mayor es lo esperable.'},
{tag:'M7',q:'Necesitas verificar la pureza de un disolvente orgánico y detectar trazas volátiles por debajo de 10 ppm, identificándolas sin ambigüedad. ¿Qué acoplamiento usas?',opts:['Resonancia magnética de protón','Cromatografía de gases con masas','HPLC con índice de refracción','Infrarrojo por transformada de Fourier'],correct:1,exp:'La cromatografía de gases separa los volátiles con alta eficiencia y el espectrómetro de masas identifica cada pico por su patrón de fragmentación contra biblioteca. El infrarrojo y la RMN de rutina no alcanzan ese nivel de traza en una matriz de disolvente.'},
{tag:'M7',q:'Un espectro de RMN de protón muestra un singulete con integración de nueve protones a 1.3 ppm, junto a otras señales de la molécula. ¿Qué fragmento sugiere?',opts:['Un aldehído terminal','Un metileno junto a oxígeno','Un grupo terc-butilo','Un anillo aromático'],correct:2,exp:'Nueve protones equivalentes sin vecinos apuntan a tres metilos sobre un carbono cuaternario, es decir un terc-butilo. Un aromático aparecería entre 6.5 y 8 ppm, un aldehído cerca de 9.8 y un metileno junto a oxígeno cerca de 3.6.'},
{tag:'M7',q:'Se quiere determinar la distribución de masas moleculares de un polímero, no solo su promedio, con una sola corrida instrumental. ¿Qué técnica lo entrega?',opts:['Osmometría de membrana','Punto de fusión capilar','Exclusión por tamaño','Viscosimetría capilar'],correct:2,exp:'La columna de exclusión separa las cadenas por volumen hidrodinámico y el cromatograma reconstruye la curva completa de distribución, de la que salen M_n, M_w y la polidispersidad. La viscosimetría y la osmometría dan un solo promedio cada una.'},
{tag:'M7',q:'Un catalizador soportado pierde actividad tras varios ciclos y se sospecha que las nanopartículas metálicas han sinterizado sobre el soporte. ¿Qué par de medidas lo confirma?',opts:['TGA junto con Karl Fischer','Potencial zeta junto con pH','TEM antes y después del uso','UV-Vis y punto de fusión'],correct:2,exp:'La sinterización se ve directamente como un desplazamiento del histograma de tamaños hacia valores mayores y como una caída del área metálica accesible, que se corrobora por quimisorción selectiva. La comparación antes y después sobre la misma preparación es la evidencia.'},
{tag:'M7',q:'Debes analizar una muestra biológica hidratada en el microscopio electrónico sin que el vacío la deshidrate ni colapse su estructura nativa. ¿Qué variante usas?',opts:['TEM a temperatura ambiente','Microscopía de campo oscuro','Crio-microscopía electrónica','SEM convencional con oro'],correct:2,exp:'La vitrificación por congelación ultrarrápida inmoviliza el agua en estado amorfo, sin cristales de hielo que destruyan la estructura, y la muestra se observa a temperatura criogénica. Es la técnica que transformó la biología estructural en la última década.'},
{tag:'M7',q:'Se mide el potencial zeta de una suspensión en función del pH y la curva cruza el valor cero a pH 6.8, cambiando de signo. ¿Qué representa ese punto?',opts:['El punto isoeléctrico','El pK_a del disolvente','El punto de fusión coloidal','La fuerza iónica crítica'],correct:0,exp:'Es el pH en que la carga neta superficial se anula, de modo que desaparece la repulsión electrostática y la suspensión es máximamente inestable. Formular lejos de ese pH es la regla práctica para mantener una dispersión estable.'}
);
</script>
<script>
/* ---------------- M8 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M8',q:'Un microcanal de 50 µm de ancho transporta agua a 2.0 mm/s, con densidad 1000 kg/m³ y viscosidad 1.0×10⁻³ Pa·s. ¿Cuál es el número de Reynolds del flujo?',opts:['0.0010','0.10','10','1000'],correct:1,exp:'Re = ρvD/η = 1000 × 2.0×10⁻³ × 5.0×10⁻⁵ / 1.0×10⁻³ = 0.10. Muy por debajo de 2000, de modo que el flujo es laminar con un margen enorme y no hay mezcla convectiva posible.'},
{tag:'M8',q:'Se duplica la caída de presión aplicada a un microcanal cilíndrico manteniendo su geometría, su longitud y el fluido. ¿Qué le ocurre al caudal que circula por él?',opts:['Se duplica','Se cuadruplica','Se multiplica por 16','No cambia'],correct:0,exp:'Hagen-Poiseuille hace el caudal proporcional a la caída de presión y a la cuarta potencia del radio. La dependencia dramática es con el radio, no con la presión: duplicar la presión solo duplica el caudal.'},
{tag:'M8',q:'Un LED debe emitir en 620 nm para una aplicación de señalización, y se elige el semiconductor por su brecha prohibida. ¿Qué valor de gap necesitas?',opts:['3.10 eV','0.62 eV','2.00 eV','1.24 eV'],correct:2,exp:'E_g = 1240/620 = 2.00 eV. La relación λ = 1240/E es la misma que gobierna la absorción, solo que aquí recorrida en sentido inverso: el fotón emitido se lleva la energía del gap al recombinarse el par electrón-hueco.'},
{tag:'M8',q:'Comparas un semiconductor de gap directo con uno de gap indirecto, ambos con la misma brecha energética, para fabricar un emisor de luz. ¿Cuál eliges y por qué?',opts:['El directo, recombinación eficiente','El indirecto, mayor movilidad','Cualquiera, el gap decide','El indirecto, menos defectos'],correct:0,exp:'En un gap directo el mínimo de conducción y el máximo de valencia coinciden en el mismo vector de onda, de modo que la recombinación radiativa solo requiere el fotón. En uno indirecto hace falta además un fonón, un proceso de tres cuerpos mucho menos probable que la recombinación no radiativa.'},
{tag:'M8',q:'Una micropalanca de masa efectiva 2.0×10⁻¹¹ g resuena a 2.000 MHz y tras la exposición al analito la frecuencia cae a 1.995 MHz. ¿Cuánta masa se adsorbió?',opts:['5.0×10⁻¹⁴ g','2.5×10⁻¹³ g','5.0×10⁻¹² g','1.0×10⁻¹³ g'],correct:3,exp:'Δf/f₀ = (1.995 − 2.000)/2.000 = −2.5×10⁻³. De Δm = −2m(Δf/f₀) = 2 × 2.0×10⁻¹¹ × 2.5×10⁻³ = 1.0×10⁻¹³ g, es decir 100 femtogramos. El signo negativo del corrimiento confirma que se añadió masa.'},
{tag:'M8',q:'Al miniaturizar un actuador por un factor de diez en todas sus dimensiones, se compara cómo escalan la fuerza de volumen y la de superficie. ¿Qué consecuencia aparece?',opts:['Ninguna de las dos cambia','Dominan las de superficie','Dominan las de volumen','Ambas escalan por igual'],correct:1,exp:'La fuerza de volumen, como el peso, escala con L³ y la de superficie, como la adhesión o la tensión superficial, con L². Al reducir L la razón superficie a volumen crece, de modo que las de superficie acaban dominando. De ahí la adherencia que paraliza microestructuras.'},
{tag:'M8',q:'Un sensor de gas de óxido metálico responde cambiando su resistencia al adsorber el analito, y se busca aumentar su sensibilidad sin cambiar el material. ¿Qué haces?',opts:['Aumentar el espesor de la capa','Bajar la temperatura de operación','Usar un contacto más grueso','Nanoestructurar para más área'],correct:3,exp:'La señal nace de la modulación de la capa de agotamiento en la superficie al adsorberse el gas, así que escala con el área accesible. Reducir el tamaño de grano hasta el orden de dos veces la longitud de Debye hace que toda la partícula se vea afectada y la sensibilidad se dispara.'},
{tag:'M8',q:'En un dispositivo microfluídico se forman gotas de tamaño muy uniforme en una unión en T entre dos fases inmiscibles. ¿Qué número adimensional gobierna ese régimen?',opts:['El número de Reynolds','El número de Nusselt','El número de Froude','El número capilar'],correct:3,exp:'El capilar compara las fuerzas viscosas que estiran la interfaz con la tensión superficial que la contrae. Su valor decide si el sistema opera en régimen de goteo, de chorro o de tapón, y con él se ajusta el tamaño de gota con precisión notable.'},
{tag:'M8',q:'Se quiere separar células de distinto tamaño en un chip sin usar marcadores ni anticuerpos, aprovechando solo el flujo y la geometría del canal. ¿Qué principio se usa?',opts:['Precipitación selectiva','Centrifugación en gradiente','Desplazamiento lateral','Electroforesis en gel'],correct:2,exp:'Un arreglo de postes ligeramente desplazados obliga a las partículas mayores que un diámetro crítico a seguir una trayectoria lateral, mientras las menores siguen las líneas de corriente. La separación es continua, sin marcaje y determinada por la geometría.'},
{tag:'M8',q:'Un biosensor de resonancia de plasmón superficial detecta la unión de un analito sin marcarlo con fluoróforo ni enzima. ¿Qué magnitud física cambia y se registra?',opts:['La conductividad del oro','El pH de la disolución','El índice de refracción local','La temperatura del prisma'],correct:2,exp:'La onda evanescente penetra unos 100 a 200 nm y su condición de resonancia depende del índice de refracción de ese volumen. Al unirse el analito, el índice local sube y el ángulo de resonancia se desplaza en tiempo real, lo que da curvas de asociación y disociación.'},
{tag:'M8',q:'Comparas el tiempo que tarda una molécula en difundir 10 µm con el que tarda en difundir 100 µm, en el mismo medio y a la misma temperatura. ¿Qué relación guardan?',opts:['Cien veces más para 100 µm','Diez veces más para 100 µm','El mismo tiempo','Mil veces más para 100 µm'],correct:0,exp:'El tiempo de difusión escala con el cuadrado de la distancia: t = L²/(2D). Multiplicar la distancia por diez multiplica el tiempo por cien. Esa ley explica por qué la difusión es instantánea en la escala celular e inútil en la escala centimétrica.'},
{tag:'M8',q:'Un transistor de efecto de campo basado en nanohilo se usa como biosensor y su corriente cambia al unirse una biomolécula cargada a la superficie del hilo. ¿Cómo opera?',opts:['La carga actúa como compuerta','Se calienta el canal','Cambia la masa del hilo','Se rompe el contacto óhmico'],correct:0,exp:'La carga del analito unido modula el potencial en la superficie del nanohilo y con él la densidad de portadores en el canal, exactamente como haría una compuerta eléctrica. La sensibilidad es enorme porque en un hilo nanométrico toda la sección está afectada.'},
{tag:'M8',q:'Una celda solar de unión simple tiene un límite teórico de eficiencia cercano al 33 % para el espectro solar. ¿Qué compromiso físico fija ese techo?',opts:['El espesor de la oblea','Gap pequeño: menos voltaje','La reflexión en la cara frontal','La resistencia de los contactos'],correct:1,exp:'Un gap pequeño captura más fotones pero cada par entrega poco voltaje y el exceso se pierde como calor por termalización; un gap grande da voltaje y desaprovecha el infrarrojo. Optimizar ese intercambio contra el espectro solar da el límite de Shockley-Queisser, con un óptimo cerca de 1.3 eV.'},
{tag:'M8',q:'Se desea que un dispositivo MEMS resonante mantenga un factor de calidad alto, y en aire el valor medido resulta muy inferior al esperado. ¿Qué corrección aplicas?',opts:['Usar un material más denso','Alargar la estructura','Encapsular al vacío','Aumentar la amplitud'],correct:2,exp:'El amortiguamiento viscoso del aire disipa energía en cada ciclo y hunde el factor de calidad. Encapsular en vacío elimina esa pérdida y deja como límite el amortiguamiento intrínseco del material y las pérdidas por el anclaje.'},
{tag:'M8',q:'Un canal de microfluídica se fabrica en un polímero transparente, barato y permeable a gases, muy usado en prototipos de laboratorio académico. ¿De qué material se trata?',opts:['Polidimetilsiloxano','Vidrio de borosilicato','Acero inoxidable','Politetrafluoroetileno'],correct:0,exp:'El PDMS se moldea por réplica contra un molde de fotorresina, es ópticamente transparente, biocompatible y permeable al oxígeno, lo que permite cultivar células dentro. Sus inconvenientes son la absorción de moléculas hidrófobas y su deformabilidad bajo presión.'},
{tag:'M8',q:'Comparas la movilidad de portadores de un semiconductor orgánico con la de silicio cristalino, para decidir el material de un circuito de alta frecuencia. ¿Qué esperas?',opts:['Son comparables entre sí','El orgánico no conduce nada','El silicio supera por órdenes','El orgánico es muy superior'],correct:2,exp:'El silicio tiene movilidades del orden de cientos a miles de cm²/V·s por su red cristalina periódica, y los orgánicos rara vez superan unos pocos, porque el transporte ocurre por saltos entre moléculas. La ventaja orgánica está en el costo, el área grande y la flexibilidad, no en la velocidad.'},
{tag:'M8',q:'Un fotodetector debe responder en el infrarrojo a 1550 nm, la longitud de onda de las telecomunicaciones por fibra óptica. ¿Qué gap máximo puede tener el material?',opts:['1.24 eV','0.80 eV','1.55 eV','2.00 eV'],correct:1,exp:'E = 1240/1550 = 0.80 eV. El material debe tener un gap igual o menor para que el fotón sea absorbido, lo que descarta el silicio con sus 1.12 eV y explica el uso de germanio y de arseniuro de indio y galio en esa banda.'},
{tag:'M8',q:'En un chip de laboratorio se busca bombear líquido sin partes móviles, aplicando un campo eléctrico a lo largo del canal con paredes cargadas. ¿Qué mecanismo se usa?',opts:['Capilaridad pasiva','Flujo electroosmótico','Flujo por gravedad','Bomba peristáltica'],correct:1,exp:'El campo arrastra los contraiones de la doble capa junto a la pared y estos arrastran el fluido en bloque, lo que da un perfil de velocidad plano en lugar de parabólico. La ausencia de dispersión por el perfil es la ventaja decisiva en electroforesis capilar.'},
{tag:'M8',q:'Un sensor amperométrico de glucosa de tercera generación transfiere electrones directamente de la enzima al electrodo, sin oxígeno ni mediador. ¿Qué ventaja aporta?',opts:['Menor costo del electrodo','Más tolerancia térmica','No depende del oxígeno','Mayor rango de medición'],correct:2,exp:'La primera generación depende del oxígeno disuelto, cuya concentración varía, y la segunda introduce un mediador redox que puede reaccionar con interferentes del plasma. La transferencia directa evita ambos problemas, a costa de exigir una inmovilización muy precisa de la enzima.'},
{tag:'M8',q:'Se reduce a la mitad la longitud del canal de un transistor y se escalan proporcionalmente las demás dimensiones, según el escalamiento clásico de Dennard. ¿Qué ocurre?',opts:['Solo cambia el área ocupada','Más velocidad, menos consumo','Menos velocidad, más consumo','Ningún cambio apreciable'],correct:1,exp:'Reducir todas las dimensiones y el voltaje en la misma proporción mantiene constante la densidad de potencia mientras la frecuencia sube. Ese escalamiento dejó de cumplirse por debajo de unos 90 nm, cuando las corrientes de fuga y el voltaje umbral impusieron sus propios límites.'},
{tag:'M8',q:'Un dispositivo plasmónico concentra el campo electromagnético en una región mucho menor que la longitud de onda de la luz incidente. ¿Qué lo hace posible?',opts:['La oscilación colectiva de electrones','Un índice de refracción negativo','La absorción del sustrato','La reflexión total interna'],correct:0,exp:'El plasmón polaritón de superficie es un modo acoplado entre la luz y la oscilación de la densidad de carga en la interfaz metal-dieléctrico, cuya longitud de onda efectiva es mucho menor que la de la luz libre. Eso rompe la restricción de difracción para el confinamiento del campo.'},
{tag:'M8',q:'Un acelerómetro capacitivo mide la deflexión de una masa suspendida y se quiere aumentar diez veces su sensibilidad sin cambiar la masa. ¿Qué parámetro ajustas?',opts:['Subir la constante elástica','Aumentar el área del chip','Reducir el voltaje de lectura','Bajar la constante elástica'],correct:3,exp:'El desplazamiento estático es x = ma/k, así que ablandar los resortes aumenta la señal. El costo es que la frecuencia natural, que va como la raíz de k sobre m, baja y con ella el ancho de banda útil y la resistencia a choques.'},
{tag:'M8',q:'Se quiere una guía de ondas óptica integrada en un chip de silicio que confine la luz en una sección de cientos de nanómetros. ¿Qué principio permite ese confinamiento?',opts:['Alto contraste de índice','La conductividad del silicio','La absorción del óxido','El dopaje tipo n del núcleo'],correct:0,exp:'La fotónica de silicio aprovecha el enorme contraste entre el índice del silicio, cercano a 3.5, y el del óxido que lo rodea, cercano a 1.45. Ese contraste confina el modo en secciones submicrométricas y permite curvas muy cerradas sin pérdida apreciable.'},
{tag:'M8',q:'Un sensor SERS entrega amplificaciones de hasta un millón en ciertos puntos del sustrato y casi nada en otros, a pocas micras de distancia. ¿Qué explica esa dispersión?',opts:['La humedad del ambiente','El espesor del portaobjetos','La distribución de puntos calientes','La potencia variable del láser'],correct:2,exp:'El refuerzo escala aproximadamente con la cuarta potencia del campo local, de modo que una fracción diminuta de posiciones, en huecos y vértices nanométricos entre partículas, aporta casi toda la señal. Esa es la razón de que la reproducibilidad cuantitativa sea el problema central de la técnica.'},
{tag:'M8',q:'Comparas la respuesta de un termopar con la de un termistor para medir temperatura en un microsistema, y lo decisivo es la sensibilidad por grado. ¿Cuál eliges?',opts:['El termopar, por su voltaje','Los dos sirven por igual','Ninguno sirve a esa escala','El termistor, por su pendiente'],correct:3,exp:'El termistor es un semiconductor cuya resistencia varía de forma exponencial con la temperatura, lo que da sensibilidades muy altas en un intervalo estrecho. El termopar genera decenas de microvoltios por grado pero cubre un rango mucho más amplio y no necesita alimentación.'},
{tag:'M8',q:'Un nanoporo de estado sólido se usa para secuenciar una cadena de ADN que lo atraviesa impulsada por un campo eléctrico. ¿Qué magnitud se registra durante el paso?',opts:['La masa de la cadena','El índice de refracción','La fluorescencia emitida','La corriente iónica bloqueada'],correct:3,exp:'La cadena ocupa parte de la sección del poro y reduce la corriente de iones que lo atraviesa, en una medida que depende de la base que esté en el punto más estrecho. La secuencia se lee de la serie temporal de bloqueos de corriente.'},
{tag:'M8',q:'Un dispositivo debe operar como diodo rectificante en el contacto entre un metal y un semiconductor, y el contacto resulta óhmico en lugar de rectificante. ¿Qué revisas?',opts:['El color del metal usado','Las funciones de trabajo','El espesor del semiconductor','La temperatura de medición'],correct:1,exp:'La barrera Schottky aparece cuando la diferencia de funciones de trabajo obliga a doblar las bandas creando una barrera para los portadores mayoritarios. Si la relación de funciones de trabajo es la contraria, o si hay un dopaje muy alto que estrecha la barrera hasta permitir tunelaje, el contacto resulta óhmico.'},
{tag:'M8',q:'Una celda solar de silicio entrega menos potencia un día caluroso de verano que uno fresco de primavera, pese a recibir más irradiancia solar. ¿Qué explica esa caída?',opts:['El voltaje baja al subir la temperatura','La corriente cae con la irradiancia','El gap se vuelve indirecto','Aumenta la reflexión frontal'],correct:0,exp:'La corriente de cortocircuito sube ligeramente con la temperatura, pero el voltaje de circuito abierto cae de forma mucho más marcada, en torno a 0.3 % por grado en silicio, porque aumenta la corriente de saturación inversa del diodo. El balance neto es una pérdida de potencia de unos 0.4 % por grado.'}
);
</script>
<script>
/* ---------------- M9 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M9',q:'Un reactor piloto de 100 L se escala a 10 000 L conservando la geometría. ¿Por qué factor cambia la razón entre área de intercambio y volumen de reacción?',opts:['Cae 100 veces','Sube 4.6 veces','No cambia','Cae 4.6 veces'],correct:3,exp:'El factor de escala lineal es 100^(1/3) = 4.64. La razón área a volumen va como el inverso de la longitud, así que cae por ese mismo factor. Esa pérdida de capacidad de disipar calor es el modo de fallo más citado del escalamiento.'},
{tag:'M9',q:'Se escala un reactor agitado conservando el número de Reynolds del impulsor, con geometría semejante y el mismo fluido. ¿Qué ocurre con la potencia por unidad de volumen?',opts:['Sube de forma drástica','Queda indeterminada','Cae de forma drástica','Se mantiene constante'],correct:2,exp:'Conservar Re exige N proporcional a D⁻², y como P va con N³D⁵, la potencia por volumen escala con D⁻⁴. En un escalamiento de diez veces en diámetro eso significa cuatro órdenes de magnitud menos de agitación específica: el mezclado se vuelve inviable.'},
{tag:'M9',q:'Mides una longitud con 2 % de incertidumbre relativa y calculas con ella el área de una sección cuadrada. ¿Qué incertidumbre relativa arrastra el área obtenida?',opts:['1 %','8 %','4 %','2 %'],correct:2,exp:'Para y = xⁿ la incertidumbre relativa se multiplica por el exponente, y el área va con el cuadrado de la longitud. Si se tratara de un volumen el factor sería tres y la incertidumbre llegaría al 6 %.'},
{tag:'M9',q:'Un equipo de 500 L cuesta 80 000 unidades monetarias y se quiere estimar el costo de uno de 2000 L con la regla de los seis décimos. ¿Qué costo esperas?',opts:['Unos 320 000','Unos 80 000','Unos 20 000','Unos 175 000'],correct:3,exp:'C₂ = C₁(Q₂/Q₁)^0.6 = 80 000 × 4^0.6 = 80 000 × 2.30 = 184 000, del orden de 175 000 a 185 000. Cuadruplicar la capacidad no cuadruplica el costo: esa es la economía de escala expresada como ley de potencia.'},
{tag:'M9',q:'Un proyecto requiere 1.5 millones de inversión y genera 400 000 anuales durante seis años, con una tasa de descuento del 10 %. ¿Cuál es el periodo de recuperación simple?',opts:['1.50 años','3.75 años','6.00 años','2.50 años'],correct:1,exp:'PR = 1 500 000/400 000 = 3.75 años. Esa cifra ignora el valor del dinero en el tiempo, así que es optimista: descontado al 10 %, la recuperación real llega más tarde, cerca del año cinco.'},
{tag:'M9',q:'Se diseña un experimento con cuatro factores a dos niveles cada uno y se decide hacer el factorial completo con una sola réplica. ¿Cuántas corridas se necesitan?',opts:['32','4','16','8'],correct:2,exp:'El factorial completo exige 2^k corridas, es decir 2⁴ = 16. Un diseño fraccionado 2^(4−1) bajaría a 8 corridas a costa de confundir efectos principales con interacciones de tres factores, lo que suele ser aceptable en una etapa de cribado.'},
{tag:'M9',q:'Un análisis de varianza arroja un valor p de 0.03 para el efecto de un factor sobre el rendimiento, con el nivel de significancia fijado en 0.05. ¿Qué se concluye?',opts:['El efecto es significativo','El efecto es grande','El factor no influye','El experimento falló'],correct:0,exp:'Un p menor que el nivel de significancia permite rechazar la hipótesis nula de que no hay efecto. Lo que no dice es cuán grande es ese efecto ni si tiene relevancia práctica: para eso hace falta el tamaño del efecto con su intervalo de confianza.'},
{tag:'M9',q:'Se escala un proceso de mezclado donde lo crítico es no dañar células en suspensión, que son sensibles al esfuerzo cortante en la punta del impulsor. ¿Qué criterio conservas?',opts:['La velocidad de punta','La potencia por volumen','El número de Reynolds','El tiempo de mezclado'],correct:0,exp:'El esfuerzo cortante máximo ocurre en el borde del impulsor y escala con la velocidad de punta, πND. Conservarla protege las células, a costa de perder intensidad de mezclado, porque bajo ese criterio la potencia por volumen disminuye al escalar.'},
{tag:'M9',q:'Un balance de materia en estado estacionario sobre un proceso continuo arroja una salida mayor que la entrada de un componente que no se genera en él. ¿Qué indica?',opts:['Se acumuló masa en el equipo','La densidad del fluido cambió','Falta una corriente de entrada','El proceso es muy eficiente'],correct:2,exp:'En estado estacionario y sin generación, lo que sale debe igualar a lo que entra. Una salida mayor significa que hay una corriente de entrada no contabilizada, un error de medición o que el supuesto de estado estacionario no se cumple. El balance es una herramienta de diagnóstico, no solo de cálculo.'},
{tag:'M9',q:'Se compara un análisis de ciclo de vida de la cuna a la puerta con uno de la cuna a la tumba para el mismo producto industrial. ¿En qué se diferencian?',opts:['No hay diferencia práctica entre ambos','El segundo incluye uso y fin de vida','El primero incluye más etapas del ciclo','Solo cambia la unidad funcional elegida'],correct:1,exp:'De la cuna a la puerta cubre desde la extracción de materias primas hasta la salida de fábrica. De la cuna a la tumba añade distribución, uso y disposición final. Comparar estudios con fronteras distintas es uno de los errores más comunes en la lectura de un ACV.'},
{tag:'M9',q:'La unidad funcional elegida para un ACV de envases es «un envase de plástico». Un revisor objeta esa elección como inadecuada para comparar alternativas. ¿Por qué tiene razón?',opts:['Es demasiado específica','Incluye demasiadas etapas','No permite calcular masas','No cuantifica el servicio'],correct:3,exp:'La unidad funcional debe ser una referencia cuantificada del servicio, no del objeto: «contener y proteger un litro de bebida durante seis meses». Solo así se pueden comparar un envase de vidrio pesado y reutilizable con uno de plástico ligero y desechable.'},
{tag:'M9',q:'Un reactor de flujo pistón y uno de mezcla completa operan con la misma cinética de orden uno y deben alcanzar el 90 % de conversión. ¿Cuál requiere menos volumen?',opts:['El de flujo pistón','El de mezcla completa','Los dos el mismo','Depende del caudal'],correct:0,exp:'El de mezcla completa opera en todo su volumen a la concentración de salida, que es la más baja y por tanto la más lenta. El de flujo pistón mantiene un gradiente y aprovecha las concentraciones altas de la entrada. La excepción son las cinéticas autocatalíticas o con inhibición por sustrato.'},
{tag:'M9',q:'Una tecnología se encuentra en TRL 4, validada en laboratorio, y se busca financiamiento para llevarla a TRL 7. ¿Qué etapa debe superar en ese recorrido?',opts:['La investigación básica','La comercialización masiva','El registro de la patente','El valle de la muerte'],correct:3,exp:'Entre TRL 4 y 6 está el tramo donde la tecnología ya no es ciencia básica financiable por agencias académicas pero todavía no es un producto atractivo para inversión privada. Validar en entorno relevante y demostrar en entorno operativo exige capital intensivo con riesgo técnico aún alto.'},
{tag:'M9',q:'Se compara un proceso por lotes con uno continuo para producir el mismo nanomaterial a escala industrial, y lo crítico es la uniformidad del producto. ¿Cuál eliges?',opts:['El por lotes, por su costo','El continuo, historia uniforme','El por lotes, más control','Cualquiera de los dos'],correct:1,exp:'En flujo continuo todo el fluido recorre el mismo camino y experimenta el mismo perfil de temperatura y concentración. En un lote grande hay gradientes y el material cerca de la pared vive una historia distinta del material del centro, lo que ensancha la distribución.'},
{tag:'M9',q:'Un estudio reporta una diferencia de rendimiento del 0.4 % entre dos condiciones, con p = 0.001 y 800 réplicas por grupo, en un proceso cuya variabilidad diaria es del 3 %. ¿Qué haces?',opts:['Repetir con más réplicas','Reconocer que es irrelevante','Cambiar el proceso ya','Dudar del valor p obtenido'],correct:1,exp:'Con n grande, diferencias minúsculas alcanzan significancia estadística. El efecto existe pero su magnitud queda muy por debajo del ruido operativo del proceso, de modo que no se puede explotar. Significancia estadística y relevancia práctica son preguntas distintas.'},
{tag:'M9',q:'Un reactor tiene 40 % de conversión por paso y recircula el reactivo no convertido, pero entra con la alimentación un gas inerte que no reacciona ni se separa. ¿Qué se necesita?',opts:['Un segundo reactor','Más catalizador','Una corriente de purga','Mayor recirculación'],correct:2,exp:'Sin purga, el inerte entra de forma continua y nunca sale, así que se acumula en el lazo hasta diluir los reactivos y detener el proceso. La purga descarta una fracción pequeña de la corriente de recirculación y fija el inerte en estado estacionario, a costa de perder algo de reactivo.'},
{tag:'M9',q:'Se quiere estimar el costo total de inversión de una planta a partir del costo del equipo principal, en una etapa temprana del proyecto sin ingeniería de detalle. ¿Qué método se usa?',opts:['Análisis de ciclo de vida','Factores de Lang sobre el equipo','Suma de cotizaciones firmes','Balance de materia detallado'],correct:1,exp:'Los factores de Lang multiplican el costo del equipo entregado por un coeficiente que recoge instalación, tubería, instrumentación, obra civil e ingeniería, con valores típicos entre tres y cinco según el tipo de planta. La precisión es del orden del 30 %, suficiente para decidir si seguir adelante.'},
{tag:'M9',q:'Dos proyectos tienen VPN positivo: uno de 500 000 con inversión de 2 millones y otro de 300 000 con inversión de 600 000. ¿Qué criterio adicional conviene mirar?',opts:['El número de empleados','La antigüedad de la empresa','El retorno por unidad invertida','El color de los informes'],correct:2,exp:'Con capital limitado, el VPN absoluto favorece al proyecto grande aunque sea menos eficiente por peso invertido. El índice de rentabilidad, que es el valor presente de los flujos entre la inversión, los ordena por eficiencia del capital: 0.5 frente a 0.25 aquí.'},
{tag:'M9',q:'Se construye una planta piloto antes de la planta industrial, pese a que la química ya está demostrada en laboratorio a escala de gramos. ¿Qué justifica esa inversión?',opts:['Repetir la química ya conocida','Entrenar al personal de planta','Cumplir un requisito legal previo','Ver qué cambia con la escala'],correct:3,exp:'La química no cambia, pero sí lo hacen la transferencia de calor, el mezclado, el tiempo de residencia, la formación de depósitos y el manejo de sólidos. El piloto existe para descubrir esos fenómenos cuando el error todavía es barato.'},
{tag:'M9',q:'Se comparan dos diseños experimentales: uno de superficie de respuesta y uno factorial a dos niveles, y el objetivo es localizar un óptimo con curvatura. ¿Cuál eliges?',opts:['Superficie de respuesta','Factorial a dos niveles','Una variable a la vez','Ensayo y error'],correct:0,exp:'Con solo dos niveles por factor no se puede ajustar un término cuadrático, así que el factorial detecta tendencias pero no localiza un máximo interior. Los diseños de superficie de respuesta, como el central compuesto, añaden puntos que permiten estimar la curvatura.'},
{tag:'M9',q:'Un proceso tiene un costo fijo anual de 2 millones, un costo variable de 30 por unidad y un precio de venta de 50 por unidad. ¿Cuál es el punto de equilibrio?',opts:['200 000 unidades','100 000 unidades','40 000 unidades','66 667 unidades'],correct:1,exp:'Q = CF/(precio − CV) = 2 000 000/(50 − 30) = 100 000 unidades al año. Por debajo de ese volumen el proyecto pierde dinero, y el margen de contribución de 20 por unidad es lo que paga el costo fijo.'},
{tag:'M9',q:'La similaridad dinámica entre modelo y prototipo exige algo más que mantener la misma forma geométrica entre ambos sistemas. ¿Qué condición adicional impone?',opts:['Igualar los adimensionales','Igualar las masas totales','Usar el mismo material','Operar a la misma presión'],correct:0,exp:'La geométrica solo iguala proporciones de longitud. La cinemática exige proporciones de velocidad semejantes y la dinámica exige que las razones entre fuerzas, expresadas como Reynolds, Froude o Weber según el caso, coincidan en ambas escalas.'},
{tag:'M9',q:'Un informe de investigación presenta resultados de tres réplicas con una media y una desviación estándar, pero omite el número de réplicas en las figuras. ¿Por qué importa?',opts:['Sin n no se juzga la incertidumbre','El n solo afecta la estética','El n no influye en nada','Solo importa para el ANOVA'],correct:0,exp:'El error estándar de la media es s dividido entre la raíz de n, y el intervalo de confianza usa además un t que depende de los grados de libertad. Una misma desviación estándar significa cosas muy distintas con tres o con treinta réplicas.'},
{tag:'M9',q:'Se evalúa el impacto ambiental de un nanomaterial y se descubre que la etapa dominante no es la síntesis sino la producción del disolvente usado. ¿Qué revela ese hallazgo?',opts:['La importancia de mirar toda la cadena','Que la síntesis es irrelevante','Que el ACV está mal hecho','Que hay que cambiar de producto'],correct:0,exp:'Los puntos calientes de impacto rara vez están donde la intuición los coloca, y por eso el ACV se hace en lugar de suponer. Aquí la acción de mejora más rentable es cambiar o recuperar el disolvente, no optimizar la reacción.'},
{tag:'M9',q:'Un lote de producto sale fuera de especificación y se descubre que un operador cambió la velocidad de agitación sin registrarlo en la bitácora del proceso. ¿Qué falló?',opts:['La química de la reacción','El diseño del reactor','La calidad del precursor','El control y su registro'],correct:3,exp:'Un proceso bajo control exige parámetros definidos, registrados y controlados, de modo que cualquier desviación quede documentada y sea trazable. Sin esa disciplina es imposible investigar la causa raíz ni demostrar reproducibilidad ante un cliente o un regulador.'},
{tag:'M9',q:'Se calcula el tiempo espacial de un reactor continuo de 2.0 m³ alimentado con un caudal volumétrico de 0.25 m³/h en estado estacionario. ¿Cuánto vale?',opts:['0.5 h','8.0 h','0.125 h','2.0 h'],correct:1,exp:'τ = V/v₀ = 2.0/0.25 = 8.0 h. Es el tiempo medio que el fluido pasa dentro del reactor, y junto con la cinética determina la conversión alcanzada. Invertir la división es el error previsto en los distractores.'},
{tag:'M9',q:'Un investigador quiere publicar un resultado y debe decidir entre reportar solo el experimento que salió bien o los diez realizados, nueve de ellos negativos. ¿Qué corresponde?',opts:['Repetir hasta que salgan más','Omitir el número de intentos','Reportar los diez con su análisis','Reportar solo el positivo'],correct:2,exp:'Seleccionar el resultado favorable entre muchos intentos convierte una fluctuación aleatoria en un falso hallazgo, y multiplica la probabilidad de error de tipo I. La integridad exige reportar todos los experimentos y, si se hicieron comparaciones múltiples, corregir el nivel de significancia.'},
{tag:'M9',q:'Un proyecto de inversión arroja un VPN de +50 000 a una tasa de descuento del 8 % y de −20 000 al 12 %, con los mismos flujos de caja proyectados. ¿Qué concluyes sobre su TIR?',opts:['Está entre 8 % y 12 %','Es menor que 8 %','Es mayor que 12 %','No se puede acotar'],correct:0,exp:'La TIR es la tasa que anula el VPN, y como el VPN decrece de forma continua al subir la tasa de descuento, el cambio de signo entre 8 % y 12 % obliga a que la raíz caiga en ese intervalo. Interpolando linealmente queda cerca del 10.9 %.'}
);
</script>
<script>
/* ---------------- M10 · ampliación a 50 ---------------- */
QUIZ.push(
{tag:'M10',q:'Mezclas dos surfactantes en proporción másica 25:75, el primero con HLB 4.0 y el segundo con HLB 16.0. ¿Qué HLB tiene la mezcla resultante?',opts:['8.0','13.0','10.0','20.0'],correct:1,exp:'El HLB de una mezcla es el promedio ponderado por fracción másica: 0.25 × 4.0 + 0.75 × 16.0 = 1.0 + 12.0 = 13.0. Ese valor cae en la zona de 8 a 18, que favorece emulsiones de aceite en agua.'},
{tag:'M10',q:'Un surfactante con HLB de 5.0 se usa para emulsionar agua y aceite en proporciones comparables, y se busca predecir qué fase quedará como continua. ¿Qué ocurre?',opts:['No se forma emulsión','Agua en aceite','Aceite en agua','Microemulsión transparente'],correct:1,exp:'Un HLB entre 3 y 6 corresponde a surfactantes más solubles en la fase oleosa, y por la regla de Bancroft la fase en que el surfactante es más soluble acaba siendo la continua. De ahí sale una emulsión de agua dispersa en aceite.'},
{tag:'M10',q:'Se reduce el radio de las gotas de una emulsión de 2.0 a 0.5 µm mediante homogeneización a alta presión. ¿Por qué factor se frena la velocidad de cremado?',opts:['Cuatro veces','Dos veces','No cambia','Dieciséis veces'],correct:3,exp:'La ley de Stokes hace la velocidad proporcional al cuadrado del radio. Dividir el radio entre cuatro divide la velocidad entre dieciséis, de modo que una separación visible en días pasa a tardar meses. Es más eficaz que espesar la fase continua, que actúa solo de forma lineal sobre la viscosidad.'},
{tag:'M10',q:'Un principio activo muy poco soluble en agua debe administrarse por vía oral y se busca aumentar su velocidad de disolución sin cambiar la molécula. ¿Qué estrategia aplicas?',opts:['Reducir el tamaño de partícula','Aumentar el tamaño de partícula','Comprimir con más fuerza','Recubrir con cera'],correct:0,exp:'La ecuación de Noyes-Whitney hace la velocidad de disolución proporcional al área superficial expuesta. Micronizar o nanonizar el principio activo multiplica esa área y acelera la disolución, que en estos fármacos es el paso limitante de la absorción.'},
{tag:'M10',q:'Una crema cosmética se separa en dos capas tras seis meses en anaquel, y al agitarla recupera por completo su aspecto homogéneo original. ¿Qué mecanismo actuó?',opts:['Cremado','Coalescencia','Maduración de Ostwald','Inversión de fases'],correct:0,exp:'La reversibilidad por agitación indica que las gotas conservaron su identidad y solo migraron por densidad. La coalescencia funde gotas de forma irreversible y la maduración transfiere material entre ellas; ninguna de las dos se deshace agitando.'},
{tag:'M10',q:'Se formula una nanoemulsión y se quiere comprobar que es cinéticamente estable antes de lanzarla, sin esperar los dos años de vida útil declarada. ¿Qué ensayo haces?',opts:['Envejecimiento acelerado','Medir solo el pH inicial','Observar el color a ojo','Pesar el envase cada mes'],correct:0,exp:'Los protocolos de estabilidad acelerada someten el producto a temperatura elevada, ciclos de congelación y descongelación y centrifugación, y extrapolan con modelos de Arrhenius. No sustituyen al estudio en tiempo real, pero permiten descartar formulaciones malas en semanas.'},
{tag:'M10',q:'Un liposoma y una micela se comparan como vehículos para transportar un fármaco hidrosoluble en el torrente sanguíneo. ¿Cuál es el adecuado y por qué?',opts:['La micela, por su núcleo acuoso','Los dos por igual','Ninguno sirve para eso','El liposoma, por su núcleo acuoso'],correct:3,exp:'El liposoma es una bicapa cerrada que encierra un compartimento acuoso interior, apto para moléculas hidrosolubles. La micela tiene un núcleo hidrófobo rodeado de cabezas polares, de modo que solubiliza fármacos lipófilos, no hidrosolubles.'},
{tag:'M10',q:'Un nanotransportador de 15 nm se inyecta por vía intravenosa y se elimina de la circulación en minutos, antes de alcanzar el tejido diana. ¿Qué mecanismo lo explica?',opts:['Precipitación en el plasma','Filtración glomerular renal','Captura por el bazo','Degradación enzimática'],correct:1,exp:'Por debajo de unos 8 a 10 nm las partículas se filtran directamente por el riñón, y hasta unos 15 nm la eliminación renal sigue siendo rápida. La ventana útil para acumulación pasiva en tumor por el efecto EPR está aproximadamente entre 20 y 200 nm.'},
{tag:'M10',q:'Se recubre un nanotransportador con polietilenglicol antes de inyectarlo y su tiempo de circulación en sangre aumenta de minutos a horas. ¿Qué logró ese recubrimiento?',opts:['Aumentar su densidad','Cambiar su carga a positiva','Disolver la membrana celular','Reducir la adsorción de opsoninas'],correct:3,exp:'Las cadenas hidratadas de PEG forman una barrera estérica que dificulta la adsorción de proteínas plasmáticas que marcan la partícula para ser capturada por los macrófagos del hígado y el bazo. Ese efecto de sigilo es la razón de que casi toda nanomedicina inyectable esté peguilada.'},
{tag:'M10',q:'Un gel cosmético debe fluir al apretar el tubo y mantener su forma una vez aplicado sobre la piel, sin escurrir. ¿Qué comportamiento reológico necesita?',opts:['Newtoniano muy viscoso','Dilatante al esfuerzo','Puramente elástico','Pseudoplástico con umbral'],correct:3,exp:'Un fluido pseudoplástico baja su viscosidad al aumentar el esfuerzo cortante, lo que permite que fluya al apretarlo, y la recupera al cesar el esfuerzo. Un umbral de fluencia garantiza además que no escurra bajo su propio peso.'},
{tag:'M10',q:'Un ensayo in vitro indica que una nanopartícula no es citotóxica, y sin embargo el ensayo in vivo muestra inflamación pulmonar marcada tras inhalación. ¿Qué explica la discrepancia?',opts:['El animal era de otra especie','La dosis fue demasiado baja','La vía de exposición cambia el resultado','El ensayo in vitro estaba mal hecho'],correct:2,exp:'La toxicidad depende de la vía, de la biodistribución y de la respuesta del tejido completo, incluida la inmunitaria, que un cultivo celular no reproduce. Las partículas inhaladas de alta relación de aspecto, además, pueden resistir la fagocitosis y provocar inflamación crónica.'},
{tag:'M10',q:'Se compara la métrica de dosis en mg/kg con la de área superficial por unidad de masa para evaluar la toxicidad de un nanomaterial. ¿Cuál predice mejor el efecto?',opts:['El área superficial','La masa administrada','El volumen de partículas','El número atómico'],correct:0,exp:'La interacción con el sistema biológico ocurre en la superficie, así que dos lotes con la misma masa pero tamaños distintos presentan áreas muy distintas y efectos distintos. La literatura toxicológica de nanomateriales muestra correlaciones mucho mejores con el área o con el número de partículas que con la masa.'},
{tag:'M10',q:'Un producto incorpora un nanomaterial y el equipo debate si clasificarlo como cosmético, como medicamento o como dispositivo médico. ¿Qué criterio decide la clasificación?',opts:['La función y el uso previsto','El tamaño medio de partícula','La ruta de síntesis empleada','El país donde se fabrica'],correct:0,exp:'El marco regulatorio se determina por la finalidad declarada y el mecanismo por el que actúa, no por la composición ni por la escala. El mismo óxido de zinc nanoparticulado es cosmético en un filtro solar y otra cosa si se declara una acción terapéutica.'},
{tag:'M10',q:'Se desarrolla un producto y el equipo propone empezar construyendo el prototipo final completo antes de mostrarlo a ningún usuario potencial. ¿Qué riesgo corre?',opts:['Resolver el problema equivocado','Gastar menos de lo previsto','Acelerar la validación técnica','Mejorar la propiedad intelectual'],correct:0,exp:'El propósito del prototipado temprano y barato es poner una hipótesis frente al usuario cuando corregirla todavía cuesta poco. Invertir todo el desarrollo antes de la primera prueba concentra el riesgo justo donde es más caro revertirlo.'},
{tag:'M10',q:'Una empresa debe decidir entre patentar una mejora de proceso o mantenerla como secreto industrial, sabiendo que es difícil de detectar desde el producto final. ¿Qué favorece el secreto?',opts:['Que ya esté publicada antes','Que caduque muy pronto','Que sea difícil de deducir','Que sea fácil de copiar'],correct:2,exp:'La patente otorga exclusividad temporal a cambio de divulgación completa, lo que es un mal negocio si el competidor no podría deducir la mejora por sí mismo. El secreto no caduca, pero se pierde del todo si se filtra o si otro lo desarrolla y lo patenta.'},
{tag:'M10',q:'Un fármaco presenta una biodisponibilidad oral del 8 % y se busca mejorarla mediante formulación, sin modificar la estructura química del principio activo. ¿Qué estrategia aplicas?',opts:['Comprimir a mayor presión','Añadir un colorante','Nanosuspensión o sistema lipídico','Aumentar la dosis diez veces'],correct:2,exp:'Si la limitación es la disolución, una nanosuspensión aumenta el área y la velocidad de disolución; si es la permeabilidad o el metabolismo intestinal, un sistema lipídico autoemulsificable puede favorecer la absorción linfática. Subir la dosis desplaza el problema hacia la toxicidad.'},
{tag:'M10',q:'Se formula un filtro solar con óxido de zinc nanoparticulado en lugar del micrométrico tradicional, con la misma concentración en masa. ¿Qué cambia en el producto?',opts:['Cambia su pH de forma drástica','Deja de verse blanco en la piel','Pierde la protección ultravioleta','Se vuelve soluble en agua caliente'],correct:1,exp:'Las partículas micrométricas dispersan la luz visible y dejan el residuo blanco característico. Por debajo de unos 100 nm la dispersión en el visible cae de forma drástica, mientras la absorción en el ultravioleta se mantiene, lo que da un producto transparente igual de protector.'},
{tag:'M10',q:'Un equipo de desarrollo define su propuesta de valor antes de diseñar el producto, describiendo qué trabajo resuelve para el usuario y qué frustraciones alivia. ¿Qué herramienta usa?',opts:['El balance de materia','La matriz de riesgos','El lienzo de valor','El diagrama de Gantt'],correct:2,exp:'El lienzo enfrenta el perfil del cliente, con sus tareas, frustraciones y alegrías, contra el mapa de valor del producto, con sus aliviadores de frustración y creadores de alegría. El encaje entre ambos lados es lo que se busca antes de invertir en desarrollo.'},
{tag:'M10',q:'Un ingrediente activo encapsulado debe liberarse de forma sostenida durante doce horas y no de golpe en la primera hora tras la administración. ¿Qué perfil se busca evitar?',opts:['La erosión superficial','La liberación explosiva inicial','La liberación de orden cero','La difusión controlada'],correct:1,exp:'La liberación explosiva inicial procede del activo adsorbido en la superficie o atrapado cerca de ella, y vacía una fracción grande de la dosis en minutos. Se reduce lavando el transportador, añadiendo una capa barrera o ajustando el método de carga.'},
{tag:'M10',q:'Se comparan dos vías de administración para un nanotransportador: tópica sobre piel intacta e intravenosa. ¿Qué barrera limita de forma decisiva la primera?',opts:['El estrato córneo','La pared intestinal','La barrera hematoencefálica','El filtro glomerular'],correct:0,exp:'El estrato córneo es una barrera de corneocitos y lípidos que detiene prácticamente todo lo que supere unos pocos cientos de daltons, y las nanopartículas intactas no lo atraviesan sobre piel sana. Por eso los filtros solares nanoparticulados permanecen en la superficie.'},
{tag:'M10',q:'Un estudio de mercado revela que el usuario valora sobre todo la facilidad de uso, mientras el equipo técnico ha optimizado el rendimiento en un 3 %. ¿Qué indica ese desajuste?',opts:['Hay que subir el precio','Se optimizó lo que no prioriza','El estudio de mercado es erróneo','El rendimiento no importa nunca'],correct:1,exp:'El valor percibido lo define el usuario, no la especificación técnica. Un atributo mejorado que el cliente no prioriza no se traduce en disposición a pagar, y el esfuerzo habría rendido más aplicado a la variable que sí decide la compra.'},
{tag:'M10',q:'Se evalúa la seguridad de un nanomaterial en el laboratorio y, tras la jerarquía de controles, la última barrera de la lista resulta ser la menos fiable. ¿Cuál es?',opts:['El control de ingeniería','La eliminación del peligro','El equipo de protección personal','La sustitución del material'],correct:2,exp:'El equipo de protección personal depende de que la persona lo use bien y de forma continua, y falla con el comportamiento humano. Por eso la jerarquía lo coloca al final, después de eliminar, sustituir, aplicar controles de ingeniería y establecer procedimientos.'},
{tag:'M10',q:'Un hidrogel se diseña para liberar su carga solo en el entorno ácido de un tumor, y no en la circulación sanguínea a pH 7.4. ¿Qué propiedad necesita el material?',opts:['Un punto de fusión muy bajo','Una densidad superior al agua','Sensibilidad al pH en su red','Una alta conductividad eléctrica'],correct:2,exp:'Los polímeros con grupos ionizables cambian su grado de hinchamiento al variar el pH, porque la protonación o desprotonación modifica la repulsión electrostática dentro de la red. Ese cambio de malla abre o cierra la difusión del activo encapsulado.'},
{tag:'M10',q:'Se compara el costo de producción por gramo de un nanomaterial en laboratorio con el que tendría a escala industrial, y la diferencia es de dos órdenes de magnitud. ¿Qué suele explicarlo?',opts:['El transporte del producto','Economía de escala y automatización','Un error de cálculo del laboratorio','La menor pureza industrial'],correct:1,exp:'A escala el costo se reparte entre volúmenes mucho mayores, los equipos se usan de forma continua, el trabajo manual se automatiza y los insumos se compran a granel. La regla de los seis décimos captura esa economía para el equipo, y el costo de mano de obra por unidad cae todavía más rápido.'},
{tag:'M10',q:'Un consumidor rechaza un alimento que declara contener nanomateriales, pese a que la evaluación de riesgo concluye que es seguro en las condiciones de uso. ¿Qué muestra ese caso?',opts:['La evaluación técnica falló','Los nanomateriales son inseguros','El etiquetado es innecesario','La percepción es riesgo comercial'],correct:3,exp:'La aceptación social es un factor de viabilidad comercial independiente de la seguridad técnica demostrada, y en alimentos pesa especialmente. Ignorarla ha hundido productos técnicamente correctos, lo que convierte la comunicación transparente en parte del desarrollo.'},
{tag:'M10',q:'Se decide entre registrar una marca o una patente para proteger un producto nanotecnológico cuya ventaja principal es el reconocimiento del nombre comercial. ¿Qué eliges?',opts:['La patente, por veinte años','Ninguna de las dos','Las dos son equivalentes','La marca, que además es renovable'],correct:3,exp:'La patente protege una invención técnica durante un plazo limitado y exige novedad y actividad inventiva. La marca protege el signo distintivo que identifica el origen comercial, se renueva de forma indefinida y es lo adecuado cuando el activo es la reputación del nombre.'},
{tag:'M10',q:'Una suspensión de nanopartículas para uso inyectable debe esterilizarse y el calor del autoclave provoca agregación irreversible del lote completo. ¿Qué alternativa consideras?',opts:['Secado prolongado en estufa','Agitación vigorosa posterior','Filtración estéril por 0.22 µm','Autoclave a mayor temperatura'],correct:2,exp:'La filtración por membrana de 0.22 µm retiene microorganismos y deja pasar partículas mucho menores sin aplicar calor. Exige que el producto esté bien disperso y por debajo de ese tamaño, y por eso la estabilidad coloidal es un requisito de fabricabilidad, no solo de anaquel.'}
);
</script>
<script>
/* ---------------- Reactivos de lectura de gráfica ----------------
   Llevan el campo g: la respuesta sale de interpretar la figura.
------------------------------------------------------------------- */
QUIZ.push(
/* --- difractograma --- */
{tag:'M7',g:GRAF.xrd_index,q:'Observa el difractograma. El primer pico aparece en 2θ = 38.2° con radiación de cobre (λ = 0.15406 nm). ¿Qué espaciado interplanar le corresponde?',opts:['0.1242 nm','0.4710 nm','0.1178 nm','0.2355 nm'],correct:3,exp:'θ es la mitad del 2θ reportado: 19.1°, cuyo seno vale 0.3271. d = λ/(2 sen θ) = 0.15406/0.6542 = 0.2355 nm. Meter 38.2° directamente en el seno da 0.1242 nm, que es el error más frecuente del módulo.'},
{tag:'M4',g:GRAF.xrd_index,q:'En el mismo difractograma, los cuatro picos corresponden a la secuencia de h²+k²+l² de 3, 4, 8 y 11 al indexarlos. ¿Qué tipo de red cúbica tiene la muestra?',opts:['Cúbica simple','Centrada en el cuerpo','Centrada en las caras','Hexagonal compacta'],correct:2,exp:'La secuencia 3, 4, 8, 11 corresponde a índices todos pares o todos impares, que es la regla de extinción de FCC: (111), (200), (220), (311). En BCC solo difractan los planos con h+k+l par, lo que daría 2, 4, 6, 8.'},
{tag:'M7',g:GRAF.xrd_index,q:'Si el pico de 38.2° de la figura tuviera un ancho a media altura mucho mayor manteniendo su posición, ¿qué cambiaría en la interpretación de la muestra?',opts:['Otro parámetro de red','Más cantidad de muestra','Sería otra fase distinta','Cristalitos más pequeños'],correct:3,exp:'La posición fija la fase y el parámetro de red, así que no cambiarían. El ensanchamiento lo gobiernan el tamaño del dominio coherente, por Scherrer, y la microdeformación. Separar ambas contribuciones exige el análisis de Williamson-Hall.'},

/* --- TGA --- */
{tag:'M7',g:GRAF.tga,q:'Lee el termograma de una nanopartícula inorgánica con recubrimiento orgánico injertado. ¿Qué porcentaje del total corresponde al recubrimiento orgánico?',opts:['6 %','24 %','15 %','3 %'],correct:2,exp:'Tres escalones y cada uno es otra cosa. Hasta 150 °C se pierde 3 %: agua y disolvente fisisorbidos, que no son recubrimiento. Entre 250 y 420 °C la masa cae de 97 a 82 %, es decir <b>15 %</b>, que es el intervalo de descomposición oxidativa de cadenas orgánicas. El escalón final por encima de 620 °C, de 82 a 76 %, ya es el propio inorgánico. Sumar el primero con el segundo da 18 % y es el error de lectura previsto.'},
{tag:'M7',g:GRAF.tga,q:'En ese mismo termograma, ¿qué representa el escalón que aparece por encima de 620 °C, muy por encima del intervalo de descomposición de los orgánicos?',opts:['Ruido del equipo','Resto del recubrimiento','Agua fuertemente retenida','Descomposición del inorgánico'],correct:3,exp:'Las cadenas orgánicas ya se oxidaron por completo por debajo de 500 °C. Un escalón por encima de 600 °C corresponde al propio material inorgánico: pérdida de un carbonato, de oxígeno de red o una transición con cambio de estequiometría.'},

/* --- DSC --- */
{tag:'M3',g:GRAF.dsc,q:'Interpreta el termograma DSC. ¿Qué transición representa el escalón en la línea base a −25 °C, sin pico asociado en ninguna dirección?',opts:['Cristalización','Degradación térmica','Transición vítrea','Fusión cristalina'],correct:2,exp:'La transición vítrea es de segundo orden: cambia la capacidad calorífica y por tanto la línea base se desplaza, pero no hay entalpía latente y por eso no aparece pico. Fusión y cristalización sí son de primer orden y dan pico.'},
{tag:'M3',g:GRAF.dsc,q:'En el mismo DSC aparece un pico exotérmico a 45 °C, entre el escalón y el endotermo, y desaparece si se repite el barrido sobre la misma muestra. ¿Qué ocurrió?',opts:['Fusión parcial','Evaporación de agua','Oxidación del polímero','Cristalización en frío'],correct:3,exp:'La muestra se enfrió rápido desde el fundido y quedó amorfa por debajo de su Tg. Al calentarla y superar la Tg, las cadenas ganan movilidad y cristalizan liberando calor. Tras ese ciclo el material ya está cristalizado y el exotermo no se repite.'},
{tag:'M3',g:GRAF.dsc,q:'Del mismo termograma se quiere concluir si el polímero es semicristalino o completamente amorfo, mirando únicamente los eventos registrados. ¿Qué se concluye?',opts:['Amorfo: solo hay escalón','Semicristalino: hay Tg y Tm','Termofijo entrecruzado','No se puede decidir'],correct:1,exp:'El escalón a −25 °C es la transición vítrea de la fase amorfa y el pico endotérmico a 128 °C es la fusión de la fase cristalina. La coexistencia de ambos define un material semicristalino, con Tg por debajo del ambiente.'},

/* --- Arrhenius --- */
{tag:'M5',g:GRAF.arrhenius,q:'Compara las dos rectas de la gráfica de Arrhenius. ¿Qué reacción tiene mayor energía de activación y en qué te basas para decidirlo?',opts:['La A, por ser más alta','Igual, son paralelas','La A, por su mayor ordenada','La B, por su mayor pendiente'],correct:3,exp:'En ln k contra 1/T la pendiente vale −Ea/R, así que una recta más inclinada hacia abajo significa mayor energía de activación. La B cae 2.6 unidades de ln k en el mismo intervalo frente a 2.0 de la A: su barrera es mayor y por eso es más sensible a la temperatura.'},
{tag:'M5',g:GRAF.arrhenius,q:'Estima la energía de activación de la reacción A con los datos de la gráfica: ln k pasa de −4.0 a −6.0 cuando 1000/T va de 2.8 a 3.6 K⁻¹. R = 8.314 J/mol·K.',opts:['Unos 166 kJ/mol','Unos 2 kJ/mol','Unos 21 kJ/mol','Unos 8 kJ/mol'],correct:2,exp:'La pendiente es Δln k / Δ(1/T) = (−6.0 + 4.0)/(3.6 − 2.8)×10⁻³ = −2.0/8.0×10⁻⁴ = −2500 K. Ea = −pendiente × R = 2500 × 8.314 = 20 785 J/mol, unos 21 kJ/mol. Olvidar el factor 1000 del eje da 166 kJ/mol.'},

/* --- esfuerzo-deformación --- */
{tag:'M4',g:GRAF.sigma_eps,q:'Mira las tres curvas de esfuerzo-deformación. ¿Cuál material es el más rígido, es decir el de mayor módulo de Young, y cuál el más dúctil de los tres?',opts:['Rígido 3, dúctil 1','Rígido 2, dúctil 2','Rígido 1, dúctil 1','Rígido 1, dúctil 3'],correct:3,exp:'La rigidez es la pendiente del tramo elástico inicial, y la del material 1 es con mucho la mayor. La ductilidad es cuánto se deforma antes de romper, y el 3 llega al final del eje sin fallar. El 1 rompe en el tramo recto: es rígido, resistente y completamente frágil.'},
{tag:'M4',g:GRAF.sigma_eps,q:'En la misma figura, el material 1 rompe en el punto marcado sin haber salido nunca del tramo recto de su curva. ¿Qué clase de material corresponde a ese comportamiento?',opts:['Un termoplástico dúctil','Un metal recocido','Un cerámico frágil','Un elastómero'],correct:2,exp:'Rotura dentro del régimen elástico, sin deformación plástica previa, es la firma de un cerámico o de un vidrio: no hay dislocaciones móviles que relajen la concentración de esfuerzo en la punta de un defecto. Por eso su resistencia práctica depende del tamaño del defecto crítico.'},
{tag:'M4',g:GRAF.sigma_eps,q:'Del material 3 de la gráfica se observa que nunca presenta tramo recto y admite deformaciones grandes con esfuerzos bajos. ¿Qué familia de materiales describe esa curva?',opts:['Un elastómero','Un acero templado','Un cerámico técnico','Un metal refractario'],correct:0,exp:'Los elastómeros responden por desenrollamiento de cadenas entrecruzadas, no por estiramiento de enlaces, así que su respuesta es no lineal desde el origen, su módulo es muy bajo y la deformación recuperable llega a cientos de por ciento.'},

/* --- voltamperometría --- */
{tag:'M11',g:GRAF.cv_dos,q:'Compara los dos voltamperogramas. Al cuadruplicar la velocidad de barrido de 25 a 100 mV/s, la corriente de pico pasó de 24 a 48 µA. ¿Qué indica esa dependencia?',opts:['El proceso es irreversible','Hay caída óhmica alta','La especie está adsorbida','La especie difunde'],correct:3,exp:'Multiplicar v por cuatro multiplicó i_p por dos, es decir por la raíz de cuatro. Esa es la predicción de Randles-Ševčík para una especie que llega por difusión desde el seno de la disolución. Si estuviera adsorbida, la corriente se habría multiplicado por cuatro.'},
{tag:'M11',g:GRAF.cv_dos,q:'En la misma figura, la separación entre el pico anódico y el catódico se mantiene prácticamente igual en las dos velocidades de barrido registradas. ¿Qué se concluye del sistema?',opts:['Es irreversible','Está contaminado','Es reversible','Es cuasirreversible'],correct:2,exp:'Los dos criterios de reversibilidad son que ΔE_p valga unos 59/n mV y que no dependa de la velocidad de barrido, junto con una razón de corrientes de pico cercana a uno. Si ΔE_p creciera al barrer más rápido, el sistema sería cuasirreversible.'},
{tag:'M11',g:GRAF.cv_dos,q:'Se quiere usar esta técnica para cuantificar el analito y hay que elegir velocidad de barrido. ¿Por qué conviene la de 25 mV/s pese a dar menos corriente de pico?',opts:['Mide más rápido el ensayo','Gasta menos electrolito','Evita la caída óhmica','Mejor relación señal-ruido'],correct:3,exp:'La corriente capacitiva de fondo escala con v y la faradaica solo con su raíz, de modo que la razón entre ambas empeora al barrer rápido. La corriente de pico sube, pero el fondo sube más deprisa: la voltamperometría cíclica rápida es buen diagnóstico y mal método cuantitativo.'},

/* --- isoterma --- */
{tag:'M6',g:GRAF.isoterma,q:'Analiza la isoterma de nitrógeno. Presenta un ciclo de histéresis que se abre por encima de p/p₀ ≈ 0.45 y se cierra al final del barrido. ¿Qué indica sobre el material?',opts:['Es un líquido','Es mesoporoso','Es microporoso','No es poroso'],correct:1,exp:'La histéresis nace de la condensación capilar en poros, que ocurre a distinta presión al llenar que al vaciar por la geometría del menisco. Aparece en el rango mesoporoso, de 2 a 50 nm. Un sólido microporoso daría isoterma de tipo I sin histéresis, y uno no poroso, tipo II.'},
{tag:'M7',g:GRAF.isoterma,q:'De esa misma isoterma se quiere extraer el área superficial específica del material mediante el tratamiento convencional. ¿Qué zona de la curva se usa para el ajuste?',opts:['La meseta final','Toda la curva completa','La zona de presión baja','El ciclo de histéresis'],correct:2,exp:'El modelo BET se ajusta en el intervalo de p/p₀ entre 0.05 y 0.3 aproximadamente, donde se completa la monocapa y aún no domina la condensación capilar. La rama de desorción del ciclo es la que se trata por BJH para obtener la distribución de tamaño de poro.'},

/* --- Nyquist --- */
{tag:'M11',g:GRAF.nyquist,q:'Lee el diagrama de Nyquist. Los dos semicírculos arrancan en 30 Ω; el de A cierra en 110 Ω y el de B en 250 Ω. ¿Qué electrodo tiene la transferencia de carga más rápida?',opts:['El B, por su R_ct mayor','Los dos por igual','No se puede saber','El A, por su R_ct menor'],correct:3,exp:'El diámetro del semicírculo es la resistencia de transferencia de carga: 80 Ω para A y 220 Ω para B. Como R_ct es inversamente proporcional a la densidad de corriente de intercambio, un semicírculo menor significa una cinética intrínsecamente más rápida.'},
{tag:'M11',g:GRAF.nyquist,q:'En ese mismo diagrama, los dos espectros cortan el eje real en 30 Ω a alta frecuencia, antes de empezar sus respectivos semicírculos. ¿Qué parámetro representa ese corte?',opts:['La resistencia del electrolito','La capacitancia de doble capa','La impedancia de Warburg','El potencial de equilibrio'],correct:0,exp:'A frecuencia alta el condensador de la doble capa cortocircuita la interfaz y lo único que queda es la resistencia óhmica del electrolito entre el electrodo de trabajo y la referencia. Que ambos coincidan confirma que se midieron en el mismo medio.'},
{tag:'M11',g:GRAF.nyquist,q:'Al final de ambos espectros de la figura aparece una recta que sale con una inclinación de 45 grados respecto al eje real. ¿Qué fenómeno describe ese tramo?',opts:['Resistencia de contacto','Inductancia del cable','Difusión del reactivo','Transferencia de carga'],correct:2,exp:'La recta a 45° a baja frecuencia es la impedancia de Warburg, que aparece cuando el transporte de materia hacia el electrodo empieza a limitar la respuesta. A frecuencias bajas el sistema tiene tiempo de agotar el reactivo junto a la superficie y la difusión domina.'}
);

<script>

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}

  if(b.prob)out.push('<details class="prob"><summary>'+esc(b.prob.t)+'</summary><div class="inner">'+

    '<ol class="ppasos">'+b.prob.p.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'+
    '<div class="pres"><b>Resultado. </b>'+b.prob.r+'</div>'+
    (b.prob.x?'<div class="ptrampa"><b>La trampa: </b>'+b.prob.x+'</div>':'')+'</div></details>');
  if(b.caso){
    var C=b.caso;
    out.push('<div class="caso"><div class="ftit">Caso de caracterización</div>'+
      '<h4>'+esc(C.t)+'</h4><div class="caso-ctx">'+C.ctx+'</div>'+
      '<ol class="caso-pasos">'+C.pasos.map(function(P){
        return '<li><div class="caso-q">'+P.p+'</div>'+
          '<details class="caso-rev"><summary>Ver cómo se razona</summary><div class="inner">'+
          '<div class="caso-r">'+P.r+'</div>'+
          (P.d?'<div class="caso-d"><b>Lo que sale al medirlo. </b>'+P.d+'</div>':'')+
          '</div></details></li>';
      }).join('')+'</ol>'+
      '<div class="caso-fin">'+C.fin+'</div></div>');
  }
  if(b.deep){
    out.push('<details class="deep"><summary>'+esc(b.deep.t)+'</summary><div class="inner">'+
      b.deep.b.map(function(x){return bloque(x,mid)}).join('')+'</div></details>');
  }
  return out.join('');
}

     '<div class="quiz-wrap" id="quizwrap-'+m.id+'"></div></div>';

  p.innerHTML=h;
  return p;

var cont=el('div');document.querySelector('.wrap').appendChild(cont);
G.forEach(function(m){cont.appendChild(panelModulo(m))});

/* panel del mapa de conceptos */

pm.innerHTML='<div class="module-head"><span class="tag" style="background:var(--surface-2);color:var(--accent)">MAPA</span>'+

pq.innerHTML='<div class="module-head"><span class="tag" style="background:var(--surface-2);color:var(--accent)">QUIZ</span>'+
 '<h2>Simulacro mixto</h2></div>'+
 '<div class="module-sub">Elige la duración. Los reactivos se muestrean del banco de '+QUIZ.length+', repartidos por igual entre los '+G.length+' módulos y mezclados en cada intento. '+
 'La mezcla entre módulos (interleaving) rinde más que practicar un módulo a la vez. '+

/* ---- pestañas ---- */
var tabs=document.getElementById('tabs');
var TABS=G.map(function(m){return [m.id,m.id]}).concat([['MAPA','Mapa'],['QUIZ','Quiz']]);
TABS.forEach(function(t,i){

/* ---- subpestañas dentro de cada módulo ---- */
document.addEventListener('click',function(e){

/* ---- barra de progreso de lectura por módulo ---- */
function progreso(){

  if(!barra)return;

 G.length+' módulos · '+G.reduce(function(a,m){return a+m.sec.length},0)+' secciones · '+
 document.querySelectorAll('.eqbox math').length+' fórmulas · '+
 document.querySelectorAll('details.prob').length+' problemas resueltos · '+
 G.reduce(function(a,m){return a+m.flash.length},0)+' flashcards · '+QUIZ.length+' reactivos. '+
 'Contenido derivado del material de los cursos disciplinares en Canvas y de literatura de referencia. '+
 '¿Necesitas el banco completo, el formulario y el seguimiento? <a href="app/">Abre la app extendida</a>.';
