<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA3062 · Preparación al Examen de Fin de Carrera — Nanotecnología</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f6f8; --card:#ffffff; --ink:#14181d; --ink2:#5c6672; --ink3:#8a929c; --line:#e5e9ed;
  --accent:#2563c9; --accent-soft:#eef3fd; --accent2:#0e9f6e; --warn:#d97706; --bad:#dc2626;
  --chip:#eef1f5; --radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --measure:74ch;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.68;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 72px}
header{background:linear-gradient(135deg,#17304f,#2563c9);color:#fff;padding:20px 0 0;margin-bottom:22px}
header .wrap{padding-bottom:0}
h1{margin:0 0 3px;font-size:19px;letter-spacing:-.015em;font-weight:650}
.sub{opacity:.8;font-size:12.5px;letter-spacing:.01em}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:18px}
nav button{background:transparent;color:rgba(255,255,255,.78);border:0;padding:11px 16px;
  border-radius:10px 10px 0 0;font-size:14px;cursor:pointer;font-weight:550;transition:.15s;font-family:inherit;
  border-bottom:3px solid transparent}
nav button:hover{color:#fff;background:rgba(255,255,255,.1)}
nav button.on{background:var(--bg);color:#17304f;font-weight:680;border-bottom-color:var(--bg)}
.subnav{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 20px;padding:5px;background:#e8ecf1;
  border-radius:11px;position:sticky;top:8px;z-index:6}
.subnav button{background:transparent;border:0;padding:8px 14px;border-radius:8px;font-size:13.6px;
  cursor:pointer;font-family:inherit;color:var(--ink2);font-weight:550;transition:.13s}
.subnav button:hover{background:#dde3ea;color:var(--ink)}
.subnav button.on{background:#fff;color:var(--accent);font-weight:660;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.panel{display:none;animation:fade .18s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
h2{font-size:18.5px;margin:0 0 12px;font-weight:650;letter-spacing:-.01em}
h3{font-size:15.5px;margin:22px 0 8px;font-weight:640}
p{margin:9px 0;max-width:var(--measure)}
ul,ol{margin:9px 0;padding-left:22px;max-width:var(--measure)}
li{margin:6px 0}
.muted{color:var(--ink2);font-size:14px}
.card>p:first-of-type{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;
  cursor:pointer;color:var(--ink2);user-select:none;transition:.12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13.5px;
  font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
code,.mono{font-family:var(--mono);font-size:12.8px}
pre{background:#f2f4f7;border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow-x:auto;
  font-family:var(--mono);font-size:12.6px;line-height:1.6;margin:8px 0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:13.4px;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f2f4f7;font-weight:650}
.bar{height:8px;background:#e8ebef;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent2);border-radius:99px;transition:width .3s}
details{border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:8px 0;background:#fff}
details[open]{border-color:#c9d4e6}
summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸";display:inline-block;width:15px;color:var(--accent);transition:.15s}
details[open] summary:before{transform:rotate(90deg)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
  background:var(--chip);color:var(--ink2);margin-left:6px;vertical-align:middle}
.pill.pct{background:#dbeafe;color:#1e40af}
.pill.ok{background:#e6f4ea;color:#15803d}
.pill.apoyo{background:#f3e8ff;color:#6b21a8}
.q{font-size:15.5px;font-weight:600;margin:4px 0 12px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 14px;margin:7px 0;font-size:14.2px;cursor:pointer;transition:.13s;font-family:inherit;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent);background:#f6f9ff}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--accent2);background:#e9f7f0}
.opt.no{border-color:var(--bad);background:#fdecec}
.opt.sel{border-color:var(--accent);background:#eaf1fd}
.exp{background:#f2f6fd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;
  margin-top:12px;font-size:13.6px}
.counter{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.timer{font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.fc{perspective:1200px;margin:14px 0}
.fc-in{position:relative;width:100%;min-height:210px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;
  padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-f{background:#fff}
.fc-b{background:#f2f6fd;transform:rotateY(180deg)}
.fc-f div,.fc-b div{font-size:15.5px;line-height:1.6}
.fc-b div{font-size:14.5px}
.fc-tag{position:absolute;top:11px;left:14px;font-size:11px;color:var(--ink2);font-weight:600;letter-spacing:.03em}
.hint{position:absolute;bottom:11px;font-size:11.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--ink2)}
label.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.8px;cursor:pointer}
label.chk input{margin-top:3px;flex-shrink:0;width:15px;height:15px;accent-color:var(--accent2)}
label.chk.done span{text-decoration:line-through;color:var(--ink2)}
input[type=search]{width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;
  font-family:inherit;background:#fff;color:var(--ink)}
input[type=search]:focus{outline:2px solid #c9dbfa;border-color:var(--accent)}
.sol{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.sol ol{padding-left:20px;margin:6px 0}
.sol ol li{margin:5px 0}
.ans{background:#e9f7f0;border:1px solid #b6e2cd;border-radius:8px;padding:9px 12px;margin-top:9px;font-weight:600;font-size:14px}
.nums{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.nums button{width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line);background:#fff;
  font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink2);font-weight:600}
.nums button.done{background:#e6f4ea;border-color:#9dd5b4;color:#15803d}
.nums button.flag{background:#fef3c7;border-color:#f0c674;color:#92400e}
.nums button.cur{outline:2px solid var(--accent);outline-offset:1px}
.sticky{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 16px;margin-bottom:12px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.rev{border-left:3px solid var(--line);padding-left:12px;margin:12px 0}
.rev.ok{border-color:var(--accent2)}
.rev.no{border-color:var(--bad)}
.note{background:#fffbeb;border:1px solid #f5e0a3;border-radius:10px;padding:12px 15px;font-size:13.6px;margin-bottom:14px}
/* ---- ruta / conceptos ---- */
.lvl{border-left:4px solid var(--accent);padding-left:14px;margin:18px 0}
.lvl h3{margin:0 0 3px;font-size:15.5px}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cc{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.6px;
  cursor:pointer;transition:.12s;color:var(--ink);font-family:inherit;text-align:left}
.cc:hover{border-color:var(--accent);background:#f6f9ff}
.cc.ok{background:#e9f7f0;border-color:#9dd5b4;color:#15803d}
.cc.ready{border-color:var(--warn);background:#fffbeb}
.cc small{color:var(--ink2);font-weight:600;margin-right:4px}
.cc.ok small{color:#15803d}
select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;
  background:#fff;color:var(--ink);max-width:100%}
.cbox{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:20px 24px;margin-bottom:14px}
.cbox h3{margin:0 0 3px;font-size:17.5px;font-weight:650;letter-spacing:-.01em}
.cmeta{font-size:11.5px;color:var(--ink3);font-weight:650;letter-spacing:.06em;margin-bottom:14px;text-transform:uppercase}
.cfield{margin:16px 0;max-width:var(--measure)}
.cfield b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  margin-bottom:4px;font-weight:700}
.cfield.ojo{background:#fffbeb;border-left:3px solid var(--warn);padding:12px 16px;border-radius:0 10px 10px 0}
.cfield.ojo b{color:#b45309}
.chain{counter-reset:paso}
.chain .step{display:flex;gap:11px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.chain .step:last-child{border-bottom:0}
.chain .step i{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-style:normal}
.chain .step.done i{background:var(--accent2)}
.chain .step.meta i{background:var(--warn)}
/* ---- abiertas ---- */
.qa{font-size:15.5px;font-weight:600;line-height:1.5;margin:6px 0 12px}
.hintbox{background:#f2f6fd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 13px;margin:7px 0;font-size:13.6px}
.keybox{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-top:10px}
.keybox ul{margin:6px 0 0;padding-left:20px}
.keybox li{margin:5px 0;font-size:14px}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rate button{flex:1;min-width:130px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  padding:9px 10px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600;color:var(--ink2)}
.rate button.g:hover,.rate button.g.on{border-color:var(--accent2);background:#e9f7f0;color:#15803d}
.rate button.y:hover,.rate button.y.on{border-color:var(--warn);background:#fffbeb;color:#92400e}
.rate button.r:hover,.rate button.r.on{border-color:var(--bad);background:#fdecec;color:#b91c1c}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px}
.badge.b1{background:#e6f4ea;color:#15803d}
.badge.b2{background:#fef3c7;color:#92400e}
.badge.b3{background:#fde8e8;color:#b91c1c}
/* ---- hub de módulos ---- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  cursor:pointer;transition:.16s;text-align:left;font-family:inherit;color:var(--ink);display:block;width:100%}
.mcard:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(37,99,201,.1);transform:translateY(-2px)}
.mcard .mid{font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.08em}
.mcard h3{margin:5px 0 8px;font-size:17px;font-weight:650;line-height:1.35}
.mcard .mmat{font-size:12.8px;color:var(--ink3);line-height:1.5;margin-bottom:14px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:11px}
.mstats span b{display:block;font-size:17px;color:var(--ink);font-weight:680;line-height:1.2}
.mhead{background:linear-gradient(135deg,#f0f5fd,#fff);border:1px solid #d5e2f7;border-radius:var(--radius);
  padding:22px 26px;margin-bottom:18px}
.mhead .mid{font-size:12.5px;font-weight:750;color:var(--accent);letter-spacing:.08em}
.mhead h2{font-size:24px;margin:6px 0 10px;letter-spacing:-.02em}
/* ---- símbolos de fórmula ---- */
.symtab{width:100%;border-collapse:collapse;margin:8px 0;font-size:14.2px}
.symtab td{border:0;border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
.symtab tr:last-child td{border-bottom:0}
.symtab td:first-child{width:84px;font-family:var(--mono);font-weight:700;color:var(--accent);font-size:14px}
.symtab td:last-child{width:210px;font-family:var(--mono);font-size:12.8px;color:var(--ink2);text-align:right}
.fbox{background:#f0f5fd;border:1px solid #d5e2f7;border-radius:10px;padding:16px 18px;margin:10px 0;
  font-family:var(--mono);font-size:14.5px;line-height:1.9;overflow-x:auto;color:#123a72;font-weight:600}
/* ---- glosario ---- */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gitem{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.gitem .gsig{font-family:var(--mono);font-weight:750;font-size:15px;color:var(--accent)}
.gitem .gful{font-size:12.5px;color:var(--ink3);margin:2px 0 7px;font-style:italic}
.gitem .gdef{font-size:14px;line-height:1.6}
.gitem .gmod{font-size:11px;color:var(--ink3);margin-top:8px;font-weight:650;letter-spacing:.04em}
/* ---- tabla periódica ---- */
.ptwrap{overflow-x:auto;padding-bottom:8px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));gap:3px;min-width:820px}
.el{aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.09);padding:3px 4px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;transition:.1s;font-family:inherit;text-align:left;overflow:hidden}
.el:hover{transform:scale(1.14);z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.22);position:relative}
.el .z{font-size:8.5px;opacity:.65;line-height:1}
.el .sym{font-size:15px;font-weight:750;line-height:1.15}
.el .nm{font-size:7px;opacity:.75;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el.dim{opacity:.16}
.el.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:2}
.ptleg{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.ptleg span{font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid rgba(0,0,0,.1);cursor:pointer}
.eldet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-top:14px}
.eldet .big{font-size:46px;font-weight:750;line-height:1;letter-spacing:-.02em}
.elprops{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.elprops div{background:#f7f9fb;border-radius:9px;padding:10px 13px}
.elprops b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.elprops span{font-size:15px;font-weight:600}
/* ---- lecciones ---- */
.lec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px 38px;margin-bottom:16px}
.lec .lmeta{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.lec h1{font-size:27px;line-height:1.25;margin:8px 0 18px;color:var(--ink);letter-spacing:-.02em;max-width:22ch;font-weight:660}
.lec h2.sh{font-size:19px;margin:34px 0 10px;font-weight:640;letter-spacing:-.01em;padding-top:4px;border-top:1px solid var(--line)}
.lec p.body{font-size:16.5px;line-height:1.78;max-width:68ch;margin:14px 0;color:#22282f}
.objbox{background:var(--accent-soft);border-radius:12px;padding:16px 20px;margin:0 0 8px}
.objbox b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:700}
.objbox ul{margin:0;padding-left:20px}
.objbox li{margin:5px 0;font-size:14.6px}
.ideabox{background:#f0faf5;border-left:4px solid var(--accent2);border-radius:0 12px 12px 0;padding:16px 20px;margin:26px 0;max-width:68ch}
.ideabox b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0b7a55;margin-bottom:8px;font-weight:700}
.ideabox ul{margin:0;padding-left:20px}
.ideabox li{margin:7px 0;font-size:15px}
.checkbox2{background:#fffbeb;border:1px solid #f0dfae;border-radius:12px;padding:18px 22px;margin:14px 0;max-width:70ch}
.checkbox2 .cq{font-size:15.6px;font-weight:600;line-height:1.55;margin-bottom:10px}
.lecnav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px}
.lecitem{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:.14s;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.lecitem:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(37,99,201,.09)}
.lecitem .num{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:750;font-size:14px}
.lecitem.done .num{background:#dff3e8;color:var(--accent2)}
.lecitem h4{margin:0 0 4px;font-size:16px;font-weight:620;line-height:1.35}
.lecitem .lsub{font-size:12.8px;color:var(--ink3)}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);margin:10px 0 18px}
.prog .bar{flex:1}
@media(max-width:700px){.lec{padding:20px 20px}.lec h1{font-size:22px}.lec p.body{font-size:16px}}
/* ---- banco de reactivos ---- */
.filtros{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:14px}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.frow>label.fl{margin:0;min-width:76px}
.seg{display:inline-flex;background:#eef1f5;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:6px 13px;border-radius:7px;font-size:13px;cursor:pointer;
  font-family:inherit;color:var(--ink2);font-weight:560;transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--accent);font-weight:660;box-shadow:0 1px 3px rgba(0,0,0,.09)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.qtags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--ink2);letter-spacing:.02em}
.tag.tema{background:var(--accent-soft);color:var(--accent)}
.tag.num{background:#fef3c7;color:#92400e}
.tag.hist{background:#f3f4f6;color:var(--ink3)}
.opt.tach{opacity:.42;text-decoration:line-through;text-decoration-thickness:1.5px}
.optwrap{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.optwrap .opt{margin:0;flex:1}
.xbtn{width:40px;flex-shrink:0;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;
  font-size:15px;color:var(--ink3);font-family:inherit;transition:.12s}
.xbtn:hover{border-color:var(--bad);color:var(--bad)}
.xbtn.on{background:#fdecec;border-color:var(--bad);color:var(--bad)}
.disbox{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.disrow{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:14.2px;align-items:flex-start}
.disrow:last-child{border-bottom:0}
.disrow.ok{background:#eefaf3}
.disrow.tuya{background:#fdf0f0}
.disrow .dl{font-weight:750;flex-shrink:0;width:20px}
/* ---- hoy / racha ---- */
.streak{display:flex;gap:9px;margin:14px 0}
.sday{flex:1;text-align:center}
.sday .dot{width:100%;aspect-ratio:1;max-width:46px;margin:0 auto 5px;border-radius:50%;background:#e8ecf1;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink3)}
.sday.on .dot{background:var(--accent2);color:#fff}
.sday.hoy .dot{outline:3px solid var(--accent);outline-offset:2px}
.sday small{font-size:11px;color:var(--ink3);font-weight:650}
.bignum{font-size:44px;font-weight:750;line-height:1;letter-spacing:-.03em;color:var(--accent2)}
.hoycard{background:linear-gradient(135deg,#f0f5fd,#fff);border:1px solid #d5e2f7;border-radius:var(--radius);padding:24px 26px;margin-bottom:16px}
.debil{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.debil:last-child{border-bottom:0}
/* ---- conversor ---- */
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin:14px 0}
.conv input[type=number]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:17px;font-family:var(--mono);background:#fff;color:var(--ink)}
.conv select{width:100%}
.conv .eq{font-size:22px;color:var(--ink3);padding-bottom:10px}
label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);
  font-weight:700;margin-bottom:5px}
@media(max-width:700px){
  h1{font-size:16.5px}.card,.cbox{padding:16px 17px}.wrap{padding:0 13px 52px}
  body{font-size:15.4px}.conv{grid-template-columns:1fr}.conv .eq{display:none}
  nav button{padding:9px 12px;font-size:13px}
  .mhead h2{font-size:20px}
}
.verbadge{display:inline-block;margin-left:.5rem;padding:.1rem .45rem;border:1px solid rgba(255,255,255,.28);border-radius:999px;font-size:.72em;opacity:.75;letter-spacing:.02em;white-space:nowrap;cursor:help}

{b:'M4',q:'El número de coordinación en una estructura BCC es:',o:['4','6','8','12'],r:2,e:'BCC tiene NC = 8. FCC y HCP tienen 12; SC tiene 6.'},
{b:'M4',q:'Al aumentar la temperatura, la resistividad de un metal y la de un semiconductor intrínseco, respectivamente:',o:['Aumenta / aumenta','Aumenta / disminuye','Disminuye / aumenta','Disminuye / disminuye'],r:1,e:'Metal: más dispersión por fonones ⇒ ρ ↑. Semiconductor: más portadores promovidos térmicamente ⇒ ρ ↓.'},
{b:'M4',q:'El dopaje de silicio con fósforo (grupo 15) genera un semiconductor:',o:['Tipo p, con huecos como portadores mayoritarios','Tipo n, con electrones como portadores mayoritarios','Intrínseco','Aislante'],r:1,e:'El P aporta un electrón de valencia extra: actúa como donador ⇒ tipo n.'},
{b:'M4',q:'Un material absorbe luz a partir de 620 nm. Su band gap aproximado es:',o:['1.0 eV','2.0 eV','3.1 eV','6.2 eV'],r:1,e:'Eg ≈ 1240/620 = 2.0 eV. Memoriza el atajo E(eV) = 1240/λ(nm).'},
{b:'M4',q:'Los índices de Miller de un plano se obtienen:',o:['Directamente de las intersecciones con los ejes','Tomando los recíprocos de las intersecciones y reduciéndolos a enteros mínimos','Multiplicando las intersecciones por el parámetro de red','A partir del número de coordinación'],r:1,e:'Recíprocos de las intersecciones, reducidos a los enteros más pequeños posibles.'},
{b:'M4',q:'En la teoría de bandas, un material aislante se caracteriza por:',o:['Bandas de valencia y conducción solapadas','Band gap pequeño (< 1 eV)','Band gap grande (> 4 eV aprox.)','Ausencia de banda de valencia'],r:2,e:'Un gap grande impide la promoción térmica de electrones a la banda de conducción.'},
{b:'M4',q:'En un diagrama de orbitales moleculares, el orden de enlace se calcula como:',o:['(e⁻ enlazantes + e⁻ antienlazantes)/2','(e⁻ enlazantes − e⁻ antienlazantes)/2','e⁻ enlazantes − e⁻ antienlazantes','e⁻ totales/2'],r:1,e:'Orden de enlace = (enlazantes − antienlazantes)/2. Un orden de cero implica que la molécula no existe.'},
{b:'M4',q:'Un defecto de Schottky en un cristal iónico consiste en:',o:['Un átomo desplazado a una posición intersticial','Un par de vacancias catión-anión que preserva la electroneutralidad','Una dislocación de borde','Una frontera de grano de ángulo alto'],r:1,e:'Schottky = par de vacancias. Frenkel = ion desplazado a un intersticio.'},
{b:'M4',q:'El módulo de Young se obtiene de la curva esfuerzo-deformación como:',o:['El área bajo toda la curva','La pendiente de la región elástica lineal','El esfuerzo máximo alcanzado','La deformación en el punto de fractura'],r:1,e:'E = σ/ε en la zona elástica lineal (ley de Hooke). El área bajo la curva es la tenacidad.'},

/* --- M5 Fisicoquímica --- */
{b:'M5',q:'¿Cuál de las siguientes moléculas es no polar a pesar de tener enlaces polares?',o:['H₂O','NH₃','CCl₄','SO₂'],r:2,e:'CCl₄ es tetraédrica y simétrica: los dipolos de enlace se cancelan vectorialmente.'},
{b:'M5',q:'El orden correcto de fuerzas intermoleculares, de mayor a menor, es:',o:['London > dipolo-dipolo > puente de hidrógeno > ion-dipolo','Ion-dipolo > puente de hidrógeno > dipolo-dipolo > London','Puente de hidrógeno > ion-dipolo > London > dipolo-dipolo','Dipolo-dipolo > London > ion-dipolo > puente de hidrógeno'],r:1,e:'Ion-dipolo es la más fuerte de las intermoleculares; London (dispersión) la más débil.'},
{b:'M5',q:'Un gas real se desvía más del comportamiento ideal en condiciones de:',o:['Alta temperatura y baja presión','Baja temperatura y alta presión','Alta temperatura y alta presión','Baja temperatura y baja presión'],r:1,e:'A baja T y alta P las moléculas están cerca y lentas: importan las fuerzas intermoleculares y el volumen molecular.'},
{b:'M5',q:'El agua tiene una anomalía en su diagrama de fases que consiste en que:',o:['No tiene punto triple','La línea sólido-líquido tiene pendiente negativa','Su punto crítico está por debajo de la temperatura ambiente','Sublima a presión atmosférica'],r:1,e:'El hielo es menos denso que el agua líquida, lo que invierte la pendiente de la línea de fusión.'},
{b:'M5',q:'El descenso crioscópico de una disolución 0.10 m de CaCl₂ (Kf = 1.86 °C/m), con disociación completa, es:',o:['0.19 °C','0.37 °C','0.56 °C','1.86 °C'],r:2,e:'ΔTf = i·Kf·m = 3 × 1.86 × 0.10 = 0.558 °C. La opción 0.19 °C es la trampa: omite el factor i.'},
{b:'M5',q:'Para una reacción con ΔH > 0 y ΔS > 0, la reacción será espontánea:',o:['A cualquier temperatura','Nunca','Solo a temperaturas altas','Solo a temperaturas bajas'],r:2,e:'ΔG = ΔH − TΔS. Con ambos positivos solo una T alta logra que TΔS supere a ΔH.'},
{b:'M5',q:'En N₂(g) + 3H₂(g) ⇌ 2NH₃(g), con ΔH < 0, para aumentar el rendimiento de NH₃ conviene:',o:['Aumentar la temperatura y disminuir la presión','Disminuir la temperatura y aumentar la presión','Agregar un catalizador','Aumentar el volumen del reactor'],r:1,e:'Exotérmica ⇒ bajar T favorece productos. Δn negativo (4 → 2 mol) ⇒ subir P favorece productos. El catalizador no desplaza el equilibrio.'},
{b:'M5',q:'En la ecuación de Arrhenius, un aumento en la energía de activación manteniendo T constante produce:',o:['Un aumento en la constante de velocidad k','Una disminución en k','Ningún efecto sobre k','Un cambio en la constante de equilibrio K'],r:1,e:'k = A·e^(−Ea/RT): mayor Ea hace el exponente más negativo, así que k disminuye.'},
{b:'M5',q:'Un catalizador en una reacción química:',o:['Desplaza el equilibrio hacia los productos','Aumenta la constante de equilibrio K','Disminuye la energía de activación de ambos sentidos por igual','Cambia el ΔH de la reacción'],r:2,e:'Acelera la llegada al equilibrio sin desplazarlo; no altera ΔH ni K.'},
{b:'M5',q:'El orden de una reacción respecto a un reactivo:',o:['Siempre es igual a su coeficiente estequiométrico','Se determina experimentalmente','Siempre es un número entero positivo','Es igual a la molecularidad de la reacción global'],r:1,e:'Solo coincide con los coeficientes en etapas elementales. En general es experimental y puede ser fraccionario o negativo.'},
{b:'M5',q:'Según la isoterma de Langmuir, la adsorción supone:',o:['Multicapas de adsorbato','Monocapa, sitios equivalentes y sin interacción entre moléculas adsorbidas','Adsorción exclusivamente química e irreversible','Que el área superficial no influye'],r:1,e:'Langmuir asume monocapa con sitios idénticos e independientes. BET extiende el modelo a multicapas y es la que se usa para área superficial.'},
{b:'M5',q:'Una suspensión coloidal con potencial zeta de −45 mV, comparada con otra de −5 mV:',o:['Es menos estable, tiende a agregarse','Es más estable frente a la agregación','Tiene la misma estabilidad','Está en su punto isoeléctrico'],r:1,e:'Regla práctica: |ζ| > 30 mV implica repulsión electrostática suficiente para estabilidad coloidal.'},
{b:'M5',q:'Un ángulo de contacto de 150° sobre una superficie indica que es:',o:['Superhidrofílica','Hidrofílica','Hidrofóbica moderada','Superhidrofóbica'],r:3,e:'Por encima de ~150° se considera superhidrofóbica (efecto loto), base de los recubrimientos autolimpiables.'},

/* --- M6 Síntesis de materiales --- */
{b:'M6',q:'Al disminuir el tamaño de un punto cuántico de CdSe de 5 nm a 2 nm, se espera que:',o:['El band gap disminuya y la emisión se desplace al rojo','El band gap aumente y la emisión se desplace al azul','El band gap no cambie','Pierda toda emisión'],r:1,e:'Confinamiento cuántico: E ∝ 1/R². Menor tamaño ⇒ mayor Eg ⇒ desplazamiento al azul.'},
{b:'M6',q:'La relación superficie/volumen de una nanopartícula esférica es proporcional a:',o:['r','r²','1/r','r³'],r:2,e:'S/V = 4πr²/(4/3·πr³) = 3/r. Por eso la reactividad superficial se dispara en la nanoescala.'},
{b:'M6',q:'Según el modelo de LaMer, para obtener nanopartículas monodispersas conviene:',o:['Nucleación lenta y continua durante todo el proceso','Separar temporalmente un evento de nucleación rápida del crecimiento posterior','Mantener la supersaturación constante y alta','Aumentar la temperatura progresivamente durante horas'],r:1,e:'La separación temporal entre nucleación y crecimiento es lo que produce distribuciones estrechas de tamaño.'},
{b:'M6',q:'La maduración de Ostwald consiste en:',o:['La disolución de partículas pequeñas y el crecimiento de las grandes','La agregación irreversible de partículas por colisión','La sedimentación por gravedad','La formación de una capa de óxido superficial'],r:0,e:'Las partículas pequeñas tienen mayor solubilidad (Gibbs-Thomson) y se disuelven para alimentar a las grandes.'},
{b:'M6',q:'¿Cuál de los siguientes es un método top-down?',o:['Sol-gel','Reducción química con citrato','Litografía por haz de electrones','Deposición química de vapor (CVD)'],r:2,e:'La litografía parte de material masivo y lo estructura. Las otras tres construyen desde precursores moleculares.'},
{b:'M6',q:'La técnica que permite crecimiento capa atómica por capa atómica con control sub-nanométrico es:',o:['Sputtering','ALD (Atomic Layer Deposition)','Evaporación térmica','Ball milling'],r:1,e:'ALD usa reacciones superficiales autolimitadas: el espesor se controla por número de ciclos y la cobertura es conformal.'},
{b:'M6',q:'El grabado por plasma tipo RIE se prefiere sobre el grabado húmedo cuando se requiere:',o:['Mayor velocidad de remoción','Perfiles anisotrópicos con paredes verticales','Menor costo de equipo','Procesar muchas obleas simultáneamente en un baño'],r:1,e:'El grabado seco es direccional; el húmedo es isotrópico y socava el patrón bajo la máscara.'},
{b:'M6',q:'La banda de resonancia de plasmón de nanopartículas esféricas de oro en agua aparece cerca de:',o:['280 nm','400 nm','520 nm','780 nm'],r:2,e:'LSPR de AuNPs esféricas de ~10–20 nm: ~520 nm, de ahí el color rojo rubí de la suspensión. Al agregarse se desplaza al rojo.'},
{b:'M6',q:'Una estructura core-shell tipo CdSe/ZnS se emplea principalmente para:',o:['Reducir el costo del material','Pasivar la superficie, aumentar el rendimiento cuántico y reducir la toxicidad','Aumentar el tamaño hasta la microescala','Eliminar el confinamiento cuántico'],r:1,e:'El ZnS tiene mayor band gap: pasiva trampas superficiales, sube el rendimiento cuántico y aísla el Cd del medio.'},
{b:'M6',q:'En la síntesis de nanovarillas de oro, el crecimiento anisotrópico se logra principalmente por:',o:['Aumentar mucho la temperatura','El bloqueo selectivo de ciertas facetas cristalinas por surfactantes o ligandos','Usar un reductor más débil únicamente','Eliminar todo surfactante del medio'],r:1,e:'El surfactante (por ejemplo CTAB) se adsorbe preferentemente en unas facetas, dejando crecer otras: es control cinético de la forma.'},
{b:'M6',q:'Los materiales mesoporosos tipo MCM-41 y SBA-15 se caracterizan por:',o:['Poros menores a 2 nm','Poros entre 2 y 50 nm y área superficial muy alta','Ser completamente no porosos','Poros mayores a 100 nm'],r:1,e:'Mesoporo se define entre 2 y 50 nm. Se sintetizan con plantillas de surfactante y alcanzan cientos de m²/g.'},
{b:'M6',q:'La resolución de la fotolitografía convencional está limitada aproximadamente por:',o:['El espesor del sustrato','La longitud de onda de la luz y la apertura numérica (~λ/2NA)','La temperatura del horno','La conductividad del resiste'],r:1,e:'De ahí la migración a longitudes de onda menores (DUV, EUV) y a inmersión para subir NA.'},

/* --- M7 Caracterización --- */
{b:'M7',q:'Para determinar la fase cristalina y el tamaño de cristalito de un polvo nanoestructurado, la técnica de elección es:',o:['FTIR','Difracción de rayos X','DLS','TGA'],r:1,e:'DRX identifica fases por posiciones de pico y, vía Scherrer, estima el tamaño de cristalito por el ancho.'},
{b:'M7',q:'Pico a 2θ = 40° con FWHM = 0.5° (0.00873 rad), Cu Kα (λ = 0.15406 nm), K = 0.9. El tamaño de cristalito es:',o:['1.7 nm','17 nm','170 nm','1.7 µm'],r:1,e:'D = Kλ/(β·cosθ) = (0.9 × 0.15406)/(0.00873 × cos 20°) ≈ 0.1387/0.00820 ≈ 16.9 nm. Ojo: θ = 2θ/2 = 20°.'},
{b:'M7',q:'La diferencia fundamental entre SEM y TEM es que:',o:['SEM da información de superficie; TEM requiere muestras ultradelgadas y da estructura interna','TEM solo funciona con metales','SEM tiene mejor resolución que TEM','TEM no requiere vacío'],r:0,e:'SEM detecta electrones emitidos de la superficie; TEM detecta los transmitidos, exigiendo muestras menores a ~100 nm.'},
{b:'M7',q:'Un modo vibracional es activo en Raman si durante la vibración cambia:',o:['El momento dipolar','La polarizabilidad','El momento angular','La masa reducida'],r:1,e:'Raman requiere cambio de polarizabilidad; IR requiere cambio de momento dipolar. Son complementarias.'},
{b:'M7',q:'El diámetro medido por DLS es sistemáticamente mayor que el medido por TEM porque:',o:['DLS mide el diámetro hidrodinámico, incluyendo capa de solvatación y ligandos','TEM sobreestima el tamaño por el haz de electrones','DLS solo detecta agregados','TEM mide en unidades distintas'],r:0,e:'Además DLS pondera por intensidad (∝ d⁶), lo que sesga el resultado hacia las partículas grandes.'},
{b:'M7',q:'Para determinar la temperatura de transición vítrea (Tg) de un polímero se usa:',o:['TGA','DSC','DRX','AAS'],r:1,e:'La Tg es una transición de segundo orden: aparece como escalón en el flujo de calor, no como pérdida de masa.'},
{b:'M7',q:'La técnica que da resolución atómica de la estructura electrónica de una superficie conductora midiendo corriente túnel es:',o:['AFM','STM','SEM','FTIR'],r:1,e:'STM mide corriente túnel y exige superficie conductora. AFM mide fuerzas y funciona también en aislantes y en líquido.'},
{b:'M7',q:'El área superficial específica (m²/g) de un material poroso se determina mediante:',o:['BET por adsorción de N₂','UV-Vis','Potencial zeta','NMR'],r:0,e:'BET a partir de isotermas de adsorción de N₂ a 77 K.'},
{b:'M7',q:'El EDS acoplado a un SEM proporciona:',o:['Estructura cristalina','Composición elemental local','Distribución de tamaño hidrodinámico','Grupos funcionales orgánicos'],r:1,e:'EDS detecta rayos X característicos, dando composición elemental con resolución espacial.'},

/* --- M8 Nanodispositivos --- */
{b:'M8',q:'En un microcanal, si el radio se reduce a la mitad manteniendo ΔP constante, el caudal según Hagen-Poiseuille:',o:['Se reduce a la mitad','Se reduce a la cuarta parte','Se reduce 8 veces','Se reduce 16 veces'],r:3,e:'Q ∝ r⁴ ⇒ (1/2)⁴ = 1/16.'},
{b:'M8',q:'En microfluídica, un número de Reynolds Re ≪ 1 implica que:',o:['El flujo es turbulento y la mezcla es rápida','El flujo es laminar y la mezcla ocurre principalmente por difusión','La viscosidad es despreciable','Se requiere un agitador mecánico'],r:1,e:'Con Re bajo dominan las fuerzas viscosas: flujo laminar y mezcla difusiva, lo que obliga a diseñar mezcladores serpentina o de gotas.'},
{b:'M8',q:'El perfil de velocidad del flujo electroosmótico en un microcanal es:',o:['Parabólico','Tipo tapón, plano en el centro del canal','Triangular','Caótico'],r:1,e:'El arrastre ocurre en la doble capa junto a la pared, produciendo perfil plano. El flujo por presión sí es parabólico.'},
{b:'M8',q:'Un cristal fotónico presenta un band gap fotónico porque:',o:['Absorbe todos los fotones incidentes','Su estructura periódica de índice de refracción prohíbe la propagación de ciertas longitudes de onda','Es un metal con electrones libres','Tiene un band gap electrónico muy grande'],r:1,e:'Es el análogo óptico del band gap electrónico: la periodicidad dieléctrica genera bandas prohibidas para la luz.'},
{b:'M8',q:'El efecto SERS amplifica la señal Raman principalmente por:',o:['Aumento de la temperatura de la muestra','El campo electromagnético intensificado cerca de nanoestructuras metálicas plasmónicas','Mayor concentración del analito','Mayor tiempo de integración del detector'],r:1,e:'Los «hot spots» plasmónicos en Au o Ag amplifican el campo local, elevando la señal varios órdenes de magnitud.'},
{b:'M8',q:'En un sensor basado en un cantilever resonante, la adsorción de masa sobre su superficie provoca que la frecuencia de resonancia:',o:['Aumente','Disminuya','No cambie','Se vuelva cero'],r:1,e:'f₀ = (1/2π)√(k/m): si m aumenta y k se mantiene, f₀ baja. Es el principio de los sensores gravimétricos.'},
{b:'M8',q:'Al reducir el tamaño de un dispositivo, las fuerzas superficiales dominan sobre las volumétricas porque:',o:['La superficie escala como L³ y el volumen como L²','La superficie escala como L² y el volumen como L³, de modo que S/V crece al reducir L','Ambas escalan igual','La gravedad aumenta a escalas pequeñas'],r:1,e:'Por eso en MEMS aparecen stiction y adhesión por van der Waals, mientras el peso se vuelve despreciable.'},
{b:'M8',q:'La reflexión total interna en una guía de onda ocurre cuando:',o:['El índice del núcleo es menor que el del revestimiento','El índice del núcleo es mayor que el del revestimiento y el ángulo supera el ángulo crítico','La luz incide perpendicular a la interfaz','El medio es fuertemente absorbente'],r:1,e:'Requiere n_núcleo > n_revestimiento y θ > θ_c = arcsen(n₂/n₁).'},

/* --- M9 Escalamiento --- */
{b:'M9',q:'Al escalar un proceso de laboratorio a planta piloto, un principio clave es que:',o:['Se pueden mantener constantes simultáneamente P/V, velocidad de punta y tiempo de mezclado','Solo se puede conservar uno o algunos criterios de similitud, y hay que elegir el crítico','La geometría del reactor es irrelevante','El coeficiente de transferencia de masa no cambia con la escala'],r:1,e:'Los criterios son mutuamente incompatibles: se identifica el paso limitante y se conserva ese.'},
{b:'M9',q:'Para una reacción de orden positivo, a igual volumen de reactor, la conversión es mayor en:',o:['Un CSTR','Un PFR','Son idénticos','Depende únicamente de la temperatura'],r:1,e:'El CSTR opera en todo su volumen a la concentración baja de salida; el PFR mantiene un perfil de concentración más alto, así que convierte más.'},
{b:'M9',q:'En bioprocesos aerobios, el criterio de escalamiento más utilizado es mantener constante:',o:['La velocidad de punta del agitador','El coeficiente volumétrico de transferencia de oxígeno k_La','El número de Reynolds','El pH del medio'],r:1,e:'El oxígeno es típicamente el sustrato limitante, así que se conserva su velocidad de transferencia.'},
{b:'M9',q:'El nivel TRL (Technology Readiness Level) mide:',o:['El costo total del proyecto','La madurez tecnológica, desde el principio básico observado hasta el sistema probado en operación','La pureza del producto final','El impacto ambiental del proceso'],r:1,e:'Va de TRL 1 (principios básicos) a TRL 9 (sistema real probado en entorno operativo).'},
{b:'M9',q:'En un balance de materia en estado estacionario y sin reacción química, se cumple que:',o:['Entrada = salida','Entrada − salida = acumulación positiva','Generación = consumo','No aplica el principio de conservación'],r:0,e:'Estado estacionario implica acumulación cero; sin reacción no hay generación ni consumo.'},
{b:'M9',q:'Un diseño experimental factorial completo 2³ requiere como mínimo:',o:['3 corridas','6 corridas','8 corridas','9 corridas'],r:2,e:'2³ = 8 combinaciones (3 factores en 2 niveles cada uno), sin contar réplicas ni puntos centrales.'},
{b:'M9',q:'Un valor p = 0.03 significa que:',o:['La hipótesis alterna es verdadera con 97 % de probabilidad','Si la hipótesis nula fuera cierta, habría 3 % de probabilidad de observar datos al menos tan extremos','El tamaño del efecto es grande','El experimento se replicó tres veces'],r:1,e:'El valor p es la probabilidad de los datos DADA la hipótesis nula, no la probabilidad de la hipótesis. Tampoco mide magnitud del efecto.'},

/* --- M10 Formulaciones --- */
{b:'M10',q:'El efecto EPR aprovechado en nanomedicina es un mecanismo de:',o:['Direccionamiento activo mediante anticuerpos','Direccionamiento pasivo por acumulación en tejido tumoral','Liberación controlada por pH','Eliminación renal acelerada'],r:1,e:'Vasculatura tumoral fenestrada más drenaje linfático deficiente producen acumulación pasiva de nanopartículas.'},
{b:'M10',q:'Entre dos fármacos, A con IC50 = 5 nM y B con IC50 = 500 nM:',o:['B es 100 veces más potente','A es 100 veces más potente','Tienen la misma potencia','No se pueden comparar'],r:1,e:'IC50 menor significa que se requiere menos concentración para el mismo efecto: A es más potente por un factor de 100.'},
{b:'M10',q:'Un inconveniente de usar la masa como métrica de dosis en nanotoxicología es que:',o:['Es difícil de medir con precisión','No captura que el área superficial y el número de partículas correlacionan mejor con el efecto biológico','Solo aplica a materiales metálicos','Depende de la temperatura ambiente'],r:1,e:'A igual masa, las partículas más pequeñas tienen muchísima más área y número, y por eso mayor respuesta biológica.'},
{b:'M10',q:'Un surfactante con HLB alto (12–16) favorece la formación de emulsiones:',o:['Agua en aceite (W/O)','Aceite en agua (O/W)','Ninguna, solo espumas','Únicamente microemulsiones inversas'],r:1,e:'HLB alto significa carácter hidrofílico dominante: el surfactante se disuelve mejor en agua, que queda como fase continua.'},
{b:'M10',q:'La estabilización estérica de una dispersión, comparada con la electrostática:',o:['Es más sensible a la fuerza iónica del medio','Es menos sensible a la fuerza iónica y funciona también en medios no acuosos','No requiere polímeros ni surfactantes','Solo funciona a pH neutro'],r:1,e:'La barrera estérica es física, no depende de la doble capa eléctrica, así que tolera sales y disolventes orgánicos.'},
{b:'M10',q:'En una emulsión, el mecanismo por el cual las gotas pequeñas se disuelven y alimentan a las grandes se llama:',o:['Coalescencia','Cremado','Maduración de Ostwald','Floculación'],r:2,e:'En Ostwald el material migra por difusión a través de la fase continua. En coalescencia las gotas se fusionan al romperse la película interfacial.'},
{b:'M10',q:'Un punto crítico de control en un proceso de formulación es:',o:['Cualquier etapa del proceso','Una etapa donde puede aplicarse control para prevenir, eliminar o reducir un peligro a un nivel aceptable','La etapa de mayor costo','Exclusivamente el envasado final'],r:1,e:'Es la definición del enfoque HACCP: se identifican peligros y se controlan en los puntos donde realmente se pueden mitigar.'},
{b:'M10',q:'La regla de los 5 de Lipinski se utiliza para predecir:',o:['La toxicidad aguda de un compuesto','La probabilidad de buena biodisponibilidad oral','La potencia farmacológica','La vida media plasmática'],r:1,e:'MW < 500, logP < 5, donadores de H < 5, aceptores de H < 10. Es un filtro de «drug-likeness» oral, no de eficacia.'},

{i:'emulsion',t:'Emulsiones y HLB',n:5,m:['M10'],pre:['coloide','polaridad'],

{i:'adme',t:'Farmacocinética ADME',n:5,m:['M10'],pre:['ligando-receptor','cinetica'],

{i:'nanotox',t:'Nanotoxicología y corona proteica',n:5,m:['M10'],pre:['sv','biomoleculas','delivery'],

{i:'complejos',t:'Números complejos y representación de ondas',n:0,m:['M0','M8'],pre:[],pdf:1,
 d:'Notación e^(iθ) = cosθ + i·senθ para describir amplitud y fase de una onda en un solo objeto matemático.',
 p:'Es la herramienta con la que se trabaja toda la óptica de tu curso de nanosistemas fotónicos: permite manejar índice de refracción complejo, absorción y desfase sin arrastrar senos y cosenos.',
 b:'Álgebra de números complejos y funciones trigonométricas.',
 o:'La parte imaginaria del índice de refracción NO es un artificio: representa la absorción del medio.'},
{i:'oscilador',t:'Oscilador armónico: clásico, amortiguado y cuántico',n:1,m:['M4','M8'],pre:['derivada','edo','complejos'],pdf:1,
 d:'Sistema con fuerza restauradora proporcional al desplazamiento. Con amortiguamiento y forzamiento presenta resonancia; en versión cuántica sus niveles son E_n = ħω(n + ½).',
 p:'Es el modelo más reutilizado de toda la carrera: describe vibraciones moleculares (IR y Raman), la respuesta óptica de un material (modelo de Lorentz), y los resonadores MEMS.',
 b:'Ecuaciones diferenciales de segundo orden y números complejos.',
 o:'El oscilador cuántico tiene energía de punto cero: en n = 0 la energía es ħω/2, no cero.'},
{i:'formalismo-qm',t:'Formalismo cuántico: función de onda, operadores y matrices',n:1,m:['M4'],pre:['cuantico','complejos'],pdf:1,
 d:'La función de onda contiene toda la información del sistema; los observables se representan por operadores y sus valores medibles son los valores propios de la matriz asociada.',
 p:'Es la maquinaria de tu curso de Modelación de sistemas moleculares y el paso previo a cualquier cálculo computacional de estructura electrónica.',
 b:'Álgebra lineal (matrices, valores y vectores propios) y números complejos.',
 o:'El cuadrado del módulo de la función de onda es una densidad de probabilidad, no la partícula misma.'},
{i:'quimica-computacional',t:'Química computacional: Hartree-Fock y DFT',n:4,m:['M4'],pre:['tom','formalismo-qm'],pdf:1,
 d:'Métodos para resolver aproximadamente la ecuación de Schrödinger molecular. Hartree-Fock trata cada electrón en el campo promedio de los demás; DFT reformula el problema en términos de la densidad electrónica.',
 p:'Permite predecir geometría, energías, orbitales frontera y espectros antes de entrar al laboratorio. Es el contenido del Módulo 3 de tu curso de Modelación de sistemas moleculares.',
 b:'Orbitales moleculares y formalismo cuántico.',
 o:'Hartree-Fock ignora la correlación electrónica; DFT la incluye de forma aproximada mediante el funcional de intercambio-correlación, cuya elección cambia los resultados.'},
{i:'funcion-dielectrica',t:'Función dieléctrica y modelo de Lorentz',n:3,m:['M8'],pre:['onda-em','oscilador'],pdf:1,
 d:'La función dieléctrica ε(ω) describe cómo responde un material a un campo electromagnético en función de la frecuencia. El modelo de Lorentz la obtiene tratando a los electrones ligados como osciladores armónicos amortiguados forzados por la luz.',
 p:'Es el puente entre la estructura microscópica de un material y sus propiedades ópticas macroscópicas: de ε(ω) salen el índice de refracción, la absorción y el color.',
 b:'Oscilador armónico amortiguado, números complejos y ondas electromagnéticas.',
 o:'ε y el índice de refracción son complejos: n = √ε, con la parte imaginaria describiendo la absorción.'},
{i:'drude',t:'Modelo de Drude y frecuencia de plasma',n:3,m:['M8'],pre:['funcion-dielectrica','bandas'],pdf:1,

 p:'Explica por qué los metales reflejan por debajo de ω_p y se vuelven transparentes por encima, y es el fundamento teórico de la resonancia de plasmón de tus nanopartículas de oro.',
 b:'Función dieléctrica, teoría de bandas y densidad de portadores.',
 o:'Drude describe bien los metales alcalinos, pero en oro y plata hay que sumar transiciones interbanda, que son las que dan su color característico.'},
{i:'secciones',t:'Secciones transversales de esparcimiento y absorción',n:3,m:['M8','M7'],pre:['onda-em','sv'],pdf:1,

 p:'Es la magnitud que realmente mide un espectro UV-Vis de una suspensión de nanopartículas, y la que decide si una nanopartícula sirve como agente de contraste (dispersa) o como fototérmico (absorbe).',
 b:'Ondas electromagnéticas y geometría de la partícula.',
 o:'La sección transversal puede ser mucho MAYOR que el área geométrica de la partícula: en resonancia plasmónica llega a superarla varias veces.'},
{i:'fresnel',t:'Ecuaciones de Fresnel',n:5,m:['M8'],pre:['optica-geom','complejos'],pdf:1,

 b:'Ley de Snell, polarización y números complejos.',
 o:'La reflectancia depende de la polarización: para la componente p existe un ángulo (Brewster) donde la reflexión se anula.'},
{i:'evanescente',t:'Onda evanescente',n:5,m:['M8'],pre:['fresnel'],pdf:1,

 b:'Reflexión total interna y ecuaciones de Fresnel.',
 o:'La profundidad de penetración depende del ángulo y de los índices; típicamente 100–200 nm, comparable al tamaño de una nanopartícula.'},
{i:'xps',t:'Espectroscopía de fotoelectrones (XPS)',n:4,m:['M7'],pre:['foton','config'],pdf:1,

 b:'Efecto fotoeléctrico, energía del fotón y configuración electrónica.',
 o:'Es extremadamente superficial (2–10 nm) y exige ultra alto vacío. No confundir con EDS, que es de volumen y no da estado químico.'},
{i:'stem-eels',t:'STEM, EELS y ESEM',n:4,m:['M7'],pre:['microscopia-e'],pdf:1,

 o:'EELS es sensible a elementos ligeros (C, N, O), justo donde EDS es débil. Son complementarias.'},
{i:'fib',t:'Haz de iones focalizado (FIB)',n:4,m:['M7','M6'],pre:['microscopia-e'],pdf:1,

 b:'Microscopía electrónica e interacción ion-materia.',
 o:'El haz implanta galio y daña la zona cortada, lo que puede alterar la muestra que después analizarás.'},
{i:'superres',t:'Microscopía óptica de super-resolución',n:4,m:['M7'],pre:['fluorescencia'],pdf:1,

 o:'No aumentan la resolución óptica del sistema: la ganan separando temporalmente las emisiones y reconstruyendo por cálculo.'},
{i:'fosforescencia',t:'Fosforescencia y quimioluminiscencia',n:4,m:['M7'],pre:['fluorescencia'],pdf:1,

 p:'Permiten medir con fondo prácticamente nulo, lo que da límites de detección excelentes en inmunoensayos y sensores.',

{i:'litografia-avanzada',t:'Litografía de rayos X, haz de electrones e iones',n:4,m:['M6'],pre:['litografia'],pdf:1,

 o:'El PDMS absorbe moléculas hidrofóbicas pequeñas y es permeable a gases, lo que puede falsear un ensayo biológico.'},
{i:'liga',t:'Proceso LIGA',n:4,m:['M6'],pre:['litografia-avanzada','electroquimica'],pdf:1,

{i:'dlw',t:'Escritura láser directa y polimerización de dos fotones',n:4,m:['M6'],pre:['litografia','polimeros'],pdf:1,

{i:'biosensor-enzimatico',t:'Biosensor enzimático y generaciones',n:5,m:['M8'],pre:['electrodo-modificado','enzimas'],pdf:1,
